      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
