# Proof-only override for ci/auth_corpus_external.sh (CHAOS-10160); compose.yml is not changed. A throwaway
# project name does not isolate a host-global container_name or a fixed host port, so every service of the go-api
# stack that has one is released here; each store and the two listeners the corpus needs are published on an
# ephemeral loopback port that the script reads back from compose.
# The default network of the project, with a pinned subnet: a request from the runner reaches go-api through this
# network's gateway, which go-api must trust (TRUSTED_PROXIES below) to read the client IP from X-Forwarded-For, as
# the frozen golden's audit rows expect. The subnet is outside compose.yml's planes network (10.199.81.0/28).
networks:
  default:
    ipam:
      config:
        - subnet: 10.199.90.0/24
          gateway: 10.199.90.1

services:
  postgres:
    container_name: !reset null
    ports: !override ["127.0.0.1::5432"]
  pgbouncer:
    container_name: !reset null
    ports: !reset []
  pgbouncer-river-queue:
    container_name: !reset null
  pgbouncer-river-coordinator:
    container_name: !reset null
  clickhouse:
    container_name: !reset null
    ports: !override ["127.0.0.1::9000"]
  valkey:
    container_name: !reset null
    ports: !override ["127.0.0.1::6379"]
  migrate:
    container_name: !reset null
  go-api:
    # The api listener (the corpus's base URL) and the operator listener (/metrics, leg acp). The host ports are
    # chosen once by ci/auth_corpus_external.sh and kept in the project state: ci/auth_corpus_set_env.sh recreates
    # this container, and an ephemeral port would change with it.
    ports: !override ["127.0.0.1:${AUTH_CORPUS_API_PORT}:8000", "127.0.0.1:${AUTH_CORPUS_OPERATOR_PORT}:8080"]
    environment:
      # The corpus's mail sink is the smtpsink service of this project (below), reached by its service name on the
      # project network; the invite and verification mail of go-api goes there. The links it mails use this base.
      - SMTP_HOST=smtpsink
      - SMTP_PORT=2525
      - APP_BASE_URL=https://app.example.test/
      - TRUSTED_PROXIES=10.199.90.1
      # Pass-throughs: set only when ci/auth_corpus_set_env.sh put them in the project state, so an unset
      # variable stays unset (an empty value is not the same as unset for these readers).
      - AUTH_AUTO_CREATE_ORG_ON_REGISTER
      - AUTH_REGISTER_LIMIT
      # The social-login row's provider: go-api reaches api.github.com at the corpus provider stub (below) and trusts
      # the stub's run-time CA. The client id and secret are the corpus's throwaway values.
      - SOCIAL_GITHUB_CLIENT_ID=gh-client
      - SOCIAL_GITHUB_CLIENT_SECRET=gh-secret
      - SSL_CERT_FILE=/run/corpus-stub/ca.pem
    depends_on:
      providerstub:
        condition: service_started
      smtpsink:
        condition: service_started
    extra_hosts:
      - "api.github.com:10.199.90.10"
      - "github.com:10.199.90.10"
    volumes:
      - ${AUTH_CORPUS_STUB_DIR}:/run/corpus-stub:ro
  auth-service:
    ports: !override ["127.0.0.1::8096"]
  # The corpus provider stub (docker/providerstub.Dockerfile; corpus only, never a release image): answers the provider
  # requests of the social-login row from ci/auth_corpus_stub and records every request on its recorder port. Its
  # certificate and CA are made at run time by ci/auth_corpus_external.sh.
  providerstub:
    image: authcorpus-providerstub:local
    build:
      context: .
      dockerfile: docker/providerstub.Dockerfile
      target: providerstub
    command: ["serve", "-fixtures", "/fixtures", "-cert", "/run/corpus-stub/server.pem", "-key", "/run/corpus-stub/server.key", "-listen", ":443", "-admin", ":9090"]
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    volumes:
      - ./ci/auth_corpus_stub:/fixtures:ro
      - ${AUTH_CORPUS_STUB_DIR}:/run/corpus-stub:ro
    ports: ["127.0.0.1::9090"]
    networks:
      default:
        ipv4_address: 10.199.90.10
  # The corpus mail sink (docker/smtpsink.Dockerfile; corpus only, never a release image): records every message the
  # planes send on :2525, byte for byte, and serves the capture to the test on :9090, published on loopback only.
  smtpsink:
    image: authcorpus-smtpsink:local
    build:
      context: .
      dockerfile: docker/smtpsink.Dockerfile
      target: smtpsink
    command: ["-listen", ":2525", "-admin", ":9090"]
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1::9090"]
