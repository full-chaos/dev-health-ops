# -- Global settings
global:
  # -- Image pull secrets for private registries
  imagePullSecrets: []
  # -- Override the namespace
  namespaceOverride: ""

# -- Image configuration for the backend (API, Go workers)
image:
  # -- Non-local profiles (prod/kiac) pin `repository@sha256:<digest>` explicitly; this bare-tag default is for local/dev use only.
  repository: ghcr.io/full-chaos/dev-hops-api
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

# -- Image configuration for the frontend (web)
webImage:
  # -- Non-local profiles (prod/kiac) pin `repository@sha256:<digest>` explicitly; this bare-tag default is for local/dev use only.
  repository: ghcr.io/full-chaos/dev-health-web
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

# -- Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# =============================================================================
# API (FastAPI backend)
# =============================================================================
api:
  enabled: true
  replicas: 2
  port: 8000
  # -- The api Service's own type/nodePort, expressible in values instead of
  #    a hand kubectl-patch. CHAOS-4984: a local kind/kiac profile that needs
  #    NodePort access (no ingress controller, no LoadBalancer support) had
  #    no values-driven way to set it -- the Service's `type: ClusterIP` was
  #    hardcoded in api-service.yaml, so the profile hand-patched the
  #    rendered Service to NodePort 30530 out of band. That patch is
  #    invisible to Helm's own state, so the NEXT `helm upgrade` re-asserts
  #    ClusterIP via Server-Side Apply and the two field managers conflict
  #    on `spec.type`/`spec.ports[].nodePort`, either overwriting the patch
  #    silently or failing outright depending on how the patch was applied.
  #    `nodePort` is only meaningful when `type: NodePort` (or
  #    `LoadBalancer`) and is otherwise ignored by the API server; leave it
  #    unset (empty string, below) to let Kubernetes allocate one.
  service:
    type: ClusterIP
    nodePort: ""
  args:
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
  resources:
    requests:
      # Measured steady state is 260-286Mi, i.e. ABOVE the 256Mi this requested
      # before. Memory utilization is computed against the REQUEST, so the old
      # value put a healthy pod structurally over 100% and gave the memory HPA
      # metric below a permanently-saturated reading with no headroom to report.
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    # -- Memory is not a scaling signal for this workload: a Python process's
    #    RSS is dominated by the interpreter and long-lived caches, so it
    #    neither falls when load drops nor rises proportionally with it, and a
    #    memory target only ever ratchets replicas up and holds them there.
    #    Explicitly `null`, not removed: this is the CHART's own default, and a
    #    deleted key would leave the previous default of 80 applying to every
    #    installation that does not set it. api-hpa.yaml's `if` guard then omits
    #    the memory metric entirely and a default install gets a CPU-only HPA.
    targetMemoryUtilizationPercentage: null
  livenessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # -- Extra environment variables (list of name/value pairs)
  extraEnv: []
  # -- Extra envFrom sources (list of {configMapRef: {name: ...}} or
  #    {secretRef: {name: ...}}), rendered BEFORE the chart's own configMap
  #    and Secret in api-deployment.yaml's envFrom list. Kubernetes resolves
  #    a key present in more than one envFrom source in favour of the LAST
  #    source that sets it, so an entry here loses any key the chart's own
  #    config/secret also sets -- put values that must win here, and only
  #    values this chart is meant to override in config/secrets.
  extraEnvFrom: []

# =============================================================================
# Metrics API (CHAOS-4351, historical -- its routing rationale is retired, CHAOS-6279)
# =============================================================================
# A second copy of `api` -- same image, same args, same env (configMap/
# secret) -- created to serve ONLY as the Go daily-runtime's metrics
# compatibility bridge target. CHAOS-6279 deletes the --operational-
# bridge-url flag that used to point the `heavy` goWorkers group at this
# Service's DNS name -- that flag no longer exists on any Go binary
# (CHAOS-5320 already deleted the Python HTTP bridge it pointed at, and
# CHAOS-6240 deleted the routes/subprocess mechanism the original incident
# history above (CHAOS-4264/CHAOS-4317/CHAOS-4350) was bounding). No
# worker group's command line points at this Service any more, on any
# renderer -- enabling it today stands up a Deployment nothing calls.
# `enabled: false` by default; whether to retire this Deployment entirely
# is a separate, not-yet-decided follow-up, not this comment's call.
metricsApi:
  enabled: false
  replicas: 1
  port: 8000
  args:
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
  # Same workload, same bound as `api.resources` above, EXCEPT the memory
  # request: api's was raised to 512Mi because its HPA reads memory
  # utilization against the request and a 256Mi request made a healthy pod
  # read as permanently over 100%. This workload has no HorizontalPodAutoscaler
  # at all, so the request is a scheduling floor and nothing else, and 256Mi
  # remains the honest one for a bridge-only pod.
  # Kubernetes has no per-container pids limit (same CHAOS-4317 gap noted
  # on api-deployment.yaml -- the only lever is cluster-wide kubelet
  # `--pod-max-pids`), so there is no `pids` field to mirror here.
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  livenessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # -- Extra environment variables (list of name/value pairs)
  extraEnv: []

# =============================================================================
# Go HTTP api (`dho api`, the dho operator binary)
# =============================================================================
# The Go api that takes over the Python api's REST routes one area at a time.
# It mounts no business route yet and nothing routes to it: the ingress path
# table that sends a ported path here is a deploy-repo change made per ported
# area. Off by default.
goApi:
  enabled: false
  replicas: 1
  # -- The api listener (requests). The Service targets this port.
  port: 8000
  # -- The operator listener: /healthz, /readyz and /metrics. Probes use it.
  operatorPort: 8080
  image:
    # -- The dho image (docker/go-worker.Dockerfile target `dho`). Non-local
    #    profiles pin `repository@sha256:<digest>` explicitly; this bare-tag
    #    default is for local/dev use only.
    repository: ghcr.io/full-chaos/dev-health-go-dho
    # -- Empty defaults to Chart.appVersion. A `repo@sha256:...` digest is
    #    accepted in `repository` and used verbatim.
    tag: ""
    pullPolicy: IfNotPresent
  # -- Comma-separated CORS allow-list, same format and meaning as the Python
  #    api's CORS_ALLOWED_ORIGINS. Empty keeps the binary's default
  #    (http://localhost:3000, the Python api's own default).
  corsAllowedOrigins: ""
  # -- Extra flags appended after the rendered ones (for example
  #    --log-level=debug). Credentials never go here: an argument is visible
  #    to anyone who can read the Pod spec.
  extraArgs: []
  # -- Probe timing. The probe targets (/healthz, /readyz on the operator
  #    port) are fixed in the template.
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  # -- Optional envFrom sources. Empty by default: the container inherits
  #    nothing from the platform Secret/ConfigMap unless listed here.
  envFrom: []
  # -- Extra environment variables (list of name/value pairs), for example
  #    OTEL_ENABLED / OTEL_EXPORTER_OTLP_ENDPOINT.
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# =============================================================================
# Query API (Go query plane, CHAOS-5616)
# =============================================================================
# The Go half of the split query plane. The Python edge's dispatcher forwards
# an operation here when the routing registry says the Go plane serves it; off
# by default, matching metricsApi, because an edge with no endpoint
# simply keeps every operation on the Python plane.
#
# Enabling it requires three things this chart references but does not create:
# secrets.data.GO_API_REGISTRY_POSTGRES_URI, the shared Secret's
# CLICKHOUSE_NATIVE_URI key (derived automatically with the bundled ClickHouse;
# supply it yourself with an external one or with secrets.create=false), and the
# envelope JWKS Secret named under envelope below. A missing key holds the pod
# in CreateContainerConfigError rather than failing the render -- deliberately:
# with secrets.create=false the chart cannot see the values to validate, and a
# render-time guard would block exactly the operators managing them correctly.
queryApi:
  enabled: false
  replicas: 1
  # -- RollingUpdate parameters of the Deployment (CHAOS-6647). Empty keeps the
  #    chart's guarantee {maxUnavailable: 0, maxSurge: 1} (never below serving
  #    capacity, one surge pod). On a node without CPU headroom for a surge pod
  #    set {maxUnavailable: 1, maxSurge: 0} (with replicas >= 2 one pod rolls at
  #    a time and one stays ready).
  rollingUpdate: {}
  port: 8090
  image:
    # -- The dho image (docker/go-worker.Dockerfile target `dho`); the
    #    Deployment runs `dho query-api`. Non-local profiles (prod/kiac) pin
    #    `repository@sha256:<digest>` explicitly; this bare-tag default is for
    #    local/dev use only. The retired dev-health-query-api image is refused.
    repository: ghcr.io/full-chaos/dev-health-go-dho
    # -- Empty defaults to Chart.appVersion. A `repo@sha256:...` digest (with or
    #    without a readable tag in front) is accepted in `repository` and used
    #    verbatim, the same rule image/webImage follow.
    tag: ""
    pullPolicy: IfNotPresent
  # -- Stated, not measured: derived from the worst-case request the route
  #    result-row ceiling allows, matching the bound the compose definition
  #    states for the same service rather than re-deriving a different one.
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1"
  # -- /readyz answers 200 for BOTH "ready" and "ready: /query not configured",
  #    so a status-code probe proves the PROCESS is up, never that the env is
  #    wired correctly. Assert the /readyz BODY out of band; do not try to make
  #    these probes carry that check.
  livenessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 2
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  envelope:
    # -- Name of an EXISTING Secret holding the envelope JWKS public half. This
    #    chart never creates it: the keypair is minted out of band and only the
    #    public half belongs in the cluster. Empty derives
    #    `<fullname>-query-api-jwks`, the name an existing deployment uses.
    jwksSecretName: ""
    # -- Mount path inside the container. Its basename is also the Secret KEY
    #    the JWKS is read from, so the two cannot drift apart.
    jwksPath: /secrets/envelope-jwks.json
    # -- Issuer/audience of the principal envelope the Python edge signs and
    #    query-api verifies. These MUST match the edge's own values; the
    #    defaults here are the edge's own Python-side defaults
    #    (principal_envelope.py), expressed as values rather than hardcoded in
    #    the template so a future change on either side is a visible override
    #    rather than a silent disagreement.
    issuer: "dev-health-ops-edge"
    audience: "query-api"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # -- Extra environment variables (list of name/value pairs). GO_API_SCHEMA_-
  #    DIGEST does not belong here: query-api computes its schema digest from
  #    its own embedded SDL and an operator-supplied value can only disagree
  #    with the binary.
  extraEnv: []
  # -- Optional envFrom sources (list of {configMapRef: {name: ...}} /
  #    {secretRef: {name: ...}} entries), same shape as api.extraEnvFrom /
  #    goWorkers.extraEnvFrom. Empty by default: unlike api/metricsApi,
  #    this container inherits NOTHING from the platform Secret/
  #    ConfigMap unless listed here -- set this to the platform Secret (e.g.
  #    [{secretRef: {name: dev-health-ops}}]) to pull in LLM_PROVIDER/
  #    OPENAI_API_KEY/LLM_MODEL/SETTINGS_ENCRYPTION_KEY instead of listing
  #    each one under extraEnv. Kubernetes gives `env`/`extraEnv` precedence
  #    over `envFrom` on a name collision, so an extraEnv entry always wins
  #    over the same key arriving through envFrom.
  envFrom: []

# =============================================================================
# Go/River workers (CHAOS-3052, Celery removed under CHAOS-4195)
# =============================================================================
# Go/River is the only worker topology this chart renders; the Celery
# worker/beat pools and values keys it replaced (`worker`, `workerIngest`,
# `workerExternalIngest`, `workerHeavy`, `beat`) were deleted in CHAOS-4195 --
# production stopped running them on 2026-08-19 (CHAOS-4026). CHAOS-5541:
# every group below now defaults to replicas: 1, matching deployment.json's
# go_default posture (see deploy/go-workers/README.md); pgbouncer is required
# (see values.schema.json) because every group dials it for domain/queue/
# coordinator connections.
#
# KNOWN GAP: this chart provisions no PostgreSQL roles. Before scaling ANY
# group, create the three roles named by RIVER_DOMAIN_DATABASE_ROLE /
# RIVER_QUEUE_DATABASE_ROLE / RIVER_COORDINATOR_DATABASE_ROLE (config,
# default devhealth_domain/devhealth_queue/devhealth_coordinator) with
# passwords matching goWorkers.pgbouncer.secret.data below -- run
# scripts/worker/provision_river_roles.sql against your PostgreSQL server
# (the compose topology automates this step as go-river-provision; there is
# no Helm/Kubernetes equivalent yet). RuntimeConfig.Validate
# (internal/storage/postgres/runtime.go) rejects a DSN whose login doesn't
# equal the configured role, so a worker fails readiness on first scale-up
# without this -- including with the bundled quickstart PostgreSQL, which
# creates only its own postgresql.credentials.user login.
goWorkers:
  enabled: true
  # -- Default RollingUpdate parameters of every group's Deployment (CHAOS-6647);
  #    empty keeps {maxUnavailable: 0, maxSurge: 1}. A group's own
  #    `rollingUpdate` wins. {maxUnavailable: 1, maxSurge: 0} on a single-replica
  #    group means no surge pod (the consumer restarts in place).
  rollingUpdate: {}
  # -- River/queue-consumer worker groups the API's /health/workers checks
  #    for live worker_instances heartbeats once goWorkers.enabled is true
  #    (CHAOS-3942). Reconciler/scheduler/stream-* are deliberately excluded:
  #    they run a separate role with their own /healthz and never register
  #    worker_instances presence, so including them would make the check
  #    wait on a heartbeat that will never appear.
  expectedWorkerGroups: [heavy, ops, sync, sync-provider]
  # -- ClickHouse URI for the Go workers, which speak the NATIVE wire protocol
  #    (port 9000) rather than the HTTP interface (8123) that Python's
  #    clickhouse-connect uses. Leave empty with the bundled ClickHouse and it
  #    is derived natively; with an EXTERNAL ClickHouse this is REQUIRED,
  #    because the shared secrets.data.CLICKHOUSE_URI carries Python's HTTP URI
  #    and pointing a Go worker at it fails readiness immediately.
  #    Set here it is treated as operator-supplied config and rendered inline;
  #    left empty with the bundled ClickHouse the derived URI carries
  #    clickhouse.credentials.password and reaches the pods by secretKeyRef on
  #    the shared Secret's CLICKHOUSE_NATIVE_URI key instead, so the password
  #    never lands in a Pod spec. With secrets.create=false that key must be
  #    present in the external Secret.
  clickhouseURI: ""
  # CHAOS-4587: every group below reads a canonical operational table through
  # the ordering-contract guard (dora_native_clickhouse.go,
  # pagerduty_services_effects_clickhouse.go) and refuses to start against a
  # contract-2 (post-067) table without this set. Rendered as a per-group
  # container env (go-workers.yaml), not the shared api/worker ConfigMap --
  # the Python api's own ordering-contract awareness is a separate,
  # out-of-scope concern. The migrate Job reads it too. The default is
  # production's contract 2: the ClickHouse head `dho migrate upgrade` applies
  # is the contract-2 schema, and dho refuses any other value.
  operationalOrderingContract: "2"
  # -- Pull policy for every worker group's image (all `ghcr.io/full-chaos/
  #    dev-health-go-*` -- REGISTRY images). This must NOT inherit the
  #    top-level image.pullPolicy: that value exists for the commit-tagged
  #    APPLICATION image a local kind/kiac profile side-loads into the
  #    cluster and therefore sets to Never (docs/contribute/development/
  #    lane-isolation-kiac.md) -- applying Never here fails a fresh
  #    goWorkers.enabled=true install with ErrImageNeverPull on every
  #    worker pod, since none of the published go-worker images were ever
  #    side-loaded. Same pattern, same reasoning, as postgresql.image.
  #    pullPolicy below (a registry image with its own dedicated policy).
  imagePullPolicy: IfNotPresent
  # -- Default liveness/readiness probes applied to every group in `groups`
  #    below that does not set its own `livenessProbe`/`readinessProbe`.
  #    Deadlock class: a 1s timeoutSeconds (the Kubernetes default, unset
  #    before this) plus the reconciler Deployment's maxUnavailable: 0 on a
  #    singleton means one slow /readyz response under load fails the probe
  #    even though the process is healthy -- the new pod never becomes Ready
  #    and the old pod, pinned by maxUnavailable: 0, can never terminate. The
  #    rollout deadlocks with both pods live and neither able to progress.
  #    timeoutSeconds: 5 and failureThreshold: 6 give a slow-but-healthy
  #    process room to answer before Kubernetes calls the probe failed. Any
  #    group may still override either probe entirely via
  #    goWorkers.groups[].livenessProbe / .readinessProbe.
  defaultProbes:
    livenessProbe: {httpGet: {path: /healthz, port: metrics}, initialDelaySeconds: 10, periodSeconds: 15, timeoutSeconds: 5, failureThreshold: 6}
    readinessProbe: {httpGet: {path: /readyz, port: metrics}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6}
  # -- --preclaim-readiness-timeout for every queue-consuming group in
  #    `groups` below that does not set its own `preclaimReadinessTimeout`
  #    (heavy/ops/sync/sync-provider; reconciler, scheduler, and the
  #    stream-runner groups do not carry `queues` and never receive this
  #    flag at all -- see go-workers.yaml). It bounds how long a worker
  #    retries its startup posture/authorization checks when they are only
  #    timing out -- e.g. a fleet-wide rollout starting every group's
  #    Deployments at once, which can push Postgres and its pooler past a
  #    single check's own timeout for as long as the resulting connection
  #    burst takes to settle -- before giving up and letting Kubernetes
  #    restart the pod. A check that instead completes and reports a real
  #    problem (wrong credentials, a posture mismatch) still exits on its
  #    first attempt regardless of this value. Any group may override it via
  #    goWorkers.groups[].preclaimReadinessTimeout.
  defaultPreclaimReadinessTimeout: "5m"
  # -- Extra envFrom sources (list of {configMapRef: {name: ...}} or
  #    {secretRef: {name: ...}}), rendered BEFORE the chart's own configMap
  #    and Secret in go-workers.yaml's envFrom list, same rule and same
  #    order as api.extraEnvFrom above -- Kubernetes resolves a duplicate
  #    key in favour of the LAST envFrom source, so this loses to the
  #    chart's own config/secret on any key both set. Shared by every
  #    worker group; there is no per-group override.
  extraEnvFrom: []
  # The production Go topology has three distinct PostgreSQL endpoints.
  # Domain traffic uses a bounded transaction pool. River queue control and
  # coordinator locks use independent session pools: those connections cannot
  # switch backends between statements. The role passwords stay in the
  # dedicated goWorkers.pgbouncer secret and are projected to each worker
  # group by individual secretKeyRef entries, never envFrom.
  # -- CHAOS-5594: KEDA is a cluster-scoped operator installed as its OWN
  #    Helm release, same pattern as ingress-nginx (never a chart dependency
  #    of this umbrella -- CRD lifecycle stays independent). Only consulted
  #    here to scope the transaction pooler's NetworkPolicy ingress
  #    (go-pgbouncer.yaml) to KEDA's namespace when any group autoscales.
  keda:
    namespace: "keda"
  pgbouncer:
    enabled: true
    # Pinned to the compatibility-matrix image. Do not replace this with a
    # mutable tag: the pooler controls the runtime's database semantics.
    image: "edoburu/pgbouncer:1.25.2@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd"
    pullPolicy: IfNotPresent
    postgres:
      # These values are required for an external PostgreSQL service (i.e.
      # whenever postgresql.enabled is false, which is this chart's own
      # default). When the bundled StatefulSet is enabled, host/database/port
      # are derived from it instead and these are ignored. The host below is
      # a placeholder, same convention as ingress.hosts[0].host -- replace it
      # with a real PostgreSQL endpoint, or set postgresql.enabled=true.
      host: "postgres.example.com"
      port: 5432
      database: "devhealth"
      # Required for an external PostgreSQL service with networkPolicy.enabled.
      # Use a narrowly-scoped CIDR, never a broad public range.
      networkPolicyCIDR: ""
    transaction:
      port: 6432
      poolSize: 20
      maxClientConnections: 1000
      # -- Additional roles this pooler may authenticate, beyond its own
      #    RIVER_DOMAIN_DATABASE_ROLE. Each entry is
      #    {role: <postgres role>, passwordKey: <key in secret.data below>},
      #    and the password must be present under that key.
      #
      #    Empty (the default) renders NOTHING -- the image generates its own
      #    single-line userlist.txt from DB_USER/DB_PASSWORD, which is correct
      #    for one role. A non-empty list makes the chart render userlist.txt
      #    into the Secret above and point the pooler's AUTH_FILE at it. The
      #    queue-session and coordinator-session poolers are untouched either
      #    way; this knob exists only here, because only the transaction pooler
      #    fronts a table set that more than one role owns.
      #
      #    The passwords are PLAINTEXT in that file, necessarily: with
      #    auth_type=scram-sha-256 PgBouncer must authenticate ONWARD to
      #    PostgreSQL as the client's role, and a SCRAM verifier fetched by
      #    auth_user/auth_query can only authenticate the client. Do not
      #    pre-hash them. PgBouncer's userlist parser has no escape syntax, so
      #    a role name or password containing a double quote cannot be
      #    expressed in this file at all -- rotate rather than try.
      #
      #    Two costs before adding one. PgBouncer pools per (user, database)
      #    pair, so each extra role adds up to poolSize more server connections
      #    -- size max_connections for the sum, not for poolSize. And with
      #    secret.create=false the userlist.txt key must be present in the
      #    pre-created Secret too, the same way POSTGRES_URI and the two other
      #    DSNs already must be.
      #
      #    CHAOS-5594: KEDA's read-only role is the first real user of this
      #    knob -- its ScaledObject/TriggerAuthentication (go-worker-keda.yaml)
      #    connects directly to this pooler with host/port/userName/dbName in
      #    the trigger metadata and this role's password via
      #    TriggerAuthentication, no dedicated pooler and no DSN key needed.
      extraUsers:
        - role: devhealth_keda_readonly
          passwordKey: RIVER_KEDA_READONLY_PASSWORD
    queueSession:
      port: 6433
      poolSize: 50
      maxClientConnections: 128
    coordinatorSession:
      port: 6434
      poolSize: 14
      maxClientConnections: 32
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}
    secret:
      # Set create=false and provide a pre-created Secret with the same six
      # keys for externally managed credentials and DSNs.
      create: true
      externalSecretName: ""
      # go-pgbouncer.yaml's `required` guard fails template rendering on a
      # blank password (pgbouncer is enabled by default -- see goWorkers
      # above), so unlike the app secrets below these three ship an obvious,
      # override-me placeholder rather than "", the same convention as
      # postgresql.credentials.password: "devhealth". Replace all three
      # before any real deployment; go-river-provision (see
      # deploy/go-workers/README.md) is what actually creates matching
      # PostgreSQL roles.
      data:
        RIVER_DOMAIN_DATABASE_PASSWORD: "change-me-river-domain-password"
        RIVER_QUEUE_DATABASE_PASSWORD: "change-me-river-queue-password"
        RIVER_COORDINATOR_DATABASE_PASSWORD: "change-me-river-coordinator-password"
        RIVER_KEDA_READONLY_PASSWORD: "change-me-river-keda-readonly-password"
  # -- The one image every group runs: dho, whose first argument (each group's
  #    `subcommand`) selects the service -- `worker`, `reconciler`,
  #    `scheduler` or `stream-runner`. A group's own `image` overrides it (the
  #    prod values pin the operator image, which also ships dho).
  image: ghcr.io/full-chaos/dev-health-go-dho:latest
  groups:
    - name: heavy
      subcommand: worker
      queues: [investment, metrics, reports, workgraph]
      queueConcurrency: {investment: 1, metrics: 2, reports: 2, workgraph: 1}
      replicas: 1
      terminationGracePeriodSeconds: 7260
      resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      # CHAOS-5594: KEDA postgresql scaler on river_job backlog (available +
      # due-scheduled + retryable across this group's queues, see
      # go-worker-keda.yaml). investment.materialize carries the heavy
      # backlog (~2,200 jobs, concurrency 3 post-R176); queueDepthPerReplica
      # is deliberately loose (10) so the ceiling reacts to a real backlog
      # without chasing every retry. maxReplicas 2 matches the cross-renderer
      # deployment contract (deploy/go-workers/deployment.json's
      # heavy.max_replicas, asserted equal across compose/swarm/k8s/helm by
      # test_group_replica_and_drain_contract_matches_every_renderer) --
      # KEDA owns the replica count within that same declared ceiling, it
      # does not get its own. cooldownPeriod 600s (>=5min) and
      # terminationGracePeriodSeconds above (7260s) both protect the
      # long-running metrics job from a scale-down SIGKILL.
      autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 2, queueDepthPerReplica: 10, cooldownPeriod: 600, pollingInterval: 30}
      # CHAOS-6279: bridgeUrl (formerly here, CHAOS-4351) is deleted -- the
      # --operational-bridge-url flag it overrode no longer exists on the Go
      # binaries (go-workers.yaml's own comment has the full history). This
      # group's own command line no longer points at metricsApi at all as a
      # result -- see metrics-api-deployment.yaml's comment for the
      # resulting open question (retire that Deployment or not).
    - name: ops
      subcommand: worker
      queues: [coverage, heartbeat, retention, webhooks]
      queueConcurrency: {coverage: 1, heartbeat: 1, retention: 1, webhooks: 4}
      replicas: 1
      terminationGracePeriodSeconds: 960
      resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      # CHAOS-5594: queueDepthPerReplica 5 -- webhooks (concurrency 4) is the
      # busiest queue here; a modest per-replica target keeps one extra
      # replica responsive without scaling on routine coverage/retention
      # trickle.
      autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 2, queueDepthPerReplica: 5, cooldownPeriod: 300, pollingInterval: 30}
    - name: sync
      subcommand: worker
      queues: [sync]
      queueConcurrency: {sync: 4}
      replicas: 1
      terminationGracePeriodSeconds: 960
      resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      # CHAOS-5594: single queue, concurrency 4 -- queueDepthPerReplica 5
      # mirrors that headroom.
      #
      # CHAOS-6938: the river_job trigger cannot see a unit that is planned but not yet
      # dispatched (a row in public.sync_run_units, not a River job): on prod 442 planned,
      # due units read as 0-5 and this group sat at 1 replica for hours. The extra trigger
      # counts that backlog (SELECT on the table is granted to devhealth_keda_readonly by
      # `dho migrate roles`); target 150 per replica makes 442 ask for the maximum. The
      # maximum stays 2: a second worker pod adds 4 domain and 2 queue-session pooler
      # clients, and the session-pool budget has no room for more (values.prod.yaml).
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 2
        queueDepthPerReplica: 5
        cooldownPeriod: 300
        pollingInterval: 30
        extraTriggers:
          - name: planned-units
            query: >-
              SELECT count(*) FROM public.sync_run_units
              WHERE status = 'planned'
              AND (available_at IS NULL OR available_at <= now())
            targetQueryValue: 150
    # Its own group, like the Celery fleet splits per queue. Fused with sync it
    # cannot start while provider routes are default-off: selected queues must
    # equal constructed queues, and no provider handler is built (CHAOS-3926).
    - name: sync-provider
      subcommand: worker
      queues: [sync_provider]
      queueConcurrency: {sync_provider: 2}
      replicas: 1
      terminationGracePeriodSeconds: 960
      resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      # CHAOS-5594: provider routes are default-off (CHAOS-3926 above) --
      # this group idles at 0 backlog on a fresh install, so the KEDA
      # trigger simply never fires above minReplicas until routes activate.
      autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 2, queueDepthPerReplica: 3, cooldownPeriod: 300, pollingInterval: 30}
    # The reconciler runs `dho reconciler`: `subcommand` is rendered as the
    # first argument.
    - name: reconciler
      subcommand: reconciler
      replicas: 1
      terminationGracePeriodSeconds: 60
      resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      autoscaling: {enabled: false}
    # The scheduler runs `dho scheduler`.
    - name: scheduler
      subcommand: scheduler
      replicas: 1
      terminationGracePeriodSeconds: 60
      resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
      autoscaling: {enabled: false}
    # The stream groups run `dho stream-runner`, with `subcommand` rendered as
    # the first argument. A
    # group with no stream profile omits `runtimeProfile` (never `""`, which the
    # values schema refuses).
    - name: stream-external
      subcommand: stream-runner
      runtimeProfile: external
      replicas: 1
      terminationGracePeriodSeconds: 60
      resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      autoscaling: {enabled: false}
    - name: stream-ingest
      subcommand: stream-runner
      runtimeProfile: ingest
      replicas: 1
      terminationGracePeriodSeconds: 60
      resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      autoscaling: {enabled: false}
    # Not a singleton: PagerDuty entries are exclusive per consumer through the
    # group PEL and duplicates are fenced by the receipt claim token.
    - name: stream-pagerduty
      subcommand: stream-runner
      runtimeProfile: pagerduty
      replicas: 1
      terminationGracePeriodSeconds: 60
      resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      autoscaling: {enabled: false}

# =============================================================================
# Web Frontend (Next.js)
# =============================================================================
web:
  enabled: true
  replicas: 2
  port: 3000
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  env:
    BACKEND_URL: ""  # defaults to http://<release>-api:8000
    AUTH_SECRET: ""
    NODE_ENV: "production"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  # -- CHAOS-6188: mount extra volumes into web in every environment (e.g. the
  #    Secret volume carrying the ACR web-assertion Ed25519 signing key).
  #    Renders alongside localDevelopment's own extraVolumes/extraVolumeMounts
  #    under a single volumeMounts:/volumes: key when both are set.
  extraVolumeMounts: []
  extraVolumes: []
  localDevelopment:
    enabled: false
    extraVolumeMounts: []
    extraVolumes: []

# =============================================================================
# Database migrations (CHAOS-2304)
# =============================================================================
# When enabled, the default pre-install/pre-upgrade Helm hook Job applies
# PostgreSQL (Alembic) + ClickHouse migrations before the release's workloads
# are (re)deployed. For local evaluation with bundled PostgreSQL only, opt into
# localBundledPostgres and replace pre-install with post-install; the Job waits
# for PostgreSQL before migrating. The shared ConfigMap sets
# AUTO_RUN_MIGRATIONS=false so api/go workers never ambient-migrate. Set
# config.AUTO_RUN_MIGRATIONS explicitly to override the computed value.
#
# The preferred MIGRATION_DATABASE_URI used for Alembic plus River must point
# DIRECTLY at Postgres. Legacy POSTGRES_URI / DATABASE_URI values remain
# Alembic-only compatible. Every migration DSN must point
# (port 5432), never at a transaction-mode pooler (PgBouncer/RDS Proxy) —
# migrations run raw DDL. See docs/operate/configure/databases-and-storage.md.
migrations:
  hook:
    enabled: true
    # -- Hook lifecycle events. Production keeps pre-install/pre-upgrade. The
    #    post-install option is fail-closed unless localBundledPostgres=true.
    events:
      - pre-install
      - pre-upgrade
    # -- Explicit local/evaluation-only acknowledgement for post-install with
    #    the chart's bundled PostgreSQL. Requires postgresql.enabled=true.
    localBundledPostgres: false
    # -- Image the migrate Job runs `dho migrate upgrade` from. EMPTY MEANS
    #    routeActivate.image (the operator image, entrypoint dho), else the
    #    chart's dho image (goApi.image). An image set here or in
    #    routeActivate.image must be pinned (repo@sha256:<digest>,
    #    repo:sha-<12 hex>, or repo:local with pullPolicy Never/IfNotPresent);
    #    the Python image is refused.
    image: ""
    pullPolicy: ""
    # -- DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER for the migrate Job. The
    #    PostgreSQL head dho applies has the Celery->River route-table cutover
    #    (revision 0066) applied, as production runs, and dho refuses any
    #    other value. Kept a value so an operator sees what the Job runs with.
    celeryRiverCutover: "1"
    # -- CHAOS-4428: the two migration steps that were previously run by hand.
    #    Ordered by hook weight behind the migrate Job (0): provisionRoles (5)
    #    creates the three runtime logins, riverMigrate (10) applies the River
    #    schema AND the full grant posture, then re-checks it. Both default to
    #    false so an existing deployment is unchanged on upgrade.
    #    Both run on pre-install AND pre-upgrade: provisioning has been
    #    bootstrap-only since CHAOS-4261 and cannot revoke what riverMigrate
    #    grants, and riverMigrate re-applies the full posture on every run even
    #    with zero pending migrations. Verified on production deploy 5.5:
    #    116 grants -> 119 -> 119 across three passes, no revoke.
    provisionRoles:
      enabled: false
    riverMigrate:
      # -- OFF is not "River never happens". With the hook off there are two
      #    paths, and which one you are on depends on secretData below:
      #      * MIGRATION_DATABASE_URI set -> the weight-0 migrate Job runs
      #        `dho migrate upgrade --river`, which applies River ITSELF right
      #        after the PostgreSQL step. It is safe only where the runtime
      #        roles already exist -- an upgrade, never a fresh install, where
      #        the preflight fails before provisioning runs.
      #      * no MIGRATION_DATABASE_URI -> the weight-0 Job applies the
      #        PostgreSQL head, the feature flags and the ClickHouse head only,
      #        and NOTHING applies the River schema.
      #        The operator runs `dho migrate river --apply-and-check` out of band.
      #    Turning this ON moves the step to its own weight-10 Job, after role
      #    provisioning, which is the only ordering a fresh install survives.
      enabled: false
      # -- Image the River hook runs `dho migrate river --apply-and-check`
      #    from. EMPTY MEANS routeActivate.image (the operator image,
      #    entrypoint dho). The render refuses an image that is not pinned
      #    (repo@sha256:<digest>, repo:sha-<12 hex>, or repo:local with
      #    pullPolicy Never/IfNotPresent) -- there is no chart-default
      #    fallback. The image must carry dho as its entrypoint: the hook sets
      #    args only, no command.
      image: ""
      pullPolicy: ""
    # -- CHAOS-4272/CHAOS-4455: sync-dispatch route activation and the
    #    one-shot operator credential that authenticates it. 0049 seeds
    #    `sync_dispatch_transport_routes` at transport=celery for four kinds
    #    (dispatch_sync_run, finalize_sync_run, post_sync,
    #    reference_discovery); Celery has had no consumer since CHAOS-4026,
    #    so a fresh install dispatches none of them until an operator runs
    #    `dho workers routes apply` for each. The `sync-provider`
    #    worker group's own job route (sync.provider_unit) is a SEPARATE
    #    table (`worker_job_routes`) that migration 0107 already promotes
    #    unconditionally -- see that migration's own docstring -- so it
    #    needs no Job here; what `sync-provider` (like every group) still
    #    needs is provisionRoles+riverMigrate actually being on.
    #    Folded in from the proven design running the shared bigboy compose
    #    stack (compose/compose.go.workers.yml, untracked, outside this
    #    repo) and from PR chore/celery-retire-pr3's root compose.yml.
    #    Ordered after riverMigrate (10): a weight-15 Job mints the
    #    one-shot operator credential, then applies the four routes in the
    #    SAME serialized order Compose uses (the operator permits one
    #    audited mutation at a time -- these run as ordered initContainers
    #    sharing one emptyDir token file, not four Jobs, since Kubernetes
    #    hook Jobs have no depends_on). Idempotent: `routes apply` on a
    #    route already at its target transport is a no-op
    #    (internal/syncroute), so re-running on every upgrade is safe.
    #    Renders ONLY when provisionRoles AND riverMigrate are BOTH also
    #    enabled -- exactly the go_default fresh-install chain those two
    #    already gate. An existing deployment with either off is
    #    unaffected: same "unchanged on upgrade" invariant those two flags
    #    already promise, so this defaulting to true does not, by itself,
    #    change any existing installation's behaviour.
    routeActivate:
      enabled: true
      # -- Image carrying `dho workers` (docker/go-worker.Dockerfile's
      #    `operator` target, entrypoint dho) -- the same
      #    binary Compose's go-worker-route-activate/go-sync-*-route-activate
      #    services run. REQUIRED, and must be pinned, whenever
      #    routeActivate.enabled=true: the render refuses an empty value, a
      #    floating tag such as `:latest`, or anything else that is not one
      #    of the forms below -- there is no floating default, because a
      #    default that can float is not a safe default.
      #
      #    Accepted forms:
      #      * `repo@sha256:<64 hex>`  -- digest pin, with or without a tag
      #                                    in front
      #      * `repo:sha-<12 hex>`     -- this repo's other immutable-tag
      #                                    convention (see
      #                                    docs/operate/runbooks/
      #                                    operator-commands.md)
      #      * `repo:local`            -- ONLY with pullPolicy Never or
      #                                    IfNotPresent, for a side-loaded
      #                                    local/kind image
      #
      #    Lockstep convention: pin this to the go-operator image built from
      #    the SAME commit as `image.repository`/`image.tag` (the api/migrate
      #    image) -- the two binaries must agree on the posture manifest for
      #    the database the migrate Job just migrated. When both this value
      #    and `image.tag` carry a `sha-<12 hex>` tag, the chart compares
      #    them and refuses the render on a mismatch. A digest-only pin on
      #    either side cannot be compared this way -- a digest does not
      #    encode which commit it came from -- so that comparison is skipped
      #    rather than fabricated; keeping the two pins in step is then the
      #    operator's responsibility, the same as any other digest pin.
      image: ""
      pullPolicy: ""
    backoffLimit: 2
    activeDeadlineSeconds: 1800
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    # -- Extra environment variables for the migration Job (e.g. a direct
    #    POSTGRES_URI when the app's DATABASE_URI points at a pooler)
    extraEnv: []
    # -- Dedicated secret values mounted only into the one-shot migration Job.
    #    Setting MIGRATION_DATABASE_URI activates the pinned River migration.
    #    When riverMigrate.enabled=true the dedicated URI is delivered to the
    #    weight-10 River Job instead, and reaches the weight-0 migrate Job as
    #    POSTGRES_URI; otherwise the migrate Job runs River itself (`dho
    #    migrate upgrade --river`) whenever MIGRATION_DATABASE_URI is set.
    secretData:
      MIGRATION_DATABASE_URI: ""
      POSTGRES_URI: ""
      CLICKHOUSE_URI: ""
    # -- Existing dedicated Secret when secrets.create=false. Falls back to
    #    secrets.externalSecretName for backward compatibility when empty.
    externalSecretName: ""

# =============================================================================
