# Source: dev-health/templates/query-api-internal.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dev-health-ops-query-api-internal
  namespace: dev-health
  labels:
    app.kubernetes.io/name: ops
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/component: query-api-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ops
      app.kubernetes.io/instance: dev-health
      app.kubernetes.io/component: query-api
  policyTypes:
    - Ingress
  ingress:
    # The public listener: open to every source, as it was before this policy existed.
    - ports:
        - protocol: TCP
          port: 8090
    # The internal listener: only the pod selectors listed under queryApiInternal.allowedFrom.
    # The listener trusts unsigned X-DH-Internal-* identity headers, so this list IS the
    # authentication boundary: every entry grants that pod set org/admin forgery power against
    # query-api. A rule with ports and NO `from` admits every source, so the rule exists only
    # when the list is not empty.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
              app.kubernetes.io/instance: dev-health-acr
              app.kubernetes.io/name: acr
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: go-api-tools
      ports:
        - protocol: TCP
          port: 8091

