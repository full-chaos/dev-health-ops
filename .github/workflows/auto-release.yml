name: Auto Release Tag
permissions:
  id-token: write
  contents: write
  attestations: write
on:
  pull_request:
    types: [ closed ]
  workflow_dispatch:

concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding). Named explicitly rather
  # than silently mechanical: this job publishes a git tag/release
  # (attestations, contents: write) on PR close, a state-changing action a
  # mid-flight cancellation could interrupt partway (tag pushed, release not
  # yet created, or vice versa). Accepted anyway -- a `closed` event fires
  # once per PR under normal operation, so a same-PR re-trigger (re-closing
  # after a re-open) is the only real collision, and superseding that stale
  # attempt is the correct behaviour, not a risk worth a bespoke exemption.
  # Canonical fleet-wide shape (this workflow has no push trigger, so only
  # the pull_request half is reachable in practice).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  tag-and-release:
    if: ((github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'pre-release')) || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Determine Next Version
        id: version
        run: python scripts/auto_tag.py

      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG=${{ steps.version.outputs.new_tag }}

          # Check if tag exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping creation."
          else
            echo "Creating tag $TAG"
            git tag $TAG
            git push origin $TAG
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
          prerelease: true
