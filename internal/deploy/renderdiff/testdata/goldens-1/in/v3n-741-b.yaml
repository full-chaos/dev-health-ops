apiVersion: batch/v1
kind: Job
metadata:
  name: dev-health-ops-migrate
  namespace: dev-health
  labels:
    helm.sh/chart: ops-0.1.0
    app.kubernetes.io/name: ops
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: dev-health
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops
        app.kubernetes.io/instance: dev-health
        app.kubernetes.io/component: migrate
    spec:
      
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgresql
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          # The PostgreSQL image's own policy, never image.pullPolicy: this
          # container runs a registry image, not the application image a local
          # profile side-loads and marks Never.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 70
            runAsGroup: 70
          command:
            - sh
            - -ec
            - >-
              until pg_isready --host dev-health-ops-postgresql
              --port 5432 --username "placeholder"
              --dbname "placeholder";
              do sleep 2; done
      containers:
        - name: migrate
          image: "ghcr.io/full-chaos/dev-health-go-operator@sha256:2c87c3613bca406dd962673e7b6d15d7a15cf9dc71e59865a2e0574ec8a39dd6"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          # `dho migrate upgrade` runs the migrate Job's steps in order, each
          # exactly as its own verb: `migrate postgres upgrade`, `admin
          # features seed`, `migrate clickhouse upgrade`. Exec form, no shell:
          # the image is distroless. MIGRATION_DATABASE_URI (preferred, or its
          # _FILE or DEV_HEALTH_MIGRATION_PG_* form) or POSTGRES_URI must point
          # DIRECTLY at Postgres (5432), never at a transaction-mode pooler;
          # dho does not read DATABASE_URI. See
          # docs/operate/configure/databases-and-storage.md.
          # The weight-10 river-migrate hook owns the River step (CHAOS-4428).
          args: ["migrate", "upgrade", "--river=false"]
          envFrom:
            - configMapRef:
                name: dev-health-ops-migrate-config
            - secretRef:
                name: dev-health-ops-migrate
          env:
            - name: AUTH_DATABASE_SCHEMA
              value: "auth"
            - name: DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER
              value: "1"
            - name: OPERATIONAL_ORDERING_CONTRACT
              value: "2"
            - name: AUTH_PROXY_SESSIONS
              value: "true"
            - name: DHO_CH_CLOUD_HOST
              valueFrom:
                secretKeyRef: {name: "ch-cloud-default", key: "CH_CLOUD_HOST"}
            - name: DHO_CH_CLOUD_USER
              valueFrom:
                secretKeyRef: {name: "ch-cloud-default", key: "CH_CLOUD_USER"}
            - name: DHO_CH_CLOUD_PASSWORD
              valueFrom:
                secretKeyRef: {name: "ch-cloud-default", key: "CH_CLOUD_PASSWORD"}
            - name: CLICKHOUSE_URI
              value: "clickhouse://$(DHO_CH_CLOUD_USER):$(DHO_CH_CLOUD_PASSWORD)@$(DHO_CH_CLOUD_HOST):9440/default?secure=true"
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi

