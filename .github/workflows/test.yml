name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              # This workflow decides whether the proof gate runs at all.
              # Without this pattern a PR that changed ONLY this file set
              # code=false, skipped both test jobs, and the required `test`
              # aggregator counted the skip as a pass -- the gate could be
              # disabled through a green required check.
              - '.github/workflows/**'
              - 'src/**'
              - 'tests/**'
              - 'ci/**'
              - 'migrations/**'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'alembic.ini'
              - 'Makefile'
              - 'scripts/**'
              - 'alerts/**'
              - 'compose.yml'
              - 'deploy/**'

  # Fast, pytest-xdist-parallelized unit suite on the supported Python
  # version. This is the per-PR signal that the required `test` gate (below)
  # aggregates. Coverage is intentionally NOT gated here so the iterative PR
  # loop stays fast — the coverage-gated full suite runs in the `coverage` job
  # at merge time and on main (CHAOS-2586). Single-version matrix (CHAOS-3419):
  # containers ship 3.14 only (docker/Dockerfile), so that is the only
  # interpreter tested.
  test-matrix:
    needs: [changes]
    # On merge_group, dorny/paths-filter has no PR base/head diff to compute and
    # can report code=false, which would skip every test job; the `test`
    # aggregator then treats the skip as a pass and an untested change reaches
    # main. Always run in the merge queue regardless of the path filter.
    if: github.event_name == 'merge_group' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    # Test matrix needs package read access for dependency installs.
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        python-version: ["3.14"]

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:25.1
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: ch
          CLICKHOUSE_PASSWORD: ch
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user ch --password ch --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-docs.txt

      - name: Run parallel unit test contract
        env:
          DATABASE_URI: clickhouse://ch:ch@localhost:8123/default
          CLICKHOUSE_URI: clickhouse://ch:ch@localhost:8123/default
          POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          SECONDARY_DATABASE_URI: mongodb://localhost:27017
          # No OTLP collector runs in CI; with OTEL on, the exporter retries to
          # localhost:4317 with backoff on every span/metric, flooding logs and
          # slowing the suite into timeouts. We don't assert OTEL stats in CI.
          OTEL_ENABLED: "false"
          # Cap xdist workers so parallelism does not contend on the single
          # postgres/clickhouse service container. The standard arm runner has
          # 4 vCPUs, so this matches `-n auto` there while staying predictable on
          # larger runners. Override PYTEST_XDIST_WORKERS to tune.
          PYTEST_XDIST_WORKERS: "4"
          PYTEST_ADDOPTS: --ignore=tests/test_0066_celery_river_cutover_postgres.py --ignore=tests/test_chaos_3337_source_class_postgres_migration.py --ignore=tests/api/admin/test_add_member_visibility.py
        run: |
          chmod +x ci/run_tests.sh
          mkdir -p test-results/logs
          set -o pipefail
          ./ci/run_tests.sh unit 2>&1 | tee test-results/logs/unit-${{ matrix.python-version }}.log

      # These files carry their own `isolated_postgres`/`require_postgres_test_uri`
      # fixtures that pytest.fail() (not skip) when CI/GITHUB_ACTIONS is set but
      # the needed URI is missing, so they cannot run in "Run parallel unit test
      # contract" above (no admin-privileged Postgres URI there) and are ignored
      # from it instead. DEV_HEALTH_TEST_POSTGRES_ADMIN_URI's database component
      # must be literally `postgres`: the fixture connects to it to CREATE/DROP a
      # throwaway per-test database on the same server.
      #
      # test_add_member_visibility.py (CHAOS-3411) has the same CI-must-fail
      # gate but only needs DEV_HEALTH_POSTGRES_TEST_URI (it isolates itself
      # with a CREATE SCHEMA on that same database, not a whole separate
      # database), so it doesn't need the admin URI -- it's listed here
      # rather than alongside it so a stripped commit can't silently pass by
      # having this step simply not exercise it (CHAOS-3411 Codex round 1:
      # the module was collected by neither PR-gated step with its URI set,
      # so it always skipped on pull_request).
      - name: Run PostgreSQL migration tests
        env:
          DEV_HEALTH_POSTGRES_TEST_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          DEV_HEALTH_TEST_POSTGRES_ADMIN_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
        run: |
          pytest -q \
            tests/test_0066_celery_river_cutover_postgres.py \
            tests/test_chaos_3337_source_class_postgres_migration.py \
            tests/test_canonical_incident_feature_flag_postgres_migration.py \
            tests/api/admin/test_add_member_visibility.py

      - name: Upload junit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-${{ matrix.python-version }}
          path: test-results/junit/*.xml
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-logs-${{ matrix.python-version }}
          path: |
            test-results/logs/*.log
            **/pytest.log
          if-no-files-found: ignore
          retention-days: 14

  # Full coverage-gated suite (ruff/mypy gates + unit tests with coverage
  # threshold + integration/e2e). Kept OFF the per-PR iterative path: it runs in
  # the merge queue (before code reaches main) and on push to main (post-merge
  # verification + Codecov upload), never on pull_request. Reassigned from the
  # retired 3.11 leg to 3.12 and parallelized with xdist (CHAOS-2586); moved to
  # 3.14 to match the shipped interpreter (CHAOS-3419).
  coverage:
    needs: [changes]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'merge_group' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:25.1
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: ch
          CLICKHOUSE_PASSWORD: ch
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user ch --password ch --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-docs.txt

      - name: Run coverage-gated test contract
        env:
          DATABASE_URI: clickhouse://ch:ch@localhost:8123/default
          CLICKHOUSE_URI: clickhouse://ch:ch@localhost:8123/default
          POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          SECONDARY_DATABASE_URI: mongodb://localhost:27017
          COVERAGE_THRESHOLD: "70"
          DEV_HEALTH_POSTGRES_TEST_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          # ci_tests() (ci/run_tests.sh) does not --ignore the postgres-gated
          # migration test files, so they run inline here; without the admin
          # URI they would pytest.fail() under CI (see the dedicated
          # "Run PostgreSQL migration tests" step above for why `postgres` is
          # required as the database component).
          DEV_HEALTH_TEST_POSTGRES_ADMIN_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          OTEL_ENABLED: "false"
          PYTEST_XDIST_WORKERS: "4"
        run: |
          chmod +x ci/run_tests.sh
          mkdir -p test-results/logs
          set -o pipefail
          ./ci/run_tests.sh ci 2>&1 | tee test-results/logs/ci-3.14.log

      - name: Upload junit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Named for what it actually is: JUnit output from the
          # coverage-gated `ci` tier, not a coverage report. (See
          # coverage-py314 below for the actual coverage artifact.)
          name: junit-ci-gated
          path: test-results/junit/*.xml
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-logs-coverage
          path: |
            test-results/logs/*.log
            **/pytest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage.xml artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-py314
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # CHAOS-3413 THROWAWAY VERIFICATION JOB -- not for merge, not wired into
  # `needs: [test-matrix, coverage]` below, does not affect the `test`
  # required check. Ground-truth baseline: the *pre-split* single `--cov`
  # pass (same file set as `coverage` above, live-Postgres files included,
  # same env), but PYTEST_XDIST_WORKERS=0 so it runs serially and cannot hit
  # the concurrency hang -- the only way to get a trustworthy combined
  # coverage total to diff the split's number against, since the pre-split
  # xdist version cannot complete at all right now.
  coverage-baseline-serial:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:25.1
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: ch
          CLICKHOUSE_PASSWORD: ch
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user ch --password ch --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-docs.txt

      - name: "[verify] run the pre-split single pass, serially, as ground truth"
        env:
          DATABASE_URI: clickhouse://ch:ch@localhost:8123/default
          CLICKHOUSE_URI: clickhouse://ch:ch@localhost:8123/default
          POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          SECONDARY_DATABASE_URI: mongodb://localhost:27017
          DEV_HEALTH_POSTGRES_TEST_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          DEV_HEALTH_TEST_POSTGRES_ADMIN_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          OTEL_ENABLED: "false"
        run: |
          mkdir -p test-results/junit
          pytest tests -v --tb=short -m "not benchmark and not clickhouse" \
            --ignore=tests/test_connectors_integration.py \
            --ignore=tests/test_private_repo_access.py \
            --cov=. --cov-report=xml:coverage-baseline.xml --cov-report=term-missing \
            --junitxml=test-results/junit/baseline-serial.xml

      - name: "[verify] upload baseline coverage.xml"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-baseline-serial
          path: coverage-baseline.xml
          if-no-files-found: warn
          retention-days: 7

  # CHAOS-3413 THROWAWAY VERIFICATION JOB -- diffs the split `coverage` job's
  # coverage.xml total against the serial ground-truth baseline above.
  coverage-split-vs-baseline-diff:
    needs: [coverage, coverage-baseline-serial]
    if: always() && needs.coverage.result != 'skipped' && needs.coverage-baseline-serial.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: "[verify] download split coverage.xml"
        uses: actions/download-artifact@v5
        with:
          name: coverage-py314
          path: split
      - name: "[verify] download baseline coverage.xml"
        uses: actions/download-artifact@v5
        with:
          name: coverage-baseline-serial
          path: baseline
      - name: "[verify] write the comparison script"
        run: |
          cat > /tmp/compare_coverage.py <<'PYEOF'
          import os
          import re
          import sys

          def line_rate(path: str) -> float:
              with open(path) as f:
                  head = f.read(4096)
              match = re.search(r'line-rate="([0-9.]+)"', head)
              if not match:
                  raise SystemExit(f"no line-rate attribute found in {path}")
              return float(match.group(1)) * 100

          split_pct = line_rate(os.environ["SPLIT_XML"])
          baseline_pct = line_rate(os.environ["BASELINE_XML"])
          # Signed, not absolute: which direction it moves matters (a split
          # that reads *higher* than the serial baseline is just as
          # suspicious as one that reads lower). Always printed, regardless
          # of outcome -- a 0.0 delta is a result to state, not something to
          # imply via a green check.
          signed_delta = split_pct - baseline_pct
          print(f"split (serialized live-pg pass, --cov-append):  {split_pct:.4f}%")
          print(f"baseline (pre-split single pass, serial):       {baseline_pct:.4f}%")
          print(f"REPORT: signed_delta_pp={signed_delta:+.4f}")
          if abs(signed_delta) > 0.5:
              print("FAIL: split coverage total diverges from the serial ground truth by more than 0.5pp -- explain before shipping, do not raise the tolerance to pass silently")
              sys.exit(1)
          print("PASS (within 0.5pp hard ceiling) -- the signed_delta_pp line above is still the number that matters, not this pass/fail alone")
          PYEOF
      - name: "[verify] compare combined line-rate totals"
        env:
          SPLIT_XML: split/coverage.xml
          BASELINE_XML: baseline/coverage-baseline.xml
        run: python3 /tmp/compare_coverage.py

  # Required-status-check gate. Branch protection requires a check named
  # exactly "test"; the matrix above produces "test-matrix (3.14)"
  # and the coverage job produces "coverage", neither of which match. This
  # aggregator always runs, treating skipped (path filter, or coverage skipped
  # on pull_request) as pass and failure/cancelled as fail. It is the single
  # required check for both PRs and the merge queue. Do not remove.
  test:
    name: test
    if: always()
    needs: [test-matrix, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate test results
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          echo "test-matrix result: ${MATRIX_RESULT}"
          echo "coverage result: ${COVERAGE_RESULT}"
          for result in "${MATRIX_RESULT}" "${COVERAGE_RESULT}"; do
            case "${result}" in
              success|skipped)
                ;;
              failure|cancelled|*)
                echo "test gate failed (${result})"
                exit 1
                ;;
            esac
          done
          echo "test gate passed"
