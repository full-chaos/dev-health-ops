{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-health.fullname" . }}-web
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "web" "context" $) | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  {{- /*
  CHAOS-4428: never dip below the current serving capacity during a rollout.
  Kubernetes' default is 25%/25%, which at replicas: 1 rounds maxUnavailable
  DOWN to 0 and happens to behave -- but only by rounding. State it, so the
  guarantee survives someone setting replicas: 4, where the default would take
  one serving pod out before its replacement is ready.
  */}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "web" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "web" "context" $) | nindent 8 }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      {{- include "dev-health.workloadServiceAccount" (dict "ctx" . "component" "web" "cfg" .Values.web.serviceAccount) | nindent 6 }}
      containers:
        - name: web
          image: {{ include "dev-health.webImage" . }}
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            - name: HOSTNAME
              value: "::"
            - name: BACKEND_URL
              value: {{ required "web.env.BACKEND_URL is required whenever web.enabled=true (CHAOS-8310): it is the base URL of the backend web's server-side requests go to -- REST (go-api) and /graphql (query-api) are different Go services, so no single in-chart default is correct. Set web.env.BACKEND_URL explicitly for this environment (for example the ingress host that fans out both), or web.enabled=false." .Values.web.env.BACKEND_URL | quote }}
            {{- /*
            AUTH_SECRET (the Auth.js session secret) is a literal (dev) or one key of its
            own Secret; web.enabled without either fails the render.
            */}}
            {{- if .Values.web.env.AUTH_SECRET }}
            - name: AUTH_SECRET
              value: {{ .Values.web.env.AUTH_SECRET | quote }}
            {{- else if .Values.web.authSecret.secretName }}
            {{- include "dev-health.webSecretGuard" (dict "ctx" . "name" .Values.web.authSecret.secretName "key" .Values.web.authSecret.key "what" "web.authSecret") }}
            {{- if not (include "dev-health.validSecretKey" (.Values.web.authSecret.key | toString)) }}{{- fail "web.authSecret.key must be a Secret key: letters, digits, '-', '_' and '.', at most 253 characters, not '.', '..' or a name that starts with '..' (quote a numeric key in values: key: \"123\")" }}{{- end }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.web.authSecret.secretName | quote }}
                  key: {{ .Values.web.authSecret.key | toString | quote }}
            {{- else if or (not .Values.web.localDevelopment.enabled) (eq (.Values.web.env.NODE_ENV | default "production") "production") }}
            {{- fail "web.authSecret.secretName (or web.env.AUTH_SECRET) is required whenever web.enabled=true (only web.localDevelopment with NODE_ENV other than production may omit it) (CHAOS-10446): web's session secret has its own Secret. See docs/operate/install/production.md." }}
            {{- end }}
            - name: NODE_ENV
              value: {{ .Values.web.env.NODE_ENV | quote }}
            {{- if .Values.valkey.enabled }}
            - name: REDIS_URL
              value: {{ include "dev-health.redisURL" . | quote }}
            {{- end }}
          {{- /*
          CHAOS-12928: web refuses SSO completion unless AUTH_ACCESS_TOKEN_CLASS is eddsa (the
          only class that verifies signatures). A literal-on or valueFrom AUTH_SSO_ENABLED needs
          a literal eddsa class here; the render cannot read a valueFrom, so it fails closed. An
          entry with a valueFrom counts as a reference even when it also carries an empty value. The
          class is compared exactly (no trim, no case fold), as web reads it.
          */}}
          {{- $ssoOn := false }}
          {{- $classEddsa := false }}
          {{- range .Values.web.extraEnv | default (list) }}
          {{- if eq (toString .name) "AUTH_SSO_ENABLED" }}
          {{- if or .valueFrom (not (hasKey . "value")) }}{{- $ssoOn = true }}
          {{- else if has (lower (trim (toString .value))) (list "true" "1") }}{{- $ssoOn = true }}{{- end }}
          {{- end }}
          {{- if eq (toString .name) "AUTH_ACCESS_TOKEN_CLASS" }}
          {{- $classEddsa = and (not .valueFrom) (hasKey . "value") (eq (toString .value) "eddsa") }}
          {{- end }}
          {{- if has .name (list "AUTH_SECRET" "NEXTAUTH_SECRET") }}
          {{- fail (printf "web.extraEnv must not set %s (CHAOS-10446): web.authSecret and web.env own the names AUTH_SECRET and NEXTAUTH_SECRET" .name) }}
          {{- end }}
          {{- with .valueFrom }}{{- with .secretKeyRef }}
          {{- include "dev-health.webSecretGuard" (dict "ctx" $ "name" .name "key" .key "what" "web.extraEnv secretKeyRef" "sharedOk" true) }}
          {{- end }}{{- end }}
          {{- end }}
          {{- if and $ssoOn (not $classEddsa) }}
          {{- fail "web.extraEnv sets AUTH_SSO_ENABLED on (or by valueFrom, which the render cannot read) but AUTH_ACCESS_TOKEN_CLASS is not a literal eddsa (CHAOS-12928): SSO needs the verifying class eddsa; set web.extraEnv AUTH_ACCESS_TOKEN_CLASS to the literal value eddsa" }}
          {{- end }}
          {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- /*
          CHAOS-6188: web.extraVolumeMounts renders in every environment (the
          Ed25519 ACR web-assertion signing key is a Secret volume mount web
          needs in production), while web.localDevelopment.extraVolumeMounts
          stays gated behind localDevelopment.enabled. Both feed ONE
          volumeMounts key -- never two -- so they merge instead of the
          second clobbering the first.
          */}}
          {{- $webVolumeMounts := .Values.web.extraVolumeMounts | default (list) }}
          {{- if .Values.web.localDevelopment.enabled }}
          {{- $webVolumeMounts = concat $webVolumeMounts (.Values.web.localDevelopment.extraVolumeMounts | default (list)) }}
          {{- end }}
          {{- with $webVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- $webVolumes := .Values.web.extraVolumes | default (list) }}
      {{- if .Values.web.localDevelopment.enabled }}
      {{- $webVolumes = concat $webVolumes (.Values.web.localDevelopment.extraVolumes | default (list)) }}
      {{- end }}
      {{- range $webVolumes }}
      {{- with .secret }}
      {{- include "dev-health.webSecretGuard" (dict "ctx" $ "name" .secretName "key" "" "what" "a web secret volume") }}
      {{- range .items | default (list) }}{{- include "dev-health.webSecretGuard" (dict "ctx" $ "name" "" "key" .key "what" "a web secret volume item") }}{{- end }}
      {{- end }}
      {{- with .csi }}{{- with .nodePublishSecretRef }}
      {{- include "dev-health.webSecretGuard" (dict "ctx" $ "name" .name "key" "" "what" "a web csi nodePublishSecretRef") }}
      {{- end }}{{- end }}
      {{- with .projected }}{{- range .sources | default (list) }}{{- with .secret }}
      {{- include "dev-health.webSecretGuard" (dict "ctx" $ "name" .name "key" "" "what" "a web projected secret volume") }}
      {{- range .items | default (list) }}{{- include "dev-health.webSecretGuard" (dict "ctx" $ "name" "" "key" .key "what" "a web projected secret volume item") }}{{- end }}
      {{- end }}{{- end }}{{- end }}
      {{- end }}
      {{- with $webVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
