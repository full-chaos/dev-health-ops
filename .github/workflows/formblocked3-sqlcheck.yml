# Throwaway (never merged): executes BLOCKED-14297-3.pg.sql (W2 driver post-row gate read, synthetic fixture) in CI. Delete with the draft PR.
name: formblocked3-sqlcheck

on:
  pull_request:
    paths:
      - ".github/workflows/formblocked3-sqlcheck.yml"
      - "ci/formblocked3-sqlcheck/**"

permissions:
  contents: read
  packages: read

jobs:
  pg-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to the image mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Run the PG cell
        env:
          PG_IMAGE: ghcr.io/full-chaos/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        run: bash ci/formblocked3-sqlcheck/pg_run.sh
