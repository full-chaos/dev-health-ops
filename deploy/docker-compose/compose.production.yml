# Go/River worker topology (CHAOS-5589: folded in as this file's
# unconditional default, the same shape CHAOS-3088 gave root compose.yml --
# Go workers default, no Celery services, no opt-in profile). Independently
# maintained copy of deploy/docker-compose/compose.go-workers.yml, which
# still exists separately for reference/diffing; the two are edited apart.
#
# `docker compose config` renders `command:` verbatim, so the deployed
# configuration of every service below is readable in one place instead of
# being reconstructed from a host .env file. Each shared flag is defined
# once as a YAML anchor and referenced per service, so the value has a
# single source and the rendered output still names it explicitly for every
# container.
#
# `environment:` keeps only credentials. A DSN or a token passed as a
# process argument is readable through `ps`, `docker inspect`, and this very
# `docker compose config` output, so those stay in the environment on
# purpose; `--help` documents them as environment-only.
x-go-worker-flag:
  http-addr: &flag-http-addr "--http-addr=:8080"
  river-schema: &flag-river-schema "--river-schema=${RIVER_DATABASE_SCHEMA:-river}"
  domain-role: &flag-domain-role "--domain-database-role=${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}"
  queue-role: &flag-queue-role "--queue-database-role=${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}"
  queue-mode: &flag-queue-mode "--queue-database-mode=${WORKER_DATABASE_MODE:-session}"
  coordinator-mode: &flag-coordinator-mode "--coordinator-database-mode=${COORDINATOR_DATABASE_MODE:-session}"
  domain-pooler: &flag-domain-pooler "--domain-transaction-pooler=${PGBOUNCER_TRANSACTION_MODE:-true}"
  # The PagerDuty stream runner forwards reconciliation to the Python worker
  # bridge until the locked-graph port lands (CUT-20), so it cannot open
  # readiness without a bridge URL.
  bridge-url: &flag-bridge-url "--operational-bridge-url=${WORKER_OPERATIONAL_BRIDGE_URL:-http://api:8000}"
  # go-worker-heavy is the only worker group whose queue set includes
  # `metrics` -- i.e. the only one that ever calls the daily/remaining
  # metrics compatibility bridge (CHAOS-4264/4316/4317/4350). Every other
  # group's operational-bridge traffic stays on `api` via the shared
  # `flag-bridge-url` above; only this group's flag is repointed at the
  # dedicated `metrics-api` service (CHAOS-4351).
  bridge-url-heavy: &flag-bridge-url-heavy "--operational-bridge-url=${DEV_HEALTH_METRICS_BRIDGE_URL:-http://metrics-api:8000}"
  # The default bridge endpoint above is a plaintext Compose service-discovery
  # name, which the runtime rejects unless this opt-in is set. Override to
  # false once the bridge is reachable over an internal HTTPS origin.
  bridge-insecure: &flag-bridge-insecure "--operational-bridge-allow-insecure=${WORKER_OPERATIONAL_BRIDGE_ALLOW_INSECURE:-true}"
  log-level: &flag-log-level "--log-level=${LOG_LEVEL:-info}"

# Credentials only. Everything else moved into `command:` above.
x-go-worker-env-base: &go-worker-env-base
  POSTGRES_URI: ${POSTGRES_URI:?transaction-pooler domain PostgreSQL URI is required}
  WORKER_DATABASE_URI: ${WORKER_DATABASE_URI:?session-pooler queue-control PostgreSQL URI is required}
  # Port 9000 is the NATIVE protocol, not 8123. Python's CLICKHOUSE_URI speaks
  # HTTP through clickhouse-connect; the Go worker speaks the native wire
  # protocol through clickhouse-go and eagerly Ping()s at construction, so the
  # same variable name must resolve to a different port for these containers.
  CLICKHOUSE_URI: clickhouse://${CLICKHOUSE_USER:-ch}:${CLICKHOUSE_PASSWORD:-ch}@clickhouse:9000/${CLICKHOUSE_DB:-default}
  VALKEY_URI: redis://valkey:6379/1
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?provider credential encryption key is required}
  WORKER_OPERATIONAL_BRIDGE_TOKEN: ${WORKER_OPERATIONAL_BRIDGE_TOKEN:-}
  AUTO_RUN_MIGRATIONS: "false"
  # CHAOS-4587: every process below reads operational_incidents (or a sibling
  # canonical operational table) through the ordering-contract guard, but
  # previously had no way to receive this variable at all. The default HERE
  # stays 1 (rollout-safe, matches the binary's own omitted default); only an
  # explicit OPERATIONAL_ORDERING_CONTRACT=2 in the environment (set for the
  # migrate job AND every worker in the SAME deploy pass) should ever flip
  # it. See deploy/go-workers/README.md's rollout note before changing this.
  OPERATIONAL_ORDERING_CONTRACT: ${OPERATIONAL_ORDERING_CONTRACT:-1}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest@sha256:d7556a3841027651307b5aa08d72b5c467d0241d3db5b67d9e158ef3975626f5
    container_name: dev-health-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_LISTEN_HOST: "0.0.0.0"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ch}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ch}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - dev-health

  valkey:
    image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    container_name: dev-health-valkey
    restart: unless-stopped
    command: >
      valkey-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - dev-health

  # ===========================================================================
  # Database migrations (one-shot — runs before app services)
  # ===========================================================================
  # Applies PostgreSQL (Alembic, when POSTGRES_URI is set) and ClickHouse
  # schema migrations, then exits 0. App services gate on this completing
  # successfully via depends_on.condition: service_completed_successfully and
  # run with AUTO_RUN_MIGRATIONS=false so they never ambient-migrate
  # (CHAOS-2304 — migration 042+ does shadow-table rebuilds that are not safe
  # to run concurrently from workers).
  #
  # POSTGRES_URI must point DIRECTLY at Postgres (port 5432), never at a
  # transaction-mode pooler (PgBouncer/RDS Proxy): migrations run raw DDL.
  # See docs/operate/configure/databases-and-storage.md.
  #
  # OPERATOR RECOVERY — failed migrate run: with restart: "no", a failed
  # migrate is NOT retried, and api/billing-edge/worker stay gated (Created,
  # never started) until it completes successfully. To inspect and re-run:
  #
  #   docker compose -f compose.production.yml logs migrate   # why it failed
  #   docker compose -f compose.production.yml up migrate     # re-run just migrations
  #   docker compose -f compose.production.yml up -d          # then start the rest
  #
  # `dev-hops migrate clickhouse status` (read-only) shows applied vs pending
  # migrations; `--check` makes it exit 1 while any migration is pending.
  migrate:
    image: ${DEV_HEALTH_IMAGE:-ghcr.io/your-org/dev-health-ops:latest}
    container_name: dev-health-migrate
    restart: "no"
    entrypoint:
      - sh
      - -c
      - >-
        if [ -z "$${MIGRATION_DATABASE_URI:-}" ];
        then unset MIGRATION_DATABASE_URI; fi;
        if [ -n "$$POSTGRES_URI" ]
        || [ "$${MIGRATION_DATABASE_URI+x}" = x ]
        || [ "$${MIGRATION_DATABASE_URI_FILE+x}" = x ];
        then dev-hops migrate postgres; fi
        && dev-hops migrate clickhouse
    environment:
      # Direct Postgres URI (5432), NOT pgbouncer — empty skips the Alembic step.
      POSTGRES_URI: ${POSTGRES_URI:-}
      # Dedicated elevated DSN activates the pinned River migration step.
      MIGRATION_DATABASE_URI: ${MIGRATION_DATABASE_URI:-}
      DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER: ${DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER:-}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      # CHAOS-4587 (codex delta round 2, P1): migration 067 checks this same
      # variable to decide whether to apply the ordering-contract cutover
      # (src/dev_health_ops/migrations/clickhouse/067_operational_ordering_contract.py) --
      # without a reference here, an operator's shell export never reaches
      # this container, 067 silently defers ("successfully"), and workers
      # wired to the same export (compose.go-workers.yml) start against a
      # still-contract-1 table. Must move with the worker export in the
      # same deploy pass; see deploy/go-workers/README.md.
      OPERATIONAL_ORDERING_CONTRACT: ${OPERATIONAL_ORDERING_CONTRACT:-1}
      CLICKHOUSE_URI: clickhouse://${CLICKHOUSE_USER:-ch}:${CLICKHOUSE_PASSWORD:-ch}@clickhouse:8123/${CLICKHOUSE_DB:-default}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - dev-health

  api:
    image: ${DEV_HEALTH_IMAGE:-ghcr.io/your-org/dev-health-ops:latest}
    container_name: dev-health-api
    restart: unless-stopped
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    environment:
      POSTGRES_URI: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      DATABASE_URI: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      CLICKHOUSE_URI: clickhouse://${CLICKHOUSE_USER:-ch}:${CLICKHOUSE_PASSWORD:-ch}@clickhouse:8123/${CLICKHOUSE_DB:-default}
      REDIS_URL: redis://valkey:6379/1
      CELERY_BROKER_URL: redis://valkey:6379/0
      CELERY_RESULT_BACKEND: redis://valkey:6379/0
      # CHAOS-5589: Go/River is this file's unconditional default now, so
      # /health/workers is Go-fleet-authoritative -- see api/_health.py.
      EXPECTED_WORKER_GROUPS: ${EXPECTED_WORKER_GROUPS:-heavy,ops,sync,sync-provider}
      GRAPHQL_QUERY_TIMEOUT: ${GRAPHQL_QUERY_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROVIDER_SYNC_QUEUES_ENABLED: ${PROVIDER_SYNC_QUEUES_ENABLED:-true}
      SYNC_COST_CLASS_QUEUES: ${SYNC_COST_CLASS_QUEUES:-true}
      HIDE_MIGRATED_CHILD_CONFIGS: ${HIDE_MIGRATED_CHILD_CONFIGS:-true}
      SYNC_RUN_MAX_UNITS: ${SYNC_RUN_MAX_UNITS:-1000}
      SYNC_UNIT_CONCURRENCY_PER_BUCKET: ${SYNC_UNIT_CONCURRENCY_PER_BUCKET:-8}
      SYNC_UNIT_DISPATCH_STALE_SECONDS: ${SYNC_UNIT_DISPATCH_STALE_SECONDS:-900}
      SYNC_UNIT_RUNNING_STALE_SECONDS: ${SYNC_UNIT_RUNNING_STALE_SECONDS:-3600}
      LINEAR_BACKFILL_MAX_WINDOW_DAYS: ${LINEAR_BACKFILL_MAX_WINDOW_DAYS:-14}
      SYNC_UNIT_EXPIRED_LEASE_MAX_RETRIES: ${SYNC_UNIT_EXPIRED_LEASE_MAX_RETRIES:-1}
      SYNC_UNIT_EXPIRED_LEASE_RETRY_BACKOFF_SECONDS: ${SYNC_UNIT_EXPIRED_LEASE_RETRY_BACKOFF_SECONDS:-60}
      SYNC_DISPATCH_REDISPATCH_COUNTDOWN: ${SYNC_DISPATCH_REDISPATCH_COUNTDOWN:-60}
      SYNC_OUTBOX_CLAIM_TIMEOUT_SECONDS: ${SYNC_OUTBOX_CLAIM_TIMEOUT_SECONDS:-300}
      SYNC_WATERMARK_OVERLAP: ${SYNC_WATERMARK_OVERLAP:-0}
      SYNC_BUDGET_BUCKET_LIMITS: ${SYNC_BUDGET_BUCKET_LIMITS:-}
      SYNC_BUDGET_DEFAULT_LIMIT: ${SYNC_BUDGET_DEFAULT_LIMIT:-1000000}
      SYNC_BUDGET_DEFERRAL_SECONDS: ${SYNC_BUDGET_DEFERRAL_SECONDS:-60}
      SYNC_BUDGET_DEFERRAL_JITTER_SECONDS: ${SYNC_BUDGET_DEFERRAL_JITTER_SECONDS:-5}
      SYNC_BUDGET_DRY_RUN_BUCKET_LIMITS: ${SYNC_BUDGET_DRY_RUN_BUCKET_LIMITS:-}
      SYNC_BUDGET_DRY_RUN_DEFAULT_LIMIT: ${SYNC_BUDGET_DRY_RUN_DEFAULT_LIMIT:-1000000}
      SYNC_BUDGET_DRY_RUN_DEFERRAL_SECONDS: ${SYNC_BUDGET_DRY_RUN_DEFERRAL_SECONDS:-60}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-https://api.github.com}
      GITHUB_LINEAR_LINKBACK_BOTS: ${GITHUB_LINEAR_LINKBACK_BOTS:-linear[bot]}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TRUSTED_SCM_HOSTS: ${LINEAR_TRUSTED_SCM_HOSTS:-}
      # The API serves the worker operational bridge and authenticates the Go
      # caller against this shared token; without it every bridge call from
      # the PagerDuty stream runner is rejected with 401.
      WORKER_OPERATIONAL_BRIDGE_TOKEN: ${WORKER_OPERATIONAL_BRIDGE_TOKEN:-}
      # Schema is applied by the one-shot `migrate` service (gated via
      # depends_on) — the API must never run migrations itself (CHAOS-2304).
      AUTO_RUN_MIGRATIONS: "false"
      # CHAOS-4264: bounds the daily/remaining metrics compatibility
      # bridge's runner subprocess (worker_metrics_runner), independent of
      # this service's own `deploy.resources.limits.memory` below (which the
      # runner shares with the API process itself -- the incident this
      # closes was the runner alone reaching 1.7 GB inside this container).
      # CHAOS-4361: enforced primarily by the PARENT polling the runner's
      # real RSS (/proc/<pid>/status) and killing it on breach -- the
      # runner's own self-imposed RLIMIT_AS is now only a generous backstop
      # (4x this value), since RLIMIT_AS counts virtual address space, not
      # resident memory, and false-fired well under this bound in prod.
      # Hitting either bound raises a classified MemoryError instead of
      # leaving the container-wide cgroup OOM killer as the only thing that
      # notices -- see deploy/go-workers/README.md "Daily-metrics
      # compatibility bridge". Do NOT raise the limit below to "fix" this;
      # it bounds the runner underneath whatever that limit already is.
      # 640 MiB leaves ~384 MiB for the API process under THIS file's 1G
      # limit; paired with
      # DEV_HEALTH_METRICS_RUNNER_MAX_CONCURRENCY (default 1) it is the WHOLE
      # per-runner budget, not a slice of a larger aggregate (codex R1: a
      # per-runner limit alone is not an aggregate bound without a
      # concurrency cap). If this service's real deployed container limit
      # differs from the 1G configured here (see the README section above),
      # both env vars must be set explicitly for that limit -- do not assume
      # this default is correct for a differently-sized deployment.
      DEV_HEALTH_METRICS_RUNNER_MEMORY_LIMIT_BYTES: ${DEV_HEALTH_METRICS_RUNNER_MEMORY_LIMIT_BYTES:-671088640}
      DEV_HEALTH_METRICS_RUNNER_MAX_CONCURRENCY: ${DEV_HEALTH_METRICS_RUNNER_MAX_CONCURRENCY:-1}
      # CHAOS-3092: the CHAOS-4316 daily-partition progress-stall watchdog
      # these three env vars used to configure is deleted outright from
      # worker_metrics.py -- it existed only to bound a hung daily bridge
      # subprocess, and that bridge (execute_daily_metrics) has no callers
      # left, every daily family being native Go now.
      # CHAOS-4350: hard row cap for ClickHouseDataLoader testops reads
      # (test_suite_results/test_case_results). Without this reaching the
      # runner container, an operator raising it in the host env/.env per
      # the guard's own exception message has no effect (codex R2) -- the
      # child process only sees vars this block passes through.
      DEV_HEALTH_TESTOPS_LOADER_MAX_ROWS: ${DEV_HEALTH_TESTOPS_LOADER_MAX_ROWS:-200000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dev-health
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
          # CHAOS-4317: same formula/rationale as ops/compose.yml's
          # dev-stack copy of this block (see that file for the full
          # comment) -- without an explicit pids limit here, this
          # production reference's container-level cgroup pids.max is
          # unbounded, so worker_metrics.py's capacity reader falls
          # through to the host-wide kernel.threads-max fallback instead
          # of a real, container-scoped number. Codex review flagged
          # (2026-08-26) that this production surface was missed in the
          # first pass -- fixed here, under deploy.resources.limits (not
          # the top-level `pids_limit` key) because this file already uses
          # the deploy.resources block for memory/cpus, and modern Compose
          # treats the two spellings as aliases that must agree if both
          # are present -- setting only the top-level key here conflicted
          # with this block. `compose.go-workers.yml`'s `api:` overlay
          # merges onto this service and does not redefine it, so this one
          # edit covers both the Celery-only and Go-workers-enabled paths.
          pids: ${DEV_HEALTH_API_PIDS_LIMIT:-256}
        reservations:
          memory: 256M
          cpus: "0.1"

  # CHAOS-4351: a second copy of `api` -- same image, same command, same
  # environment -- serving ONLY as the Go daily-runtime's metrics
  # compatibility bridge target. No route split, no code change:
  # worker_metrics.py's bridge routes are exposed on `api` too, this is
  # just a separate process/cgroup so a bridge-side pids/memory incident
  # (CHAOS-4264, CHAOS-4317, CHAOS-4350) can no longer take unrelated `api`
  # request handling down with it. `compose.go-workers.yml` points
  # `go-worker-heavy` (the one worker group that actually calls the
  # metrics compatibility bridge -- confirmed via `rg 'queues='` against
  # every go-worker-*/go-reconciler/go-scheduler/go-stream-* service, no
  # other group's queue set includes `metrics`) at this service instead of
  # `api`; every other go-worker-* group is unaffected and stays on `api`.
  #
  # Deliberately NO `ports:` here (team-lead ruling, unlike the dev-stack
  # copy in ops/compose.yml which exposes 8020 for local debugging) --
  # this service is reachable ONLY via the internal `dev-health` network's
  # DNS name `metrics-api`. That absence IS the "no public route"; there
  # is no traefik or ingress layer in this compose file to additionally
  # exclude it from.
  #
  # CHAOS-5589: Go workers are this file's unconditional default now (no
  # more `--profile go-workers` opt-in), and go-worker-heavy always depends
  # on this service being healthy -- so it is unconditional too.
  metrics-api:
    image: ${DEV_HEALTH_IMAGE:-ghcr.io/your-org/dev-health-ops:latest}
    container_name: dev-health-metrics-api
    restart: unless-stopped
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    environment:
      POSTGRES_URI: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      DATABASE_URI: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      CLICKHOUSE_URI: clickhouse://${CLICKHOUSE_USER:-ch}:${CLICKHOUSE_PASSWORD:-ch}@clickhouse:8123/${CLICKHOUSE_DB:-default}
      REDIS_URL: redis://valkey:6379/1
      CELERY_BROKER_URL: redis://valkey:6379/0
      CELERY_RESULT_BACKEND: redis://valkey:6379/0
      GRAPHQL_QUERY_TIMEOUT: ${GRAPHQL_QUERY_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROVIDER_SYNC_QUEUES_ENABLED: ${PROVIDER_SYNC_QUEUES_ENABLED:-true}
      SYNC_COST_CLASS_QUEUES: ${SYNC_COST_CLASS_QUEUES:-true}
      HIDE_MIGRATED_CHILD_CONFIGS: ${HIDE_MIGRATED_CHILD_CONFIGS:-true}
      SYNC_RUN_MAX_UNITS: ${SYNC_RUN_MAX_UNITS:-1000}
      SYNC_UNIT_CONCURRENCY_PER_BUCKET: ${SYNC_UNIT_CONCURRENCY_PER_BUCKET:-8}
      SYNC_UNIT_DISPATCH_STALE_SECONDS: ${SYNC_UNIT_DISPATCH_STALE_SECONDS:-900}
      SYNC_UNIT_RUNNING_STALE_SECONDS: ${SYNC_UNIT_RUNNING_STALE_SECONDS:-3600}
      LINEAR_BACKFILL_MAX_WINDOW_DAYS: ${LINEAR_BACKFILL_MAX_WINDOW_DAYS:-14}
      SYNC_UNIT_EXPIRED_LEASE_MAX_RETRIES: ${SYNC_UNIT_EXPIRED_LEASE_MAX_RETRIES:-1}
      SYNC_UNIT_EXPIRED_LEASE_RETRY_BACKOFF_SECONDS: ${SYNC_UNIT_EXPIRED_LEASE_RETRY_BACKOFF_SECONDS:-60}
      SYNC_DISPATCH_REDISPATCH_COUNTDOWN: ${SYNC_DISPATCH_REDISPATCH_COUNTDOWN:-60}
      SYNC_OUTBOX_CLAIM_TIMEOUT_SECONDS: ${SYNC_OUTBOX_CLAIM_TIMEOUT_SECONDS:-300}
      SYNC_WATERMARK_OVERLAP: ${SYNC_WATERMARK_OVERLAP:-0}
      SYNC_BUDGET_BUCKET_LIMITS: ${SYNC_BUDGET_BUCKET_LIMITS:-}
      SYNC_BUDGET_DEFAULT_LIMIT: ${SYNC_BUDGET_DEFAULT_LIMIT:-1000000}
      SYNC_BUDGET_DEFERRAL_SECONDS: ${SYNC_BUDGET_DEFERRAL_SECONDS:-60}
      SYNC_BUDGET_DEFERRAL_JITTER_SECONDS: ${SYNC_BUDGET_DEFERRAL_JITTER_SECONDS:-5}
      SYNC_BUDGET_DRY_RUN_BUCKET_LIMITS: ${SYNC_BUDGET_DRY_RUN_BUCKET_LIMITS:-}
      SYNC_BUDGET_DRY_RUN_DEFAULT_LIMIT: ${SYNC_BUDGET_DRY_RUN_DEFAULT_LIMIT:-1000000}
      SYNC_BUDGET_DRY_RUN_DEFERRAL_SECONDS: ${SYNC_BUDGET_DRY_RUN_DEFERRAL_SECONDS:-60}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_BASE_URL: ${GITHUB_BASE_URL:-https://api.github.com}
      GITHUB_LINEAR_LINKBACK_BOTS: ${GITHUB_LINEAR_LINKBACK_BOTS:-linear[bot]}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TRUSTED_SCM_HOSTS: ${LINEAR_TRUSTED_SCM_HOSTS:-}
      WORKER_OPERATIONAL_BRIDGE_TOKEN: ${WORKER_OPERATIONAL_BRIDGE_TOKEN:-}
      AUTO_RUN_MIGRATIONS: "false"
      DEV_HEALTH_METRICS_RUNNER_MEMORY_LIMIT_BYTES: ${DEV_HEALTH_METRICS_RUNNER_MEMORY_LIMIT_BYTES:-671088640}
      DEV_HEALTH_METRICS_RUNNER_MAX_CONCURRENCY: ${DEV_HEALTH_METRICS_RUNNER_MAX_CONCURRENCY:-1}
      DEV_HEALTH_TESTOPS_LOADER_MAX_ROWS: ${DEV_HEALTH_TESTOPS_LOADER_MAX_ROWS:-200000}
    depends_on:
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dev-health
    deploy:
      resources:
        # CHAOS-4351 (team-lead ruling): identical to `api`'s own limits
        # above -- same image, same workload, and the whole point of the
        # split is an explicit, equal-sized bound so a bridge-side OOM
        # inside THIS container cannot also take `api` down with it.
        limits:
          memory: 1G
          cpus: "0.5"
          pids: ${DEV_HEALTH_API_PIDS_LIMIT:-256}
        reservations:
          memory: 256M
          cpus: "0.1"

  billing-edge:
    image: ${DEV_HEALTH_IMAGE:-ghcr.io/your-org/dev-health-ops:latest}
    container_name: dev-health-billing-edge
    restart: unless-stopped
    command:
      - python
      - -m
      - uvicorn
      - dev_health_ops.api.billing_edge:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      POSTGRES_URI: ${POSTGRES_URI:-}
      # CHAOS-2065: set true when POSTGRES_URI points at a transaction-mode
      # pooler (PgBouncer/RDS Proxy/etc). See docs/operate/configure/databases-and-storage.md.
      PGBOUNCER_TRANSACTION_MODE: ${PGBOUNCER_TRANSACTION_MODE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_TEAM: ${STRIPE_PRICE_ID_TEAM:-}
      STRIPE_PRICE_ID_ENTERPRISE: ${STRIPE_PRICE_ID_ENTERPRISE:-}
      LICENSE_PRIVATE_KEY: ${LICENSE_PRIVATE_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BILLING_EDGE_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dev-health
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"

  # ---------------------------------------------------------------------------
  # Go/River worker fleet (CHAOS-5589). The Celery/Beat fleet this replaced
  # (worker, worker-ingest, worker-external-ingest, worker-heavy, beat;
  # ARCHIVED CHAOS-4164) is deleted outright, not merely archived-in-place --
  # R146: Celery transport is not a rollback target, and no consumer has run
  # since 2026-08-19 (CHAOS-4026). Independently maintained copy of
  # deploy/docker-compose/compose.go-workers.yml's services, folded in here
  # as the unconditional default the same way CHAOS-3088 folded them into
  # root compose.yml.
  # ---------------------------------------------------------------------------

  # The canonical Python migrate service owns Alembic and ClickHouse. Re-run
  # role provisioning only after it completes so guarded grants see every
  # current semantic table, including an already-initialized volume.
  go-river-provision:
    image: ${DEV_HEALTH_IMAGE:-ghcr.io/your-org/dev-health-ops:latest}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_DOMAIN_DATABASE_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:?set RIVER_DOMAIN_DATABASE_PASSWORD}
      RIVER_QUEUE_DATABASE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:?set RIVER_QUEUE_DATABASE_PASSWORD}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:?set RIVER_COORDINATOR_DATABASE_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        exec psql \
          --host="${POSTGRES_HOST:?set POSTGRES_HOST}" \
          --username="${POSTGRES_USER:?set POSTGRES_USER}" \
          --dbname="${POSTGRES_DB:?set POSTGRES_DB}" \
          --set=domain_role="$$RIVER_DOMAIN_DATABASE_ROLE" \
          --set=queue_role="$$RIVER_QUEUE_DATABASE_ROLE" \
          --set=coordinator_role="$$RIVER_COORDINATOR_DATABASE_ROLE" \
          --set=domain_password="$$RIVER_DOMAIN_DATABASE_PASSWORD" \
          --set=queue_password="$$RIVER_QUEUE_DATABASE_PASSWORD" \
          --set=coordinator_password="$$RIVER_COORDINATOR_DATABASE_PASSWORD" \
          --file=/usr/local/share/dev-health/provision_river_roles.sql
    networks: [dev-health]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Apply the pinned River bundle with the elevated local/admin DSN, then
  # independently check that the resulting schema is current. Neither DSN nor
  # this binary is exposed to a long-running Go service. `image:` pins a
  # published tag/digest for a production pull; `build:` lets an operator
  # build this tree locally on request (`docker compose build`/`up --build`).
  #
  # CHAOS-5568: component form, not a shell-assembled URI. A generated
  # password containing `#`/`%`/etc. broke the old
  # `postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@...` shell fallback --
  # `cmd/dev-health-worker-migrate`'s `resolveMigrationDatabaseURI` now
  # assembles this DSN internally via stdlib `net/url`, so no component
  # needs shell escaping and no fallback is needed. Matches root
  # compose.yml's current go-river-migrate shape.
  go-river-migrate:
    image: ${DEV_HEALTH_IMAGE:-ghcr.io/your-org/dev-health-ops:latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runner
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    entrypoint:
      - /bin/sh
      - -ec
      - dev-health-worker-migrate && dev-health-worker-migrate --check
    environment:
      DEV_HEALTH_MIGRATION_PG_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST}
      DEV_HEALTH_MIGRATION_PG_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      DEV_HEALTH_MIGRATION_PG_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DEV_HEALTH_MIGRATION_PG_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      # This service never forwarded the coordinator role/password by
      # default, unlike go-river-provision just above it -- overriding
      # RIVER_COORDINATOR_DATABASE_ROLE away from its default then fails
      # migration since dev-health-worker-migrate applies the privilege
      # policy against the unexported default name instead.
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
    networks: [dev-health]
    depends_on:
      go-river-provision:
        condition: service_completed_successfully

  # Validate the exact checked-in job registry and worker manifest before
  # Compose is allowed to start any long-running Go process.
  go-contractcheck:
    image: ${DEV_HEALTH_GO_CONTRACTCHECK_IMAGE:-ghcr.io/full-chaos/dev-health-go-contractcheck:latest}
    build:
      context: ../..
      dockerfile: docker/go-worker.Dockerfile
      target: contractcheck
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    command: [validate]
    depends_on:
      go-river-migrate:
        condition: service_completed_successfully

  go-worker-heavy: &go-worker
    image: ${DEV_HEALTH_GO_WORKER_IMAGE:-ghcr.io/full-chaos/dev-health-go-worker:latest}
    labels:
      dev-health.io/worker-group: heavy
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    command:
      - --queues=investment,metrics,reports,workgraph
      - --queue-concurrency=investment=1,metrics=2,reports=2,workgraph=1
      - --worker-group=heavy
      - --shutdown-timeout=7260s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url-heavy
      - *flag-bridge-insecure
      - *flag-log-level
    environment: &go-worker-env
      <<: *go-worker-env-base
    networks: [dev-health]
    stop_grace_period: 7260s
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
      metrics-api:
        condition: service_healthy
    deploy: &go-worker-resources
      replicas: 1
      resources:
        limits: {cpus: "1.0", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}

  go-worker-ops:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: ops
    command:
      - --queues=coverage,heartbeat,retention,webhooks
      - --queue-concurrency=coverage=1,heartbeat=1,retention=1,webhooks=4
      - --worker-group=ops
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    # Explicit override (not a merge): this group does not touch the metrics
    # queue, so it does not inherit the shared anchor's metrics-api
    # dependency and does not start metrics-api on a targeted bring-up of
    # just this service.
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  # This worker group selects both registered sync queues. Its queue set is a
  # group choice, not a runtime profile.
  go-worker-sync:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: sync
    command:
      - --queues=sync
      - --queue-concurrency=sync=4
      - --worker-group=sync
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  # sync_provider is its own process: startup validation requires selected
  # queues to equal constructed queues, and buildProviderSyncWorker
  # constructs nothing while every provider route is default-off, so a
  # combined service cannot start in this manifest's default state.
  go-worker-sync-provider:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: sync-provider
    command:
      - --queues=sync_provider
      - --queue-concurrency=sync_provider=2
      - --worker-group=sync-provider
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  go-reconciler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_RECONCILER_IMAGE:-ghcr.io/full-chaos/dev-health-go-reconciler:latest}
    labels:
      dev-health.io/worker-group: reconciler
    # CHAOS-3092 made "no Celery consumer serves provider units" true of
    # every deployment, which is exactly the assertion SweepModeActive
    # encodes -- so the sweep ships ACTIVE rather than as an operator opt-in.
    command:
      - --shutdown-timeout=60s
      - --unreclaimable-sweep=${SYNC_UNRECLAIMABLE_SWEEP:-active}
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
      COORDINATOR_DATABASE_URI: ${COORDINATOR_DATABASE_URI:?session-pooler coordinator PostgreSQL URI is required}
    stop_grace_period: 60s

  go-scheduler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_SCHEDULER_IMAGE:-ghcr.io/full-chaos/dev-health-go-scheduler:latest}
    labels:
      dev-health.io/worker-group: scheduler
    command:
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
      COORDINATOR_DATABASE_URI: ${COORDINATOR_DATABASE_URI:?session-pooler coordinator PostgreSQL URI is required}
    stop_grace_period: 60s

  go-stream-external:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    labels:
      dev-health.io/worker-group: stream-external
    command:
      - --profile=external
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s

  go-stream-ingest:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    labels:
      dev-health.io/worker-group: stream-ingest
    command:
      - --profile=ingest
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s

  # PagerDuty webhook delivery is independently routable from dataset sync, so
  # it runs as its own stream family rather than sharing the external runner.
  go-stream-pagerduty:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    labels:
      dev-health.io/worker-group: stream-pagerduty
    command:
      - --profile=pagerduty
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s

  pgbouncer:
    # CHAOS-2065: transaction-mode pooler in front of a managed Postgres.
    # CHAOS-5589: the Go/River fleet's domain-role traffic depends_on this
    # service unconditionally (it is folded in as the default fleet now, no
    # opt-in profile), so this is unconditional too -- it is no longer only
    # an API-facing performance option an operator enables by hand. `api`/
    # `billing-edge`/`migrate` are unaffected: they still read Postgres
    # directly via their own POSTGRES_URI, unless an operator additionally
    # points them at pgbouncer:6432 and sets PGBOUNCER_TRANSACTION_MODE=true.
    # See docs/operate/configure/databases-and-storage.md
    image: edoburu/pgbouncer:latest
    container_name: dev-health-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB}
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      # CHAOS-3944: log_connections/log_disconnections default on and turn a
      # Go worker fleet's steady attach/detach churn into a continuous,
      # diagnostically worthless firehose (measured ~36 lines/min across the
      # three poolers in production). Keep log_pooler_errors and the default
      # log_stats ON: the once-a-minute stats line is the only real pooler
      # telemetry and it proved its worth in a live incident (wait
      # 5683209 us during trouble, wait 16136 us after recovery). Do not
      # "tidy away" that stats line.
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      LOG_POOLER_ERRORS: "1"
      # Healthcheck-only credential: PGPASSWORD is a libpq env var psql reads
      # automatically, so the healthcheck below never puts the password in
      # argv (visible to `docker inspect`/`ps`). Same value already used for
      # DB_PASSWORD above, not a new secret.
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    networks:
      - dev-health
    healthcheck:
      # CHAOS-3944: the original pg_isready probe had no -U/-d, so it probed
      # as OS user "postgres", which is not in PgBouncer's auth file, logging
      # "no such user: postgres" on every check AND STILL reporting healthy —
      # pg_isready treats an authentication rejection as "server responding",
      # not as a failure, no matter which username it's given. A pg_isready
      # probe therefore cannot prove the pooler can actually authenticate and
      # serve a query, only that something answers the port. Use `psql` to
      # run a real query through the pooler and out to the backend instead;
      # PGPASSWORD above supplies the password without it ever appearing in
      # process arguments. -w disables the interactive password prompt so a
      # missing/wrong password fails fast instead of hanging.
      test: ["CMD", "psql", "-w", "-h", "localhost", "-p", "6432", "-U", "${POSTGRES_USER:?set POSTGRES_USER}", "-d", "${POSTGRES_DB:?set POSTGRES_DB}", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # River listener/cancellation uses a session pool, never the transaction
  # endpoint above. DB_USER and DB_NAME are fixed, so DEFAULT_POOL_SIZE caps
  # the one relevant PgBouncer (database,user) backend pool.
  #
  # CHAOS-3945: this number is now DERIVED, not hand-maintained. The earlier
  # version of this comment enumerated the service list by hand and went stale
  # silently when services were added; it also charged every process three
  # backends, which the code does not support. internal/deploymentcontract
  # computes the figure from deploy/go-workers/deployment.json on every build
  # and rejects a pool that does not match, so the list lives where something
  # can actually read it. The formula:
  #
  #   A replica costs its queue-control pgxpool (WORKER_DATABASE_MAX_CONNS, 2)
  #   plus one River notifier LISTEN session -- but ONLY if it starts a River
  #   client. Traced to code, not assumed: only the "river" runtime does
  #   (cmd/dev-health-worker/river_process.go calls Client.Start). The
  #   "control" runtime builds a River client and drives it through the *Tx
  #   APIs, so no notifier attaches; the "stream" runtime opens no queue pool
  #   at all despite inheriting WORKER_DATABASE_URI from a YAML anchor; and
  #   go-workerctl is insert/cancel only.
  #
  #   go-worker-sync           river    2 replicas x (2 + 1) =  6
  #   go-worker-heavy          river    2 replicas x (2 + 1) =  6
  #   go-worker-ops            river    2 replicas x (2 + 1) =  6
  #   go-worker-sync-provider  river    2 replicas x (2 + 1) =  6
  #   go-reconciler            control  2 replicas x  2      =  4
  #   go-scheduler             control  2 replicas x  2      =  4
  #   go-workerctl             CLI      1 invocation x 2     =  2
  #   go-stream-external/-ingest/-pagerduty  no queue pool   =  0
  #                                                            ---
  #                                              declared max  34
  #   Rolling-restart reserve: each replica-bearing group above is its own
  #   independently rolled unit, so one image or config change surges ALL of
  #   them at once, each briefly running a replica beyond its declared maximum
  #   while the outgoing replica's sessions linger until server_idle_timeout.
  #   3+3+3+3 river, 2+2 control (workerctl is a one-shot invocation, not a
  #   rolled replica, and the streams cost nothing)              +16
  #                                                            ---
  #                                          DEFAULT_POOL_SIZE   50
  #
  # Adding a long-lived service on this endpoint means adding it to
  # deployment.json, which moves the number and fails the contract until this
  # default follows. Do not bump the number alone.
  pgbouncer-river-queue:
    # CHAOS-5589: unconditional -- every go-worker-*/go-reconciler/
    # go-scheduler service depends_on this being healthy, by default now.
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      DB_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:?set RIVER_QUEUE_DATABASE_PASSWORD}
      DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB}
      LISTEN_PORT: "6433"
      POOL_MODE: session
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: ${PGBOUNCER_RIVER_QUEUE_MAX_CLIENT_CONN:-128}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_RIVER_QUEUE_POOL_SIZE:-50}
      # CHAOS-3945: stats_users defaults empty and admin_users defaults to
      # "postgres", which is not in this pooler's auth file (only the River
      # queue role is) — so SHOW POOLS/CLIENTS/STATS were unreachable on
      # exactly the pooler where saturation matters most. Use STATS_USERS,
      # not ADMIN_USERS: stats_users grants only read-only SHOW commands,
      # while admin_users can PAUSE/KILL/SUSPEND/SHUTDOWN the pooler. The
      # River queue role is the same credential every Go worker replica
      # authenticates with for its normal database traffic, so granting it
      # admin would let any process (or anything that can open a connection
      # as that role) halt the shared pooler for the whole fleet, not just
      # read its stats.
      STATS_USERS: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      # CHAOS-3944: see pgbouncer above for why connection logging is off and
      # log_stats/log_pooler_errors stay on (5.7s vs 16ms wait during/after a
      # real incident, read off the once-a-minute stats line).
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      LOG_POOLER_ERRORS: "1"
      # See pgbouncer above: PGPASSWORD is read by the healthcheck's psql,
      # never appears in argv, and reuses the DB_PASSWORD secret above.
      PGPASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:?set RIVER_QUEUE_DATABASE_PASSWORD}
    ports:
      - "${PGBOUNCER_RIVER_QUEUE_PORT:-6433}:6433"
    networks: [dev-health]
    healthcheck:
      # CHAOS-3944: pg_isready cannot prove the pooler can authenticate and
      # serve a query — it reports healthy even on an auth rejection, no
      # matter the username (see pgbouncer above). Run a real query through
      # the pooler instead.
      test: ["CMD", "psql", "-w", "-h", "localhost", "-p", "6433", "-U", "${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}", "-d", "${POSTGRES_DB:?set POSTGRES_DB}", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Coordinator locks also need one stable session. This endpoint is separate
  # from queue control so each role has an independently auditable hard cap.
  pgbouncer-river-coordinator:
    # CHAOS-5589: unconditional -- go-reconciler/go-scheduler depends_on this
    # being healthy, by default now.
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      DB_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:?set RIVER_COORDINATOR_DATABASE_PASSWORD}
      DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB}
      LISTEN_PORT: "6434"
      POOL_MODE: session
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: ${PGBOUNCER_RIVER_COORDINATOR_MAX_CLIENT_CONN:-32}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_RIVER_COORDINATOR_POOL_SIZE:-14}
      # CHAOS-3945: same admin-console gap as the queue pooler above — set
      # STATS_USERS (read-only SHOW access), not ADMIN_USERS (which can
      # PAUSE/KILL/SHUTDOWN the pooler), to this pooler's own role so
      # SHOW POOLS/CLIENTS/STATS work without handing the runtime credential
      # console-admin power.
      STATS_USERS: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      # CHAOS-3944: see pgbouncer above for why connection logging is off and
      # log_stats/log_pooler_errors stay on (5.7s vs 16ms wait during/after a
      # real incident, read off the once-a-minute stats line).
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      LOG_POOLER_ERRORS: "1"
      # See pgbouncer above: PGPASSWORD is read by the healthcheck's psql,
      # never appears in argv, and reuses the DB_PASSWORD secret above.
      PGPASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:?set RIVER_COORDINATOR_DATABASE_PASSWORD}
    ports:
      - "${PGBOUNCER_RIVER_COORDINATOR_PORT:-6434}:6434"
    networks: [dev-health]
    healthcheck:
      # CHAOS-3944: pg_isready cannot prove the pooler can authenticate and
      # serve a query — it reports healthy even on an auth rejection, no
      # matter the username (see pgbouncer above). Run a real query through
      # the pooler instead.
      test: ["CMD", "psql", "-w", "-h", "localhost", "-p", "6434", "-U", "${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}", "-d", "${POSTGRES_DB:?set POSTGRES_DB}", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  clickhouse_data:
    driver: local
  valkey_data:
    driver: local

networks:
  dev-health:
    driver: bridge
