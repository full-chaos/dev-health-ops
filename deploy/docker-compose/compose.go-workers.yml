# Additive Go/River worker topology. This file is intentionally not included by
# compose.yml or compose.production.yml: operators must opt in explicitly.
#
# Coexistence:
#   docker compose -f compose.production.yml -f compose.go-workers.yml \
#     --profile go-workers up -d
#
# The checked-in routing contract remains Celery-owned. Starting these
# containers alone does not transfer a queue or scheduler ownership.
# CHAOS-4020: worker configuration is flags, not environment.
#
# `docker compose config` renders `command:` verbatim, so the deployed
# configuration of every service below is readable in one place instead of being
# reconstructed from a host .env file. Each shared flag is defined once as a
# YAML anchor and referenced per service, so the value has a single source and
# the rendered output still names it explicitly for every container.
#
# `environment:` keeps only credentials. A DSN or a token passed as a process
# argument is readable through `ps`, `docker inspect`, and this very
# `docker compose config` output, so those stay in the environment on purpose;
# `--help` documents them as environment-only.
x-go-worker-flag:
  http-addr: &flag-http-addr "--http-addr=:8080"
  river-schema: &flag-river-schema "--river-schema=${RIVER_DATABASE_SCHEMA:-river}"
  domain-role: &flag-domain-role "--domain-database-role=${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}"
  queue-role: &flag-queue-role "--queue-database-role=${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}"
  queue-mode: &flag-queue-mode "--queue-database-mode=${WORKER_DATABASE_MODE:-session}"
  coordinator-mode: &flag-coordinator-mode "--coordinator-database-mode=${COORDINATOR_DATABASE_MODE:-session}"
  domain-pooler: &flag-domain-pooler "--domain-transaction-pooler=${PGBOUNCER_TRANSACTION_MODE:-true}"
  # The PagerDuty stream runner forwards reconciliation to the Python worker
  # bridge until the locked-graph port lands (CUT-20), so it cannot open
  # readiness without a bridge URL.
  bridge-url: &flag-bridge-url "--operational-bridge-url=${WORKER_OPERATIONAL_BRIDGE_URL:-http://api:8000}"
  # CHAOS-4351: `go-worker-heavy` is the ONLY worker group whose queue set
  # includes `metrics` (confirmed via `rg 'queues='` against every
  # go-worker-*/go-reconciler/go-scheduler/go-stream-* service below) --
  # i.e. the only one that ever calls the daily/remaining metrics
  # compatibility bridge that spawns worker_metrics_runner subprocesses
  # (CHAOS-4264/4316/4317/4350's whole incident history). Every other
  # group's operational-bridge traffic (auth/licensing/sync/webhooks/etc.)
  # has nothing to do with that bridge and stays on `api` via the shared
  # `flag-bridge-url` above -- only this group's flag is repointed at the
  # dedicated `metrics-api` service (CHAOS-4351), so a bridge-side pids/
  # memory incident there can no longer take unrelated `api` request
  # handling, or unrelated go-worker groups' operational-bridge calls,
  # down with it.
  bridge-url-heavy: &flag-bridge-url-heavy "--operational-bridge-url=${DEV_HEALTH_METRICS_BRIDGE_URL:-http://metrics-api:8000}"
  # The default bridge endpoint above is a plaintext Compose service-discovery
  # name, which the runtime rejects unless this opt-in is set. Override to
  # false once the bridge is reachable over an internal HTTPS origin.
  bridge-insecure: &flag-bridge-insecure "--operational-bridge-allow-insecure=${WORKER_OPERATIONAL_BRIDGE_ALLOW_INSECURE:-true}"
  # Exactly one runtime owns the PagerDuty webhook stream. Celery keeps it
  # until the route flips at cutover (CUT-14/18).
  pagerduty-transport: &flag-pagerduty-transport "--pagerduty-webhook-transport=${PAGERDUTY_WEBHOOK_TRANSPORT:-celery}"
  log-level: &flag-log-level "--log-level=${LOG_LEVEL:-info}"

# Credentials only. Everything else moved into `command:` above.
x-go-worker-env-base: &go-worker-env-base
  POSTGRES_URI: ${POSTGRES_URI:?transaction-pooler domain PostgreSQL URI is required}
  WORKER_DATABASE_URI: ${WORKER_DATABASE_URI:?session-pooler queue-control PostgreSQL URI is required}
  # Port 9000 is the NATIVE protocol, not 8123. Python's CLICKHOUSE_URI speaks
  # HTTP through clickhouse-connect; the Go worker speaks the native wire
  # protocol through clickhouse-go and eagerly Ping()s at construction, so the
  # same variable name must resolve to a different port for these containers.
  # Pointing them at 8123 fails every ClickHouse-dependent group on first
  # scale-up (CHAOS-3872, and deploy/go-workers/README.md documents it).
  CLICKHOUSE_URI: clickhouse://${CLICKHOUSE_USER:-ch}:${CLICKHOUSE_PASSWORD:-ch}@clickhouse:9000/${CLICKHOUSE_DB:-default}
  VALKEY_URI: redis://valkey:6379/1
  # deploy/go-workers/deployment.json requires this for the sync group, and
  # provider-sync handler construction fails closed without it. Shared with the
  # Python services so both runtimes decrypt the same provider credentials.
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?provider credential encryption key is required}
  WORKER_OPERATIONAL_BRIDGE_TOKEN: ${WORKER_OPERATIONAL_BRIDGE_TOKEN:-}
  AUTO_RUN_MIGRATIONS: "false"

services:
  # CHAOS-3942: /health/workers is Celery-authoritative until it is told
  # otherwise. Merging this into the base compose.production.yml `api`
  # service is what tells it the declared river worker groups above are the
  # fleet to check instead -- so applying this overlay is what flips the
  # endpoint's authority, in the same change that stages the fleet it now
  # checks. Reconciler/scheduler/stream-* are excluded: they run a separate
  # role with their own /healthz and never register worker_instances
  # presence.
  api:
    environment:
      EXPECTED_WORKER_GROUPS: ${EXPECTED_WORKER_GROUPS:-heavy,ops,sync,sync-provider}

  # The canonical Python migrate service owns Alembic and ClickHouse. Re-run
  # role provisioning only after it completes so guarded grants see every
  # current semantic table, including an already-initialized local volume.
  go-river-provision:
    # The Ops runtime image, not a bare postgres client image: it carries both
    # psql and the provisioning SQL, so this step needs no source checkout.
    image: ${DEV_HEALTH_IMAGE:-ghcr.io/your-org/dev-health-ops:latest}
    profiles: [go-workers]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-devhealth}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_DOMAIN_DATABASE_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}
      RIVER_QUEUE_DATABASE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        exec psql \
          --host="${POSTGRES_HOST:-postgres}" \
          --username="${POSTGRES_USER:-devhealth}" \
          --dbname="${POSTGRES_DB:-devhealth}" \
          --set=domain_role="$$RIVER_DOMAIN_DATABASE_ROLE" \
          --set=queue_role="$$RIVER_QUEUE_DATABASE_ROLE" \
          --set=coordinator_role="$$RIVER_COORDINATOR_DATABASE_ROLE" \
          --set=domain_password="$$RIVER_DOMAIN_DATABASE_PASSWORD" \
          --set=queue_password="$$RIVER_QUEUE_DATABASE_PASSWORD" \
          --set=coordinator_password="$$RIVER_COORDINATOR_DATABASE_PASSWORD" \
          --file=/usr/local/share/dev-health/provision_river_roles.sql
    networks: [dev-health]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Apply the pinned River bundle with the elevated local/admin DSN, then
  # independently check that the resulting schema is current. Neither DSN nor
  # this binary is exposed to a long-running Go service.
  go-river-migrate:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: runner
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
    profiles: [go-workers]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        if [ -z "$$MIGRATION_DATABASE_URI" ];
        then export MIGRATION_DATABASE_URI="postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@$$POSTGRES_HOST:5432/$$POSTGRES_DB";
        fi;
        dev-health-worker-migrate
        && dev-health-worker-migrate --check
    environment:
      MIGRATION_DATABASE_URI: ${GO_WORKER_MIGRATION_DATABASE_URI:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-devhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devhealth}
      POSTGRES_DB: ${POSTGRES_DB:-devhealth}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
    networks: [dev-health]
    depends_on:
      go-river-provision:
        condition: service_completed_successfully

  # Validate the exact checked-in job registry and worker manifest before
  # Compose is allowed to start any long-running Go process.
  go-contractcheck:
    build:
      context: ../..
      dockerfile: docker/go-worker.Dockerfile
      target: contractcheck
    profiles: [go-workers]
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    command: [validate]
    depends_on:
      go-river-migrate:
        condition: service_completed_successfully

  go-worker-heavy: &go-worker
    image: ${DEV_HEALTH_GO_WORKER_IMAGE:-ghcr.io/full-chaos/dev-health-go-worker:latest}
    profiles: [go-workers]
    labels:
      dev-health.io/worker-group: heavy
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    command:
      - --queues=investment,metrics,reports,workgraph
      - --queue-concurrency=investment=1,metrics=2,reports=2,workgraph=1
      - --worker-group=heavy
      - --shutdown-timeout=7260s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      # CHAOS-4351: only this group gets the metrics-api-pointed flag --
      # see the anchor's own comment above for why.
      - *flag-bridge-url-heavy
      - *flag-bridge-insecure
      - *flag-pagerduty-transport
      - *flag-log-level
    environment: &go-worker-env
      <<: *go-worker-env-base
    networks: [dev-health]
    stop_grace_period: 7260s
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      # codex review (PR #1938, P1): this group's --operational-bridge-url
      # points at metrics-api, a separate profile-gated service with no
      # other dependency edge into it -- a targeted `docker compose up -d
      # go-worker-heavy` would otherwise start this worker with nothing
      # ever bringing metrics-api up, so every compatibility-bridge call
      # fails against a container that was never started. Gating on its
      # healthcheck (not just container-started) also means this worker
      # doesn't start dispatching metrics/workgraph jobs before the
      # bridge target can actually answer them.
      metrics-api:
        condition: service_healthy
    deploy: &go-worker-resources
      replicas: 0
      resources:
        limits: {cpus: "1.0", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}

  go-worker-ops:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: ops
    command:
      - --queues=coverage,heartbeat,retention,webhooks
      - --queue-concurrency=coverage=1,heartbeat=1,retention=1,webhooks=4
      - --worker-group=ops
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-pagerduty-transport
      - *flag-log-level
    # codex review (PR #1938, independent post-cap review): the shared
    # &go-worker anchor's own depends_on now includes metrics-api
    # (needed by go-worker-heavy only, for its --operational-bridge-url).
    # This service does not touch the metrics queue -- explicit override
    # (not a merge) so it does NOT inherit that dependency and does not
    # start metrics-api on a targeted `docker compose up -d` of just this
    # service.
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  # This worker group selects both registered sync queues. Its queue set is a
  # group choice, not a runtime profile.
  go-worker-sync:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: sync
    command:
      - --queues=sync
      - --queue-concurrency=sync=4
      - --worker-group=sync
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-pagerduty-transport
      - *flag-log-level
    # codex review (PR #1938, independent post-cap review): the shared
    # &go-worker anchor's own depends_on now includes metrics-api
    # (needed by go-worker-heavy only, for its --operational-bridge-url).
    # This service does not touch the metrics queue -- explicit override
    # (not a merge) so it does NOT inherit that dependency and does not
    # start metrics-api on a targeted `docker compose up -d` of just this
    # service.
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  # sync_provider is its own process, exactly as the Celery fleet splits
  # worker-ingest and worker-backfill out by queue. It is NOT fused into the
  # sync worker above: startup validation requires selected queues to equal
  # CONSTRUCTED queues, and buildProviderSyncWorker constructs nothing while
  # every provider route is default-off. A combined service therefore cannot
  # start in this manifest's own `coexistence_disabled` state -- it fails with
  # queue_coverage_validation_failed (CHAOS-3926). Split, the default state
  # starts clean and enabling provider routes is a scale-up, not a queue-list
  # edit across five renderers.
  go-worker-sync-provider:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: sync-provider
    command:
      - --queues=sync_provider
      - --queue-concurrency=sync_provider=2
      - --worker-group=sync-provider
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-pagerduty-transport
      - *flag-log-level
    # codex review (PR #1938, independent post-cap review): the shared
    # &go-worker anchor's own depends_on now includes metrics-api
    # (needed by go-worker-heavy only, for its --operational-bridge-url).
    # This service does not touch the metrics queue -- explicit override
    # (not a merge) so it does NOT inherit that dependency and does not
    # start metrics-api on a targeted `docker compose up -d` of just this
    # service.
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  go-reconciler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_RECONCILER_IMAGE:-ghcr.io/full-chaos/dev-health-go-reconciler:latest}
    labels:
      dev-health.io/worker-group: reconciler
    command:
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-pagerduty-transport
      - *flag-log-level
    # codex review (PR #1938, independent post-cap review): the shared
    # &go-worker anchor's own depends_on now includes metrics-api
    # (needed by go-worker-heavy only, for its --operational-bridge-url).
    # This service does not touch the metrics queue -- explicit override
    # (not a merge) so it does NOT inherit that dependency and does not
    # start metrics-api on a targeted `docker compose up -d` of just this
    # service.
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
    environment:
      <<: *go-worker-env-base
      COORDINATOR_DATABASE_URI: ${COORDINATOR_DATABASE_URI:?session-pooler coordinator PostgreSQL URI is required}
    stop_grace_period: 60s

  go-scheduler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_SCHEDULER_IMAGE:-ghcr.io/full-chaos/dev-health-go-scheduler:latest}
    labels:
      dev-health.io/worker-group: scheduler
    command:
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-pagerduty-transport
      - *flag-log-level
    # codex review (PR #1938, independent post-cap review): the shared
    # &go-worker anchor's own depends_on now includes metrics-api
    # (needed by go-worker-heavy only, for its --operational-bridge-url).
    # This service does not touch the metrics queue -- explicit override
    # (not a merge) so it does NOT inherit that dependency and does not
    # start metrics-api on a targeted `docker compose up -d` of just this
    # service.
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
    environment:
      <<: *go-worker-env-base
      COORDINATOR_DATABASE_URI: ${COORDINATOR_DATABASE_URI:?session-pooler coordinator PostgreSQL URI is required}
    stop_grace_period: 60s

  go-stream-external:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    labels:
      dev-health.io/worker-group: stream-external
    command:
      - --profile=external
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-pagerduty-transport
      - *flag-log-level
    # codex review (PR #1938, independent post-cap review): the shared
    # &go-worker anchor's own depends_on now includes metrics-api
    # (needed by go-worker-heavy only, for its --operational-bridge-url).
    # This service does not touch the metrics queue -- explicit override
    # (not a merge) so it does NOT inherit that dependency and does not
    # start metrics-api on a targeted `docker compose up -d` of just this
    # service.
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s

  go-stream-ingest:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    labels:
      dev-health.io/worker-group: stream-ingest
    command:
      - --profile=ingest
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-pagerduty-transport
      - *flag-log-level
    # codex review (PR #1938, independent post-cap review): the shared
    # &go-worker anchor's own depends_on now includes metrics-api
    # (needed by go-worker-heavy only, for its --operational-bridge-url).
    # This service does not touch the metrics queue -- explicit override
    # (not a merge) so it does NOT inherit that dependency and does not
    # start metrics-api on a targeted `docker compose up -d` of just this
    # service.
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s

  # PagerDuty webhook delivery is independently routable from dataset sync, so
  # it runs as its own stream family rather than sharing the external runner.
  go-stream-pagerduty:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    labels:
      dev-health.io/worker-group: stream-pagerduty
    command:
      - --profile=pagerduty
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-pagerduty-transport
      - *flag-log-level
    # codex review (PR #1938, independent post-cap review): the shared
    # &go-worker anchor's own depends_on now includes metrics-api
    # (needed by go-worker-heavy only, for its --operational-bridge-url).
    # This service does not touch the metrics queue -- explicit override
    # (not a merge) so it does NOT inherit that dependency and does not
    # start metrics-api on a targeted `docker compose up -d` of just this
    # service.
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s
