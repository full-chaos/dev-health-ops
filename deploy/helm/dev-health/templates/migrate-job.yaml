{{- if .Values.migrations.hook.enabled }}
{{- $hookEvents := .Values.migrations.hook.events }}
{{- $localBundledPostgres := .Values.migrations.hook.localBundledPostgres }}
{{- if and (has "post-install" $hookEvents) (not $localBundledPostgres) }}
{{- fail "migrations.hook.events may use post-install only when migrations.hook.localBundledPostgres=true" }}
{{- end }}
{{- if and $localBundledPostgres (not .Values.postgresql.enabled) }}
{{- fail "migrations.hook.localBundledPostgres=true requires postgresql.enabled=true" }}
{{- end }}
{{- if and $localBundledPostgres (not (has "post-install" $hookEvents)) }}
{{- fail "migrations.hook.localBundledPostgres=true requires migrations.hook.events to include post-install" }}
{{- end }}
{{- /*
Database migration hook (CHAOS-2304).

Runs PostgreSQL (Alembic plus opt-in River) + ClickHouse migrations as configured
by migrations.hook.events. Production defaults remain pre-install/pre-upgrade so
schema changes complete before workloads deploy. The explicit local bundled
PostgreSQL mode uses post-install/pre-upgrade and waits for the bundled database.
App pods run with AUTO_RUN_MIGRATIONS=false (see configmap.yaml) and never
ambient-migrate — shadow-table rebuild migrations are not safe to run concurrently
from workers.

The hook ships its own ConfigMap/Secret copies: pre-install hooks run before
the chart's regular resources exist, so the Job cannot reference them on a
fresh install. When secrets.create is false the external secret is referenced
directly (it exists independently of the release).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dev-health.fullname" . }}-migrate-config
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "migrate" "context" $) | nindent 4 }}
  annotations:
    helm.sh/hook: {{ join "," $hookEvents }}
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  {{- include "dev-health.configData" . | trim | nindent 2 }}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dev-health.fullname" . }}-migrate-secrets
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "migrate" "context" $) | nindent 4 }}
  annotations:
    helm.sh/hook: {{ join "," $hookEvents }}
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- include "dev-health.migrationSecretData" . | trim | nindent 2 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dev-health.fullname" . }}-migrate
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "migrate" "context" $) | nindent 4 }}
  annotations:
    helm.sh/hook: {{ join "," $hookEvents }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.hook.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.hook.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "migrate" "context" $) | nindent 8 }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      {{- if $localBundledPostgres }}
      initContainers:
        - name: wait-for-postgresql
          image: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
          # The PostgreSQL image's own policy, never image.pullPolicy: this
          # container runs a registry image, not the application image a local
          # profile side-loads and marks Never.
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 70
            runAsGroup: 70
          command:
            - sh
            - -ec
            - >-
              until pg_isready --host {{ include "dev-health.fullname" . }}-postgresql
              --port 5432 --username {{ .Values.postgresql.credentials.user | quote }}
              --dbname {{ .Values.postgresql.credentials.database | quote }};
              do sleep 2; done
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "dev-health.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          # MIGRATION_DATABASE_URI (preferred), POSTGRES_URI, or DATABASE_URI
          # must point DIRECTLY at Postgres (5432), never at a transaction-mode
          # pooler. The dedicated URI opts into the River step; the legacy
          # aliases remain Alembic-only compatible. See
          # docs/operate/configure/databases-and-storage.md.
          command:
            - sh
            - -c
            - >-
              if [ -z "${MIGRATION_DATABASE_URI:-}" ];
              then unset MIGRATION_DATABASE_URI; fi;
              if [ -n "$POSTGRES_URI" ] || [ -n "$DATABASE_URI" ]
              || [ "${MIGRATION_DATABASE_URI+x}" = x ]
              || [ "${MIGRATION_DATABASE_URI_FILE+x}" = x ];
              then dev-hops migrate postgres
              && if [ -n "$POSTGRES_URI" ] || [ -n "$DATABASE_URI" ];
              then dev-hops admin features seed;
              elif [ "${MIGRATION_DATABASE_URI+x}" = x ];
              then dev-hops --db "$MIGRATION_DATABASE_URI" admin features seed;
              else dev-hops --db "$(cat "$MIGRATION_DATABASE_URI_FILE")" admin features seed; fi; fi
              && dev-hops migrate clickhouse
          envFrom:
            - configMapRef:
                name: {{ include "dev-health.fullname" . }}-migrate-config
            - secretRef:
                {{- if .Values.secrets.create }}
                name: {{ include "dev-health.fullname" . }}-migrate-secrets
              {{- else }}
                name: {{ default (include "dev-health.secretName" .) .Values.migrations.hook.externalSecretName }}
              {{- end }}
          {{- with .Values.migrations.hook.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.migrations.hook.resources | nindent 12 }}
{{- end }}
