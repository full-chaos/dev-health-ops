# The `go-python-free` workflow: the Go integration shards and the unit tests with NO Python reachable (CHAOS-7384).
#
# WHY. Hosted runners have python3, so a green Go job does not prove a frozen test is Python-free;
# until now that proof was a local run with a broken interpreter. This workflow runs the same
# shard matrix as go.yml's go-storage-integration-shard with Python made unreachable
# (ci/python_tripwire.sh: shim `python`/`python3`/`pip`/`uv` first on PATH that name the caller and exit
# 97, DEV_HEALTH_PYTHON/PYTHON set to a path that does not exist) and the runner's own interpreters
# made non-executable. A test that still starts Python FAILS BY NAME.
#
# THE RATCHET. Red must not become normal, so the run is held to a closed list
# (ci/python_free_known.tsv: package, test, the CHAOS ticket that freezes it, ci/python_free_ratchet.sh):
#   GREEN  the set of tests that hit the tripwire equals the list.
#   FAILS  a test NOT on the list hits it (a new Python start), a listed test no longer hits it
#          (stale: remove the row in the PR that froze it), a shard fails for any other reason, or
#          a shard did not report. The summary prints: listed, hit, new, stale.
# End state (CHAOS-7308, P7): the list is empty, go.yml's shard job drops its setup-python steps and runs
# the tripwire itself, and this workflow is deleted.
#
# WHEN IT RUNS (CHAOS-7853). The FULL job (every integration shard and the whole unit leg) runs on a schedule (every 6 hours),
# by hand, on EVERY push to main, and on a pull request that changes this workflow or its scripts (the tripwire changed, so
# the tripwire proves itself). It finds a NEW start (an unlisted test that starts Python). Any other pull request that touches
# internal/**, ci/** or .github/workflows/** runs the `scope` job instead: every test listed in ci/python_free_known.tsv, by name,
# with the tripwire (a few minutes). It finds a STALE row (a test that stopped starting Python and kept its row) before it merges
# and says so; it does NOT look for a new start: that is the full run at merge on main. It is informational for merges (like
# venue-oracles, R430). THREE STATES, never read a missing run as green: `ci/last-python-free-run.sh` prints PASSED / FAILED /
# NOT RUN (no run newer than 8 hours) from the API.
name: Go Python-free

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  # Every push to main: a stale or new row is seen at the merge that caused it.
  push:
    branches: [main]
  # A pull request that edits this workflow or its scripts runs the FULL job; any other pull request that touches
  # these trees runs the scope job (the plan job decides: see `mode`).
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'ci/**'
      - 'internal/**'

permissions:
  contents: read
  # Pull the mirrored test-dependency images from ghcr.io (the same grant as go.yml, CHAOS-4778).
  packages: read

concurrency:
  # The fleet-wide shape of go.yml / venue-oracles.yml (CHAOS-4906): group by PR number on a pull_request, by
  # commit sha on a push to main (never cancelled), by ref otherwise; a re-push to a branch or PR cancels the
  # stale run. A scheduled run on main shares its ref group with nothing else.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # full = every shard and the whole unit leg; scope = only the tests listed in ci/python_free_known.tsv. A pull request
      # that changes this workflow or the tripwire/ratchet/list/harness files runs the full job (the tripwire changed);
      # every other pull request runs scope. Anything that is not a pull request runs the full job.
      - name: Decide the mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mode=full
          if [ "${EVENT}" = "pull_request" ]; then
            mode=scope
            changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
            if printf '%s\n' "${changed}" | grep -Eq '^(\.github/workflows/go-python-free\.yml|ci/check_go\.sh|ci/python_tripwire\.sh|ci/python_tripwire_shim\.sh|ci/python_free_ratchet\.sh|ci/python_free_known\.tsv|internal/testsupport/)'; then
              mode=full
            fi
          fi
          printf 'mode=%s\n' "${mode}" | tee -a "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Emit the deterministic integration shards (the same plan as go.yml)
        id: plan
        run: bash ci/check_go.sh integration-shard-plan

  shard:
    name: go-python-free-shard-${{ matrix.target }}-${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      # NO setup-python step on purpose: this job proves the shards need none.

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull pinned test dependency images with bounded retry
        run: bash ci/check_go.sh integration-prepull

      # Hosted runners only (the runner is thrown away): take the execute bit off every interpreter the
      # image ships, so a test that spawns one by absolute path fails too. The tripwire script itself
      # never changes a mode.
      - name: Make the runner's own Python non-executable
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          sudo find /usr/bin /usr/local/bin /opt/hostedtoolcache -type f \( -name 'python' -o -name 'python[0-9]*' -o -name 'pip' -o -name 'pip[0-9]*' \) -exec chmod a-x {} +
          if python3 --version 2>/dev/null; then
            echo "python3 is still executable after the chmod: the Python-free proof would be void" >&2
            exit 1
          fi
          echo "no interpreter is executable on this runner"

      - name: Run isolated storage integration shard ${{ matrix.target }} ${{ matrix.shard }} with no Python
        env:
          GO_PYTHON_FREE: '1'
          PYTHON_FREE_OUT: ${{ runner.temp }}/python-free
        run: bash ci/check_go.sh integration-shard "${{ matrix.target }}" "${{ matrix.shard }}"

      - name: Keep this shard's tripwire hits
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-free-hits-${{ matrix.target }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-free/*.hits
          if-no-files-found: warn

      # The whole go test -json stream of the shard, so a failure the log cannot show (a package-level
      # failure with no output, a killed binary) is still readable. Its own name: the ratchet job downloads
      # python-free-hits-* only.
      - name: Keep this shard's go test stream
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-free-stream-${{ matrix.target }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-free/*.json
          # The run step always writes its stream: a shard with none did not measure anything.
          if-no-files-found: error

  # The untagged unit set under the same tripwire (CHAOS-7384, lead's ruling): a unit test can start Python too,
  # through PATH, and a test that SKIPS because Python is missing is how it hides. No Docker, no shards.
  unit:
    name: go-python-free-unit
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the migration-matrix contract test resolves ops_sha against the checkout and
          # fails on a shallow clone (go-quality checks out the same way).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Make the runner's own Python non-executable
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          sudo find /usr/bin /usr/local/bin /opt/hostedtoolcache -type f \( -name 'python' -o -name 'python[0-9]*' -o -name 'pip' -o -name 'pip[0-9]*' \) -exec chmod a-x {} +
          if python3 --version 2>/dev/null; then
            echo "python3 is still executable after the chmod: the Python-free proof would be void" >&2
            exit 1
          fi
          echo "no interpreter is executable on this runner"

      - name: Run the untagged unit tests with no Python
        env:
          GO_PYTHON_FREE: '1'
          PYTHON_FREE_OUT: ${{ runner.temp }}/python-free
        run: bash ci/check_go.sh python-free-unit

      - name: Keep the unit leg's tripwire hits
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-free-hits-unit
          path: ${{ runner.temp }}/python-free/*.hits
          if-no-files-found: warn

      - name: Keep the unit leg's go test stream
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-free-stream-unit
          path: ${{ runner.temp }}/python-free/*.json
          if-no-files-found: error

  # The pull-request leg (CHAOS-7853): every listed test, by name, with Python unreachable.
  scope:
    name: go-python-free-scope
    needs: plan
    if: needs.plan.outputs.mode == 'scope'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull pinned test dependency images with bounded retry
        run: bash ci/check_go.sh integration-prepull

      - name: Make the runner's own Python non-executable
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          sudo find /usr/bin /usr/local/bin /opt/hostedtoolcache -type f \( -name 'python' -o -name 'python[0-9]*' -o -name 'pip' -o -name 'pip[0-9]*' \) -exec chmod a-x {} +
          if python3 --version 2>/dev/null; then
            echo "python3 is still executable after the chmod: the Python-free proof would be void" >&2
            exit 1
          fi
          echo "no interpreter is executable on this runner"

      - name: Run every listed test with no Python
        env:
          GO_PYTHON_FREE: '1'
          PYTHON_FREE_OUT: ${{ runner.temp }}/python-free
        run: bash ci/check_go.sh python-free-listed

      - name: Keep the scope leg's tripwire hits
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-free-hits-scope
          path: ${{ runner.temp }}/python-free/*.hits
          if-no-files-found: warn

      - name: Keep the scope leg's go test stream
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-free-stream-scope
          path: ${{ runner.temp }}/python-free/*.json
          if-no-files-found: error

  ratchet:
    name: go-python-free
    needs:
      - plan
      - shard
      - unit
      - scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      SHARD_RESULT: ${{ needs.shard.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
      SCOPE_RESULT: ${{ needs.scope.result }}
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the plan and every leg of the mode to have reported
        run: |
          set -euo pipefail
          if [ "${PLAN_RESULT}" != "success" ]; then
            echo "go-python-free: FAILED (plan=${PLAN_RESULT}): the mode was not decided; the ratchet was not evaluated" | tee -a "${GITHUB_STEP_SUMMARY}" >&2
            exit 1
          fi
          case "${MODE}" in
            full)
              if [ "${SHARD_RESULT}" != "success" ] || [ "${UNIT_RESULT}" != "success" ]; then
                echo "go-python-free: FAILED (shards=${SHARD_RESULT} unit=${UNIT_RESULT}): a leg had a failure that is not a tripwire hit, or did not finish; the ratchet was not evaluated" | tee -a "${GITHUB_STEP_SUMMARY}" >&2
                exit 1
              fi ;;
            scope)
              if [ "${SCOPE_RESULT}" != "success" ]; then
                echo "go-python-free: FAILED (scope=${SCOPE_RESULT}): a listed test failed for a reason that is not a tripwire hit, or the leg did not finish; the ratchet was not evaluated" | tee -a "${GITHUB_STEP_SUMMARY}" >&2
                exit 1
              fi ;;
            *)
              echo "go-python-free: FAILED (mode='${MODE}'): not full and not scope" | tee -a "${GITHUB_STEP_SUMMARY}" >&2
              exit 1 ;;
          esac

      - name: Download every shard's hits
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-free-hits-*
          path: python-free-hits
          merge-multiple: true

      - name: Compare the tripwire hits with the closed list
        run: |
          set -euo pipefail
          out="$(mktemp)"
          if bash ci/python_free_ratchet.sh compare ci/python_free_known.tsv python-free-hits 2>"${out}.err" | tee "${out}"; then
            printf 'go-python-free: PASSED. %s\n' "$(cat "${out}")" | tee -a "${GITHUB_STEP_SUMMARY}"
            if [ "${MODE}" = "scope" ]; then
              printf 'Scope run. Stale check: all listed packages run. New-start check (an unlisted test that starts Python): NOT measured on this pull request; the full run at merge on main does it.\n' | tee -a "${GITHUB_STEP_SUMMARY}"
            fi
          else
            cat "${out}.err" >&2
            printf 'go-python-free: FAILED. %s\n' "$(cat "${out}")" | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
