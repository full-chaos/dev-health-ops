# The one namespaced Role of the ServiceAccount that runs ci/rehearse_auth_key_rotation_k3s.sh. The lead applies it with the admin
# kubeconfig after envsubst '${NS}'. No cluster-scoped kind, no cluster-scoped verb, no RBAC resource, no wildcard resource or group.
# Why each group: core = the Secrets, ConfigMaps, Services and ServiceAccount the chart and the driver create (helm keeps its release in Secrets),
# and the pods with exec, log and portforward for postgres, valkey, the one-off keys pods and the JWKS probe; apps = the auth-service,
# postgres and valkey Deployments (and their ReplicaSets); batch = the auth-migrate hook Job; networking = the chart's NetworkPolicies;
# policy = the chart's PodDisruptionBudget.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: rehearsal, namespace: ${NS}}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec, pods/portforward, services, endpoints, secrets, configmaps, serviceaccounts, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: rehearsal, namespace: ${NS}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: rehearsal}
subjects: [{kind: ServiceAccount, name: rehearsal, namespace: ${NS}}]
