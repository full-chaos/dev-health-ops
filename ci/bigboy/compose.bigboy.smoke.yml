# CHAOS-6987/R460 (2026-09-27): the web-path smoke's own one-off runner. Kept OUT of
# bigboy-cut.sh's shared -f chain (compose.bigboy.router.yml etc.) on purpose -- the
# password-file bind mount below only resolves once DHO_SMOKE_ADMIN_PASSWORD_FILE is
# confirmed non-blank (web-path-smoke.sh's own presence gate), and folding this file
# into every other invocation would make an empty/unset var break unrelated STEPs.
# Invoked ONLY by web-path-smoke.sh, after that gate passes.
services:
  web-smoke:
    # CHAOS-8647: the smoke is the `dho smoke web-path` verb. Its image (the dho image by digest, the same
    # pin as query-api and migrate) is set in compose.bigboy.images.yml, so a repin moves it with them.
    # Run as the host operator (uid 1001), not root: the password file is 0600 and owned by the
    # operator, and the receipt lands in _records/.
    user: "1001:1001"
    entrypoint: ["/usr/local/bin/dho"]
    command: ["smoke", "web-path"]
    working_dir: /smoke
    networks: [dev-health]
    environment:
      DHO_SMOKE_ADMIN_EMAIL: ${DHO_SMOKE_ADMIN_EMAIL:?DHO_SMOKE_ADMIN_EMAIL required}
      DHO_SMOKE_ADMIN_PASSWORD_FILE: ${DHO_SMOKE_ADMIN_PASSWORD_FILE:?DHO_SMOKE_ADMIN_PASSWORD_FILE required}
      DHO_SMOKE_BASE_URL: http://traefik:3000
      DHO_SMOKE_PUBLIC_HOST: www.commanderkeen.dev
      DHO_SMOKE_WEB_SRC: /web-src
      DHO_SMOKE_CATALOG: /catalog/catalog.json
      DHO_SMOKE_ROUTING_OPS: /smoke/routing-ops.txt
      # A caller (e.g. bigboy-cut.sh) may export this to a per-cut path under
      # _records/bigboy-<sha8>/ before invoking; unset falls back to the flat name.
      DHO_SMOKE_RECEIPT_PATH: ${DHO_SMOKE_RECEIPT_PATH:-/receipts/web-path-smoke-receipt.json}
    volumes:
      # The script directory is passed in by web-path-smoke.sh (compose resolves ./ paths
      # against the project dir, the devhealth root, which has no ci/bigboy of its own).
      - ${DHO_SMOKE_DIR:?DHO_SMOKE_DIR required}:/smoke:ro
      - ./_records:/receipts
      - ${DHO_SMOKE_ADMIN_PASSWORD_FILE}:${DHO_SMOKE_ADMIN_PASSWORD_FILE}:ro
      # Web source the smoke derives GraphQL documents and REST paths from (read-only).
      - ./web/src:/web-src:ro
      # The edge catalog at the deployed ops sha (web-path-smoke.sh provides it).
      - ${DHO_SMOKE_CATALOG_FILE:?DHO_SMOKE_CATALOG_FILE required}:/catalog/catalog.json:ro
