name: Documentation Cloudflare delivery

# A pull request gets its preview assets from docs-guards.yml (job docs-preview), which reuses the site Docs Guards
# validated for the same revision. This workflow is the manual build and the production smoke test.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Build evidence, or smoke-test the live docs host
        required: true
        default: build
        type: choice
        options:
          - build
          - smoke

concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed):
  # canonical fleet-wide shape -- group by PR number on pull_request, by
  # ref on a push to a non-main branch, by commit sha on a push to main or
  # on merge_group (never cancelled -- see go.yml/typecheck.yml/
  # docker-images.yml/arc-runner-image.yml for the specific incidents this
  # protects). This workflow has no push trigger today, so only the
  # pull_request half is reachable; the trailing `inputs.action` segment
  # (unchanged) keeps preview and build dispatches in separate slots.
  group: docs-cloudflare-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}-${{ inputs.action || 'preview' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  preview-or-build:
    if: inputs.action == 'build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # CHAOS-10486: no setup-go cache here. Its key is shared by every workflow, and a job that compiles little or
          # nothing saved it first and left the heavy jobs an empty entry.
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.9
          enable-cache: false

      - name: Install documentation dependencies
        run: |
          uv venv --python 3.14.7 "$RUNNER_TEMP/docs-venv"
          uv pip install --python "$RUNNER_TEMP/docs-venv/bin/python" --require-hashes --no-deps -r requirements-docs.txt

      - name: Build and prepare validated preview assets
        run: |
          mkdir -p .build
          set -o pipefail
          go run -trimpath -mod=readonly ./cmd/cigate docs-build pre --mode preview --full-check \
            2>&1 | tee .build/docs-cloudflare-build.log
          uv run --no-project --python "$RUNNER_TEMP/docs-venv/bin/python" mkdocs build --strict --config-file mkdocs.yml \
            2>&1 | tee -a .build/docs-cloudflare-build.log
          go run -trimpath -mod=readonly ./cmd/cigate docs-build post --mode preview --full-check \
            2>&1 | tee -a .build/docs-cloudflare-build.log

      - name: Upload build evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-cloudflare-preview-${{ github.sha }}
          path: |
            .build/docs-cloudflare/**
            .build/docs-cloudflare-build.log
            .build/docs-*.log
            .build/docs-*.tsv
            .build/docs-*.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  smoke-production:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # CHAOS-10486: no setup-go cache here. Its key is shared by every workflow, and a job that compiles little or
          # nothing saved it first and left the heavy jobs an empty entry.
          cache: false

      - name: Smoke-test the canonical domain
        run: |
          for attempt in 1 2 3 4 5 6; do
            if go run -trimpath -mod=readonly ./cmd/cigate docs host-smoke \
              --origin https://docs.fullchaos.dev \
              --redirects docs-data/redirects.tsv; then
              exit 0
            fi
            echo "Smoke check attempt ${attempt} failed; waiting for propagation."
            sleep 10
          done
          exit 1
