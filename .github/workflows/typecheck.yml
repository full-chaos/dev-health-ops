name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

concurrency:
  # CHAOS-4946. `github.ref` as the non-PR fallback put EVERY main push in one
  # group (they all resolve `refs/heads/main`), and `cancel-in-progress: true`
  # then cancelled the running one. On a busy merge day that systematically
  # cancels the INTRODUCING commit's own post-merge check.
  #
  # Measured by lane-3092 while verifying #2157 (run ids on the ticket):
  # 025fc2241 (#2142's own push -- the commit that introduced the typecheck
  # break), 81ec1a65b, and 71ff737ac (the FIX for that break) all had their
  # Typecheck runs cancelled. A `workflow_dispatch` fired specifically to get a
  # clean main read was cancelled by the same group, so the group defeated its
  # own manual workaround.
  #
  # Combined with the paths filter below, the introducing PR was invisible
  # TWICE: its PR run skipped the job, and its push run was cancelled. The break
  # then surfaced on a later, unrelated PR -- so bisecting by "whose run went red
  # first" blames the wrong author. That is how #2142's break was attributed.
  #
  # Same fix as #2149 applied to docker-images.yml: fall back to `github.sha`, so
  # every distinct commit gets its OWN group and no two commits' checks can
  # cancel each other; and scope `cancel-in-progress` to `pull_request`, where
  # superseding a stale run is the behaviour we actually want. Post-merge
  # verification of main is never superseded, because there is nothing newer
  # that verifies THAT commit.
  #
  # NOT identical to #2149's key: that one has `github.event.inputs.ref ||`
  # ahead of the sha, because docker-images.yml's workflow_dispatch DEFINES a
  # `ref` input, so two dispatches from the same tip can build different refs
  # and need separate groups. THIS workflow's workflow_dispatch defines no
  # inputs at all, so `github.event.inputs.ref` is undefined here -- actionlint
  # flags it as `property "ref" is not defined in object type {}`, and it would
  # silently evaluate empty. Copying the sibling's key verbatim looked like
  # consistency and was cargo-culting; the shapes differ because the triggers do.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck-mypy:
    # CHAOS-4843: no `needs:`, no job-level `if:`. A separate `changes` job
    # with a job-level `if:` on its output let GitHub report this job
    # SKIPPED, which satisfies a required check exactly as well as a real
    # pass and is indistinguishable from one in the merge UI (the same
    # defect CHAOS-4834 closed for go-quality, by the same fix: this job now
    # ALWAYS runs and decides relevance INSIDE itself -- see "Decide whether
    # this change set is typecheck-relevant" below -- so a skip can only ever
    # be an honest, reported one, never an Actions-level job skip).
    runs-on: ubuntu-latest
    # Typecheck job needs package read access for dependency installs.
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the base commit to diff against; the default depth-1
          # checkout cannot see it. This is a git fetch, not a Docker Hub pull.
          fetch-depth: 0

      - name: Decide whether this change set is typecheck-relevant
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: always relevant (explicit manual trigger)"
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          bash ci/typecheck_relevant_diff.sh > changed.txt || {
            echo "could not resolve the diff range; failing closed"
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
            exit 0
          }
          python3 ci/typecheck_relevance.py < changed.txt | tee relevance.out
          grep -E '^relevant=(true|false)$' relevance.out >> "${GITHUB_OUTPUT}"

      - name: Report that the gate was skipped, and why
        if: steps.relevance.outputs.relevant != 'true'
        run: |
          echo "skipped: no typecheck-relevant paths in this change set."
          echo "Relevance is decided by ci/typecheck_relevance.py, which"
          echo "carries a copy of this job's former path-filter list. This"
          echo "job still REPORTS, so the required check is satisfied"
          echo "honestly rather than by a job GitHub shows as skipped."

      - name: Set up Python
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --all-extras --dev

      - name: Run mypy (type checking)
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          .venv/bin/mypy .

  typecheck:
    name: typecheck
    # Must remain `always()`. Under `!cancelled()` (or any condition that lets
    # this job itself skip) a cancelled run leaves the REQUIRED check *skipped*,
    # and branch protection counts a skipped required check as satisfied --
    # which moves the silent pass one level up instead of closing it.
    if: always()
    needs: [typecheck-mypy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aggregate typecheck result
        env:
          GATE_NAME: typecheck
          EVENT_NAME: ${{ github.event_name }}
          # CHAOS-4843: typecheck-mypy no longer has a `changes` job gating
          # it -- it always runs and decides relevance inside itself, so a
          # skip is never legitimate here (the `unconditional` policy,
          # matching go-quality's own job for the identical reason).
          GATE_HAS_SELECTOR: "false"
          GATED_JOB_1: typecheck-mypy|unconditional|${{ needs.typecheck-mypy.result }}
        run: |
          chmod +x ci/aggregate_gate_results.sh
          ./ci/aggregate_gate_results.sh
