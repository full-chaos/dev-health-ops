---
# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-health-api
  namespace: dev-health
  labels:
    app.kubernetes.io/name: dev-health-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dev-health-ops
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-health-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-health-api
    spec:
      securityContext:
        runAsNonRoot: true
      # CHAOS-2304 safety net: a naive `kubectl apply -k deploy/kubernetes/`
      # rolls Deployments without waiting for the migrate Job. This
      # initContainer blocks app start until all ClickHouse migrations are
      # applied. It is strictly READ-ONLY (`dho migrate clickhouse status
      # --check` -- exit 0 at the head with nothing pending, 1 otherwise); the
      # one-shot Job (migrate-job.yaml) remains the only thing that runs DDL.
      # The dho image is distroless: exec form, no shell, no retry loop. A
      # failing probe fails the initContainer and kubelet restart backoff is
      # the wait. The recommended deploy flow (README.md: `kubectl wait` on
      # the Job) still applies -- this is the safety net, not the primary
      # ordering.
      #
      # The probe reads ONE key, not a whole Secret: the migrate Job's own
      # native-protocol CLICKHOUSE_URI (dev-health-secrets holds the HTTP 8123
      # URI the Python api uses, which the Go client cannot speak), so it
      # checks the same ClickHouse the Job migrates. dho refuses any ordering
      # contract but 2.
      initContainers:
        - name: wait-for-migrations
          image: ghcr.io/full-chaos/dev-health-go-dho:latest
          securityContext:
            allowPrivilegeEscalation: false
          args: ["migrate", "clickhouse", "status", "--check"]
          env:
            - name: CLICKHOUSE_URI
              valueFrom:
                secretKeyRef:
                  name: dev-health-migration-secrets
                  key: CLICKHOUSE_URI
            - name: OPERATIONAL_ORDERING_CONTRACT
              value: "2"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      containers:
        - name: api
          image: ghcr.io/your-org/dev-health-ops:latest
          # Or use: your-registry/dev-health-ops:latest
          # CHAOS-4317: vanilla Kubernetes has no per-container pids cgroup
          # limit in the Pod spec (unlike Compose's `pids_limit`) -- the only
          # lever is cluster-wide kubelet config (`--pod-max-pids` behind the
          # SupportPodPidsLimit feature gate), which is not expressible per
          # manifest here. worker_metrics.py's capacity reader falls through
          # to its host-wide kernel.threads-max fallback on this surface.
          # Flagged, not fixed -- a cluster operator who wants a real ceiling
          # on this deployment must set the kubelet flag, not this file.
          securityContext:
            allowPrivilegeEscalation: false
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dev-health-config
            - secretRef:
                name: dev-health-secrets
          env:
            - name: REDIS_URL
              value: "redis://valkey:6379/1"
            # CHAOS-3942/CHAOS-4195: go-workers.yaml is a base kustomization
            # resource, so dev-health-go-worker-config normally exists;
            # `optional: true` is resilience against a partial apply, not a
            # Celery-authoritative fallback (Celery is gone).
            - name: EXPECTED_WORKER_GROUPS
              valueFrom:
                configMapKeyRef:
                  name: dev-health-go-worker-config
                  key: EXPECTED_WORKER_GROUPS
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dev-health-api
  namespace: dev-health
  labels:
    app.kubernetes.io/name: dev-health-api
spec:
  selector:
    app.kubernetes.io/name: dev-health-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dev-health-api-hpa
  namespace: dev-health
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-health-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
