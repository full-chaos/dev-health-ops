query ProductTelemetryPlatformDashboard($input: ProductTelemetryDashboardInput!) {
  productTelemetryPlatformDashboard(input: $input) {
    totals {
      activeOrgs
      anonymousUsers
      sessions
      events
      __typename
    }
    dailyActiveUsers {
      day
      activeAnonymousUsers
      __typename
    }
    topRoutes {
      routePattern
      events
      sessions
      anonymousUsers
      __typename
    }
    featureViews {
      feature
      surface
      views
      anonymousUsers
      __typename
    }
    filterChanges {
      view
      filterKey
      changes
      avgValueCount
      __typename
    }
    chartInteractions {
      chart
      action
      surface
      interactions
      sessions
      __typename
    }
    clientErrors {
      routePattern
      boundary
      errorClass
      errors
      affectedAnonymousUsers
      __typename
    }
    sessionSummary {
      p50DurationMs
      p75DurationMs
      p90DurationMs
      p95DurationMs
      avgPagesViewed
      avgInteractions
      __typename
    }
    topOrgs {
      orgIdHash
      events
      sessions
      anonymousUsers
      orgId
      orgName
      orgSlug
      __typename
    }
    __typename
  }
}