{{- /* Additive Go/River topology. `goWorkers.enabled` is false by default. */ -}}
{{- if .Values.goWorkers.enabled }}
{{- range $group := .Values.goWorkers.groups }}
{{- $coordinator := has $group.name (list "reconciler" "scheduler") }}
{{- /*
CHAOS-4428: fail the render when a `metrics` group's grace period is too
short to finish a job it has already claimed.

terminationGracePeriodSeconds becomes --shutdown-timeout below (line ~72), and
a metrics job's own registry timeout is 7200s. Anything under 7200+60 means the
kubelet SIGKILLs the pod while a claimed job is still running: River sees the
row still leased, the work is neither done nor released, and the worker's own
diagnosis is the opaque
`dependency_configuration_failed reason=queue_coverage_validation_failed` --
which names the queue coverage check, not the grace period that actually caused
it. That error is what makes this worth failing at render time instead of
letting the operator find it in a crash-looping pod.

Only groups that actually carry `metrics` are constrained; `has` needs a real
list because reconciler/scheduler declare no `queues` key at all.
*/}}
{{- if has "metrics" ($group.queues | default (list)) }}
{{- if lt (int $group.terminationGracePeriodSeconds) 7260 }}
{{- fail (printf "goWorkers.groups[%s]: terminationGracePeriodSeconds=%v is below the 7260s floor required for the `metrics` queue (7200s job registry timeout + 60s finalization). It is passed straight to --shutdown-timeout, so a shorter value SIGKILLs a claimed metrics job mid-flight and surfaces as `dependency_configuration_failed reason=queue_coverage_validation_failed`." $group.name $group.terminationGracePeriodSeconds) }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-health.fullname" $ }}-go-{{ $group.name }}
  namespace: {{ include "dev-health.namespace" $ }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "go-worker" "context" $) | nindent 4 }}
    dev-health.io/worker-group: {{ $group.name }}
    {{- with $group.queues }}
    {{- /*
    CHAOS-4428: joined with "_" and NOT "," -- a comma is not a legal
    character in a Kubernetes label VALUE (regex
    (([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?), so every group with more
    than one queue was rejected outright by the API server with
    `metadata.labels: Invalid value: "investment,metrics,reports,workgraph"`.
    That is the chart's OWN default `heavy` and `ops` groups, i.e. this
    chart could not install its own defaults. Reproduced on a k3s 1.36
    cluster via `helm upgrade --install` at ops 7ea3cad23.
    */}}
    dev-health.io/queue-set: {{ join "_" . | quote }}
    {{- end }}
spec:
  replicas: {{ $group.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "go-worker" "context" $) | nindent 6 }}
      dev-health.io/worker-group: {{ $group.name }}
  template:
    metadata:
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "go-worker" "context" $) | nindent 8 }}
        dev-health.io/worker-group: {{ $group.name }}
        {{- with $group.queues }}
        dev-health.io/queue-set: {{ join "_" . | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $group.terminationGracePeriodSeconds }}
      {{- include "dev-health.imagePullSecrets" $ | nindent 6 }}
      serviceAccountName: {{ include "dev-health.serviceAccountName" $ }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $group.name }}
          image: {{ $group.image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          # CHAOS-4020: worker configuration is flags. Every setting a Go
          # binary reads that is not a credential is rendered here, so
          # `helm template` and `kubectl describe` show the deployed
          # configuration in one place instead of spreading it across a
          # ConfigMap, a Secret, and per-group env. Credentials stay in env:
          # an argument is visible to anyone who can read the pod spec.
          args:
            {{- if $group.queues }}
            {{- $parts := list }}
            {{- range $queue := $group.queues }}
            {{- $parts = append $parts (printf "%s=%v" $queue (index $group.queueConcurrency $queue)) }}
            {{- end }}
            - {{ printf "--queues=%s" (join "," $group.queues) | quote }}
            - {{ printf "--queue-concurrency=%s" (join "," $parts) | quote }}
            - {{ printf "--worker-group=%s" $group.name | quote }}
            {{- end }}
            {{- with $group.runtimeProfile }}
            - {{ printf "--profile=%s" . | quote }}
            {{- end }}
            - {{ printf "--shutdown-timeout=%ds" (int $group.terminationGracePeriodSeconds) | quote }}
            - "--http-addr=:8080"
            {{- /*
              CHAOS-4351: whichever group's queue set includes `metrics` is
              the one that calls the metrics compatibility bridge -- point
              it at the dedicated metricsApi Service instead of api's, same
              rationale as compose.go-workers.yml's flag-bridge-url-heavy
              anchor. Selected by QUEUE MEMBERSHIP, not the group's `name`
              (codex review, PR #1938 round-3 P2) -- a name match silently
              stops overriding the right group the moment an operator's
              values.yaml reassigns the `metrics` queue away from `heavy`
              (or onto a second group too), leaving that group's bridge
              calls quietly still sharing api's cgroup. `has` needs a real
              list even for groups (reconciler/scheduler) that declare no
              `queues` key at all, hence the `default (list)`.
              Falls back to `api` if metricsApi isn't enabled (e.g. a
              fresh install with goWorkers scaled to 0 everywhere), so this
              never renders a reference to a Service that doesn't exist.
              $group.bridgeUrl (values.yaml) overrides either default. Both
              defaults read the target's own .port value (codex review, PR
              #1938 round-1 P2) -- a hardcoded :8000 would silently break if
              an operator overrides api.port/metricsApi.port, since the
              Service's actual listening port would no longer match what
              this flag tells the Go binary to dial.
            */}}
            {{- if has "metrics" ($group.queues | default (list)) }}
            {{- $defaultBridgeUrl := printf "http://%s-api:%v" (include "dev-health.fullname" $) $.Values.api.port }}
            {{- if $.Values.metricsApi.enabled }}
            {{- $defaultBridgeUrl = printf "http://%s-metrics-api:%v" (include "dev-health.fullname" $) $.Values.metricsApi.port }}
            {{- end }}
            - {{ printf "--operational-bridge-url=%s" (default $defaultBridgeUrl $group.bridgeUrl) | quote }}
            {{- end }}
            {{- if $.Values.goWorkers.pgbouncer.enabled }}
            - "--domain-transaction-pooler=true"
            - "--queue-database-mode=session"
            {{- if $coordinator }}
            - "--coordinator-database-mode=session"
            {{- end }}
            {{- end }}
            {{- /*
              Per-group only, deliberately. A chart-wide extraArgs would append
              every flag to every group, and options are scoped per binary --
              --unreclaimable-sweep is reconciler-only, so a global entry would
              make the worker, scheduler, and stream-runner pods exit 2 on an
              unknown flag. Scope the flag to the group that accepts it.
            */}}
            {{- with $group.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- with (include "dev-health.goWorkerClickhouseURI" $) }}
            # Explicit env beats the shared Secret mounted via envFrom below,
            # so Go pods get the native port while Python keeps HTTP.
            - {name: CLICKHOUSE_URI, value: {{ . | quote }}}
            {{- end }}
            {{- if $.Values.goWorkers.pgbouncer.enabled }}
            # Every Go worker group uses the bounded domain transaction pool plus
            # the River queue session pool. Only coordinator binaries receive
            # the separate coordinator lock session endpoint.
            - name: POSTGRES_URI
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.goPgbouncerSecretName" $ }}, key: POSTGRES_URI}}
            - name: WORKER_DATABASE_URI
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.goPgbouncerSecretName" $ }}, key: WORKER_DATABASE_URI}}
            {{- if $coordinator }}
            - name: COORDINATOR_DATABASE_URI
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.goPgbouncerSecretName" $ }}, key: COORDINATOR_DATABASE_URI}}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef: {name: {{ include "dev-health.configMapName" $ }}}
            - secretRef: {name: {{ include "dev-health.secretName" $ }}}
          ports: [{name: metrics, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            {{- toYaml $group.resources | nindent 12 }}
          livenessProbe: {httpGet: {path: /healthz, port: metrics}, initialDelaySeconds: 10, periodSeconds: 15}
          readinessProbe: {httpGet: {path: /readyz, port: metrics}, initialDelaySeconds: 10, periodSeconds: 10}
{{- if $group.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "dev-health.fullname" $ }}-go-{{ $group.name }}
  namespace: {{ include "dev-health.namespace" $ }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "dev-health.fullname" $ }}-go-{{ $group.name }}}
  minReplicas: {{ $group.autoscaling.minReplicas }}
  maxReplicas: {{ $group.autoscaling.maxReplicas }}
  metrics:
    {{- range $queue := $group.queues }}
    - type: External
      external: {metric: {name: worker_jobs_available, selector: {matchLabels: {queue: {{ $queue | quote }}}}}, target: {type: AverageValue, averageValue: {{ $group.autoscaling.queueDepth | quote }}}}
    - type: External
      external: {metric: {name: worker_job_oldest_age_seconds, selector: {matchLabels: {queue: {{ $queue | quote }}}}}, target: {type: AverageValue, averageValue: {{ $group.autoscaling.oldestAgeSeconds | quote }}}}
    - type: External
      external: {metric: {name: worker_execution_saturation_ratio, selector: {matchLabels: {queue: {{ $queue | quote }}}}}, target: {type: AverageValue, averageValue: {{ $group.autoscaling.saturationMilli | quote }}}}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
