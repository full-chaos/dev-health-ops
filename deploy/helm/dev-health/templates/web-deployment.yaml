{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-health.fullname" . }}-web
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "web" "context" $) | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  {{- /*
  CHAOS-4428: never dip below the current serving capacity during a rollout.
  Kubernetes' default is 25%/25%, which at replicas: 1 rounds maxUnavailable
  DOWN to 0 and happens to behave -- but only by rounding. State it, so the
  guarantee survives someone setting replicas: 4, where the default would take
  one serving pod out before its replacement is ready.
  */}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "web" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "web" "context" $) | nindent 8 }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "dev-health.serviceAccountName" . }}
      containers:
        - name: web
          image: {{ include "dev-health.webImage" . }}
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            - name: HOSTNAME
              value: "::"
            - name: BACKEND_URL
              value: {{ required "web.env.BACKEND_URL is required whenever web.enabled=true (CHAOS-8310): it is the base URL of the backend web's server-side requests go to -- REST (go-api) and /graphql (query-api) are different Go services, so no single in-chart default is correct. Set web.env.BACKEND_URL explicitly for this environment (for example the ingress host that fans out both), or web.enabled=false." .Values.web.env.BACKEND_URL | quote }}
            {{- /*
            CHAOS-10446: AUTH_SECRET (the Auth.js session secret) never falls back to
            JWT_SECRET_KEY, the HS256 access-token key. It is a literal (dev) or one
            key of its own Secret; web.enabled without either fails the render.
            */}}
            {{- if .Values.web.env.AUTH_SECRET }}
            {{- if and .Values.secrets.data.JWT_SECRET_KEY (eq (toString .Values.web.env.AUTH_SECRET) (toString .Values.secrets.data.JWT_SECRET_KEY)) }}
            {{- fail "web.env.AUTH_SECRET must not name the HS256 key's Secret, the shared Secret, or the key JWT_SECRET_KEY (CHAOS-10446): its value equals secrets.data.JWT_SECRET_KEY" }}
            {{- end }}
            - name: AUTH_SECRET
              value: {{ .Values.web.env.AUTH_SECRET | quote }}
            {{- else if .Values.web.authSecret.secretName }}
            {{- include "dev-health.webSecretGuard" (dict "ctx" . "name" .Values.web.authSecret.secretName "key" (.Values.web.authSecret.key | default "AUTH_SECRET") "what" "web.authSecret") }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.web.authSecret.secretName | quote }}
                  key: {{ .Values.web.authSecret.key | default "AUTH_SECRET" | quote }}
            {{- else if or (not .Values.web.localDevelopment.enabled) (eq (.Values.web.env.NODE_ENV | default "production") "production") }}
            {{- fail "web.authSecret.secretName (or web.env.AUTH_SECRET) is required whenever web.enabled=true (only web.localDevelopment with NODE_ENV other than production may omit it) (CHAOS-10446): web's session secret has its own Secret and never falls back to JWT_SECRET_KEY. This is a required values change: see docs/operate/install/production.md, section \"Required values change: separate Secrets for web and the HS256 key\"." }}
            {{- end }}
            - name: NODE_ENV
              value: {{ .Values.web.env.NODE_ENV | quote }}
            {{- if .Values.valkey.enabled }}
            - name: REDIS_URL
              value: {{ include "dev-health.redisURL" . | quote }}
            {{- end }}
          {{- range .Values.web.extraEnv | default (list) }}
          {{- with .valueFrom }}{{- with .secretKeyRef }}
          {{- include "dev-health.webSecretGuard" (dict "ctx" $ "name" .name "key" .key "what" "web.extraEnv secretKeyRef") }}
          {{- end }}{{- end }}
          {{- end }}
          {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- /*
          CHAOS-6188: web.extraVolumeMounts renders in every environment (the
          Ed25519 ACR web-assertion signing key is a Secret volume mount web
          needs in production), while web.localDevelopment.extraVolumeMounts
          stays gated behind localDevelopment.enabled. Both feed ONE
          volumeMounts key -- never two -- so they merge instead of the
          second clobbering the first.
          */}}
          {{- $webVolumeMounts := .Values.web.extraVolumeMounts | default (list) }}
          {{- if .Values.web.localDevelopment.enabled }}
          {{- $webVolumeMounts = concat $webVolumeMounts (.Values.web.localDevelopment.extraVolumeMounts | default (list)) }}
          {{- end }}
          {{- with $webVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- $webVolumes := .Values.web.extraVolumes | default (list) }}
      {{- if .Values.web.localDevelopment.enabled }}
      {{- $webVolumes = concat $webVolumes (.Values.web.localDevelopment.extraVolumes | default (list)) }}
      {{- end }}
      {{- range $webVolumes }}
      {{- with .secret }}
      {{- include "dev-health.webSecretGuard" (dict "ctx" $ "name" .secretName "key" "" "what" "a web secret volume") }}
      {{- range .items | default (list) }}{{- include "dev-health.webSecretGuard" (dict "ctx" $ "name" "" "key" .key "what" "a web secret volume item") }}{{- end }}
      {{- end }}
      {{- with .projected }}{{- range .sources | default (list) }}{{- with .secret }}
      {{- include "dev-health.webSecretGuard" (dict "ctx" $ "name" .name "key" "" "what" "a web projected secret volume") }}
      {{- range .items | default (list) }}{{- include "dev-health.webSecretGuard" (dict "ctx" $ "name" "" "key" .key "what" "a web projected secret volume item") }}{{- end }}
      {{- end }}{{- end }}{{- end }}
      {{- end }}
      {{- with $webVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
