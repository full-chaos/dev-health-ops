# Go/River workloads (CHAOS-3052). This is the only worker topology this
# tree renders -- the Celery manifests it replaced (worker.yaml, beat.yaml)
# were deleted in CHAOS-4195. Listed in kustomization.yaml; apply after the
# migration Job completes. Every group deploys at replicas: 0 by default --
# scale the groups you need (README.md) -- and exposes /healthz, /readyz,
# and /metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-health-go-worker-config
  namespace: dev-health
  labels: {app.kubernetes.io/component: go-worker-config}
data:
  # CHAOS-3942/CHAOS-4195: /health/workers is Go-authoritative now that this
  # file is a base kustomization resource (api.yaml still reads the key
  # `optional: true` for resilience against a partial apply, not because the
  # fleet it describes is conditional any more). Reconciler/scheduler/
  # stream-* are excluded: they run a separate role with their own /healthz
  # and never register worker_instances presence.
  EXPECTED_WORKER_GROUPS: "heavy,ops,sync,sync-provider"
  # CHAOS-4587: every Deployment below reads a canonical operational table
  # through the ordering-contract guard (dora_native_clickhouse.go,
  # pagerduty_services_effects_clickhouse.go) and refuses to start against a
  # contract-2 (post-067) table without this set. Scoped to this go-worker
  # ConfigMap (not the shared dev-health-config api/worker one) because the
  # Python api's own ordering-contract awareness is a separate, out-of-scope
  # concern -- see deploy/go-workers/README.md's rollout note. Omitted
  # defaults to contract 1 (rollout-safe).
  OPERATIONAL_ORDERING_CONTRACT: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: dev-health-go-workers
  namespace: dev-health
  labels: {app.kubernetes.io/component: go-worker}
spec:
  selector: {app.kubernetes.io/component: go-worker}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-health-go-worker-heavy
  namespace: dev-health
  labels: {app.kubernetes.io/component: go-worker, dev-health.io/worker-group: heavy}
spec:
  replicas: 0
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/component: go-worker, dev-health.io/worker-group: heavy}}
  template:
    metadata: {labels: {app.kubernetes.io/component: go-worker, dev-health.io/worker-group: heavy}}
    spec:
      terminationGracePeriodSeconds: 7260
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/full-chaos/dev-health-go-worker:latest
          args: ["--queues=investment,metrics,reports,workgraph", "--queue-concurrency=investment=1,metrics=2,reports=2,workgraph=1", "--worker-group=heavy", "--shutdown-timeout=7260s", "--http-addr=:8080"]
          envFrom: [{configMapRef: {name: dev-health-config}}, {configMapRef: {name: dev-health-go-worker-config}}, {secretRef: {name: dev-health-secrets}}, {secretRef: {name: dev-health-go-worker-secrets}}]
          ports: [{name: metrics, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          livenessProbe: {httpGet: {path: /healthz, port: metrics}, initialDelaySeconds: 10, periodSeconds: 15}
          readinessProbe: {httpGet: {path: /readyz, port: metrics}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-health-go-worker-ops
  namespace: dev-health
  labels: {app.kubernetes.io/component: go-worker, dev-health.io/worker-group: ops}
spec:
