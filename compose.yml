      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s

  go-stream-external:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    # r5 P1: own pull-policy override, see go-worker-heavy's comment.
    # Shared by all three go-stream-* services (same `*_IMAGE` family).
    pull_policy: ${DEV_HEALTH_GO_STREAM_RUNNER_PULL_POLICY:-build}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: stream-runner
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: stream-external
    command:
      - --profile=external
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
      # codex review (r2, P1): not a River-queue consumer, no
      # coordinator-claim path -- neutralize the shared base's coordinator
      # wiring rather than inherit it (same pattern the bigboy overlay this
      # was folded from uses for its own stream services).
      COORDINATOR_DATABASE_URI: ""
    stop_grace_period: 60s

  go-stream-ingest:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    pull_policy: ${DEV_HEALTH_GO_STREAM_RUNNER_PULL_POLICY:-build}
