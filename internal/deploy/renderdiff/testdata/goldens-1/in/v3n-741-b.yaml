# Source: dev-health/charts/ops/templates/go-api-deployment.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dev-health-ops-go-api-internal
  namespace: dev-health
  labels:
    helm.sh/chart: ops-0.1.0
    app.kubernetes.io/name: ops
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: dev-health
    app.kubernetes.io/component: go-api-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ops
      app.kubernetes.io/instance: dev-health
      app.kubernetes.io/component: go-api
  policyTypes:
    - Ingress
  ingress:
    # Every TCP port EXCEPT the internal one is open to every source, exactly as before this
    # policy existed (Ingress, probes, scrapes, and any other listener the process is started
    # with, e.g. the billing edge). It is written as the two ranges around the internal port
    # (endPort), not derived from the args/env the process gets: a derived list can miss a
    # listener configured a way the template does not parse and silently deny it.
    - ports:
        - protocol: TCP
          port: 1
          endPort: 7999
        - protocol: TCP
          port: 8001
          endPort: 8009
        - protocol: TCP
          port: 8011
          endPort: 8090
        - protocol: TCP
          port: 8092
          endPort: 65535
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "ingress-nginx"
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8010
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
              app.kubernetes.io/instance: dev-health-acr
              app.kubernetes.io/name: acr
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: go-worker
              app.kubernetes.io/instance: dev-health
              app.kubernetes.io/name: ops
              dev-health.io/worker-group: heavy
      ports:
        - protocol: TCP
          port: 8091

