apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: go-pgbouncer-transaction
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ops
    app.kubernetes.io/part-of: dev-health
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: ops-0.1.0
  name: dev-health-ops-go-pgbouncer-transaction
  namespace: dev-health
spec:
  egress:
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: postgresql
          app.kubernetes.io/instance: dev-health
          app.kubernetes.io/name: ops
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: go-worker
          app.kubernetes.io/instance: dev-health
          app.kubernetes.io/name: ops
    ports:
    - port: 6432
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: collector
          app.kubernetes.io/instance: dev-health
          app.kubernetes.io/name: otel-collector
    ports:
    - port: 9127
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: keda
    ports:
    - port: 6432
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: go-pgbouncer-transaction
      app.kubernetes.io/instance: dev-health
      app.kubernetes.io/name: ops
  policyTypes:
  - Ingress
  - Egress
