{{- if .Values.migrations.hook.enabled }}
{{- $hookEvents := .Values.migrations.hook.events }}
{{- $localBundledPostgres := .Values.migrations.hook.localBundledPostgres }}
{{- if and (has "post-install" $hookEvents) (not $localBundledPostgres) }}
{{- fail "migrations.hook.events may use post-install only when migrations.hook.localBundledPostgres=true" }}
{{- end }}
{{- if and $localBundledPostgres (not .Values.postgresql.enabled) }}
{{- fail "migrations.hook.localBundledPostgres=true requires postgresql.enabled=true" }}
{{- end }}
{{- if and $localBundledPostgres (not (has "post-install" $hookEvents)) }}
{{- fail "migrations.hook.localBundledPostgres=true requires migrations.hook.events to include post-install" }}
{{- end }}
{{- /*
Database migration hook (CHAOS-2304).

Runs `dho migrate upgrade` -- the PostgreSQL head, the standard feature flags,
the ClickHouse head, plus River when no River hook runs -- as configured by
migrations.hook.events. Production defaults remain pre-install/pre-upgrade so
schema changes complete before workloads deploy. The explicit local bundled
PostgreSQL mode uses post-install/pre-upgrade and waits for the bundled database.
App pods run with AUTO_RUN_MIGRATIONS=false (see configmap.yaml) and never
ambient-migrate — shadow-table rebuild migrations are not safe to run concurrently
from workers.

The hook ships its own ConfigMap/Secret copies: pre-install hooks run before
the chart's regular resources exist, so the Job cannot reference them on a
fresh install. When secrets.create is false the external secret is referenced
directly (it exists independently of the release).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dev-health.fullname" . }}-migrate-config
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "migrate" "context" $) | nindent 4 }}
  annotations:
    helm.sh/hook: {{ join "," $hookEvents }}
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  {{- include "dev-health.configData" . | trim | nindent 2 }}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dev-health.fullname" . }}-migrate-secrets
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "migrate" "context" $) | nindent 4 }}
  annotations:
    helm.sh/hook: {{ join "," $hookEvents }}
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- include "dev-health.migrationSecretData" . | trim | nindent 2 }}
{{- end }}
{{- /*
The Job runs `dho migrate upgrade`, so its image must carry dho as the
entrypoint: migrations.hook.image, else routeActivate.image (the operator
image the River and route-activate hooks run), else the chart's dho image
(goApi.image, as the query-api Deployment defaults). An image set in either
value must follow the hooks' pin rule: repo@sha256:<digest>,
repo:sha-<12 hex>, or repo:local with pullPolicy Never or IfNotPresent. The
chart-default dho image is for local renders; production values pin one
(CHAOS-6488 tracks the unpinned default). The Python image is refused by
name; a repository name is not proof of an image's contents (CHAOS-6488).
*/}}
{{- $migrateImageSet := .Values.migrations.hook.image | default .Values.migrations.hook.routeActivate.image }}
{{- $migrateImage := $migrateImageSet | default (include "dev-health.goApiImage" .) }}
{{- $migratePullPolicy := .Values.migrations.hook.pullPolicy | default .Values.migrations.hook.routeActivate.pullPolicy | default .Values.goApi.image.pullPolicy }}
{{- if regexMatch "(^|/)dev-hops-api([:@]|$)" $migrateImage }}
{{- fail (printf "the migrate Job image %q is the Python image; the Job runs `dho migrate upgrade` and needs the dho (operator) image: set migrations.hook.image or migrations.hook.routeActivate.image" $migrateImage) }}
{{- end }}
{{- $migrateImageIsDigestPinned := and $migrateImage (contains "@sha256:" $migrateImage) }}
{{- $migrateImageIsImmutableTag := and $migrateImage (regexMatch "^.+:sha-[0-9a-f]{12}$" $migrateImage) }}
{{- $migrateImageIsSideloadedLocal := and $migrateImage (regexMatch "^.+:local$" $migrateImage) (or (eq $migratePullPolicy "Never") (eq $migratePullPolicy "IfNotPresent")) }}
{{- if and $migrateImageSet (not (or $migrateImageIsDigestPinned $migrateImageIsImmutableTag $migrateImageIsSideloadedLocal)) }}
{{- fail (printf "the migrate Job image %q (migrations.hook.image, else migrations.hook.routeActivate.image) is not a pinned dho image. The Job runs `dho migrate upgrade`: set it to repo@sha256:<digest> or repo:sha-<12 hex>; repo:local is accepted only with pullPolicy Never or IfNotPresent." $migrateImage) }}
{{- end }}
{{- include "dev-health.lockstepImageCheck" (dict "context" . "image" $migrateImage "labelWithValue" (printf "the migrate Job image (migrations.hook.image, else migrations.hook.routeActivate.image: %s)" $migrateImage) "reason" "`dho migrate upgrade` must run the same build as the application it is migrating for.") }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dev-health.fullname" . }}-migrate
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "migrate" "context" $) | nindent 4 }}
  annotations:
    helm.sh/hook: {{ join "," $hookEvents }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.hook.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.hook.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "migrate" "context" $) | nindent 8 }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      {{- if $localBundledPostgres }}
      initContainers:
        - name: wait-for-postgresql
          image: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
          # The PostgreSQL image's own policy, never image.pullPolicy: this
          # container runs a registry image, not the application image a local
          # profile side-loads and marks Never.
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 70
            runAsGroup: 70
          command:
            - sh
            - -ec
            - >-
              until pg_isready --host {{ include "dev-health.fullname" . }}-postgresql
              --port 5432 --username {{ .Values.postgresql.credentials.user | quote }}
              --dbname {{ .Values.postgresql.credentials.database | quote }};
              do sleep 2; done
      {{- end }}
      containers:
        - name: migrate
          image: {{ $migrateImage | quote }}
          imagePullPolicy: {{ $migratePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          # `dho migrate upgrade` runs the migrate Job's steps in order, each
          # exactly as its own verb: `migrate postgres upgrade`, `admin
          # features seed`, `migrate clickhouse upgrade`. Exec form, no shell:
          # the image is distroless. MIGRATION_DATABASE_URI (preferred, or its
          # _FILE or DEV_HEALTH_MIGRATION_PG_* form) or POSTGRES_URI must point
          # DIRECTLY at Postgres (5432), never at a transaction-mode pooler;
          # dho does not read DATABASE_URI. See
          # docs/operate/configure/databases-and-storage.md.
          {{- if .Values.migrations.hook.riverMigrate.enabled }}
          # The weight-10 river-migrate hook owns the River step (CHAOS-4428).
          args: ["migrate", "upgrade"]
          {{- else }}
          # No River hook: this Job applies the River schema itself right
          # after the PostgreSQL step, when MIGRATION_DATABASE_URI is
          # configured -- what `dev-hops migrate postgres` did.
          args: ["migrate", "upgrade", "--river"]
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "dev-health.fullname" . }}-migrate-config
            - secretRef:
                {{- if .Values.secrets.create }}
                name: {{ include "dev-health.fullname" . }}-migrate-secrets
              {{- else }}
                name: {{ default (include "dev-health.secretName" .) .Values.migrations.hook.externalSecretName }}
              {{- end }}
          env:
            {{- /*
            The PostgreSQL and ClickHouse heads dho applies are production's:
            the Celery->River route-table cutover (revision 0066) applied, and
            operational ordering contract 2. dho refuses any other value, naming
            it, before it connects; a database built under other settings must
            be re-created from the head.
            */}}
            - name: DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER
              value: {{ .Values.migrations.hook.celeryRiverCutover | quote }}
            - name: OPERATIONAL_ORDERING_CONTRACT
              value: {{ .Values.goWorkers.operationalOrderingContract | quote }}
            {{- with .Values.migrations.hook.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.migrations.hook.resources | nindent 12 }}
{{- end }}
