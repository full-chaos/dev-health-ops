name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        # A manual run is a request to test THIS ref, and it has no base/head
        # diff to filter against; computing one against the default branch
        # would let `gh workflow run test.yml` produce a run where every test
        # job skipped and the required `test` check still went green
        # (CHAOS-3482 Codex round 1). Leaving the filter unrun makes `code`
        # empty, which the job conditions below and
        # ci/aggregate_test_results.sh both read as "not 'true'" -- so the
        # dispatch clause, not the path filter, is what selects the jobs.
        # Same construction as lint.yml and typecheck.yml.
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              # This workflow decides whether the proof gate runs at all.
              # Without this pattern a PR that changed ONLY this file set
              # code=false, skipped both test jobs, and the required `test`
              # aggregator counted the skip as a pass -- the gate could be
              # disabled through a green required check.
              - '.github/workflows/**'
              - 'src/**'
              - 'tests/**'
              - 'ci/**'
              - 'migrations/**'
              - 'requirements.txt'
              # Both test jobs `pip install -r requirements-docs.txt` before
              # running anything, so it is part of the test environment. It
              # was missing here until CHAOS-3482 Codex round 2: a PR touching
              # only this file got code=false, skipped both test jobs, and the
              # aggregator -- correctly, by its own rule -- called that a
              # legitimate docs-only skip and reported the required check
              # green. test_paths_filter_covers_every_file_the_test_jobs_install
              # derives this list from the jobs' own install commands.
              - 'requirements-docs.txt'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'alembic.ini'
              - 'Makefile'
              - 'scripts/**'
              - 'alerts/**'
              - 'compose.yml'
              # docker/Dockerfile is one of scripts/acceptance's
              # RUNTIME_DEPENDENCY_PATHS: the acceptance suite hashes it and
              # asserts on it, so a change here can turn the suite red -- but
              # the filter did not select on it, so such a PR skipped every
              # test job and the gate went green (CHAOS-3482 Codex round 4).
              - 'docker/**'
              - 'deploy/**'

  # Fast, pytest-xdist-parallelized unit suite on the supported Python
  # version. This is the per-PR signal that the required `test` gate (below)
  # aggregates. Coverage is intentionally NOT gated here so the iterative PR
  # loop stays fast — the coverage-gated full suite runs in the `coverage` job
  # at merge time and on main (CHAOS-2586). Single-version matrix (CHAOS-3419):
  # containers ship 3.14 only (docker/Dockerfile), so that is the only
  # interpreter tested.
  test-matrix:
    needs: [changes]
    # On merge_group, dorny/paths-filter has no PR base/head diff to compute and
    # can report code=false, which would skip every test job; the `test`
    # aggregator then treats the skip as a pass and an untested change reaches
    # main. Always run in the merge queue regardless of the path filter, and
    # likewise on workflow_dispatch, where the filter is deliberately not run
    # (see the `changes` job) so a manual run cannot test nothing.
    if: >-
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    # Test matrix needs package read access for dependency installs.
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        python-version: ["3.14"]

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:25.1
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: ch
          CLICKHOUSE_PASSWORD: ch
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user ch --password ch --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-docs.txt

      - name: Run parallel unit test contract
        env:
          DATABASE_URI: clickhouse://ch:ch@localhost:8123/default
          CLICKHOUSE_URI: clickhouse://ch:ch@localhost:8123/default
          POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          SECONDARY_DATABASE_URI: mongodb://localhost:27017
          # No OTLP collector runs in CI; with OTEL on, the exporter retries to
          # localhost:4317 with backoff on every span/metric, flooding logs and
          # slowing the suite into timeouts. We don't assert OTEL stats in CI.
          OTEL_ENABLED: "false"
          # Cap xdist workers so parallelism does not contend on the single
          # postgres/clickhouse service container. The standard arm runner has
          # 4 vCPUs, so this matches `-n auto` there while staying predictable on
          # larger runners. Override PYTEST_XDIST_WORKERS to tune.
          PYTEST_XDIST_WORKERS: "4"
          PYTEST_ADDOPTS: --ignore=tests/test_0066_celery_river_cutover_postgres.py --ignore=tests/test_chaos_3337_source_class_postgres_migration.py --ignore=tests/api/admin/test_add_member_visibility.py --ignore=tests/api/dev/test_persistence_postgres.py
        run: |
          chmod +x ci/run_tests.sh
          mkdir -p test-results/logs
          set -o pipefail
          ./ci/run_tests.sh unit 2>&1 | tee test-results/logs/unit-${{ matrix.python-version }}.log

      # These files carry their own `isolated_postgres`/`require_postgres_test_uri`
      # fixtures that pytest.fail() (not skip) when CI/GITHUB_ACTIONS is set but
      # the needed URI is missing, so they cannot run in "Run parallel unit test
      # contract" above (no admin-privileged Postgres URI there) and are ignored
      # from it instead. DEV_HEALTH_TEST_POSTGRES_ADMIN_URI's database component
      # must be literally `postgres`: the fixture connects to it to CREATE/DROP a
      # throwaway per-test database on the same server.
      #
      # test_add_member_visibility.py (CHAOS-3411) has the same CI-must-fail
      # gate but only needs DEV_HEALTH_POSTGRES_TEST_URI (it isolates itself
      # with a CREATE SCHEMA on that same database, not a whole separate
      # database), so it doesn't need the admin URI -- it's listed here
      # rather than alongside it so a stripped commit can't silently pass by
      # having this step simply not exercise it (CHAOS-3411 Codex round 1:
      # the module was collected by neither PR-gated step with its URI set,
      # so it always skipped on pull_request).
      - name: Run PostgreSQL migration tests
        env:
          DEV_HEALTH_POSTGRES_TEST_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          DEV_HEALTH_TEST_POSTGRES_ADMIN_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
        run: |
          pytest -q \
            tests/test_0066_celery_river_cutover_postgres.py \
            tests/test_chaos_3337_source_class_postgres_migration.py \
            tests/test_canonical_incident_feature_flag_postgres_migration.py \
            tests/api/admin/test_add_member_visibility.py \
            tests/api/dev/test_persistence_postgres.py

      - name: Upload junit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-${{ matrix.python-version }}
          path: test-results/junit/*.xml
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-logs-${{ matrix.python-version }}
          path: |
            test-results/logs/*.log
            **/pytest.log
          if-no-files-found: ignore
          retention-days: 14

  # Full coverage-gated suite (ruff/mypy gates + unit tests with coverage
  # threshold + integration/e2e). Kept OFF the per-PR iterative path: it runs in
  # the merge queue (before code reaches main) and on push to main (post-merge
  # verification + Codecov upload), never on pull_request. Reassigned from the
  # retired 3.11 leg to 3.12 and parallelized with xdist (CHAOS-2586); moved to
  # 3.14 to match the shipped interpreter (CHAOS-3419).
  #
  # It also does not run on workflow_dispatch, because the path filter that
  # `code` comes from is not run there (see `changes`) and this condition is
  # unchanged: a manual run is the fast-suite path, proved by test-matrix,
  # which workflow_dispatch now always selects. The aggregator accepts this
  # skip for the same reason it accepts the pull_request one -- the job's own
  # condition did not select it -- and ci/aggregate_test_results.sh derives
  # that from this exact expression.
  coverage:
    needs: [changes]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'merge_group' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-26.04-arm
    # CHAOS-3413: this job has hung indefinitely (1h45m-6h, then auto-cancelled
    # by the next push's `cancel-in-progress` group) instead of failing, for
    # days -- `cancelled` isn't a red check, so it merged silently as routine
    # supersession while the COVERAGE_THRESHOLD=70 gate went unenforced. The
    # hang starts precisely at #1335 (2026-07-30T19:40:46Z), which first gave
    # this job DEV_HEALTH_POSTGRES_TEST_URI and so first let its live-Postgres
    # tests actually execute -- concurrently, under xdist -n4, against the one
    # shared Postgres service container, unlike `test-matrix` which serializes
    # them. Before that regression, this job completed successfully in a
    # consistent ~9m20s-11m30s (e.g. runs 30230488894, 30203314534,
    # 30098888467) every time back through at least 07-09; it has not
    # completed even once since. 25m is a deliberately generous multiple of
    # that real historical baseline, not a guess -- comfortable room for
    # coverage-instrumentation overhead plus whatever normal variance, while
    # still bounding an indefinite hang into a `failure` well inside a
    # workday. Tighten once the root fix (serializing the live-Postgres tests
    # the way test-matrix already does) restores a real completion to compare
    # against.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:25.1
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: ch
          CLICKHOUSE_PASSWORD: ch
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user ch --password ch --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-docs.txt

      - name: Run coverage-gated test contract
        env:
          DATABASE_URI: clickhouse://ch:ch@localhost:8123/default
          CLICKHOUSE_URI: clickhouse://ch:ch@localhost:8123/default
          POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          SECONDARY_DATABASE_URI: mongodb://localhost:27017
          COVERAGE_THRESHOLD: "70"
          DEV_HEALTH_POSTGRES_TEST_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          # ci_tests() (ci/run_tests.sh) does not --ignore the postgres-gated
          # migration test files, so they run inline here; without the admin
          # URI they would pytest.fail() under CI (see the dedicated
          # "Run PostgreSQL migration tests" step above for why `postgres` is
          # required as the database component).
          DEV_HEALTH_TEST_POSTGRES_ADMIN_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          OTEL_ENABLED: "false"
          PYTEST_XDIST_WORKERS: "4"
        run: |
          chmod +x ci/run_tests.sh
          mkdir -p test-results/logs
          set -o pipefail
          ./ci/run_tests.sh ci 2>&1 | tee test-results/logs/ci-3.14.log

      - name: Upload junit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Named for what it actually is: JUnit output from the
          # coverage-gated `ci` tier, not a coverage report. (See
          # coverage-py314 below for the actual coverage artifact.)
          name: junit-ci-gated
          path: test-results/junit/*.xml
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-logs-coverage
          path: |
            test-results/logs/*.log
            **/pytest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage.xml artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-py314
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # Required-status-check gate. Branch protection requires a check named
  # exactly "test"; the matrix above produces "test-matrix (3.14)"
  # and the coverage job produces "coverage", neither of which match. It is the
  # single required check for both PRs and the merge queue. Do not remove.
  #
  # The verdict lives in ci/aggregate_test_results.sh rather than inline here,
  # so it can be driven through the whole result matrix by
  # tests/tooling/test_aggregate_test_results.py. See that script's header for
  # why `needs.changes.result` -- not the downstream results alone -- is what
  # separates a legitimate skip from an upstream failure that skipped
  # everything (CHAOS-3482).
  test:
    name: test
    # Must remain `always()`. Under `!cancelled()` (or any condition that lets
    # this job itself skip) a cancelled run leaves the REQUIRED check *skipped*,
    # and branch protection counts a skipped required check as satisfied --
    # which moves the silent pass one level up instead of closing it.
    # Cancellation has to be reported by a job that actually ran, so this job
    # runs unconditionally and the script fails the gate on `cancelled`.
    if: always()
    needs: [changes, test-matrix, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aggregate test results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          chmod +x ci/aggregate_test_results.sh
          ./ci/aggregate_test_results.sh
