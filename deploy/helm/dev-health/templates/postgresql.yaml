{{- if .Values.postgresql.enabled }}
{{- $existing := .Values.postgresql.credentialsSecret.existingSecret }}
{{- if and $existing.name .Values.secrets.create }}
{{- fail "postgresql.credentialsSecret.existingSecret.name needs secrets.create=false: with the chart-owned shared Secret the URI Secrets would embed postgresql.credentials.password, which this setting stops the chart from using" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dev-health.fullname" . }}-postgresql-hba
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "postgresql" "context" $) | nindent 4 }}
data:
  pg_hba.conf: |
    # Chart-owned client authentication (postgresql.hba). Every client gives a
    # scram-sha-256 password: the local socket and loopback too. No replication line.
    # TYPE  DATABASE  USER  ADDRESS        METHOD
    local   all       all                  scram-sha-256
    host    all       all   127.0.0.1/32   scram-sha-256
    host    all       all   ::1/128        scram-sha-256
    host    all       all   0.0.0.0/0      scram-sha-256
    host    all       all   ::/0           scram-sha-256
---
{{- if not $existing.name }}
{{- /* The same value as the POSTGRES_PASSWORD env below. It renders with the store
       whatever postgresql.credentialsSecret.enabled says, so it exists before the
       StatefulSet is told to read it. With existingSecret.name set the chart reads that
       Secret instead and renders none. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dev-health.fullname" . }}-postgresql-credentials
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "postgresql" "context" $) | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.credentials.password | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dev-health.fullname" . }}-postgresql
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "postgresql" "context" $) | nindent 4 }}
spec:
  serviceName: {{ include "dev-health.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "postgresql" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "postgresql" "context" $) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.postgresql.hba.enabled }}
      volumes:
        - name: pg-hba
          configMap:
            name: {{ include "dev-health.fullname" . }}-postgresql-hba
      {{- end }}
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
          {{- if .Values.postgresql.hba.enabled }}
          {{- /* The entrypoint runs `postgres` with these. hba_file takes effect only at
                 server start; a later edit of the ConfigMap needs pg_reload_conf(). */}}
          args:
            - -c
            - hba_file=/etc/postgresql/hba/pg_hba.conf
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.credentials.user | quote }}
            - name: POSTGRES_PASSWORD
              {{- if $existing.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $existing.name | quote }}
                  key: {{ $existing.key | default "POSTGRES_PASSWORD" | quote }}
              {{- else if .Values.postgresql.credentialsSecret.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "dev-health.fullname" . }}-postgresql-credentials
                  key: POSTGRES_PASSWORD
              {{- else }}
              value: {{ .Values.postgresql.credentials.password | quote }}
              {{- end }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.credentials.database | quote }}
            # Must match the compose stack exactly: the volume is mounted at the
            # parent /var/lib/postgresql and PGDATA is a subdirectory of it,
            # never the mount root (which holds lost+found and other reserved
            # entries) and never the image's own default (which moves between
            # majors). Leaving PGDATA unset only ever worked by coincidence:
            # through 17 the image default was /var/lib/postgresql/data, which
            # happened to equal the old mount path, and 18 relocated it to
            # /var/lib/postgresql/<major>/docker, at which point the entrypoint
            # refuses to start against an "unused" mount. See
            # https://github.com/docker-library/postgres/pull/1259.
            - name: PGDATA
              value: /var/lib/postgresql/pgdata
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          {{- if or .Values.postgresql.persistence.enabled .Values.postgresql.hba.enabled }}
          volumeMounts:
            {{- if .Values.postgresql.persistence.enabled }}
            - name: postgres-data
              mountPath: /var/lib/postgresql
            {{- end }}
            {{- if .Values.postgresql.hba.enabled }}
            - name: pg-hba
              mountPath: /etc/postgresql/hba
              readOnly: true
            {{- end }}
          {{- end }}
          {{- /* pg_isready gets an answer without a password, so the probes stay
                 green when every rule asks for one. */}}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.credentials.user | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.credentials.user | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-postgresql
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "postgresql" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "postgresql" "context" $) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
