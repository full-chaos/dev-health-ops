# ci/bigboy/compose.bigboy.yml (CHAOS-9962): the ONE compose file of the bigboy stack, with profiles for the optional services.
# It is the compose merge of the twelve files stack.sh used to chain (base, go-workers, sweep, images, workers, clickhouse-users,
# billing-edge, router and the one-off overlays smoke, prove, hook-check, river-apply); `docker compose config` of the old live chain
# and of this file was byte-identical when this file was made (PR of CHAOS-9962; internal/cigates/bigboy/compose_one_file_test.go keeps the service list of each old set). Start it with plain docker compose:
#   docker compose -p dev-health --project-directory "$BIGBOY_ROOT" --env-file ops/.env --env-file _records/images.env -f ops/ci/bigboy/compose.bigboy.yml up -d --no-deps --no-build <service>
# Restarts (CHAOS-10181): every long-running service has `restart: unless-stopped`, a one-shot none (internal/bigboycompose
# restart_policy_test.go). A docker daemon restart (an apt upgrade of docker-ce or containerd) stops every container; after
# one, check `docker ps -a --filter name=dev-health-acr-mcp` and the acr projector replay state. Any `-p dev-health`
# down/up/restart carries `--profile acr` or names only the ops services, and is announced to MCP first (as is a docker-ce
# or containerd upgrade).
# Profiles: smoke (web-smoke), venue (venue-prove, venue-tools), venue-hook, venue-river (one profile each: the old hook-check and river-apply
# chains held only their own one-off),
# and the others of the base file. A one-off service reads its variables with a default, never `:?`: compose interpolates the
# services of an inactive profile too, so a required variable would fail every other command. The script that starts a one-off
# service checks its variables first (web-path-smoke.sh, bigboy-graphql-prove.sh, bigboy-hook-check.sh, bigboy-river-apply.sh).
# The three image pins and DHO_API_CH_USERS_XML are required (`:?`) and come from the env file _records/images.env. BIGBOY_OPERATOR_IMAGE
# alone has a default, the placeholder tag :not-resolved (what stack.sh used for a verb that starts no worker): a plain `ps` or `config` renders
# without it, and starting a worker without the real digest fails at the pull instead of running a wrong image.
# The image digests are NOT in this file: ${BIGBOY_DHO_IMAGE}, ${BIGBOY_API_TOOLS_IMAGE}, ${BIGBOY_WEB_IMAGE} and ${BIGBOY_OPERATOR_IMAGE}
# come from the pins env file (_records/images.env, tracked copy ci/bigboy/images.env), which bigboy-repin*.sh rewrite at every cut.
# The comment blocks below quote the retired files as they were: where one says the images overlay holds a digest, read the pins env file.
#
# The comments of the twelve retired files, one block each (the full text is in git history):
#
# ---- was compose.bigboy.base.yml ----
#
# ---- was compose.bigboy.go-workers.yml ----
#
# ---- was compose.bigboy.sweep.yml ----
# CHAOS-8693: the bigboy reconciler runs the unreclaimable dispatch sweep ACTIVE. This was the untracked lane override
# reconciler-sweep-override.yml. The compiled default of --unreclaimable-sweep is `shadow` (internal/platform/config/
# options.go) and no other file of the chain sets it, so it is stated here, in every set that renders the base file.
#
# ---- was compose.bigboy.images.yml ----
# gwc-venue-bigboy (2026-09-20, chris: "just go ahead and deploy bigboy images"). The ops image digests below are
# re-pinned at every bigboy cut (bigboy-repin.sh, or a roll sheet that copies this file); the digests in this tracked
# copy are the last ones a PR recorded, not the build bigboy runs now. The host copy (compose/compose.bigboy.images.yml)
# is the running pin.
# Self-contained: also carries compose.bigboy.overrides.yml content (query-api x2 + ports) so the
# recreate does not drop the running project's overrides.
# CHAOS-8361: the stack is Go-only. No service here runs the Python api image: the `api` service of the base
# compose.yml is in a profile nothing enables, `migrate` runs the dho image, the smoke runner (`web-smoke` below,
# CHAOS-8647) runs `dho smoke web-path` from the dho image, and venue-prove is on the stack's networks itself.
#
# ---- was compose.bigboy.workers.yml ----
# CHAOS-7838: tracked copy of the bigboy worker plane (it was an untracked host file, which is how the heavy group, queues investment/metrics/reports/workgraph, went missing from the cut on 2026-09-20/21). The derived test internal/bigboycompose/worker_plane_test.go ties every queue of ops/compose.yml to a service here and to the cut's up list.
# bigboy worker plane from the cut's CI OPERATOR digest (Trap #420: a cut pass must recreate every plane from CI digests; the workers had been a 09-20 local build).
# Image = ${BIGBOY_OPERATOR_IMAGE} (set by bigboy-cut.sh from the cut sha). dho verbs as in the chart (deploy templates go-workers.yaml).
#
# ---- was compose.bigboy.clickhouse-users.yml ----
# CHAOS-7162: bigboy declares the go-api's ClickHouse login (dho_api_ch) through a host file mounted into
# ClickHouse's users.d, so it survives a container recreate. It used to be `docker cp`ed into the running
# container's filesystem (bigboy-ch-login.sh); the 03:29Z CHAOS-7079 recreate rebuilt users.d from the
# image and the user was lost, and go-api then failed every ClickHouse call with code 516.
#
# The file holds only <password_sha256_hex> and the grant statements (never a password), and MUST be
# world-readable (0644): clickhouse-server runs as uid 101 inside the container and EXITS (code 91) when
# a mounted users.d file it cannot read is 0600 and owned by the host user (executed against the pinned
# image). ci/bigboy/check-dho-api-ch-user.sh refuses such a file (and any file that is not the canonical render) before anything is recreated, and
# `cigate bigboy render-ch-users` writes it 0644.
#
# The host path is required, never defaulted here: a bind mount of a path that does not exist makes
# Docker create a DIRECTORY there, and ClickHouse then fails to start. bigboy-cut.sh exports the default
# ($BIGBOY_ROOT/.go-api-dev/dho_api_ch.xml) and checks the file before it recreates go-api.
#
# ---- was compose.bigboy.billing-edge.yml ----
# CHAOS-7055: bigboy serves the Stripe webhook host from the go-api billing-edge listener (:8010), as prod does
# (CHAOS-6903, CHAOS-6925), and the Python `billing-edge` service is retired. Applies with the bigboy cut that
# restarts go-api; never on its own while go-api is in use.
#   * go-api gains `--api-billing-edge-addr=:8010` (the images overlay's command is just ["api"]; every other
#     listener setting stays as it is) and a traefik router for the host the Python service answered
#     (Host(`billing.localhost`), the same rule and entrypoint it carried), now to port 8010.
#   * the three values the listener needs reach go-api BY NAME from the stack's env file (--env-file ops/.env):
#     they are never written here. Unset, the listener's /health names the missing one (503), as the Python edge did.
#   * `billing-edge` is moved to a profile nothing enables, so `up` never starts it and `ps` never lists it;
#     the existing container is removed BEFORE the cut's `up` (`docker compose ... rm -sf billing-edge`, one approved
#     line on the lead's GO): until it is gone two containers claim Host(`billing.localhost`). The go-api router is
#     named `billing-go`, not `billing`, so the old container's router `billing` is never redefined while both exist.
#
# ---- was compose.bigboy.router.yml ----
# CHAOS-6987 (D2724): bigboy plane-split router. Adds traefik's file provider (the routes it
# loads are GENERATED by `cigate plane-split-router` (internal/cigates/routing) from deploy/values.prod.yaml's
# ingress.goApiPaths/queryApiPaths -- never hand-maintained) and points web's server-side
# BACKEND_URL at the router instead of straight at the Python api, so both browser-origin
# (commanderkeen.dev) and server-side traffic get the same plane split prod's own Ingress gives.
# Touches ONLY traefik and web -- go-api and query-api are referenced by address in the dynamic
# file (.traefik-dynamic/planes.yml) and are never recreated. CHAOS-8361: no rule of that file
# names the Python api; a path with no plane rule reaches go-api (its native 404), as in prod.
#
# ---- was compose.bigboy.smoke.yml ----
# CHAOS-6987/R460 (2026-09-27): the web-path smoke's own one-off runner. Kept OUT of
# bigboy-cut.sh's shared -f chain (compose.bigboy.router.yml etc.) on purpose -- the
# password-file bind mount below only resolves once DHO_SMOKE_ADMIN_PASSWORD_FILE is
# confirmed non-blank (web-path-smoke.sh's own presence gate), and folding this file
# into every other invocation would make an empty/unset var break unrelated STEPs.
# Invoked ONLY by web-path-smoke.sh, after that gate passes.
#
# ---- was compose.bigboy.prove.yml ----
# CHAOS-6993: the bigboy GraphQL prove harness's one-off additions to venue-prove.
# Used ONLY by bigboy-graphql-prove.sh, never in bigboy-cut.sh's shared -f chain, so an
# unset PROVE_* variable can never break an unrelated STEP.
#
# venue-prove is on the stack's networks (the edge is the routed /graphql on the router,
# Go-edge mode: CHAOS-8361, there is no Python edge) and carries POSTGRES_URI,
# GO_API_PROVE_VENUE_ACK and the GO_API_ENVELOPE_* identifiers, with the envelope key file
# mounted at /keys/envelope.pem. `dho goapi prove` also mints the edge access token in
# process, which needs JWT_SECRET_KEY: compose substitutes it from ops/.env (--env-file, D2728), so the value
# never passes through a shell variable, argv or file of the operator.
#
# ---- was compose.bigboy.hook-check.yml ----
# bigboy-hook-check.sh's one-off operator shell (CHAOS-8371, D4566 class rules). Never started by `up` (profile venue); the
# script appends this file to COMPOSE_FILE for its own calls only. The image is the operator image the script derives from the
# pinned sha (an image reference, passed as HOOK_OPERATOR_IMAGE: not a credential). The two DSNs are interpolated by COMPOSE from
# ops/.env (`--env-file`) with the same defaults compose.yml gives the stack, so no script variable, argv, `-e` or script-written env
# file ever carries a credential, and nothing is read out of the api container with printenv. The image's own entrypoint
# is the dho operator, as in the prod migrate hook Job.
#
# ---- was compose.bigboy.river-apply.yml ----
# bigboy-river-apply.sh's one-off dho shell (CHAOS-8371, D4566 class rules). Never started by `up` (profile venue); the script
# appends this file to COMPOSE_FILE for its own calls only. The image is the overlay's pinned dho digest (RIVER_DHO_IMAGE: an image
# reference, not a credential). The DSN password is interpolated by COMPOSE from ops/.env (`--env-file`) with the stack's own
# default: no script variable, argv or `-e` carries it, and nothing is read out of the api container with printenv.
name: dev-health
networks:
  dev-health:
    driver: bridge
  dho-clickhouse-readers:
    driver: bridge
    internal: true
    ipam:
      config:
      - subnet: 10.199.80.0/28
    name: dho-clickhouse-readers
  dho-query-internal:
    driver: bridge
    internal: true
    ipam:
      config:
      - subnet: 10.199.79.0/28
    name: dho-query-internal
  acr:
    driver: bridge
    name: dev-health-acr
  acr-edge:
    driver: bridge
    name: dev-health-acr-edge
  auth_plane:
    driver: bridge
  acr_auth_workload:
    driver: bridge
# The env of the auth one-shots (CHAOS-12976); auth-migrate and auth-grants add AUTH_SESSION_READER_ROLES (CHAOS-12978).
x-auth-migration-env: &auth-migration-env
  AUTH_DATABASE_SCHEMA: auth
  AUTH_MIGRATION_DATABASE_URI: host=postgres port=5432 user=devhealth_auth_migrator password='${AUTH_MIGRATION_DATABASE_PASSWORD:-devhealth_auth_migrator}' dbname=${POSTGRES_DB:-devhealth} sslmode=disable
  AUTH_RUNTIME_DATABASE_ROLE: devhealth_auth
  AUTH_SCHEMA_OWNER_ROLE: devhealth_auth_migrator
  # CHAOS-13356: users are owned here, as prod's phase 4: auth-migrate and auth-grants keep the owned grant set.
  AUTH_USERS_OWNED: 'true'
services:
  bugsink:
    container_name: bugsink
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      BASE_URL: ${BUGSINK_BASE_URL:-http://localhost:8800}
      CREATE_SUPERUSER: ${BUGSINK_CREATE_SUPERUSER:-admin@dho.com:devhealth}
      DATABASE_URL: postgresql://devhealth:devhealth@postgres:5432/bugsink
      PORT: '8000'
      SECRET_KEY: ${BUGSINK_SECRET_KEY:-8b3526db037025ac466df192f45da65de5111896f4b7a4e40757dbb4b82ce191}
    image: bugsink/bugsink:latest
    labels:
      logging.service.name: bugsink
      logging.service.namespace: dev-health
      traefik.enable: 'true'
      traefik.http.routers.bugsink.entrypoints: web
      traefik.http.routers.bugsink.rule: Host(`bugs.localhost`)
      traefik.http.services.bugsink.loadbalancer.server.port: '8000'
      traefik.scope: dev-health
    networks:
      dev-health: null
    restart: unless-stopped
  clickhouse:
    environment:
    - CLICKHOUSE_DB=${CLICKHOUSE_DB:-default}
    - CLICKHOUSE_LISTEN_HOST=0.0.0.0
    - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-ch}
    - CLICKHOUSE_USER=${CLICKHOUSE_USER:-ch}
    - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 30s
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8123/ping
      timeout: 5s
    image: clickhouse/clickhouse-server:26.9.14.10
    networks:
      dev-health: null
      dho-clickhouse-readers: null
    ports:
    - ${CLICKHOUSE_HTTP_PORT:-8123}:8123
    - ${CLICKHOUSE_NATIVE_PORT:-9000}:9000
    restart: unless-stopped
    ulimits:
      nofile:
        hard: 262144
        soft: 262144
    volumes:
    - source: clickhouse_data
      target: /var/lib/clickhouse
      type: volume
      volume: {}
    - read_only: true
      source: ${DHO_API_CH_USERS_XML:?set DHO_API_CH_USERS_XML to the host path of dho_api_ch.xml}
      target: /etc/clickhouse-server/users.d/dho_api_ch.xml
      type: bind
      bind:
        create_host_path: true
    - read_only: true
      source: ./ops/docker/clickhouse-config.d/system-logs.xml
      target: /etc/clickhouse-server/config.d/system-logs.xml
      type: bind
      bind:
        create_host_path: false
  go-api:
    command:
    - api
    - --api-billing-edge-addr=:8010
    entrypoint:
    - /usr/local/bin/dho
    env_file:
    - path: ./.go-api-dev/go-api.env
      required: true
    environment:
    - AUTH_ACCESS_TOKEN_ISSUER=https://auth.bigboy.internal:8443
    - AUTH_PROXY_CREDENTIALS=true
    - AUTH_PROXY_LOCAL_LOGIN=true
    - AUTH_PROXY_SESSIONS=true
    - AUTH_PROXY_URL=http://auth-service:8095
    - AUTH_SESSION_ISSUE_CREDENTIAL=workload
    - AUTH_USERS_OWNED=true
    - AUTH_WORKLOAD_BOOTSTRAP_FILE=/run/workload/api.bootstrap
    - AUTH_WORKLOAD_ISSUER=https://auth.bigboy.internal:8443
    - CORS_ALLOWED_ORIGINS=http://localhost:3000
    - DEV_HEALTH_API_INTERNAL_ADDR=:8091
    - LICENSE_PRIVATE_KEY=${LICENSE_PRIVATE_KEY:-}
    - SSL_CERT_DIR=/run/auth-issuer-ca
    - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
    - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    image: '${BIGBOY_DHO_IMAGE:?BIGBOY_DHO_IMAGE is the image pin: pass --env-file _records/images.env}'
    labels:
      traefik.enable: 'true'
      traefik.http.routers.billing-go.entrypoints: web
      traefik.http.routers.billing-go.rule: Host(`billing.localhost`)
      traefik.http.routers.billing-go.service: billing-go
      traefik.http.services.billing-go.loadbalancer.server.port: '8010'
      traefik.scope: dev-health
    networks:
      dev-health: null
      dho-query-internal: null
    ports:
    - host_ip: 127.0.0.1
      mode: ingress
      protocol: tcp
      published: '8093'
      target: 8000
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${BIGBOY_AUTH_ISSUER_TLS_DIR:-/var/lib/oci-cache/mcp-venue/auth-issuer-tls}/ca
      target: /run/auth-issuer-ca
      read_only: true
      bind:
        create_host_path: false
    - type: volume
      source: go_api_workload_bootstrap
      target: /run/workload
      read_only: true
  go-contractcheck:
    build:
      context: ${DEV_HEALTH_OPS_ROOT:-./ops}
      dockerfile: docker/go-worker.Dockerfile
      target: contractcheck
    cap_drop:
    - ALL
    command:
    - validate
    depends_on:
      go-worker-migrate:
        condition: service_completed_successfully
        required: true
    network_mode: none
    pull_policy: build
    read_only: true
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    user: 65532:65532
  go-reconciler:
    command:
    - reconciler
    - --shutdown-timeout=60s
    - --http-addr=:8080
    depends_on:
      go-worker-migrate:
        condition: service_completed_successfully
        required: true
      pgbouncer:
        condition: service_healthy
        required: true
      pgbouncer-river-coordinator:
        condition: service_healthy
        required: true
      pgbouncer-river-queue:
        condition: service_healthy
        required: true
    entrypoint:
    - /usr/local/bin/dho
    env_file:
    - path: ./ops/.env
      required: false
    environment:
    - API_DATABASE_URI=
    - AUTH_DATABASE_URI=
    - AUTH_MIGRATION_DATABASE_URI=
    - COORDINATOR_DATABASE_MODE=session
    - COORDINATOR_DATABASE_URI=postgresql://${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}:${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}@pgbouncer-river-coordinator:6434/${POSTGRES_DB:-devhealth}
    - DATABASE_URI=
    - DATABASE_URL=
    - DEV_HEALTH_LOG_LEVEL=${LOG_LEVEL:-info}
    - GO_API_REGISTRY_POSTGRES_URI=
    - MIGRATION_DATABASE_URI=
    - OPERATIONAL_ORDERING_CONTRACT=${OPERATIONAL_ORDERING_CONTRACT:-2}
    - PGBOUNCER_TRANSACTION_MODE=true
    - POSTGRES_URI=postgresql://${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}:${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}@pgbouncer:6432/${POSTGRES_DB:-devhealth}
    - POSTGRES_URL=
    - RIVER_COORDINATOR_DATABASE_ROLE=${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
    - RIVER_DATABASE_SCHEMA=${RIVER_DATABASE_SCHEMA:-river}
    - RIVER_DOMAIN_DATABASE_ROLE=${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
    - RIVER_QUEUE_DATABASE_ROLE=${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
    - WORKER_COORDINATOR_DATABASE_MAX_CONNS=${WORKER_COORDINATOR_DATABASE_MAX_CONNS:-2}
    - WORKER_DATABASE_MAX_CONNS=${WORKER_DATABASE_MAX_CONNS:-2}
    - WORKER_DATABASE_MODE=session
    - WORKER_DATABASE_URI=postgresql://${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}:${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}@pgbouncer-river-queue:6433/${POSTGRES_DB:-devhealth}
    - WORKER_DOMAIN_DATABASE_MAX_CONNS=${WORKER_DOMAIN_DATABASE_MAX_CONNS:-4}
    - SYNC_UNRECLAIMABLE_SWEEP=active
    - CLICKHOUSE_URI=
    - DEV_HEALTH_CH_DB=${CLICKHOUSE_DB:-default}
    - DEV_HEALTH_CH_HOST=clickhouse
    - DEV_HEALTH_CH_PASSWORD=${CLICKHOUSE_PASSWORD:-ch}
    - DEV_HEALTH_CH_PORT=9000
    - DEV_HEALTH_CH_USER=${CLICKHOUSE_USER:-ch}
    expose:
    - '8080'
    image: ${BIGBOY_OPERATOR_IMAGE:-ghcr.io/full-chaos/dev-health-go-operator:not-resolved}
    labels:
      logging.service.name: dev-health-go-reconciler
      logging.service.namespace: dev-health
    networks:
      dev-health: null
    pull_policy: build
    restart: unless-stopped
  go-river-provision:
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    entrypoint:
    - /bin/sh
    - -ec
    - "exec psql \\\n  --host=postgres \\\n  --username=\"${POSTGRES_USER:-devhealth}\" \\\n  --dbname=\"${POSTGRES_DB:-devhealth}\" \\\n  --set=ON_ERROR_STOP=1 \\\n  --set=domain_role=\"$$RIVER_DOMAIN_DATABASE_ROLE\" \\\n  --set=queue_role=\"$$RIVER_QUEUE_DATABASE_ROLE\" \\\n  --set=coordinator_role=\"$$RIVER_COORDINATOR_DATABASE_ROLE\" \\\n  --set=domain_password=\"$$RIVER_DOMAIN_DATABASE_PASSWORD\" \\\n  --set=queue_password=\"$$RIVER_QUEUE_DATABASE_PASSWORD\" \\\n  --set=coordinator_password=\"$$RIVER_COORDINATOR_DATABASE_PASSWORD\" \\\n  --file=/opt/dev-health/provision_river_roles.sql\n"
    env_file:
    - path: ./ops/.env
      required: true
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-devhealth}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_DOMAIN_DATABASE_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
    image: postgres:18-alpine
    networks:
      dev-health: null
    restart: 'no'
    volumes:
    - read_only: true
      source: ${DEV_HEALTH_OPS_ROOT:-./ops}/scripts/worker/provision_river_roles.sql
      target: /opt/dev-health/provision_river_roles.sql
      type: bind
      bind:
        create_host_path: true
  go-scheduler:
    command:
    - scheduler
    - --shutdown-timeout=60s
    - --http-addr=:8080
    depends_on:
      go-worker-migrate:
        condition: service_completed_successfully
        required: true
      pgbouncer:
        condition: service_healthy
        required: true
      pgbouncer-river-coordinator:
        condition: service_healthy
        required: true
      pgbouncer-river-queue:
        condition: service_healthy
        required: true
    entrypoint:
    - /usr/local/bin/dho
    env_file:
    - path: ./ops/.env
      required: false
    environment:
      API_DATABASE_URI: ''
      AUTH_DATABASE_URI: ''
      AUTH_MIGRATION_DATABASE_URI: ''
      COORDINATOR_DATABASE_MODE: session
      COORDINATOR_DATABASE_URI: postgresql://${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}:${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}@pgbouncer-river-coordinator:6434/${POSTGRES_DB:-devhealth}
      DATABASE_URI: ''
      DATABASE_URL: ''
      DEV_HEALTH_HTTP_ADDR: :8080
      DEV_HEALTH_LOG_LEVEL: ${LOG_LEVEL:-info}
      GO_API_REGISTRY_POSTGRES_URI: ''
      MIGRATION_DATABASE_URI: ''
      OPERATIONAL_ORDERING_CONTRACT: ${OPERATIONAL_ORDERING_CONTRACT:-2}
      PGBOUNCER_TRANSACTION_MODE: 'true'
      POSTGRES_URI: postgresql://${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}:${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}@pgbouncer:6432/${POSTGRES_DB:-devhealth}
      POSTGRES_URL: ''
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
