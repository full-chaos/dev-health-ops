# Source: dev-health/charts/ops/templates/postgresql.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-health-ops-postgresql-hba
  namespace: dev-health
  labels:
    helm.sh/chart: ops-0.1.0
    app.kubernetes.io/name: ops
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: dev-health
    app.kubernetes.io/component: postgresql
data:
  pg_hba.conf: |
    # Chart-owned client authentication (postgresql.hba). Every client gives a
    # scram-sha-256 password: the local socket and loopback too. No replication line.
    # TYPE  DATABASE  USER  ADDRESS        METHOD
    local   all       all                  scram-sha-256
    host    all       all   127.0.0.1/32   scram-sha-256
    host    all       all   ::1/128        scram-sha-256
    host    all       all   0.0.0.0/0      scram-sha-256
    host    all       all   ::/0           scram-sha-256

