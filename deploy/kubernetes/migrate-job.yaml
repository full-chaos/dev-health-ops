---
# Database migration Job (CHAOS-2304)
#
# Applies PostgreSQL (Alembic plus River when MIGRATION_DATABASE_URI is set)
# and ClickHouse schema migrations, then exits. Existing direct POSTGRES_URI
# deployments remain Alembic-only compatible. App pods run with
# AUTO_RUN_MIGRATIONS=false (see
# configmap.yaml) so they never ambient-migrate — migration 042+ does
# shadow-table rebuilds that are not safe to run concurrently from workers.
#
# IMPORTANT — ordering: Kubernetes Jobs do NOT gate Deployments. This Job must
# complete BEFORE rolling out new api/worker images. Recommended sequence:
#
#   kubectl -n dev-health delete job dev-health-migrate --ignore-not-found
#   kubectl apply -k deploy/kubernetes/   # or apply this file alone
#   kubectl -n dev-health wait --for=condition=complete --timeout=600s \
#     job/dev-health-migrate
#   # ...then roll out the app Deployments (kubectl rollout restart ...)
#
# A Job is used (not a migrating initContainer on the api Deployment) because
# api/worker run multiple replicas under HPAs — per-pod initContainers would
# run the same DDL concurrently, which is exactly the race this Job removes.
# The api/worker `wait-for-migrations` initContainers are NOT that: they only
# poll the read-only `dev-hops migrate clickhouse status --check` (no DDL)
# until this Job has brought the schema current.
#
# MIGRATION_DATABASE_URI (preferred) or compatibility POSTGRES_URI must point
# DIRECTLY at Postgres (port 5432), never at a transaction-mode pooler
# (PgBouncer/RDS Proxy): migrations run raw DDL.
# See docs/operate/configure/databases-and-storage.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: dev-health-migrate
  namespace: dev-health
  labels:
    app.kubernetes.io/name: dev-health-migrate
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: dev-health-ops
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-health-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: ghcr.io/your-org/dev-health-ops:latest
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - sh
            - -c
            - >-
              if [ -z "${MIGRATION_DATABASE_URI:-}" ];
              then unset MIGRATION_DATABASE_URI; fi;
              if [ -n "$POSTGRES_URI" ]
              || [ "${MIGRATION_DATABASE_URI+x}" = x ]
              || [ "${MIGRATION_DATABASE_URI_FILE+x}" = x ];
              then dev-hops migrate postgres; fi
              && dev-hops migrate clickhouse
          envFrom:
            - configMapRef:
                name: dev-health-config
            # CHAOS-4587 (codex delta round 2/3, P1): migration 067 checks
            # OPERATIONAL_ORDERING_CONTRACT (defined in this ConfigMap, see
            # go-workers.yaml) to decide whether to apply the
            # ordering-contract cutover -- without this reference, bumping
            # the ConfigMap's value at cutover would move every go-* worker
            # but never this Job, so 067 would silently defer while workers
            # started against a still-contract-1 table. Reuses the same
            # go-worker ConfigMap deliberately (not the shared
            # dev-health-config one) so there is exactly one place to bump
            # this value, not two that could drift. `optional: true` because
            # this file's own header documents applying it standalone
            # ("kubectl apply -k deploy/kubernetes/ # or apply this file
            # alone") on a fresh/partial cluster where go-workers.yaml --
            # and therefore this ConfigMap -- may not exist yet; a required
            # ref there would leave the Job in CreateContainerConfigError
            # and no migrations would run at all.
            - configMapRef:
                name: dev-health-go-worker-config
                optional: true
            - secretRef:
                name: dev-health-migration-secrets
          env:
            - name: DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER
              valueFrom:
                secretKeyRef:
                  name: dev-health-migration-secrets
                  key: DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
