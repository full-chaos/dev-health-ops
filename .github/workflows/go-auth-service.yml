# Quality and release gates for the Auth Control Plane tree (CHAOS-4887, Wave 1
# of CHAOS-3274): go test and -race scoped to the auth packages, the
# production-middleware stack test (G-69), one fuzz run per parser (grouped by package) and
# a strict govulncheck (any reachable finding fails, except an exact id+module+version row of ci/auth-vuln-exceptions.tsv that has no fixed version). The gate logic lives in `ci/check_go.sh auth`;
# this file only schedules it.
#
# RELEVANCE IS DECIDED INSIDE, not in the trigger (the go-quality.yml design,
# CHAOS-4834): the workflow runs on every pull request, `auth-changes` computes
# whether the change touches the auth packages' import closure, the auth
# contracts, go.mod/go.sum or the gate's own files (`check_go.sh auth relevant`),
# and the gate jobs run only then. `auth-gate` ALWAYS reports: it fails when a
# gate job failed, was cancelled, or was skipped on a relevant change, and says
# in plain text when the change was not relevant. Two outcomes, both executed in
# CI: an auth change runs every job below; a change outside the closure runs only
# `auth-changes` and `auth-gate`.
#
# JOB NAMES must not reuse a required context (test, lint, go-quality,
# metrics-executed-proof; ops main ruleset 5324160): a second producer of a
# required context is the CHAOS-4834 defect class. tests/tooling/
# test_go_auth_service_workflow.py pins the names, the fuzz matrix against the
# registry in ci/check_go.sh, and the gate's fan-in.
name: Go auth service

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['**']
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  # A ready_for_review run gets its own group keyed by the head sha and is never cancelled: a synchronize run of the
  # same sha (a push right before the flip) cannot cancel it, and its ready-reuse job waits for that run instead.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}${{ github.event.action == 'ready_for_review' && '-ready-' || '' }}${{ github.event.action == 'ready_for_review' && github.event.pull_request.head.sha || '' }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.event.action != 'ready_for_review') || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

# CHAOS-12858: "|" falls back to direct on ANY proxy error; the default "," only on 404/410.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  # Ready flip: names the legs that already passed on this exact head sha (ci/ready_reuse.sh, read from the BASE commit
  # so a change cannot rewrite its own judge); each leg below skips when its unit is in `passed`, and its gate prints
  # REUSED for it. Every other event, and a base without the script, passes [] and every leg runs.
  ready-reuse:
    name: ready-reuse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.reuse.outputs.passed || '[]' }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - name: Check out the reuse judge from the base commit
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: ci/ready_reuse.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Name the legs that already passed on this head sha
        id: reuse
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          READY_REUSE_UNITS: |
            auth-go-quality exact 1 - auth-go-quality
            auth-test exact 1 - auth-test
            auth-race exact 1 - auth-race
            auth-race-integration exact 1 - auth-race-integration
            auth-fuzz prefix 1 - auth-fuzz (
            auth-corpus-queue prefix 3 - auth-corpus-queue (
        run: |
          if [ ! -f ci/ready_reuse.sh ]; then
            echo "READY REUSE OFF: the base commit has no ci/ready_reuse.sh; every leg runs"
            echo 'passed=[]' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          bash ci/ready_reuse.sh

  auth-changes:
    if: (!(github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci:full')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
      corpus: ${{ steps.corpus.outputs.corpus }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
          # CHAOS-10486: no setup-go cache here. Its key is shared by every workflow, and a job that compiles little or
          # nothing saved it first and left the heavy jobs an empty entry.
          cache: false
      # merge_group: ci/auth_queue_relevance.sh applies the pull request rule (check_go.sh auth relevant) to the whole
      # group, merge-base(target branch tip, entry head)..entry head, and fails closed (any fetch, merge-base or rule
      # error = relevant). A push to main and every other event: relevant, forced.
      - name: Does the change touch the auth service tree?
        id: relevance
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "merge_group" ]; then
            if [[ "${MG_BASE_REF}" == refs/heads/* ]] \
              && git fetch --no-tags origin "+${MG_BASE_REF}:refs/remotes/origin/auth-relevance-base" \
              && tip="$(git rev-parse --verify 'refs/remotes/origin/auth-relevance-base^{commit}')"; then
              bash ci/auth_queue_relevance.sh "${tip}" "${MG_HEAD_SHA}" > relevance.txt || echo "relevant=true" > relevance.txt
            else
              echo "cannot resolve the target branch ${MG_BASE_REF}: the auth gates run"
              echo "relevant=true" > relevance.txt
            fi
            cat relevance.txt
            grep -xE 'relevant=(true|false)' relevance.txt >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${EVENT}" != "pull_request" ]; then
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
            echo "auth gates run: ${EVENT} is not a pull request or a merge queue entry"
            exit 0
          fi
          bash ci/check_go.sh auth paths-selftest
          mb="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          echo "merge base ${mb}"
          git diff --name-only "${mb}" "${HEAD_SHA}"
          bash ci/check_go.sh auth relevant "${mb}" "${HEAD_SHA}" | tee relevance.txt
          grep -E '^relevant=(true|false)$' relevance.txt >> "${GITHUB_OUTPUT}"

      # CHAOS-11596: a separate verdict for the external auth corpus (auth-corpus-queue). Its path set is
      # ci/auth_corpus_paths.txt, not the auth import closure above. CHAOS-12993: the corpus runs on a merge queue entry
      # and on a pull request (the merge queue is off, so the pull request is the last gate before main); venue-oracles.yml
      # runs it on a push to main. A pull request is judged by the same script and table as a queue entry (the script finds
      # the merge base itself). Fail closed: any fetch, merge-base or rule error = corpus=true.
      - name: Does the change touch the external auth corpus path set?
        id: corpus
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "pull_request" ]; then
            bash ci/auth_corpus_queue_relevance.sh "${BASE_SHA}" "${HEAD_SHA}" > corpus.txt || echo "corpus=true" > corpus.txt
            cat corpus.txt
            grep -xE 'corpus=(true|false)' corpus.txt >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${EVENT}" != "merge_group" ]; then
            echo "corpus=false" >> "${GITHUB_OUTPUT}"
            echo "the external auth corpus runs on pull requests and merge queue entries (${EVENT} is neither; main runs it in venue-oracles.yml)"
            exit 0
          fi
          if [[ "${MG_BASE_REF}" == refs/heads/* ]] \
            && git fetch --no-tags origin "+${MG_BASE_REF}:refs/remotes/origin/auth-corpus-base" \
            && tip="$(git rev-parse --verify 'refs/remotes/origin/auth-corpus-base^{commit}')"; then
            bash ci/auth_corpus_queue_relevance.sh "${tip}" "${MG_HEAD_SHA}" > corpus.txt || echo "corpus=true" > corpus.txt
          else
            echo "cannot resolve the target branch ${MG_BASE_REF}: the external auth corpus runs"
            echo "corpus=true" > corpus.txt
          fi
          cat corpus.txt
          grep -xE 'corpus=(true|false)' corpus.txt >> "${GITHUB_OUTPUT}"

  auth-go-quality:
    needs: [ready-reuse, auth-changes]
    if: (needs.auth-changes.outputs.relevant == 'true') && !contains(fromJSON(needs.ready-reuse.outputs.passed), 'auth-go-quality')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Path filter outcomes (fixed closure)
        run: bash ci/check_go.sh auth paths-selftest
      - name: Gate scope covers every auth-looking package
        run: bash ci/check_go.sh auth scope-selftest
      # gofmt and go vet are owned by go-quality's static leg on every event (same packages, same flags, CHAOS-11417);
      # internal/cigates/workflows pins that this workflow does not run them again and that the owner cannot be skipped.
      - name: Fuzz registry matches the tree
        run: bash ci/check_go.sh auth fuzz-registry
      - name: govulncheck (auth packages, pinned, strict)
        run: bash ci/check_go.sh auth vuln

  auth-test:
    needs: [ready-reuse, auth-changes]
    if: (needs.auth-changes.outputs.relevant == 'true') && !contains(fromJSON(needs.ready-reuse.outputs.passed), 'auth-test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: go test (auth packages)
        run: bash ci/check_go.sh auth test
      - name: Dependency closure of the auth binaries (CHAOS-10131)
        run: bash ci/check_go.sh auth closure
      - name: Endpoint-profile source_commit resolves and anchors read the same there (CHAOS-4765)
        run: bash ci/check_go.sh auth history
      - name: Production middleware stack is mounted and driven (G-69)
        run: bash ci/check_go.sh auth middleware

  # CHAOS-12213: the race legs have their own job and their own 30 minute cap. In auth-test they shared one cap with the other
  # legs, and `job_go_test_timeout` gives each race-integration package the time left under that cap, so a slow job left a late
  # package too little time. The cap is not raised: each job stays under it.
  # CHAOS-12938: auth-race takes the same cap env. Its go test -timeout comes from the race weights of the auth packages
  # (auth_race_timeout_min in ci/check_go.sh), bounded by this cap, not from the 10 min go default.
  # CHAOS-12420: the same again. The two legs grew to the whole 30 minutes on a slow runner, and the last package got a
  # 2 s timeout, so each leg has a job of its own. auth-gate fans in both.
  auth-race:
    needs: [ready-reuse, auth-changes]
    if: (needs.auth-changes.outputs.relevant == 'true') && !contains(fromJSON(needs.ready-reuse.outputs.passed), 'auth-race')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_GO_JOB_CAP_MIN: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: go test -race (auth packages)
        run: bash ci/check_go.sh auth race

  auth-race-integration:
    needs: [ready-reuse, auth-changes]
    if: (needs.auth-changes.outputs.relevant == 'true') && !contains(fromJSON(needs.ready-reuse.outputs.passed), 'auth-race-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_GO_JOB_CAP_MIN: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: go test -race on live PostgreSQL (session domain concurrency, CHAOS-10207)
        run: bash ci/check_go.sh auth race-integration

  # One job per package (CHAOS-11417): checkout, setup-go and the compile are paid once per package, not once per target.
  # Each target keeps its own `auth fuzz TARGET` call, so its corpus, its proof marker and the one default fuzz budget
  # of ci/check_go.sh are unchanged. A new target in a listed package needs only its registry row.
  auth-fuzz:
    name: auth-fuzz (${{ matrix.package }})
    needs: [ready-reuse, auth-changes]
    if: (needs.auth-changes.outputs.relevant == 'true') && !contains(fromJSON(needs.ready-reuse.outputs.passed), 'auth-fuzz')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: internal/auth/authapi
            targets: FuzzParseRefreshRequest FuzzDecodeAuthorizationRequest
          - package: internal/auth/contracts
            targets: FuzzParseErrorEnvelope FuzzRevisionUnmarshal FuzzTimestampUnmarshal FuzzParseAccessToken FuzzParseWorkloadToken
          - package: internal/auth/signedtoken
            targets: FuzzValidSignedToken
          - package: internal/auth/httpapi
            targets: FuzzParseLimit FuzzParseForwardedTrust
          - package: internal/auth/clientaddr
            targets: FuzzParseTrust
          - package: internal/auth/keystore
            targets: FuzzParseEd25519Key FuzzParseKeySetManifest
          - package: internal/auth/authconfig
            targets: FuzzConfigLoad
          - package: internal/auth/identity
            targets: FuzzNormalizeEmail FuzzExternalKeyValidate
          - package: internal/auth/identity/oidc
            targets: FuzzOpenState FuzzParseJOSEHeader FuzzValidateIDTokenClaims FuzzParseCallbackBody
          - package: internal/auth/identity/saml
            targets: FuzzParseSAMLResponse FuzzSAMLSubject
          - package: internal/auth/authorization
            targets: FuzzNormalizeRequest FuzzEvaluateRequest FuzzEvaluateRepositoryGrant FuzzEvaluateDelegated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Fuzz ${{ matrix.package }} (each target its own corpus, its own proof marker)
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          # Every target runs and prints its own proof line; each red target is named at the end and fails the job.
          red=""
          for target in ${TARGETS}; do
            bash ci/check_go.sh auth fuzz "${target}" || red="${red} ${target}"
          done
          if [ -n "${red}" ]; then
            echo "auth-fuzz: red target(s):${red}" >&2
            exit 1
          fi

  # CHAOS-11596: the external auth corpus (ci/auth_corpus_external.sh, the same four legs venue-oracles.yml runs on main)
  # on a merge queue entry or (CHAOS-12993, merge queue off) a pull request that touches ci/auth_corpus_paths.txt. A red leg
  # ejects the entry or reds the pull request before main. No retry: a red leg stays red. Its result fans into `auth-gate`.
  auth-corpus-queue:
    name: auth-corpus-queue (${{ matrix.leg }})
    needs: [ready-reuse, auth-changes]
    if: ((github.event_name == 'merge_group' || github.event_name == 'pull_request') && needs.auth-changes.outputs.corpus == 'true') && !contains(fromJSON(needs.ready-reuse.outputs.passed), 'auth-corpus-queue')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_GO_JOB_CAP_MIN: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [go-api, acp, acp-nokeys]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Run the auth-flow corpus against the external go-api
        if: matrix.leg != 'acp-nokeys'
        run: bash ci/auth_corpus_external.sh "${{ matrix.leg }}"
      # Non-vacuity: leg acp without the auth-service keys must fail, and by name (not pass as "unserved").
      - name: Leg acp without the auth-service keys fails by name
        if: matrix.leg == 'acp-nokeys'
        env:
          NOKEYS_LOG: ${{ runner.temp }}/acp-nokeys.log
        run: |
          status=0
          AUTH_CORPUS_OMIT_AUTH_KEYS=1 bash ci/auth_corpus_external.sh acp >"${NOKEYS_LOG}" 2>&1 || status=$?
          tail -n 60 "${NOKEYS_LOG}"
          if [ "${status}" -eq 0 ]; then
            echo "ERROR: leg acp passed without the auth-service keys"
            exit 1
          fi
          grep -a 'required aggregate sessions is not served by auth-service' "${NOKEYS_LOG}" || {
            echo "ERROR: leg acp failed, but not on the required aggregate sessions"
            exit 1
          }

  auth-gate:
    if: always()
    needs: [ready-reuse, auth-changes, auth-go-quality, auth-test, auth-race, auth-race-integration, auth-fuzz, auth-corpus-queue]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEVANT: ${{ needs.auth-changes.outputs.relevant }}
      CORPUS_RELEVANT: ${{ needs.auth-changes.outputs.corpus }}
      CORPUS: ${{ needs.auth-corpus-queue.result }}
      CHANGES: ${{ needs.auth-changes.result }}
      QUALITY: ${{ needs.auth-go-quality.result }}
      TEST: ${{ needs.auth-test.result }}
      RACE: ${{ needs.auth-race.result }}
      RACE_INTEGRATION: ${{ needs.auth-race-integration.result }}
      FUZZ: ${{ needs.auth-fuzz.result }}
      # Ready flip: "unit=run:attempt:job" entries of ready-reuse; a leg it named was skipped because it passed on this sha.
      READY_REUSED: ${{ needs.ready-reuse.outputs.reused }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Fan in
        run: |
          set -euo pipefail
          if [ "${CHANGES}" = "skipped" ]; then
            echo "draft pull request without ci:full: auth gates not run"
            exit 0
          fi
          [ "${CHANGES}" = "success" ] || { echo "auth-changes: ${CHANGES}" >&2; exit 1; }
          # passed <job> <result>: success, or a skip that ready-reuse named on a pull_request run (prints REUSED).
          passed() {
            [ "$2" = success ] && return 0
            [ "$2" = skipped ] && [ "${EVENT_NAME}" = pull_request ] || return 1
            for entry in ${READY_REUSED:-}; do
              if [ "${entry%%=*}" = "$1" ] && [[ "${entry#*=}" =~ ^([0-9]+):([0-9]+):([0-9]+(,[0-9]+)*)$ ]]; then
                echo "REUSED $1 from run ${BASH_REMATCH[1]} attempt ${BASH_REMATCH[2]} job ${BASH_REMATCH[3]}"
                return 0
              fi
            done
            return 1
          }
          # CHAOS-11596: a skipped corpus job passes ONLY when the relevance step said the entry does not touch the corpus
          # path set; a skip (or any non-success) with corpus=true fails, also when the auth gates are not relevant.
          case "${CORPUS_RELEVANT}" in
            true) passed auth-corpus-queue "${CORPUS}" || { echo "auth-corpus-queue: ${CORPUS}: a skipped corpus leg with relevant=true fails the gate" >&2; exit 1; } ;;
            false) echo "the change is outside the external auth corpus path set (auth-corpus-queue=${CORPUS})" ;;
            *) echo "auth-changes produced no corpus verdict" >&2; exit 1 ;;
          esac
          if [ "${RELEVANT}" = "false" ]; then
            echo "the change is outside the auth service tree: gate jobs skipped by design (quality=${QUALITY} test=${TEST} race=${RACE} fuzz=${FUZZ})"
            exit 0
          fi
          [ "${RELEVANT}" = "true" ] || { echo "auth-changes produced no relevance verdict" >&2; exit 1; }
          for pair in "auth-go-quality=${QUALITY}" "auth-test=${TEST}" "auth-race=${RACE}" "auth-race-integration=${RACE_INTEGRATION}" "auth-fuzz=${FUZZ}"; do
            passed "${pair%%=*}" "${pair#*=}" || { echo "${pair}: a relevant change needs every gate job to pass" >&2; exit 1; }
          done
          echo "all auth gate jobs passed"

  # CHAOS-11733: a merge queue entry can fail first in any workflow, not only go.yml. When any job of this workflow fails on a
  # merge_group run, cancel the runs stacked on this red entry (same job and script as go.yml). Not a required context
  # (no job needs it), continue-on-error, and the checkout is the target branch's tip, never the merge group.
  auth-cancel-stacked-queue-children:
    name: cancel-stacked-queue-children
    needs: [auth-changes, auth-go-quality, auth-test, auth-race, auth-race-integration, auth-fuzz, auth-corpus-queue, auth-gate]
    if: failure() && github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          sparse-checkout: ci/cancel_stacked_queue_runs.sh
          persist-credentials: false
          sparse-checkout-cone-mode: false
      - name: Cancel the runs stacked on this red entry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: bash ci/cancel_stacked_queue_runs.sh
