{{- if .Values.clickhouse.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dev-health.fullname" . }}-clickhouse
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "clickhouse" "context" $) | nindent 4 }}
spec:
  serviceName: {{ include "dev-health.fullname" . }}-clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "clickhouse" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "clickhouse" "context" $) | nindent 8 }}
      {{- if .Values.clickhouse.usersd }}
      annotations:
        {{- /* CHAOS-6474: the FILE SET, never the content. Content is delivered through a
               directory-mounted ConfigMap that kubelet refreshes in place and ClickHouse
               reloads without a restart; only a new/removed filename needs the initContainer
               to run again (it creates the users.d symlinks), so only that rolls the pod. */}}
        checksum/clickhouse-usersd-files: {{ keys (.Values.clickhouse.usersd | default dict) | sortAlpha | toJson | sha256sum }}
      {{- end }}
    spec:
      {{- if .Values.clickhouse.usersd }}
      initContainers:
        {{- /* CHAOS-6474: users.d is an emptyDir (the image entrypoint still writes its own
               default-user.xml into it) holding one symlink per usersd file, pointing at the
               directory-mounted ConfigMap. kubelet swaps that directory's ..data symlink
               atomically on a ConfigMap change (a per-file subPath mount is never refreshed),
               and ClickHouse reloads the changed users.d file on its own: grant changes need
               no pod restart. File names are passed as arguments, never interpolated. */}}
        - name: clickhouse-usersd-links
          image: {{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}
          command:
            - sh
            - -c
            - 'for n in "$@"; do ln -sfn "../usersd-cm/$n" "/links/$n"; done'
            - --
            {{- range $name := keys (.Values.clickhouse.usersd | default dict) | sortAlpha }}
            - {{ $name | quote }}
            {{- end }}
          volumeMounts:
            - name: clickhouse-usersd-links
              mountPath: /links
      {{- end }}
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.credentials.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.clickhouse.credentials.password | quote }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.credentials.database | quote }}
            - name: CLICKHOUSE_LISTEN_HOST
              value: "0.0.0.0"
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          {{- if or .Values.clickhouse.persistence.enabled .Values.clickhouse.usersd }}
          volumeMounts:
            {{- if .Values.clickhouse.persistence.enabled }}
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            {{- end }}
            {{- if .Values.clickhouse.usersd }}
            - name: clickhouse-usersd-links
              mountPath: /etc/clickhouse-server/users.d
            - name: clickhouse-usersd
              mountPath: /etc/clickhouse-server/usersd-cm
              readOnly: true
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      {{- if .Values.clickhouse.usersd }}
      volumes:
        - name: clickhouse-usersd
          configMap:
            name: {{ include "dev-health.fullname" . }}-clickhouse-usersd
        - name: clickhouse-usersd-links
          emptyDir: {}
      {{- end }}
  {{- if .Values.clickhouse.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.clickhouse.persistence.storageClass }}
        storageClassName: {{ .Values.clickhouse.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-clickhouse
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "clickhouse" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "clickhouse" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
{{- if .Values.clickhouse.usersd }}
---
# CHAOS-6181: extra ClickHouse users.d files (e.g. a read-only user). Content
# is supplied by the operator; do not put plaintext passwords here -- use
# <password_sha256_hex>.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dev-health.fullname" . }}-clickhouse-usersd
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "clickhouse" "context" $) | nindent 4 }}
data:
  {{- range $name, $content := .Values.clickhouse.usersd }}
  {{- toYaml (dict $name $content) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
