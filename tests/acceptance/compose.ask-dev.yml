services:
  postgres:
    container_name: ask-dev-acceptance-postgres
    ports: !reset []

  pgbouncer:
    container_name: ask-dev-acceptance-pgbouncer
    ports: !reset []

  clickhouse:
    container_name: ask-dev-acceptance-clickhouse
    ports: !reset []

  valkey:
    container_name: ask-dev-acceptance-valkey
    ports: !reset []

  migrate:
    container_name: ask-dev-acceptance-migrate
    environment:
      DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER: "1"

  api:
    container_name: ask-dev-acceptance-api
    # Host port is configurable because 18080 is not ours alone: the normal
    # dev-health stack publishes its ACR API on 127.0.0.1:18080 too, and a
    # developer running that stack could not start this one at all (the
    # container fails with "port is already allocated" before any scenario
    # runs). Default stays 18080 so nothing that already works changes;
    # export ASK_DEV_ACCEPTANCE_API_PORT to run alongside the dev stack.
    ports: !override
      - "127.0.0.1:${ASK_DEV_ACCEPTANCE_API_PORT:-18080}:8000"
    environment:
      ENVIRONMENT: acceptance
      ASK_DEV_LIVE_ACCEPTANCE: "1"
      LLM_PROVIDER: openai
      ASK_DEV_ACCEPTANCE_OPENAI_BASE_URL: http://ask-dev-scripted-openai:8001/v1
      ASK_DEV_ACCEPTANCE_OPENAI_API_KEY: ask-dev-acceptance-local-v1
      JWT_SECRET_KEY: ask-dev-acceptance-jwt-secret-key-v1
      # CHAOS-3532: the QUA ladder (off -> shadow -> commit). Interpolated
      # here, but NOT from whatever the invoking shell happens to export --
      # run_ask_dev_compose.sh clears both names unconditionally and then
      # sets them from its own one-shot ASK_DEV_ACCEPTANCE_QUA knob, AFTER
      # the clear.
      #
      # These are the only ASK_DEV_-namespaced vars that launcher clears.
      # The prefix normally means "cannot collide with an ambient dev .env
      # by construction" -- for these two that assumption is false: ops/.env
      # sets both to 1 for the DEV stack and direnv exports it into every
      # shell under the ops tree. Passing them through booted every
      # acceptance stack from a developer shell silently ARMED, which does
      # not merely add a feature: the shadow changes what every baseline
      # corpus case measures, and armed runs are graded against predictions
      # registered on an unarmed system.
      #
      # The `:-0` default therefore guards only the case where the launcher
      # was bypassed entirely (a raw `docker compose` invocation). Off is the
      # only safe default for that path too.
      #
      # Production reads both with a strict `os.getenv(...) == "1"`
      # (production_runtime.py:663,679), so unset, empty, "0" and "true" are
      # ALL off -- an empty value fails closed rather than reading as
      # enabled. And commit already implies shadow at :679, so no interlock
      # is needed between them.
      ASK_DEV_QUA_SHADOW_ENABLED: "${ASK_DEV_QUA_SHADOW_ENABLED:-0}"
      ASK_DEV_QUA_COMMIT_ENABLED: "${ASK_DEV_QUA_COMMIT_ENABLED:-0}"
      # CHAOS-3219 Wave 4 quota plumbing: these are the ONLY two Ask Dev
      # settings production code actually reads from the environment
      # (org_policy.py platform_operator_request_limit /
      # platform_operator_cost_limit_microusd -- os.getenv, not a settings-DB
      # lookup). They are OPERATOR CEILINGS that clamp the per-org
      # ask_dev_platform_monthly_request_limit / ..._cost_microusd settings
      # (which default to 1_000 requests / 100_000_000 microusd when no org
      # override exists -- settings-DB-backed, category ASK_DEV, set via the
      # generic admin settings API, NOT env vars). Retention (0/30-day) has
      # NO env var in production -- it is a per-conversation request field
      # validated against models.dev_persistence.DEV_RETENTION_DAYS, with an
      # org-level default stored under the settings key
      # ask_dev_retention_days (category ASK_DEV); set it through the admin
      # settings API, not through this compose file.
      #
      # Live-proven 2026-08-05: pinning these to org_policy.py's documented
      # hard FLOOR (PLATFORM_MONTHLY_REQUEST_LIMIT_MIN=100 /
      # PLATFORM_MONTHLY_COST_LIMIT_MIN_MICROUSD=10_000_000) does make the
      # enforcement fire for real -- a full boot tripped
      # DevMonthlyCostLimitExceeded (HTTP 429 cost_limit_reached) partway
      # through the existing smoke suite, proving the wiring end-to-end. But
      # the floor is *too* tight to be this gate's shared default: it broke
      # already-passing coverage before Wave 4's corpus even exists. Pinned
      # here to a value with real headroom over current smoke-suite usage
      # (still below the operator hard max of 5_000/500_000_000) so the
      # baseline gate stays green; Phase 3c's dedicated quota-exceeded corpus
      # case should trip the limit with its OWN scoped mechanism (e.g. an
      # admin settings override on just that case's org, or a short-lived env
      # override for a dedicated run) rather than by lowering this shared
      # default -- reuse the floor values above as the known-good "this WILL
      # trip it" reference point.
      ASK_DEV_PLATFORM_MONTHLY_REQUEST_MAX: "1000"
      ASK_DEV_PLATFORM_MONTHLY_COST_MAX_MICROUSD: "200000000"
    depends_on:
      ask-dev-scripted-openai:
        condition: service_healthy
    networks:
      - default
      - ask-dev-acceptance

  # ---------------------------------------------------------------------------
  # CHAOS-4065: Go-native "GENERAL scheduled jobs" acceptance parity.
  #
  # Ask Dev itself has ZERO Celery dependency (answer generation runs
  # synchronously in the API/SSE request path; quota enforcement is inline
  # SQL; its own retention sweep is unwired product code, flagged
  # upstream) -- no queue name here is "required by Ask Dev". This fleet
  # instead proves the platform's GENERAL scheduled jobs work, and as of
  # 2026-08-19 (CHAOS-4026) prod runs those natively in Go, not Celery: a
  # release-blocking gate that still booted a real Celery worker+beat fleet
  # was testing a topology that no longer exists in prod. `worker`/`beat`
  # below are repointed at `ask-dev-jobs-probe` (cmd/ask-dev-jobs-probe),
  # which re-executes the exact production code for each cadence directly
  # against this stack's own Postgres on every healthcheck tick:
  #   - `worker` (queue-depth): cmd/dev-health-worker/queue_health.go's
  #     queueHealthMonitor samples River's queue state every 60s in prod;
  #     the probe's `queue-depth` check runs the same `river_job` query.
  #   - `beat` (retention): internal/scheduler/fixed's RetentionProducer
  #     dispatches jobcontract.KindRetentionCleanup under schedule ids
  #     `prune_rate_limit_observations`/`prune_external_ingest_batches`;
  #     the probe's `retention` check calls the same
  #     internal/jobs/system stores (RateLimitObservationStore/
  #     ExternalIngestBatchStore) those handlers use, with the same
  #     retention-window defaults (14/90 days).
  # No Celery service is started anywhere in this file. Per the "no
  # required job may exit success after skipping substantive work"
  # principle, each container's main process is an inert placeholder
  # (`sleep infinity`) and its healthcheck is the real, repeated work.
  # ---------------------------------------------------------------------------

  # The canonical Python `migrate` service (above) owns Alembic + ClickHouse.
  # River's own schema is a SEPARATE migrator (`dev-health-worker-migrate`,
  # cmd/dev-health-worker-migrate) that requires its three runtime roles to
  # already exist -- provisioned here from the same checked-in SQL
  # deploy/docker-compose/compose.go-workers.yml's `go-river-provision`
  # uses, built locally (no ghcr pull) since the `runner` target already
  # ships psql + the SQL file (docker/Dockerfile).
  river-provision:
    container_name: ask-dev-acceptance-river-provision
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: runner
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        exec psql \
          --host=postgres --username=postgres --dbname="${POSTGRES_DB:-postgres}" \
          --set=domain_role="$$RIVER_DOMAIN_DATABASE_ROLE" \
          --set=queue_role="$$RIVER_QUEUE_DATABASE_ROLE" \
          --set=coordinator_role="$$RIVER_COORDINATOR_DATABASE_ROLE" \
          --set=domain_password="$$RIVER_DOMAIN_DATABASE_PASSWORD" \
          --set=queue_password="$$RIVER_QUEUE_DATABASE_PASSWORD" \
          --set=coordinator_password="$$RIVER_COORDINATOR_DATABASE_PASSWORD" \
          --file=/usr/local/share/dev-health/provision_river_roles.sql
    environment:
      PGPASSWORD: postgres
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_DOMAIN_DATABASE_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}
      RIVER_QUEUE_DATABASE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Applies the pinned River schema (dev-health-worker-migrate, already
  # baked into the `runner` image) now that its roles exist, then
  # independently verifies the result with `--check`.
  river-migrate:
    container_name: ask-dev-acceptance-river-migrate
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: runner
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "dev-health-worker-migrate && dev-health-worker-migrate --check"
    environment:
      MIGRATION_DATABASE_URI: postgresql://postgres:postgres@postgres:5432/${POSTGRES_DB:-postgres}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
    depends_on:
      river-provision:
        condition: service_completed_successfully

  worker:
    container_name: ask-dev-acceptance-queue-health-probe
    entrypoint: ["sleep", "infinity"]
    command: []
    # Adds to (does not replace) the base `worker-base` environment/
    # depends_on -- the inherited Celery-only entries (CELERY_BROKER_URL,
    # EMAIL_*, valkey/pgbouncer readiness) are unread by this container and
    # harmless; only the two keys below are actually used.
    environment:
      POSTGRES_URI: postgresql://postgres:postgres@postgres:5432/${POSTGRES_DB:-postgres}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
    depends_on:
      river-migrate:
        condition: service_completed_successfully
    healthcheck:
      # Real receipt, not a liveness ping: every tick re-runs the query
      # cmd/dev-health-worker/queue_health.go's queueHealthMonitor issues
      # against River's OWN state table, fresh, against this stack's real
      # schema (see cmd/ask-dev-jobs-probe's `queue-depth` check). A query
      # failure (missing table, unreachable Postgres) reports unhealthy.
      test:
        - "CMD"
        - "/usr/local/bin/ask-dev-jobs-probe"
        - "queue-depth"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  beat:
    container_name: ask-dev-acceptance-retention-probe
    entrypoint: ["sleep", "infinity"]
    command: []
    # Adds to (does not replace) the base `worker-base` environment/
    # depends_on -- see the identical note on `worker` above.
    environment:
      POSTGRES_URI: postgresql://postgres:postgres@postgres:5432/${POSTGRES_DB:-postgres}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Real receipt: every tick re-runs BOTH retention cadences' real
      # production code (internal/jobs/system's RateLimitObservationStore
      # and ExternalIngestBatchStore, the same stores
      # internal/scheduler/fixed's RetentionProducer dispatches) against
      # this stack's real tables -- see cmd/ask-dev-jobs-probe's
      # `retention` check. Needs no River schema (these are plain Postgres
      # tables `migrate` already creates), so it depends only on `migrate`.
      test:
        - "CMD"
        - "/usr/local/bin/ask-dev-jobs-probe"
        - "retention"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 15s

  ask-dev-scripted-openai:
    container_name: ask-dev-acceptance-scripted-openai
    profiles: ["ask-dev-acceptance"]
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: api
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
    entrypoint:
      - python
      - -m
      - dev_health_ops.llm.agent.scripted_openai_service
    environment:
      ENVIRONMENT: acceptance
      ASK_DEV_LIVE_ACCEPTANCE: "1"
      ASK_DEV_ACCEPTANCE_OPENAI_API_KEY: ask-dev-acceptance-local-v1
      ASK_DEV_ACCEPTANCE_OPENAI_PORT: "8001"
      # CHAOS-3219 Phase 3: without this pair the scripted provider served
      # NOTHING. The `api` image target ships only the built wheel -- no
      # `tests/` tree -- so provider_scripts._scripts_dir()'s relative
      # default resolved against WORKDIR /app and missed, try_load_engine()
      # swallowed the failure and returned None (correct for organic
      # production traffic, catastrophic here), and all 19 scripted cases
      # fell through to the unscripted default heuristic while PASSING.
      # Set EXPLICITLY rather than relying on the relative walk-up that
      # failed silently. A literal path, never a compose interpolation: an
      # interpolated variable would also need triaging into
      # run_ask_dev_compose.sh's unset list, per
      # test_launcher_hardens_compose_interpolation_env_for_every_var_it_boots.
      ASK_DEV_SCRIPTED_PROVIDER_SCRIPTS_DIR: /opt/ask-dev/provider-scripts
    volumes:
      # Read-only: these fixtures are an oracle the provider reads, never
      # writes. Mounted rather than baked into the image so the acceptance
      # fault matrix cannot drift from the corpus it is generated beside.
      - ./tests/acceptance/world/ask-dev-world.v1/provider-scripts:/opt/ask-dev/provider-scripts:ro
    expose:
      - "8001"
    healthcheck:
      # CHAOS-3219 Phase 3 (codex adversarial review, MEDIUM, confirmed):
      # `wget --spider` only checks the STATUS CODE, and /healthz answers 200
      # even when the engine is dead -- so Docker health stayed green on a
      # dead engine, `api` started against it, and the launcher's smoke/web
      # leg ran happily against the unscripted heuristic. Only the Wave 4
      # pytest precondition caught it, which left every boot path that does
      # not run that step carrying the original false-health failure.
      # This validates the BODY, so the stack refuses to come up at all when
      # the scripted matrix is not actually loaded.
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          with urllib.request.urlopen("http://localhost:8001/healthz", timeout=3) as response:
              engine = json.load(response).get("scripted_engine") or {}
          sys.exit(0 if engine.get("loaded") else 1)
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: "no"
    networks:
      - ask-dev-acceptance

  web:
    profiles: ["ask-dev-acceptance"]
    container_name: ask-dev-acceptance-web
    build:
      context: ${ASK_DEV_WEB_CONTEXT:?pass --web-root to the acceptance launcher}
      dockerfile: Dockerfile
      target: runner
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
      AUTH_SECRET: ask-dev-acceptance-web-auth-secret-v1
      AUTH_URL: http://127.0.0.1:3002
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: "no"

networks:
  ask-dev-acceptance:
    internal: true
