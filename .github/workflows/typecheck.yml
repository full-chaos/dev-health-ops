name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              # CHAOS-3513: omitting this put an unlinted, untypechecked
              # change into main. In merge_group runs 30597898813 and
              # 30597912205 the only file in the queue's diff was
              # .github/workflows/governance.yml, so the filter reported
              # code=false, the gated job skipped, and the required check
              # reported SUCCESS. The gates could be edited -- weakened --
              # by a PR they then declined to run on.
              - '.github/workflows/**'
              - 'src/**'
              # Inputs that decide what these tools LOOK AT, not just how
              # they behave. ruff honours .gitignore/.ignore for file
              # discovery: appending `src/` to .gitignore drops its file set
              # from 1045 source files to 0, and `ruff check` still exits 0 --
              # a green required check that inspected nothing. ruff.toml /
              # .ruff.toml and mypy.ini / .mypy.ini / setup.cfg are config
              # files these tools discover by default; none exists today, and
              # a PR ADDING one would not have matched this filter, so the
              # gate would have skipped on the very change that redefined it
              # (CHAOS-3513 Codex round 1, same shape as the workflow-file
              # omission above).
              - '.gitignore'
              - '.ignore'
              - 'ruff.toml'
              - '.ruff.toml'
              - 'mypy.ini'
              - '.mypy.ini'
              - 'setup.cfg'
              - 'tests/**'
              - 'ci/**'
              - 'migrations/**'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'scripts/**'

  typecheck-mypy:
    needs: [changes]
    # dorny/paths-filter has no PR base/head diff to compute in the merge
    # queue and can report code=false there, which would skip this job and
    # let the aggregator see a skip it cannot attribute. Always run in the
    # queue, as test.yml's test-matrix already does.
    if: >-
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Typecheck job needs package read access for dependency installs.
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mypy (type checking)
        run: |
          mypy --install-types --non-interactive .

  typecheck:
    name: typecheck
    # Must remain `always()`. Under `!cancelled()` (or any condition that lets
    # this job itself skip) a cancelled run leaves the REQUIRED check *skipped*,
    # and branch protection counts a skipped required check as satisfied --
    # which moves the silent pass one level up instead of closing it.
    if: always()
    needs: [changes, typecheck-mypy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aggregate typecheck result
        env:
          GATE_NAME: typecheck
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          GATED_JOB_1: typecheck-mypy|path-filtered|${{ needs.typecheck-mypy.result }}
        run: |
          chmod +x ci/aggregate_gate_results.sh
          ./ci/aggregate_gate_results.sh
