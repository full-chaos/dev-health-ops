# Grant probe: once a second, the api role's INSERT and UPDATE privilege on public.refresh_tokens
# (t or f), read as the database owner. Each log line is "<epoch seconds> <insert> <update>". The
# first f is the moment the REVOKE committed; the first t after it is the re-GRANT.
apiVersion: v1
kind: Pod
metadata:
  name: probe-grant
  labels: {app: rehearsal-probe}
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: probe
      image: ${LOCAL_PG}
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      env:
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: pg-probe, key: password}}
      command:
        - sh
        - -c
        - |
          while true; do
            row="$(psql -h ap-dev-health-postgresql -U devhealth -d devhealth -At -F ' ' -c "SELECT has_table_privilege('devhealth_api','public.refresh_tokens','INSERT'), has_table_privilege('devhealth_api','public.refresh_tokens','UPDATE')" 2>/dev/null || echo 'x x')"
            echo "$(date +%s) ${row}"
            sleep 1
          done
