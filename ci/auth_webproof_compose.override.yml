# Proof-only override for ci/check_auth_web_proxy_compose.sh (CHAOS-10230). It overlays
# ci/auth_compose_proof.override.yml (postgres without a fixed name or host port) and adds what a
# go-api in the proof needs to be private to its project: no fixed container_name, no published
# host port, and no attachment to the `planes` network (its fixed subnet is host-global).
#
# compose.yml forwards production's set for go-api since CHAOS-13107 (sessions, local login, credentials, social) with
# auth-service owning users (AUTH_USERS_OWNED defaults true). CHAOS-13356: this proof runs users owned too, as every
# venue does: go-api forwards sign-up (credentials) to auth-service, and auth-service sends the verification mail to the
# proof's capturing sink. Social stays on go-api here. Every service takes compose.yml's AUTH_USERS_OWNED default.
services:
  # CHAOS-13242: the Web code reads the issuer's discovery document and key set from the runner, so the proof's
  # auth-issuer publishes an ephemeral loopback port (the script forwards 127.0.0.1:8443 to it).
  auth-issuer:
    ports: !override ["127.0.0.1::8443"]
  valkey:
    container_name: !reset null
    ports: !reset []
    # auth-service counts the login's rate limits here (AUTH_VALKEY_URI below), so it reaches the store over
    # auth_plane; nothing else of this proof changes on that network.
    networks: !override [default, auth_plane]
  go-river-migrate:
    # The sessions flag is on for go-api below, so its grant posture drops the api role's refresh_tokens INSERT and
    # UPDATE (go-api's readiness check reads the same flag).
    environment:
      AUTH_PROXY_SESSIONS: "true"
  go-api:
    ports: !override ["127.0.0.1::8000", "127.0.0.1::8080"]
    networks: !override [default, auth_plane]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Mail goes to a capturing SMTP sink on the runner (ci/auth_webproof_smtp_sink.mjs): the
      # console provider logs no link, so the verification token is read from the captured message.
      EMAIL_PROVIDER: smtp
      SMTP_HOST: host.docker.internal
      SMTP_PORT: ${AUTH_PROOF_SMTP_PORT}
      SMTP_USE_TLS: "false"
      # Login, refresh, logout and (users owned) registration, verification and the other credentials routes go to
      # auth-service.
      AUTH_PROXY_URL: http://auth-service:8095
      AUTH_PROXY_SESSIONS: "true"
      # workload: go-api presents its workload token on the session issue route (compose.yml sets it; ci/lib/auth_workload_session_issue.sh
      # exports the same value). Empty is session_compat, and go-api then refuses to start: the proof mints no session issue service credential.
      AUTH_SESSION_ISSUE_CREDENTIAL: ${AUTH_SESSION_ISSUE_CREDENTIAL:-workload}
      AUTH_PROXY_LOCAL_LOGIN: "true"
      AUTH_PROXY_CREDENTIALS: "true"
      AUTH_PROXY_SOCIAL: "false"
      AUTH_PROXY_OIDC: "false"
      AUTH_PROXY_SAML: "false"
  auth-service:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # auth-service owns users, so it sends the verification mail of the register route go-api forwards: to the same
      # capturing SMTP sink on the runner as go-api's mail (ci/auth_webproof_smtp_sink.mjs reads the token from it).
      EMAIL_PROVIDER: smtp
      EMAIL_FROM_ADDRESS: proof@example.test
      SMTP_HOST: host.docker.internal
      SMTP_PORT: ${AUTH_PROOF_SMTP_PORT}
      SMTP_USE_TLS: "false"
      AUTH_JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-jwt-secret-key-0123456789abcdef}
      AUTH_SESSION_SUCCESSOR_KEY: ${AUTH_SESSION_SUCCESSOR_KEY}
      # Mounts go-api's login, refresh and logout wire on auth-service (#4602), only in this proof.
      AUTH_LOGIN_LOCKOUT_KEY: ${AUTH_LOGIN_LOCKOUT_KEY}
      # The login mounted above is a rate-limited route, so the service needs the shared store. The proof's Valkey
      # has no ACL users, so the URI carries none (the production login is an ACL user limited to its prefix).
      AUTH_VALKEY_URI: redis://valkey:6379/1
    depends_on:
      valkey:
        condition: service_healthy
