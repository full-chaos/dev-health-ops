# Rehearsal-only override for ci/rehearse_auth_key_rotation.sh. It layers on ci/auth_compose_proof.override.yml and
# ci/auth_webproof_compose.override.yml (private project, auth proxy flags on) and turns the stack into the EdDSA
# form of the rotation: auth-service signs from a key SET (custody manifest in the rehearsal_keys volume),
# go-api verifies against the https issuer served by issuer-tls. compose.yml and the chart are not changed.
# REHEARSAL_ACCESS_CLASS is eddsa; the driver sets it empty (not unset) when it recreates the services on the previous
# image for the rollback scenario, so that image runs with its own default class. hs256_compat is retired and does not
# start. The verifier issuer is set on the current and the previous image alike: go-api and query-api have no other verifier.
services:
  issuer-tls:
    image: ghcr.io/nginx/nginx-unprivileged:1.30-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
    profiles: [auth]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    ports: ["127.0.0.1::8443"]
    volumes:
      - ${REHEARSAL_DIR:?}/tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${REHEARSAL_DIR:?}/tls/issuer.pem:/etc/rehearsal/tls/issuer.pem:ro
      - ${REHEARSAL_DIR:?}/tls/issuer.key:/etc/rehearsal/tls/issuer.key:ro
    networks:
      default:
        aliases: [auth-issuer.rehearsal.test]
      auth_plane:
        aliases: [auth-issuer.rehearsal.test]
    depends_on:
      auth-service:
        condition: service_healthy
  auth-service:
    environment:
      AUTH_SIGNING_KEY_FILE: ""
      AUTH_SIGNING_KEY_ID: ""
      AUTH_SIGNING_KEYSET_FILE: /run/auth/keys/keyset.json
      AUTH_ACCESS_TOKEN_CLASS: ${REHEARSAL_ACCESS_CLASS-eddsa}
      AUTH_TOKEN_ISSUER_URL: ${REHEARSAL_ISSUER_URL:?}
    volumes:
      - type: volume
        source: rehearsal_keys
        target: /run/auth/keys
        read_only: true
  # go-api and query-api read auth.sessions to accept an EdDSA access token; the roles come from `migrate` (dho migrate roles).
  auth-migrate:
    environment:
      AUTH_SESSION_READER_ROLES: devhealth_api,devhealth_query_api
  auth-grants:
    environment:
      AUTH_SESSION_READER_ROLES: devhealth_api,devhealth_query_api
  go-api:
    environment:
      AUTH_ACCESS_TOKEN_ISSUER: ${REHEARSAL_VERIFY_ISSUER:-}
      SSL_CERT_FILE: /etc/rehearsal/tls/issuer.pem
    volumes:
      - ${REHEARSAL_DIR:?}/tls/issuer.pem:/etc/rehearsal/tls/issuer.pem:ro
  # query-api verifies the same EdDSA user access token (AUTH_ACCESS_TOKEN_ISSUER) and also reads the live session, so the
  # rehearsal measures it beside go-api. It leaves the `planes` network (its fixed subnet is host-global) and publishes
  # its query port on a loopback ephemeral port.
  query-api:
    networks: !override [default]
    ports: ["127.0.0.1::8090"]
    environment:
      AUTH_ACCESS_TOKEN_ISSUER: ${REHEARSAL_VERIFY_ISSUER:-}
      SSL_CERT_FILE: /etc/rehearsal/tls/issuer.pem
      AUTH_PROXY_SESSIONS: "true"
    volumes:
      - type: volume
        source: envelope_keys
        target: /run/envelope/public
        read_only: true
        volume:
          subpath: public
      - ${REHEARSAL_DIR:?}/tls/issuer.pem:/etc/rehearsal/tls/issuer.pem:ro
volumes:
  rehearsal_keys:
