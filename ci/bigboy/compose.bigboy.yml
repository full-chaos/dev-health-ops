    profiles: [auth]
    read_only: true
    restart: 'no'
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    user: 65532:65532
  # The bootstrap credential of the workload acr-api, written into the volume acr_workload_bootstrap (0600) as uid 1001: the uid
  # acr-api runs as here (it reads the 0600 host secret files of ubuntu). auth-service never mounts the volume; acr-api mounts it
