name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed):
  # canonical fleet-wide shape -- group by PR number on pull_request, by
  # ref on a push to a non-main branch, by commit sha on a push to main or
  # on merge_group (a commit sha never collides with another commit's, so
  # main pushes and merge_group entries are never cancelled -- see
  # go.yml/typecheck.yml/docker-images.yml/arc-runner-image.yml for the
  # specific incidents this protects). cancel-in-progress cancels a stale
  # PR re-push and a stale non-main branch push only.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  changes:
    # Routed to the self-hosted ARC pool while GitHub-hosted dispatch is
    # stalled (org plan change, 2026-09-04; chris ruling 16:54 PDT). Flip the
    # repo variable SELF_HOSTED_RUNNERS back to 'disabled' to restore the
    # hosted runner with no code change. Fork PRs always stay hosted -- same
    # safety condition as go.yml's dual-leg jobs.
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # A manual run is a request to test THIS ref, and it has no base/head
        # diff to filter against; computing one against the default branch
        # would let `gh workflow run test.yml` produce a run where every test
        # job skipped and the required `test` check still went green
        # (CHAOS-3482 Codex round 1). Leaving the filter unrun makes `code`
        # empty, which the job conditions below and
        # ci/aggregate_gate_results.sh both read as "not 'true'" -- so the
        # dispatch clause, not the path filter, is what selects the jobs.
        # Same construction as lint.yml and typecheck.yml.
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              # This workflow decides whether the proof gate runs at all.
              # Without this pattern a PR that changed ONLY this file set
              # code=false, skipped both test jobs, and the required `test`
              # aggregator counted the skip as a pass -- the gate could be
              # disabled through a green required check.
              - '.github/workflows/**'
              - 'src/**'
              - 'tests/**'
              - 'ci/**'
              - 'migrations/**'
              - 'requirements.txt'
              # CHAOS-4346: test-matrix's install step now runs `uv sync
              # --frozen`, which consumes uv.lock directly (pyproject.toml
              # was already covered above). Without this, a PR touching only
              # uv.lock -- an ordinary dependency bump -- would get
              # code=false, skip test-matrix entirely, and the required
              # `test` check would go green having run no tests against the
              # new lock. tests/tooling/test_aggregate_gate_results.py's
              # test_paths_filter_covers_every_file_the_gated_jobs_install
              # derives this requirement from the `uv sync` invocation itself
              # and fails if it is missing.
              - 'uv.lock'
              # Both test jobs `pip install -r requirements-docs.txt` before
              # running anything, so it is part of the test environment. It
              # was missing here until CHAOS-3482 Codex round 2: a PR touching
              # only this file got code=false, skipped both test jobs, and the
              # aggregator -- correctly, by its own rule -- called that a
              # legitimate docs-only skip and reported the required check
              # green. test_paths_filter_covers_every_file_the_test_jobs_install
              # derives this list from the jobs' own install commands.
              - 'requirements-docs.txt'
              # The guards for these live in this workflow's suite
              # (tests/tooling/test_aggregate_gate_results.py), so a PR
              # touching only one of them must not skip that suite --
              # otherwise the check that would notice a collapsed lint or
              # typecheck scope is the one that does not run
              # (CHAOS-3513 Codex round 2).
              - '.gitignore'
              - '.ignore'
              # CHAOS-4843, round 2 of #2169's peer review, P2b: this
              # workflow's own tooling suite carries
              # test_lefthook_glob_matches_typecheck_relevance_patterns,
              # which fails loud the moment lefthook.yml's mypy glob
              # diverges from ci/typecheck_relevance.py's RELEVANT_PATTERNS.
              # Without this entry, a PR touching ONLY lefthook.yml (e.g.
              # narrowing that glob, or reverting the mypy command to a bare
              # `mypy`) got code=false, skipped test-matrix entirely, and
              # the one guard built to catch exactly that regression never
              # ran -- the same "the guard's own trigger scope is the gap"
              # shape as the .gitignore/.ignore entries above.
              - 'lefthook.yml'
              - 'ruff.toml'
              - '.ruff.toml'
              - 'mypy.ini'
              - '.mypy.ini'
              - 'setup.cfg'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'alembic.ini'
              - 'Makefile'
              - 'scripts/**'
              - 'alerts/**'
              - 'compose.yml'
              # docker/Dockerfile is one of scripts/acceptance's
              # RUNTIME_DEPENDENCY_PATHS: the acceptance suite hashes it and
              # asserts on it, so a change here can turn the suite red -- but
              # the filter did not select on it, so such a PR skipped every
              # test job and the gate went green (CHAOS-3482 Codex round 4).
              - 'docker/**'
              - 'deploy/**'
              # CHAOS-3948: this filter had no Go paths at all, so a Go-only
              # PR (internal/**, cmd/**, *.go, go.mod, go.sum -- 722 + 57
              # files) reported code=false, skipped test-matrix/coverage
              # entirely, and the required `test` check went green having run
              # nothing. That is not a harmless skip: tests/tooling/*.py
              # (already selected by 'tests/**' above, but only when a PR ALSO
              # touches a Python file) polices Go artifacts directly --
              # test_go_integration_sharding.py asserts the live Go package
              # inventory against ci/go_integration_shards.tsv,
              # test_go_image_publishing.py asserts published image names
              # against deploy/ renderers, test_go_worker_stop_hook_packaging.py
              # asserts the Dockerfile's staged binary path -- and a Go-only
              # PR is exactly the PR that can break what those tests check
              # while never running them. contracts/** and go.mod/go.sum are
              # not covered by any existing pattern above (they sit outside
              # src/, tests/, ci/, docker/, deploy/), so they are listed
              # explicitly.
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'cmd/**'
              - 'contracts/**'

  # Fast, pytest-xdist-parallelized unit suite on the supported Python
  # version. This is the per-PR signal that the required `test` gate (below)
  # aggregates. Coverage is intentionally NOT gated here so the iterative PR
  # loop stays fast — the coverage-gated full suite runs in the `coverage` job
  # at merge time and on main (CHAOS-2586). Single-version matrix (CHAOS-3419):
  # containers ship 3.14 only (docker/Dockerfile), so that is the only
  # interpreter tested.
  test-matrix:
    needs: [changes]
    # On merge_group, dorny/paths-filter has no PR base/head diff to compute and
    # can report code=false, which would skip every test job; the `test`
    # aggregator then treats the skip as a pass and an untested change reaches
    # main. Always run in the merge queue regardless of the path filter, and
    # likewise on workflow_dispatch, where the filter is deliberately not run
    # (see the `changes` job) so a manual run cannot test nothing.
    if: >-
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    # Same ARC routing as `changes` above. Fallback changed from this job's
    # former ubuntu-26.04-arm to ubuntu-latest (x64): chris 2026-09-04 16:59 --
    # the enterprise's hosted-runner label list is exactly ubuntu-latest/
    # ubuntu-22.04/ubuntu-24.04 (+ windows/macos); ubuntu-26.04-arm is not a
    # real hosted label there, so it was never a valid fallback. There is no
    # hosted ARM label to fall back to -- the disabled/fork-PR leg now runs
    # x64 (this suite has no arm64-specific assertions, unlike
    # go-arm64-numeric-parity in go.yml).
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    # Test matrix needs package read access for dependency installs.
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        python-version: ["3.14"]

    services:
      postgres:
        image: ghcr.io/full-chaos/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        # The runner pulls a service image BEFORE the first step, so no
        # `docker/login-action` step can authenticate it -- GitHub requires
        # credentials on the declaration itself. GITHUB_TOKEN reads the mirror.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      clickhouse:
        image: ghcr.io/full-chaos/clickhouse/clickhouse-server:26.7
        # The runner pulls a service image BEFORE the first step, so no
        # `docker/login-action` step can authenticate it -- GitHub requires
        # credentials on the declaration itself. GITHUB_TOKEN reads the mirror.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: ch
          CLICKHOUSE_PASSWORD: ch
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user ch --password ch --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CHAOS-5130-class gap: this job moved to the oci-arc-runners pool
      # (chris 2026-09-04 16:59), whose custom image (docker/arc-runner/
      # Dockerfile) is a minimal addition over the upstream actions-runner
      # image, not a GitHub-hosted-runner drop-in -- ubuntu-latest ships go,
      # helm, uuidgen and docker-compose by default; this image ships none
      # of them. #2242's first live test-matrix run on the pool failed 37
      # tests: 18 helm (`helm: command not found`), 11 go (tests/api/graphql's
      # dual-run suite shells out to `go build`/`go run` against the live Go
      # API server), 6 docker-compose (`docker compose: command not found` --
      # this one clears once #2245 (CHAOS-5134, docker-compose-plugin) merges
      # into the shared image), 1 uuidgen (see below), and 1 pre-existing
      # hygiene finding unrelated to this pool move
      # (test_image_pulling_action_steps_are_allowlisted_or_ticketed).
      # go/helm are fixed here at the JOB level rather than the shared image:
      # both are already provided per-job by a pinned setup action on every
      # other Go/Python job in this repo, so adding them to the base image
      # would just be a second, driftable source of the same version.
      - name: Configure self-hosted Go cache paths
        # CHAOS-4906: the oci-arc-runners pool exports GOMODCACHE/GOCACHE to a
        # SHARED hostPath (unlike a GitHub-hosted runner's ephemeral per-job
        # filesystem). tests/api/graphql's dual-run suite does real `go
        # build`/`go run` work against this job's own go.mod, not a trivial
        # version check, so it needs the same shared-cache pointing as
        # go-quality.yml's self-hosted leg -- setup-go's default cache would
        # otherwise restore/save a GitHub Actions cache tarball into this
        # concurrently-shared path. Only set on the self-hosted leg.
        if: vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')
        run: |
          echo "GOMODCACHE=/mnt/go-cache/mod" >> "${GITHUB_ENV}"
          echo "GOCACHE=/mnt/go-cache/build" >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
          # `false` on the self-hosted leg -- same reasoning as
          # go-quality.yml's "Set up Go" step: setup-go's own cache defaults
          # to `true`, which would corrupt the pool's shared, concurrently-
          # written hostPath cache.
          cache: ${{ !(vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # No Helm version was ever pinned in this repo before this job had
          # its own runner (ubuntu-latest's bundled helm satisfied it
          # silently). deploy/helm/dev-health/Chart.yaml is `apiVersion: v2`
          # (Helm 3+) with no version-specific feature in tests/test_helm_*.py
          # (checked: no `lookup`, no `--dry-run=server`, nothing gated past
          # Helm 3's baseline `helm template`/`helm lint`), so this pins the
          # latest stable Helm 3 release rather than following Helm 4 (GA'd
          # 2026-08) with an untested major-version jump on a routing PR.
          version: 'v3.21.4'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # CHAOS-4346: this job used to `pip install -r requirements.txt`
      # (requirements.txt is just `-e .[dev]`), which re-resolves every
      # unpinned specifier in pyproject.toml against PyPI on every run --
      # uv.lock's pin is never consulted. openai>=3.0.0 floated onto
      # openai 3.4.0 mid-flight on 2026-08-26 (uv.lock has 3.0.0) and broke
      # tests/test_logging_config.py's leak harness for every PR in flight,
      # none of which had touched that test or its dependency. `uv sync
      # --frozen` installs exactly uv.lock's resolution and FAILS the step
      # if the lock is stale relative to pyproject.toml, so a real
      # dependency bump has to touch (and review) uv.lock instead of
      # silently drifting under CI.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras --dev
          uv pip install --python .venv/bin/python -r requirements-docs.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run parallel unit test contract
        env:
          DATABASE_URI: clickhouse://ch:ch@localhost:8123/default
          CLICKHOUSE_URI: clickhouse://ch:ch@localhost:8123/default
          POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          DEV_HEALTH_POSTGRES_TEST_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          SECONDARY_DATABASE_URI: mongodb://localhost:27017
          # No OTLP collector runs in CI; with OTEL on, the exporter retries to
          # localhost:4317 with backoff on every span/metric, flooding logs and
          # slowing the suite into timeouts. We don't assert OTEL stats in CI.
          OTEL_ENABLED: "false"
          # Cap xdist workers so parallelism does not contend on the single
          # postgres/clickhouse service container. The standard arm runner has
          # 4 vCPUs, so this matches `-n auto` there while staying predictable on
          # larger runners. Override PYTEST_XDIST_WORKERS to tune.
          PYTEST_XDIST_WORKERS: "4"
          PYTEST_ADDOPTS: --ignore=tests/test_0066_celery_river_cutover_postgres.py --ignore=tests/test_saved_report_schedule_unique_postgres_migration.py --ignore=tests/test_0097_backfill_report_schedule_next_run_postgres.py --ignore=tests/test_report_run_execution_lease_postgres_migration.py --ignore=tests/test_chaos_3337_source_class_postgres_migration.py --ignore=tests/api/admin/test_add_member_visibility.py --ignore=tests/api/dev/test_persistence_postgres.py
        run: |
          chmod +x ci/run_tests.sh
          mkdir -p test-results/logs
          set -o pipefail
          ./ci/run_tests.sh unit 2>&1 | tee test-results/logs/unit-${{ matrix.python-version }}.log

      # These files carry their own `isolated_postgres`/`require_postgres_test_uri`
      # fixtures that pytest.fail() (not skip) when CI/GITHUB_ACTIONS is set but
      # the needed URI is missing, so they cannot run in "Run parallel unit test
      # contract" above (no admin-privileged Postgres URI there) and are ignored
      # from it instead. DEV_HEALTH_TEST_POSTGRES_ADMIN_URI's database component
      # must be literally `postgres`: the fixture connects to it to CREATE/DROP a
      # throwaway per-test database on the same server.
      #
      # test_add_member_visibility.py (CHAOS-3411) has the same CI-must-fail
      # gate but only needs DEV_HEALTH_POSTGRES_TEST_URI (it isolates itself
      # with a CREATE SCHEMA on that same database, not a whole separate
      # database), so it doesn't need the admin URI -- it's listed here
      # rather than alongside it so a stripped commit can't silently pass by
      # having this step simply not exercise it (CHAOS-3411 Codex round 1:
      # the module was collected by neither PR-gated step with its URI set,
      # so it always skipped on pull_request).
      - name: Run PostgreSQL migration tests
        env:
          DEV_HEALTH_POSTGRES_TEST_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          DEV_HEALTH_TEST_POSTGRES_ADMIN_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
        run: |
          pytest -q \
            tests/test_0066_celery_river_cutover_postgres.py \
            tests/test_saved_report_schedule_unique_postgres_migration.py \
            tests/test_0097_backfill_report_schedule_next_run_postgres.py \
            tests/test_report_run_execution_lease_postgres_migration.py \
            tests/test_chaos_3337_source_class_postgres_migration.py \
            tests/test_canonical_incident_feature_flag_postgres_migration.py \
            tests/api/admin/test_add_member_visibility.py \
            tests/api/dev/test_persistence_postgres.py

      - name: Upload junit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-${{ matrix.python-version }}
          path: test-results/junit/*.xml
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-logs-${{ matrix.python-version }}
          path: |
            test-results/logs/*.log
            **/pytest.log
          if-no-files-found: ignore
          retention-days: 14

  # Full coverage-gated suite (ruff/mypy gates + unit tests with coverage
  # threshold + integration/e2e). Kept OFF the per-PR iterative path: it runs in
  # the merge queue (before code reaches main) and on push to main (post-merge
  # verification + Codecov upload), never on pull_request. Reassigned from the
  # retired 3.11 leg to 3.12 and parallelized with xdist (CHAOS-2586); moved to
  # 3.14 to match the shipped interpreter (CHAOS-3419).
  #
  # It also does not run on workflow_dispatch, because the path filter that
  # `code` comes from is not run there (see `changes`) and this condition is
  # unchanged: a manual run is the fast-suite path, proved by test-matrix,
  # which workflow_dispatch now always selects. The aggregator accepts this
  # skip for the same reason it accepts the pull_request one -- the job's own
  # condition did not select it -- and ci/aggregate_gate_results.sh derives
  # that from this exact expression.
  coverage:
    needs: [changes]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'merge_group' || needs.changes.outputs.code == 'true')
    # Same ARC routing as `changes` above, same ubuntu-26.04-arm -> ubuntu-latest
    # fallback fix as test-matrix (chris 2026-09-04 16:59: ubuntu-26.04-arm is
    # not a real enterprise hosted label). This job never runs on
    # pull_request at all (see `if:` above), so the fork-PR clause is inert
    # here; kept for the same textual shape as every other routed job.
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    # CHAOS-3413: this job has hung indefinitely (1h45m-6h, then auto-cancelled
    # by the next push's `cancel-in-progress` group) instead of failing, for
    # days -- `cancelled` isn't a red check, so it merged silently as routine
    # supersession while the COVERAGE_THRESHOLD=70 gate went unenforced. The
    # hang starts precisely at #1335 (2026-07-30T19:40:46Z), which first gave
    # this job DEV_HEALTH_POSTGRES_TEST_URI and so first let its live-Postgres
    # tests actually execute -- concurrently, under xdist -n4, against the one
    # shared Postgres service container, unlike `test-matrix` which serializes
    # them. Before that regression, this job completed successfully in a
    # consistent ~9m20s-11m30s (e.g. runs 30230488894, 30203314534,
    # 30098888467) every time back through at least 07-09; it has not
    # completed even once since. 25m is a deliberately generous multiple of
    # that real historical baseline, not a guess -- comfortable room for
    # coverage-instrumentation overhead plus whatever normal variance, while
    # still bounding an indefinite hang into a `failure` well inside a
    # workday. Tighten once the root fix (serializing the live-Postgres tests
    # the way test-matrix already does) restores a real completion to compare
    # against.
    # 25m -> 45m (chris/team-lead, PR #2242 ARC-routing finding: bigboy
    # load1 160+ during shared codex-round/battery contention makes a
    # hosted-VM-sized cap the wrong budget on this venue -- same fix as
    # go-quality/metrics-executed-proof).
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: ghcr.io/full-chaos/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        # The runner pulls a service image BEFORE the first step, so no
        # `docker/login-action` step can authenticate it -- GitHub requires
        # credentials on the declaration itself. GITHUB_TOKEN reads the mirror.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      clickhouse:
        image: ghcr.io/full-chaos/clickhouse/clickhouse-server:26.7
        # The runner pulls a service image BEFORE the first step, so no
        # `docker/login-action` step can authenticate it -- GitHub requires
        # credentials on the declaration itself. GITHUB_TOKEN reads the mirror.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: ch
          CLICKHOUSE_PASSWORD: ch
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user ch --password ch --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-docs.txt

      - name: Run coverage-gated test contract
        env:
          DATABASE_URI: clickhouse://ch:ch@localhost:8123/default
          CLICKHOUSE_URI: clickhouse://ch:ch@localhost:8123/default
          POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          DEV_HEALTH_POSTGRES_TEST_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          SECONDARY_DATABASE_URI: mongodb://localhost:27017
          COVERAGE_THRESHOLD: "70"
          # ci_tests() (ci/run_tests.sh) does not --ignore the postgres-gated
          # migration test files, so they run inline here; without the admin
          # URI they would pytest.fail() under CI (see the dedicated
          # "Run PostgreSQL migration tests" step above for why `postgres` is
          # required as the database component).
          DEV_HEALTH_TEST_POSTGRES_ADMIN_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          OTEL_ENABLED: "false"
          PYTEST_XDIST_WORKERS: "4"
        run: |
          chmod +x ci/run_tests.sh
          mkdir -p test-results/logs
          set -o pipefail
          ./ci/run_tests.sh ci 2>&1 | tee test-results/logs/ci-3.14.log

      - name: Upload junit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Named for what it actually is: JUnit output from the
          # coverage-gated `ci` tier, not a coverage report. (See
          # coverage-py314 below for the actual coverage artifact.)
          name: junit-ci-gated
          path: test-results/junit/*.xml
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-logs-coverage
          path: |
            test-results/logs/*.log
            **/pytest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage.xml artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-py314
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # Required-status-check gate. Branch protection requires a check named
  # exactly "test"; the matrix above produces "test-matrix (3.14)"
  # and the coverage job produces "coverage", neither of which match. It is the
  # single required check for both PRs and the merge queue. Do not remove.
  #
  # The verdict lives in ci/aggregate_gate_results.sh rather than inline here,
  # so it can be driven through the whole result matrix by
  # tests/tooling/test_aggregate_gate_results.py. See that script's header for
  # why `needs.changes.result` -- not the downstream results alone -- is what
  # separates a legitimate skip from an upstream failure that skipped
  # everything (CHAOS-3482).
  docs-tests:
    name: docs-tests
    # CHAOS-3514. Runs `pytest tests/docs` alone (16s measured in a clean
    # py3.14 env, excluding install) so the 116
    # docs guards execute on a docs-content-only PR, which previously ran
    # none of them: `code` selects on `tests/**` but not `docs/**`, so
    # editing a docs TEST ran it while editing the page it asserts on did
    # not. docs-guards.yml cannot cover this -- it invokes pytest zero times.
    #
    # DELIBERATELY UNCONDITIONAL, and this is the design rather than
    # laziness. Two gated alternatives were built and rejected against the
    # repo's own machinery:
    #
    #   * a second `docs` filter output gating this job -- rejected because
    #     ci/aggregate_gate_results.sh's `path-filtered` policy treats a skip
    #     as legitimate ONLY when CHANGES_CODE == 'false', so a docs-gated
    #     job would SKIP on an ordinary code-only PR while the aggregator
    #     held that skip illegitimate, failing the required gate on EVERY
    #     such PR;
    #   * widening the condition to `code || docs` -- rejected because
    #     _PATH_FILTERED_IF pins the exact condition every `path-filtered`
    #     job must carry, and says in terms: "Drift here means the model is
    #     stale: fix ci/aggregate_gate_results.sh, do not just update the
    #     string." Inventing a policy in the script whose purpose is to
    #     refuse ambiguity, to save ~10s on a code-only PR, is a bad trade.
    #
    # Unconditional needs no filter, no new policy, and no skip-legitimacy
    # reasoning at all -- and a job that never skips is the strongest
    # available answer to "no required job may exit success after skipping
    # substantive work". The cost is ~10s on PRs that changed no docs.
    needs: [changes]
    # Same ARC routing as `changes` above.
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install docs test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-docs.txt
      - name: Run the docs guards
        run: pytest tests/docs -q

  test:
    name: test
    # Must remain `always()`. Under `!cancelled()` (or any condition that lets
    # this job itself skip) a cancelled run leaves the REQUIRED check *skipped*,
    # and branch protection counts a skipped required check as satisfied --
    # which moves the silent pass one level up instead of closing it.
    # Cancellation has to be reported by a job that actually ran, so this job
    # runs unconditionally and the script fails the gate on `cancelled`.
    if: always()
    needs: [changes, test-matrix, coverage, docs-tests]
    # Same ARC routing as `changes` above.
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aggregate test results
        env:
          GATE_NAME: test
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          GATED_JOB_1: test-matrix|path-filtered|${{ needs.test-matrix.result }}
          GATED_JOB_2: coverage|merge-time-only|${{ needs.coverage.result }}
          GATED_JOB_3: docs-tests|unconditional|${{ needs.docs-tests.result }}
        run: |
          chmod +x ci/aggregate_gate_results.sh
          ./ci/aggregate_gate_results.sh
