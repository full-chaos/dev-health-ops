name: Governance Gate

on:
  pull_request:
    branches: [ "**" ]
    types: [ opened, edited, synchronize, reopened, ready_for_review ]
  merge_group:

concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed):
  # canonical fleet-wide shape -- group by PR number on pull_request, by
  # ref on a push to a non-main branch, by commit sha on a push to main or
  # on merge_group (a commit sha never collides with another commit's, so
  # main pushes and merge_group entries are never cancelled -- see
  # go.yml/typecheck.yml/docker-images.yml/arc-runner-image.yml for the
  # specific incidents this protects). cancel-in-progress cancels a stale
  # PR re-push and a stale non-main branch push only. (This workflow has
  # no push trigger today, so only the pull_request half is reachable.)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve governance context
        id: governance-context
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          body="$PR_BODY"
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            if [[ "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)- ]]; then
              pr_number="${BASH_REMATCH[1]}"
            else
              echo "Unable to identify the queued pull request from $MERGE_GROUP_HEAD_REF" >&2
              exit 2
            fi
            # shellcheck disable=SC2016
            body="$(
              gh api graphql --paginate --slurp \
                -f query='query($owner:String!,$name:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$number){mergeQueueEntry{position mergeQueue{entries(first:100,after:$endCursor){nodes{position pullRequest{body}} pageInfo{hasNextPage endCursor}}}}}}}' \
                -f owner="$GITHUB_REPOSITORY_OWNER" \
                -f name="$REPOSITORY_NAME" \
                -F number="$pr_number" \
                | jq -r '.[0].data.repository.pullRequest.mergeQueueEntry as $current | [.[].data.repository.pullRequest.mergeQueueEntry.mergeQueue.entries.nodes[] | select(.position <= $current.position) | (.pullRequest.body // "")] | join("\n")'
            )"
          fi
          delimiter="pr_body_$(uuidgen)"
          {
            echo "pr_body<<$delimiter"
            echo "$body"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Enforce governance policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_BODY: ${{ steps.governance-context.outputs.pr_body }}
        run: |
          python3 ci/check_governance_gate.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"
