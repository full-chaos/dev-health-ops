        condition: service_completed_successfully
    environment:
      <<: *auth-migration-env
      AUTH_SESSION_READER_ROLES: devhealth_api,devhealth_query_api
      AUTH_WORKLOAD_READER_ROLES: devhealth_api
    image: '${BIGBOY_AUTH_MIGRATE_IMAGE:?BIGBOY_AUTH_MIGRATE_IMAGE is the image pin: pass --env-file _records/images.env}'
    networks:
      auth_plane: null
    profiles: [auth]
