name: Documentation inventory archive review

on:
  push:
    branches:
      - main
    paths:
      - 'docs-data/inventory/**'
      - 'docs-data/ia/**'
      - 'internal/cigates/docstools/**'
      - 'internal/pythonparity/**'
      - 'cmd/cigate/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docs-inventory-review.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs-data/inventory/**'
      - 'docs-data/ia/**'
      - 'internal/cigates/docstools/**'
      - 'internal/pythonparity/**'
      - 'cmd/cigate/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docs-inventory-review.yml'
  workflow_dispatch:

concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed): this
  # workflow had no concurrency block at all, letting a re-push or
  # re-push-of-PR pile up queued/running duplicates for a superseded commit
  # indefinitely. Canonical fleet-wide shape -- group by PR number on
  # pull_request, by ref on a push to a non-main branch, by commit sha on a
  # push to main or on merge_group (never cancelled -- see go.yml/
  # typecheck.yml/docker-images.yml/arc-runner-image.yml for the specific
  # incidents this protects).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

# CHAOS-12858: "|" falls back to direct on ANY proxy error; the default "," only on 404/410.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  inventory-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
          cache: false
      - name: Locate the Go module and build caches
        id: go-cache-paths
        run: |
          {
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
          } >> "${GITHUB_OUTPUT}"
      - name: Restore the Go module and build caches (every event; saved only by main pushes and the merge queue)
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.mod }}
            ${{ steps.go-cache-paths.outputs.build }}
          key: go-shared-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-shared-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      - name: Validate the frozen Phase 1 inventory and dispositions
        run: |
          mkdir -p .build
          cp docs-data/inventory/documentation-inventory.json \
            .build/documentation-inventory.json
          go run -trimpath -mod=readonly ./cmd/cigate docs validate-inventory-review \
            --generated-json .build/documentation-inventory.json \
            --inventory-dir docs-data/inventory \
            --ia-dir docs-data/ia
      - name: Save the Go module and build caches (main pushes and the merge queue only)
        if: (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.mod }}
            ${{ steps.go-cache-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
