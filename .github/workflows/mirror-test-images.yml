# Mirror the Go test-dependency images to ghcr.io.
#
# WHY (CHAOS-4778): every Testcontainers-backed job pulls these four images from
# Docker Hub. Even authenticated, that quota is shared across the whole fleet,
# and on 2026-09-02 it ran out mid-day: `Login Succeeded!` followed 0.6 s later
# by `toomanyrequests: You have reached your unauthenticated pull rate limit`,
# taking go-quality, all six storage shards and river-compatibility down at once
# on every branch. Mirroring removes Docker Hub from the CI pull path entirely.
#
# DIGESTS ARE PRESERVED, and that is the whole point: `docker buildx imagetools
# create` copies the manifest verbatim, so the mirrored ref carries the SAME
# sha256 as the upstream one and every pin in the repository stays a literal.
# A naive `docker pull && docker tag && docker push` would NOT do this -- for a
# multi-arch image it extracts one platform and republishes a different
# manifest, silently changing the digest. The verify step below fails the run if
# the digests ever diverge, so this cannot rot quietly.
name: Mirror test images

on:
  workflow_dispatch:
  schedule:
    # Weekly. Upstream tags are pinned by digest, so this only refreshes the
    # mirror's own retention; it is not chasing upstream changes.
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - internal/testsupport/containers/harness.go
      - ci/check_go.sh
      - .github/workflows/mirror-test-images.yml
  pull_request:
    paths:
      - internal/testsupport/containers/harness.go
      - ci/check_go.sh
      - .github/workflows/mirror-test-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-test-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Forks get neither the Docker Hub secrets nor packages:write, so the job
    # would fail at login rather than do anything useful.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read the set from ci/check_go.sh rather than restating it here: one
      # parser, so the mirror and the pre-pull cannot drift apart.
      - name: Resolve the declared dependency images
        id: images
        run: |
          set -euo pipefail
          bash ci/check_go.sh integration-images | awk -F'\t' 'NF == 2' > images.tsv
          test -s images.tsv || { echo "::error::no images resolved"; exit 1; }
          echo "--- images to mirror ---"
          cat images.tsv

      - name: Mirror each image to ghcr.io, preserving its digest
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r key image; do
            case "${key}" in
              # The reaper keeps its upstream PATH under the mirror, because
              # testcontainers-go reaches it only via
              # TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX, which PREPENDS the prefix
              # to the library's own hardcoded name.
              reaper) dest="ghcr.io/${OWNER}/${image}" ;;
              *)      dest="ghcr.io/${OWNER}/dev-health-test-${key}:mirrored" ;;
            esac
            printf '\n=== %s\n    from %s\n    to   %s\n' "${key}" "${image}" "${dest}"
            docker buildx imagetools create --tag "${dest}" "${image}"
          done < images.tsv

      - name: Verify every mirrored digest matches upstream
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          failed=0
          while IFS=$'\t' read -r key image; do
            case "${key}" in
              reaper) dest="ghcr.io/${OWNER}/${image}" ;;
              *)      dest="ghcr.io/${OWNER}/dev-health-test-${key}:mirrored" ;;
            esac
            mirrored=$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "${dest}")
            case "${image}" in
              # Digest-pinned upstream: the mirrored manifest MUST carry the
              # same sha256, which is what lets every pin in the repo stay a
              # literal after the switch to ghcr refs.
              *@sha256:*)
                want="${image##*@}"
                if [ "${mirrored}" = "${want}" ]; then
                  printf 'OK   %-11s %s\n' "${key}" "${mirrored}"
                else
                  printf 'FAIL %-11s mirrored=%s want=%s\n' "${key}" "${mirrored}" "${want}" >&2
                  failed=1
                fi
                ;;
              # Tag-pinned upstream (the reaper: testcontainers-go hardcodes the
              # tag and offers no override). Nothing to compare against, so
              # record the digest the mirror now serves.
              *)
                printf 'NOTE %-11s tag-pinned upstream, mirrored digest %s\n' "${key}" "${mirrored}"
                ;;
            esac
          done < images.tsv
          exit "${failed}"

  # Measures the account's Docker Hub tier and remaining quota instead of asking
  # for it. Docker Hub returns `ratelimit-limit`/`ratelimit-remaining` on
  # metered plans and OMITS them entirely on unmetered ones, so the absence of
  # the headers is itself the answer. Kept as a permanent diagnostic: the next
  # time CI dies on `toomanyrequests`, this is one dispatch rather than an
  # investigation.
  #
  # Only the two header values are printed. The credentials are passed to curl
  # through the environment and never echoed; `set -x` is deliberately not used.
  ratelimit-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the Docker Hub rate limit for this account
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          token=$(curl -fsSL -u "${HUB_USER}:${HUB_TOKEN}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:ratelimitpreview/test:pull" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "${token}" ]; then
            echo "::error::could not obtain a Docker Hub token with the configured credentials"
            exit 1
          fi
          headers=$(curl -fsSI -H "Authorization: Bearer ${token}" \
            https://registry-1.docker.io/v2/ratelimitpreview/test/manifests/latest)
          limit=$(printf '%s\n' "${headers}" | grep -i '^ratelimit-limit:' || true)
          remaining=$(printf '%s\n' "${headers}" | grep -i '^ratelimit-remaining:' || true)
          echo "--- Docker Hub rate limit, authenticated as the configured account ---"
          if [ -z "${limit}${remaining}" ]; then
            echo "no ratelimit headers returned"
            echo "=> unmetered plan (Pro/Team/Business): pull limits are not the cause"
          else
            printf '%s\n%s\n' "${limit}" "${remaining}"
            echo "=> metered plan. 'w=21600' is the 6-hour window; remaining=0 means exhausted."
          fi
