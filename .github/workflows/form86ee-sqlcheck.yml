# Throwaway (never merged): executes FORM-W2-86EE-ERRCLASS-1 (PG sql, synthetic org prefix) in CI. Delete with the draft PR.
name: form86ee-sqlcheck

on:
  pull_request:
    paths:
      - ".github/workflows/form86ee-sqlcheck.yml"
      - "ci/form86ee-sqlcheck/**"

permissions:
  contents: read
  packages: read

jobs:
  pg-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to the image mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Run the PG cell
        env:
          PG_IMAGE: ghcr.io/full-chaos/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        run: bash ci/form86ee-sqlcheck/pg_run.sh
