apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-postgres}}
  template:
    metadata: {labels: {app: auth-postgres}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70}
      volumes: [{name: data, emptyDir: {}}]
      containers:
        - name: postgres
          image: ${LOCAL_PG}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: auth-pg-superuser, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/pgdata}
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: auth-postgres}
spec:
  selector: {app: auth-postgres}
  ports: [{port: 5432, targetPort: 5432}]
