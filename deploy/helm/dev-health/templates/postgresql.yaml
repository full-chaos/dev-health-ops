{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dev-health.fullname" . }}-postgresql
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "postgresql" "context" $) | nindent 4 }}
spec:
  serviceName: {{ include "dev-health.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "postgresql" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "postgresql" "context" $) | nindent 8 }}
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.credentials.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.credentials.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.credentials.database | quote }}
            # Must match the compose stack exactly: the volume is mounted at the
            # parent /var/lib/postgresql and PGDATA is a subdirectory of it,
            # never the mount root (which holds lost+found and other reserved
            # entries) and never the image's own default (which moves between
            # majors). Leaving PGDATA unset only ever worked by coincidence:
            # through 17 the image default was /var/lib/postgresql/data, which
            # happened to equal the old mount path, and 18 relocated it to
            # /var/lib/postgresql/<major>/docker, at which point the entrypoint
            # refuses to start against an "unused" mount. See
            # https://github.com/docker-library/postgres/pull/1259.
            - name: PGDATA
              value: /var/lib/postgresql/pgdata
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          {{- if .Values.postgresql.persistence.enabled }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          {{- end }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.credentials.user | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.credentials.user | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-postgresql
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "postgresql" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "postgresql" "context" $) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
