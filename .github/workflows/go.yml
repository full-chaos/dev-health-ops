name: Go

on:
  push:
    # `main` only. On a feature branch this workflow's push and pull_request
    # runs shared one concurrency group (CHAOS-4676's design, deliberate) and
    # raced to cancel each other; the loser left a cancelled check-run carrying
    # a required context name, blocking the merge with nothing failing
    # (CHAOS-4814). Not firing on branches removes the twin rather than the
    # arbitration, so 4676's "one authoritative run per branch tip" now holds
    # because there is only one run.
    branches: [main]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'contracts/jobs/v1/**'
      - 'deploy/go-workers/**'
      - 'scripts/**'
      - 'src/dev_health_ops/api/**'
      - 'src/dev_health_ops/config/**'
      - 'src/dev_health_ops/connectors/**'
      - 'src/dev_health_ops/licensing/**'
      - 'src/dev_health_ops/llm/**'
      - 'src/dev_health_ops/metrics/**'
      - 'src/dev_health_ops/metrics/testops*.py'
      - 'src/dev_health_ops/migrations/clickhouse/**'
      - 'src/dev_health_ops/models/**'
      - 'src/dev_health_ops/parsers/**'
      - 'src/dev_health_ops/processors/**'
      - 'src/dev_health_ops/providers/**'
      - 'src/dev_health_ops/storage/repository_rows.py'
      - 'src/dev_health_ops/sync/**'
      - 'src/dev_health_ops/workers/**'
      - 'src/dev_health_ops/workers/job_contracts/**'
      - 'src/dev_health_ops/work_graph/**'
      - 'tests/fixtures/**'
      - '**/testdata/**'
      # Go tests read these directly (contracts/*.json via os.ReadFile,
      # internal/**/families.json via filepath.Join). Not under testdata/
      # or fixtures/, so the shared glob above does not reach them.
      - 'contracts/**'
      - 'internal/**/*.json'
      - 'tests/workers/job_contracts/**'
      - 'docker/go-worker.Dockerfile'
      - 'tests/compatibility/river/**'
      - 'ci/check_go.sh'
      - 'ci/go_integration_shards.tsv'
      - 'ci/go_providersync_test_shards.tsv'
      - 'ci/requirements-live-python-oracles.txt'
      - 'ci/check_go_containers.sh'
      - 'ci/check_river_compat_static.sh'
      - 'ci/evidence/go-worker-migration/**'
      # - 'ci/local_validate.sh'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/go.yml'
  pull_request:
    branches: ['**']
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'contracts/jobs/v1/**'
      - 'deploy/go-workers/**'
      - 'scripts/**'
      - 'src/dev_health_ops/api/**'
      - 'src/dev_health_ops/config/**'
      - 'src/dev_health_ops/connectors/**'
      - 'src/dev_health_ops/licensing/**'
      - 'src/dev_health_ops/llm/**'
      - 'src/dev_health_ops/metrics/**'
      - 'src/dev_health_ops/metrics/testops*.py'
      - 'src/dev_health_ops/migrations/clickhouse/**'
      - 'src/dev_health_ops/models/**'
      - 'src/dev_health_ops/parsers/**'
      - 'src/dev_health_ops/processors/**'
      - 'src/dev_health_ops/providers/**'
      - 'src/dev_health_ops/storage/repository_rows.py'
      - 'src/dev_health_ops/sync/**'
      - 'src/dev_health_ops/workers/**'
      - 'src/dev_health_ops/workers/job_contracts/**'
      - 'src/dev_health_ops/work_graph/**'
      - 'tests/fixtures/**'
      - '**/testdata/**'
      # Go tests read these directly (contracts/*.json via os.ReadFile,
      # internal/**/families.json via filepath.Join). Not under testdata/
      # or fixtures/, so the shared glob above does not reach them.
      - 'contracts/**'
      - 'internal/**/*.json'
      - 'tests/workers/job_contracts/**'
      - 'docker/go-worker.Dockerfile'
      - 'tests/compatibility/river/**'
      - 'ci/check_go.sh'
      - 'ci/go_integration_shards.tsv'
      - 'ci/go_providersync_test_shards.tsv'
      - 'ci/requirements-live-python-oracles.txt'
      - 'ci/check_go_containers.sh'
      - 'ci/check_river_compat_static.sh'
      - 'ci/evidence/go-worker-migration/**'
      # - 'ci/local_validate.sh'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/go.yml'
  merge_group:
  workflow_dispatch:
  # CHAOS-3948 turned `push` off (see the concurrency block below for why)
  # and added this scheduled run against main's HEAD (`schedule` always
  # targets the default branch) as a fixed-cost, one-fan-out-a-day backstop
  # so main still got some Go CI between merges.
  #
  # Push was later re-enabled across all branches, which is what produced the
  # cancelled-twin race CHAOS-4814 traced; it is now scoped to `main` only.
  # So a branch with no open PR gets NO Go run -- branch protection gates on
  # the PR, so nothing merges unproven, but there is no pre-PR coverage and
  # this schedule is not a substitute for it: `schedule` targets main's HEAD,
  # never a feature branch. It backstops MAIN between merges, which is what
  # CHAOS-3948 built it for. `workflow_dispatch` above gives a one-click way
  # to run the full matrix against main on demand.
  schedule:
    - cron: '17 8 * * *'

concurrency:
  # CHAOS-4676 (redesigned round 6, replacing the imperative `guard` job
  # after 5 rounds of a lookup/cancel/poll approach that each surfaced a
  # new race or silent-pass mode — a distributed-consistency problem does
  # not belong solved with best-effort REST calls inside a CI job). `push`
  # and `pull_request` runs for the SAME branch now share ONE concurrency
  # group, so GitHub itself is the single source of truth for "only one
  # authoritative run per branch tip" — no lookups, no polls, no
  # eventual-consistency windows. See the design note in
  # .codex-review-context.md for the full ordering analysis (push-then-PR-
  # open, PR-open-then-push, ordinary re-push) and how each of the prior
  # 10 findings is now structurally impossible or obsolete.
  #
  # `github.head_ref` is the PR's source branch name (set only for
  # pull_request/pull_request_target) and empty for push, so it falls
  # through to `github.ref_name` (the pushed branch name) there — the same
  # branch produces the same group key from either trigger.
  #
  # CHAOS-4814 amended HOW that single group is reached, not the group. The
  # shared key was doing two jobs: bounding a branch to one live fan-out, and
  # arbitrating between a push run and a pull_request run for the SAME commit.
  # The second job cost more than it saved. Both events fired on every feature
  # branch, they were created in the same second, and the loser left a CANCELLED
  # check-run carrying a REQUIRED context name on the head commit -- branch
  # protection then refused the merge while every workflow run reported success
  # and `gh pr checks` showed green. Measured on #2110: 15 cancelled check-runs,
  # BLOCKED, nothing failing. Racy rather than certain (#2115's twins both
  # survived), which is why it read as flake for weeks.
  #
  # `push` is now restricted to `main`, so on a feature branch only
  # `pull_request` fires and there is no twin to arbitrate. The invariant is
  # unchanged and now holds trivially: ONE authoritative run per branch tip,
  # because there is only one run. The group still bounds re-pushes and it still
  # protects `main` and the merge queue below.
  #
  # Cost, stated plainly: a branch pushed with no PR open gets no Go run until
  # the PR is opened. Branch protection gates on the PR, so nothing merges
  # unproven -- what is lost is early feedback before a PR exists.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Historical (round 6, CHAOS-4676): a live-proof commit demonstrated the
  # shared group cancelling an earlier `push` run when `pull_request` arrived at
  # the same SHA. That cross-event arbitration no longer occurs on feature
  # branches, because `push` no longer fires there -- see CHAOS-4814 above. The
  # group still bounds the workflow to ONE live fan-out per branch (~13 jobs,
  # several at a 25-minute cap) by cancelling a superseded re-push.
  #
  # merge_group runs must not be cancelled: a burst of merges lands several
  # within the same group in quick succession, and with an unconditional
  # cancel-in-progress every one but the last gets cancelled before
  # go-storage-integration finishes — so most merges never get a real
  # pass/fail, only "cancelled". integration.yml (push-to-main integration
  # suite) already sets cancel-in-progress: false for the same reason;
  # docs-cloudflare.yml uses this same event-conditional pattern.
  #
  # Direct pushes to `main` must also not be cancelled, for the identical
  # reason (CHAOS-3948): main is never a PR's head branch in this repo's
  # normal flow, so a main push never actually races a pull_request run --
  # but a burst of fast-follow merges to main WOULD cancel each other's Go
  # coverage if this were left unconditionally true, the same failure mode
  # merge_group already guards against.
  #
  # The exemption MUST use the same effective-branch expression as the
  # group key above (codex round 6, CHAOS-4676): `github.ref_name` alone is
  # WRONG for a `pull_request` event, where it is the synthetic
  # `<pr-number>/merge` ref, never the literal string `main` -- even when
  # the PR's actual head branch IS `main` (real, not hypothetical: PR #1274
  # in this repo had `headRefName: main`). Comparing raw `ref_name` let
  # such a PR's run carry `cancel-in-progress=true` while still sharing the
  # `Go-main` group (via `head_ref`) with an in-progress direct-main push,
  # reintroducing the exact CHAOS-3948 burst-cancellation problem this
  # exemption exists to prevent. `head_ref || ref_name` closes it: a push
  # to main (head_ref empty, falls to ref_name `main`) and a main-headed PR
  # (head_ref `main` directly) are now exempted identically.
  cancel-in-progress: ${{ github.event_name != 'merge_group' && (github.head_ref || github.ref_name) != 'main' }}

permissions:
  contents: read
  # Pull the mirrored test-dependency images from ghcr.io. Works whether the
  # packages are private or public, so CI does not depend on their visibility.
  packages: read

jobs:
  # Self-hosted-runner fallback, phase 1 (chris 09-02: "we need a fallback to
  # the github runners when ours take too long, it can't be all or nothing").
  # Scoped to go-arm64-numeric-parity only for this PR -- it is the one job in
  # this file with zero image risk on the arm64 oci-arc-runners pool, since
  # BOTH legs below already run on real arm64 (ubuntu-26.04-arm today, the
  # self-hosted pool tomorrow); nothing about correctness changes with the
  # runner, only wall-clock. go-storage-integration-shard is NOT included yet:
  # its pinned PostgresImage (internal/testsupport/containers/harness.go) has
  # no arm64 manifest in the ghcr.io/full-chaos mirror today (confirmed via
  # `docker buildx imagetools inspect`, index digest), so routing it to
  # oci-arc-runners would fail the pull outright, not just run slow -- that is
  # a mirror-workflow gap to close separately, not a fallback-logic problem.
  #
  # `pick-runner` gates everything behind a repository-variable kill switch,
  # defaulting OFF (`vars.SELF_HOSTED_RUNNERS` unset or anything other than
  # 'enabled'): when off, this job is skipped entirely and downstream `needs`
  # resolve to `success()` regardless (a skipped dependency does not fail
  # `success()`), so the fallback-only leg below runs exactly as this job
  # always has. Fork PRs are excluded even when the switch is on, matching
  # PR #1432's precedent -- `secrets.*`/self-hosted access should not be
  # reachable from an untrusted fork's workflow run.
  pick-runner:
    if: vars.SELF_HOSTED_RUNNERS == 'enabled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      try_self_hosted: ${{ steps.decide.outputs.try_self_hosted }}
    steps:
      - id: decide
        run: echo "try_self_hosted=true" >> "${GITHUB_OUTPUT}"

  # Attempt leg: real work on the self-hosted arm64 pool. Only exists when
  # pick-runner actually ran and said yes -- if the switch is off or this is
  # a fork PR, this job is skipped (not failed), which is what lets the
  # fallback leg below run unconditionally as the sole leg in that case.
  go-arm64-numeric-parity-self-hosted:
    needs: pick-runner
    if: needs.pick-runner.outputs.try_self_hosted == 'true'
    runs-on: [self-hosted, oci-arc-runners]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Confirm this runner is actually arm64
        run: |
          set -euo pipefail
          arch="$(go env GOARCH)"
          if [ "${arch}" != "arm64" ]; then
            echo "expected GOARCH=arm64 on oci-arc-runners, got '${arch}'" >&2
            exit 1
          fi

      - name: Run FMA bit-pattern goldens on real arm64
        run: |
          set -euo pipefail
          go test -mod=readonly -count=1 -json ./internal/jobs/... \
            -run '(MatchesLivePythonBitExact|IntegerPercentilesMatchesLivePython)$' \
            | tee go-test-output.json
          ran=$(jq -s '[.[] | select(.Action=="run" and (.Test // "") != "")] | length' go-test-output.json)
          echo "tests actually run: ${ran}"
          if [ "${ran}" -eq 0 ]; then
            echo "0 tests matched the -run pattern -- this job would prove NOTHING and stay green even if every named test were renamed or deleted. Failing loud rather than reporting a silent pass." >&2
            exit 1
          fi

  # Fallback leg: GitHub-hosted arm64, always defined, and the SOLE source of
  # truth for the required check below (see that job's own comment for why).
  # When the self-hosted attempt is not running at all (switch off, fork PR),
  # this leg does the real work unconditionally -- byte-for-byte the job that
  # lived here before this PR. When the attempt IS running, this leg polls
  # the run's own job list (documented API, not a guess) in two phases:
  #
  #   Phase 1 (queue bound): wait up to QUEUE_TIMEOUT_MINUTES for the attempt
  #   to leave `queued`. `timeout-minutes` on the self-hosted job cannot
  #   protect against a hang here because GitHub only starts that clock once
  #   a job is picked up, never while queued -- a self-hosted pool that never
  #   schedules the job would otherwise queue for GitHub's own documented
  #   self-hosted backstop of 24h ("A job can be in the queue for 24 hours
  #   before it is automatically cancelled"), far too long to be a usable
  #   fallback. This phase is the actual hang guard: a fixed, finite loop on
  #   GitHub-hosted infrastructure that does not depend on the self-hosted
  #   pool being healthy at all. If the attempt is still queued when this
  #   phase times out, this leg claims the work itself.
  #
  #   Phase 2 (result bound, only entered if phase 1 saw the attempt leave
  #   the queue): a start is not a pass -- reporting success as soon as the
  #   attempt is merely `in_progress` would greenlight this check before its
  #   test even ran. So this phase polls further, up to ATTEMPT_TIMEOUT_MINUTES
  #   (kept in sync with the self-hosted job's own `timeout-minutes` above;
  #   duplicated because workflow YAML has no cross-job expression for it)
  #   plus a reporting-lag buffer, for the attempt to reach `completed`, then
  #   propagates its actual conclusion as this leg's own result.
  #
  # Trade-off, documented rather than hidden: if both legs are near the
  # phase-1 boundary at once, both may execute the real work (double
  # compute, rare) -- accepted in exchange for a provable bound instead of
  # relying on GitHub Actions' concurrency-group semantics to cancel a
  # sibling job in the same run, which is not a documented guarantee for
  # that case, and instead of a per-job cancel API, which does not exist
  # (confirmed against the REST "workflow jobs" reference: get-job and
  # list-jobs-for-a-run are read-only; only a whole-RUN cancel exists).
  go-arm64-numeric-parity-fallback:
    needs: pick-runner
    if: always()
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Determine the self-hosted attempt's outcome, or that it never left the queue
        id: wait
        if: needs.pick-runner.outputs.try_self_hosted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_TIMEOUT_MINUTES: 5
          ATTEMPT_TIMEOUT_MINUTES: 10
        run: |
          set -euo pipefail
          # `job_status` must tolerate the attempt job not appearing in the
          # run's job list YET -- the jobs API can lag briefly behind job
          # creation, and `[.jobs[] | select(...)][0]` on no match is `null`;
          # indexing `null.status` would abort `jq` (and, under `pipefail`,
          # this whole script) on the very first poll. Reported as
          # "not_created", never a hard error.
          #
          # codex round 1 (CHAOS-4906, P1): the ORIGINAL version of this
          # query took `[0]` unconditionally, so more than one job entry
          # sharing this exact name -- this specific job has no matrix, so
          # GitHub's own default `filter=latest` on this endpoint should make
          # that unreachable in practice (a re-run bumps the run's attempt
          # number and `filter=latest`, the default this call already uses,
          # excludes prior attempts) -- would silently select whichever entry
          # happened to sort first, which could be a stale terminal record
          # while the real attempt is still queued: a false-green exactly
          # like the "0 tests matched" trap this same file already guards
          # against elsewhere. Reachable-or-not by the documented API
          # contract today, an unguarded `[0]` is a latent fragility this
          # job's own review culture does not accept on faith -- so the
          # match count is asserted explicitly and more than one match FAILS
          # LOUD ("ambiguous") instead of silently picking one.
          job_status() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate \
              --jq '[.jobs[] | select(.name=="go-arm64-numeric-parity-self-hosted")] as $matches
                    | if ($matches | length) > 1 then "ambiguous null"
                      elif ($matches | length) == 0 then "not_created null"
                      else ($matches[0]) as $j | "\($j.status) \($j.conclusion // "null")"
                      end'
          }
          fail_if_ambiguous() {
            if [ "${status}" = "ambiguous" ]; then
              echo "FATAL: more than one job named go-arm64-numeric-parity-self-hosted in this run's job list -- refusing to guess which is the real attempt rather than silently picking one (see the comment above job_status)" >&2
              exit 1
            fi
          }

          deadline=$(( $(date -u +%s) + QUEUE_TIMEOUT_MINUTES * 60 ))
          left_queue="false"
          status="queued"
          while [ "$(date -u +%s)" -lt "${deadline}" ]; do
            read -r status conclusion <<<"$(job_status)"
            fail_if_ambiguous
            # "not_created" counts as still-queued for phase 1's purposes --
            # the attempt has not left the queue if it does not exist yet.
            if [ "${status}" != "queued" ] && [ "${status}" != "not_created" ]; then
              left_queue="true"
              break
            fi
            sleep 15
          done

          if [ "${left_queue}" != "true" ]; then
            echo "self-hosted attempt still queued after ${QUEUE_TIMEOUT_MINUTES}m -- claiming the work here"
            echo "outcome=unclaimed" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          deadline=$(( $(date -u +%s) + (ATTEMPT_TIMEOUT_MINUTES + 3) * 60 ))
          while [ "$(date -u +%s)" -lt "${deadline}" ]; do
            read -r status conclusion <<<"$(job_status)"
            fail_if_ambiguous
            if [ "${status}" = "completed" ]; then
              echo "self-hosted attempt completed with conclusion: ${conclusion}"
              if [ "${conclusion}" = "success" ]; then
                echo "outcome=claimed-success" >> "${GITHUB_OUTPUT}"
              else
                echo "outcome=claimed-failure" >> "${GITHUB_OUTPUT}"
              fi
              exit 0
            fi
            sleep 15
          done

          echo "self-hosted attempt left the queue but never reached a terminal state within $((ATTEMPT_TIMEOUT_MINUTES + 3))m -- its own timeout-minutes should have ended it by now; treating this as a failure rather than reporting a silent pass" >&2
          echo "outcome=claimed-failure" >> "${GITHUB_OUTPUT}"

      - name: Determine whether this leg owns the real work
        id: own
        run: |
          set -euo pipefail
          if [ "${{ needs.pick-runner.outputs.try_self_hosted }}" != "true" ] || [ "${{ steps.wait.outputs.outcome }}" = "unclaimed" ]; then
            echo "run_here=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_here=false" >> "${GITHUB_OUTPUT}"
            echo "self-hosted attempt already reached a terminal state (${{ steps.wait.outputs.outcome }}); skipping the fallback's own real-work steps"
          fi

      - name: Fail this leg if the self-hosted attempt itself failed
        # The attempt's failure/timeout must become THIS leg's failure too,
        # since the required check below trusts only this job's result.
        if: steps.own.outputs.run_here == 'false' && steps.wait.outputs.outcome == 'claimed-failure'
        run: |
          echo "self-hosted attempt (go-arm64-numeric-parity-self-hosted) did not succeed; failing this leg so the required check reflects it" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.own.outputs.run_here == 'true'

      - name: Set up Go
        if: steps.own.outputs.run_here == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Confirm this runner is actually arm64
        if: steps.own.outputs.run_here == 'true'
        # A mislabeled or reassigned runner would make this job's absence of
        # findings mean nothing -- fail loud rather than silently validate
        # the wrong architecture (same principle as ci/check_go.sh's stage
        # manifest: a skipped check must never read as a passed one).
        run: |
          set -euo pipefail
          arch="$(go env GOARCH)"
          if [ "${arch}" != "arm64" ]; then
            echo "expected GOARCH=arm64 on ubuntu-26.04-arm, got '${arch}' -- CHAOS-4818's FMA class does not reproduce on any other architecture, so this job proves nothing if it is not actually running on arm64" >&2
            exit 1
          fi

      - name: Run FMA bit-pattern goldens on real arm64
        if: steps.own.outputs.run_here == 'true'
        # team-lead ruling (CHAOS-4818): `go test -run <pattern>` exits 0
        # when the pattern matches ZERO tests -- correct Go semantics, but
        # if a future rename ever empties this job's -run pattern (a test
        # renamed, a package moved, a typo in the regex), this job would
        # stay green forever having proved nothing, which IS a false
        # green from this job's own perspective (its entire purpose is
        # proving these specific tests ran on real arm64). `-json` output
        # lets us count actual RUN events for named Test* functions and
        # fail loud if none ran, rather than trusting the bare exit code.
        #
        # This pattern intentionally matches only the bit-pattern golden
        # tests -- it does not name any test from the companion static
        # lint mentioned above, since that lint (and its tests) do not
        # exist on main.
        run: |
          set -euo pipefail
          go test -mod=readonly -count=1 -json ./internal/jobs/... \
            -run '(MatchesLivePythonBitExact|IntegerPercentilesMatchesLivePython)$' \
            | tee go-test-output.json
          ran=$(jq -s '[.[] | select(.Action=="run" and (.Test // "") != "")] | length' go-test-output.json)
          echo "tests actually run: ${ran}"
          if [ "${ran}" -eq 0 ]; then
            echo "0 tests matched the -run pattern -- this job would prove NOTHING and stay green even if every named test were renamed or deleted. Failing loud rather than reporting a silent pass." >&2
            exit 1
          fi

  # Preserves the original job NAME as a stable status-check target (in case
  # anything -- branch protection, another workflow's `needs:` -- ever comes
  # to depend on it by name), same aggregator shape as go-storage-integration
  # below -- but with a deliberate difference from that pattern: this
  # `needs:` ONLY the fallback leg, never the self-hosted attempt directly.
  #
  # Reason (team-lead review, 09-02): the self-hosted attempt can end up
  # permanently `queued` (pool down, or already at its max(2) capacity with
  # no autoscale headroom) with no terminal state of its own until GitHub's
  # 24h self-hosted queue backstop eventually cancels it. A job that never
  # reaches success/failure/skipped/cancelled never satisfies another job's
  # `needs:` -- an aggregator that `needs` it directly would sit "in
  # progress" for up to 24h instead of resolving in minutes, defeating the
  # entire point of a fast fallback. The fallback leg above is built to be
  # the sole source of truth instead: it either does the real work itself,
  # or polls the attempt through to an actual terminal conclusion and
  # propagates it as its own success/failure. Accepted trade-off: in the
  # pool-down/at-capacity case, the self-hosted attempt job is left dangling
  # in `queued` in the run's job list even after this required check has
  # gone green -- harmless (bounded by the 24h backstop) but visually odd;
  # documented here rather than papered over.
  go-arm64-numeric-parity:
    name: go-arm64-numeric-parity
    if: always()
    needs:
      - go-arm64-numeric-parity-fallback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FALLBACK_RESULT: ${{ needs.go-arm64-numeric-parity-fallback.result }}
    steps:
      - name: Require the fallback leg to have succeeded
        run: |
          set -euo pipefail
          if [ "${FALLBACK_RESULT}" = "success" ]; then
            echo "arm64 numeric parity passed (fallback leg result: ${FALLBACK_RESULT})"
            exit 0
          fi
          echo "fallback leg result: ${FALLBACK_RESULT}" >&2
          exit 1

  go-storage-integration-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Validate and emit deterministic integration shards
        id: plan
        run: bash ci/check_go.sh integration-shard-plan

  go-storage-integration-shard:
    name: go-storage-integration-shard-${{ matrix.target }}-${{ matrix.shard }}
    needs: go-storage-integration-plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.go-storage-integration-plan.outputs.matrix) }}
    env:
      # Redirect every registry-less Docker Hub pull -- the harness images AND
      # testcontainers-go's own hardcoded reaper -- at the ghcr mirror. Job-level
      # on purpose: the pre-pull warms the ref, and testcontainers resolves it
      # again when a test starts a container, so both need the same value.
      # The pins stay literal; the mirrored digests are identical to upstream.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      # The derived work-item integration tests migrate their throwaway
      # ClickHouse container with the project's REAL migration chain
      # (internal/testsupport/chschema), which shells out to Python. This job
      # previously installed no Python dependencies at all, so that helper died
      # with ModuleNotFoundError. The closure is pinned and installed with
      # --no-deps for the same reason go-quality's is: an undeclared dependency
      # must fail loudly rather than drift to latest.
      - name: Set up Python 3.14 for the ClickHouse migration chain
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install locked ClickHouse migration dependencies
        run: python -m pip install --no-deps -r ci/requirements-clickhouse-migrations.txt

      # Authenticated Docker Hub pulls. Anonymous pulls are rate limited per IP,
      # and a hosted runner shares that IP with everyone else on it -- which is
      # how run 33572737859 got `unauthorized: authentication required` while
      # creating a container (CHAOS-4778). The pre-pull step below turns a
      # transient rejection into three visible attempts; this step is what stops
      # the rejection happening in the first place.
      #
      # Skipped on fork pull requests, where `secrets.*` are empty by design:
      # those runs fall back to anonymous pulls plus the bounded retry rather
      # than failing at login.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull pinned test dependency images with bounded retry
        run: bash ci/check_go.sh integration-prepull

      - name: Run isolated storage integration shard ${{ matrix.target }} ${{ matrix.shard }}
        run: bash ci/check_go.sh integration-shard "${{ matrix.target }}" "${{ matrix.shard }}"

  # Preserve the existing required-check contract while the implementation
  # fans out behind it. fail-fast is disabled above, so this job observes the
  # aggregate result only after every shard has reached a terminal state.
  go-storage-integration:
    name: go-storage-integration
    if: ${{ always() }}
    needs:
      - go-storage-integration-plan
      - go-storage-integration-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLAN_RESULT: ${{ needs.go-storage-integration-plan.result }}
      SHARD_RESULT: ${{ needs.go-storage-integration-shard.result }}
    steps:
      - name: Require the plan and every integration shard to pass
        run: |
          set -euo pipefail
          if [ "${PLAN_RESULT}" != "success" ] || [ "${SHARD_RESULT}" != "success" ]; then
            echo "integration plan result: ${PLAN_RESULT}" >&2
            echo "integration shard aggregate result: ${SHARD_RESULT}" >&2
            exit 1
          fi
          echo "all deterministic Go integration shards passed"

  go-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and smoke Go images
        run: bash ci/check_go_containers.sh smoke

  go-container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [worker, scheduler, reconciler, stream-runner, operator, contractcheck, migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.target }} security image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker build \
            --file docker/go-worker.Dockerfile \
            --target "${TARGET}" \
            --build-arg VERSION=phase1-ci \
            --build-arg COMMIT=0000000000000000000000000000000000000000 \
            --build-arg BUILD_TIME=1970-01-01T00:00:00Z \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --tag "dev-health-go-${TARGET}:security" \
            .

      - name: Generate ${{ matrix.target }} SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: dev-health-go-${{ matrix.target }}:security
          format: spdx-json
          artifact-name: go-${{ matrix.target }}-sbom.spdx.json
          syft-version: v1.42.3
          dependency-snapshot: false
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Scan ${{ matrix.target }} for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dev-health-go-${{ matrix.target }}:security
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          version: v0.70.0

  go-container-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify reproducible Go images
        run: bash ci/check_go_containers.sh reproducible

  river-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Compose cannot read TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX, so the
      # compose file takes its own variable with the same meaning. The trailing
      # slash is part of the VALUE, and the file defaults it to empty, so a local
      # `docker compose up` is unchanged and still pulls upstream.
      TEST_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      # DELIBERATELY 3.13.14, NOT the project's shipped 3.14. river-compatibility
      # is a Phase 0 probe for a REJECTED production option, pinned to the last
      # interpreter it was proven against; tests/compatibility/river/run.sh sets
      # PYTHON_VERSION="3.13.14" and fails closed on any other patch, and its
      # README states the probe "is not expected to track the project's floor".
      # Do not align this one with the other two.
      - name: Set up Python 3.13.14 for the rejected-option River probe
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Install pinned Python compatibility dependencies
        run: >-
          python -m pip install
          asyncpg==0.31.0
          greenlet==3.5.0
          riverqueue==0.7.0
          SQLAlchemy==2.0.49

      - name: Run live River compatibility matrix
        env:
          RIVER_COMPAT_PYTHON: python
        run: |
          tests/compatibility/river/run.sh > "${RUNNER_TEMP}/river-compatibility.json"
          jq -e '
            .status == "complete_with_architecture_blocker"
            and .nested_n_minus_1.status == "pass"
            and [.profiles[].mode] == ["direct", "poll-only", "session"]
            and (.gate_truth_table | keys) == ["direct", "poll_only", "session"]
          ' "${RUNNER_TEMP}/river-compatibility.json" >/dev/null

      - name: Upload sanitized compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: river-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/river-compatibility.json
          if-no-files-found: ignore
          retention-days: 14

  graphql-wire-parity:
    # CHAOS-4696: query-api's registered-document consts must digest-match
    # what a real client actually sends. The wire form can ONLY be
    # computed correctly by the web repo's own pinned @urql/core/graphql
    # (see cmd/query-api/query_route.go's registeredFeatureFlagsDocument
    # doc comment for why a Go-side reimplementation of urql's printer is
    # the exact class of bug this ticket is about) -- so this job checks
    # out dev-health-web's LIVE main (not a pin: a version bump to
    # @urql/core/graphql that changes wire output must go red here
    # immediately, not go stale behind a re-pin) and runs its
    # graphql-wire-parity check against THIS repo's own HEAD.
    #
    # This is the mirror image of dev-health-web's `quality` job, which
    # checks out ops main and runs the SAME script against web's own HEAD
    # (scripts/graphql-wire-parity.ts, web repo). Together the two jobs
    # guarantee neither repo can independently drift out of parity without
    # its OWN CI catching it -- an ops-only PR that breaks parity fails
    # here without needing a web PR to exist, and vice versa.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout dev-health-web main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: full-chaos/dev-health-web
          ref: main
          path: dev-health-web-main
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: dev-health-web-main/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dev-health-web-main/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: dev-health-web-main
        run: pnpm install --frozen-lockfile

      - name: Run graphql-wire-parity check against this repo's HEAD
        working-directory: dev-health-web-main
        run: pnpm graphql:wire-parity:check --ops-root "${{ github.workspace }}"
