---
# Secrets for dev-health-ops
# NOTE: In production, use external secret management (Vault, AWS Secrets Manager, etc.)
# These values should be base64 encoded
apiVersion: v1
kind: Secret
metadata:
  name: dev-health-secrets
  namespace: dev-health
  labels:
    app.kubernetes.io/name: dev-health
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials
  # Replace with your actual values
  DATABASE_URI: "clickhouse://ch:ch@clickhouse:8123/default"
  # CLICKHOUSE_URI is what `dev-hops migrate clickhouse` (the migrate Job) and
  # `dev-hops migrate clickhouse status --check` (the wait-for-migrations
  # initContainers) resolve — DATABASE_URI is NOT consulted by those commands.
  # Keep both in sync; they should point at the same ClickHouse DSN.
  CLICKHOUSE_URI: "clickhouse://ch:ch@clickhouse:8123/default"
  SECONDARY_DATABASE_URI: ""
  
  # Provider tokens
  # IMPORTANT: Replace these with actual tokens
  GITHUB_TOKEN: ""
  GITHUB_APP_PRIVATE_KEY: ""
  GITLAB_TOKEN: ""
  LINEAR_API_KEY: ""
  
  # Jira credentials
  JIRA_BASE_URL: ""
  JIRA_EMAIL: ""
  JIRA_API_TOKEN: ""
  
  # Valkey password (if using authentication)
  REDIS_PASSWORD: ""

  # Shared bearer token for the worker operational bridge. The API validates
  # inbound bridge calls against it and the Go stream runner presents it, so
  # both workloads must read the same value from this Secret; an empty value
  # makes every bridge call fail closed with 401.
  WORKER_OPERATIONAL_BRIDGE_TOKEN: ""
---
# Go worker runtime secrets. These are deliberately a SEPARATE Secret from
# dev-health-secrets rather than more keys inside it, because two of them must
# hold a DIFFERENT value than the Python workloads read from the shared Secret:
#
#   * CLICKHOUSE_URI must address ClickHouse's NATIVE protocol (9000). Python's
#     clickhouse-connect speaks HTTP (8123); the Go client speaks the native
#     wire protocol and eagerly Ping()s at construction, so sharing the HTTP URI
#     failed every ClickHouse-dependent group on first scale-up.
#   * POSTGRES_URI is the transaction-pooled domain DSN, while queue control
#     needs its own session-pooled endpoint.
#
# go-workers.yaml lists this Secret AFTER dev-health-secrets in envFrom, and
# Kubernetes resolves duplicate keys in favour of the later source, so these
# values win for Go pods only (CHAOS-3872).
apiVersion: v1
kind: Secret
metadata:
  name: dev-health-go-worker-secrets
  namespace: dev-health
type: Opaque
stringData:
  # Native protocol port, NOT 8123. Required by every group whose queues touch
  # ClickHouse (heavy, sync, and the stream runners).
  CLICKHOUSE_URI: "clickhouse://ch:ch@clickhouse:9000/default"
  # RuntimeConfig.Validate (internal/storage/postgres/runtime.go) rejects any
  # DSN whose login does not equal the matching RIVER_*_DATABASE_ROLE in
  # configmap.yaml -- a worker fails readiness on first scale-up otherwise, it
  # never even reaches a real auth failure. The three logins below
  # (devhealth_domain/devhealth_queue/devhealth_coordinator) MUST stay in sync
  # with RIVER_DOMAIN_DATABASE_ROLE/RIVER_QUEUE_DATABASE_ROLE/
  # RIVER_COORDINATOR_DATABASE_ROLE; create matching PostgreSQL roles before
  # scaling any group (there is no automated provisioning step in this raw
  # Kubernetes tree, unlike compose's go-river-provision).
  #
  # Domain DSN through the transaction pooler. Point this at PgBouncer's
  # transaction port in a real deployment.
  POSTGRES_URI: "postgresql://devhealth_domain:devhealth_domain@postgres:5432/devhealth"
  # River queue control requires SESSION semantics and must never traverse a
  # transaction-mode pooler; the runtime fails closed if it does.
  WORKER_DATABASE_URI: "postgresql://devhealth_queue:devhealth_queue@postgres:5432/devhealth"
  # Coordinator-role work (reconciler, scheduler) takes a third, separate
  # session endpoint. A coordinator binary that silently fell back to the
  # domain pool would not hold the locks it needs.
  COORDINATOR_DATABASE_URI: "postgresql://devhealth_coordinator:devhealth_coordinator@postgres:5432/devhealth"
  # Provider credential encryption key, required by the sync group; handler
  # construction fails closed without it. Must match the value the Python
  # services use, or neither runtime can decrypt the other's credentials.
  SETTINGS_ENCRYPTION_KEY: ""
  # Shared cooldown gate and stream state. Required by the sync group and all
  # three stream runners; raw Kubernetes declared it nowhere at all.
  VALKEY_URI: "redis://valkey:6379/1"
---
# Separate secret for ClickHouse credentials
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: dev-health
type: Opaque
stringData:
  CLICKHOUSE_USER: "ch"
  CLICKHOUSE_PASSWORD: "ch"
  CLICKHOUSE_DB: "default"
---
# Separate secret for PostgreSQL credentials (if using)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: dev-health
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "devhealth"
---
# Database-only credentials used by the one-shot migration Job. Long-running
# Deployments do not reference this Secret, and the migration pod does not
# receive provider tokens from dev-health-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: dev-health-migration-secrets
  namespace: dev-health
type: Opaque
# Existing Alembic-only installations can use POSTGRES_URI. Add the elevated
# MIGRATION_DATABASE_URI here only when the one-shot Job should also apply the
# River schema; never add it to dev-health-secrets.
stringData:
  POSTGRES_URI: "postgresql+asyncpg://postgres:postgres@postgres:5432/devhealth"
  CLICKHOUSE_URI: "clickhouse://ch:ch@clickhouse:8123/default"
