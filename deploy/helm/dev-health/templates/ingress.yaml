{{- /*
CHAOS-7047: a host can route its "/" catch-all to the Go api (service: go-api), so an unknown path is answered by Go's native 404 (x-dev-health-plane: go) and
never by the Python api. The paths Python must still answer are ingress.pythonAllowList (each -> the Python api Service); a host opts in with
`pythonAllowList: true`. Render guards: a "/" path to go-api requires the opt-in (no allow-list = Python-only paths silently 404), and the allow-list must
cover /api/v1/internal, because the Go api serves /api/v1/internal/acr/* WITHOUT a credential check (the network boundary is the control, see
internal_acr_boundary_test.go): the Go default backend must never receive them from the public host.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dev-health.fullname" . }}
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $host := .Values.ingress.hosts }}
    {{- /* CHAOS-7221 (r1 P1): validate the TYPE whenever the key is present, so null/0/"" cannot skip it by being falsy. */}}
    {{- if hasKey $host "pythonAllowList" }}
    {{- if not (or (kindIs "bool" $host.pythonAllowList) (kindIs "slice" $host.pythonAllowList)) }}
    {{- fail (printf "ingress.hosts %q pythonAllowList must be true or a list of {path, pathType}, got %s" $host.host (kindOf $host.pythonAllowList)) }}
    {{- end }}
    {{- end }}
    - host: {{ $host.host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- if and (eq .path "/") (eq .service "go-api") (not $host.pythonAllowList) }}
          {{- fail (printf "ingress.hosts %q routes \"/\" to go-api without pythonAllowList: true (paths only Python serves would 404)" $host.host) }}
          {{- end }}
          {{- if and (eq .service "go-api") (or (not (regexMatch "^/[A-Za-z0-9_/-]*$" .path)) (not (has .pathType (list "Prefix" "Exact")))) }}
          {{- fail (printf "ingress.hosts %q path %q pathType %q routes to go-api: only literal Prefix/Exact paths may (a regex path can out-match the Python allow-list and expose /api/v1/internal/acr/*)" $host.host .path .pathType) }}
          {{- end }}
          {{- if eq .service "go-api" }}
          {{- if not $.Values.goApi.enabled }}{{- fail (printf "ingress.hosts %q routes to go-api but goApi.enabled is false (the Service would not exist)" $host.host) }}{{- end }}
          {{- range $ann := list "use-regex" "rewrite-target" "app-root" "configuration-snippet" "server-snippet" "permanent-redirect" "temporal-redirect" }}
          {{- if hasKey (default (dict) $.Values.ingress.annotations) (printf "nginx.ingress.kubernetes.io/%s" $ann) }}
          {{- fail (printf "ingress.annotations %s on an Ingress that routes to go-api: a rewrite/regex/snippet-class annotation can map a public path onto /api/v1/internal/* or change how paths match, so the allow-list precedence no longer holds" $ann) }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if and (eq .service "go-api") (regexMatch "^/api(/v1(/internal.*)?)?/?$" .path) }}
          {{- fail (printf "ingress.hosts %q path %q routes to go-api but covers /api/v1/internal (the Go api serves /api/v1/internal/acr/* with no credential check)" $host.host .path) }}
          {{- end }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .service "api" }}
                name: {{ include "dev-health.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.port }}
                {{- else if eq .service "go-api" }}
                name: {{ include "dev-health.fullname" $ }}-go-api
                port:
                  number: {{ $.Values.goApi.port }}
                {{- else if eq .service "go-api-internal" }}
                {{- fail (printf "ingress.hosts %q routes to go-api-internal: the internal listener is unauthenticated by design and never public (CHAOS-7181)" $host.host) }}
                {{- else if eq .service "web" }}
                name: {{ include "dev-health.fullname" $ }}-web
                port:
                  number: {{ $.Values.web.port }}
                {{- else if eq .service "billing-edge" }}
                {{- fail "ingress.hosts service \"billing-edge\" is gone (CHAOS-6903): the Python billing edge was removed; the go-api billing-edge listener serves the billing host (deploy chart: goApiBillingEdge + ingress.goApiHosts entry with billingEdge: true)" }}
                {{- end }}
          {{- end }}
          {{- if $host.pythonAllowList }}
          {{- /* CHAOS-7221: `true` uses the shared ingress.pythonAllowList; a LIST is this host's own allow-list (the in-cluster host keeps /metrics on Python). */}}
          {{- $allow := $.Values.ingress.pythonAllowList }}
          {{- if kindIs "slice" $host.pythonAllowList }}{{- $allow = $host.pythonAllowList }}
          {{- else if not (kindIs "bool" $host.pythonAllowList) }}{{- fail (printf "ingress.hosts %q pythonAllowList must be true or a list of {path, pathType}, got %s" $host.host (kindOf $host.pythonAllowList)) }}
          {{- end }}
          {{- if not $.Values.api.enabled }}{{- fail (printf "ingress.hosts %q pythonAllowList routes to the Python api but api.enabled is false (the Service would not exist)" $host.host) }}{{- end }}
          {{- $coversInternal := false }}
          {{- $seen := dict }}
          {{- $hostPaths := list }}
          {{- range $host.paths }}{{- $hostPaths = append $hostPaths .path }}{{- end }}
          {{- range $allow }}
          {{- if not (and (kindIs "map" .) (kindIs "string" .path) (regexMatch "^/[A-Za-z0-9_./-]*$" .path) (has .pathType (list "Prefix" "Exact"))) }}
          {{- fail (printf "ingress.hosts %q pythonAllowList entry %v must be {path: literal /path, pathType: Prefix|Exact}" $host.host .) }}
          {{- end }}
          {{- /* CHAOS-7221 (r1 P1): an allow-list entry may not be "/" (it would negate the default backend), repeat another entry, or repeat one of the host's own paths (two rules on one path: which backend wins is the controller's tie-break). */}}
          {{- if eq (trimSuffix "/" .path) "" }}{{- fail (printf "ingress.hosts %q pythonAllowList entry %q would route the whole host to the Python api, which is what the Go default backend replaces" $host.host .path) }}{{- end }}
          {{- if or (hasKey $seen .path) (has .path $hostPaths) }}{{- fail (printf "ingress.hosts %q pythonAllowList entry %q duplicates another rule on the same path (an allow-list path must be unique and not one of the host's own paths)" $host.host .path) }}{{- end }}
          {{- $_ := set $seen .path true }}
          {{- if and (eq .pathType "Prefix") (has (trimSuffix "/" .path) (list "/api" "/api/v1" "/api/v1/internal")) }}{{- $coversInternal = true }}{{- end }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "dev-health.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.port }}
          {{- end }}
          {{- if not $coversInternal }}
          {{- fail (printf "the Python allow-list (ingress.pythonAllowList, or the host's own pythonAllowList list) must cover /api/v1/internal (Prefix): the Go api serves /api/v1/internal/acr/* without a credential check; host %q" $host.host) }}
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
