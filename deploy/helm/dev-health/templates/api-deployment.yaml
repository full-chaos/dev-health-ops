{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-health.fullname" . }}-api
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "api" "context" $) | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  {{- /*
  CHAOS-4428: never dip below the current serving capacity during a rollout.
  Kubernetes' default is 25%/25%, which at replicas: 1 rounds maxUnavailable
  DOWN to 0 and happens to behave -- but only by rounding. State it, so the
  guarantee survives someone setting replicas: 4, where the default would take
  one serving pod out before its replacement is ready.
  */}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "api" "context" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "api" "context" $) | nindent 8 }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "dev-health.serviceAccountName" . }}
      containers:
        # CHAOS-4317: same gap as deploy/kubernetes/api.yaml -- Kubernetes has
        # no per-container pids cgroup limit expressible in a Pod spec (the
        # only lever is cluster-wide kubelet `--pod-max-pids`), so
        # worker_metrics.py's capacity reader falls through to its host-wide
        # kernel.threads-max fallback on Helm-deployed clusters too.
        - name: api
          image: {{ include "dev-health.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- toYaml .Values.api.args | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "dev-health.configMapName" . }}
            - secretRef:
                name: {{ include "dev-health.secretName" . }}
          {{- $apiEnv := list }}
          {{- if .Values.goWorkers.enabled }}
          {{- $apiEnv = append $apiEnv (dict "name" "EXPECTED_WORKER_GROUPS" "value" (.Values.goWorkers.expectedWorkerGroups | join ",")) }}
          {{- end }}
          {{- range (.Values.api.extraEnv | default (list)) }}
          {{- if ne .name "EXPECTED_WORKER_GROUPS" }}
          {{- $apiEnv = append $apiEnv . }}
          {{- end }}
          {{- end }}
          {{- with $apiEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
