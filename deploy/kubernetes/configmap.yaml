---
# ConfigMap for dev-health-ops application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-health-config
  namespace: dev-health
  labels:
    app.kubernetes.io/name: dev-health
    app.kubernetes.io/component: config
data:
  # Database configuration (connection strings in secrets)
  GRAPHQL_QUERY_TIMEOUT: "30"
  BATCH_SIZE: "100"
  MAX_WORKERS: "4"
  
  # API configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  
  # Go/River worker configuration (CHAOS-3052; Celery removed CHAOS-4195)
  RIVER_DATABASE_SCHEMA: "river"
  RIVER_DOMAIN_DATABASE_ROLE: "devhealth_domain"
  RIVER_QUEUE_DATABASE_ROLE: "devhealth_queue"

  # CHAOS-6279: WORKER_OPERATIONAL_BRIDGE_URL and
  # WORKER_OPERATIONAL_BRIDGE_ALLOW_INSECURE (formerly here, CUT-04) are
  # deleted -- the Go binaries no longer register these flags/env at all
  # (CHAOS-5320 already deleted the Python HTTP bridge they pointed at),
  # so a manifest still setting them would only be inert config, not a
  # crash risk from an unknown flag (these are env vars, not CLI args, on
  # this renderer) -- removed anyway for accuracy. The CHAOS-4351 GAP note
  # that used to live here (no metrics-api Deployment on this renderer) is
  # moot along with it: nothing on this surface points at a bridge target
  # any more, isolated or shared.
  # Exactly one runtime owns the PagerDuty webhook stream. The API and the Go
  # stream runner share this ConfigMap so they can never disagree: `celery`
  # named the retired Celery dispatch, `river` hands the stream to Go
  # (CUT-14/18). Celery is gone (CHAOS-4195); `river` is the only functioning
  # value -- the Go stream-pagerduty group is the sole consumer now. It
  # defaults to replicas: 0 in go-workers.yaml, so a fresh apply ACCEPTS
  # PagerDuty webhooks into the durable outbox but nothing drains it until
  # scaled: kubectl scale deployment/dev-health-go-stream-pagerduty --replicas=1
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "dev-health-ops"
  OTEL_METRIC_EXPORT_INTERVAL: "60000"
  
  PROVIDER_SYNC_QUEUES_ENABLED: "true"
  SYNC_COST_CLASS_QUEUES: "true"
  HIDE_MIGRATED_CHILD_CONFIGS: "true"
  SYNC_RUN_MAX_UNITS: "1000"
  SYNC_UNIT_CONCURRENCY_PER_BUCKET: "8"
  SYNC_UNIT_DISPATCH_STALE_SECONDS: "900"
  SYNC_UNIT_RUNNING_STALE_SECONDS: "3600"
  LINEAR_BACKFILL_MAX_WINDOW_DAYS: "14"
  SYNC_UNIT_EXPIRED_LEASE_MAX_RETRIES: "1"
  SYNC_UNIT_EXPIRED_LEASE_RETRY_BACKOFF_SECONDS: "60"
  SYNC_DISPATCH_REDISPATCH_COUNTDOWN: "60"
  SYNC_OUTBOX_CLAIM_TIMEOUT_SECONDS: "300"
  # CHAOS-3092 made this unconditionally true: no Celery consumer serves
  # provider units in any deployment, because that compute is deleted. The
  # shipped default is therefore active rather than shadow -- shadow selects
  # the strand and refuses to write, which is what left sync run 115e6246's 17
  # units unreachable for thirteen hours while the sweep logged them every
  # second. Set SYNC_UNRECLAIMABLE_SWEEP=shadow (or off) to override; the flag
  # --unreclaimable-sweep still beats this.
  SYNC_UNRECLAIMABLE_SWEEP: "active"
  SYNC_WATERMARK_OVERLAP: "0"

  SYNC_BUDGET_BUCKET_LIMITS: '{"github:rest_core":250,"github:graphql_cost":500,"github:contents_blob":100,"github:secondary_abuse_risk":25,"linear:graphql_cost":500}'
  SYNC_BUDGET_DEFAULT_LIMIT: "1000000"
  SYNC_BUDGET_DEFERRAL_SECONDS: "60"
  SYNC_BUDGET_DEFERRAL_JITTER_SECONDS: "5"
  SYNC_BUDGET_DRY_RUN_DEFAULT_LIMIT: "1000000"
  SYNC_BUDGET_DRY_RUN_DEFERRAL_SECONDS: "60"
  
  # GitLab configuration (for self-hosted)
  GITLAB_URL: "https://gitlab.com"
  
  # Jira configuration
  JIRA_FETCH_COMMENTS: "1"
  
  # GitHub configuration
  GITHUB_APP_ID: ""
  GITHUB_APP_PRIVATE_KEY_PATH: ""
  GITHUB_APP_INSTALLATION_ID: ""
  GITHUB_BASE_URL: "https://api.github.com"
  GITHUB_INCLUDE_PRS: "true"
  GITHUB_FETCH_COMMENTS: "true"
  GITHUB_FETCH_MILESTONES: "true"
  GITHUB_LINEAR_LINKBACK_BOTS: "linear[bot]"

  LINEAR_TRUSTED_SCM_HOSTS: ""
  
  # Logging
  LOG_LEVEL: "INFO"

  # Migrations (CHAOS-2304): schema is applied by the one-shot migrate Job
  # (migrate-job.yaml) — api/worker pods must never run migrations themselves.
  AUTO_RUN_MIGRATIONS: "false"
