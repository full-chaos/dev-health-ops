name: Docs Guards

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/check_freshness_inventory.py'
      - 'docs-data/**'
      - 'Makefile'
      - 'wrangler.jsonc'
      - 'scripts/build_docs_cloudflare.py'
      - '.github/workflows/docs-guards.yml'
      - '.github/workflows/docs-cloudflare.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/check_freshness_inventory.py'
      - 'docs-data/**'
      - 'Makefile'
      - 'wrangler.jsonc'
      - 'scripts/build_docs_cloudflare.py'
      - '.github/workflows/docs-guards.yml'
      - '.github/workflows/docs-cloudflare.yml'
  merge_group:
  workflow_dispatch:

concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed):
  # canonical fleet-wide shape -- group by PR number on pull_request, by
  # ref on a push to a non-main branch, by commit sha on a push to main or
  # on merge_group (a commit sha never collides with another commit's, so
  # main pushes and merge_group entries are never cancelled -- see
  # go.yml/typecheck.yml/docker-images.yml/arc-runner-image.yml for the
  # specific incidents this protects). cancel-in-progress cancels a stale
  # PR re-push and a stale non-main branch push only.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  # The Go guards of the docs content and of the docs workflows (internal/cigates/docs). This job runs on every
  # change of the paths above, so a docs-only pull request, which the Go relevance filter classifies as non-Go,
  # still runs them. It installs no Python.
  docs-content-guards:
    name: docs-content-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Run the docs content guards
        run: go test -mod=readonly -trimpath -count=1 ./internal/cigates/docs/...

  docs-guards:
    name: docs-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Validate publication inventory and IA placement
        run: |
          mkdir -p .build
          set -o pipefail
          go run -trimpath -mod=readonly ./cmd/cigate docs validate-publication \
            2>&1 | tee .build/docs-publication-validation.log

      - name: Strict canonical build
        run: |
          set -o pipefail
          python -m mkdocs build --strict --config-file mkdocs.yml \
            2>&1 | tee .build/docs-build.log

      - name: Check rendered links, anchors, and assets
        run: |
          set -o pipefail
          go run -trimpath -mod=readonly ./cmd/cigate docs check-built-site-links \
            --site-dir .build/docs \
            2>&1 | tee .build/docs-links.log

      - name: Check task-based search acceptance
        run: |
          set -o pipefail
          go run -trimpath -mod=readonly ./cmd/cigate docs check-docs-search \
            --site-dir .build/docs \
            --queries docs-data/search-acceptance.json \
            2>&1 | tee .build/docs-search.log

      - name: Check structural accessibility invariants
        run: |
          set -o pipefail
          go run -trimpath -mod=readonly ./cmd/cigate docs check-docs-accessibility \
            --site-dir .build/docs \
            --css docs/stylesheets/extra.css \
            2>&1 | tee .build/docs-accessibility.log

      # CHAOS-3514 (chris ruling: gate the scripts, keep the tests). These two
      # guards had unit tests in tests/docs but their SCRIPTS ran only from
      # Makefile targets -- never in CI -- so the property each enforces was
      # unguarded on every PR. Both take repo-relative defaults and need no
      # inputs CI lacks, which is why they can be wired honestly here; the
      # user-guide-evidence validator cannot and is reported separately
      # rather than invoked against a fabricated corpus.
      - name: Check code prerequisites
        run: |
          set -o pipefail
          go run -trimpath -mod=readonly ./cmd/cigate docs check-code-prerequisites \
            2>&1 | tee .build/docs-code-prerequisites.log

      - name: Check freshness inventory
        run: |
          set -o pipefail
          go run -trimpath -mod=readonly ./cmd/cigate docs check-freshness \
            2>&1 | tee .build/docs-freshness-inventory.log

      # The site above was built and checked for this revision. Stamp it and hand it to docs-preview, so a pull request
      # builds and checks the site once. The stamp is the revision the checks ran for; the preview job refuses any other.
      - name: Stamp the validated site with its revision
        run: printf '%s\n' "$GITHUB_SHA" > .build/docs-validated.sha

      - name: Upload the validated site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-site-${{ github.sha }}
          path: |
            .build/docs
            .build/docs-validated.sha
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload documentation quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-quality-evidence
          path: |
            .build/docs-*.log
            .build/docs-*.tsv
            .build/docs-*.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Pull requests only: the Cloudflare preview assets from the site docs-guards just validated. This job runs the checks only
  # the preview has (candidate facts) and prepares the assets; it does not build or check the site again. With no validated
  # site for this revision, build_docs_cloudflare.py builds and checks it itself.
  docs-preview:
    name: docs-preview
    if: github.event_name == 'pull_request'
    needs: docs-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # CHAOS-10486: no setup-go cache here. Its key is shared by every workflow, and a job that compiles little or
          # nothing saved it first and left the heavy jobs an empty entry.
          cache: false

      - name: Download the validated site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docs-site-${{ github.sha }}
          path: .build

      - name: Prepare validated preview assets
        run: |
          mkdir -p .build
          set -o pipefail
          python3 scripts/build_docs_cloudflare.py --mode preview --full-check --reuse-site \
            2>&1 | tee .build/docs-cloudflare-build.log

      - name: Upload build evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-cloudflare-preview-${{ github.sha }}
          path: |
            .build/docs-cloudflare/**
            .build/docs-cloudflare-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
