# CHAOS-3142 incident, 2026-07-25: this file previously shared the compose
# project name `dev-health` with the repo-root `compose.yml` (a separate,
# divergent file with an incompatible postgres definition -- different
# image, role/database names, PGDATA path, and port). Because Docker Compose
# tracks service ownership by (project name, service name), an `up` from
# EITHER file could recreate the OTHER file's already-running containers in
# place, discarding whatever they had (see the postgres image/PGDATA history
# below). Naming this project `dev-health-ops` makes that collision
# structurally impossible: this file now owns its own containers, network,
# and volumes, entirely separate from whatever the repo-root compose.yml
# manages. That also means this file's postgres always starts from its own
# empty volume -- it is no longer a way to attach to another project's data.
name: dev-health-ops

# Go/River worker topology (CHAOS-3142, folded in at CHAOS-3088 from
# deploy/docker-compose/compose.go-workers.yml -- that file keeps its own
# copy for compose.production.yml's separate `--profile go-workers` overlay
# path; this is a second, independently maintained copy for local-dev
# parity against THIS file's own postgres/clickhouse/valkey, same as the
# archived Celery fleet below keeps its own copy rather than sharing one
# with compose.production.yml). Credentials only in `environment:` --
# everything else is a flag, so `docker compose config` shows the deployed
# configuration of every service below in one place.
x-go-worker-flag:
  http-addr: &flag-http-addr "--http-addr=:8080"
  river-schema: &flag-river-schema "--river-schema=${RIVER_DATABASE_SCHEMA:-river}"
  domain-role: &flag-domain-role "--domain-database-role=${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}"
  queue-role: &flag-queue-role "--queue-database-role=${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}"
  queue-mode: &flag-queue-mode "--queue-database-mode=${WORKER_DATABASE_MODE:-session}"
  coordinator-mode: &flag-coordinator-mode "--coordinator-database-mode=${COORDINATOR_DATABASE_MODE:-session}"
  domain-pooler: &flag-domain-pooler "--domain-transaction-pooler=${PGBOUNCER_TRANSACTION_MODE:-true}"
  # The PagerDuty stream runner forwards reconciliation to the Python worker
  # bridge until the locked-graph port lands (CUT-20), so it cannot open
  # readiness without a bridge URL.
  bridge-url: &flag-bridge-url "--operational-bridge-url=${WORKER_OPERATIONAL_BRIDGE_URL:-http://api:8000}"
  # CHAOS-4351: `go-worker-heavy` is the ONLY worker group whose queue set
  # includes `metrics` -- every other group's operational-bridge traffic
  # stays on `api` via the shared `flag-bridge-url` above; only this
  # group's flag is repointed at the dedicated `metrics-api` service so a
  # bridge-side pids/memory incident there can no longer take unrelated
  # `api` request handling, or unrelated go-worker groups, down with it.
  bridge-url-heavy: &flag-bridge-url-heavy "--operational-bridge-url=${DEV_HEALTH_METRICS_BRIDGE_URL:-http://metrics-api:8000}"
  # The default bridge endpoint above is a plaintext Compose service-discovery
  # name, which the runtime rejects unless this opt-in is set. Override to
  # false once the bridge is reachable over an internal HTTPS origin.
  bridge-insecure: &flag-bridge-insecure "--operational-bridge-allow-insecure=${WORKER_OPERATIONAL_BRIDGE_ALLOW_INSECURE:-true}"
  log-level: &flag-log-level "--log-level=${LOG_LEVEL:-info}"

x-go-worker-env-base: &go-worker-env-base
  # codex review (r1 P1 + r2 P1): `POSTGRES_URI` here used to be
  # `:?required` (deploy/docker-compose/compose.go-workers.yml's shape,
  # fine for an opt-in overlay) and then just empty-default -- but the
  # container env var the Go binary reads (`POSTGRES_URI`, hardcoded in
  # internal/platform/config/config.go) is the SAME NAME `.env.example`
  # already uses for unrelated host-side Python tooling
  # (`postgresql+asyncpg://postgres:postgres@localhost:5555/postgres`,
  # meaningless inside a container -- `localhost` there is the worker
  # itself). An empty-default on that exact name never even applied: the
  # shell variable IS set, just to the wrong thing, so the Go domain
  # connection silently failed closed (`queue_control_config`... no,
  # `domain_postgres` -- confirmed executed against this exact value).
  # Fixed by reading a DEDICATED shell variable instead, same pattern as
  # `go-river-migrate`'s `GO_WORKER_MIGRATION_DATABASE_URI` below, with a
  # computed default through the dedicated poolers folded in above (domain
  # via the existing `pgbouncer`, queue-control via `pgbouncer-river-queue`)
  # -- adapted from the proven design already running the shared bigboy
  # stack (compose/compose.go.workers.yml, untracked, outside this repo),
  # to this file's own postgres identity (superuser/database `postgres`,
  # not that stack's `devhealth`).
  POSTGRES_URI: ${GO_WORKER_POSTGRES_URI:-postgresql://${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}:${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}@pgbouncer:6432/${POSTGRES_DB:-postgres}}
  WORKER_DATABASE_URI: ${GO_WORKER_QUEUE_DATABASE_URI:-postgresql://${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}:${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}@pgbouncer-river-queue:6433/${POSTGRES_DB:-postgres}}
  # Port 9000 is the NATIVE protocol, not 8123 -- the Go worker speaks the
  # native wire protocol through clickhouse-go and eagerly Ping()s at
  # construction (CHAOS-3872, deploy/go-workers/README.md).
  CLICKHOUSE_URI: clickhouse://${CLICKHOUSE_USER:-ch}:${CLICKHOUSE_PASSWORD:-ch}@clickhouse:9000/${CLICKHOUSE_DB:-default}
  VALKEY_URI: redis://valkey:6379/1
  # deploy/go-workers/deployment.json requires this for the sync group, and
  # provider-sync handler construction fails closed without it. Shared with
  # the Python services so both runtimes decrypt the same provider
  # credentials -- same empty-default shape as `api`'s own
  # SETTINGS_ENCRYPTION_KEY below, reading the identical shell variable, so
  # the value stays byte-identical between the two runtimes whenever it is
  # actually set.
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
  # codex review (r2, P1 -- found executing the required readyz proof, not
  # by inspection): go-worker/go-worker-heavy/go-worker-ops claim
  # work_graph_execution_requests rows via a coordinator-role connection
  # (matches the bigboy overlay's own CHAOS-5133 comment) -- without this
  # in the shared base, sync crash-looped with "worker family builder
  # failed... syncCoordinator... worker readiness dependency is
  # unavailable" instead of the expected live-but-unready shape. Default
  # here, not just on go-reconciler/go-scheduler; the three stream
  # services neutralize it back to empty below, same as the overlay this
  # was folded from.
  COORDINATOR_DATABASE_URI: ${GO_WORKER_COORDINATOR_DATABASE_URI:-postgresql://${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}:${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}@pgbouncer-river-coordinator:6434/${POSTGRES_DB:-postgres}}
  # codex review (r2, P1 -- found executing the required readyz proof):
  # internal/syncdispatchruntime.NewHTTPBridge rejects an empty bearer
  # token outright (pure validation, no network call) -- sync/ops/heavy
  # construct this bridge unconditionally, so an empty default here made
  # EVERY worker family fail to compose at all ("worker readiness
  # dependency is unavailable"), not the live-but-unready shape the other
  # empty-defaults produce. Matches the bigboy overlay's own fix exactly:
  # a non-empty local placeholder, not a credential.
  WORKER_OPERATIONAL_BRIDGE_TOKEN: ${WORKER_OPERATIONAL_BRIDGE_TOKEN:-local-go-worker-bridge-token}
  AUTO_RUN_MIGRATIONS: "false"
  # CHAOS-4587: see `migrate`'s own comment on this variable below -- must
  # move with the migrate export in the same deploy pass; see
  # deploy/go-workers/README.md's rollout note before changing this value.
  OPERATIONAL_ORDERING_CONTRACT: ${OPERATIONAL_ORDERING_CONTRACT:-1}

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local

services:
  postgres:
    # CHAOS-3142 incident, 2026-07-25: the immediate trigger was this file
    # sharing its compose project name with the repo-root compose.yml (see
    # the `name:` comment above) -- an `up` from either file could recreate
    # the other's already-running postgres container in place. But this
    # image was also unpinned (`latest`) and PGDATA was misspelled
    # (`PG_DATA`, which the postgres image never reads), so the container
    # that got recreated started an entirely new, empty cluster in whatever
    # subdirectory that image version's own default PGDATA happened to be,
    # rather than failing loudly or reusing the real one. Both defects are
    # fixed independently of the project-name fix, so this file's own
    # isolated volume can't suffer the same silent-relocation failure mode
    # on some future `up`. Pinned to the same Postgres 18 Alpine digest
    # already pinned in internal/testsupport/containers/harness.go, so the
    # dev stack and the Go integration-test harness agree on one Postgres
    # build. The repo-root compose.yml already got PGDATA right under
    # CHAOS-1771 (`PGDATA: /var/lib/postgresql/data/pgdata`, with its own
    # comment on the same anonymous-volume trap) -- this file adopts the
    # identical reasoning so the two agree rather than looking like
    # independent guesses.
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # Must be a subdirectory of the volume mount (postgres_data is mounted
      # at the parent /var/lib/postgresql/), never the mount root itself --
      # otherwise the image's lost+found and other reserved entries live
      # alongside PGDATA and a future image-default change silently
      # relocates the cluster again. Previously misspelled `PG_DATA`, which
      # the postgres image never reads, so this had no effect for seven
      # months (commit 581ae01e6) while every cluster was created at the
      # image's own shifting default path.
      PGDATA: /var/lib/postgresql/pgdata
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      # CHAOS-3142: the coordinator role of the CHAOS-3033 Option B split.
      # docker/init-extra-dbs.sh already reads these two (defaulting to
      # devhealth_coordinator) to create the login and grant CONNECT; without
      # them here an operator override never reaches the script that
      # provisions it.
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      # Local development credentials only. Production roles are provisioned
      # through the database provider/secret manager before migration.
      RIVER_DOMAIN_DATABASE_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}
      RIVER_QUEUE_DATABASE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
      - ./docker/init-extra-dbs.sh:/docker-entrypoint-initdb.d/init-extra-dbs.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  pgbouncer:
    # CHAOS-2065: transaction-mode connection pooler in front of postgres.
    # Multiplexes many client connections onto a small server-connection set so
    # the worker fleet cannot exhaust postgres max_connections. The app runs with
    # PGBOUNCER_TRANSACTION_MODE=true (disables asyncpg prepared statements).
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      ADMIN_USERS: postgres
      # CHAOS-3944: log_connections/log_disconnections default on and turn a
      # Go worker fleet's steady attach/detach churn into a continuous,
      # diagnostically worthless firehose (measured ~36 lines/min across the
      # three production poolers). Keep log_pooler_errors and the default
      # log_stats ON: the once-a-minute stats line is the only real pooler
      # telemetry and it proved its worth in a live incident (wait
      # 5683209 us during trouble, wait 16136 us after recovery). Do not
      # "tidy away" that stats line.
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      LOG_POOLER_ERRORS: "1"
      # Healthcheck-only credential: PGPASSWORD is a libpq env var psql reads
      # automatically, so it never appears in argv. Dev-only literal,
      # matching DB_PASSWORD above.
      PGPASSWORD: postgres
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # CHAOS-3944: pg_isready cannot prove the pooler can authenticate and
      # serve a query — it reports healthy even on an auth rejection
      # regardless of username, so pinning -U/-d alone doesn't fix that (see
      # deploy/docker-compose/compose.production.yml). Run a real query
      # through the pooler instead.
      test: ["CMD", "psql", "-w", "-h", "localhost", "-p", "6432", "-U", "postgres", "-d", "postgres", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # codex review (r2, P1): the Go worker fleet below needs two more
  # dedicated poolers -- queue-control and coordinator -- that this file
  # never defined; folded in from the proven design already running the
  # shared bigboy stack (/home/ubuntu/devhealth/compose/compose.go.workers.yml),
  # adapted to this file's own postgres identity (superuser `postgres`,
  # database `postgres` -- not that stack's `devhealth`/`devhealth`).
  # `pgbouncer` above already lets devhealth_domain/devhealth_queue/
  # devhealth_coordinator authenticate through it with no changes: edoburu/
  # pgbouncer's AUTH_TYPE != trust wires an implicit auth_query against
  # pg_shadow using DB_USER (a real superuser here, same as the bigboy
  # stack's), so any role docker/init-extra-dbs.sh created passes through
  # -- confirmed by inspecting a live, multi-day-running go-worker container
  # on that stack, whose resolved POSTGRES_URI uses devhealth_domain through
  # that exact single-role-configured pgbouncer. ADMIN_USERS is deliberately
  # NOT widened; that setting is unrelated to this mechanism.
  #
  # Session mode pins one server connection per client session for the life
  # of that session, so DEFAULT_POOL_SIZE is a hard ceiling on how many
  # worker replicas can start, not a throughput knob -- this default (40)
  # is the bigboy file's own general-purpose value ("covers 3 replicas of
  # every worker group plus headroom" per its comment), NOT bigboy's own
  # further-tuned override (100, applied there only because that stack runs
  # at a measured 4 replicas per group -- see
  # .remember/lanes/lane-stack-owner/river-queue-pool-override.yml). This
  # file defaults every Go process to 1 replica, comfortably inside 40.
  pgbouncer-river-queue:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer-river-queue
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      DB_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      DB_NAME: ${POSTGRES_DB:-postgres}
      LISTEN_PORT: "6433"
      POOL_MODE: session
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: ${PGBOUNCER_RIVER_QUEUE_MAX_CLIENT_CONN:-128}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_RIVER_QUEUE_POOL_SIZE:-40}
      PGPASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "psql", "-w", "-h", "localhost", "-p", "6433", "-U", "${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}", "-d", "${POSTGRES_DB:-postgres}", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Coordinators hold locks across statements, so they receive their own
  # bounded session pool rather than the transaction-mode domain endpoint
  # above (same rationale as the bigboy file this was folded from).
  pgbouncer-river-coordinator:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer-river-coordinator
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      DB_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
      DB_NAME: ${POSTGRES_DB:-postgres}
      LISTEN_PORT: "6434"
      POOL_MODE: session
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "32"
      DEFAULT_POOL_SIZE: "10"
      PGPASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "psql", "-w", "-h", "localhost", "-p", "6434", "-U", "${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}", "-d", "${POSTGRES_DB:-postgres}", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:latest@sha256:d7556a3841027651307b5aa08d72b5c467d0241d3db5b67d9e158ef3975626f5
    container_name: clickhouse
    restart: on-failure
    environment:
      CLICKHOUSE_LISTEN_HOST: 0.0.0.0
      CLICKHOUSE_USER: ch
      CLICKHOUSE_PASSWORD: ch
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8123/ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  valkey:
    image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    container_name: valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: api
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    container_name: dev-health-migrate
    restart: "no"
    entrypoint:
      - sh
      - -c
      - >-
        if [ -z "$${MIGRATION_DATABASE_URI:-}" ];
        then unset MIGRATION_DATABASE_URI; fi;
        if [ -n "$$POSTGRES_URI" ]
        || [ "$${MIGRATION_DATABASE_URI+x}" = x ]
        || [ "$${MIGRATION_DATABASE_URI_FILE+x}" = x ];
        then dev-hops migrate postgres; fi
        && dev-hops migrate clickhouse
    environment:
      POSTGRES_URI: postgresql+asyncpg://postgres:postgres@postgres:5432/${POSTGRES_DB:-postgres}
      MIGRATION_DATABASE_URI: ${MIGRATION_DATABASE_URI:-}
      DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER: ${DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER:-}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      # CHAOS-4587 (codex delta round 2, P1): migration 067 checks this same
      # variable to decide whether to apply the ordering-contract cutover
      # (src/dev_health_ops/migrations/clickhouse/067_operational_ordering_contract.py) --
      # without a reference here, an operator's shell export never reaches
      # this container, 067 silently defers ("successfully"), and workers
      # wired to the same export (the go-worker-* services below) start
      # against a still-contract-1 table. Must move with the worker export
      # in the same deploy pass; see deploy/go-workers/README.md.
      OPERATIONAL_ORDERING_CONTRACT: ${OPERATIONAL_ORDERING_CONTRACT:-1}
      CLICKHOUSE_URI: clickhouse://ch:ch@clickhouse:8123/${CLICKHOUSE_DB:-default}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: api
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    container_name: dev-health-api
    command: |
      --host 0.0.0.0 --port 8000 --reload
    environment: &env
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DEV_HEALTH_OPS: "0.0.0"
      PYTHONPATH: /app/src
      # GraphQL analytics endpoint available at /graphql
      GRAPHQL_QUERY_TIMEOUT: "30"
      # CHAOS-2065: runtime DB traffic flows through PgBouncer (transaction mode).
      # Run schema migrations against postgres:5432 directly -- see
      # docs/ops/database-connection-pooling.md.
      DATABASE_URI: "postgresql+asyncpg://postgres:postgres@pgbouncer:6432/postgres"
      PGBOUNCER_TRANSACTION_MODE: "true"
      CLICKHOUSE_URI: "clickhouse://ch:ch@clickhouse:8123/default"
      REDIS_URL: "redis://valkey:6379/1"
      # Pre-existing gap fixed alongside CHAOS-3142: declared in
      # .env.example but was never actually referenced by this file, so no
      # override ever reached any container -- provider credential
      # decryption (src/dev_health_ops/core/encryption.py, read by
      # workers/task_utils.py for every provider) silently had no key in
      # local dev. The Go worker's `sync` profile decrypts the same stored
      # credentials with the same variable name
      # (SETTINGS_ENCRYPTION_KEY, deploy/go-workers/deployment.json) wherever
      # it runs, so this value stays byte-identical to whatever a Go
      # topology alongside this stack is given.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      # CHAOS-2299: route sync dispatch to per-provider queues. Safe to enable
      # here because the worker -Q lists below consume sync.<provider> in the
      # SAME change. Bare-image deployments must follow the two-phase rollout
      # in workers/queues.py: expand consumer -Q lists first, then flip this.
      PROVIDER_SYNC_QUEUES_ENABLED: "true"
      # CHAOS-3942/CHAOS-3088: /health/workers is Celery-authoritative until
      # told otherwise. The Go fleet below is this file's unconditional
      # default now, so it is the declared worker_instances fleet the
      # endpoint checks -- reconciler/scheduler/stream-* are excluded: they
      # run a separate role with their own /healthz and never register
      # worker_instances presence.
      EXPECTED_WORKER_GROUPS: ${EXPECTED_WORKER_GROUPS:-heavy,ops,sync,sync-provider}
      # There are no provider/dataset route switches. CHAOS-4054: capability is
      # always on in the binary, the user's sync config decides what should run,
      # and each worker's -Q/--queues topology decides what it serves.
      # GitHub work-items is a five-alias matrix family, but only its canonical
      # work-items claim may execute. Its Go route requires these two config
      # artifacts. Leave them unset: every worker image ships them at
      # /app/config, which is what the binary defaults to. Point them elsewhere
      # only to override the packaged artifacts — an unreadable path fails Go
      # readiness before a provider request or write.
      WORKER_GITHUB_WORK_ITEMS_STATUS_MAPPING_PATH: ${WORKER_GITHUB_WORK_ITEMS_STATUS_MAPPING_PATH:-}
      WORKER_GITHUB_WORK_ITEMS_INVESTMENT_CONFIG_PATH: ${WORKER_GITHUB_WORK_ITEMS_INVESTMENT_CONFIG_PATH:-}
      AUTO_RUN_MIGRATIONS: "false"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_TEAM: ${STRIPE_PRICE_ID_TEAM:-}
      STRIPE_PRICE_ID_ENTERPRISE: ${STRIPE_PRICE_ID_ENTERPRISE:-}
      LICENSE_PRIVATE_KEY: ${LICENSE_PRIVATE_KEY:-}
      # Email (Resend)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@example.com}
      # Observability — OpenTelemetry (traces and metrics → SigNoz)
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-otel-collector:4317}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-dev-health-ops}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-60000}
      # Observability — Error reporting (Sentry SDK → BugSink)
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_TRACES_RATE: ${SENTRY_TRACES_RATE:-0}
      SENTRY_SEND_PII: ${SENTRY_SEND_PII:-true}
      # CHAOS-4264: bounds the daily/remaining metrics compatibility
      # bridge's runner subprocess (worker_metrics_runner), independent of
      # this container's own memory limit (which the runner shares with the
      # API process itself). CHAOS-4361: enforced primarily by the PARENT
      # polling the runner's real RSS (/proc/<pid>/status) and killing it on
      # breach -- the runner's own self-imposed RLIMIT_AS is now only a
      # generous backstop (4x this value), since RLIMIT_AS counts virtual
      # address space, not resident memory, and false-fired well under this
      # bound in prod. Hitting either bound raises a classified MemoryError
      # instead of leaving the container-wide cgroup OOM killer as the only
      # thing that notices -- see deploy/go-workers/README.md
      # "Daily-metrics compatibility bridge" for the incident this closes.
      # Paired with
      # DEV_HEALTH_METRICS_RUNNER_MAX_CONCURRENCY (default 1): this is the
      # WHOLE per-runner budget, not a slice of a larger aggregate -- codex
      # R1 flagged that a per-runner limit without a concurrency bound is
      # not an aggregate memory bound at all.
      DEV_HEALTH_METRICS_RUNNER_MEMORY_LIMIT_BYTES: ${DEV_HEALTH_METRICS_RUNNER_MEMORY_LIMIT_BYTES:-671088640}
      DEV_HEALTH_METRICS_RUNNER_MAX_CONCURRENCY: ${DEV_HEALTH_METRICS_RUNNER_MAX_CONCURRENCY:-1}
      # CHAOS-3092: the CHAOS-4316 daily-partition progress-stall watchdog
      # these three env vars used to configure is deleted outright from
      # worker_metrics.py -- it existed only to bound a hung daily bridge
      # subprocess, and that bridge (execute_daily_metrics) has no callers
      # left, every daily family being native Go now.
      # CHAOS-4350: hard row cap for ClickHouseDataLoader testops reads
      # (test_suite_results/test_case_results). Without this reaching the
      # runner container, an operator raising it in the host env/.env per
      # the guard's own exception message has no effect (codex R2) -- the
      # child process only sees vars this block passes through.
      DEV_HEALTH_TESTOPS_LOADER_MAX_ROWS: ${DEV_HEALTH_TESTOPS_LOADER_MAX_ROWS:-200000}
    # CHAOS-4317: no compose file (this one, the dev-health root's
    # hand-maintained mirror, or prod's own copy) has ever set an explicit
    # pids_limit -- confirmed by grep 2026-08-26. That means the container's
    # cgroup pids.max reads "max" (unbounded) in every environment today, so
    # the only ceiling the 2026-08-26 incident's pthread_create failures
    # could have hit was a host-wide one (ulimit -u / kernel.threads-max),
    # shared across every container on the host and invisible to this
    # container's own cgroup accounting. Setting a finite, explicit
    # pids_limit here gives worker_metrics.py's capacity reader
    # (_effective_pids_ceiling) a real, container-scoped number to read
    # instead of falling through to that host-wide fallback, AND gives the
    # container a predictable hard backstop of its own.
    #
    # Formula, not a blessed number (team-lead direction 2026-08-26): the
    # default below is
    #   DEV_HEALTH_METRICS_RUNNER_MAX_CONCURRENCY (1) *
    #     (seeded per-child pids cost, 32 -- converges upward at runtime to
    #      the real observed peak, see worker_metrics.py
    #      _PIDS_PER_CHILD_COST_HOLDER) *
    #   4x headroom for the api process's own baseline threads (uvicorn
    #     workers, OTel batch processor, the event loop) plus the ambient
    #     burst this ticket exists for (sync_run threads, hourly fanout) =
    #   1 * 32 * 4 = 128, rounded up to a round number with margin: 256.
    # Retune alongside DEV_HEALTH_METRICS_RUNNER_MAX_CONCURRENCY -- raising
    # concurrency without raising this proportionally reintroduces the
    # exact gap CHAOS-4264's memory bound warns about for its own limit.
    pids_limit: ${DEV_HEALTH_API_PIDS_LIMIT:-256}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    working_dir: /app
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8000/ready" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # CHAOS-4351: a second copy of `api` -- same image, same command, same
  # environment (`<<: *env`) -- serving ONLY as the Go daily-runtime's
  # metrics compatibility bridge target. No route split, no code change:
  # `worker_metrics.py`'s bridge routes are exposed on `api` too, this is
  # just a separate process/cgroup so a bridge-side pids/memory incident
  # (CHAOS-4264, CHAOS-4317, CHAOS-4350) can no longer take unrelated `api`
  # request handling down with it. `go-worker-heavy` below (the one worker
  # group that actually calls the metrics compatibility bridge -- confirmed
  # via `rg 'queues='`, no other go-worker-* group's queue set includes
  # `metrics`) points at this service instead of `api`; every other
  # go-worker-* group is unaffected.
  #
  # codex review (PR #1938, P2, re-scoped for the Go-default cutover,
  # CHAOS-3088): this service is unconditional (no profile) like the rest of
  # the Go fleet below. Go-default now means go-worker-heavy actually runs
  # (`deploy.replicas: 1`) on a bare `docker compose up`, so this keeps its
  # own pre-existing implicit default (no `deploy:` key -- one replica) to
  # match: an idle metrics-api would be a real waste, but a go-worker-heavy
  # that cannot reach its bridge target at all is worse.
  metrics-api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: api
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    container_name: dev-health-metrics-api
    command: |
      --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *env
    # CHAOS-4351: same pids formula as `api` above (see that block's
    # comment) -- this container runs the identical worker_metrics_runner
    # spawn path, so it needs the identical ceiling.
    pids_limit: ${DEV_HEALTH_API_PIDS_LIMIT:-256}
    # CHAOS-4351 (team-lead ruling): `api` has no explicit mem_limit in
    # this dev-stack file today -- 2g is a stated, not measured, ceiling
    # (see the ticket's own ENDGAME step 6 for a real peak measurement).
    # The point of the split is that a bridge OOM (CHAOS-4264/4350) can no
    # longer take `api` down with it, so this container needs SOME
    # explicit bound even though its sibling doesn't have one yet.
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    # CHAOS-4351 (team-lead ruling): local-only exposure for direct
    # debugging -- prod's compose.production.yml deliberately has NO
    # `ports:` here (internal DNS only is the "no public route").
    ports:
      - "8020:8000"
    volumes:
      - ./:/app
    working_dir: /app
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8000/ready" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  billing-edge:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: api
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    container_name: dev-health-billing-edge
    entrypoint:
      - python
      - -m
      - uvicorn
    command:
      - dev_health_ops.api.billing_edge:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src/dev_health_ops/api
    environment:
      <<: *env
      POSTGRES_URI: "postgresql+asyncpg://postgres:postgres@pgbouncer:6432/postgres"
      AUTO_RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    ports:
      - "8010:8000"
    volumes:
      - ./:/app
    working_dir: /app
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8000/ready" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # ARCHIVED (CHAOS-4164, 2026-08-23; gated CHAOS-3088): Python/Celery worker
  # fleet.
  #
  # Go owns every current production job and schedule; every Python Celery
  # worker and Beat service was stopped in production 2026-08-19 (CHAOS-4026).
  # The five services below are NOT live topology -- kept defined, not
  # deleted, for local-dev parity and historical reference only (see
  # docs/operate/configure/workers-and-schedules.md#historical-celery-topology-dormant).
  # Go equivalents: worker/worker-heavy -> go-worker-sync, go-worker-sync-provider,
  # go-worker-heavy, go-worker-ops; beat -> go-scheduler; the outbox relay
  # these depended on -> go-reconciler. Do not bring one of these back up to
  # diagnose a live incident: it has no consumers wired to current queues and
  # no operator has kept its routing current since the cutover.
  #
  # CHAOS-3088: a bare `docker compose up -d` from this file used to start
  # these five unconditionally -- the comment above was explicitly "not a
  # guard." It now is one: `profiles: [celery-legacy]` on `worker` below
  # (inherited by every sibling through `<<: *worker-base`) means a default
  # `up` starts none of them; the Go fleet after this block is the
  # unconditional default instead. Opt in with `--profile celery-legacy` to
  # bring the archived fleet back for local-dev parity or historical
  # reference. This still differs from the production/swarm compose files,
  # which carry their own, separately-tracked archival note
  # (compose.production.yml's ARCHIVED comment) and are not gated by this
  # change.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Celery workers — split topology (CHAOS-2278) [historical rationale]
  #
  # One shared pool let ~250s blocking stream consumers (ingest) and
  # multi-minute syncs starve latency-sensitive work (Sync Now, webhooks)
  # for hours. Three pools isolate the workload classes:
  #   worker        — latency-sensitive: default,sync,sync.<provider>,webhooks,reports
  #                     (per-provider sync queues, CHAOS-2299)
  #   worker-ingest — blocking stream consumers, isolated at concurrency 1
  #   worker-heavy  — long batch jobs: metrics,backfill
  # `monitoring` (queue-depth telemetry) is consumed by BOTH worker and
  # worker-heavy so telemetry survives one pool flooding (CHAOS-2299).
  # ---------------------------------------------------------------------------
  worker: &worker-base
    profiles: [celery-legacy]
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: runner
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    container_name: worker
    entrypoint: ["celery"]
    command: -A dev_health_ops.workers.celery_app worker --loglevel=info --disable-prefetch -Q default,sync,sync.github,sync.gitlab,sync.linear,sync.jira,sync.launchdarkly,sync.github.light,sync.github.medium,sync.gitlab.light,sync.gitlab.medium,sync.jira.medium,sync.linear.medium,webhooks,reports,scheduler,monitoring --concurrency=${WORKER_CONCURRENCY:-4}
    environment:
      <<: *env
      CELERY_BROKER_URL: redis://valkey:6379/0
      CELERY_RESULT_BACKEND: redis://valkey:6379/0
      AUTO_RUN_MIGRATIONS: "false"
      # Email (Resend) — worker sends billing emails via Celery task
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@example.com}
    depends_on:
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    volumes:
      - ./:/app
    working_dir: /app

  worker-ingest:
    <<: *worker-base
    container_name: worker-ingest
    command: -A dev_health_ops.workers.celery_app worker --loglevel=info --disable-prefetch -Q ingest --concurrency=1

  # CHAOS-2693 D8/master-spec CC11: dedicated queue/container, not folded
  # into worker-ingest -- external-ingest is customer-facing (spiky,
  # potentially larger batches) and must not share throughput with an
  # unrelated internal consumer backlog, nor vice versa.
  # DEPLOYMENT INVARIANT: exactly ONE replica at --concurrency=1. The
  # reclaim/redelivery design (StreamConsumer.enable_reclaim,
  # reclaim_idle_ms=900_000) assumes a single logical consumer identity
  # draining the PEL; scaling replicas requires revisiting reclaim
  # semantics first. tests/test_compose_config.py asserts this flag shape.
  worker-external-ingest:
    <<: *worker-base
    container_name: worker-external-ingest
    command: -A dev_health_ops.workers.celery_app worker --loglevel=info --disable-prefetch -Q external-ingest --concurrency=1

  worker-heavy:
    <<: *worker-base
    container_name: worker-heavy
    # `monitoring` is consumed here AND by `worker` above: queue telemetry
    # survives either pool being saturated or down.
    command: -A dev_health_ops.workers.celery_app worker --loglevel=info --disable-prefetch -Q metrics,backfill,scheduler,monitoring,sync.github.heavy,sync.gitlab.heavy --concurrency=${WORKER_HEAVY_CONCURRENCY:-2}

  beat:
    <<: *worker-base
    container_name: beat
    command: -A dev_health_ops.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  # ---------------------------------------------------------------------------
  # Go/River workers (CHAOS-3142) -- the unconditional default as of
  # CHAOS-3088. No `profiles:` here, unlike the archived Celery fleet above:
  # this is the fleet a bare `docker compose up -d` now actually runs,
  # folded in from deploy/docker-compose/compose.go-workers.yml (kept there
  # too, for compose.production.yml's separate overlay path, still at its
  # own `replicas: 0` -- unaffected by this PR). The nine long-running
  # worker/reconciler/scheduler/stream processes below run at
  # `deploy.replicas: 1` each (chris 23:30Z: one each is the intended
  # shape) -- CHAOS-3087's deployment.json still declares every process
  # `enabled_by_default: false` / `desired_replicas: 0` (a deliberate,
  # out-of-scope-for-this-PR gap: see this PR's RISK-NOTES and the tracked
  # follow-up ticket). The one-shot setup chain (go-river-provision/
  # go-river-migrate/go-contractcheck) is unaffected: `restart: "no"`, no
  # `deploy:` block, runs to completion once per `up` regardless.
  # ---------------------------------------------------------------------------

  # The canonical Python migrate service (above) owns Alembic and
  # ClickHouse. Re-run role provisioning only after it completes so guarded
  # grants see every current semantic table, including an already
  # initialized local volume.
  go-river-provision:
    # codex review (r2, P2): `image: ${DEV_HEALTH_IMAGE:-ghcr.io/your-org/...}`
    # is an unpullable placeholder (confirmed: `docker compose run --pull
    # never` fails "No such image") -- fine for a production renderer where
    # an operator always sets DEV_HEALTH_IMAGE, wrong as this file's local
    # default. This service's own comment above says it needs "the Ops
    # runtime image... not a bare postgres client image" -- that is exactly
    # what `worker`'s own build block below produces locally; build it the
    # same way instead of assuming a registry pull.
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: runner
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      # codex review (r1, P1): the root `postgres` service above creates the
      # superuser identity postgres/postgres/postgres (container_name:
      # postgres, lines ~97-102) -- NOT a `devhealth` role or database.
      # (A)'s defaults assumed compose.production.yml's postgres identity,
      # which this file does not share. Match `migrate`'s own
      # POSTGRES_URI default (line ~252) instead of inventing a second
      # convention.
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_DOMAIN_DATABASE_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}
      RIVER_QUEUE_DATABASE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        exec psql \
          --host="${POSTGRES_HOST:-postgres}" \
          --username="${POSTGRES_USER:-postgres}" \
          --dbname="${POSTGRES_DB:-postgres}" \
          --set=domain_role="$$RIVER_DOMAIN_DATABASE_ROLE" \
          --set=queue_role="$$RIVER_QUEUE_DATABASE_ROLE" \
          --set=coordinator_role="$$RIVER_COORDINATOR_DATABASE_ROLE" \
          --set=domain_password="$$RIVER_DOMAIN_DATABASE_PASSWORD" \
          --set=queue_password="$$RIVER_QUEUE_DATABASE_PASSWORD" \
          --set=coordinator_password="$$RIVER_COORDINATOR_DATABASE_PASSWORD" \
          --file=/usr/local/share/dev-health/provision_river_roles.sql
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Apply the pinned River bundle with the elevated local/admin DSN, then
  # independently check that the resulting schema is current. Neither DSN
  # nor this binary is exposed to a long-running Go service.
  go-river-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        if [ -z "$$MIGRATION_DATABASE_URI" ];
        then export MIGRATION_DATABASE_URI="postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@$$POSTGRES_HOST:5432/$$POSTGRES_DB";
        fi;
        dev-health-worker-migrate
        && dev-health-worker-migrate --check
    environment:
      MIGRATION_DATABASE_URI: ${GO_WORKER_MIGRATION_DATABASE_URI:-}
      # codex review (r1, P1): same fix as go-river-provision above -- the
      # root `postgres` service's superuser identity is postgres/postgres,
      # not `devhealth`.
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
    depends_on:
      go-river-provision:
        condition: service_completed_successfully

  # Validate the exact checked-in job registry and worker manifest before
  # Compose is allowed to start any long-running Go process.
  go-contractcheck:
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: contractcheck
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    command: [validate]
    depends_on:
      go-river-migrate:
        condition: service_completed_successfully

  go-worker-heavy: &go-worker
    # codex review (r3 -- team-lead): a bare `docker compose up` built
    # go-river-provision/migrate locally but PULLED this image, so migrate
    # and the worker fleet could come from different trees and
    # CHAOS-5437's posture-manifest digest lockstep refuses readiness by
    # design, deterministically, on every from-scratch bring-up -- proven
    # by the readyz proof in TEST-EVIDENCE. `build:` makes this file build
    # the same tree's image by default, same as every other Go service
    # here; `image:` stays so `DEV_HEALTH_GO_WORKER_IMAGE` can still pin an
    # already-published tag instead (compose only rebuilds when that tag
    # isn't already present locally).
    image: ${DEV_HEALTH_GO_WORKER_IMAGE:-ghcr.io/full-chaos/dev-health-go-worker:latest}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: worker
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: heavy
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    command:
      - --queues=investment,metrics,reports,workgraph
      - --queue-concurrency=investment=1,metrics=2,reports=2,workgraph=1
      - --worker-group=heavy
      - --shutdown-timeout=7260s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url-heavy
      - *flag-bridge-insecure
      - *flag-log-level
    environment: &go-worker-env
      <<: *go-worker-env-base
    stop_grace_period: 7260s
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      # codex review (r2, P1): every go-* service reads POSTGRES_URI
      # (domain) and WORKER_DATABASE_URI (queue-control) from
      # go-worker-env-base -- gate on both poolers' healthchecks, not just
      # container-started, so a worker doesn't attempt its first connection
      # before the pooler it targets can actually serve one.
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
      # this group's --operational-bridge-url points at metrics-api, a
      # separate service with no other dependency edge into it -- gating on
      # its healthcheck (not just container-started) means this worker
      # doesn't start dispatching metrics/workgraph jobs before the bridge
      # target can actually answer them.
      metrics-api:
        condition: service_healthy
    deploy: &go-worker-resources
      replicas: 1
      resources:
        limits: {cpus: "1.0", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}

  go-worker-ops:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: ops
    command:
      - --queues=coverage,heartbeat,retention,webhooks
      - --queue-concurrency=coverage=1,heartbeat=1,retention=1,webhooks=4
      - --worker-group=ops
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    # Explicit override (not a merge): the shared &go-worker anchor's own
    # depends_on includes metrics-api (needed by go-worker-heavy only). This
    # service does not touch the metrics queue, so it does not inherit that
    # dependency.
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  # This worker group selects both registered sync queues. Its queue set is
  # a group choice, not a runtime profile.
  go-worker-sync:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: sync
    command:
      - --queues=sync
      - --queue-concurrency=sync=4
      - --worker-group=sync
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  # sync_provider is its own process, exactly as the Celery fleet splits
  # worker-ingest and worker-heavy out by queue. It is NOT fused into the
  # sync worker above: startup validation requires selected queues to equal
  # CONSTRUCTED queues, and buildProviderSyncWorker constructs nothing while
  # every provider route is default-off (CHAOS-3926).
  go-worker-sync-provider:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: sync-provider
    command:
      - --queues=sync_provider
      - --queue-concurrency=sync_provider=2
      - --worker-group=sync-provider
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  go-reconciler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_RECONCILER_IMAGE:-ghcr.io/full-chaos/dev-health-go-reconciler:latest}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: reconciler
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: reconciler
    # CHAOS-3092 made "no Celery consumer serves provider units" true of
    # every deployment, which is exactly the assertion SweepModeActive
    # encodes -- so the sweep ships ACTIVE rather than as an operator
    # opt-in. A FLAG, not an environment entry: only credentials render
    # through `environment:`, every other setting is visible in `command:`.
    command:
      - --shutdown-timeout=60s
      - --unreclaimable-sweep=${SYNC_UNRECLAIMABLE_SWEEP:-active}
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s
    # Ported from the now-deleted deploy/go-workers/compose-go-workers.yml
    # (CHAOS-3142) rather than dropped: per-stage budgets and the
    # step-overrun watchdog (internal/syncreconciler) make the process stay
    # up and mark /readyz unhealthy when a stage is stuck; this healthcheck
    # is what turns that into a container status Docker can actually see
    # and restart on. The runtime image has no shell/curl/wget, so this
    # invokes the reconciler binary's own `healthcheck` subcommand
    # (cmd/dev-health-reconciler/main.go), which queries this same
    # container's own /readyz over loopback and mirrors that status as its
    # exit code. No other service in this fleet declares one to copy
    # interval/timeout/retries from -- these are this service's own.
    healthcheck:
      test: ["CMD", "/usr/local/bin/dev-health-reconciler", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  go-scheduler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_SCHEDULER_IMAGE:-ghcr.io/full-chaos/dev-health-go-scheduler:latest}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: scheduler
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: scheduler
    command:
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s

  go-stream-external:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: stream-runner
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: stream-external
    command:
      - --profile=external
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
      # codex review (r2, P1): not a River-queue consumer, no
      # coordinator-claim path -- neutralize the shared base's coordinator
      # wiring rather than inherit it (same pattern the bigboy overlay this
      # was folded from uses for its own stream services).
      COORDINATOR_DATABASE_URI: ""
    stop_grace_period: 60s

  go-stream-ingest:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: stream-runner
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: stream-ingest
    command:
      - --profile=ingest
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
      # codex review (r2, P1): not a River-queue consumer, no
      # coordinator-claim path -- neutralize the shared base's coordinator
      # wiring rather than inherit it (same pattern the bigboy overlay this
      # was folded from uses for its own stream services).
      COORDINATOR_DATABASE_URI: ""
    stop_grace_period: 60s

  # PagerDuty webhook delivery is independently routable from dataset sync,
  # so it runs as its own stream family rather than sharing the external
  # runner.
  go-stream-pagerduty:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: stream-runner
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: stream-pagerduty
    command:
      - --profile=pagerduty
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
      # codex review (r2, P1): not a River-queue consumer, no
      # coordinator-claim path -- neutralize the shared base's coordinator
      # wiring rather than inherit it (same pattern the bigboy overlay this
      # was folded from uses for its own stream services).
      COORDINATOR_DATABASE_URI: ""
    stop_grace_period: 60s

  # ---------------------------------------------------------------------------
  # Observability — SigNoz (distributed tracing + metrics)
  # ---------------------------------------------------------------------------
  # Run SigNoz separately from its own compose file:
  #   git clone https://github.com/SigNoz/signoz.git && cd signoz/deploy
  #   docker compose -f docker/clickhouse-setup/docker-compose.yaml up -d
  #
  # Then connect this stack to SigNoz's network:
  #   docker network connect clickhouse-setup_default dev-health-api
  #
  # UI:         http://localhost:8080  (from SigNoz stack)
  # OTLP gRPC:  signoz-otel-collector:4317
  # OTLP HTTP:  signoz-otel-collector:4318
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Observability — BugSink (error tracking / Sentry-compatible)
  # ---------------------------------------------------------------------------
  # Web UI: http://localhost:8800
  # Single container, uses the existing postgres (database: bugsink).
  # Set SENTRY_DSN to a project DSN from the BugSink UI to enable error
  # reporting — the Sentry SDK sends events to BugSink transparently.
  # ---------------------------------------------------------------------------
  bugsink:
    image: bugsink/bugsink:latest
    container_name: bugsink
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/bugsink"
      SECRET_KEY: ${BUGSINK_SECRET_KEY:?BUGSINK_SECRET_KEY must be set}
      BASE_URL: ${BUGSINK_BASE_URL:-http://localhost:8800}
      PORT: "8000"
      CREATE_SUPERUSER: ${BUGSINK_CREATE_SUPERUSER:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8800:8000"
