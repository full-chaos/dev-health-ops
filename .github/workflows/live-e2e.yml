name: Live Backend E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]
  merge_group:
  workflow_dispatch:


concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed):
  # canonical fleet-wide shape -- group by PR number on pull_request, by
  # ref on a push to a non-main branch, by commit sha on a push to main or
  # on merge_group (a commit sha never collides with another commit's, so
  # main pushes and merge_group entries are never cancelled -- see
  # go.yml/typecheck.yml/docker-images.yml/arc-runner-image.yml for the
  # specific incidents this protects). cancel-in-progress cancels a stale
  # PR re-push and a stale non-main branch push only.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  changes:
    # Routed to the self-hosted ARC pool while GitHub-hosted dispatch is
    # stalled (org plan change, 2026-09-04; chris ruling 16:54 PDT). Flip the
    # repo variable SELF_HOSTED_RUNNERS back to 'disabled' to restore the
    # hosted runner with no code change. Fork PRs always stay hosted -- same
    # safety condition as go.yml's dual-leg jobs. (live-e2e below is not a
    # required context and is left otherwise untouched; it shares this job.)
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # Always run on workflow_dispatch
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'ci/**'
              - 'migrations/**'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'alembic.ini'
              - 'Makefile'
              - 'scripts/**'
              # CHAOS-4266 codex review: metrics-executed-proof builds and
              # runs the Go worker/reconciler/migrate binaries, so a Go-only
              # change (worker dispatch, daily/remaining metrics, job
              # contracts) must trigger it -- without these, this filter
              # reported code=false for exactly the surfaces this gate
              # exists to protect, and the job silently skipped.
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'contracts/jobs/**'
              - '.github/workflows/live-e2e.yml'

  live-e2e:
    needs: [changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Live E2E needs package read access for dependency installs.
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: ghcr.io/full-chaos/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        # The runner pulls a service image BEFORE the first step, so no
        # `docker/login-action` step can authenticate it -- GitHub requires
        # credentials on the declaration itself. GITHUB_TOKEN reads the mirror.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      clickhouse:
        image: ghcr.io/full-chaos/clickhouse/clickhouse-server:26.7
        # The runner pulls a service image BEFORE the first step, so no
        # `docker/login-action` step can authenticate it -- GitHub requires
        # credentials on the declaration itself. GITHUB_TOKEN reads the mirror.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: ch
          CLICKHOUSE_PASSWORD: ch
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user ch --password ch --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5

      valkey:
        image: ghcr.io/full-chaos/valkey/valkey:8-alpine
        # The runner pulls a service image BEFORE the first step, so no
        # `docker/login-action` step can authenticate it -- GitHub requires
        # credentials on the declaration itself. GITHUB_TOKEN reads the mirror.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run live-e2e tier
        env:
          DISABLE_DOTENV: "1"
          DATABASE_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          CLICKHOUSE_URI: clickhouse://ch:ch@localhost:8123/default
          POSTGRES_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER: "1"
          REDIS_URL: redis://localhost:6379/0
          LIVE_E2E_FIXTURE_SEED: "20260219"
          LIVE_E2E_API_LOG_FILE: ./live-e2e-api.log
          ENVIRONMENT: test
          # No OTLP collector in CI; OTEL on floods logs with localhost:4317
          # export retries. We don't assert OTEL stats in CI.
          OTEL_ENABLED: "false"
        run: |
          chmod +x ci/run_tests.sh ci/run_live_backend_e2e.sh
          ./ci/run_tests.sh live-e2e

      - name: Upload live-e2e API logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-e2e-api-logs
          path: live-e2e-api.log
          if-no-files-found: ignore

  # CHAOS-4266: executed-proof gate for the metrics family. Deliberately a
  # SEPARATE job from `live-e2e` above, not another stage of it: that job's
  # `--with-metrics` fixture path writes derived metric rows directly into
  # ClickHouse and is FIXTURE-BACKED, not pipeline proof (see the comments on
  # its fixture-generation and /api/v1/home steps). This job seeds real
  # source rows through the real sync path, lets the real Go worker +
  # reconciler process the resulting post-sync fanout, then asserts rows
  # landed in ClickHouse for the seeded org's live repo ids.
  #
  # RED ON MAIN TODAY, ON PURPOSE: CHAOS-4263 (daily_metrics_partitions built
  # from the wrong id space) means this job currently fails with
  # zero_rows_with_source_data for every family. It goes green once
  # CHAOS-4263 merges. Do not mark it a required check before that -- see the
  # PR's RISK-NOTES.
  metrics-executed-proof:
    needs: [changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    # Same ARC routing as `changes` above.
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    # CHAOS-5025: normal duration is ~6 min; one run hung with no output for
    # ~6h until GitHub's default job timeout finally cancelled it. Bound the
    # job explicitly so a recurrence fails fast instead of burning the full
    # 360-minute default.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: ghcr.io/full-chaos/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        # The runner pulls a service image BEFORE the first step, so no
        # `docker/login-action` step can authenticate it -- GitHub requires
        # credentials on the declaration itself. GITHUB_TOKEN reads the mirror.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      clickhouse:
        image: ghcr.io/full-chaos/clickhouse/clickhouse-server:26.7
        # The runner pulls a service image BEFORE the first step, so no
        # `docker/login-action` step can authenticate it -- GitHub requires
        # credentials on the declaration itself. GITHUB_TOKEN reads the mirror.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: ch
          CLICKHOUSE_PASSWORD: ch
        ports:
          - 8123:8123
          # Native wire protocol: the Go worker/reconciler connect here, not
          # 8123 (that's Python's clickhouse-connect HTTP port). Pointed at
          # 8123 the Go client fails immediately with "ClickHouse readiness
          # check failed" -- verified by hand, and documented in
          # deploy/go-workers/README.md.
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user ch --password ch --query 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 5

      valkey:
        image: ghcr.io/full-chaos/valkey/valkey:8-alpine
        # The runner pulls a service image BEFORE the first step, so no
        # `docker/login-action` step can authenticate it -- GitHub requires
        # credentials on the declaration itself. GITHUB_TOKEN reads the mirror.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure self-hosted Go cache paths
        # CHAOS-4906: the oci-arc-runners pool exports GOMODCACHE/GOCACHE to a
        # SHARED hostPath (unlike a GitHub-hosted runner's ephemeral per-job
        # filesystem), same as go.yml's self-hosted legs. Only set on the
        # self-hosted leg; the hosted leg keeps setup-go's normal cache.
        if: vars.SELF_HOSTED_RUNNERS == 'enabled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          echo "GOMODCACHE=/mnt/go-cache/mod" >> "${GITHUB_ENV}"
          echo "GOCACHE=/mnt/go-cache/build" >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
          # `false` on the self-hosted leg: setup-go's own cache defaults to
          # `true`, which would restore/save a GitHub Actions cache tarball
          # into the pool's persistent, concurrently-shared hostPath above --
          # a corruption risk against other jobs reading/writing it at the
          # same time (same reasoning as go.yml's self-hosted legs).
          cache: ${{ !(vars.SELF_HOSTED_RUNNERS == 'enabled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run metrics executed-proof
        id: metrics-proof
        env:
          DISABLE_DOTENV: "1"
          OTEL_ENABLED: "false"
          # Workspace-relative, not under TMP_DIR: the script's own cleanup()
          # trap rm -rf's TMP_DIR on exit, before this job's own "Upload logs"
          # step runs -- logs left only there are already gone by upload time
          # (codex review, CHAOS-4266; confirmed on the first live CI run).
          # Mirrors LIVE_E2E_API_LOG_FILE in the live-e2e job above.
          METRICS_PROOF_API_LOG_FILE: ./metrics-executed-proof-api.log
          METRICS_PROOF_WORKER_LOG_FILE: ./metrics-executed-proof-worker.log
          METRICS_PROOF_RECONCILER_LOG_FILE: ./metrics-executed-proof-reconciler.log
          METRICS_PROOF_SUMMARY_JSON_FILE: ./metrics-executed-proof-family-summary.json
        run: |
          chmod +x ci/run_metrics_executed_proof.sh
          ./ci/run_metrics_executed_proof.sh

      - name: Upload metrics-executed-proof logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metrics-executed-proof-logs
          path: |
            metrics-executed-proof-api.log
            metrics-executed-proof-worker.log
            metrics-executed-proof-reconciler.log
            metrics-executed-proof-family-summary.json
          if-no-files-found: ignore
