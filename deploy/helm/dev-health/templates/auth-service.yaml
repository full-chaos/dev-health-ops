{{- /*
The Auth Control Plane service (CHAOS-4886, Wave 1 of CHAOS-3274): `auth-service`
from the auth-service image (docker/go-worker.Dockerfile target `auth-service`).
DORMANT: the API listener mounts no route, no production token is issued, and
nothing routes to it. Defaults off (authService.phase 0); phase 1 runs it dark, and phase 0 again has
no effect on the current auth authority.

Two listeners, never one: the API listener (authService.port) carries requests,
the operator listener (authService.operatorPort) carries /healthz, /readyz and
/metrics. Probes target the operator port. /readyz fails CLOSED on the
`postgres` and `signing_key` checks, re-run on every request.

Secrets are referenced, never created here (see values.yaml). The runtime DSN
reaches the container by secretKeyRef; the signing key reaches it only as a
file (a direct-value AUTH_SIGNING_KEY is rejected by the service,
ACP-ADR-02 §4). The key's custody contract (O_NOFOLLOW, regular file, no
group/world mode bit) cannot be met by mounting the Secret straight into the
container -- see authService.signingKey.stagingImage in values.yaml for why the
stage-signing-key init container exists.
*/ -}}
{{- /* Every auth check that must hold whatever the phase and whatever goApi.enabled, queryApi.enabled and the other enable flags say: one helper, included here once. This file always renders (only its documents are gated), so the include always runs. */}}
{{- include "dev-health.authValidate" . }}
{{- $eddsaIssuer := include "dev-health.authEdDSAIssuer" . }}
{{- $linkRoutes := eq (include "dev-health.authBool" (dict "value" .Values.authService.socialLinkRoutes "key" "authService.socialLinkRoutes")) "true" }}
{{- if eq (include "dev-health.authOn" (dict "flag" "service" "context" .)) "true" }}
{{- $a := .Values.authService }}
{{- include "dev-health.authConnectionBudget" . }}
{{- $loginOn := eq (include "dev-health.authOn" (dict "flag" "localLogin" "context" .)) "true" }}
{{- $socialOn := eq (include "dev-health.authOn" (dict "flag" "social" "context" .)) "true" }}
{{- $tokenClass := (default dict $a.accessToken).class | default "" }}
{{- if and $loginOn (not (trim (toString $a.sessionKeys.loginLockout.secretName))) }}{{- fail "authService.phase >= 3 (login) needs authService.sessionKeys.loginLockout.secretName: without the lockout key auth-service mounts no login route, and go-api would forward sign-in to a 404" }}{{- end }}
{{- if and $socialOn (not (trim (toString $a.social.secretName))) }}{{- fail "authService.phase >= 3 (social sign-in) needs authService.social.secretName: the Secret with the SOCIAL_<PROVIDER>_CLIENT_ID and _CLIENT_SECRET keys go-api reads, so auth-service signs in with the same providers" }}{{- end }}
{{- if not $a.database.secretName }}{{- fail "authService.database.secretName is required: the Secret holding the runtime login's DSN (key authService.database.secretKey)" }}{{- end }}
{{- if and $a.sessionKeys.successor.secretName (not $a.valkey.secretName) }}{{- fail "authService.valkey.secretName is required while authService.sessionKeys.successor.secretName is set: the session routes count the compatibility refresh in the shared rate-limit store, and an in-process limiter is per replica and so no limit" }}{{- end }}
{{- if and (eq (include "dev-health.authProxyOn" .) "true") (not $a.trustedProxies) }}{{- fail "authService.trustedProxies is required while go-api forwards auth routes to it (authService.phase >= 2): without it every proxied caller is keyed by go-api's pod address, one rate-limit bucket for all users" }}{{- end }}
{{- if and (eq (include "dev-health.authProxyOn" .) "true") $a.networkPolicy.allowedFrom }}{{- fail "authService.networkPolicy.allowedFrom must be empty while go-api forwards auth routes to it (authService.phase >= 2): the API port admits go-api only while go-api forwards to it, because auth-service trusts the forwarded client address from that peer set" }}{{- end }}
{{- if and (eq (include "dev-health.authProxyOn" .) "true") (not $a.networkPolicy.enabled) }}{{- fail "authService.networkPolicy.enabled must stay true while go-api forwards auth routes to it (authService.phase >= 2): trusted proxies are safe only while the auth-service NetworkPolicy admits go-api alone; turn the policy on, or go back to phase 1" }}{{- end }}
{{- $trusted := list }}
{{- $excluded := list }}
{{- range $a.trustedProxies }}
{{- $entry := toString . }}
{{- if hasPrefix "!" $entry }}
{{- $addr := trimPrefix "!" $entry }}
{{- if or (contains "/" $addr) (contains ":" $addr) (not (include "dev-health.trustedProxyEntry" $addr)) }}{{- fail (printf "authService.trustedProxies exclusion entries must each be \"!\" and one IPv4 address, never a network, an IPv6 or an IPv4-mapped address: %q is not" $entry) }}{{- end }}
{{- $excluded = append $excluded $addr }}
{{- else }}
{{- if or (not (include "dev-health.trustedProxyEntry" $entry)) (regexMatch "/0$" $entry) (regexMatch "^(?i)::ffff:" $entry) }}{{- fail "authService.trustedProxies entries must each be one IP address or CIDR network, never a /0 network or an IPv4-mapped form: a trusted peer picks the client address of every request" }}{{- end }}
{{- if contains "/" $entry }}
{{- $bits := int (index (splitList "/" $entry) 1) }}
{{- $v6 := contains ":" $entry }}
{{- if or (and (not $v6) (lt $bits 24)) (and $v6 (lt $bits 64)) }}{{- fail (printf "authService.trustedProxies entry %q is wider than a /24 (IPv4) or a /64 (IPv6): the node pod range is the widest list allowed, even with authService.trustedProxiesWideAccepted" $entry) }}{{- end }}
{{- if and $v6 (lt $bits 124) }}{{- fail (printf "authService.trustedProxies entry %q is an IPv6 network wider than a /124: the render cannot name its node exclusions, so authService.trustedProxiesWideAccepted does not allow it; list the go-api pod addresses" $entry) }}{{- end }}
{{- if and (lt $bits 28) (ne (toString $a.trustedProxiesWideAccepted) "true") }}{{- fail (printf "authService.trustedProxies entry %q is wider than a /28 (IPv4) or a /124 (IPv6): every address in it is believed as a proxy that names the client. It is allowed only with authService.trustedProxiesWideAccepted=true, with its node exclusions beside it, and only while the auth-service NetworkPolicy admits go-api's pods alone on the API port; prefer the go-api pod addresses" $entry) }}{{- end }}
{{- end }}
{{- $trusted = append $trusted $entry }}
{{- end }}
{{- end }}
{{- /* An exclusion mirrors clientaddr.ParseTrust: inside a listed network, never also listed as an address. IPv4 only, so the render can check it. */}}
{{- range $x := $excluded }}
{{- if has $x $trusted }}{{- fail (printf "authService.trustedProxies exclusion entries must not name an address the list also trusts: \"!%s\"" $x) }}{{- end }}
{{- $xv := int (include "dev-health.ipv4Int" $x) }}
{{- $inside := false }}
{{- range $trusted }}
{{- if and (contains "/" .) (not (contains ":" .)) }}
{{- $parts := splitList "/" . }}
{{- $nv := int (include "dev-health.ipv4Int" (index $parts 0)) }}
{{- $size := 1 }}
{{- range until (int (sub 32 (int (index $parts 1)))) }}{{- $size = mul $size 2 }}{{- end }}
{{- if and (ge $xv $nv) (lt $xv (add $nv $size)) }}{{- $inside = true }}{{- end }}
{{- end }}
{{- end }}
{{- if not $inside }}{{- fail (printf "authService.trustedProxies exclusion entries must each lie inside a listed IPv4 network: \"!%s\" does not" $x) }}{{- end }}
{{- end }}
{{- /* CHAOS-11703: a wide IPv4 entry is the node pod range, which holds the node's own addresses (the network address, the bridge
at the next one). A host process or a hostNetwork pod reaches the API port from them, which the go-api pod selector does not stop. */}}
{{- range $trusted }}
{{- if and (contains "/" .) (not (contains ":" .)) (lt (int (index (splitList "/" .) 1)) 28) }}
{{- $net := index (splitList "/" .) 0 }}
{{- $o := splitList "." $net }}
{{- $bridge := printf "%s.%s.%s.%d" (index $o 0) (index $o 1) (index $o 2) (add1 (int (index $o 3))) }}
{{- if not (and (has $net $excluded) (has $bridge $excluded)) }}{{- fail (printf "authService.trustedProxies entry %q needs its node exclusions \"!%s\" and \"!%s\" in the same list: the range holds the node's own addresses, from which a host process or a hostNetwork pod reaches the API port past the go-api pod selector" . $net $bridge) }}{{- end }}
{{- end }}
{{- end }}
{{- $ks := $a.keySet }}
{{- $ksOn := and $ks $ks.enabled }}
{{- $manifest := "" }}
{{- if $ksOn }}
{{- /* Mirrors internal/auth/keystore (KeyIDPattern, State.Valid, bareFileName, MaxManifestBytes); auth_keyset_test.go ties the limits to that source. */}}
{{- if or $a.signingKey.secretName $a.signingKey.keyId }}{{- fail "authService.keySet replaces authService.signingKey: unset authService.signingKey.secretName and authService.signingKey.keyId while authService.keySet.enabled" }}{{- end }}
{{- if not $ks.keys }}{{- fail "authService.keySet.keys must list at least one key" }}{{- end }}
{{- $kids := dict }}
{{- $files := dict }}
{{- $entries := list }}
{{- $activeCount := 0 }}
{{- range $ks.keys }}
{{- if not (regexMatch "^[A-Za-z0-9._-]{1,64}$" (toString .kid)) }}{{- fail "authService.keySet.keys[].kid must match ^[A-Za-z0-9._-]{1,64}$" }}{{- end }}
{{- if not (has .state (list "pending" "active" "retiring" "retired" "compromised")) }}{{- fail "authService.keySet.keys[].state must be one of pending, active, retiring, retired, compromised" }}{{- end }}
{{- if or (not .file) (has (toString .file) (list "." "..")) (not (regexMatch "^[A-Za-z0-9._-]{1,255}$" (toString .file))) }}{{- fail "authService.keySet.keys[].file must be a bare name in the manifest directory, letters, digits, '.', '_' and '-' only" }}{{- end }}
{{- if eq .file "keyset.json" }}{{- fail "authService.keySet.keys[].file must not be keyset.json: that name is the manifest" }}{{- end }}
{{- if or (not .secretName) (not .secretKey) }}{{- fail (printf "authService.keySet.keys[] %s needs secretName and secretKey: a kid with no key file cannot be staged" .kid) }}{{- end }}
{{- if hasKey $kids .kid }}{{- fail "authService.keySet.keys[].kid must be unique" }}{{- end }}
{{- if hasKey $files .file }}{{- fail "authService.keySet.keys[].file must be unique" }}{{- end }}
{{- $_ := set $kids .kid true }}
{{- $_ := set $files .file true }}
{{- if eq .state "active" }}{{- $activeCount = add1 $activeCount }}{{- end }}
{{- $entries = append $entries (dict "kid" .kid "state" .state "file" .file) }}
{{- end }}
{{- if ne (int $activeCount) 1 }}{{- fail "authService.keySet.keys: exactly one key must be active" }}{{- end }}
{{- $manifest = dict "keys" $entries | toJson }}
{{- if gt (len $manifest) 16384 }}{{- fail "authService.keySet manifest is larger than 16 KiB, the service limit" }}{{- end }}
{{- else }}
{{- if not $a.signingKey.secretName }}{{- fail "authService.signingKey.secretName is required: the Secret holding the Ed25519 PKCS#8 PEM signing key (key authService.signingKey.secretKey)" }}{{- end }}
{{- if not $a.signingKey.keyId }}{{- fail "authService.signingKey.keyId is required: every signing key carries a kid and a JWKS entry from day one (ACP-ADR-02 §5)" }}{{- end }}
{{- end }}
{{- if eq (int $a.port) (int $a.operatorPort) }}{{- fail "authService.port and authService.operatorPort must differ: the operator surface is never exposed on the API port" }}{{- end }}
{{- /*
CHAOS-11648: the old auth-service pod keeps serving while its endpoint is removed. kubelet sends SIGTERM
and the endpoint removal in parallel, so a login that reached the pod in the SIGTERM second was cut. preStop
runs BEFORE SIGTERM and counts inside terminationGracePeriodSeconds, so the grace must cover the sleep, the
shutdown timeout the chart passes (--shutdown-timeout) and 5 s. The image is distroless (no shell, no sleep
binary): the native sleep action, a Kubernetes >= 1.30 feature. Same shape as go-api (CHAOS-10718).
*/}}
{{- /* Bounded BEFORE any arithmetic: Sprig's add wraps near int64 max. */}}
{{- $sleepRaw := toString $a.drain.preStopSeconds }}
{{- if not (regexMatch "^[0-9]{1,3}$" $sleepRaw) }}{{- fail (printf "authService.drain.preStopSeconds must be whole seconds from 0 to 600 (0 renders no drain hook), got %q" $sleepRaw) }}{{- end }}
{{- if gt (int $sleepRaw) 600 }}{{- fail (printf "authService.drain.preStopSeconds must be whole seconds from 0 to 600 (0 renders no drain hook), got %q" $sleepRaw) }}{{- end }}
{{- $shutdownRaw := toString $a.shutdownTimeout }}
{{- /* The service parser's bound (authconfig minShutdownTimeout 500ms, maxShutdownTimeout 10m): a longer value renders but the pod then fails at start. */}}
{{- if not (regexMatch "^[1-9][0-9]{0,2}s$" $shutdownRaw) }}{{- fail (printf "authService.shutdownTimeout must be whole seconds from 1s to 600s (the service refuses more than 10 m), got %q" $shutdownRaw) }}{{- end }}
{{- if gt (int (trimSuffix "s" $shutdownRaw)) 600 }}{{- fail (printf "authService.shutdownTimeout must be whole seconds from 1s to 600s (the service refuses more than 10 m), got %q" $shutdownRaw) }}{{- end }}
{{- $graceRaw := toString $a.terminationGracePeriodSeconds }}
{{- if not (regexMatch "^[1-9][0-9]{0,5}$" $graceRaw) }}{{- fail (printf "authService.terminationGracePeriodSeconds must be whole seconds from 1 to 86400, got %q" $graceRaw) }}{{- end }}
{{- if gt (int $graceRaw) 86400 }}{{- fail (printf "authService.terminationGracePeriodSeconds must be whole seconds from 1 to 86400, got %q" $graceRaw) }}{{- end }}
{{- $sleep := int $sleepRaw }}
{{- $shutdown := int (trimSuffix "s" $shutdownRaw) }}
{{- $minGrace := add $sleep $shutdown 5 }}
{{- if lt (int $graceRaw) $minGrace }}
{{- fail (printf "authService.terminationGracePeriodSeconds=%s is below authService.drain.preStopSeconds (%d) + authService.shutdownTimeout (%d) + 5 = %d: kubelet counts the preStop hook inside the grace period and kills the pod when it ends, so the ordered shutdown would be cut" $graceRaw $sleep $shutdown $minGrace) }}
{{- end }}
{{- range $a.extraArgs }}
{{- if has (regexSplit "[=[:space:]]" (trimAll "-" (lower (trim (toString .)))) -1 | first) (list "signing-key-file" "signing-key-id" "signing-keyset-file" "database-max-conns" "shutdown-timeout") }}{{- fail (printf "authService.extraArgs must not set %s: the chart renders the signing key flags (authService.signingKey or authService.keySet) and the pool bound (authService.database.maxConns), and authService.shutdownTimeout owns --shutdown-timeout (the grace-period guard reads that value)" .) }}{{- end }}
{{- end }}
{{- if and $ksOn $a.podAnnotations (hasKey $a.podAnnotations "checksum/keyset") }}{{- fail "authService.podAnnotations must not set checksum/keyset: the chart sets it from the key-set manifest" }}{{- end }}
{{- if $a.tracing.enabled }}
{{- if not $a.tracing.endpoint }}{{- fail "authService.tracing.endpoint is required while authService.tracing.enabled: the service would otherwise export to localhost:4317" }}{{- end }}
{{- if not (regexMatch "^(0(\\.[0-9]+)?|1(\\.0+)?)$" (toString $a.tracing.sampleRate)) }}{{- fail (printf "authService.tracing.sampleRate must be a number from 0 to 1, got %q" (toString $a.tracing.sampleRate)) }}{{- end }}
{{- if and $a.networkPolicy.enabled (not $a.networkPolicy.egress.otlp.to) }}{{- fail "authService.networkPolicy.egress.otlp.to is required while authService.tracing.enabled and authService.networkPolicy.enabled: the auth pods get no other egress, so the spans would never leave the pod" }}{{- end }}
{{- range $a.networkPolicy.egress.otlp.to }}
{{- with (dig "ipBlock" "cidr" "" .) }}
{{- $problem := include "dev-health.otlpPeerCidrProblem" . }}
{{- if $problem }}{{- fail (printf "authService.networkPolicy.egress.otlp.to: ipBlock cidr %q is refused: %s. Name the collector's address (an IPv4 /8 to /32 or an IPv6 /32 to /128) or its pods" (toString .) $problem) }}{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $a.extraEnv }}
{{- if eq .name "AUTH_SERVICE_TRUSTED_PROXIES" }}{{- fail "authService.extraEnv must not set AUTH_SERVICE_TRUSTED_PROXIES: use authService.trustedProxies, which the render checks" }}{{- end }}
{{- if eq .name "AUTH_VALKEY_URI" }}{{- fail "authService.extraEnv must not set AUTH_VALKEY_URI: use authService.valkey, which reaches the container by secretKeyRef" }}{{- end }}
{{- if has .name (list "AUTH_JWT_SECRET_KEY" "AUTH_SESSION_SUCCESSOR_KEY") }}{{- fail (printf "authService.extraEnv must not set %s: use authService.sessionKeys, which reaches the container by secretKeyRef" .name) }}{{- end }}
{{- if eq (upper (trim .name)) "AUTH_USERS_OWNED" }}{{- fail "authService.extraEnv must not set AUTH_USERS_OWNED: authService.phase renders it, for the auth-migrate, grants and backfill Jobs too, so the write grant on public.users follows the switch" }}{{- end }}
{{- if eq (upper (trim .name)) "AUTH_SERVICE_SHUTDOWN_TIMEOUT" }}{{- fail "authService.extraEnv must not set AUTH_SERVICE_SHUTDOWN_TIMEOUT: authService.shutdownTimeout owns it, and the grace-period guard reads that value" }}{{- end }}
{{- if eq (upper (trim .name)) "AUTH_DATABASE_MAX_CONNS" }}{{- fail "authService.extraEnv must not set AUTH_DATABASE_MAX_CONNS: use authService.database.maxConns, which the render checks" }}{{- end }}
{{- if eq (upper (trim .name)) "AUTH_ORGS_OWNED" }}{{- fail "authService.extraEnv must not set AUTH_ORGS_OWNED: authService.phase renders it, for the backfill Job too" }}{{- end }}
{{- if has (upper (trim .name)) (list "AUTH_ACCESS_TOKEN_CLASS" "AUTH_TOKEN_ISSUER_URL" "AUTH_JWT_AUDIENCE") }}{{- fail (printf "authService.extraEnv must not set %s: use authService.accessToken, which go-api reads too" .name) }}{{- end }}
{{- if eq (upper (trim .name)) "AUTH_LOGIN_LOCKOUT_KEY" }}{{- fail "authService.extraEnv must not set AUTH_LOGIN_LOCKOUT_KEY: use authService.sessionKeys.loginLockout, which reaches the container by secretKeyRef" }}{{- end }}
{{- if eq (upper (trim .name)) "AUTH_SOCIAL_LINK_ROUTES" }}{{- fail "authService.extraEnv must not set AUTH_SOCIAL_LINK_ROUTES: use authService.socialLinkRoutes, which the render checks" }}{{- end }}
{{- if eq .name "AUTH_SIGNING_KEY" }}{{- fail "authService.extraEnv must not set AUTH_SIGNING_KEY: direct-value signing material is rejected by the service (ACP-ADR-02 §4); use authService.signingKey" }}{{- end }}
{{- if has (upper (trim (toString .name))) (include "dev-health.authServiceEnvNames" $ | fromJsonArray) }}{{- fail (printf "authService.extraEnv must not set %s: the chart renders it for auth-service, and a later entry would shadow the rendered value (a Secret reference included)" .name) }}{{- end }}
{{- if eq (lower (trim .name)) "auth_signing_keyset_file" }}{{- fail "authService.extraEnv must not set AUTH_SIGNING_KEYSET_FILE: the chart renders it (authService.keySet) or stages one signing key (authService.signingKey); the service refuses a key-set manifest beside a single key" }}{{- end }}
{{- if include "dev-health.secretLikeLiteralEnv" . }}{{- fail (printf "authService.extraEnv must not set %s as a literal value: the name looks like a secret, and a literal would put it in the manifest; reference it with valueFrom.secretKeyRef" .name) }}{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-health.fullname" . }}-auth-service
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "auth-service" "context" $) | nindent 4 }}
spec:
  replicas: {{ $a.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: {{ include "dev-health.authMaxSurge" . }}}
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "auth-service" "context" $) | nindent 6 }}
  template:
    metadata:
      {{- if or $a.podAnnotations $ksOn }}
      annotations:
        {{- with $a.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $ksOn }}
        checksum/keyset: {{ $manifest | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "auth-service" "context" $) | nindent 8 }}
        {{- if eq (include "dev-health.authOn" (dict "flag" "usersOwned" "context" $)) "true" }}
        dev-health.io/auth-users-owned: "true"
        {{- end }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      {{- include "dev-health.workloadServiceAccount" (dict "ctx" . "component" "auth-service" "cfg" .Values.authService.serviceAccount) | nindent 6 }}
      terminationGracePeriodSeconds: {{ $graceRaw }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: stage-signing-key
          image: {{ $a.signingKey.stagingImage.repository }}:{{ $a.signingKey.stagingImage.tag }}
          imagePullPolicy: {{ $a.signingKey.stagingImage.pullPolicy }}
          {{- if $ksOn }}
          command:
            - sh
            - -ec
            - |
              {{- range $ks.keys }}
              install -m 0400 {{ printf "/in/%s" .file | quote }} {{ printf "/out/%s" .file | quote }}
              {{- end }}
              install -m 0400 /in/keyset.json /out/keyset.json
          {{- else }}
          command: ["install", "-m", "0400", "/in/signing-key.pem", "/out/signing-key.pem"]
          {{- end }}
          volumeMounts:
            - {name: signing-key-source, mountPath: /in, readOnly: true}
            - {name: signing-key, mountPath: /out}
          resources:
            requests: {memory: "8Mi", cpu: "10m"}
            limits: {memory: "32Mi", cpu: "100m"}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: auth-service
          image: {{ include "dev-health.authServiceImage" . }}
          imagePullPolicy: {{ $a.image.pullPolicy }}
          {{- if gt $sleep 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $sleep }}
          {{- end }}
          args:
            - {{ printf "--http-addr=:%v" $a.port | quote }}
            - {{ printf "--operator-http-addr=:%v" $a.operatorPort | quote }}
            - {{ printf "--shutdown-timeout=%s" $shutdownRaw | quote }}
            - {{ printf "--database-schema=%s" (include "dev-health.authDatabaseSchema" .) | quote }}
            - {{ printf "--database-max-conns=%s" (include "dev-health.authMaxConns" .) | quote }}
            {{- if $ksOn }}
            - "--signing-keyset-file=/run/auth/signing/keyset.json"
            {{- else }}
            - "--signing-key-file=/run/auth/signing/signing-key.pem"
            - {{ printf "--signing-key-id=%s" $a.signingKey.keyId | quote }}
            {{- end }}
            {{- range $a.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $a.port }}
              protocol: TCP
            - name: operator
              containerPort: {{ $a.operatorPort }}
              protocol: TCP
          env:
            - name: AUTH_DATABASE_URI
              valueFrom: {secretKeyRef: {name: {{ $a.database.secretName | quote }}, key: {{ $a.database.secretKey | quote }}}}
          {{- if $a.sessionKeys.successor.secretName }}
            - name: AUTH_JWT_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.hs256SecretName" . | quote }}, key: "JWT_SECRET_KEY"}}
            - name: AUTH_SESSION_SUCCESSOR_KEY
              valueFrom: {secretKeyRef: {name: {{ $a.sessionKeys.successor.secretName | quote }}, key: {{ $a.sessionKeys.successor.secretKey | quote }}}}
          {{- end }}
          {{- if $loginOn }}
            - name: AUTH_LOGIN_LOCKOUT_KEY
              valueFrom: {secretKeyRef: {name: {{ $a.sessionKeys.loginLockout.secretName | quote }}, key: {{ $a.sessionKeys.loginLockout.secretKey | quote }}}}
          {{- end }}
          {{- if $socialOn }}
          {{- range $provider := list "GITHUB" "GITLAB" "GOOGLE" }}
          {{- range $suffix := list "CLIENT_ID" "CLIENT_SECRET" }}
            - name: {{ printf "SOCIAL_%s_%s" $provider $suffix }}
              valueFrom: {secretKeyRef: {name: {{ $a.social.secretName | quote }}, key: {{ printf "SOCIAL_%s_%s" $provider $suffix | quote }}, optional: true}}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if $linkRoutes }}
            - name: AUTH_SOCIAL_LINK_ROUTES
              value: "true"
          {{- end }}
          {{- with $tokenClass }}
            - name: AUTH_ACCESS_TOKEN_CLASS
              value: {{ . | quote }}
          {{- end }}
          {{- with $eddsaIssuer }}
            - name: AUTH_TOKEN_ISSUER_URL
              value: {{ . | quote }}
            - name: AUTH_JWT_AUDIENCE
              value: "dev-health-api"
          {{- end }}
          {{- if eq (include "dev-health.authOn" (dict "flag" "usersOwned" "context" .)) "true" }}
            - name: AUTH_USERS_OWNED
              value: "true"
          {{- end }}
          {{- if eq (include "dev-health.authOn" (dict "flag" "orgsOwned" "context" .)) "true" }}
            - name: AUTH_ORGS_OWNED
              value: "true"
          {{- end }}
          {{- if $a.valkey.secretName }}
            - name: AUTH_VALKEY_URI
              valueFrom: {secretKeyRef: {name: {{ $a.valkey.secretName | quote }}, key: {{ $a.valkey.secretKey | quote }}}}
          {{- end }}
          {{- if $a.trustedProxies }}
            - name: AUTH_SERVICE_TRUSTED_PROXIES
              value: {{ join "," $a.trustedProxies | quote }}
          {{- end }}
            - name: OTEL_ENABLED
              value: {{ ternary "true" "false" (eq (toString $a.tracing.enabled) "true") | quote }}
          {{- if $a.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $a.tracing.endpoint | quote }}
            - name: OTEL_SAMPLE_RATE
              value: {{ toString $a.tracing.sampleRate | quote }}
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
          {{- end }}
          {{- with $a.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - {name: signing-key, mountPath: /run/auth/signing, readOnly: true}
          livenessProbe:
            httpGet: {path: /healthz, port: operator}
            {{- toYaml $a.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: operator}
            {{- toYaml $a.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - name: signing-key-source
        {{- if $ksOn }}
          projected:
            defaultMode: 0440
            sources:
              {{- range $ks.keys }}
              - secret:
                  name: {{ .secretName | quote }}
                  items:
                    - {key: {{ .secretKey | quote }}, path: {{ .file | quote }}}
              {{- end }}
              - configMap:
                  name: {{ include "dev-health.fullname" . }}-auth-service-keyset
                  items:
                    - {key: keyset.json, path: keyset.json}
        {{- else }}
          secret:
            secretName: {{ $a.signingKey.secretName | quote }}
            defaultMode: 0440
            items:
              - {key: {{ $a.signingKey.secretKey | quote }}, path: signing-key.pem}
        {{- end }}
        - name: signing-key
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
      {{- with $a.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-auth-service
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "auth-service" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "auth-service" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ $a.port }}
      targetPort: http
      protocol: TCP
    {{- if $a.networkPolicy.metricsFrom }}
    # Published only when scrapers are listed: the NetworkPolicy admits exactly those
    # pod selectors to this port and nobody else.
    - name: operator
      port: {{ $a.operatorPort }}
      targetPort: operator
      protocol: TCP
    {{- end }}
{{- if $ksOn }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dev-health.fullname" . }}-auth-service-keyset
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "auth-service" "context" $) | nindent 4 }}
data:
  keyset.json: {{ $manifest | quote }}
{{- end }}
{{- if $a.networkPolicy.enabled }}
{{- if not $a.networkPolicy.egress.database.to }}{{- fail "authService.networkPolicy.egress.database.to is required while authService.networkPolicy.enabled (the default; set it false only when another layer enforces the boundary): the auth pods are excluded from the release-wide policy, so an empty list would cut the service off from its database" }}{{- end }}
{{- if and $a.valkey.secretName (not $a.networkPolicy.egress.valkey.to) }}{{- fail "authService.networkPolicy.egress.valkey.to is required while authService.valkey.secretName is set and authService.networkPolicy.enabled: the auth pods get no egress but DNS and the database, so an empty list would cut the service off from its rate-limit store" }}{{- end }}
{{- range (concat $a.networkPolicy.allowedFrom $a.networkPolicy.metricsFrom) }}
{{- if not (or (and .matchLabels (gt (len .matchLabels) 0)) (and .matchExpressions (gt (len .matchExpressions) 0))) }}
{{- fail "authService.networkPolicy.allowedFrom and metricsFrom entries need a non-empty matchLabels or matchExpressions: an empty podSelector admits every pod in the namespace" }}
{{- end }}
{{- end }}
---
{{- /*
The auth pods' WHOLE network boundary, rendered whenever the service is enabled.
When the release-wide policy is on they are excluded from it (networkpolicy.yaml), which admits every pod of the namespace on every
port and all HTTPS egress. Ingress: only the listed consumers on the API port
and only the listed scrapers on the operator port; an empty list renders no rule
for that port (a `from` that is empty or absent would admit every source).
Egress: DNS, the database, the rate-limit store when authService.valkey is set, and -- only when listed -- the key custody service.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" . }}-auth-service
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "auth-service" "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "auth-service" "context" $) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- /* CHAOS-10231: go-api's pods reach the API port only while go-api forwards to it (authService.phase >= 2). */}}
  {{- $apiFrom := $a.networkPolicy.allowedFrom }}
  {{- if eq (include "dev-health.authProxyOn" $) "true" }}
  {{- $apiFrom = append $apiFrom (dict "matchLabels" (include "dev-health.componentSelectorLabels" (dict "component" "go-api" "context" $) | fromYaml)) }}
  {{- end }}
  {{- if or $apiFrom $a.networkPolicy.metricsFrom }}
  ingress:
    {{- with $apiFrom }}
    - from:
        {{- range . }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $a.port }}
    {{- end }}
    {{- with $a.networkPolicy.metricsFrom }}
    - from:
        {{- range . }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $a.operatorPort }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The auth database, and nothing else
    - to:
        {{- toYaml $a.networkPolicy.egress.database.to | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $a.networkPolicy.egress.database.port }}
    {{- if $a.valkey.secretName }}
    # The shared rate-limit store, and nothing else
    - to:
        {{- toYaml $a.networkPolicy.egress.valkey.to | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $a.networkPolicy.egress.valkey.port }}
    {{- end }}
    {{- with $a.networkPolicy.egress.keyCustody.to }}
    # Key custody service (KMS)
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $a.networkPolicy.egress.keyCustody.port }}
    {{- end }}
    {{- if $a.tracing.enabled }}
    # The OTLP/gRPC trace collector, and nothing else
    - to:
        {{- toYaml $a.networkPolicy.egress.otlp.to | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $a.networkPolicy.egress.otlp.port }}
    {{- end }}
{{- end }}
{{- end }}
