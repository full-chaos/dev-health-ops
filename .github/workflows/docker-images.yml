name: Build Docker images

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      image_registry:
        description: 'Override the image registry (defaults to `ghcr.io/chrisgeo/dev-health-ops`)'
        required: false
      ref:
        description: 'Git ref (branch, tag, or SHA) to build (optional)'
        required: false
      push_images:
        description: 'Push images to the registry (default: false)'
        required: false
        default: false
        type: boolean

concurrency:
  # CHAOS-4921: `github.ref` as the non-PR fallback meant every `push`/
  # `workflow_dispatch` targeting `main` shared ONE group (both resolve
  # `github.ref` to the literal `refs/heads/main`) -- so a fast-follow
  # event in that group could cancel whatever main build was already in
  # flight, twice observed live: run 33706407469 (2d4abbbbb, the commit
  # carrying CH migration 084) was cancelled by the fe5f540a9 push, whose
  # own run then skipped the image build on its path filter, so no image
  # containing 084 was ever built; separately, workflow_dispatch run
  # 33709320991 was cancelled by the c3b3ff2ae push landing the same
  # second. (`merge_group` and `release` were never actually part of this
  # collision -- `github.ref` for those resolves to a distinct synthetic
  # queue ref and a tag ref respectively, neither of which is
  # `refs/heads/main`.)
  #
  # `cancel-in-progress` scoped to `pull_request` (below) closes the
  # IN-FLIGHT half of this, but GitHub's own documented concurrency
  # behavior holds at most one PENDING run per group even with
  # cancel-in-progress false: a third event arriving in a group with one
  # running and one already pending cancels that PENDING one. With the
  # group key still falling back to `github.ref`, two merges landing
  # close together (well within reach on a busy night with a ~20 min
  # hosted queue) could still cancel a pending main build outright. Fixed
  # by falling back to `github.sha` instead of `github.ref`: every
  # distinct commit now gets its OWN group for a non-PR event, so no two
  # different commits' builds can ever collide, cancel, or displace each
  # other, running or pending. PR events keep grouping by
  # `pull_request.number` (unchanged) so a stale PR build still gets
  # superseded by a new push to the same PR, which is the cancellation
  # this mechanism exists to provide.
  #
  # codex round 2 found two more defects in this design, both ruled by
  # team-lead as "keep per-SHA groups, fix ordering at the publish step
  # instead of the scheduler":
  #
  # (a) `github.sha` alone doesn't separate `workflow_dispatch` runs that
  # build DIFFERENT `inputs.ref` values from the same dispatch tip -- two
  # dispatches from main@S selecting different refs to build still shared
  # one group, since `github.sha` is S regardless of what `inputs.ref`
  # says. Fixed by adding `github.event.inputs.ref` ahead of `github.sha`
  # in the fallback chain, so a dispatch that names an explicit ref gets
  # its own group keyed on that ref, not on the dispatch tip.
  #
  # (b) removing scheduler-level serialization for non-PR events means
  # concurrent main builds are no longer guaranteed to COMPLETE in the
  # order they started -- if a later-pushed commit's build finishes before
  # an earlier one's (real build-time variance), both could publish the
  # mutable `latest`/`main` tags, and the earlier commit's later
  # completion would overwrite the later commit's tags with OLDER content.
  # NOT fixed here in the scheduler (that would mean re-serializing builds
  # and reintroducing (a)/(b)'s own precondition) -- fixed at the actual
  # publish step instead, in both "Merge Digests" jobs: the moving tags
  # (`latest`, and the `main` branch tag) are only applied if the commit
  # being published is STILL the current head of `main` at publish time,
  # checked immediately before tagging. An older build finishing late
  # then publishes only its immutable sha-tag and cannot overwrite
  # `latest`/`main`; whichever build is actually head-of-main when IT
  # reaches the publish step gets the moving tags, regardless of start
  # order. See the "Determine whether this build is main's current head"
  # step in each merge job.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # Always run on workflow_dispatch and release events
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            code:
              - 'src/**'
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'docker/**'
              - 'compose.yml'
              - '.dockerignore'
              - 'deploy/**'
              - 'Makefile'
              # A change to this workflow IS a change to how images are built.
              # Without this line the publish pipeline cannot republish itself:
              # the CHAOS-3923 Go publish jobs merged to main and every build
              # job skipped, because nothing in this list matches .github/**.
              # `changes` went green while publishing zero images, so the run
              # reported success and the registry stayed empty.
              - '.github/workflows/docker-images.yml'

  build:
    name: Build Image
    needs: [changes]
    # CHAOS-4921 M2: a push to MAIN always builds, whatever the paths filter says.
    #
    # The filter decides whether a change is RELEVANT. On a PR that is the right
    # question. On main it is the wrong one, because the artefact -- an image for
    # this commit -- must exist regardless of which files moved, and a skipped
    # build leaves a commit with no image at all.
    #
    # Measured (CHAOS-4921): run 33706407469 for 2d4abbbbb -- the commit carrying
    # ClickHouse migration 084 -- was cancelled by the fe5f540a9 push, and
    # fe5f540a9's own run then SKIPPED the image build on this filter. So no image
    # containing 084 was ever built, and nothing reported an error: one run was
    # cancelled, the other succeeded having built nothing. The cancellation half is
    # fixed by the per-SHA concurrency groups (#2149); this is the skip half.
    #
    # PRs keep the filter. Nothing here changes what a PR builds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    # Every matrix leg checks out the SAME ref (it doesn't vary by
    # target/platform), so they all resolve the same commit SHA -- reading
    # this output from a matrix job is safe here even though GitHub only
    # guarantees the LAST matrix leg to finish "wins" for job outputs in
    # general, because every leg computes an identical value.
    outputs:
      sha: ${{ steps.versioning.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        target: [runner, api]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # CHAOS-4921 (round 3 fix): github.sha, not github.ref -- the
          # matrix job's outputs (read by the mainhead check below) are only
          # trustworthy as "the commit this job built" if every leg checks
          # out the exact same immutable commit. github.ref is a mutable
          # branch ref: if main advances while a slow matrix leg is still
          # running, that leg would check out the NEWER tip, so the last
          # matrix-output writer could report a SHA that doesn't match what
          # earlier legs actually built (a mixed-commit manifest tagged as
          # if it were one commit). github.sha is pinned to the exact commit
          # that triggered this run and never moves.
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine version
        id: versioning
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(echo "${SHA}" | cut -c1-7)
          PYTHON_VERSION="0.0.0.dev0+${SHORT_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            PYTHON_VERSION="${{ github.event.release.tag_name }}"
          fi
          # The commit timestamp, not "now" -- matches go-build's identical
          # comment/derivation below; CHAOS-4947 needs this to actually set
          # org.opencontainers.image.created via the Dockerfile LABEL, which
          # go-worker.Dockerfile's runtime stage already does and this one
          # now mirrors.
          EPOCH=$(git log -1 --pretty=%ct)
          {
            echo "python_version=${PYTHON_VERSION}"
            echo "sha=${SHA}"
            echo "build_time=$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # CHAOS-4921: dead configuration, flagged by ci-flakes' review of this
      # PR -- `steps.meta.outputs.*` is not referenced anywhere else in this
      # job. The actual push below (`Build and push by digest`) uses a
      # hardcoded `tags:` with `push-by-digest=true` and applies no tags
      # from this step. Left in place rather than deleted because deleting
      # it invites someone to re-add an equivalent step without noticing
      # this comment; if `meta.outputs.tags` is ever wired into the push
      # below, its `latest` line must gain the same main-head gate the
      # `merge`/`go-merge` jobs' `Docker meta` steps use (round 3, this PR)
      # -- copying this ungated line instead reintroduces this PR's bug.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/dev-hops-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.event_name == 'release' && !github.event.release.prerelease) }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CHAOS-4922: the base must exist BEFORE this job reads the Dockerfile.
      #
      # mirror-test-images.yml is a SIBLING workflow on the same event -- neither
      # waits for the other, so on a first landing (or any base bump) this build
      # can reach a ghcr ref nothing has created yet. Measured while writing
      # this: the package 404'd, and a manual dispatch of the mirror was
      # CANCELLED by the single-pending-run-per-group rule before it could copy
      # anything. Depending on a sibling workflow's timing is not a guarantee.
      #
      # So the build ensures its own input. Idempotent: an inspect that succeeds
      # is a no-op, and at worst this reads ONE anonymous Hub manifest -- no Hub
      # credentials, which is the whole point of the mirror. The mirror workflow
      # remains the scheduled/bulk path; this is the ordering floor.
      #
      # Runs after the ghcr login above, because creating the tag writes to ghcr.
      - name: Ensure the Python base image is mirrored
        run: |
          set -euo pipefail
          # ONE derivation, shared with mirror-test-images.yml (CHAOS-4922).
          # Two validators for one property diverged; the gap was the silent
          # failure set. ci/python_base_ref.sh is now the only definition.
          eval "$(bash ci/python_base_ref.sh "${{ github.repository_owner }}" \
                  | awk '$1 == "ghcr" { print "ref=" $2 } $1 == "upstream" { print "upstream=" $2 }')"
          tag="${ref%@*}"
          digest="${ref##*@}"
          repo="${upstream%%:*}"
          if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
            echo "base already mirrored, no action: ${ref}"
          else
            echo "base absent from ghcr, copying from Docker Hub: ${ref}"
            # Digest-addressed on BOTH sides, so this copies exactly the image
            # the Dockerfile names -- never whatever the tag points at today.
            docker buildx imagetools create --tag "${tag}" "docker.io/library/${repo}@${digest}"
            # Verify by DIGEST rather than trusting the create's exit code: the
            # thing the build depends on is the image being resolvable at this
            # ref, not the command having returned zero.
            docker buildx imagetools inspect "${ref}" >/dev/null
            echo "base created and verified: ${ref}"
          fi

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          # CHAOS-4947: VERSION/COMMIT/BUILD_TIME feed docker/Dockerfile's
          # runtime-stage LABEL block (added for this ticket, mirroring
          # go-worker.Dockerfile's identical mechanism) -- NOT this action's
          # own `labels:` input, which would be a second, parallel path
          # setting the same org.opencontainers.image.revision key. The
          # fan-in job's ancestry check reads that label off whatever is
          # CURRENTLY tagged `latest`; it has to be baked in at build time,
          # on every build regardless of event type, since a later fan-in
          # run has no other way to know which commit an earlier build came
          # from without parsing the sha-<7> tag string (explicitly
          # rejected: a 7-char prefix isn't guaranteed unique).
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.versioning.outputs.python_version }}
            VERSION=${{ steps.versioning.outputs.python_version }}
            COMMIT=${{ steps.versioning.outputs.sha }}
            BUILD_TIME=${{ steps.versioning.outputs.build_time }}
          tags: ghcr.io/${{ github.repository_owner }}/dev-hops-${{ matrix.target }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.target }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Digests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
    # CHAOS-4947: passthrough so the fan-in job (needs: [merge, go-merge])
    # can read the built commit without re-deriving it. Every leg checks
    # out the same commit as `build` (see that job's own comment on this),
    # so which leg's output "wins" doesn't matter.
    outputs:
      sha: ${{ needs.build.outputs.sha }}
    strategy:
      matrix:
        target: [runner, api]
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # CHAOS-4947: this leg publishes ONLY immutable tags (sha-/semver/PR
      # ref) -- no `latest`, no branch-name tag. Those two are MOVING tags,
      # and CHAOS-4921's per-leg mainhead check (kept here through several
      # rounds) turned out to still be wrong in a way per-leg evaluation
      # can't fix: eight legs (this matrix plus go-merge's) each check
      # "is my commit still main's head" independently, at whatever moment
      # they individually reach this step -- measured up to 34 minutes
      # apart in one run. A commit landing mid-window lets EARLY legs tag
      # `latest` and LATE legs decline, splitting `latest` across a fresh
      # combination of families that never existed as a real commit. The
      # `fan-in-latest` job below makes that one decision, once, for every
      # family at the same moment -- see its own comment for why the check
      # there is "descendant of what's currently `latest`", not
      # "equals main's live head".
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/dev-hops-${{ matrix.target }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/dev-hops-${{ matrix.target }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/dev-hops-${{ matrix.target }}:${{ steps.meta.outputs.version }}

  # ---------------------------------------------------------------------------
  # Go runtime images (CHAOS-3923)
  #
  # Every deployment renderer -- deploy/docker-compose/compose.go-workers.yml,
  # deploy/helm/dev-health/values.yaml, deploy/kubernetes/go-workers.yaml --
  # references ghcr.io/<owner>/dev-health-go-<target>, but nothing published
  # them: go.yml builds these same targets with a plain `docker build` for Trivy
  # and SBOM only. A host with just Docker installed therefore could not start
  # the Go topology at all, and the failure looked like a registry permission
  # problem rather than a missing publish job.
  #
  # The target list is ci/check_go_containers.sh's ALL_TARGETS, kept whole on
  # purpose: a second, shorter list is how the next target goes unpublished.
  # ---------------------------------------------------------------------------
  go-build:
    name: Build Go Image
    needs: [changes]
    # CHAOS-4921 M2: a push to MAIN always builds, whatever the paths filter says.
    #
    # The filter decides whether a change is RELEVANT. On a PR that is the right
    # question. On main it is the wrong one, because the artefact -- an image for
    # this commit -- must exist regardless of which files moved, and a skipped
    # build leaves a commit with no image at all.
    #
    # Measured (CHAOS-4921): run 33706407469 for 2d4abbbbb -- the commit carrying
    # ClickHouse migration 084 -- was cancelled by the fe5f540a9 push, and
    # fe5f540a9's own run then SKIPPED the image build on this filter. So no image
    # containing 084 was ever built, and nothing reported an error: one run was
    # cancelled, the other succeeded having built nothing. The cancellation half is
    # fixed by the per-SHA concurrency groups (#2149); this is the skip half.
    #
    # PRs keep the filter. Nothing here changes what a PR builds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    # Every matrix leg checks out the SAME ref, so they all resolve the
    # same commit -- reusing the existing `commit` output is safe here
    # despite GitHub's per-matrix-leg output ambiguity in general.
    outputs:
      sha: ${{ steps.versioning.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - worker
          - scheduler
          - reconciler
          - stream-runner
          - operator
          - contractcheck
          - migrate
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # CHAOS-4921 (round 3 fix): github.sha, not github.ref -- the
          # matrix job's outputs (read by the mainhead check below) are only
          # trustworthy as "the commit this job built" if every leg checks
          # out the exact same immutable commit. github.ref is a mutable
          # branch ref: if main advances while a slow matrix leg is still
          # running, that leg would check out the NEWER tip, so the last
          # matrix-output writer could report a SHA that doesn't match what
          # earlier legs actually built (a mixed-commit manifest tagged as
          # if it were one commit). github.sha is pinned to the exact commit
          # that triggered this run and never moves.
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine build metadata
        id: versioning
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION="$(echo "${SHA}" | cut -c1-7)"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          fi
          # The commit timestamp, not "now": the image stays byte-reproducible
          # from a given commit, which is what ci/check_go_containers.sh asserts
          # with its own fixed metadata.
          EPOCH=$(git log -1 --pretty=%ct)
          {
            echo "version=${VERSION}"
            echo "commit=${SHA}"
            echo "build_time=$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_date_epoch=${EPOCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/go-worker.Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.versioning.outputs.version }}
            COMMIT=${{ steps.versioning.outputs.commit }}
            BUILD_TIME=${{ steps.versioning.outputs.build_time }}
            SOURCE_DATE_EPOCH=${{ steps.versioning.outputs.source_date_epoch }}
          tags: ghcr.io/${{ github.repository_owner }}/dev-health-go-${{ matrix.target }}
          # No `labels:` input here -- go-worker.Dockerfile's runtime stage
          # already sets org.opencontainers.image.revision (and friends)
          # from the COMMIT build-arg above. CHAOS-4947's fan-in job reads
          # that label off whatever is CURRENTLY tagged `latest`; adding a
          # `labels:` field here too would be a second, parallel mechanism
          # setting the same key (team-lead review) -- docker/Dockerfile
          # (the Python image) was the one actually missing this mechanism,
          # now fixed to match this file's own pattern instead.
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-go-${{ matrix.target }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  go-merge:
    name: Merge Go Digests
    runs-on: ubuntu-latest
    needs: go-build
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
    # CHAOS-4947: see the identical output on `merge` above.
    outputs:
      sha: ${{ needs.go-build.outputs.sha }}
    strategy:
      matrix:
        target:
          - worker
          - scheduler
          - reconciler
          - stream-runner
          - operator
          - contractcheck
          - migrate
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-go-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # CHAOS-4947: see the identical step in the `merge` job above for the
      # full rationale -- this leg publishes only immutable tags; the
      # `fan-in-latest` job applies `latest`/branch-name tags once, for
      # every family, at the same moment.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/dev-health-go-${{ matrix.target }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/dev-health-go-${{ matrix.target }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/dev-health-go-${{ matrix.target }}:${{ steps.meta.outputs.version }}

  # ---------------------------------------------------------------------------
  # CHAOS-4947: one moving-tag decision, made ONCE, for every family.
  #
  # `merge`/`go-merge` above publish only immutable tags now (sha-/semver/PR
  # ref). This job is the only place `latest` (and the branch-name tag, e.g.
  # `main`) ever get applied, and it makes that call after ALL nine families'
  # immutable tags have landed -- not once per matrix leg, spread over
  # whatever wall-clock those legs happen to finish at (measured 34 minutes
  # apart in one run, CHAOS-4947).
  #
  # The check is "is the built commit a DESCENDANT of (or equal to) the
  # commit currently tagged `latest`", NOT "does it equal main's live head"
  # -- team-lead's ruling, restated by lane-084-prod filing this ticket.
  # Fan-in alone only fixes the WITHIN-one-run race (early legs tag, late
  # legs decline, splitting `latest` across a combination that never
  # existed). Equals-head still fails the case prod actually hit: an
  # overtaken-but-still-ahead-of-latest build declines ALL its moving tags,
  # stranding `latest` behind a complete, newer image set that only ever
  # got its sha- tag. Descendant tags in that case (no stranding) while
  # still declining a genuinely older build finishing late (ordering stays
  # protected) -- and it is the only version safe ACROSS runs too, since a
  # fan-in job only serializes the decision WITHIN its own run: two runs at
  # different main commits can each reach their own fan-in and both
  # attempt to tag, ordered only by wall-clock, unless each independently
  # re-checks ancestry against whatever is live at that instant.
  fan-in-latest:
    name: Apply moving tags (fan-in)
    runs-on: ubuntu-latest
    needs: [merge, go-merge]
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
    # team-lead (CHAOS-4947 review): the re-read-immediately-before-tagging
    # inside the step below NARROWS the cross-run race, it doesn't close
    # it -- two fan-in runs at different commits can both pass their own
    # ancestor check (each reading a `latest` that predates the other's
    # write) and then tag in the wrong order regardless. A dedicated
    # concurrency group serializes every fan-in run against every other
    # one, so the re-read step is always looking at the PREVIOUS fan-in's
    # actual result, not a stale value racing against it.
    #
    # 084-prod (second review): `cancel-in-progress: false` does NOT mean
    # every fan-in run actually executes -- this file's own comment at the
    # top (CHAOS-4921) documents GitHub's rule that a group holds at most
    # ONE pending run even with cancel-in-progress false: a third event
    # arriving with one running and one already pending EVICTS that
    # pending one outright. On a burst of merges, a middle commit's
    # fan-in run can be silently evicted before it ever runs.
    #
    # This is BOUNDED, not open-ended, and self-heals except at the tail:
    # an evicted commit's fan-in never runs, but the NEXT commit's fan-in
    # (whenever it runs) re-reads whatever is currently tagged `latest`
    # fresh and, being a later descendant, still passes its own ancestor
    # check and tags correctly -- so "latest only ever advances to a
    # descendant" holds regardless of which fan-in runs got evicted along
    # the way. The one case this does NOT heal: if the LAST fan-in in a
    # burst is the one evicted and no further merge follows it, `latest`
    # is permanently stranded one (or more) commits behind head, with
    # nothing left to trigger a self-heal -- exactly the state prod is in
    # right now. That tail case is a KNOWN, ACCEPTED GAP for this PR (see
    # CHAOS-4955 for the reconcile-path follow-up: a scheduled or
    # workflow_dispatch fan-in-only run that re-derives and re-applies
    # moving tags with no merge required to trigger it). Per-SHA
    # concurrency keys were considered and rejected here: they would lose
    # the serialization this read-modify-write decision actually needs
    # (see the comment above this job's Apply step, at the re-read site,
    # for the self-heal argument restated where the read happens).
    concurrency:
      group: latest-tagging
      cancel-in-progress: false
    steps:
      # fetch-depth: 0 for `git merge-base --is-ancestor` below; checked out
      # at the exact commit this run built (needs.merge.outputs.sha), not
      # whatever main happens to be *now* -- the ancestry check reasons
      # about the BUILT commit's relationship to `latest`'s label, and that
      # relationship doesn't depend on where main has moved to since.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.merge.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mirrors the exact per-family enable logic the old per-leg `Docker
      # meta` step used (`type=ref,event=branch,enable=...` / `type=raw,
      # value=latest,enable=...`), just evaluated once instead of once per
      # leg, and with the main-ref half of that logic swapped from
      # equals-head to descendant-of-latest (CHAOS-4947):
      #   - release (non-prerelease): tag `latest` unconditionally, no
      #     branch tag (matches metadata-action's own `type=ref,event=
      #     branch`, which never fires for a tag ref regardless of enable).
      #   - on `refs/heads/main`: tag BOTH `latest` and `main` together,
      #     gated on the SAME descendant check -- they moved together
      #     before (one `enable:` each, evaluated from the same
      #     `is_main_head`) and still should.
      #   - on any other branch (e.g. workflow_dispatch off a feature
      #     branch): tag that branch's own name unconditionally, no
      #     `latest` -- there's no main-push race to protect against here.
      #   - anything else (a tag ref, a bare SHA dispatch): no tag, same as
      #     today.
      - name: Apply latest/branch tags to every family whose ancestry allows it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ needs.merge.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          IS_RELEASE: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
          # codex round 1 (P1, docker-images.yml:714 at bc1e9c30): github.ref
          # is the ref this WORKFLOW RUN was dispatched from, not the ref
          # that was actually checked out and built -- build/go-build's
          # checkout prefers github.event.inputs.ref (see that job's own
          # comment). A workflow_dispatch launched from main's UI with a
          # custom inputs.ref=feature/foo builds feature/foo's content
          # while github.ref still reads refs/heads/main, so keying
          # IS_MAIN_REF on github.ref could classify (and publish) an
          # arbitrary custom-ref build as main's. Fixed to be conservative
          # rather than guessing: main ONLY for an actual push event (this
          # workflow's push trigger is `branches: [main]` only, so every
          # push here IS main by construction) or a dispatch with NO custom
          # ref override at all (inputs.ref empty) AND actually dispatched
          # FROM main (github.ref == refs/heads/main) -- both conditions,
          # not just the first: a dispatch with an empty inputs.ref but run
          # from a non-main branch (via the dispatch UI's own branch
          # selector, not the custom ref field) correctly builds THAT
          # branch's tip, and github.ref correctly reflects it in exactly
          # this one case (self-caught tracing the truth table -- an
          # earlier draft of this fix said "empty inputs.ref -> always
          # main," which reintroduces a narrower version of the same bug
          # for a non-main dispatch). ANY explicit inputs.ref -- even one
          # that happens to say "main" -- is treated as NOT main: decline
          # the moving tags rather than trust a value that doesn't
          # describe what was built.
          IS_MAIN_REF: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '' && github.ref == 'refs/heads/main') }}
          # Same reasoning for the non-main branch-name tag: only trust
          # github.ref_name when we're confident it names what was actually
          # built. A dispatch with an explicit custom inputs.ref gets NO
          # moving tag here either (not even its own branch's name) rather
          # than guessing from a ref that may not match what was checked
          # out -- falls through to "NON-BRANCH REF: no moving tag applies"
          # below, same as any other unresolvable ref shape.
          REF_IS_BRANCH: ${{ github.ref_type == 'branch' && (github.event_name != 'workflow_dispatch' || github.event.inputs.ref == '') }}
          BRANCH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # codex round 1 (P1/P2, docker-images.yml:767,727,828-829 at
          # bc1e9c30): every `imagetools inspect` call in this step treated
          # ANY failure -- a genuine "doesn't exist" 404 AND a transient
          # network/5xx/auth blip -- identically, either as "safe to
          # bootstrap-overwrite" (the :latest check) or "safe to skip" (the
          # source-tag check), and the digest-walk's candidate check wasn't
          # even guarded, so a transient failure there aborted the whole
          # job outright under `set -e` instead of just moving to the next
          # candidate. None of that is safe: a transient failure on an
          # EXISTING, valid :latest must never be read as "latest doesn't
          # exist" (that path unconditionally overwrites it), and a
          # transient failure on an already-published source tag must
          # never silently skip that family's moving tags without so much
          # as a warning. A registry inspect that can't be classified
          # reliably as "genuinely absent" from exit code alone (buildx
          # doesn't distinguish 404 from 5xx in its exit status) is instead
          # retried a few times -- a truly transient error is likely to
          # clear within that window, and a call that fails identically
          # every time is treated as absence, same as before, just with
          # retries first rather than trusting a single attempt.
          #
          # STRUCTURAL FIX (team-lead ruling: a documented-but-unimplemented
          # gap was rejected here; this was verified live, not guessed).
          # Live probe on bigboy, docker/buildx v0.37.0 (Docker Engine
          # 29.7.2) against ghcr.io, 2026-09-03: `imagetools inspect` on a
          # genuinely absent tag
          # exits 1 with stderr exactly `ERROR: <ref>: not found`; a
          # present tag exits 0 with empty stderr and valid JSON on
          # stdout. `_inspect_classify` below matches ONLY that verified
          # substring as CONFIRMED ABSENT -- anything else (a different
          # error, a network timeout, an auth failure, empty stderr with a
          # nonzero exit) is UNKNOWN and fails closed. This is the SAME
          # discipline as the retry helper below: don't guess at error
          # shapes that were never actually observed, because a wrong
          # guess would silently misclassify a genuine absence as an
          # error, or a genuine transient error as absence -- either one
          # is worse than today. The :latest call site below uses this to
          # tell "doesn't exist" (bootstrap) from "couldn't tell"
          # (decline, never bootstrap on an ambiguous read).
          #
          # ci-flakes review (delta on b172ebf0): the original version slept
          # after the FINAL attempt too, paying for a retry it would never
          # make. Fixed to skip the trailing sleep. Used for the TWO checks
          # where absence is an anomaly worth a few retries to rule out a
          # transient blip (:latest, and the just-published source tag) --
          # NOT for the digest-walk's per-candidate checks below, where
          # absence is the EXPECTED, common outcome for most candidates (a
          # commit whose CI failed before publishing, or a future
          # CHAOS-4948 skip) and retrying every miss would turn a fast walk
          # into a slow one for no benefit; that loop uses the single-shot
          # `_inspect_once` instead.
          _inspect_retry() {
            local ref="$1" attempt
            # shellcheck disable=SC2034
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect "$ref" --format '{{json .}}' 2>/dev/null; then
                return 0
              fi
              [ "$attempt" -lt 3 ] && sleep 2
            done
            return 1
          }
          # `_inspect_once` is single-attempt, no retry -- and that is
          # justified by FAIL-CLOSEDNESS, not by speed (team-lead review):
          # every call site below feeds this into `[ -n "${candidate_digest}" ]`,
          # so a failed inspect yields an empty digest, which can only ever
          # produce a MISS (the candidate is skipped, the walk moves on) --
          # it can never produce a false MATCH. Retrying here would only
          # spend time; it changes no outcome a caller could get wrong.
          # The `:latest` site below is the OPPOSITE shape and must never
          # be migrated to this helper: there, an empty/failed read means
          # "doesn't exist", which drives an unconditional overwrite
          # (BOOTSTRAP) -- an ambiguous read there is not a safe miss, it's
          # a wrong answer with a destructive side effect. That inversion
          # is exactly why `:latest` needs `_inspect_retry_classify`
          # (3-way: found / CONFIRMED ABSENT / UNKNOWN-fail-closed) instead
          # of this helper. The two are not interchangeable and must not
          # be merged for "code cleanliness".
          _inspect_once() {
            docker buildx imagetools inspect "$1" --format '{{json .}}' 2>/dev/null
          }
          # _inspect_classify: single attempt, but distinguishes WHY it
          # failed instead of collapsing every failure into one outcome.
          # See the STRUCTURAL FIX comment above for the live-verified
          # stderr text this matches on. Returns JSON on stdout with exit
          # 0 when found; on failure, exit 1 means CONFIRMED ABSENT
          # (verified "not found" stderr), exit 2 means UNKNOWN (anything
          # else) -- callers must treat 2 as fail-closed, never as
          # equivalent to 1.
          _inspect_classify() {
            local ref="$1" out err_file rc
            err_file="$(mktemp)"
            if out="$(docker buildx imagetools inspect "${ref}" --format '{{json .}}' 2>"${err_file}")"; then
              rm -f "${err_file}"
              printf '%s' "${out}"
              return 0
            fi
            if grep -qF "${ref}: not found" "${err_file}"; then
              rc=1
            else
              rc=2
            fi
            rm -f "${err_file}"
            return "${rc}"
          }
          # _inspect_retry_classify: retries ONLY the UNKNOWN outcome (a
          # genuine ambiguity worth a few seconds to rule out as
          # transient, same reasoning as `_inspect_retry` above) --
          # CONFIRMED ABSENT short-circuits immediately, there is nothing
          # to retry away, the ref does not exist. Note the `$?` capture:
          # it happens on the line immediately inside the `else` branch,
          # never via a bodyless `if` with no `else` -- that shape was
          # proven (real bash) to reset `$?` to 0 on the false path,
          # which would silently turn every UNKNOWN into a false ABSENT.
          _inspect_retry_classify() {
            local ref="$1" attempt out rc
            for attempt in 1 2 3; do
              if out="$(_inspect_classify "${ref}")"; then
                printf '%s' "${out}"
                return 0
              else
                rc=$?
              fi
              [ "${rc}" -eq 1 ] && return 1
              [ "${attempt}" -lt 3 ] && sleep 2
            done
            return 2
          }
          # The full family list, both naming schemes -- keep this whole,
          # like ci/check_go_containers.sh's ALL_TARGETS: a shorter,
          # second copy is how the next target goes untagged.
          families="dev-hops-runner dev-hops-api dev-health-go-worker dev-health-go-scheduler dev-health-go-reconciler dev-health-go-stream-runner dev-health-go-operator dev-health-go-contractcheck dev-health-go-migrate"
          short_sha="$(echo "${BUILT_SHA}" | cut -c1-7)"
          for family in $families; do
            image="ghcr.io/${OWNER}/${family}"
            source_ref="${image}:sha-${short_sha}"
            if ! _inspect_retry "${source_ref}" >/dev/null; then
              echo "SKIP ${family}: ${source_ref} was not published this run (or unreachable after 3 tries)"
              continue
            fi

            if [ "${IS_RELEASE}" = "true" ]; then
              echo "RELEASE ${family}: tagging latest unconditionally"
              docker buildx imagetools create -t "${image}:latest" "${source_ref}"
              continue
            fi

            if [ "${IS_MAIN_REF}" != "true" ]; then
              if [ "${REF_IS_BRANCH}" = "true" ]; then
                # codex round 1 (P3, docker-images.yml:716,740-741 at
                # bc1e9c30): github.ref_name for a branch like "feature/foo"
                # contains a slash, which is invalid in a Docker TAG
                # component (slashes are only valid in the repository path).
                # metadata-action's type=ref,event=branch sanitized this;
                # this direct call didn't. Replace slashes (and anything
                # else outside the tag-safe character set) with `-`, same
                # convention most CI systems use for branch-derived tags.
                #
                # ci-flakes review (delta on b172ebf0): Docker's tag grammar
                # is `[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}` -- the FIRST
                # character may not be `.`/`-`. `tr` alone only fixes
                # interior characters, so a real, valid git branch starting
                # with a character outside A-Za-z0-9_ (e.g. `+foo`, `@work`,
                # or any non-ASCII first character) sanitizes to a leading
                # `-`, which is itself an invalid tag -- verified: `+foo` ->
                # `-foo`. An empty BRANCH_TAG (an edge case, not raised by
                # ci-flakes but caught applying their fix) also sanitizes to
                # an empty string, `image:` -- also invalid. Guard the
                # leading character explicitly; verified against real bash
                # for +foo/@work/empty/a valid case before trusting it.
                safe_branch_tag="$(printf '%s' "${BRANCH_TAG}" | tr -c 'A-Za-z0-9_.-' '-')"
                case "${safe_branch_tag}" in
                  [A-Za-z0-9_]*) ;;
                  *) safe_branch_tag="x${safe_branch_tag}" ;;
                esac
                # team-lead follow-up: Docker's tag grammar also caps the
                # total length at 128 characters -- a long branch name
                # (or one that grew by one char from the leading-char
                # guard just above) can still exceed it. Truncate last,
                # after any prefix has already been added.
                safe_branch_tag="${safe_branch_tag:0:128}"
                echo "NON-MAIN BRANCH ${family}: tagging ${safe_branch_tag} (from ref ${BRANCH_TAG}) unconditionally"
                docker buildx imagetools create -t "${image}:${safe_branch_tag}" "${source_ref}"
              else
                echo "NON-BRANCH REF ${family}: no moving tag applies"
              fi
              continue
            fi

            # THIS read is also where the concurrency group's self-heal
            # actually happens (084-prod review, see the job-level
            # concurrency comment above for the full argument): if this
            # run's own fan-in got evicted from the group's pending slot
            # last time around, that's invisible from here -- this step
            # simply reads whatever :latest is RIGHT NOW, which already
            # reflects every fan-in that DID execute, evicted or not. A
            # later descendant commit's fan-in always sees a correct,
            # up-to-date base here; only the tail case (no later commit
            # ever runs this step again) has no read left to self-heal it
            # (CHAOS-4955).
            #
            # No `|| true` here: that puts `||` on the same line as a
            # `docker` invocation, which is exactly the shape that trips
            # tests/tooling/test_go_integration_sharding.py's naive
            # (quote-unaware) registry scanner (see the CGO-check step in
            # arc-runner-image.yml, PR #2154, for the identical trap and
            # fix). `if cmd; then ... fi` keeps the `;` after the command's
            # own quotes are already closed, which parses cleanly.
            #
            # Three-way outcome (see _inspect_retry_classify above): 0 =
            # found, proceed with the label logic below. 1 = CONFIRMED
            # ABSENT -- bootstrap unconditionally, same as before. 2 =
            # UNKNOWN -- fail closed: decline and move on, NEVER
            # bootstrap. Bootstrapping on an ambiguous read would still be
            # the exact P1 this item exists to close (a transient failure
            # on an EXISTING :latest silently overwriting it).
            latest_rc=0
            if latest_json="$(_inspect_retry_classify "${image}:latest")"; then
              :
            else
              latest_rc=$?
            fi
            if [ "${latest_rc}" -eq 1 ]; then
              echo "BOOTSTRAP ${family}: no existing latest tag (confirmed absent), tagging unconditionally"
              docker buildx imagetools create -t "${image}:latest" -t "${image}:main" "${source_ref}"
              continue
            elif [ "${latest_rc}" -eq 2 ]; then
              echo "WARNING: ${family}: could not read :latest and could not confirm it's absent (registry error of an unrecognized shape) -- declining rather than risk overwriting an existing image on an ambiguous read"
              continue
            fi
            # ci-flakes review (delta on fa119b2d): rc==0 means the inspect
            # call itself succeeded, but doesn't by construction guarantee
            # non-empty stdout -- practically unreachable (a successful
            # `imagetools inspect --format` should always print something),
            # but "practically unreachable" is exactly the kind of claim
            # this PR's own review history has already burned once. Make
            # it explicit rather than rely on downstream jq/digest-walk
            # code to coincidentally decline on empty input: treat an
            # empty read on a reported-success exit as UNKNOWN too, same
            # as any other unclassifiable outcome, and fail closed.
            if [ -z "${latest_json}" ]; then
              # team-lead ruling: this is a genuinely surprising outcome
              # (a reported success with no data), not a routine decline
              # -- ::error:: surfaces it as a GitHub Actions annotation
              # instead of a plain log line, so it doesn't silently blend
              # into a wall of ordinary per-family output.
              echo "::error::${family}: :latest inspect reported success but returned no data -- treating as unknown, declining rather than risk overwriting"
              continue
            fi

            # `imagetools inspect` on a multi-platform tag returns a
            # manifest LIST; the revision label lives in each platform's
            # own image config, not on the list itself (team-lead review).
            # Read both and require BOTH present and equal before trusting
            # either -- 084-prod review caught that `${amd64_rev:-
            # ${arm64_rev}}` silently takes whichever exists when only ONE
            # platform is labeled, which is exactly the "guessing which
            # platform is authoritative" the disagree-case comment already
            # refuses, and it's reachable NOW: every family currently has a
            # labelless :latest during this PR's own migration, and a mixed
            # amd64-old/arm64-new index from an interrupted publish is not
            # hypothetical this week. Two present and equal -> use it. Two
            # present and different -> genuine disagreement, decline
            # outright (broken/partial publish, guessing is worse than
            # declining). Anything else (zero or exactly one present) ->
            # NOT enough to trust, but also not evidence of disagreement --
            # treat as unlabeled and fall through to the digest-walk
            # fallback below, same as the two-Python-families case.
            amd64_rev="$(jq -r '.image["linux/amd64"].config.Labels["org.opencontainers.image.revision"] // empty' <<<"${latest_json}")"
            arm64_rev="$(jq -r '.image["linux/arm64"].config.Labels["org.opencontainers.image.revision"] // empty' <<<"${latest_json}")"
            base_sha=""
            if [ -n "${amd64_rev}" ] && [ -n "${arm64_rev}" ]; then
              if [ "${amd64_rev}" != "${arm64_rev}" ]; then
                echo "DECLINE ${family}: platform labels disagree on :latest (amd64=${amd64_rev} arm64=${arm64_rev}) -- refusing to guess which is authoritative"
                continue
              fi
              base_sha="${amd64_rev}"
            fi

            if [ -z "${base_sha}" ]; then
              # Reached with zero OR exactly one platform label present.
              # dev-hops-runner/dev-hops-api predate this PR's label and
              # carry NO Labels map at all today (measured, 084-prod) --
              # that's the zero case. A labelless :latest is NOT the same
              # as a MISSING :latest
              # (that's BOOTSTRAP, above), and it isn't the two-platforms-
              # disagree case either. Best-effort, bounded, fail-closed
              # fallback: walk the BUILT commit's own first-parent history
              # (so anything this finds is an ancestor of BUILT_SHA by
              # construction, no separate merge-base check needed) looking
              # for the commit whose sha- tag has the SAME manifest digest
              # as the current :latest -- digest equality answers "is
              # :latest at commit X" for a KNOWN X, so this only works
              # because the walk supplies successive candidate X's
              # (ci-flakes review). Once this family's next build lands the
              # label, this branch never runs for it again.
              latest_digest="$(jq -r '.manifest.digest // empty' <<<"${latest_json}")"
              found_base=""
              while IFS= read -r candidate_sha; do
                candidate_short="$(echo "${candidate_sha}" | cut -c1-7)"
                # codex round 1 (P2, docker-images.yml:828-829 at bc1e9c30):
                # this was a bare pipeline assignment, not guarded by an
                # if/else -- under `set -euo pipefail`, ANY candidate whose
                # sha- tag was never published (a real gap: a commit whose
                # CI run failed before publishing, or one skipped by a
                # future CHAOS-4948) made the inspect call fail, made the
                # pipeline fail, and aborted the ENTIRE job immediately
                # instead of just treating that one candidate as a
                # non-match and continuing the walk. Guarded the same way
                # the :latest read above is -- but using `_inspect_once`
                # (single attempt, no retry), not `_inspect_retry`:
                # ci-flakes review (delta on b172ebf0) correctly separated
                # these -- absence here is the EXPECTED, common outcome for
                # most candidates in a 50-commit walk, and retrying every
                # miss 3x with sleeps between would turn a fast walk into a
                # slow one paying for retries that were never going to
                # succeed.
                if candidate_digest="$(_inspect_once "${image}:sha-${candidate_short}" | jq -r '.manifest.digest // empty')"; then
                  :
                else
                  candidate_digest=""
                fi
                if [ -n "${candidate_digest}" ] && [ "${candidate_digest}" = "${latest_digest}" ]; then
                  found_base="${candidate_sha}"
                  break
                fi
              done < <(git log --first-parent -n 50 --format=%H "${BUILT_SHA}")
              if [ -n "${found_base}" ]; then
                echo "FALLBACK ${family}: unlabeled latest resolved to ${found_base} by digest walk (an ancestor of ${BUILT_SHA} by construction), tagging latest+main"
                docker buildx imagetools create -t "${image}:latest" -t "${image}:main" "${source_ref}"
              else
                echo "WARNING: ${family} has no revision label on :latest and no commit in the last 50 first-parent ancestors of ${BUILT_SHA} matches its digest -- declining rather than guessing. This should resolve itself once ${family} gets its next label-bearing build."
              fi
              continue
            fi

            if git merge-base --is-ancestor "${base_sha}" "${BUILT_SHA}"; then
              echo "DESCENDANT ${family}: ${base_sha} -> ${BUILT_SHA}, tagging latest+main"
              docker buildx imagetools create -t "${image}:latest" -t "${image}:main" "${source_ref}"
            else
              echo "DECLINE ${family}: ${BUILT_SHA} is not a descendant of currently-latest ${base_sha}"
            fi
          done
