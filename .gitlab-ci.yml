# ---------------------------------------------------------------------------
# security (security-scan.yml, scheduled-scan.yml)
# ---------------------------------------------------------------------------

# scheduled-scan.yml (weekly pip-audit) is the same job on a schedule pipeline.
security:pip-audit:
  stage: security
  image: python:3.14
  rules: *code_rules
  before_script:
    - python -V
    - python -m pip install --upgrade pip
    - pip install "pip-audit==2.10.0"
  script:
    - |
      IGNORE_ARGS=""
      if [ -f .pip-audit-ignore ]; then
        while IFS= read -r line; do
          CVE=$(printf '%s\n' "$line" | awk '{$1=$1; print $1}')
          case "$CVE" in
            ''|'#'*) continue ;;
          esac
          IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $CVE"
        done < .pip-audit-ignore
      fi
      # shellcheck disable=SC2086
      pip-audit \
        --requirement requirements.txt \
        --vulnerability-service pypi \
        --format markdown \
        --output pip-audit-report.md \
        $IGNORE_ARGS
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - pip-audit-report.md

# continue-on-error in security-scan.yml, so allow_failure here.
security:semgrep:
  stage: security
  image: python:3.14
  rules: *code_rules
  allow_failure: true
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends jq
    - pip install "semgrep>=1.99.0"
  script:
    - semgrep scan --config auto --sarif --output semgrep.sarif
    # Drop nosemgrep-suppressed findings from the SARIF, as security-scan.yml does.
    - |
      if jq '.runs[].results |= map(select(
              ((.suppressions // []) | length == 0)
              or ((.suppressions // []) | any(
                   .kind != "inSource"
                   or ((.status // "accepted") != "accepted")
                 ))
            ))' semgrep.sarif > semgrep.filtered.sarif \
          && jq -e '.runs' semgrep.filtered.sarif > /dev/null; then
        mv semgrep.filtered.sarif semgrep.sarif
      else
        echo "WARNING: SARIF suppression filter failed; keeping unfiltered results"
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - semgrep.sarif

# A finding fails the job (no allow_failure), as in security-scan.yml.
security:gitleaks:
  stage: security
  image: python:3.14
  rules: *code_rules
  variables:
    GITLEAKS_VERSION: "8.24.3"
    GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
  script:
    - |
      set -euo pipefail
      tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      curl -sSfL --retry 3 -o "/tmp/${tarball}" \
        "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
      echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum --check --strict
      mkdir -p /tmp/gitleaks
      tar -xzf "/tmp/${tarball}" -C /tmp/gitleaks gitleaks
      test "$(/tmp/gitleaks/gitleaks version)" = "${GITLEAKS_VERSION}"
      # The commits this pipeline adds (new commits only, merges excluded,
      # first-parent line only), never the history already on the default
      # branch. Any other pipeline (schedule, web, tag) scans everything.
      range=""
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        range="${CI_MERGE_REQUEST_DIFF_BASE_SHA}..${CI_COMMIT_SHA}"
      elif [ "${CI_PIPELINE_SOURCE}" = "push" ] && [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; then
        if [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "${CI_COMMIT_BEFORE_SHA//0/}" != "" ]; then
          range="${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}"
        else
          range="-1"
        fi
      fi
      args=(detect --redact -v --exit-code=2 --report-format=sarif --report-path=gitleaks.sarif --log-level=debug)
      if [ -n "${range}" ]; then
        if [ "${range}" = "-1" ]; then
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]; then
            echo "the last commit is a merge commit: nothing to scan" >&2
            exit 1
          fi
          args+=("--log-opts=-1")
        else
          count="$(git rev-list --count --no-merges --first-parent "${range}")"
          if [ "${count}" -lt 1 ]; then
            echo "the scan range ${range} holds no commit to scan" >&2
            exit 1
          fi
          args+=("--log-opts=--no-merges --first-parent ${range}")
        fi
      fi
      echo "gitleaks ${args[*]}"
      /tmp/gitleaks/gitleaks "${args[@]}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - gitleaks.sarif

# go.yml: go-container-security, first half (build the four Go images).
security:go-image-build:
  extends: .docker_job
  stage: security
  timeout: 25m
  rules: *code_rules
  parallel:
    matrix:
      - TARGET: ["operator", "contractcheck", "migrate", "dho"]
  script:
    - |
      docker build \
        --file docker/go-worker.Dockerfile \
        --target "${TARGET}" \
        --build-arg VERSION=phase1-ci \
        --build-arg COMMIT=0000000000000000000000000000000000000000 \
        --build-arg BUILD_TIME=1970-01-01T00:00:00Z \
        --build-arg SOURCE_DATE_EPOCH=0 \
        --tag "dev-health-go-${TARGET}:security" \
        .
    - mkdir -p images
    - docker save -o "images/${TARGET}.tar" "dev-health-go-${TARGET}:security"
  artifacts:
    expire_in: 1 day
    paths:
      - images/*.tar

# go-container-security, second half: the Trivy scan (CRITICAL fails) and the SBOM.
scan:trivy:
  stage: scan
  image:
    name: aquasec/trivy:0.70.0
    entrypoint: [""]
  rules: *code_rules
  script:
    - |
      set -eu
      found=0
      for tar in images/*.tar; do
        [ -e "${tar}" ] || continue
        found=$((found + 1))
        trivy image --input "${tar}" --scanners vuln --pkg-types os,library --severity CRITICAL --exit-code 1
      done
      [ "${found}" -ge 4 ] || { echo "expected 4 image archives, found ${found}: the scan did not run on every image" >&2; exit 1; }

scan:sbom:
  stage: scan
  image:
    name: anchore/syft:v1.42.3
    entrypoint: [""]
  rules: *code_rules
  script:
    - |
      set -eu
      found=0
      mkdir -p sbom
      for tar in images/*.tar; do
        [ -e "${tar}" ] || continue
        found=$((found + 1))
        name="$(basename "${tar}" .tar)"
        syft scan "docker-archive:${tar}" -o "spdx-json=sbom/go-${name}-sbom.spdx.json"
      done
      [ "${found}" -ge 4 ] || { echo "expected 4 image archives, found ${found}: the SBOM did not run on every image" >&2; exit 1; }
  artifacts:
    expire_in: 14 days
    paths:
      - sbom/*.json

# ---------------------------------------------------------------------------
# build (docker-images.yml, publish-pypi.yml)
# ---------------------------------------------------------------------------

# docker-images.yml: go-build (operator, contractcheck, migrate, dho from
# docker/go-worker.Dockerfile) and go-api-tools-build (docker/go-api-tools.Dockerfile),
# each on amd64 and arm64. One image per platform, tagged <sha>-<platform>;
# build:go-images-manifest joins them. It pushes only on the default branch
# and on tags, and only when the GitLab registry is available.
build:go-images:
  extends: .docker_job
  stage: build
  timeout: 45m
  rules: *code_rules
  parallel:
    matrix:
      - DOCKER_FILE: ["docker/go-worker.Dockerfile"]
        IMAGE: ["operator", "contractcheck", "migrate", "dho"]
        PLATFORM: ["linux/amd64", "linux/arm64"]
      - DOCKER_FILE: ["docker/go-api-tools.Dockerfile"]
        IMAGE: ["api-tools"]
        DOCKER_TARGET: ["runtime"]
        PLATFORM: ["linux/amd64", "linux/arm64"]
  before_script:
    - !reference [.docker_job, before_script]
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name dev-health-builder || docker buildx use dev-health-builder
  script:
    - !reference [.build_metadata, script]
    - |
      set -eu
      target="${DOCKER_TARGET:-${IMAGE}}"
      platform_tag="$(printf '%s' "${PLATFORM}" | tr '/:' '--')"
      image_name="${CI_REGISTRY_IMAGE}/dev-health-go-${IMAGE}:${CI_COMMIT_SHORT_SHA}-${platform_tag}"
      push_flag="--load"
      if { [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ] || [ -n "${CI_COMMIT_TAG:-}" ]; } && [ -n "${CI_REGISTRY_USER:-}" ]; then
        printf '%s' "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
        push_flag="--push"
      fi
      docker buildx build \
        --platform "${PLATFORM}" \
        --file "${DOCKER_FILE}" \
        --target "${target}" \
        --build-arg "VERSION=${VERSION}" \
        --build-arg "COMMIT=${COMMIT}" \
        --build-arg "BUILD_TIME=${BUILD_TIME}" \
        --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
        --tag "${image_name}" \
        ${push_flag} \
        .
      echo "Built ${image_name} (${push_flag})"

build:go-images-manifest:
  extends: .docker_job
  stage: build
  needs:
    - job: build:go-images
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_REGISTRY_USER
      changes: *code_changes
    - if: $CI_COMMIT_TAG && $CI_REGISTRY_USER
  parallel:
    matrix:
      - IMAGE: ["operator", "contractcheck", "migrate", "dho", "api-tools"]
  script:
    - |
      set -eu
      printf '%s' "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
      repo="${CI_REGISTRY_IMAGE}/dev-health-go-${IMAGE}"
      tags=(-t "${repo}:${CI_COMMIT_SHORT_SHA}")
      if [ -n "${CI_COMMIT_TAG:-}" ]; then tags+=(-t "${repo}:${CI_COMMIT_TAG}"); fi
      docker buildx imagetools create "${tags[@]}" \
        "${repo}:${CI_COMMIT_SHORT_SHA}-linux-amd64" \
        "${repo}:${CI_COMMIT_SHORT_SHA}-linux-arm64"
      docker buildx imagetools inspect "${repo}:${CI_COMMIT_SHORT_SHA}"

# publish-pypi.yml: the build step on a release tag. The upload needs the
# PyPI token and stays on GitHub (see the gap list).
build:pypi-package:
  extends: .python_job
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - python -m pip install --upgrade pip
    - pip install build
  script:
    - python -m build
  artifacts:
    expire_in: 14 days
    paths:
      - dist/*
