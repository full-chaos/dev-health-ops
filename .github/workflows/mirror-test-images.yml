# Mirror the Go test-dependency images to ghcr.io.
#
# WHY (CHAOS-4778): every Testcontainers-backed job pulls these four images from
# Docker Hub. Even authenticated, that quota is shared across the whole fleet,
# and on 2026-09-02 it ran out mid-day: `Login Succeeded!` followed 0.6 s later
# by `toomanyrequests: You have reached your unauthenticated pull rate limit`,
# taking go-quality, all six storage shards and river-compatibility down at once
# on every branch. Mirroring removes Docker Hub from the CI pull path entirely.
#
# DIGESTS ARE PRESERVED, and that is the whole point: `docker buildx imagetools
# create` copies the manifest verbatim, so the mirrored ref carries the SAME
# sha256 as the upstream one and every pin in the repository stays a literal.
# A naive `docker pull && docker tag && docker push` would NOT do this -- for a
# multi-arch image it extracts one platform and republishes a different
# manifest, silently changing the digest. The verify step below fails the run if
# the digests ever diverge, so this cannot rot quietly.
name: Mirror test images

on:
  workflow_dispatch:
  schedule:
    # Weekly. Upstream tags are pinned by digest, so this only refreshes the
    # mirror's own retention; it is not chasing upstream changes.
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - internal/testsupport/containers/harness.go
      - ci/check_go.sh
      # The river compose is an INPUT to this workflow (its images are mirrored
      # too), so a pin bump there must re-run the mirror. Without this, bumping
      # only the pgbouncer digest runs river CI against a ghcr ref that was
      # never copied.
      - tests/compatibility/river/compose.compatibility.yml
      - .github/workflows/mirror-test-images.yml
  pull_request:
    paths:
      - internal/testsupport/containers/harness.go
      - ci/check_go.sh
      # The river compose is an INPUT to this workflow (its images are mirrored
      # too), so a pin bump there must re-run the mirror. Without this, bumping
      # only the pgbouncer digest runs river CI against a ghcr ref that was
      # never copied.
      - tests/compatibility/river/compose.compatibility.yml
      - .github/workflows/mirror-test-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-test-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Forks get neither the Docker Hub secrets nor packages:write, so the job
    # would fail at login rather than do anything useful.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NO Docker Hub login, deliberately. Reading a handful of manifests per run
      # fits comfortably inside the anonymous per-runner-IP allowance (100/hour),
      # and it means CI holds no Docker Hub account at all. Verified locally: the
      # same copies succeed anonymously.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read the set from ci/check_go.sh rather than restating it here: one
      # parser, so the mirror and the pre-pull cannot drift apart.
      - name: Resolve every image CI pulls from Docker Hub
        id: images
        run: |
          set -euo pipefail
          # Two sources, both DERIVED so neither can drift from what CI runs:
          #   1. the Go test harness, via check_go.sh's own parser
          #   2. compose files used by CI jobs -- river-compatibility pulls
          #      edoburu/pgbouncer, which lives in no Go file and was missed on
          #      the first pass precisely because it was restated nowhere.
          bash ci/check_go.sh integration-images | awk -F'\t' 'NF == 2' | cut -f2 > images.raw
          for compose in tests/compatibility/river/compose.compatibility.yml; do
            test -f "${compose}" || { echo "::error::compose file missing: ${compose}"; exit 1; }
            # The compose file parameterises its refs as ${TEST_IMAGE_PREFIX:-}<ref>
            # so CI can redirect them at this mirror. Strip that expansion to get
            # back to the UPSTREAM ref, which is what must be mirrored FROM.
            sed -nE 's/^[[:space:]]*image:[[:space:]]*(\$\{[^}]*\})?([^[:space:]#]+).*$/\2/p' \
              "${compose}" >> images.raw
          done
          sort -u images.raw > images.txt
          test -s images.txt || { echo "::error::no images resolved"; exit 1; }
          # Refuse to mirror anything still carrying an unexpanded shell variable
          # rather than pushing a garbage ref. This fired for real: parameterising
          # the compose file broke this parser, and without the guard the failure
          # surfaced as an opaque "invalid reference format" from buildx.
          if grep -q '[$]' images.txt; then
            echo "::error::unresolved variable in an image ref:"
            grep '[$]' images.txt
            exit 1
          fi
          echo "--- images to mirror ---"
          cat images.txt

      # Destinations PRESERVE the upstream path under the mirror:
      #   postgres:18-alpine@sha256:X      -> ghcr.io/<owner>/postgres:18-alpine
      #   clickhouse/clickhouse-server@X   -> ghcr.io/<owner>/clickhouse/clickhouse-server:mirrored
      #   testcontainers/ryuk:0.14.0       -> ghcr.io/<owner>/testcontainers/ryuk:0.14.0
      # That is not cosmetic. TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX works by
      # PREPENDING itself to the image name, so a path-preserving mirror lets one
      # env var redirect every Docker Hub pull -- including the reaper, whose name
      # testcontainers-go hardcodes and offers no other way to override. A flat
      # rename would be unreachable by that mechanism.
      - name: Mirror each image to ghcr.io, preserving its digest
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          while read -r image; do
            [ -n "${image}" ] || continue
            ref="${image}"
            case "${ref}" in *@sha256:*) ref="${ref%@*}" ;; esac
            case "${ref}" in
              *:*) repo="${ref%:*}"; tag="${ref##*:}" ;;
              *)   repo="${ref}";    tag="mirrored"   ;;
            esac
            dest="ghcr.io/${OWNER}/${repo}:${tag}"
            printf '\n=== from %s\n    to   %s\n' "${image}" "${dest}"
            docker buildx imagetools create --tag "${dest}" "${image}"
          done < images.txt

      - name: Verify every mirrored digest matches upstream
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          failed=0
          while read -r image; do
            [ -n "${image}" ] || continue
            ref="${image}"
            case "${ref}" in *@sha256:*) ref="${ref%@*}" ;; esac
            case "${ref}" in
              *:*) repo="${ref%:*}"; tag="${ref##*:}" ;;
              *)   repo="${ref}";    tag="mirrored"   ;;
            esac
            dest="ghcr.io/${OWNER}/${repo}:${tag}"
            mirrored=$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "${dest}")
            case "${image}" in
              # Digest-pinned upstream: the mirrored manifest MUST carry the same
              # sha256. That equality is what lets every pin in the repository
              # stay a literal while the pull is redirected to the mirror.
              *@sha256:*)
                want="${image##*@}"
                if [ "${mirrored}" = "${want}" ]; then
                  printf 'OK   %-34s %s\n' "${repo}" "${mirrored}"
                else
                  printf 'FAIL %-34s mirrored=%s want=%s\n' "${repo}" "${mirrored}" "${want}" >&2
                  failed=1
                fi
                ;;
              # Tag-pinned upstream (the reaper: testcontainers-go hardcodes the
              # tag and offers no override). Nothing to assert against, so record
              # what the mirror now serves.
              *)
                printf 'NOTE %-34s tag-pinned upstream, mirrored digest %s\n' "${repo}" "${mirrored}"
                ;;
            esac
          done < images.txt
          exit "${failed}"

  # Reports the ANONYMOUS per-runner-IP Docker Hub allowance -- the only one this
  # workflow now depends on, since it holds no Docker Hub account.
  #
  # History, because the numbers explain the design: while CI authenticated as a
  # personal account, this probe measured `200;w=3600` with 65 remaining -- 200
  # pulls per HOUR shared fleet-wide, against ~8 container jobs x 4 images per Go
  # run. It hit zero the same afternoon and took every Testcontainers job down on
  # every branch. That is why CI no longer uses that account at all.
  #
  # Kept as a permanent diagnostic: the next `toomanyrequests` is one dispatch
  # rather than an investigation.
  ratelimit-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the Docker Hub rate limit for this account
        run: |
          set -euo pipefail
          # NO `-f` on either call, deliberately. `curl -f` turns a 429 into exit
          # 22 with no body and no headers -- so the diagnostic died exactly in
          # the situation it exists to diagnose (observed 2026-09-02 14:17: the
          # probe failed with `curl: (22) ... error: 429` and reported nothing).
          # A probe that only works when nothing is wrong is not a probe.
          token_body=$(curl -sSL -w '\n%{http_code}' \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:ratelimitpreview/test:pull")
          token_status="${token_body##*$'\n'}"
          token=$(printf '%s' "${token_body}" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ "${token_status}" = "429" ]; then
            echo "--- Docker Hub rate limit ---"
            echo "429 from the TOKEN endpoint: the account is fully rate limited."
            echo "=> quota exhausted. Wait for the window to roll over, or raise the plan."
            echo "   Do not retry in a loop; each attempt extends the exhaustion."
            exit 0
          fi
          if [ -z "${token}" ]; then
            echo "::error::no token returned (HTTP ${token_status}) for the configured credentials"
            exit 1
          fi
          headers=$(curl -sSI -H "Authorization: Bearer ${token}" \
            https://registry-1.docker.io/v2/ratelimitpreview/test/manifests/latest)
          limit=$(printf '%s\n' "${headers}" | grep -i '^ratelimit-limit:' || true)
          remaining=$(printf '%s\n' "${headers}" | grep -i '^ratelimit-remaining:' || true)
          echo "--- Docker Hub rate limit, authenticated as the configured account ---"
          if [ -z "${limit}${remaining}" ]; then
            echo "no ratelimit headers returned"
            echo "=> unmetered plan (Pro/Team/Business): pull limits are not the cause"
          else
            printf '%s\n%s\n' "${limit}" "${remaining}"
            echo "=> metered plan. The 'w=' value is the window IN SECONDS"
            echo "   (w=3600 is hourly, w=21600 six-hourly); remaining=0 means exhausted."
          fi
