query Home($orgId: String!, $filters: FilterInput, $window: HomeWindowInput) {
  home(orgId: $orgId, filters: $filters, window: $window) {
    freshness {
      lastIngestedAt
      latestSuccessfulSyncAt
      sources {
        provider
        status
        __typename
      }
      coverage {
        reposCoveredPct
        prsLinkedToIssuesPct
        issuesWithCycleStatesPct
        __typename
      }
      __typename
    }
    deltas {
      metric
      label
      value
      unit
      deltaPct
      spark {
        ts
        value
        __typename
      }
      __typename
    }
    reworkThemeAllocation {
      theme
      label
      allocation
      allocationPct
      prsMerged
      churnLoc
      __typename
    }
    summary {
      id
      text
      evidenceLink
      __typename
    }
    tiles {
      key
      value {
        title
        subtitle
        link
        __typename
      }
      __typename
    }
    constraint {
      title
      claim
      evidence {
        label
        link
        __typename
      }
      experiments
      __typename
    }
    events {
      ts
      type
      text
      link
      __typename
    }
    healthState {
      status
      headline
      summary
      asOf
      __typename
    }
    signals {
      id
      title
      metric
      currentValue
      priorValue
      delta
      direction
      severity
      confidence
      affectedScope
      evidenceCount
      whyItMatters
      recommendedAction
      evidenceRef
      category
      scopeEntity {
        id
        displayName
        __typename
      }
      __typename
    }
    limitingFactor {
      claim
      whyItMatters
      recommendedAction
      confidence
      evidenceRef
      __typename
    }
    dataConfidence {
      level
      coveragePct
      connectedSources
      missingSources
      caveats
      __typename
    }
    __typename
  }
}