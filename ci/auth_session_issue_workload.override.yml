# Proof-only override: go-api presents its workload token to auth-service on Compose. It overlays
# ci/auth_compose_proof.override.yml and ci/auth_webproof_compose.override.yml (the proxy flags are ON only in proofs).
# compose.yml owns the wiring: the bootstrap one-shots, the workload_bootstrap volume, go-api's read-only mount and
# AUTH_WORKLOAD_BOOTSTRAP_FILE, and the blank defaults of AUTH_WORKLOAD_BOOTSTRAP and AUTH_TOKEN_ISSUER_URL. This file
# switches the bootstrap on and adds what only a proof needs (membership routes, console mail, the probe).
#
# Compose has no Kubernetes: auth-service mounts the exchange with AUTH_WORKLOAD_BOOTSTRAP alone. AUTH_WORKLOAD_EXCHANGE
# stays unset, because it requires the TokenReview settings. The issuer is a signed claim: it must be https, and nothing
# dials it. go-api and auth-service read the same AUTH_TOKEN_ISSUER_URL.
#
# Order, run by the caller with --profile auth (auth-workload-bootstrap is not a depends_on of go-api: a later `up` would
# run it again, and bootstrap-create refuses a workload with a live credential):
#   0. export AUTH_TOKEN_ISSUER_URL=https://auth.workload-proof.example
#   1. run --rm auth-workload-bootstrap   (compose.yml) first runs the volume and seed one-shots, seeds the registry and
#                                         writes the credential to the volume (0600, uid 65532)
#   2. read auth.workloads.principal_id of api, export AUTH_SESSION_ISSUE_WORKLOAD_SUBJECT=prn_<base64url of the 16 bytes>
#   3. up go-api auth-service
# Profile auth-probe adds a probe of the exchange and of the routes that take the token (ci/auth_workload_probe, a fixed
# relative bind: no variable stands in the way of any other compose command).
services:
  auth-service:
    environment:
      AUTH_WORKLOAD_BOOTSTRAP: "true"
      AUTH_MEMBERSHIP_ROUTES: "true"
      AUTH_INVITE_TOKEN_SECRET: ${AUTH_INVITE_TOKEN_SECRET:?AUTH_INVITE_TOKEN_SECRET must be set}
      AUTH_INVITE_TOKEN_SECRET_PREVIOUS: ${AUTH_INVITE_TOKEN_SECRET_PREVIOUS:?AUTH_INVITE_TOKEN_SECRET_PREVIOUS must be set}
      # AUTH_USERS_OWNED: auth-service serves the credential routes, and they need these mail settings. The console provider
      # delivers no mail: this overlay proves the token path, not sign-up.
      EMAIL_FROM_ADDRESS: proof@example.test
      EMAIL_PROVIDER: console
      AUTH_MAIL_ALLOW_CONSOLE: "true"
      APP_BASE_URL: https://app.example.test

  go-api:
    environment:
      EMAIL_PROVIDER: console
      # AUTH_USERS_OWNED on needs it: go-api refuses to start otherwise.
      AUTH_PROXY_CREDENTIALS: "true"
      AUTH_PROXY_ORG_PROVISIONING: "true"
      # workload, or empty for go-api's session credential on the provisioning routes (an empty value is the unset default).
      AUTH_PROVISIONING_CREDENTIAL: ${AUTH_PROVISIONING_CREDENTIAL:-}
      # workload, or empty for go-api's session credential on the session issue route (an empty value is the unset default).
      AUTH_SESSION_ISSUE_CREDENTIAL: ${AUTH_SESSION_ISSUE_CREDENTIAL:-}

  # Presents the credential through stdin and files, never argv: it prints status lines only.
  auth-workload-probe:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    profiles: [auth-probe]
    networks: [auth_plane]
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    entrypoint: ["/bin/sh", "-eu", "/probe/auth-workload-probe.sh"]
    volumes:
      - type: volume
        source: workload_bootstrap
        target: /run/workload
        read_only: true
      - type: bind
        source: ./ci/auth_workload_probe
        target: /probe
        read_only: true
