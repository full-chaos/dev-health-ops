{{- /*
CHAOS-10446: the HS256 access-token key in its own Secret, created only when the chart
creates secrets and no external hs256 Secret is named. The shared Secret
(templates/secret.yaml) never carries JWT_SECRET_KEY.
*/}}
{{- if and .Values.secrets.create (not .Values.hs256Secret.externalSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dev-health.hs256SecretName" . }}
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secrets.data.JWT_SECRET_KEY }}
stringData:
  JWT_SECRET_KEY: {{ . | quote }}
{{- end }}
{{- end }}
