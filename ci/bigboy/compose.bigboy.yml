  # ---- the acr venue stack (CHAOS-10004): was the compose project dev-health-acr-mcp on this host ----
  # Profiles: `acr` starts everything; `acr-venue` starts only what must exist before acr-api (the database, its roles, the
  # migrations, the grants). Start with plain docker compose:
  #   docker compose -p dev-health --project-directory "$BIGBOY_ROOT" --env-file ops/.env --env-file _records/images.env \
  #     -f ops/ci/bigboy/compose.bigboy.yml --profile acr up -d --no-deps --no-build <service>
  # Every long-running service is in `acr` (a service whose dependency is in an inactive profile is an invalid project, so
  # the dependencies carry both profiles). No secret VALUE is in this file: only the host paths of the secret files, which
  # are mounted read-only by compose as /run/secrets/<name> and live in /var/lib/oci-cache/mcp-venue/secrets/.
  # Data: the two bind mounts keep the host paths the old project used, so moving the stack here changes no data.
  # Hostnames: container_name is the old project's name, and the aliases `postgres` and `falkordb` exist on the acr network
  # only (the dev-health `postgres` stays unreachable from the acr services), so no acr setting changes.
  # acr-api talks to the REAL ops (the venue moved off the stand-in, CHAOS-10004): ACR_DEV_HEALTH_ENTITLEMENT_URL defaults to the go-api
  # internal listener by alias, http://go-api:8091 (acr-api is on dho-query-internal, where go-api listens), and the bearer is a
  # workload token (CHAOS-12976, the prod shape): ACR_DEV_HEALTH_ENTITLEMENT_CREDENTIAL=workload, and acr-api exchanges the Compose
  # bootstrap credential of the workload acr-api (the volume acr_workload_bootstrap, written by acr-workload-bootstrap, profile auth)
  # at auth-service (the auth venue below) for a token of audience dev-health-api. go-api verifies it against the issuer's JWKS and
  # the principal of the workload acr-api in the registry (go-api's role reads it: AUTH_WORKLOAD_READER_ROLES on auth-migrate and auth-grants). There is no service token. CHAOS-12997: acr reads an org's BYO LLM config from ops'
  # internal route with that token (scope llm_config:read) whenever it has an entitlement client; the
  # ACR_CONTEXT_FABRIC_ORG_LLM_CONFIG_SOURCE setting was removed from acr and is not passed.
  # The entitlement stand-in is gone (CHAOS-12976): prod has none (deploy values.acr-prod.yaml "No stand-in on prod"), and it checked
  # a static bearer where acr-api now sends a workload token.
  # Every acr image is pinned by registry digest in the pins file _records/images.env (BIGBOY_ACR_API_IMAGE, BIGBOY_ACR_MCP_IMAGE, BIGBOY_ACR_POSTGRES_IMAGE,
  # BIGBOY_ACR_FALKORDB_IMAGE, BIGBOY_ACR_NGINX_IMAGE); each is REQUIRED (`:?`): with a pin missing every compose command fails, naming it, instead of
  # a default tag that could start a wrong image. So the acr lines must be in a host's _records/images.env BEFORE its checkout holds this file.
  # acr-api and acr-mcp are the images of the acr release build; a build on this host needs --build-arg VERSION=0.1.0 --build-arg COMMIT=<full sha>
  # (without both args acr-api refuses the sidecar with a 426).
  acr-db-acl:
    container_name: dev-health-acr-mcp-acr-db-acl-1
    depends_on:
      acr-migrate:
        condition: service_completed_successfully
      acr-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
        reservations:
          cpus: 0.05
          memory: 64M
    entrypoint: [/usr/local/bin/acr-db-init]
    command: [runtime-acl]
    environment:
      ACR_DB_NAME: ${ACR_DB_NAME:-acr}
      ACR_ENABLE_EPISODE_WRITEBACK: 'false'
      ACR_MIGRATION_DB_PASSWORD_FILE: /run/secrets/acr_migration_db_password
      ACR_MIGRATION_DB_USER: ${ACR_MIGRATION_DB_USER:-acr_migration}
      ACR_RUNTIME_DB_PASSWORD_FILE: /run/secrets/acr_runtime_db_password
      ACR_RUNTIME_DB_USER: ${ACR_RUNTIME_DB_USER:-acr_runtime}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/acr_postgres_password
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${ACR_POSTGRES_ADMIN_USER:-acr_admin}
    image: ${BIGBOY_ACR_POSTGRES_IMAGE:?BIGBOY_ACR_POSTGRES_IMAGE is required (the acr image pin of ci/bigboy/images.env, kept in _records/images.env)}
    networks:
      acr: null
    profiles: [acr, acr-venue]
    restart: 'no'
    secrets: [acr_postgres_password, acr_runtime_db_password, acr_migration_db_password]
    volumes:
    - type: bind
      source: ${ACR_DB_INIT_SCRIPT:?ACR_DB_INIT_SCRIPT is required (a line of the pins file ci/bigboy/images.env, kept in _records/images.env; acr-db-init-fetch.sh writes the script there at the pinned acr commit)}
      target: /usr/local/bin/acr-db-init
      read_only: true
  acr-db-init:
    container_name: dev-health-acr-mcp-acr-db-init-1
    depends_on:
      acr-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
        reservations:
          cpus: 0.05
          memory: 64M
    entrypoint: [/usr/local/bin/acr-db-init]
    command: [roles]
    environment:
      ACR_DB_NAME: ${ACR_DB_NAME:-acr}
      ACR_MIGRATION_DB_PASSWORD_FILE: /run/secrets/acr_migration_db_password
      ACR_MIGRATION_DB_USER: ${ACR_MIGRATION_DB_USER:-acr_migration}
      ACR_RUNTIME_DB_PASSWORD_FILE: /run/secrets/acr_runtime_db_password
      ACR_RUNTIME_DB_USER: ${ACR_RUNTIME_DB_USER:-acr_runtime}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/acr_postgres_password
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${ACR_POSTGRES_ADMIN_USER:-acr_admin}
    image: ${BIGBOY_ACR_POSTGRES_IMAGE:?BIGBOY_ACR_POSTGRES_IMAGE is required (the acr image pin of ci/bigboy/images.env, kept in _records/images.env)}
    networks:
      acr: null
    profiles: [acr, acr-venue]
    restart: 'no'
    secrets: [acr_postgres_password, acr_runtime_db_password, acr_migration_db_password]
    volumes:
    - type: bind
      source: ${ACR_DB_INIT_SCRIPT:?ACR_DB_INIT_SCRIPT is required (a line of the pins file ci/bigboy/images.env, kept in _records/images.env; acr-db-init-fetch.sh writes the script there at the pinned acr commit)}
      target: /usr/local/bin/acr-db-init
      read_only: true
  acr-migrate:
    container_name: dev-health-acr-mcp-acr-migrate-1
    depends_on:
      acr-db-init:
        condition: service_completed_successfully
      acr-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: 0.1
          memory: 128M
    entrypoint: [/usr/local/bin/acr-migrate]
    command: [up]
    environment:
      ACR_ENVIRONMENT: development
      ACR_POSTGRES_CONNECTION_KIND: direct
      ACR_POSTGRES_MIGRATION_DSN_FILE: /run/secrets/acr_migration_dsn
    image: ${BIGBOY_ACR_API_IMAGE:?BIGBOY_ACR_API_IMAGE is required (the acr image pin of ci/bigboy/images.env, kept in _records/images.env)}
    networks:
      acr: null
    profiles: [acr, acr-venue]
    restart: 'no'
    secrets: [acr_migration_dsn]
    user: 1001:1001
  acr-postgres:
    container_name: dev-health-acr-mcp-postgres-1
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1G
        reservations:
          cpus: 0.25
          memory: 256M
    environment:
      POSTGRES_DB: ${ACR_DB_NAME:-acr}
      POSTGRES_PASSWORD_FILE: /run/secrets/acr_postgres_password
      POSTGRES_USER: ${ACR_POSTGRES_ADMIN_USER:-acr_admin}
    healthcheck:
      interval: 10s
      retries: 5
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER}']
      timeout: 5s
    image: ${BIGBOY_ACR_POSTGRES_IMAGE:?BIGBOY_ACR_POSTGRES_IMAGE is required (the acr image pin of ci/bigboy/images.env, kept in _records/images.env)}
    networks:
      acr:
        aliases: [postgres]
    profiles: [acr, acr-venue]
    restart: unless-stopped
    secrets: [acr_postgres_password]
    volumes:
    - type: bind
      source: /var/lib/oci-cache/mcp-venue/postgres-data
      target: /var/lib/postgresql
  acr-api:
    container_name: dev-health-acr-mcp-acr-api-1
    command: [serve]
    depends_on:
      acr-db-acl:
        condition: service_completed_successfully
      acr-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: 0.1
          memory: 128M
    environment:
      ACR_ADDR: :8080
      ACR_AUTH_WORKLOAD_ALLOW_PLAIN_HTTP: 'true'
