query CapacityCompletionDistribution($orgId: String!, $teamId: String!, $historyDays: Int! = 90, $simulations: Int! = 10000) {
  capacityForecast(
    orgId: $orgId
    input: {teamId: $teamId, historyDays: $historyDays, simulations: $simulations}
  ) {
    completionDistribution {
      days {
        value
        count
        __typename
      }
      items {
        value
        count
        __typename
      }
      __typename
    }
    __typename
  }
}