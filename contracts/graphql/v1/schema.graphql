  totalCount: Int!
  pageInfo: PageInfo!
}

type SecurityAlertEdge {
  node: SecurityAlertNode!
  cursor: String!
}

input SecurityAlertFilterInput {
  repoIds: [String!] = null
  severities: [SecuritySeverityInput!] = null
  sources: [SecuritySourceInput!] = null
  states: [SecurityStateInput!] = null
  since: Date = null
  until: Date = null
  openOnly: Boolean! = false
  search: String = null
}

type SecurityAlertNode {
  alertId: String!
  repoId: String!
  repoName: String!
  repoUrl: String
  source: String!
  severity: String!
  state: String!
  packageName: String
  cveId: String
  url: String
  title: String
  description: String
  createdAt: DateTime!
  fixedAt: DateTime
  dismissedAt: DateTime
}

type SecurityKpis {
  openTotal: Int!
  critical: Int!
  high: Int!
  meanDaysToFix30d: Float
  openDelta30d: Int!
}

type SecurityOverview {
  kpis: SecurityKpis!
  severityBreakdown: [SeverityBucket!]!
  topRepos: [RepoAlertCount!]!
  trend: [TrendPoint!]!
}

input SecurityPaginationInput {
  first: Int! = 50
  after: String = null
}

enum SecuritySeverityInput {
  LOW
  MEDIUM
  HIGH
  CRITICAL
  UNKNOWN
}

enum SecuritySourceInput {
  DEPENDABOT
  CODE_SCANNING
  ADVISORY
  GITLAB_VULNERABILITY
  GITLAB_DEPENDENCY
}

enum SecurityStateInput {
  OPEN
  FIXED
  DISMISSED
  DETECTED
  CONFIRMED
  RESOLVED
}

enum Severity {
  WARNING
  CRITICAL
}

type SeverityBucket {
  severity: String!
  count: Int!
}

type SparkPoint {
  ts: String!
  value: Float!
}

type Subscription {
  """Subscribe to metrics updates for an organization"""
  metricsUpdated(orgId: String!): MetricsUpdate!

  """Subscribe to task status updates"""
  taskStatus(taskId: String!): TaskStatus!

  """Subscribe to data sync progress"""
  syncProgress(orgId: String!): SyncProgress!
}

type SyncProgress {
  orgId: String!
  provider: String!
  status: String!
  itemsProcessed: Int!
  itemsTotal: Int!
  message: String
  updatedAt: DateTime!
}

type TaskStatus {
  taskId: String!
  status: String!
  progress: Float!
  message: String
  result: String
  updatedAt: DateTime!
}

enum TeamAttributionConfidence {
  HIGH
  MEDIUM
  LOW
  MANUAL
  NONE
}

enum TeamAttributionSource {
