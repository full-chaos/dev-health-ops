version: "3.8"

# Go/River worker topology (CHAOS-5589: folded in as this stack's
# unconditional default, the same shape given to compose.production.yml).
# Independently maintained copy of
# deploy/docker-swarm/stack.go-workers.yml's services, which still exists
# separately for reference/diffing; the two are edited apart.
#
# CHAOS-4351 GAP (documented, not fixed here -- scoped to
# compose.yml/compose.production.yml + the Helm chart only, same posture as
# CHAOS-4317's own Swarm/Kubernetes gaps): this stack has no `metrics-api`
# service, so every worker group below -- including the one running the
# `metrics` queue -- still shares `api`'s stack via the single
# `flag-bridge-url`. Add an equivalent `metrics-api` service + a heavy-only
# flag override here if this stack is ever a real deploy target again.
x-go-worker-flag:
  http-addr: &flag-http-addr "--http-addr=:8080"
  river-schema: &flag-river-schema "--river-schema=${RIVER_DATABASE_SCHEMA:-river}"
  domain-role: &flag-domain-role "--domain-database-role=${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}"
  queue-role: &flag-queue-role "--queue-database-role=${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}"
  queue-mode: &flag-queue-mode "--queue-database-mode=${WORKER_DATABASE_MODE:-session}"
  coordinator-mode: &flag-coordinator-mode "--coordinator-database-mode=${COORDINATOR_DATABASE_MODE:-session}"
  domain-pooler: &flag-domain-pooler "--domain-transaction-pooler=${PGBOUNCER_TRANSACTION_MODE:-true}"
  bridge-url: &flag-bridge-url "--operational-bridge-url=${WORKER_OPERATIONAL_BRIDGE_URL:-http://api:8000}"
  bridge-insecure: &flag-bridge-insecure "--operational-bridge-allow-insecure=${WORKER_OPERATIONAL_BRIDGE_ALLOW_INSECURE:-true}"
  log-level: &flag-log-level "--log-level=${LOG_LEVEL:-info}"

x-go-worker: &go-worker
  image: ${DEV_HEALTH_GO_WORKER_IMAGE:-ghcr.io/full-chaos/dev-health-go-worker:latest}
  read_only: true
  user: "65532:65532"
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  environment: &go-worker-env-base
    POSTGRES_URI: ${POSTGRES_URI:?transaction-pooler domain PostgreSQL URI is required}
    WORKER_DATABASE_URI: ${WORKER_DATABASE_URI:?session-pooler queue-control PostgreSQL URI is required}
    CLICKHOUSE_URI: clickhouse://ch:ch@clickhouse:9000/default
    VALKEY_URI: redis://valkey:6379/1
    SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?provider credential encryption key is required}
    WORKER_OPERATIONAL_BRIDGE_TOKEN: ${WORKER_OPERATIONAL_BRIDGE_TOKEN:-}
    AUTO_RUN_MIGRATIONS: "false"
    OPERATIONAL_ORDERING_CONTRACT: ${OPERATIONAL_ORDERING_CONTRACT:-1}
  networks: [dev-health-internal]
  deploy: &go-worker-deploy
    mode: replicated
    replicas: 1
    update_config: {parallelism: 1, delay: 15s, failure_action: rollback, order: start-first}
    rollback_config: {parallelism: 1, delay: 15s, order: stop-first}
    restart_policy: {condition: on-failure, delay: 5s, max_attempts: 3}
    resources:
      limits: {cpus: "1.0", memory: 1G}
      reservations: {cpus: "0.25", memory: 256M}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_LISTEN_HOST: "0.0.0.0"
      CLICKHOUSE_USER: ch
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    secrets:
      - clickhouse_password
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 2G
          cpus: "1"
        reservations:
          memory: 512M
          cpus: "0.25"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - dev-health-internal

  valkey:
    image: valkey/valkey:8-alpine
    command: >
      valkey-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    security_opt:
      - no-new-privileges:true
    read_only: true
    volumes:
      - valkey_data:/data
    tmpfs:
      - /tmp
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: "0.2"
        reservations:
          memory: 64M
          cpus: "0.05"
      restart_policy:
        condition: on-failure
        delay: 5s
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - dev-health-internal

  # ===========================================================================
  # Database migrations (one-shot — CHAOS-2304)
  # ===========================================================================
  # Swarm has no depends_on/completion conditions: this service runs once
  # (restart_policy.condition: none) and operators MUST verify it completed
  # successfully before relying on the stack — see README.md:
  #   docker service logs dev-health_migrate
  # App services run with AUTO_RUN_MIGRATIONS=false and never ambient-migrate.
  #
  # MIGRATION_DATABASE_URI (Alembic + River) or compatibility POSTGRES_URI
  # (Alembic only) must point DIRECTLY at Postgres (port 5432), never at a
  # transaction-mode pooler. PostgreSQL migration is skipped when both are
  # unset (ClickHouse-only stacks).
  migrate:
    image: ghcr.io/your-org/dev-health-ops:latest
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    entrypoint:
      - sh
      - -c
      - >-
        if [ -z "$${MIGRATION_DATABASE_URI:-}" ];
        then unset MIGRATION_DATABASE_URI; fi;
        if [ -n "$$POSTGRES_URI" ]
        || [ "$${MIGRATION_DATABASE_URI+x}" = x ]
        || [ "$${MIGRATION_DATABASE_URI_FILE+x}" = x ];
        then dev-hops migrate postgres; fi
        && dev-hops migrate clickhouse
    environment:
      POSTGRES_URI: ${POSTGRES_URI:-}
      MIGRATION_DATABASE_URI: ${MIGRATION_DATABASE_URI:-}
      DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER: ${DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER:-}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      # CHAOS-4587 (codex delta round 2, P1): migration 067 checks this same
      # variable to decide whether to apply the ordering-contract cutover
      # (src/dev_health_ops/migrations/clickhouse/067_operational_ordering_contract.py) --
      # without a reference here, an operator's shell export never reaches
      # this container, 067 silently defers ("successfully"), and workers
      # wired to the same export (stack.go-workers.yml) start against a
      # still-contract-1 table. Must move with the worker export in the
      # same deploy pass; see deploy/go-workers/README.md.
      OPERATIONAL_ORDERING_CONTRACT: ${OPERATIONAL_ORDERING_CONTRACT:-1}
      CLICKHOUSE_URI: clickhouse://ch:ch@clickhouse:8123/default
      LOG_LEVEL: INFO
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    networks:
      - dev-health-internal

  api:
    image: ghcr.io/your-org/dev-health-ops:latest
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    environment:
      POSTGRES_URI: postgresql+asyncpg://devhealth:${POSTGRES_PASSWORD}@postgres:5432/devhealth
      DATABASE_URI: postgresql+asyncpg://devhealth:${POSTGRES_PASSWORD}@postgres:5432/devhealth
      CLICKHOUSE_URI: clickhouse://ch:ch@clickhouse:8123/default
      REDIS_URL: redis://valkey:6379/1
      CELERY_BROKER_URL: redis://valkey:6379/0
      CELERY_RESULT_BACKEND: redis://valkey:6379/0
      # CHAOS-5589: Go/River is this stack's unconditional default now, so
      # /health/workers is Go-fleet-authoritative -- see api/_health.py.
      EXPECTED_WORKER_GROUPS: ${EXPECTED_WORKER_GROUPS:-heavy,ops,sync,sync-provider}
      GRAPHQL_QUERY_TIMEOUT: "30"
      LOG_LEVEL: INFO
      # The API serves the worker operational bridge and authenticates the Go
      # caller against this shared token; without it every bridge call from
      # the PagerDuty stream runner is rejected with 401.
      WORKER_OPERATIONAL_BRIDGE_TOKEN: ${WORKER_OPERATIONAL_BRIDGE_TOKEN:-}
      # Schema is applied by the one-shot `migrate` service — the API must
      # never run migrations itself (CHAOS-2304).
      AUTO_RUN_MIGRATIONS: "false"
    # CHAOS-4317: unlike compose.production.yml, Swarm mode has NO
    # equivalent of the classic `pids_limit` service key -- `deploy.resources
    # .limits` (below) only supports cpus/memory, and Docker does not expose
    # a per-service pids cgroup cap in the Swarm spec at all. This means the
    # capacity gate's worker_metrics.py reader falls through to the
    # host-wide kernel.threads-max fallback on this deployment surface, with
    # no container-scoped ceiling available to set. Flagged, not fixed (no
    # platform mechanism exists) -- if this surface sees the same pids
    # exhaustion class, the fix has to be host-level (e.g. a dockerd
    # default-pids-limit daemon.json setting), not expressible per-stack here.
    secrets:
      - github_token
      - gitlab_token
      - jira_credentials
    ports:
      - "8000:8000"
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.1"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dev-health-api.rule=Host(`dev-health.example.com`)"
        - "traefik.http.services.dev-health-api.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dev-health-internal
      - dev-health-public

  # ---------------------------------------------------------------------------
  # Go/River worker fleet (CHAOS-5589). The Celery/Beat fleet this replaced
  # (worker, worker-ingest, worker-external-ingest, worker-heavy, beat;
  # ARCHIVED CHAOS-4164) is deleted outright, not merely archived-in-place --
  # R146: Celery transport is not a rollback target, and no consumer has run
  # since 2026-08-19 (CHAOS-4026). Independently maintained copy of
  # deploy/docker-swarm/stack.go-workers.yml's services, folded in here as
  # the unconditional default the same way given to compose.production.yml.
  # ---------------------------------------------------------------------------
  go-worker-heavy:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: heavy
    command:
      - "--queues=investment,metrics,reports,workgraph"
      - "--queue-concurrency=investment=1,metrics=2,reports=2,workgraph=1"
      - "--worker-group=heavy"
      - "--shutdown-timeout=7260s"
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    stop_grace_period: 7260s
  go-worker-ops:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: ops
    command:
      - "--queues=coverage,heartbeat,retention,webhooks"
      - "--queue-concurrency=coverage=1,heartbeat=1,retention=1,webhooks=4"
      - "--worker-group=ops"
      - "--shutdown-timeout=960s"
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    stop_grace_period: 960s
  go-worker-sync:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: sync
    command:
      - "--queues=sync"
      - "--queue-concurrency=sync=4"
      - "--worker-group=sync"
      - "--shutdown-timeout=960s"
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    stop_grace_period: 960s
  # Split from the sync worker: a combined service cannot start while provider
  # routes are default-off (CHAOS-3926). See compose.production.yml.
  go-worker-sync-provider:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: sync-provider
    command:
      - "--queues=sync_provider"
      - "--queue-concurrency=sync_provider=2"
      - "--worker-group=sync-provider"
      - "--shutdown-timeout=960s"
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    stop_grace_period: 960s
  go-reconciler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_RECONCILER_IMAGE:-ghcr.io/full-chaos/dev-health-go-reconciler:latest}
    labels:
      dev-health.io/worker-group: reconciler
    # CHAOS-3092 made "no Celery consumer serves provider units" true of every
    # deployment, which is exactly the assertion SweepModeActive encodes -- so
    # the sweep ships ACTIVE rather than as an operator opt-in.
    command:
      - "--shutdown-timeout=60s"
      - "--unreclaimable-sweep=${SYNC_UNRECLAIMABLE_SWEEP:-active}"
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    environment:
      <<: *go-worker-env-base
      COORDINATOR_DATABASE_URI: "${COORDINATOR_DATABASE_URI:?session-pooler coordinator PostgreSQL URI is required}"
    stop_grace_period: 60s
  go-scheduler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_SCHEDULER_IMAGE:-ghcr.io/full-chaos/dev-health-go-scheduler:latest}
    labels:
      dev-health.io/worker-group: scheduler
    command:
      - "--shutdown-timeout=60s"
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    environment:
      <<: *go-worker-env-base
      COORDINATOR_DATABASE_URI: "${COORDINATOR_DATABASE_URI:?session-pooler coordinator PostgreSQL URI is required}"
    stop_grace_period: 60s
  go-stream-external:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    labels:
      dev-health.io/worker-group: stream-external
    command:
      - "--profile=external"
      - "--shutdown-timeout=60s"
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s
  go-stream-ingest:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    labels:
      dev-health.io/worker-group: stream-ingest
    command:
      - "--profile=ingest"
      - "--shutdown-timeout=60s"
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s
  go-stream-pagerduty:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    labels:
      dev-health.io/worker-group: stream-pagerduty
    command:
      - "--profile=pagerduty"
      - "--shutdown-timeout=60s"
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s

volumes:
  clickhouse_data:
    driver: local
  valkey_data:
    driver: local

networks:
  dev-health-internal:
    driver: overlay
    internal: true
  dev-health-public:
    driver: overlay

secrets:
  clickhouse_password:
    external: true
  github_token:
    external: true
  gitlab_token:
    external: true
  jira_credentials:
    external: true
