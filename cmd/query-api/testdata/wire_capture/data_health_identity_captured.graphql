query DataHealthIdentity($team: ID!) {
  dataHealth(team: $team) {
    identityMapping {
      unmappedCount
      unmappedIdentities {
        provider
        email
        displayName
        observedCount
        __typename
      }
      suggestedAliases {
        unmappedIdentity {
          provider
          email
          displayName
          __typename
        }
        suggestedCanonicalId
        confidence
        __typename
      }
      __typename
    }
    __typename
  }
}