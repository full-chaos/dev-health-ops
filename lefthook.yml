# Pre-commit + pre-push hooks for ruff format + lint, plus a mypy type-check gate.
#
# Design rationale:
#   - pre-commit hook auto-fixes formatting + lint on staged files and
#     re-stages the fixes (stage_fixed: true) so the resulting commit is clean.
#     stage_fixed only works in pre-commit context, which is why fix-and-stage
#     lives here and not in pre-push.
#   - pre-push hook is a final gate; it runs `ruff format --check` and
#     `ruff check` on pushed files but does NOT attempt to auto-fix. Pre-push
#     cannot modify the commits being pushed (git's model), so auto-fix would
#     leave uncommitted changes in the working tree and block the push without
#     resolving anything. Final-gate-without-auto-fix is the correct shape here.
#   - mypy runs as a non-fixable gate in BOTH pre-commit and pre-push. It type-
#     checks the whole project (the `files` set in [tool.mypy], not just staged
#     files) because per-file mypy is unreliable — it needs full module context.
#     The glob "*.py" means it only fires when Python files are involved, and the
#     incremental cache (.mypy_cache/) keeps warm runs well under a second.
#     Every Python tool here goes through scripts/run_py_tool.sh so it always
#     resolves the PROJECT environment. A bare tool name picks up whatever is
#     first on PATH -- or nothing at all -- and
#     in a worktree that is a global interpreter carrying a shadow copy of our
#     dependencies -- which produced phantom errors in untouched files while CI
#     stayed green (CHAOS-3913).
#   - Either hook can be skipped with `--no-verify` for WIP or emergency pushes.
#
# Install: `make install` (wires `lefthook install` into the bootstrap).

commit-msg:
  commands:
    strip-agent-attribution:
      # AGENTS.md rule: "Never add contribution attribution for agents in commits."
      # Sisyphus / oh-my-openagent / Claude Code and similar agents inject
      # "Ultraworked with ..." and "Co-authored-by: <agent>" trailers despite
      # the repo rule; this hook strips them before the commit lands.
      run: python3 scripts/strip_agent_attribution.py {1}

pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: scripts/run_py_tool.sh ruff format {staged_files}
      stage_fixed: true
    ruff-fix:
      glob: "*.py"
      run: scripts/run_py_tool.sh ruff check --fix {staged_files}
      stage_fixed: true
    mypy:
      glob: "*.py"
      run: scripts/run_py_tool.sh mypy
      fail_text: "mypy found type errors. Fix them, or `git commit --no-verify` to bypass (discouraged)."

pre-push:
  parallel: true
  commands:
    ruff-format-check:
      glob: "*.py"
      run: scripts/run_py_tool.sh ruff format --check {push_files}
      fail_text: "Run `ruff format .` locally, commit the result, push again. Or `git push --no-verify` to bypass."
    ruff-check:
      glob: "*.py"
      run: scripts/run_py_tool.sh ruff check {push_files}
      fail_text: "Run `ruff check --fix .` locally, commit the result, push again. Or `git push --no-verify` to bypass."
    mypy:
      glob: "*.py"
      run: scripts/run_py_tool.sh mypy
      fail_text: "mypy found type errors. Run `mypy` locally, fix them, commit, push again. Or `git push --no-verify` to bypass."
    shellcheck-pin:
      # CHAOS-4915. Same pinned version and same file set as CI, from one
      # source of truth (ci/shellcheck_pinned.sh), so local and CI cannot
      # disagree. Before this, CI linted shell and nothing local did, so the
      # only way to discover an unclean script was to fail the build.
      #
      # Runs the SELF-TEST rather than the linter directly: the self-test also
      # asserts the unclean fixture is still rejected, which is what catches a
      # linter that has silently stopped linting. A lint step that checks
      # nothing reports exactly what a clean tree reports.
      glob: "*.sh"
      run: bash ci/check_shellcheck_pin.sh
      fail_text: "shellcheck (pinned 0.11.0) failed, or the pin itself is misconfigured. Run `bash ci/check_shellcheck_pin.sh` for the detail. Do NOT use --no-verify: a version mismatch here means your local ruleset differs from CI's, so a local pass would not mean what CI means by a pass."
