{{- /*
CHAOS-7023 (sibling of CHAOS-7022, the bigboy-cut.sh equivalent) / CHAOS-7016 / D2811.

go_api_routing_state rows are keyed by schema_digest. A roll that changes the GraphQL SDL
computes a NEW digest and un-routes every currently-enabled operation the instant the first
new pod starts, unless `dho goapi routing carry` has already copied those rows forward against
the STILL-LIVE pre-roll query-api -- see docs/contribute/architecture/go-api-wave-0-proof-
infrastructure.md, "When the schema digest moves". Separately, rows can lag the actually-
running build after an ORDINARY roll with no schema change at all, if nothing repoints them --
the exact gap the real rev196 prod roll hit (_records/bigboy-1b05473e/prod-rev196-step1.5-carry-
lines.md, _records/deploy-196/README.md): rows still named a build from TWO rolls back.

Two hook Jobs close both gaps, structurally, the way CHAOS-7022 does for bigboy-cut.sh:

  - pre-upgrade: `dho goapi routing carry` against the still-live pre-roll query-api. Refuse-
    not-skip: any refusal OTHER than carry's own "digests already agree" (an ordinary,
    non-schema-changing roll -- expected, not a failure) fails the upgrade. One documented,
    real exception: a stale-build refusal (rows lagging the actually-running build, no schema
    change involved -- the rev196 shape) triggers a `repoint` against the same live process,
    then ONE retry of carry; only a second refusal is fatal.
  - post-upgrade: `dho goapi routing repoint`, unconditionally, every roll (provenance-only,
    never touches reachability) -- this is what would have caught rev196's own gap before it
    needed a manual 50-row repoint mid-roll.

D2828/D2829 (#3369 r1): both hooks branch on `dho ... -json`'s `reason` field (a small,
closed vocabulary the Go CLI sets at the call site that knows why -- "carried",
"digest_unchanged", "stale_build", "refused", "error" for carry; "repointed", "refused",
"error" for repoint -- internal/goapicli/routing/carry.go's carryResult doc comment), never
on the human-readable error text: that text was wrong TWICE during this ticket's own review
(a hand-typed guess that never matched the real Go string, then a "fix" that broke a DIFFERENT
already-correct branch by reasoning from the wrong Go call site) before landing on this
structural fix. The go-api-tools image carries no `jq` (docker/go-api-tools.Dockerfile's
runtime base is bare debian-slim, and adding one is a separate image-rebuild decision this
PR does not make), so `reason` is read with `grep`+`sed` against the JSON line's known,
controlled shape (this Job's own `dho` always emits `reason` as the FIRST field) rather than
a real JSON parser.

D2829 P2-a: gates on `queryApi.enabled` ONLY, never `migrations.hook.enabled` -- these two
Jobs are not migrations (see values.yaml's migrations.hook.goApiRoutingTools comment: no
enable/disable knob, this is a gate), and an operator disabling migrations for an unrelated
reason must not silently disable the routing safety gate as a side effect.

D2829 P2-b: the tools image's commit is cross-checked against `queryApi.image` (the image
actually being rolled), inline rather than via `dev-health.lockstepImageCheck` -- that shared
helper hardcodes its comparison target to `dev-health.image` (`.Values.image`, the PYTHON api
image), which is the WRONG reference for a Go-only concern: the tools image's embedded SDL
must agree with the GO query-api image's, never the Python api's, or `carry` could compute a
target digest for a commit the actual roll never runs.

Neither hook renders on pre-install: carry's whole premise is a live, already-running process
to copy FROM, which does not exist on a fresh install.

D2830 (#3369 collateral regression on P2-a): gating on `.Values.queryApi.enabled` ALONE
(with no `.Release.IsUpgrade` check) meant this whole block -- Jobs AND the image-pin/
mintOrg/lockstep `fail` checks -- rendered on ANY `helm template`/`helm install` with
queryApi.enabled=true, including renders that only care about an unrelated resource (the
query-api Deployment itself) and never set `migrations.hook.goApiRoutingTools.image`. A
`fail` anywhere in any template aborts the WHOLE render, so those unrelated renders broke
too. These Jobs are annotated pre-upgrade/post-upgrade ONLY -- Helm never creates or runs
them during an install, matching the "neither hook renders on pre-install" premise above --
so the pin check has no real subject to validate outside an upgrade either. Gating the
block on `.Release.IsUpgrade` (Helm's own signal for "this is really an upgrade", set on a
real `helm upgrade`, or on `helm template --is-upgrade` for a test that wants to exercise
this path) scopes the check to renders where the hook Jobs will really render and run,
without weakening it there: every render that sets `--is-upgrade` still gets the identical
image-pin/mintOrg/lockstep validation as before -- see
tests/workers/test_helm_routing_carry_hooks.py, whose `_render`/`_render_stderr` helpers
now pass `--is-upgrade` for exactly this reason.
*/}}
{{- if and .Values.queryApi.enabled .Release.IsUpgrade }}
{{- $tools := .Values.migrations.hook.goApiRoutingTools }}
{{- $toolsImage := $tools.image }}
{{- $toolsPullPolicy := $tools.pullPolicy | default "IfNotPresent" }}
{{- /*
Pin-shape check, inline rather than dev-health.pinnedOperatorImageCheck: that helper's identity
check requires a bare-dho-ENTRYPOINT image (route-activate/river-hooks/migrate-job's own
invocation shape) and explicitly denies dev-health-go-api-tools by name -- see _helpers.tpl's
own comment on why (it has no ENTRYPOINT set; these hooks override `command` themselves to run
a shell chain, which is exactly what that image is built to allow, docker/go-api-tools.
Dockerfile's own comment: "the operator's one-off corrective-verb pod"). Same pin-shape rule as
every other hook image otherwise: required, no floating default.
*/}}
{{- $toolsDigestPinned := regexMatch "@sha256:[0-9a-f]{64}$" $toolsImage }}
{{- $toolsImmutableTag := regexMatch "^.+:sha-[0-9a-f]{12}$" $toolsImage }}
{{- $toolsSideloadedLocal := and (regexMatch "^.+:local$" $toolsImage) (or (eq $toolsPullPolicy "Never") (eq $toolsPullPolicy "IfNotPresent")) }}
{{- if not (or $toolsDigestPinned $toolsImmutableTag $toolsSideloadedLocal) }}
{{- fail (printf "migrations.hook.goApiRoutingTools.image (%s) is not a pinned image. It runs the pre/post-upgrade go-api routing carry/repoint hooks: set it to repo@sha256:<64 lowercase-hex-digit digest> or repo:sha-<12 hex>; repo:local is accepted only with pullPolicy Never or IfNotPresent." $toolsImage) }}
{{- end }}
{{- /*
D2829 P2-b: cross-check against queryApi.image (the image actually being rolled), NOT
dev-health.lockstepImageCheck's hardcoded dev-health.image (the Python api image) -- see the
file-level comment above.
*/}}
{{- $queryApiImageRef := include "dev-health.queryApiImage" . }}
{{- $toolsImageTag := regexFind ":sha-[0-9a-f]{12}$" $toolsImage }}
{{- $queryApiImageTag := regexFind ":sha-[0-9a-f]{12}$" $queryApiImageRef }}
{{- if and $toolsImageTag $queryApiImageTag (ne $toolsImageTag $queryApiImageTag) }}
{{- fail (printf "migrations.hook.goApiRoutingTools.image (%s) and queryApi.image (%s) are pinned to different commits (%s vs %s) -- the routing carry/repoint hooks must read the same schema digest the commit about to roll computes." $toolsImage $queryApiImageRef $toolsImageTag $queryApiImageTag) }}
{{- end }}
{{- $mintOrg := required "migrations.hook.goApiRoutingTools.mintOrg is required whenever queryApi.enabled=true -- a disposable operator/fixture org, never a real customer org" $tools.mintOrg }}
{{- $queryApiURL := include "dev-health.queryApiURL" . }}
{{- $envelopeSecretName := include "dev-health.secretName" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dev-health.fullname" . }}-routing-carry
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "routing-carry" "context" $) | nindent 4 }}
  annotations:
    {{- /* pre-upgrade ONLY -- never pre-install, see the file-level comment above. */}}
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "1"
    {{- /*
    FAIL-CLOSED, same reasoning as route-activate: before-hook-creation only, not
    hook-succeeded, so a refused/failed carry's pod survives for its logs.
    */}}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.hook.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.hook.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "routing-carry" "context" $) | nindent 8 }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: routing-carry
          image: {{ $toolsImage }}
          imagePullPolicy: {{ $toolsPullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # No `jq` in this image (see the file-level comment) -- `carry_reason` reads
              # -json's `reason` field with grep+sed against the JSON line's known, controlled
              # shape (dho's own carryResult always emits `reason` as the FIRST field).
              carry_reason() {
                printf '%s\n' "$1" | grep '^GOAPI_ROUTING_JSON ' | sed -E 's/^GOAPI_ROUTING_JSON \{"reason":"([^"]*)".*/\1/'
              }
              BEARER=$(dho mint envelope -org "$MINT_ORG" -key-file /keys/envelope.pem)
              OUT=$(GO_API_ROUTING_BEARER="$BEARER" dho goapi routing carry \
                -registry-url "$QUERY_API_URL/registry" -buildinfo-url "$QUERY_API_URL/buildinfo" \
                -json -recorded-by helm-pre-upgrade \
                -review-evidence "CHAOS-7023 pre-upgrade carry, release ${RELEASE_NAME}" 2>&1) && RC=0 || RC=$?
              printf '%s\n' "$OUT"
              if [ "$RC" -eq 0 ]; then
                echo "carry: OK"
                exit 0
              fi
              REASON=$(carry_reason "$OUT")
              if [ "$REASON" = "digest_unchanged" ]; then
                echo "carry: no schema-digest change this roll -- nothing to carry, not a failure"
                exit 0
              fi
              if [ "$REASON" = "stale_build" ]; then
                echo "carry: rows lag the actually-running build (no schema change) -- repointing then retrying once"
                REOUT=$(GO_API_ROUTING_BEARER="$BEARER" dho goapi routing repoint \
                  -registry-url "$QUERY_API_URL/registry" -buildinfo-url "$QUERY_API_URL/buildinfo" \
                  -json -operations all-registered -recorded-by helm-pre-upgrade \
                  -review-evidence "CHAOS-7023 pre-upgrade repoint-before-retry, release ${RELEASE_NAME}" 2>&1) && RRC=0 || RRC=$?
                printf '%s\n' "$REOUT"
                [ "$RRC" -eq 0 ] || { echo "carry: repoint-before-retry itself failed -- ABORTING upgrade"; exit 1; }
                OUT2=$(GO_API_ROUTING_BEARER="$BEARER" dho goapi routing carry \
                  -registry-url "$QUERY_API_URL/registry" -buildinfo-url "$QUERY_API_URL/buildinfo" \
                  -json -recorded-by helm-pre-upgrade \
                  -review-evidence "CHAOS-7023 pre-upgrade carry retry after repoint, release ${RELEASE_NAME}" 2>&1) && RC2=0 || RC2=$?
                printf '%s\n' "$OUT2"
                [ "$RC2" -eq 0 ] || { echo "carry: still refused after repoint -- ABORTING upgrade"; exit 1; }
                echo "carry: OK after repoint-then-retry"
                exit 0
              fi
              echo "carry: refused for a reason other than digest-agreement or a stale build (reason=${REASON:-unrecognized}) -- ABORTING upgrade (CHAOS-7023 refuse-not-skip)"
              exit 1
          env:
            - name: MINT_ORG
              value: {{ $mintOrg | quote }}
            - name: QUERY_API_URL
              value: {{ $queryApiURL | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            # D2831 (#3369 r2 P1): these hooks read/write go_api_candidate_build/
            # go_api_routing_state/go_api_proof_run -- the SAME tables query-api's
            # own GO_API_REGISTRY_POSTGRES_URI DSN is documented to be the only
            # correct source for (values.yaml's own comment on that key: "What
            # must NOT happen instead: granting these three tables to
            # RIVER_DOMAIN_DATABASE_ROLE so the existing pooler role can read
            # them ... the shape of a prior multi-day outage"). The Go pgbouncer
            # Secret's POSTGRES_URI (below, was the source here) IS that
            # RIVER_DOMAIN_DATABASE_ROLE DSN -- reproduced live: `permission
            # denied for table go_api_routing_state`. Source from the SAME
            # Secret+key query-api-deployment.yaml already uses instead.
            - name: POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $envelopeSecretName }}
                  key: GO_API_REGISTRY_POSTGRES_URI
            - name: GO_API_ENVELOPE_ISSUER
              value: {{ .Values.queryApi.envelope.issuer | quote }}
            - name: GO_API_ENVELOPE_AUDIENCE
              value: {{ .Values.queryApi.envelope.audience | quote }}
          volumeMounts:
            - name: envelope-key
              mountPath: /keys/envelope.pem
              subPath: envelope.pem
              readOnly: true
          resources:
            {{- toYaml .Values.migrations.hook.resources | nindent 12 }}
      volumes:
        - name: envelope-key
          secret:
            secretName: {{ $envelopeSecretName }}
            items:
              - key: GO_API_ENVELOPE_PRIVATE_KEY
                path: envelope.pem
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dev-health.fullname" . }}-routing-repoint
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "routing-repoint" "context" $) | nindent 4 }}
  annotations:
    {{- /* post-upgrade ONLY, unconditional every roll -- D2811 addendum. */}}
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.hook.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.hook.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "routing-repoint" "context" $) | nindent 8 }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: routing-repoint
          image: {{ $toolsImage }}
          imagePullPolicy: {{ $toolsPullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              BEARER=$(dho mint envelope -org "$MINT_ORG" -key-file /keys/envelope.pem)
              GO_API_ROUTING_BEARER="$BEARER" dho goapi routing repoint \
                -registry-url "$QUERY_API_URL/registry" -buildinfo-url "$QUERY_API_URL/buildinfo" \
                -operations all-registered -recorded-by helm-post-upgrade \
                -review-evidence "CHAOS-7023/D2811 post-upgrade repoint, release ${RELEASE_NAME}"
          env:
            - name: MINT_ORG
              value: {{ $mintOrg | quote }}
            - name: QUERY_API_URL
              value: {{ $queryApiURL | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            # D2831 (#3369 r2 P1): same fix as routing-carry above -- source
            # from the role that owns the registry tables, never the Go
            # pgbouncer Secret's RIVER_DOMAIN_DATABASE_ROLE DSN.
            - name: POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $envelopeSecretName }}
                  key: GO_API_REGISTRY_POSTGRES_URI
            - name: GO_API_ENVELOPE_ISSUER
              value: {{ .Values.queryApi.envelope.issuer | quote }}
            - name: GO_API_ENVELOPE_AUDIENCE
              value: {{ .Values.queryApi.envelope.audience | quote }}
          volumeMounts:
            - name: envelope-key
              mountPath: /keys/envelope.pem
              subPath: envelope.pem
              readOnly: true
          resources:
            {{- toYaml .Values.migrations.hook.resources | nindent 12 }}
      volumes:
        - name: envelope-key
          secret:
            secretName: {{ $envelopeSecretName }}
            items:
              - key: GO_API_ENVELOPE_PRIVATE_KEY
                path: envelope.pem
{{- end }}
