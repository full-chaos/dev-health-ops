# Throwaway (never merged): executes FORM-14553-1 in CI. Delete with the draft PR.
name: form14553-sqlcheck

on:
  pull_request:
    paths:
      - ".github/workflows/form14553-sqlcheck.yml"
      - "ci/form14553-sqlcheck/**"

permissions:
  contents: read

jobs:
  form14553-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the ClickHouse image digest
        run: |
          set -euo pipefail
          for tag in 25.12.5.44 25.12; do
            if digest=$(docker buildx imagetools inspect "clickhouse/clickhouse-server:${tag}" --format '{{.Manifest.Digest}}' 2>/dev/null) && [ -n "$digest" ]; then
              echo "tag ${tag} index digest ${digest}"
              echo "CH_IMAGE=clickhouse/clickhouse-server:${tag}@${digest}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "tag ${tag}: not found"
          done
          echo "FAIL: neither 25.12.5.44 nor 25.12 exists"; exit 1
      - name: Run the SigNoz cell
        run: bash ci/form14553-sqlcheck/run.sh
