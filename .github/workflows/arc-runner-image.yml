# Build and publish the ARC (actions-runner-controller) runner image used by
# the oci-arc-runners scale set. See docker/arc-runner/Dockerfile for why
# this exists (CHAOS-4906): upstream ghcr.io/actions/actions-runner lacks
# make and postgresql-client, and CF's first job dispatched to that scale
# set failed on the missing `make`.
#
# DESTINATION is ghcr.io/full-chaos/arc-runner -- flat, ops-scoped, matching
# every other image this repo already publishes to ghcr.io/full-chaos
# (postgres, clickhouse/clickhouse-server, etc. via mirror-test-images.yml),
# not acr's nested ghcr.io/full-chaos/dev-health-acr/... convention -- GHCR
# package write access is repo-scoped, and this package is owned by ops.
#
# CONCURRENCY is keyed per-SHA (not per-ref), matching the fix landed in
# #2149 (docker-images.yml) for the identical failure mode: grouping by
# github.ref alone means every push to main shares ONE group, so a
# fast-follow commit can cancel an in-flight or pending build for an
# earlier one. Per-SHA groups make that structurally impossible -- no two
# distinct commits' builds can ever collide.
#
# The LATEST tag is gated the same way #2149 gates it: not by build order
# (concurrent per-SHA builds can finish out of order), but by checking,
# immediately before tagging, whether the commit just built is STILL main's
# current head. An older build finishing late then publishes only its
# immutable sha tag and can never clobber `latest` with older content.
name: Build arc-runner image

on:
  push:
    branches: [main]
    paths:
      - docker/arc-runner/Dockerfile
      - .github/workflows/arc-runner-image.yml
      - go.mod
  pull_request:
    paths:
      - docker/arc-runner/Dockerfile
      - .github/workflows/arc-runner-image.yml
      - go.mod
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the image to ghcr.io (default: false)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-26.04-arm
    outputs:
      sha: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Single boolean, computed once, referenced everywhere below instead of
      # repeating this event-type expression on every step. team-lead +
      # ci-flakes (round 3): the prior two-build shape meant the checked
      # image (loaded locally) and the published image (a later, separate
      # build) were not provably the same bytes -- apt layers are not
      # reproducible across two builds on a cache miss. Fix is one build for
      # the whole run, not two conditionally-skipped ones.
      - name: Determine whether to publish
        id: publish
        # Semgrep (code-scanning, PR #2154 round): github context data
        # interpolated directly into a run: script is flagged as a shell-
        # injection surface regardless of how trustworthy the specific field
        # is -- route it through env: instead, per the tool's own remediation.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_IMAGE_INPUT: ${{ github.event.inputs.push_image }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ] \
             && { [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$PUSH_IMAGE_INPUT" = "true" ]; }; then
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.publish.outputs.should_publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI labels (org.opencontainers.image.revision/source/created/...) are
      # derived from the git context, not from the tag/latest decision, so
      # they can be computed now -- before the mainhead check -- and applied
      # to the one build below. Only human-readable TAGS need to wait for
      # that check; see the later "Docker meta" step for those.
      - name: Docker labels
        if: steps.publish.outputs.should_publish == 'true'
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/full-chaos/arc-runner

      # THE build -- exactly one, every event type. `:check` is a FIXED,
      # literal tag applied unconditionally, never a shell variable or a
      # runtime-only ${{ }} value: tests/tooling/test_go_integration_
      # sharding.py's registry-pull scanner statically parses every `docker
      # run`/`docker pull` argument in this repo's workflow `run:` text and
      # REFUSES anything it cannot prove, at YAML-authoring time, resolves to
      # an approved registry -- github.sha included, since only
      # github.repository_owner is special-cased. A dynamic digest or tag
      # reference can never appear in the CGO-check step below as a result;
      # a fixed literal is the only shape that scanner accepts. On a push
      # (or a push_image=true dispatch) this SAME build ALSO pushes an
      # immutable per-commit tag straight to ghcr: sha tags need no ordering
      # guard, since each is unique to its own commit and so has no "is this
      # still current" question to ask. Only `latest` is gated on the
      # main-head check further down, applied afterward against this exact
      # digest via `imagetools create` -- never a second build.
      - name: Build
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/arc-runner/Dockerfile
          platforms: linux/arm64
          tags: |
            ghcr.io/full-chaos/arc-runner:check
            ${{ steps.publish.outputs.should_publish == 'true' && format('ghcr.io/full-chaos/arc-runner:sha-{0}', github.sha) || 'ghcr.io/full-chaos/arc-runner:check' }}
          labels: ${{ steps.labels.outputs.labels }}
          push: ${{ steps.publish.outputs.should_publish == 'true' }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # In-image CGO check (team-lead, after CF's second pickup failed with
      # `-race requires cgo; CGO_ENABLED=1`). Go itself is not part of this
      # image -- a real job gets it from actions/setup-go, same as here --
      # so this step borrows THIS job's own setup-go binary and runs it
      # inside the image just built above, over its GOROOT mounted
      # read-only. That isolates what's actually being checked to what the
      # image itself provides (gcc, libc6-dev, i.e. CGO_ENABLED/CC
      # detection), not anything about the Go toolchain. Always runs against
      # the literal `:check` tag loaded by the Build step -- the exact same
      # bytes that (when publishing) were also just pushed under the sha tag
      # in that same build, so there is no separate build to diverge from.
      - name: Set up Go (for the in-image CGO check only)
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod

      - name: Check CGO toolchain inside the built image
        # Two separate `docker run` invocations, not one `sh -c 'a; b'`:
        # tests/tooling/test_go_integration_sharding.py's registry scanner
        # splits run: text on bare ;/&&/|| WITHOUT respecting quoting, so a
        # `;` embedded inside a single-quoted sh -c argument fragments this
        # into two unbalanced-quote pieces and gets refused as "unparseable
        # shell" (fail-closed by that scanner's own design -- an image it
        # can't determine is never assumed safe). Keeping each docker run a
        # complete, self-contained statement avoids tripping it, rather than
        # working around a scanner that is behaving as intended.
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$(go env GOROOT)":/usr/local/go:ro \
            -e PATH=/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            ghcr.io/full-chaos/arc-runner:check \
            sh -c 'echo "gcc: $(command -v gcc)"'
          docker run --rm --platform linux/arm64 \
            -v "$(go env GOROOT)":/usr/local/go:ro \
            -e PATH=/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            ghcr.io/full-chaos/arc-runner:check \
            sh -c 'go env CGO_ENABLED CC'

      - name: Determine whether this build is main's current head
        if: steps.publish.outputs.should_publish == 'true'
        id: mainhead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BUILT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${REPO}/branches/main" --jq .commit.sha)"
          echo "built_sha=${BUILT_SHA} current_main_sha=${current_main_sha}"
          if [ "${BUILT_SHA}" = "${current_main_sha}" ]; then
            echo "is_main_head=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_main_head=false" >> "${GITHUB_OUTPUT}"
          fi

      # Applies `latest` only when this exact build is main's current head,
      # checked immediately beforehand: the gap between "checked" and "acted
      # on" is one `imagetools create` call -- a manifest op, not a build --
      # so its correctness never depends on build-cache state. The immutable
      # sha-<commit> tag needs no such guard: it was already pushed directly
      # by the Build step above and can never go stale.
      - name: Tag latest
        if: >-
          steps.publish.outputs.should_publish == 'true' &&
          github.ref == 'refs/heads/main' &&
          steps.mainhead.outputs.is_main_head == 'true'
        id: tag
        run: |
          set -euo pipefail
          docker buildx imagetools create -t ghcr.io/full-chaos/arc-runner:latest \
            "ghcr.io/full-chaos/arc-runner@${{ steps.build.outputs.digest }}"

      # Job-level summary line. Note: I found no existing "ensure"-named job
      # or script anywhere in this repo's .github/ or ci/ to match a
      # specific established convention by that name -- this follows the
      # one $GITHUB_STEP_SUMMARY precedent that does exist here
      # (docs-cloudflare.yml). Flag if a different pattern was intended.
      #
      # "Tag latest" being skipped is NOT itself a failure signal -- it is
      # the ordinary, expected outcome whenever should_publish is true but
      # this build isn't main's current head (e.g. a workflow_dispatch with
      # push_image=true from a feature branch). Report that distinctly from
      # an actual non-success outcome, rather than treating every skip as
      # something that needs investigating (codex round 2, 024f0e15, P3:
      # the previous version conflated "not tagged latest" with "not
      # published" and could report a false "PR/dry-run" on a real push).
      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.build.outcome }}" != "success" ]; then
              echo "❌ arc-runner image build failed (outcome: ${{ steps.build.outcome }})"
            elif [ "${{ steps.publish.outputs.should_publish }}" != "true" ]; then
              echo "✅ arc-runner image build (not published, PR/dry-run): \`${{ steps.build.outputs.digest }}\`"
            else
              echo "✅ arc-runner image published: \`${{ steps.build.outputs.digest }}\`, tag: \`ghcr.io/full-chaos/arc-runner:sha-${{ github.sha }}\`"
              if [ "${{ steps.tag.outcome }}" = "success" ]; then
                echo "   \`latest\` applied (this build is main's current head)"
              elif [ "${{ steps.tag.outcome }}" = "skipped" ]; then
                echo "   \`latest\` not applied (not main's current head, or this run doesn't target main)"
              else
                echo "   ⚠️ \`latest\`-tag step outcome: ${{ steps.tag.outcome }} -- check the run"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
