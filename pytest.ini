[pytest]
testpaths = tests
pythonpath = src
markers =
    benchmark: mark a test as a benchmark.
    clickhouse: requires a live ClickHouse connection (set CLICKHOUSE_URI).
    live_openai: uses an explicitly configured live OpenAI or Ask Dev endpoint.
    graphiti: needs a live CHAOS-3617 trial graph store (set
        CONTEXT_FABRIC_GRAPH_STORE_URI, e.g. via the compose `graph-trial`
        profile) and the `context-graph-trial` extra. Deliberately NOT
        excluded from the standing gate's marker expression: these tests skip
        with an explicit reason when the store is absent, and
        tests/context_fabric/test_chaos_3617_live_gate.py turns that skip into
        a hard failure when CONTEXT_FABRIC_GRAPH_REQUIRE_LIVE=1, so a
        measurement that did not happen can never read as coverage.
filterwarnings =
    # unittest.mock's AsyncMock emits this when an auto-created async mock is
    # called but its coroutine is discarded by the code under test. The name is
    # mock-internal: a real missed await surfaces as `coroutine '<real_name>'`,
    # so ignoring this exact message cannot hide a production bug. Genuine
    # coroutine-runner orphans are fixed at source via tests._helpers
    # .closing_coroutine_runner (CHAOS-2586).
    ignore:coroutine 'AsyncMockMixin\._execute_mock_call' was never awaited:RuntimeWarning
