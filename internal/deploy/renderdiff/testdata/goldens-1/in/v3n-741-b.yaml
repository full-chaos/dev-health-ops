# Source: dev-health/templates/otel-collector.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-health-otel-collector
  namespace: dev-health
  labels:
    app.kubernetes.io/component: collector
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/name: otel-collector
data:
  config.yaml: |
    
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage/pod-logs:
        directory: /var/lib/otelcol/storage
        create_directory: false
      # k8s_cluster starts through this elector, NOT at collector start: without it, an API server that does not answer at that moment
      # fails the whole collector start (all traces/logs/metrics stop). Through the elector the start error is only logged and the
      # receiver starts once the lease is held, i.e. once the API answers. One replica, so this collector is always the only candidate.
      k8s_leader_elector:
        auth_type: serviceAccount
        lease_name: dev-health-otel-collector-k8s-cluster
        lease_namespace: dev-health
      file_storage/clickhouse-querylog:
        directory: /var/lib/otelcol/clickhouse-querylog
        create_directory: false
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus/internal:
        config:
          scrape_configs:
            - job_name: otelcol-internal
              scrape_interval: 30s
              metrics_path: /metrics
              static_configs:
                - targets: ["localhost:8888"]
      prometheus/auth-service:
        config:
          scrape_configs:
            - job_name: auth-service
              scrape_interval: 30s
              metrics_path: /metrics
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: ["dev-health"]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
                  action: keep
                  regex: auth-service
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
                  action: keep
                  regex: "dev-health"
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keep
                  regex: "8096"
                - source_labels: [__meta_kubernetes_pod_phase]
                  action: keep
                  regex: Running
      redis:
        endpoint: "dev-health-ops-valkey:6379"
        collection_interval: 30s
      hostmetrics:
        root_path: /hostfs
        collection_interval: 60s
        scrapers:
          cpu: {}
          disk: {}
          load: {}
          filesystem:
            exclude_mount_points:
              mount_points: [/dev/*, /proc/*, /sys/*, /run/*, /var/lib/docker/*, /var/lib/containerd/*, /snap/*]
              match_type: regexp
            exclude_fs_types:
              fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, mqueue, nsfs, overlay, proc, pstore, rpc_pipefs, securityfs, sysfs, tmpfs, tracefs]
              match_type: strict
          memory: {}
          network: {}
          paging: {}
          process:
            mute_process_name_error: true
            mute_process_exe_error: true
            mute_process_io_error: true
            mute_process_user_error: true
            mute_process_cgroup_error: true
          system: {}
      kubeletstats:
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_IP}:10250"
        collection_interval: 60s
        metric_groups: [node, pod, container]
      k8s_cluster:
        auth_type: serviceAccount
        k8s_leader_elector: k8s_leader_elector
        collection_interval: 60s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
        allocatable_types_to_report: [cpu, memory]
        metrics:
          # old ReplicaSets of every Deployment revision stay listed: their series add cost and no signal (k8s.deployment.* carries it)
          k8s.replicaset.available:
            enabled: false
          k8s.replicaset.desired:
            enabled: false
        resource_attributes:
          # OOM kills: k8s.container.restarts carries the reason of the last termination (OOMKilled, Error, Completed)
          k8s.container.status.last_terminated_reason:
            enabled: true
      sql_query/clickhouse-querylog:
        driver: clickhouse
        datasource: ${env:CLICKHOUSE_QUERYLOG_DSN}
        collection_interval: 30s
        storage: file_storage/clickhouse-querylog
        queries:
          - sql: |
              SELECT
                toString(toUnixTimestamp64Micro(event_time_microseconds)) AS event_time_us,
                toString(type) AS type,
                user,
                query_kind,
                arrayStringConcat(tables, ',') AS tables,
                toString(read_rows) AS read_rows,
                toString(read_bytes) AS read_bytes,
                toString(memory_usage) AS memory_usage,
                toString(query_duration_ms) AS query_duration_ms,
                toString(exception_code) AS exception_code,
                toString(normalized_query_hash) AS normalized_query_hash,
                toString(cap) AS max_bytes_to_read,
                toString(ratio) AS cap_ratio,
                replica,
                concat(toString(type), ' user=', user, ' kind=', query_kind, ' code=', toString(exception_code)) AS body
              FROM
              (
                SELECT
                  event_time_microseconds, type, user, query_kind, tables, read_rows, read_bytes, memory_usage,
                  query_duration_ms, exception_code, normalized_query_hash,
                  hostName() AS replica,
                  toUInt64OrZero(arrayFirst(s -> s.1 = 'max_bytes_to_read', CAST(Settings, 'Array(Tuple(String, String))')).2) AS cap,
                  if(cap > 0, round(read_bytes / cap, 4), 0) AS ratio
                FROM clusterAllReplicas('default', system.query_log)
                WHERE event_date >= toDate(now() - INTERVAL 15 MINUTE)
                  AND event_time >= now() - INTERVAL 15 MINUTE
                  AND event_time < now() - INTERVAL 30 SECOND
                  AND event_time_microseconds > fromUnixTimestamp64Micro(toInt64(?))
                  AND type != 'QueryStart'
                  AND user != 'otel_querylog'
                ORDER BY event_time_microseconds
                LIMIT 5000
              )
              ORDER BY event_time_microseconds
            tracking_column: event_time_us
            tracking_start_value: "0"
            logs:
              - body_column: body
                attribute_columns: [event_time_us, type, user, query_kind, tables, read_rows, read_bytes, memory_usage, query_duration_ms, exception_code, normalized_query_hash, max_bytes_to_read, cap_ratio, replica]
      # CHAOS-9362: ClickHouse server metrics, the otel_querylog login (readonly=1). Every query is bounded: closed name lists, parts per table.
      sql_query/clickhouse-server:
        driver: clickhouse
        datasource: ${env:CLICKHOUSE_QUERYLOG_DSN}
        collection_interval: 60s
        queries:
          - sql: "SELECT metric, toString(value) AS value FROM system.metrics WHERE metric IN ('Query', 'Merge', 'PartMutation', 'BackgroundMergesAndMutationsPoolTask', 'BackgroundMergesAndMutationsPoolSize', 'TCPConnection', 'HTTPConnection', 'MemoryTracking', 'DelayedInserts', 'PendingAsyncInsert', 'GlobalThread', 'GlobalThreadActive', 'PartsActive', 'PartsOutdated')"
            metrics:
              - metric_name: clickhouse.server.metric
                value_column: value
                attribute_columns: [metric]
                data_type: gauge
                value_type: int
          # system.events lists only NON-ZERO events unless the SESSION has system_events_show_zero_values=1, and a session keeps the profile
          # it opened with (a collector session opened before a users.d reload never gets the setting). The closed name list is LEFT JOINed
          # to system.events instead, so every configured event is a series (0 until it fires) whatever the session profile.
          - sql: "SELECT n.event AS event, toString(ifNull(e.value, 0)) AS value FROM (SELECT arrayJoin(['Query', 'SelectQuery', 'InsertQuery', 'FailedQuery', 'FailedSelectQuery', 'FailedInsertQuery', 'QueryTimeMicroseconds', 'InsertedRows', 'InsertedBytes', 'SelectedRows', 'SelectedBytes', 'Merge', 'MergedRows', 'DelayedInserts', 'RejectedInserts', 'QueryMemoryLimitExceeded', 'OSCPUVirtualTimeMicroseconds']) AS event) AS n LEFT JOIN system.events AS e ON e.event = n.event"
            metrics:
              - metric_name: clickhouse.server.event
                value_column: value
                attribute_columns: [event]
                data_type: sum
                value_type: int
                monotonic: true
                aggregation: cumulative
          - sql: "SELECT metric, toString(value) AS value FROM system.asynchronous_metrics WHERE metric IN ('MemoryResident', 'CGroupMemoryUsed', 'CGroupMemoryTotal', 'OSMemoryAvailable', 'OSMemoryTotal', 'MaxPartCountForPartition', 'TotalPartsOfMergeTreeTables', 'TotalRowsOfMergeTreeTables', 'TotalBytesOfMergeTreeTables', 'NumberOfTables', 'FilesystemMainPathAvailableBytes', 'FilesystemMainPathTotalBytes', 'LoadAverage1', 'OSUserTimeNormalized', 'OSSystemTimeNormalized', 'OSIOWaitTimeNormalized', 'Uptime')"
            metrics:
              - metric_name: clickhouse.server.async_metric
                value_column: value
                attribute_columns: [metric]
                data_type: gauge
                value_type: double
          - sql: "SELECT database, table, toString(count()) AS parts, toString(sum(rows)) AS rows, toString(sum(bytes_on_disk)) AS bytes FROM system.parts WHERE active GROUP BY database, table"
            metrics:
              - metric_name: clickhouse.table.parts
                value_column: parts
                attribute_columns: [database, table]
                data_type: gauge
                value_type: int
              - metric_name: clickhouse.table.rows
                value_column: rows
                attribute_columns: [database, table]
                data_type: gauge
                value_type: int
              - metric_name: clickhouse.table.bytes
                value_column: bytes
                attribute_columns: [database, table]
                data_type: gauge
                value_type: int
      filelog/pods:
        include: ["/var/log/pods/dev-health_dev-health-ops-go-api-*_*/*/*.log","/var/log/pods/dev-health_dev-health-ops-go-heavy-*_*/*/*.log","/var/log/pods/dev-health_dev-health-ops-go-ops-*_*/*/*.log","/var/log/pods/dev-health_dev-health-ops-go-reconciler-*_*/*/*.log","/var/log/pods/dev-health_dev-health-ops-go-scheduler-*_*/*/*.log","/var/log/pods/dev-health_dev-health-ops-go-stream-external-*_*/*/*.log","/var/log/pods/dev-health_dev-health-ops-go-stream-ingest-*_*/*/*.log","/var/log/pods/dev-health_dev-health-ops-go-stream-pagerduty-*_*/*/*.log","/var/log/pods/dev-health_dev-health-ops-go-sync-provider-*_*/*/*.log","/var/log/pods/dev-health_dev-health-ops-go-sync-*_*/*/*.log","/var/log/pods/dev-health_dev-health-ops-query-api-*_*/*/*.log","/var/log/pods/dev-health_dev-health-ops-auth-service-*_*/*/*.log"]
        exclude: ["/var/log/pods/dev-health_dev-health-ops-go-pgbouncer-*_*/*/*.log"]
        include_file_path: true
        include_file_name: false
        start_at: "end"
        max_log_size: 32KiB
        poll_interval: 200ms
        storage: file_storage/pod-logs
        operators:
          - type: container
            id: container-parser
          - type: remove
            id: drop-file-path
            field: attributes["log.file.path"]
    processors:
      batch:
        send_batch_max_size: 2048
        send_batch_size: 1024
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_mib: 560
        spike_limit_mib: 140
      resource/common:
        attributes:
        - action: upsert
          key: host.name
          value: oci-ampere
        - action: upsert
          key: deployment.environment
          value: production
        - action: upsert
          key: hostname
          value: oci-ampere
      resourcedetection:
        detectors:
        - env
        - system
        override: false
        system:
          hostname_sources:
          - os
        timeout: 2s
      transform/normalize-log-fields:
        error_mode: ignore
        log_statements:
        - context: log
          statements:
          - set(resource.attributes["service.name"], attributes["service.name"]) where (resource.attributes["service.name"]
            == nil or resource.attributes["service.name"] == "") and attributes["service.name"]
            != nil
          - set(resource.attributes["service.name"], attributes["service"]) where (resource.attributes["service.name"]
            == nil or resource.attributes["service.name"] == "") and attributes["service"]
            != nil
          - set(resource.attributes["service.name"], attributes["serviceName"]) where (resource.attributes["service.name"]
            == nil or resource.attributes["service.name"] == "") and attributes["serviceName"]
            != nil
          - set(attributes["loglevel"], attributes["level"]) where attributes["loglevel"]
            == nil and attributes["level"] != nil
          - set(attributes["loglevel"], attributes["severity"]) where attributes["loglevel"]
            == nil and attributes["severity"] != nil
          - set(attributes["loglevel"], severity_text) where attributes["loglevel"] == nil
            and severity_text != nil and severity_text != ""
          - set(severity_text, attributes["loglevel"]) where (severity_text == nil or severity_text
            == "") and attributes["loglevel"] != nil
      # 1) REDACT THE RAW LINE FIRST (before any parsing: a credential inside a nested JSON map or array is plain text here, and a cap or a
      #    parse can never cut it in half); 2) parse; 3) flatten nested maps and redact again (a value JSON-escaped in the line only
      #    shows its shape after the parse); 4) the caps. Redaction always precedes truncation.
      transform/pod-logs-redact-raw:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - replace_pattern(body, "sk-ant-[A-Za-z0-9_-]{20,}", "<redacted>") where IsString(body)
              - replace_pattern(body, "sk-or-v1-[A-Za-z0-9]{20,}", "<redacted>") where IsString(body)
              - replace_pattern(body, "sk-[A-Za-z0-9_-]{20,}", "<redacted>") where IsString(body)
              - replace_pattern(body, "AIza[A-Za-z0-9_-]{30,}", "<redacted>") where IsString(body)
              - replace_pattern(body, "[sr]k_(live|test)_[A-Za-z0-9]{16,}", "<redacted>") where IsString(body)
              - replace_pattern(body, "whsec_[A-Za-z0-9]{16,}", "<redacted>") where IsString(body)
              - replace_pattern(body, "xox[abeprs]-[A-Za-z0-9-]{10,}", "<redacted>") where IsString(body)
              - replace_pattern(body, "eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}", "<redacted>") where IsString(body)
      transform/pod-logs-parse:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - merge_maps(attributes, ParseJSON(body), "upsert") where IsString(body) and IsMatch(body, "^\\s*\\{")
              - set(severity_text, attributes["level"]) where attributes["level"] != nil
              - set(severity_number, SEVERITY_NUMBER_DEBUG) where IsMatch(severity_text, "^(?i)debug$")
              - set(severity_number, SEVERITY_NUMBER_INFO) where IsMatch(severity_text, "^(?i)info$")
              - set(severity_number, SEVERITY_NUMBER_WARN) where IsMatch(severity_text, "^(?i)(warn|warning)$")
              - set(severity_number, SEVERITY_NUMBER_ERROR) where IsMatch(severity_text, "^(?i)error$")
              - set(severity_number, SEVERITY_NUMBER_FATAL) where IsMatch(severity_text, "^(?i)(fatal|panic)$")
              - set(body, attributes["msg"]) where attributes["msg"] != nil
              - delete_key(attributes, "msg")
              - flatten(attributes)
      filter/pod-logs:
        error_mode: ignore
        logs:
          log_record:
            - 'severity_number != SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_INFO'
      transform/pod-logs-redact:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - replace_pattern(body, "sk-ant-[A-Za-z0-9_-]{20,}", "<redacted>") where IsString(body)
              - replace_all_patterns(attributes, "value", "sk-ant-[A-Za-z0-9_-]{20,}", "<redacted>")
              - replace_pattern(body, "sk-or-v1-[A-Za-z0-9]{20,}", "<redacted>") where IsString(body)
              - replace_all_patterns(attributes, "value", "sk-or-v1-[A-Za-z0-9]{20,}", "<redacted>")
              - replace_pattern(body, "sk-[A-Za-z0-9_-]{20,}", "<redacted>") where IsString(body)
              - replace_all_patterns(attributes, "value", "sk-[A-Za-z0-9_-]{20,}", "<redacted>")
              - replace_pattern(body, "AIza[A-Za-z0-9_-]{30,}", "<redacted>") where IsString(body)
              - replace_all_patterns(attributes, "value", "AIza[A-Za-z0-9_-]{30,}", "<redacted>")
              - replace_pattern(body, "[sr]k_(live|test)_[A-Za-z0-9]{16,}", "<redacted>") where IsString(body)
              - replace_all_patterns(attributes, "value", "[sr]k_(live|test)_[A-Za-z0-9]{16,}", "<redacted>")
              - replace_pattern(body, "whsec_[A-Za-z0-9]{16,}", "<redacted>") where IsString(body)
              - replace_all_patterns(attributes, "value", "whsec_[A-Za-z0-9]{16,}", "<redacted>")
              - replace_pattern(body, "xox[abeprs]-[A-Za-z0-9-]{10,}", "<redacted>") where IsString(body)
              - replace_all_patterns(attributes, "value", "xox[abeprs]-[A-Za-z0-9-]{10,}", "<redacted>")
              - replace_pattern(body, "eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}", "<redacted>") where IsString(body)
              - replace_all_patterns(attributes, "value", "eyJ[A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}[.][A-Za-z0-9_-]{8,}", "<redacted>")
      transform/pod-logs-limits:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - truncate_all(attributes, 2048)
              - set(body, Substring(body, 0, 8192)) where IsString(body) and Len(body) > 8192
      transform/pod-logs-service:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["service.name"], "dev-health-go-sync-provider") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-go-sync-provider-[a-z0-9]+-[a-z0-9]+$")
              - set(resource.attributes["service.name"], "dev-health-go-sync") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-go-sync-[a-z0-9]+-[a-z0-9]+$")
              - set(resource.attributes["service.name"], "dev-health-go-stream-external") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-go-stream-external-")
              - set(resource.attributes["service.name"], "dev-health-go-stream-ingest") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-go-stream-ingest-")
              - set(resource.attributes["service.name"], "dev-health-go-stream-pagerduty") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-go-stream-pagerduty-")
              - set(resource.attributes["service.name"], "dev-health-go-heavy") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-go-heavy-")
              - set(resource.attributes["service.name"], "dev-health-go-ops") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-go-ops-")
              - set(resource.attributes["service.name"], "dev-health-go-reconciler") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-go-reconciler-")
              - set(resource.attributes["service.name"], "dev-health-go-scheduler") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-go-scheduler-")
              - set(resource.attributes["service.name"], "dev-health-api") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-go-api-")
              - set(resource.attributes["service.name"], "dev-health-query-api") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-query-api-")
              - set(resource.attributes["service.name"], "auth-service") where resource.attributes["service.name"] == nil and IsMatch(resource.attributes["k8s.pod.name"], "^dev-health-ops-auth-service-")
      # Typed fields (the receiver hands every column over as a string), the statement time as the log time, ERROR for a failed statement.
      transform/clickhouse-querylog:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["service.name"], "clickhouse")
              - set(time_unix_nano, Int(attributes["event_time_us"]) * 1000) where attributes["event_time_us"] != nil
              - delete_key(attributes, "event_time_us")
              - set(attributes["read_rows"], Int(attributes["read_rows"])) where attributes["read_rows"] != nil
              - set(attributes["read_bytes"], Int(attributes["read_bytes"])) where attributes["read_bytes"] != nil
              - set(attributes["memory_usage"], Int(attributes["memory_usage"])) where attributes["memory_usage"] != nil
              - set(attributes["query_duration_ms"], Int(attributes["query_duration_ms"])) where attributes["query_duration_ms"] != nil
              - set(attributes["exception_code"], Int(attributes["exception_code"])) where attributes["exception_code"] != nil
              - set(attributes["max_bytes_to_read"], Int(attributes["max_bytes_to_read"])) where attributes["max_bytes_to_read"] != nil
              - set(attributes["cap_ratio"], Double(attributes["cap_ratio"])) where attributes["cap_ratio"] != nil
              - set(severity_text, "INFO")
              - set(severity_number, SEVERITY_NUMBER_INFO)
              - set(severity_text, "ERROR") where attributes["exception_code"] != 0
              - set(severity_number, SEVERITY_NUMBER_ERROR) where attributes["exception_code"] != 0
    exporters:
      otlp_http/signoz:
        endpoint: ${env:SIGNOZ_OTLP_HTTP_ENDPOINT}
        headers:
          CF-Access-Client-Id: ${env:CF_ACCESS_CLIENT_ID}
          CF-Access-Client-Secret: ${env:CF_ACCESS_CLIENT_SECRET}
    service:
      extensions: [health_check, file_storage/pod-logs, file_storage/clickhouse-querylog, k8s_leader_elector]
      telemetry:
        logs:
          level: info
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: ["memory_limiter","resourcedetection","resource/common","batch"]
          exporters: [otlp_http/signoz]
        metrics:
          receivers: ["otlp","prometheus/internal","redis","hostmetrics","kubeletstats","k8s_cluster","sql_query/clickhouse-server","prometheus/auth-service"]
          processors: ["memory_limiter","resourcedetection","resource/common","batch"]
          exporters: [otlp_http/signoz]
        logs:
          receivers: ["otlp"]
          processors: ["memory_limiter","resourcedetection","resource/common","transform/normalize-log-fields","batch"]
          exporters: [otlp_http/signoz]
        logs/pods:
          receivers: [filelog/pods]
          processors: ["memory_limiter","transform/pod-logs-redact-raw","transform/pod-logs-parse","filter/pod-logs","transform/pod-logs-redact","transform/pod-logs-limits","transform/pod-logs-service","resourcedetection","resource/common","transform/normalize-log-fields","batch"]
          exporters: [otlp_http/signoz]
        logs/clickhouse-querylog:
          receivers: [sql_query/clickhouse-querylog]
          processors: ["memory_limiter","transform/clickhouse-querylog","resourcedetection","resource/common","batch"]
          exporters: [otlp_http/signoz]

