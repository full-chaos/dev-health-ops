{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" . }}
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.selectorLabels" . | nindent 6 }}
    {{- if and .Values.goApi.enabled .Values.goApi.internal.enabled }}
    {{- /*
    CHAOS-7181: NetworkPolicies are additive, and this policy's "pod-to-pod within namespace" rule
    admits every pod on every port. The go-api pods are gated by their own policy (go-api-internal)
    so the internal port is reachable only from goApi.internal.allowedFrom; they keep this
    policy's egress through the go-api-egress policy below.
    */}}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: NotIn, values: [go-api]}
    {{- end }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress controller traffic
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.web.port }}
    # Allow pod-to-pod within namespace
    - from:
        - podSelector: {}
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Internal communication
    - to:
        - podSelector: {}
    # External HTTPS (GitHub, GitLab, Jira, Stripe APIs)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- if and .Values.goApi.enabled .Values.goApi.internal.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" . }}-go-api-egress
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "go-api" "context" $) | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Internal communication
    - to:
        - podSelector: {}
    # External HTTPS (GitHub, GitLab, Jira, Stripe APIs)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
