name: Docs Guards

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/validate_docs_v2_publication.py'
      - 'scripts/check_built_site_links.py'
      - 'scripts/check_docs_candidate_search.py'
      - 'scripts/check_docs_candidate_accessibility.py'
      - 'scripts/check_docs_candidate_facts.py'
      - 'docs-data/**'
      - '.github/workflows/docs-guards.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/validate_docs_v2_publication.py'
      - 'scripts/check_built_site_links.py'
      - 'scripts/check_docs_candidate_search.py'
      - 'scripts/check_docs_candidate_accessibility.py'
      - 'scripts/check_docs_candidate_facts.py'
      - 'docs-data/**'
      - '.github/workflows/docs-guards.yml'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-guards:
    name: docs-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate publication inventory and IA placement
        run: |
          mkdir -p .build
          set -o pipefail
          python scripts/validate_docs_v2_publication.py \
            2>&1 | tee .build/docs-publication-validation.log

      - name: Strict canonical build
        run: |
          set -o pipefail
          python -m mkdocs build --strict --config-file mkdocs.yml \
            2>&1 | tee .build/docs-build.log

      - name: Check rendered links, anchors, and assets
        run: |
          set -o pipefail
          python scripts/check_built_site_links.py \
            --site-dir .build/docs \
            2>&1 | tee .build/docs-links.log

      - name: Check task-based search acceptance
        run: |
          set -o pipefail
          python scripts/check_docs_candidate_search.py \
            --site-dir .build/docs \
            --queries docs-data/search-acceptance.json \
            2>&1 | tee .build/docs-search.log

      - name: Check structural accessibility invariants
        run: |
          set -o pipefail
          python scripts/check_docs_candidate_accessibility.py \
            --site-dir .build/docs \
            --css docs/stylesheets/extra.css \
            2>&1 | tee .build/docs-accessibility.log

      - name: Check objective documentation facts
        run: |
          set -o pipefail
          python scripts/check_docs_candidate_facts.py \
            2>&1 | tee .build/docs-facts.log

      # CHAOS-3514 (chris ruling: gate the scripts, keep the tests). These two
      # guards had unit tests in tests/docs but their SCRIPTS ran only from
      # Makefile targets -- never in CI -- so the property each enforces was
      # unguarded on every PR. Both take repo-relative defaults and need no
      # inputs CI lacks, which is why they can be wired honestly here; the
      # user-guide-evidence validator cannot and is reported separately
      # rather than invoked against a fabricated corpus.
      - name: Check code prerequisites
        run: |
          set -o pipefail
          python scripts/check_code_prerequisites.py \
            2>&1 | tee .build/docs-code-prerequisites.log

      - name: Check freshness inventory
        run: |
          set -o pipefail
          python scripts/check_freshness_inventory.py \
            2>&1 | tee .build/docs-freshness-inventory.log

      - name: Upload documentation quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-quality-evidence
          path: |
            .build/docs-*.log
            .build/docs-*.tsv
            .build/docs-*.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
