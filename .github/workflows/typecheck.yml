name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

concurrency:
  # CHAOS-4946. `github.ref` as the non-PR fallback put EVERY main push in one
  # group (they all resolve `refs/heads/main`), and `cancel-in-progress: true`
  # then cancelled the running one. On a busy merge day that systematically
  # cancels the INTRODUCING commit's own post-merge check.
  #
  # Measured by lane-3092 while verifying #2157 (run ids on the ticket):
  # 025fc2241 (#2142's own push -- the commit that introduced the typecheck
  # break), 81ec1a65b, and 71ff737ac (the FIX for that break) all had their
  # Typecheck runs cancelled. A `workflow_dispatch` fired specifically to get a
  # clean main read was cancelled by the same group, so the group defeated its
  # own manual workaround.
  #
  # Combined with the paths filter below, the introducing PR was invisible
  # TWICE: its PR run skipped the job, and its push run was cancelled. The break
  # then surfaced on a later, unrelated PR -- so bisecting by "whose run went red
  # first" blames the wrong author. That is how #2142's break was attributed.
  #
  # Same fix as #2149 applied to docker-images.yml: fall back to `github.sha`, so
  # every distinct commit gets its OWN group and no two commits' checks can
  # cancel each other; and scope `cancel-in-progress` to `pull_request`, where
  # superseding a stale run is the behaviour we actually want. Post-merge
  # verification of main is never superseded, because there is nothing newer
  # that verifies THAT commit.
  #
  # NOT identical to #2149's key: that one has `github.event.inputs.ref ||`
  # ahead of the sha, because docker-images.yml's workflow_dispatch DEFINES a
  # `ref` input, so two dispatches from the same tip can build different refs
  # and need separate groups. THIS workflow's workflow_dispatch defines no
  # inputs at all, so `github.event.inputs.ref` is undefined here -- actionlint
  # flags it as `property "ref" is not defined in object type {}`, and it would
  # silently evaluate empty. Copying the sibling's key verbatim looked like
  # consistency and was cargo-culting; the shapes differ because the triggers do.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              # CHAOS-3513: omitting this put an unlinted, untypechecked
              # change into main. In merge_group runs 30597898813 and
              # 30597912205 the only file in the queue's diff was
              # .github/workflows/governance.yml, so the filter reported
              # code=false, the gated job skipped, and the required check
              # reported SUCCESS. The gates could be edited -- weakened --
              # by a PR they then declined to run on.
              - '.github/workflows/**'
              - 'src/**'
              # Inputs that decide what these tools LOOK AT, not just how
              # they behave. ruff honours .gitignore/.ignore for file
              # discovery: appending `src/` to .gitignore drops its file set
              # from 1045 source files to 0, and `ruff check` still exits 0 --
              # a green required check that inspected nothing. ruff.toml /
              # .ruff.toml and mypy.ini / .mypy.ini / setup.cfg are config
              # files these tools discover by default; none exists today, and
              # a PR ADDING one would not have matched this filter, so the
              # gate would have skipped on the very change that redefined it
              # (CHAOS-3513 Codex round 1, same shape as the workflow-file
              # omission above).
              - '.gitignore'
              - '.ignore'
              - 'ruff.toml'
              - '.ruff.toml'
              - 'mypy.ini'
              - '.mypy.ini'
              - 'setup.cfg'
              - 'tests/**'
              - 'ci/**'
              - 'migrations/**'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/**'
              # CHAOS-4281/#2142: the patterns above enumerate the three
              # directories Python was assumed to live in -- the same three as
              # [tool.mypy] files in pyproject.toml. But the job below runs
              # `mypy .`, which IGNORES that setting and checks the whole repo
              # (2636 files vs the 2434 a bare `mypy` sees). Corpus generators
              # added under internal/**/testdata matched no pattern here, so
              # typecheck-mypy SKIPPED on the PR and the required check
              # reported SUCCESS (run 33711653474) -- then failed on main days
              # later inside an unrelated PR's run (33716898386), which had
              # merely touched a path this filter does select. Match what the
              # job actually checks: any Python file, anywhere. Third instance
              # of the class recorded above it (CHAOS-3513, CHAOS-3948).
              - '**/*.py'

  typecheck-mypy:
    needs: [changes]
    # dorny/paths-filter has no PR base/head diff to compute in the merge
    # queue and can report code=false there, which would skip this job and
    # let the aggregator see a skip it cannot attribute. Always run in the
    # queue, as test.yml's test-matrix already does.
    if: >-
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Typecheck job needs package read access for dependency installs.
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --all-extras --dev

      - name: Run mypy (type checking)
        run: |
          .venv/bin/mypy .

  typecheck:
    name: typecheck
    # Must remain `always()`. Under `!cancelled()` (or any condition that lets
    # this job itself skip) a cancelled run leaves the REQUIRED check *skipped*,
    # and branch protection counts a skipped required check as satisfied --
    # which moves the silent pass one level up instead of closing it.
    if: always()
    needs: [changes, typecheck-mypy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aggregate typecheck result
        env:
          GATE_NAME: typecheck
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          GATED_JOB_1: typecheck-mypy|path-filtered|${{ needs.typecheck-mypy.result }}
        run: |
          chmod +x ci/aggregate_gate_results.sh
          ./ci/aggregate_gate_results.sh
