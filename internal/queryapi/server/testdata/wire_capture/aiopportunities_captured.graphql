query AIOpportunities($orgId: String!, $scope: AIScopeInput, $limit: Int! = 5) {
  aiOpportunities(orgId: $orgId, scope: $scope, limit: $limit) {
    orgId
    detectorReady
    recommendations {
      opportunityId
      kind
      repoId
      repoName
      teamId
      teamName
      title
      rationale
      score
      evidenceRefs
      workGraphDrilldowns {
        rootType
        rootId
        label
        __typename
      }
      __typename
    }
    __typename
  }
}