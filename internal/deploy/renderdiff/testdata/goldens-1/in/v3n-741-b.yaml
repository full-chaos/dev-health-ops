# Source: dev-health/charts/ops/templates/auth-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-health-ops-auth-service
  namespace: dev-health
  labels:
    helm.sh/chart: ops-0.1.0
    app.kubernetes.io/name: ops
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: dev-health
    app.kubernetes.io/component: auth-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: ops
      app.kubernetes.io/instance: dev-health
      app.kubernetes.io/component: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops
        app.kubernetes.io/instance: dev-health
        app.kubernetes.io/component: auth-service
    spec:
      
      imagePullSecrets:
        - name: ghcr-pull
      serviceAccountName: dev-health-ops-auth-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: stage-signing-key
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          imagePullPolicy: IfNotPresent
          command: ["install", "-m", "0400", "/in/signing-key.pem", "/out/signing-key.pem"]
