# A pinned snapshot of go.yml's on.pull_request.paths shape and list, so the decider's answers do not move when go.yml does.
name: fixture
on:
  push:
    paths:
      - 'ignored/**'
  pull_request:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'contracts/jobs/v1/**'
      - 'deploy/go-workers/**'
      - 'deploy/helm/dev-health/**'
      - 'compose.yml'
      - 'scripts/**'
      - 'src/dev_health_ops/api/**'
      - 'src/dev_health_ops/config/**'
      - 'src/dev_health_ops/connectors/**'
      - 'src/dev_health_ops/licensing/**'
      - 'src/dev_health_ops/llm/**'
      - 'src/dev_health_ops/metrics/**'
      - 'src/dev_health_ops/metrics/testops*.py'
      - 'src/dev_health_ops/migrations/clickhouse/**'
      - 'internal/storage/postgres/authschema/migrations/**'
      - 'internal/pgmigrate/sql/**'
