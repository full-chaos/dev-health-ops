name: Build Docker images

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      image_registry:
        description: 'Override the image registry (defaults to `ghcr.io/chrisgeo/dev-health-ops`)'
        required: false
      ref:
        description: 'Git ref (branch, tag, or SHA) to build (optional)'
        required: false
      push_images:
        description: 'Push images to the registry (default: false)'
        required: false
        default: false
        type: boolean

concurrency:
  # CHAOS-4921: `github.ref` as the non-PR fallback meant every `push`/
  # `workflow_dispatch` targeting `main` shared ONE group (both resolve
  # `github.ref` to the literal `refs/heads/main`) -- so a fast-follow
  # event in that group could cancel whatever main build was already in
  # flight, twice observed live: run 33706407469 (2d4abbbbb, the commit
  # carrying CH migration 084) was cancelled by the fe5f540a9 push, whose
  # own run then skipped the image build on its path filter, so no image
  # containing 084 was ever built; separately, workflow_dispatch run
  # 33709320991 was cancelled by the c3b3ff2ae push landing the same
  # second. (`merge_group` and `release` were never actually part of this
  # collision -- `github.ref` for those resolves to a distinct synthetic
  # queue ref and a tag ref respectively, neither of which is
  # `refs/heads/main`.)
  #
  # `cancel-in-progress` scoped to `pull_request` (below) closes the
  # IN-FLIGHT half of this, but GitHub's own documented concurrency
  # behavior holds at most one PENDING run per group even with
  # cancel-in-progress false: a third event arriving in a group with one
  # running and one already pending cancels that PENDING one. With the
  # group key still falling back to `github.ref`, two merges landing
  # close together (well within reach on a busy night with a ~20 min
  # hosted queue) could still cancel a pending main build outright. Fixed
  # by falling back to `github.sha` instead of `github.ref`: every
  # distinct commit now gets its OWN group for a non-PR event, so no two
  # different commits' builds can ever collide, cancel, or displace each
  # other, running or pending. PR events keep grouping by
  # `pull_request.number` (unchanged) so a stale PR build still gets
  # superseded by a new push to the same PR, which is the cancellation
  # this mechanism exists to provide.
  #
  # codex round 2 found two more defects in this design, both ruled by
  # team-lead as "keep per-SHA groups, fix ordering at the publish step
  # instead of the scheduler":
  #
  # (a) `github.sha` alone doesn't separate `workflow_dispatch` runs that
  # build DIFFERENT `inputs.ref` values from the same dispatch tip -- two
  # dispatches from main@S selecting different refs to build still shared
  # one group, since `github.sha` is S regardless of what `inputs.ref`
  # says. Fixed by adding `github.event.inputs.ref` ahead of `github.sha`
  # in the fallback chain, so a dispatch that names an explicit ref gets
  # its own group keyed on that ref, not on the dispatch tip.
  #
  # (b) removing scheduler-level serialization for non-PR events means
  # concurrent main builds are no longer guaranteed to COMPLETE in the
  # order they started -- if a later-pushed commit's build finishes before
  # an earlier one's (real build-time variance), both could publish the
  # mutable `latest`/`main` tags, and the earlier commit's later
  # completion would overwrite the later commit's tags with OLDER content.
  # NOT fixed here in the scheduler (that would mean re-serializing builds
  # and reintroducing (a)/(b)'s own precondition) -- fixed at the actual
  # publish step instead, in both "Merge Digests" jobs: the moving tags
  # (`latest`, and the `main` branch tag) are only applied if the commit
  # being published is STILL the current head of `main` at publish time,
  # checked immediately before tagging. An older build finishing late
  # then publishes only its immutable sha-tag and cannot overwrite
  # `latest`/`main`; whichever build is actually head-of-main when IT
  # reaches the publish step gets the moving tags, regardless of start
  # order. See the "Determine whether this build is main's current head"
  # step in each merge job.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # Always run on workflow_dispatch and release events
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            code:
              - 'src/**'
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'docker/**'
              - 'compose.yml'
              - '.dockerignore'
              - 'deploy/**'
              - 'Makefile'
              # A change to this workflow IS a change to how images are built.
              # Without this line the publish pipeline cannot republish itself:
              # the CHAOS-3923 Go publish jobs merged to main and every build
              # job skipped, because nothing in this list matches .github/**.
              # `changes` went green while publishing zero images, so the run
              # reported success and the registry stayed empty.
              - '.github/workflows/docker-images.yml'

  # Self-hosted-runner fallback, phase 2 (CHAOS-4906 follow-up to #2145's
  # go-arm64-numeric-parity pilot -- same contract, same shape, ported here
  # verbatim except for the payload). Scoped to ONE matrix combination,
  # (target: worker, platform: linux/arm64), picked as the pilot for THIS
  # workflow because it is a single, self-contained build+push+digest leg
  # with no fan-out of its own -- the smallest real unit of risk in this
  # file. Measured hosted wall time: 1m37s (run 33764964734, job "Build Go
  # Image (worker, linux/arm64)").
  #
  # `pick-runner` gates everything behind the SAME repository-variable kill
  # switch as go.yml's own pilot (`vars.SELF_HOSTED_RUNNERS`), defaulting
  # OFF. Fork PRs excluded even when the switch is on, matching PR #1432's
  # precedent and go.yml's own pick-runner.
  pick-runner:
    if: vars.SELF_HOSTED_RUNNERS == 'enabled' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      try_self_hosted: ${{ steps.decide.outputs.try_self_hosted }}
    steps:
      - id: decide
        run: echo "try_self_hosted=true" >> "${GITHUB_OUTPUT}"

  # PRECONDITION (team-lead ruling, 09-03): unlike go.yml's go-test pilot,
  # this leg needs a WORKING DOCKER DAEMON inside the ephemeral ARC pod --
  # go.yml's own design comment already flagged this as unverified for any
  # candidate beyond the numeric-parity job. Rather than discover a broken
  # daemon by way of a failed image build (ambiguous: was it the build, or
  # the daemon?), this job asks the one question that matters FIRST, in
  # isolation, and fails loud with an unambiguous message if the answer is
  # no. It touches no registry, no real Dockerfile, no cache -- `docker
  # info` proves the daemon is reachable at all, and a `hello-world`-shaped
  # build+run proves it can actually execute a container, not just answer
  # a socket ping.
  dind-smoke-test:
    needs: pick-runner
    if: needs.pick-runner.outputs.try_self_hosted == 'true'
    runs-on: [self-hosted, oci-arc-runners]
    timeout-minutes: 5
    steps:
      - name: Confirm a Docker daemon is reachable
        run: |
          set -euo pipefail
          # CHAOS-4963: this step's own message mentions "docker" in prose,
          # which pulls it into tests/tooling/test_go_integration_sharding.py's
          # unapproved-registry scanner's scope -- and that scanner's
          # `re.split(r"[\n;]|&&|\|\|", ...)` splitter ignores quotes, so a
          # literal `;` inside this quoted string breaks it into two
          # unbalanced-quote fragments (`unparseable shell`). No semicolons
          # in this message, on purpose -- see CHAOS-4963 for the mechanism.
          if ! docker info > docker-info.txt 2>&1; then
            echo "FATAL: 'docker info' failed on this oci-arc-runners pod -- no reachable Docker daemon. Every downstream build/push leg on this pool depends on this, see docker-info.txt in the job log for the actual error." >&2
            cat docker-info.txt >&2
            exit 1
          fi
          echo "docker info succeeded:"
          cat docker-info.txt

      - name: Confirm the daemon can actually build and run a container
        # `docker info` only proves the socket answers -- it says nothing
        # about whether the daemon can build an image or start a container
        # (the two operations the real build leg below actually needs).
        # This is deliberately NOT `docker/setup-buildx-action` or anything
        # from the real build's own dependency chain, so a failure here
        # points at the POD, never at something the real leg's own steps
        # could also have broken.
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf -- "${workdir}"' EXIT
          printf 'FROM busybox\nCMD ["echo", "dind-smoke-test-ok"]\n' > "${workdir}/Dockerfile"
          if ! docker build -t dind-smoke-test:local "${workdir}"; then
            echo "FATAL: 'docker build' failed on this oci-arc-runners pod -- the daemon answers 'docker info' but cannot build an image." >&2
            exit 1
          fi
          output="$(docker run --rm dind-smoke-test:local)"
          docker rmi dind-smoke-test:local > /dev/null 2>&1 || true
          if [ "${output}" != "dind-smoke-test-ok" ]; then
            echo "FATAL: built the smoke-test image but 'docker run' produced ${output@Q}, expected 'dind-smoke-test-ok' -- the daemon can build but not correctly run a container." >&2
            exit 1
          fi
          echo "docker build + run succeeded: ${output}"

  build:
    name: Build Image
    needs: [changes]
    # CHAOS-4921 M2: a push to MAIN always builds, whatever the paths filter says.
    #
    # The filter decides whether a change is RELEVANT. On a PR that is the right
    # question. On main it is the wrong one, because the artefact -- an image for
    # this commit -- must exist regardless of which files moved, and a skipped
    # build leaves a commit with no image at all.
    #
    # Measured (CHAOS-4921): run 33706407469 for 2d4abbbbb -- the commit carrying
    # ClickHouse migration 084 -- was cancelled by the fe5f540a9 push, and
    # fe5f540a9's own run then SKIPPED the image build on this filter. So no image
    # containing 084 was ever built, and nothing reported an error: one run was
    # cancelled, the other succeeded having built nothing. The cancellation half is
    # fixed by the per-SHA concurrency groups (#2149); this is the skip half.
    #
    # PRs keep the filter. Nothing here changes what a PR builds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    # Every matrix leg checks out the SAME ref (it doesn't vary by
    # target/platform), so they all resolve the same commit SHA -- reading
    # this output from a matrix job is safe here even though GitHub only
    # guarantees the LAST matrix leg to finish "wins" for job outputs in
    # general, because every leg computes an identical value.
    outputs:
      sha: ${{ steps.versioning.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        target: [runner, api]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # CHAOS-4921 (round 3 fix): github.sha, not github.ref -- the
          # matrix job's outputs (read by the mainhead check below) are only
          # trustworthy as "the commit this job built" if every leg checks
          # out the exact same immutable commit. github.ref is a mutable
          # branch ref: if main advances while a slow matrix leg is still
          # running, that leg would check out the NEWER tip, so the last
          # matrix-output writer could report a SHA that doesn't match what
          # earlier legs actually built (a mixed-commit manifest tagged as
          # if it were one commit). github.sha is pinned to the exact commit
          # that triggered this run and never moves.
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine version
        id: versioning
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(echo "${SHA}" | cut -c1-7)
          PYTHON_VERSION="0.0.0.dev0+${SHORT_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            PYTHON_VERSION="${{ github.event.release.tag_name }}"
          fi
          echo "python_version=${PYTHON_VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      # CHAOS-4921: dead configuration, flagged by ci-flakes' review of this
      # PR -- `steps.meta.outputs.*` is not referenced anywhere else in this
      # job. The actual push below (`Build and push by digest`) uses a
      # hardcoded `tags:` with `push-by-digest=true` and applies no tags
      # from this step. Left in place rather than deleted because deleting
      # it invites someone to re-add an equivalent step without noticing
      # this comment; if `meta.outputs.tags` is ever wired into the push
      # below, its `latest` line must gain the same main-head gate the
      # `merge`/`go-merge` jobs' `Docker meta` steps use (round 3, this PR)
      # -- copying this ungated line instead reintroduces this PR's bug.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/dev-hops-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.event_name == 'release' && !github.event.release.prerelease) }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CHAOS-4922: the base must exist BEFORE this job reads the Dockerfile.
      #
      # mirror-test-images.yml is a SIBLING workflow on the same event -- neither
      # waits for the other, so on a first landing (or any base bump) this build
      # can reach a ghcr ref nothing has created yet. Measured while writing
      # this: the package 404'd, and a manual dispatch of the mirror was
      # CANCELLED by the single-pending-run-per-group rule before it could copy
      # anything. Depending on a sibling workflow's timing is not a guarantee.
      #
      # So the build ensures its own input. Idempotent: an inspect that succeeds
      # is a no-op, and at worst this reads ONE anonymous Hub manifest -- no Hub
      # credentials, which is the whole point of the mirror. The mirror workflow
      # remains the scheduled/bulk path; this is the ordering floor.
      #
      # Runs after the ghcr login above, because creating the tag writes to ghcr.
      - name: Ensure the Python base image is mirrored
        run: |
          set -euo pipefail
          # ONE derivation, shared with mirror-test-images.yml (CHAOS-4922).
          # Two validators for one property diverged; the gap was the silent
          # failure set. ci/python_base_ref.sh is now the only definition.
          eval "$(bash ci/python_base_ref.sh "${{ github.repository_owner }}" \
                  | awk '$1 == "ghcr" { print "ref=" $2 } $1 == "upstream" { print "upstream=" $2 }')"
          tag="${ref%@*}"
          digest="${ref##*@}"
          repo="${upstream%%:*}"
          if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
            echo "base already mirrored, no action: ${ref}"
          else
            echo "base absent from ghcr, copying from Docker Hub: ${ref}"
            # Digest-addressed on BOTH sides, so this copies exactly the image
            # the Dockerfile names -- never whatever the tag points at today.
            docker buildx imagetools create --tag "${tag}" "docker.io/library/${repo}@${digest}"
            # Verify by DIGEST rather than trusting the create's exit code: the
            # thing the build depends on is the image being resolvable at this
            # ref, not the command having returned zero.
            docker buildx imagetools inspect "${ref}" >/dev/null
            echo "base created and verified: ${ref}"
          fi

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.versioning.outputs.python_version }}
          tags: ghcr.io/${{ github.repository_owner }}/dev-hops-${{ matrix.target }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.target }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Digests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
    strategy:
      matrix:
        target: [runner, api]
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # CHAOS-4921 (round 2 follow-up): per-SHA concurrency groups mean
      # this main build no longer runs serialized against other main
      # builds, so it can finish AFTER a build for a newer main commit
      # already published the moving `latest`/`main` tags. Ordering is
      # enforced HERE, at the publish step, rather than by re-serializing
      # builds (which would reintroduce the pending-cancellation defect
      # this group-key change exists to fix): only tag `latest`/`main` if
      # the commit this job built is STILL main's current head right now.
      # An older build that finishes late publishes only its immutable
      # sha-tag; whichever build is actually head-of-main when it reaches
      # THIS step gets the moving tags, regardless of which one started
      # first.
      - name: Determine whether this build is main's current head
        id: mainhead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          built_sha="${{ needs.build.outputs.sha }}"
          current_main_sha="$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)"
          echo "built_sha=${built_sha} current_main_sha=${current_main_sha}"
          if [ "${built_sha}" = "${current_main_sha}" ]; then
            echo "is_main_head=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_main_head=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/dev-hops-${{ matrix.target }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' || steps.mainhead.outputs.is_main_head == 'true' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ (github.ref == 'refs/heads/main' && steps.mainhead.outputs.is_main_head == 'true') || (github.event_name == 'release' && !github.event.release.prerelease) }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/dev-hops-${{ matrix.target }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/dev-hops-${{ matrix.target }}:${{ steps.meta.outputs.version }}

  # ---------------------------------------------------------------------------
  # Go runtime images (CHAOS-3923)
  #
  # Every deployment renderer -- deploy/docker-compose/compose.go-workers.yml,
  # deploy/helm/dev-health/values.yaml, deploy/kubernetes/go-workers.yaml --
  # references ghcr.io/<owner>/dev-health-go-<target>, but nothing published
  # them: go.yml builds these same targets with a plain `docker build` for Trivy
  # and SBOM only. A host with just Docker installed therefore could not start
  # the Go topology at all, and the failure looked like a registry permission
  # problem rather than a missing publish job.
  #
  # The target list is ci/check_go_containers.sh's ALL_TARGETS, kept whole on
  # purpose: a second, shorter list is how the next target goes unpublished.
  # ---------------------------------------------------------------------------
  go-build:
    name: Build Go Image
    needs: [changes]
    # CHAOS-4921 M2: a push to MAIN always builds, whatever the paths filter says.
    #
    # The filter decides whether a change is RELEVANT. On a PR that is the right
    # question. On main it is the wrong one, because the artefact -- an image for
    # this commit -- must exist regardless of which files moved, and a skipped
    # build leaves a commit with no image at all.
    #
    # Measured (CHAOS-4921): run 33706407469 for 2d4abbbbb -- the commit carrying
    # ClickHouse migration 084 -- was cancelled by the fe5f540a9 push, and
    # fe5f540a9's own run then SKIPPED the image build on this filter. So no image
    # containing 084 was ever built, and nothing reported an error: one run was
    # cancelled, the other succeeded having built nothing. The cancellation half is
    # fixed by the per-SHA concurrency groups (#2149); this is the skip half.
    #
    # PRs keep the filter. Nothing here changes what a PR builds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    # Every matrix leg checks out the SAME ref, so they all resolve the
    # same commit -- reusing the existing `commit` output is safe here
    # despite GitHub's per-matrix-leg output ambiguity in general.
    outputs:
      sha: ${{ steps.versioning.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - worker
          - scheduler
          - reconciler
          - stream-runner
          - operator
          - contractcheck
          - migrate
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
        # CHAOS-4906: (worker, linux/arm64) is built by the dedicated
        # go-build-worker-arm64-self-hosted/-fallback pair below instead --
        # the self-hosted-pool pilot for this workflow. Excluded here so it
        # is never built twice; go-merge's digest download (a wildcard glob
        # on the artifact name) picks up whichever leg produced the real
        # artifact without caring which job did it.
        exclude:
          - target: worker
            platform: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # CHAOS-4921 (round 3 fix): github.sha, not github.ref -- the
          # matrix job's outputs (read by the mainhead check below) are only
          # trustworthy as "the commit this job built" if every leg checks
          # out the exact same immutable commit. github.ref is a mutable
          # branch ref: if main advances while a slow matrix leg is still
          # running, that leg would check out the NEWER tip, so the last
          # matrix-output writer could report a SHA that doesn't match what
          # earlier legs actually built (a mixed-commit manifest tagged as
          # if it were one commit). github.sha is pinned to the exact commit
          # that triggered this run and never moves.
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine build metadata
        id: versioning
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION="$(echo "${SHA}" | cut -c1-7)"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          fi
          # The commit timestamp, not "now": the image stays byte-reproducible
          # from a given commit, which is what ci/check_go_containers.sh asserts
          # with its own fixed metadata.
          EPOCH=$(git log -1 --pretty=%ct)
          {
            echo "version=${VERSION}"
            echo "commit=${SHA}"
            echo "build_time=$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_date_epoch=${EPOCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/go-worker.Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.versioning.outputs.version }}
            COMMIT=${{ steps.versioning.outputs.commit }}
            BUILD_TIME=${{ steps.versioning.outputs.build_time }}
            SOURCE_DATE_EPOCH=${{ steps.versioning.outputs.source_date_epoch }}
          tags: ghcr.io/${{ github.repository_owner }}/dev-health-go-${{ matrix.target }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-go-${{ matrix.target }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Attempt leg for the (worker, linux/arm64) pilot: real work on the
  # self-hosted arm64 pool. Only exists when pick-runner said yes AND the
  # dind smoke test passed (a job dependency's failure blocks this one
  # naturally -- no `if:` needed to enforce that half). Mirrors go-build's
  # own steps exactly, hardcoded to this one (target, platform) pair
  # instead of reading them from a matrix.
  go-build-worker-arm64-self-hosted:
    needs: [pick-runner, dind-smoke-test]
    if: needs.pick-runner.outputs.try_self_hosted == 'true'
    runs-on: [self-hosted, oci-arc-runners]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine build metadata
        id: versioning
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION="$(echo "${SHA}" | cut -c1-7)"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          fi
          EPOCH=$(git log -1 --pretty=%ct)
          {
            echo "version=${VERSION}"
            echo "commit=${SHA}"
            echo "build_time=$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_date_epoch=${EPOCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        # timeout-minutes: 8, the DOUBLE-BOUND lesson from go.yml's own
        # pilot (CF, 09-03, acr's near-miss) -- an inner bound shorter than
        # this job's own 10-minute cap, native GitHub Actions per-step
        # syntax rather than a shell `timeout` wrapper (this step is a
        # `uses:` action, not a raw `run:` command, so there is no command
        # line to wrap). Fires as a clean step timeout/failure instead of
        # letting an ambiguous job-level cancellation reach the fallback's
        # own poll logic. 8m leaves 2m of headroom under the 10m job cap
        # for checkout/buildx-setup/registry-login, generous against the
        # measured 1m37s hosted baseline (run 33764964734) -- but that
        # measurement is n=1 and from the HOSTED runner, not this pool, so
        # the inner bound is what actually protects against a slower or
        # stuck pool build, not a number trusted to stay representative.
        timeout-minutes: 8
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/go-worker.Dockerfile
          target: worker
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.versioning.outputs.version }}
            COMMIT=${{ steps.versioning.outputs.commit }}
            BUILD_TIME=${{ steps.versioning.outputs.build_time }}
            SOURCE_DATE_EPOCH=${{ steps.versioning.outputs.source_date_epoch }}
          tags: ghcr.io/${{ github.repository_owner }}/dev-health-go-worker
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-go-worker-self-hosted
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Fallback leg for the (worker, linux/arm64) pilot -- GitHub-hosted arm64,
  # always defined, and the SOLE source of truth for the required check
  # below. Poll shape is BYTE-IDENTICAL to go.yml's go-arm64-numeric-parity-
  # fallback (same contract, same job_status/job_left_queue/job_lost_runner
  # logic, same F2/F5 same-run exemption -- see that job's own comments for
  # the full rationale of every design choice below); only the payload
  # (steps.own.outputs.run_here == 'true' branch) differs, matching
  # go-build's own build-and-push steps for this one (target, platform)
  # pair instead of running `go test`.
  go-build-worker-arm64-fallback:
    needs: pick-runner
    if: always()
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Determine the self-hosted attempt's outcome, or that it never left the queue
        id: wait
        if: needs.pick-runner.outputs.try_self_hosted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_TIMEOUT_MINUTES: 5
          ATTEMPT_TIMEOUT_MINUTES: 10
        run: |
          set -euo pipefail
          job_status() {
            local raw attempt job_count
            for attempt in 1 2 3; do
              if raw="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" 2>/dev/null)"; then
                job_count="$(printf '%s' "${raw}" | jq '.jobs | length')"
                if [ "${job_count}" -ge 100 ]; then
                  echo "too_many_jobs null"
                  return 0
                fi
                printf '%s' "${raw}" | jq -r '
                  [.jobs[] | select(.name=="go-build-worker-arm64-self-hosted")] as $matches
                  | if ($matches | length) > 1 then "ambiguous null"
                    elif ($matches | length) == 0 then "not_created null"
                    else ($matches[0]) as $j | "\($j.status) \($j.conclusion // "null")"
                    end'
                return 0
              fi
              sleep 5
            done
            printf 'api_error null\n'
          }
          fail_if_ambiguous() {
            if [ "${status}" = "ambiguous" ]; then
              echo "FATAL: more than one job named go-build-worker-arm64-self-hosted in this run's job list -- refusing to guess which is the real attempt rather than silently picking one" >&2
              exit 1
            fi
          }
          fail_if_too_many_jobs() {
            if [ "${status}" = "too_many_jobs" ]; then
              echo "FATAL: this run reports >=100 jobs on a single per_page=100 page -- job_status can no longer see every job without real pagination" >&2
              exit 1
            fi
          }
          job_left_queue() {
            case "${status}" in
              in_progress|completed) return 0 ;;
              *) return 1 ;;
            esac
          }

          deadline=$(( $(date -u +%s) + QUEUE_TIMEOUT_MINUTES * 60 ))
          left_queue="false"
          status="queued"
          phase1_total_polls=0
          phase1_api_error_polls=0
          while [ "$(date -u +%s)" -lt "${deadline}" ]; do
            read -r status conclusion <<<"$(job_status)"
            fail_if_ambiguous
            fail_if_too_many_jobs
            phase1_total_polls=$((phase1_total_polls + 1))
            if [ "${status}" = "api_error" ]; then
              phase1_api_error_polls=$((phase1_api_error_polls + 1))
              sleep 15
              continue
            fi
            if job_left_queue; then
              left_queue="true"
              break
            fi
            sleep 15
          done

          if [ "${left_queue}" != "true" ]; then
            read -r status conclusion <<<"$(job_status)"
            fail_if_ambiguous
            fail_if_too_many_jobs
            phase1_total_polls=$((phase1_total_polls + 1))
            if [ "${status}" = "api_error" ]; then
              phase1_api_error_polls=$((phase1_api_error_polls + 1))
            elif job_left_queue; then
              left_queue="true"
            fi
          fi

          if [ "${left_queue}" != "true" ]; then
            if [ "${phase1_api_error_polls}" -eq "${phase1_total_polls}" ] && [ "${phase1_total_polls}" -gt 0 ]; then
              echo "self-hosted attempt's queue status could not be observed at all in ${phase1_total_polls} attempts (gh api kept failing) -- claiming the work here as the safe default, but this does NOT confirm the pool was actually saturated"
            else
              echo "self-hosted attempt still queued after ${QUEUE_TIMEOUT_MINUTES}m (${phase1_api_error_polls}/${phase1_total_polls} polls were api_error) -- claiming the work here"
            fi
            echo "outcome=unclaimed" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          report_terminal_conclusion() {
            echo "self-hosted attempt completed with conclusion: ${conclusion}"
            if [ "${conclusion}" = "success" ]; then
              echo "outcome=claimed-success" >> "${GITHUB_OUTPUT}"
            else
              echo "outcome=claimed-failure" >> "${GITHUB_OUTPUT}"
            fi
            exit 0
          }
          job_lost_runner() {
            case "${status}" in
              completed) return 1 ;;
              in_progress) return 1 ;;
              *) return 0 ;;
            esac
          }

          deadline=$(( $(date -u +%s) + (ATTEMPT_TIMEOUT_MINUTES + 3) * 60 ))
          total_polls=0
          api_error_polls=0
          while [ "$(date -u +%s)" -lt "${deadline}" ]; do
            read -r status conclusion <<<"$(job_status)"
            fail_if_ambiguous
            fail_if_too_many_jobs
            total_polls=$((total_polls + 1))
            if [ "${status}" = "api_error" ]; then
              api_error_polls=$((api_error_polls + 1))
              sleep 15
              continue
            fi
            if [ "${status}" = "completed" ]; then
              report_terminal_conclusion
            fi
            if job_lost_runner; then
              echo "self-hosted attempt is no longer in a started state (now: ${status}) -- the runner was likely lost; claiming the work here instead of waiting out the remaining budget"
              echo "outcome=unclaimed" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 15
          done

          read -r status conclusion <<<"$(job_status)"
          fail_if_ambiguous
          fail_if_too_many_jobs
          total_polls=$((total_polls + 1))
          if [ "${status}" = "api_error" ]; then
            api_error_polls=$((api_error_polls + 1))
          elif [ "${status}" = "completed" ]; then
            report_terminal_conclusion
          elif job_lost_runner; then
            echo "self-hosted attempt is no longer in a started state (now: ${status}) -- the runner was likely lost; claiming the work here instead of reporting a failure"
            echo "outcome=unclaimed" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${api_error_polls}" -eq "${total_polls}" ] && [ "${total_polls}" -gt 0 ]; then
            echo "self-hosted attempt's status could not be observed at all in ${total_polls} attempts (gh api kept failing) -- NOT claiming this reflects the attempt's own outcome; treating as a failure rather than reporting a silent pass" >&2
          else
            echo "self-hosted attempt left the queue but never reached a terminal state within $((ATTEMPT_TIMEOUT_MINUTES + 3))m (${api_error_polls}/${total_polls} polls were api_error) -- its own timeout-minutes should have ended it by now; treating this as a failure rather than reporting a silent pass" >&2
          fi
          echo "outcome=claimed-failure" >> "${GITHUB_OUTPUT}"

      - name: Determine whether this leg owns the real work
        id: own
        run: |
          set -euo pipefail
          if [ "${{ needs.pick-runner.outputs.try_self_hosted }}" != "true" ] || [ "${{ steps.wait.outputs.outcome }}" = "unclaimed" ]; then
            echo "run_here=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_here=false" >> "${GITHUB_OUTPUT}"
            echo "self-hosted attempt already reached a terminal state (${{ steps.wait.outputs.outcome }}); skipping the fallback's own real-work steps"
          fi

      - name: Fail this leg if the self-hosted attempt itself failed
        if: steps.own.outputs.run_here == 'false' && steps.wait.outputs.outcome == 'claimed-failure'
        run: |
          echo "self-hosted attempt (go-build-worker-arm64-self-hosted) did not succeed; failing this leg so the required check reflects it" >&2
          exit 1

      - name: Checkout code
        if: steps.own.outputs.run_here == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        if: steps.own.outputs.run_here == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine build metadata
        id: versioning
        if: steps.own.outputs.run_here == 'true'
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION="$(echo "${SHA}" | cut -c1-7)"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          fi
          EPOCH=$(git log -1 --pretty=%ct)
          {
            echo "version=${VERSION}"
            echo "commit=${SHA}"
            echo "build_time=$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_date_epoch=${EPOCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.own.outputs.run_here == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        if: steps.own.outputs.run_here == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/go-worker.Dockerfile
          target: worker
          platforms: linux/arm64
          build-args: |
            VERSION=${{ steps.versioning.outputs.version }}
            COMMIT=${{ steps.versioning.outputs.commit }}
            BUILD_TIME=${{ steps.versioning.outputs.build_time }}
            SOURCE_DATE_EPOCH=${{ steps.versioning.outputs.source_date_epoch }}
          tags: ghcr.io/${{ github.repository_owner }}/dev-health-go-worker
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        if: steps.own.outputs.run_here == 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.own.outputs.run_here == 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-go-worker-fallback
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  go-merge:
    name: Merge Go Digests
    runs-on: ubuntu-latest
    # CHAOS-4906: go-build-worker-arm64-fallback added -- same "needs ONLY
    # the fallback leg, never the self-hosted attempt directly" shape as
    # go.yml's own aggregator (see that job's comment for the full
    # rationale: the attempt can end up permanently `queued` with no
    # terminal state, and this job's own `needs:` would otherwise wait on
    # it forever). go-build's `sha` output is untouched -- the other six
    # targets' arm64 legs, and every amd64 leg, still populate it.
    needs: [go-build, go-build-worker-arm64-fallback]
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.push_images == 'true')
    strategy:
      matrix:
        target:
          - worker
          - scheduler
          - reconciler
          - stream-runner
          - operator
          - contractcheck
          - migrate
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-go-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # CHAOS-4921 (round 2 follow-up): see the identical step in the
      # `merge` job above for the full rationale -- per-SHA concurrency
      # groups mean this build isn't serialized against other main
      # builds, so ordering for the moving tags is enforced here instead.
      - name: Determine whether this build is main's current head
        id: mainhead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          built_sha="${{ needs.go-build.outputs.sha }}"
          current_main_sha="$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)"
          echo "built_sha=${built_sha} current_main_sha=${current_main_sha}"
          if [ "${built_sha}" = "${current_main_sha}" ]; then
            echo "is_main_head=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_main_head=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/dev-health-go-${{ matrix.target }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' || steps.mainhead.outputs.is_main_head == 'true' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ (github.ref == 'refs/heads/main' && steps.mainhead.outputs.is_main_head == 'true') || (github.event_name == 'release' && !github.event.release.prerelease) }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/dev-health-go-${{ matrix.target }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/dev-health-go-${{ matrix.target }}:${{ steps.meta.outputs.version }}
