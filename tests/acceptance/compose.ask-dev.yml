services:
  postgres:
    container_name: "${ASK_DEV_ACCEPTANCE_PROJECT_NAME:-dev-health-ask-dev-acceptance}-postgres"
    ports: !reset []

  pgbouncer:
    container_name: "${ASK_DEV_ACCEPTANCE_PROJECT_NAME:-dev-health-ask-dev-acceptance}-pgbouncer"
    ports: !reset []

  clickhouse:
    container_name: "${ASK_DEV_ACCEPTANCE_PROJECT_NAME:-dev-health-ask-dev-acceptance}-clickhouse"
    ports: !reset []

  valkey:
    container_name: "${ASK_DEV_ACCEPTANCE_PROJECT_NAME:-dev-health-ask-dev-acceptance}-valkey"
    ports: !reset []

  migrate:
    container_name: "${ASK_DEV_ACCEPTANCE_PROJECT_NAME:-dev-health-ask-dev-acceptance}-migrate"
    environment:
      DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER: "1"

  api:
    container_name: "${ASK_DEV_ACCEPTANCE_PROJECT_NAME:-dev-health-ask-dev-acceptance}-api"
    build:
      args:
        # The graph trial remains optional in normal images; this graph-enabled
        # acceptance API must actually contain its driver.
        DEV_HEALTH_INSTALL_TARGET: ".[context-graph-trial]"
    # Docker chooses a free loopback port by default because local development
    # routinely runs multiple Compose projects. Callers can still pin one.
    ports: !override
      - "127.0.0.1:${ASK_DEV_ACCEPTANCE_API_PORT:-0}:8000"
    environment:
      ENVIRONMENT: acceptance
      ASK_DEV_LIVE_ACCEPTANCE: "1"
      LLM_PROVIDER: openai
      ASK_DEV_ACCEPTANCE_OPENAI_BASE_URL: http://ask-dev-scripted-openai:8001/v1
      ASK_DEV_ACCEPTANCE_OPENAI_API_KEY: ask-dev-acceptance-local-v1
      JWT_SECRET_KEY: ask-dev-acceptance-jwt-secret-key-v1
      # CHAOS-3532: the QUA ladder (off -> shadow -> commit). Interpolated
      # here, but NOT from whatever the invoking shell happens to export --
      # run_ask_dev_compose.sh clears both names unconditionally and then
      # sets them from its own one-shot ASK_DEV_ACCEPTANCE_QUA knob, AFTER
      # the clear.
      #
      # These are the only ASK_DEV_-namespaced vars that launcher clears.
      # The prefix normally means "cannot collide with an ambient dev .env
      # by construction" -- for these two that assumption is false: ops/.env
      # sets both to 1 for the DEV stack and direnv exports it into every
      # shell under the ops tree. Passing them through booted every
      # acceptance stack from a developer shell silently ARMED, which does
      # not merely add a feature: the shadow changes what every baseline
      # corpus case measures, and armed runs are graded against predictions
      # registered on an unarmed system.
      #
      # The `:-0` default therefore guards only the case where the launcher
      # was bypassed entirely (a raw `docker compose` invocation). Off is the
      # only safe default for that path too.
      #
      # Production reads both with a strict `os.getenv(...) == "1"`
      # (production_runtime.py:663,679), so unset, empty, "0" and "true" are
      # ALL off -- an empty value fails closed rather than reading as
      # enabled. And commit already implies shadow at :679, so no interlock
      # is needed between them.
      ASK_DEV_QUA_SHADOW_ENABLED: "${ASK_DEV_QUA_SHADOW_ENABLED:-0}"
      ASK_DEV_QUA_COMMIT_ENABLED: "${ASK_DEV_QUA_COMMIT_ENABLED:-0}"
      # CHAOS-3219 Wave 4 quota plumbing: these are the ONLY two Ask Dev
      # settings production code actually reads from the environment
      # (org_policy.py platform_operator_request_limit /
      # platform_operator_cost_limit_microusd -- os.getenv, not a settings-DB
      # lookup). They are OPERATOR CEILINGS that clamp the per-org
      # ask_dev_platform_monthly_request_limit / ..._cost_microusd settings
      # (which default to 1_000 requests / 100_000_000 microusd when no org
      # override exists -- settings-DB-backed, category ASK_DEV, set via the
      # generic admin settings API, NOT env vars). Retention (0/30-day) has
      # NO env var in production -- it is a per-conversation request field
      # validated against models.dev_persistence.DEV_RETENTION_DAYS, with an
      # org-level default stored under the settings key
      # ask_dev_retention_days (category ASK_DEV); set it through the admin
      # settings API, not through this compose file.
      #
      # Live-proven 2026-08-05: pinning these to org_policy.py's documented
      # hard FLOOR (PLATFORM_MONTHLY_REQUEST_LIMIT_MIN=100 /
      # PLATFORM_MONTHLY_COST_LIMIT_MIN_MICROUSD=10_000_000) does make the
      # enforcement fire for real -- a full boot tripped
      # DevMonthlyCostLimitExceeded (HTTP 429 cost_limit_reached) partway
      # through the existing smoke suite, proving the wiring end-to-end. But
      # the floor is *too* tight to be this gate's shared default: it broke
      # already-passing coverage before Wave 4's corpus even exists. Pinned
      # here to a value with real headroom over current smoke-suite usage
      # (still below the operator hard max of 5_000/500_000_000) so the
      # baseline gate stays green; Phase 3c's dedicated quota-exceeded corpus
      # case should trip the limit with its OWN scoped mechanism (e.g. an
      # admin settings override on just that case's org, or a short-lived env
      # override for a dedicated run) rather than by lowering this shared
      # default -- reuse the floor values above as the known-good "this WILL
      # trip it" reference point.
      ASK_DEV_PLATFORM_MONTHLY_REQUEST_MAX: "1000"
      ASK_DEV_PLATFORM_MONTHLY_COST_MAX_MICROUSD: "200000000"
      # W3 graph acceptance is explicitly armed only in this overlay. The
      # trial store is isolated from the production Valkey service and the
      # read flag remains off in ordinary Compose deployments.
      CONTEXT_FABRIC_GRAPH_READ_ENABLED: "1"
      CONTEXT_FABRIC_GRAPH_PROJECTION_ENABLED: "1"
      CONTEXT_FABRIC_GRAPH_STORE_URI: redis://graph-trial-store:6379
      ASK_DEV_GRAPH_ROUTING_ENABLED: "1"
      # Acceptance-only fault seam: one distinct, graph-routable question
      # reaches the real routing boundary and receives UNAVAILABLE so the
      # browser must observe the native fallback. Production environments
      # cannot arm this because production_runtime also requires
      # ENVIRONMENT=acceptance.
      ASK_DEV_GRAPH_ACCEPTANCE_FALLBACK_ARM: "1"
      ASK_DEV_GRAPH_ACCEPTANCE_FALLBACK_QUESTION: "Which teams are falling behind?"
    depends_on:
      ask-dev-scripted-openai:
        condition: service_healthy
    networks:
      - default
      - ask-dev-acceptance

  # ---------------------------------------------------------------------------
  # CHAOS-3219 Wave 4: general jobs fleet for "API+jobs" acceptance parity.
  #
  # Evidence (see ops PR description / CHAOS-3219 report for full citations):
  # Ask Dev itself has ZERO Celery dependency today -- answer generation runs
  # synchronously in the API/SSE request path (api/dev/orchestrator.py,
  # runtime.py), quota enforcement is inline SQL (persistence/service.py
  # _enforce_admission_limits/_enforce_platform_allowance), and its retention
  # sweep (DevPersistenceService.cleanup_expired,
  # persistence/service.py:2858) is NEVER called from workers/tasks.py, any
  # beat_schedule entry (workers/config.py), or any CLI command -- it is
  # dead/unwired code today (a product gap, not an acceptance-environment
  # gap; flagged upstream). So no queue name is "required by Ask Dev".
  # `worker` + `beat` are still booted because the release-blocking gate's
  # "API+jobs" framing and Wave 4 Phase 3c (persistence/retention/ops corpus
  # group) need a live, real Celery+beat fleet to exercise the platform's
  # GENERAL scheduled jobs (prune-rate-limit-observations,
  # prune-external-ingest-batches, monitor-queue-depths, ...) -- topology
  # parity with production, not an Ask Dev-specific requirement. Per the
  # "no required job may exit success after skipping substantive work"
  # principle, each gets a healthcheck that proves the process is doing real
  # work, not just that the container is running.
  # ---------------------------------------------------------------------------
  worker:
    container_name: "${ASK_DEV_ACCEPTANCE_PROJECT_NAME:-dev-health-ask-dev-acceptance}-worker"
    healthcheck:
      # Codex finding (HIGH, 2026-08-05): `celery inspect ping` only proves
      # the control-plane RPC answers -- it is served independently of the
      # task pool, so a worker whose pool is wedged (deadlock, exhausted
      # concurrency, a stuck task) can keep answering ping while never
      # draining a single queued task. Real receipt instead: dispatch a
      # uniquely-identified task through the SAME required queue
      # (`monitoring`) the worker actually consumes and block for ITS
      # result (scripts/acceptance/healthcheck_worker_probe.py -- reuses
      # the existing monitor_queue_depths production task, no new
      # production code). RED-verified: a `--pool=solo` worker occupied by
      # a deliberately blocking task times this out and `up --wait`
      # correctly reports unhealthy (see run history / PR description for
      # the live proof).
      test:
        - "CMD"
        - "python"
        - "/app/scripts/acceptance/healthcheck_worker_probe.py"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  beat:
    container_name: "${ASK_DEV_ACCEPTANCE_PROJECT_NAME:-dev-health-ask-dev-acceptance}-beat"
    healthcheck:
      # Codex finding (HIGH, 2026-08-05): the persistent schedule file's
      # mtime is touched by beat's own bookkeeping regardless of whether a
      # due task was actually published and consumed -- it does not prove
      # publication or consumption. beat cannot itself execute a probe (it
      # only schedules), so the real receipt is what its own dispatching
      # already produces: the existing `monitor-queue-depths` beat entry
      # (interval 60s, queue `monitoring`) is the sentinel, and a WORKER
      # executing it writes a timestamped result into the shared Celery
      # result backend -- read here
      # (scripts/acceptance/healthcheck_beat_sentinel.py) and required to
      # be within a bounded freshness window. A beat that stopped
      # dispatching (or a fleet that stopped consuming) ages out and this
      # reports unhealthy.
      test:
        - "CMD"
        - "python"
        - "/app/scripts/acceptance/healthcheck_beat_sentinel.py"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  ask-dev-scripted-openai:
    container_name: "${ASK_DEV_ACCEPTANCE_PROJECT_NAME:-dev-health-ask-dev-acceptance}-scripted-openai"
    profiles: ["ask-dev-acceptance"]
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: api
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
    entrypoint:
      - python
      - -m
      - dev_health_ops.llm.agent.scripted_openai_service
    environment:
      ENVIRONMENT: acceptance
      ASK_DEV_LIVE_ACCEPTANCE: "1"
      ASK_DEV_ACCEPTANCE_OPENAI_API_KEY: ask-dev-acceptance-local-v1
      ASK_DEV_ACCEPTANCE_OPENAI_PORT: "8001"
      # CHAOS-3219 Phase 3: without this pair the scripted provider served
      # NOTHING. The `api` image target ships only the built wheel -- no
      # `tests/` tree -- so provider_scripts._scripts_dir()'s relative
      # default resolved against WORKDIR /app and missed, try_load_engine()
      # swallowed the failure and returned None (correct for organic
      # production traffic, catastrophic here), and all 19 scripted cases
      # fell through to the unscripted default heuristic while PASSING.
      # Set EXPLICITLY rather than relying on the relative walk-up that
      # failed silently. A literal path, never a compose interpolation: an
      # interpolated variable would also need triaging into
      # run_ask_dev_compose.sh's unset list, per
      # test_launcher_hardens_compose_interpolation_env_for_every_var_it_boots.
      ASK_DEV_SCRIPTED_PROVIDER_SCRIPTS_DIR: /opt/ask-dev/provider-scripts
    volumes:
      # Read-only: these fixtures are an oracle the provider reads, never
      # writes. Mounted rather than baked into the image so the acceptance
      # fault matrix cannot drift from the corpus it is generated beside.
      - ./tests/acceptance/world/ask-dev-world.v1/provider-scripts:/opt/ask-dev/provider-scripts:ro
    expose:
      - "8001"
    healthcheck:
      # CHAOS-3219 Phase 3 (codex adversarial review, MEDIUM, confirmed):
      # `wget --spider` only checks the STATUS CODE, and /healthz answers 200
      # even when the engine is dead -- so Docker health stayed green on a
      # dead engine, `api` started against it, and the launcher's smoke/web
      # leg ran happily against the unscripted heuristic. Only the Wave 4
      # pytest precondition caught it, which left every boot path that does
      # not run that step carrying the original false-health failure.
      # This validates the BODY, so the stack refuses to come up at all when
      # the scripted matrix is not actually loaded.
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.request
          with urllib.request.urlopen("http://localhost:8001/healthz", timeout=3) as response:
              engine = json.load(response).get("scripted_engine") or {}
          sys.exit(0 if engine.get("loaded") else 1)
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: "no"
    networks:
      - ask-dev-acceptance

  web:
    profiles: ["ask-dev-acceptance"]
    container_name: "${ASK_DEV_ACCEPTANCE_PROJECT_NAME:-dev-health-ask-dev-acceptance}-web"
    build:
      context: ${ASK_DEV_WEB_CONTEXT:?pass --web-root to the acceptance launcher}
      dockerfile: Dockerfile
      target: runner
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
      AUTH_SECRET: ask-dev-acceptance-web-auth-secret-v1
      # Leave the canonical URL empty by default so Auth.js derives the
      # loopback origin from the inbound Host header. A caller that owns a
      # deliberately pinned web port may still provide this override.
      AUTH_URL: "${ASK_DEV_ACCEPTANCE_WEB_URL:-}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ASK_DEV_ACCEPTANCE_WEB_PORT:-0}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: "no"

networks:
  ask-dev-acceptance:
    internal: true
