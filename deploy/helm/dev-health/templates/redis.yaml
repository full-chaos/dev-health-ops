{{- if .Values.valkey.enabled }}
{{- if and .Values.valkey.acl.enabled (or (not .Values.valkey.acl.secretName) (not .Values.valkey.acl.secretKey)) }}{{- fail "valkey.acl.enabled needs valkey.acl.secretName and valkey.acl.secretKey: the ACL file is read from that Secret key, and Valkey does not start without the file it was told to load" }}{{- end }}
{{- if and .Values.valkey.acl.enabled (not .Values.networkPolicy.enabled) }}{{- fail "valkey.acl.enabled needs networkPolicy.enabled=true: the ACL file keeps the default user open to every key, so the network policy is what bounds who can reach the auth rate-limit counters" }}{{- end }}
{{- $policies := list "noeviction" "allkeys-lru" "allkeys-lfu" "allkeys-random" "volatile-lru" "volatile-lfu" "volatile-random" "volatile-ttl" }}
{{- if not (has (toString .Values.valkey.maxmemoryPolicy) $policies) }}{{- fail (printf "valkey.maxmemoryPolicy must be one of %s; got %q" (join ", " $policies) (toString .Values.valkey.maxmemoryPolicy)) }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-health.fullname" . }}-valkey
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "valkey" "context" $) | nindent 4 }}
spec:
  replicas: 1
  {{- /* A rolling update would start the new pod beside the old one on the same ReadWriteOnce volume and append-only file. */}}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "valkey" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "valkey" "context" $) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: valkey
          image: {{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}
          args:
            - --appendonly
            - "yes"
            - --maxmemory
            - {{ .Values.valkey.maxmemory | quote }}
            - --maxmemory-policy
            - {{ .Values.valkey.maxmemoryPolicy }}
            {{- if .Values.valkey.acl.enabled }}
            - --aclfile
            - /etc/valkey-acl/{{ .Values.valkey.acl.secretKey }}
            {{- end }}
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 3
          {{- if or .Values.valkey.persistence.enabled .Values.valkey.acl.enabled }}
          volumeMounts:
            {{- if .Values.valkey.persistence.enabled }}
            - name: valkey-data
              mountPath: /data
            {{- end }}
            {{- if .Values.valkey.acl.enabled }}
            - name: valkey-acl
              mountPath: /etc/valkey-acl
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.valkey.persistence.enabled .Values.valkey.acl.enabled }}
      volumes:
        {{- if .Values.valkey.persistence.enabled }}
        - name: valkey-data
          persistentVolumeClaim:
            claimName: {{ include "dev-health.fullname" . }}-valkey
        {{- end }}
        {{- if .Values.valkey.acl.enabled }}
        - name: valkey-acl
          secret:
            secretName: {{ .Values.valkey.acl.secretName | quote }}
            defaultMode: 0444
            items:
              - key: {{ .Values.valkey.acl.secretKey | quote }}
                path: {{ .Values.valkey.acl.secretKey | quote }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-valkey
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "valkey" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "valkey" "context" $) | nindent 4 }}
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
{{- if .Values.valkey.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dev-health.fullname" . }}-valkey
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "valkey" "context" $) | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.valkey.persistence.storageClass }}
  storageClassName: {{ .Values.valkey.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.valkey.persistence.size }}
{{- end }}
{{- end }}
