    profiles: [auth]
    read_only: true
    restart: 'no'
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    user: 65532:65532
    volumes:
    - type: volume
      source: go_api_workload_bootstrap
      target: /run/workload
  # The workload-token exchange runs with the Compose bootstrap credential subject (AUTH_WORKLOAD_BOOTSTRAP); AUTH_WORKLOAD_EXCHANGE
  # (the Kubernetes TokenReview subject) stays off: there is no cluster. The API listener :8095 is reached by acr-api
  # (acr_auth_workload) and by auth-issuer (auth_plane); no port is published.
  auth-service:
    cap_drop: [ALL]
    depends_on:
      auth-fence-init:
        condition: service_completed_successfully
      auth-grants:
        condition: service_completed_successfully
      auth-keys-init:
        condition: service_completed_successfully
      auth-session-keys-init:
        condition: service_completed_successfully
    environment:
      AUTH_ACCESS_TOKEN_CLASS: eddsa
      AUTH_AUTHORIZE_CALLER_SUBJECTS: ${AUTH_SESSION_ISSUE_WORKLOAD_SUBJECT:-}
      AUTH_DATABASE_SCHEMA: auth
      AUTH_DATABASE_URI: host=postgres port=5432 user=devhealth_auth password='${AUTH_RUNTIME_DATABASE_PASSWORD:-devhealth_auth}' dbname=${POSTGRES_DB:-devhealth} sslmode=disable
      AUTH_JWT_AUDIENCE: dev-health-api
      AUTH_JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # Prod form for platform roles: the PDP reads the role from the assignments, not users.is_superuser (CHAOS-13282).
      AUTH_PLATFORM_ROLES_OWNED: 'true'
      # go-api forwards local login (AUTH_PROXY_LOCAL_LOGIN): the login route mounts only with the lockout key (auth-session-keys-init).
      AUTH_LOGIN_LOCKOUT_KEY_FILE: /run/auth/session/login-lockout-key
      AUTH_SERVICE_HTTP_ADDR: :8095
      AUTH_SERVICE_OPERATOR_HTTP_ADDR: :8096
      AUTH_SERVICE_SHUTDOWN_TIMEOUT: 8s
      AUTH_SESSION_ISSUE_WORKLOAD_SUBJECT: ${AUTH_SESSION_ISSUE_WORKLOAD_SUBJECT:-}
      AUTH_SESSION_SUCCESSOR_KEY_FILE: /run/auth/session/successor-key
      AUTH_SIGNING_KEY_FILE: /run/auth/signing/envelope-private-key.pem
      AUTH_SIGNING_KEY_ID: auth-signing-bigboy
      AUTH_TOKEN_ISSUER_URL: https://auth.bigboy.internal:8443
      # CHAOS-13356: auth-service owns users, as prod's phase 4 (go-api forwards sessions, local login and credentials), so it sends the
      # verify and reset mail and refuses to start without a usable mail setting. The venue's mail sink is its own mailpit service
      # (SMTP mailpit:1025 on the dev-health network, no TLS; read the mail at mail.localhost). AUTH_MAIL_ALLOW_CONSOLE is set only so
      # the http APP_BASE_URL of the venue is accepted; the provider is smtp, not console.
      AUTH_USERS_OWNED: 'true'
      AUTH_MAIL_ALLOW_CONSOLE: 'true'
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      EMAIL_FROM_ADDRESS: noreply@bigboy.invalid
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_USE_TLS: 'false'
      AUTH_VALKEY_URI: redis://valkey:6379/1
      AUTH_WORKLOAD_BOOTSTRAP: 'true'
      OTEL_ENABLED: 'false'
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 10s
      test: [CMD, /usr/local/bin/auth-service, --healthcheck]
      timeout: 5s
    image: '${BIGBOY_AUTH_SERVICE_IMAGE:?BIGBOY_AUTH_SERVICE_IMAGE is the image pin: pass --env-file _records/images.env}'
    networks:
      acr_auth_workload: null
      auth_plane: null
      dev-health: null
    profiles: [auth]
    read_only: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    user: 65532:65532
    volumes:
    - type: volume
      source: auth_signing_keys
      target: /run/auth/signing
      read_only: true
      volume:
        subpath: private
    - type: volume
      source: auth_session_keys
      target: /run/auth/session
      read_only: true
  # The https origin of the issuer, as prod's issuer host (deploy values.prod.yaml, CHAOS-12359): exactly the two public
  # documents of auth-service, nothing else. go-api's JWKS client dials https only, so the issuer cannot be auth-service's plain
  # listener. The TLS pair is a host test pair under BIGBOY_AUTH_ISSUER_TLS_DIR (README "auth venue"); go-api trusts its ca/
  # directory through SSL_CERT_DIR, which keeps the image's own CA file. Runs as 1001 so the key file stays 0600.
  auth-issuer:
    cap_drop: [ALL]
    depends_on:
      auth-service:
        condition: service_healthy
    entrypoint: [sh, -c, 'printf "%s\n" "$$AUTH_ISSUER_NGINX_CONF" > /tmp/auth-issuer.conf && exec nginx -e /dev/stderr -c /tmp/auth-issuer.conf -g "daemon off;"']
    environment:
      AUTH_ISSUER_NGINX_CONF: |
        worker_processes 1;
        pid /tmp/nginx.pid;
        events { worker_connections 128; }
        http {
          access_log off;
          client_body_temp_path /tmp/client_body;
          proxy_temp_path /tmp/proxy;
          fastcgi_temp_path /tmp/fastcgi;
          uwsgi_temp_path /tmp/uwsgi;
          scgi_temp_path /tmp/scgi;
          resolver 127.0.0.11 valid=1s ipv6=off;
          server {
            listen 8443 ssl;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_certificate /run/tls/issuer.pem;
            ssl_certificate_key /run/tls/issuer.key;
            set $$auth_upstream http://auth-service:8095;
            location = /.well-known/openid-configuration { proxy_pass $$auth_upstream; proxy_http_version 1.1; }
            location = /.well-known/jwks.json { proxy_pass $$auth_upstream; proxy_http_version 1.1; }
            location / { return 404; }
          }
        }
    image: ${BIGBOY_ACR_NGINX_IMAGE:?BIGBOY_ACR_NGINX_IMAGE is required (the acr image pin of ci/bigboy/images.env, kept in _records/images.env)}
    networks:
      auth_plane: null
      dev-health:
        aliases: [auth.bigboy.internal]
    profiles: [auth]
    read_only: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    user: 1001:1001
    volumes:
    - type: bind
      source: ${BIGBOY_AUTH_ISSUER_TLS_DIR:-/var/lib/oci-cache/mcp-venue/auth-issuer-tls}/ca/issuer.pem
      target: /run/tls/issuer.pem
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${BIGBOY_AUTH_ISSUER_TLS_DIR:-/var/lib/oci-cache/mcp-venue/auth-issuer-tls}/key/issuer.key
      target: /run/tls/issuer.key
      read_only: true
      bind:
        create_host_path: false
volumes:
  clickhouse_data:
    driver: local
  postgres_data:
    driver: local
  valkey_data:
    driver: local
  auth_signing_keys:
    driver: local
  auth_session_keys:
    driver: local
  acr_workload_bootstrap:
    driver: local
  go_api_workload_bootstrap:
    driver: local
secrets:
  acr_postgres_password:
    file: ${ACR_POSTGRES_ADMIN_PASSWORD_FILE:-/var/lib/oci-cache/mcp-venue/secrets/postgres_admin_password}
  acr_runtime_db_password:
    file: ${ACR_RUNTIME_DB_PASSWORD_FILE:-/var/lib/oci-cache/mcp-venue/secrets/runtime_db_password}
  acr_migration_db_password:
    file: ${ACR_MIGRATION_DB_PASSWORD_FILE:-/var/lib/oci-cache/mcp-venue/secrets/migration_db_password}
  acr_runtime_dsn:
    file: ${ACR_RUNTIME_DSN_FILE:-/var/lib/oci-cache/mcp-venue/secrets/runtime_dsn}
  acr_migration_dsn:
    file: ${ACR_MIGRATION_DSN_FILE:-/var/lib/oci-cache/mcp-venue/secrets/migration_dsn}
  acr_clickhouse_dsn:
    file: ${ACR_CLICKHOUSE_DSN_FILE:-/var/lib/oci-cache/mcp-venue/secrets/clickhouse_dsn}
  acr_evidence_active_kid:
    file: ${ACR_EVIDENCE_ACTIVE_KID_FILE:-/var/lib/oci-cache/mcp-venue/secrets/evidence_active_kid}
  acr_evidence_keys:
    file: ${ACR_EVIDENCE_KEYS_FILE:-/var/lib/oci-cache/mcp-venue/secrets/evidence_keys}
  acr_openai_api_key:
    file: /var/lib/oci-cache/mcp-venue/secrets/openai_api_key
  acr_falkordb_acl:
    file: ${ACR_FALKORDB_ACL_FILE:-/var/lib/oci-cache/mcp-venue/secrets/falkordb_acl}
  acr_falkordb_password:
    file: ${ACR_FALKORDB_PASSWORD_FILE:-/var/lib/oci-cache/mcp-venue/secrets/falkordb_password}
x-acr-build:
  context: ./acr
  dockerfile: Dockerfile
  target: acr-api
