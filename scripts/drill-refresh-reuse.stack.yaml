# The datastores of scripts/drill-refresh-reuse.sh (CHAOS-11230): one PostgreSQL and one Valkey, no volume outside
# the pod (emptyDir). Images are the chart's own pins (postgres = the auth staging image, valkey = valkey.image).
apiVersion: apps/v1
kind: Deployment
metadata: {name: drill-postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: drill-postgres}}
  template:
    metadata: {labels: {app: drill-postgres}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70}
      volumes: [{name: data, emptyDir: {}}]
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: drill-pg, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/pgdata}
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, postgres]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: drill-postgres}
spec:
  selector: {app: drill-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: drill-valkey}
spec:
  replicas: 1
  selector: {matchLabels: {app: drill-valkey}}
  template:
    metadata: {labels: {app: drill-valkey}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999}
      containers:
        - name: valkey
          image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
          imagePullPolicy: IfNotPresent
          args: [--save, "", --appendonly, "no"]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          readinessProbe:
            exec: {command: [valkey-cli, ping]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: drill-valkey}
spec:
  selector: {app: drill-valkey}
  ports: [{port: 6379, targetPort: 6379}]
