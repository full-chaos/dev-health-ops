}

type ThroughputForecast {
  forecastId: String!
  computedAt: String!
  teamId: String
  workScopeId: String
  backlogSize: Int!
  historyWeeks: Int!
  p50Weeks: Int
  p75Weeks: Int
  p90Weeks: Int
