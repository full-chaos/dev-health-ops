{{- /* Additive Go/River topology. `goWorkers.enabled` is false by default. */ -}}
{{- if .Values.goWorkers.enabled }}
{{- range $group := .Values.goWorkers.groups }}
{{- $coordinator := has $group.name (list "reconciler" "scheduler") }}
{{- /*
CHAOS-4428: fail the render when a `metrics` group's grace period is too
short to finish a job it has already claimed.

terminationGracePeriodSeconds becomes --shutdown-timeout below (line ~72), and
a metrics job's own registry timeout is 7200s. Anything under 7200+60 means the
kubelet SIGKILLs the pod while a claimed job is still running: River sees the
row still leased, the work is neither done nor released, and the worker's own
diagnosis is the opaque
`dependency_configuration_failed reason=queue_coverage_validation_failed` --
which names the queue coverage check, not the grace period that actually caused
it. That error is what makes this worth failing at render time instead of
letting the operator find it in a crash-looping pod.

Only groups that actually carry `metrics` are constrained; `has` needs a real
list because reconciler/scheduler declare no `queues` key at all.
*/}}
{{- if has "metrics" ($group.queues | default (list)) }}
{{- if lt (int $group.terminationGracePeriodSeconds) 7260 }}
{{- fail (printf "goWorkers.groups[%s]: terminationGracePeriodSeconds=%v is below the 7260s floor required for the `metrics` queue (7200s job registry timeout + 60s finalization). It is passed straight to --shutdown-timeout, so a shorter value SIGKILLs a claimed metrics job mid-flight and surfaces as `dependency_configuration_failed reason=queue_coverage_validation_failed`." $group.name $group.terminationGracePeriodSeconds) }}
{{- end }}
{{- end }}
{{- /*
A stream group (one with a runtimeProfile) is `dho stream-runner`: the dho
image runs whatever verb is first, and without `subcommand: stream-runner`
the first argument would be --profile=..., which dho refuses as an unknown
command, so the pod could never start. Refuse the render instead.
*/}}
{{- if and $group.runtimeProfile (ne ($group.subcommand | default "") "stream-runner") }}
{{- fail (printf "goWorkers.groups[%s]: a stream group (runtimeProfile=%q) runs `dho stream-runner` and needs subcommand: stream-runner (got %q); without it dho gets --profile as its command and exits 2." $group.name $group.runtimeProfile ($group.subcommand | default "")) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-health.fullname" $ }}-go-{{ $group.name }}
  namespace: {{ include "dev-health.namespace" $ }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "go-worker" "context" $) | nindent 4 }}
    dev-health.io/worker-group: {{ $group.name }}
    {{- with $group.queues }}
    {{- /*
    CHAOS-4428: joined with "_" and NOT "," -- a comma is not a legal
    character in a Kubernetes label VALUE (regex
    (([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?), so every group with more
    than one queue was rejected outright by the API server with
    `metadata.labels: Invalid value: "investment,metrics,reports,workgraph"`.
    That is the chart's OWN default `heavy` and `ops` groups, i.e. this
    chart could not install its own defaults. Reproduced on a k3s 1.36
    cluster via `helm upgrade --install` at ops 7ea3cad23.
    */}}
    dev-health.io/queue-set: {{ join "_" . | quote }}
    {{- end }}
spec:
  replicas: {{ $group.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "go-worker" "context" $) | nindent 6 }}
      dev-health.io/worker-group: {{ $group.name }}
  template:
    metadata:
      annotations:
        {{- /*
        Every group here envFrom's the shared ConfigMap and Secret (below),
        same as api-deployment.yaml/billing-edge-deployment.yaml -- without
        this, a config-only revision (a ConfigMap/Secret key edit, no image
        or arg change) never rolls these pods, since envFrom doesn't trigger
        a rollout on its own. Same include/sha256sum pattern as those two
        templates, so a config or secret change gives all nine groups a new
        pod-template hash and a rollout, and an unrelated change leaves them
        untouched.
        */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "go-worker" "context" $) | nindent 8 }}
        dev-health.io/worker-group: {{ $group.name }}
        {{- with $group.queues }}
        dev-health.io/queue-set: {{ join "_" . | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $group.terminationGracePeriodSeconds }}
      {{- include "dev-health.imagePullSecrets" $ | nindent 6 }}
      serviceAccountName: {{ include "dev-health.serviceAccountName" $ }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $group.name }}
          image: {{ $group.image }}
          # CHAOS-4984: goWorkers.imagePullPolicy, NEVER image.pullPolicy --
          # see values.yaml's goWorkers.imagePullPolicy comment for why.
          imagePullPolicy: {{ $.Values.goWorkers.imagePullPolicy }}
          # CHAOS-4020: worker configuration is flags. Every setting a Go
          # binary reads that is not a credential is rendered here, so
          # `helm template` and `kubectl describe` show the deployed
          # configuration in one place instead of spreading it across a
          # ConfigMap, a Secret, and per-group env. Credentials stay in env:
          # an argument is visible to anyone who can read the pod spec.
          args:
            {{- /*
            A group run by the dho binary names its service verb first
            (`dho stream-runner ...`); the flags below belong to that verb.
            */}}
            {{- with $group.subcommand }}
            - {{ . | quote }}
            {{- end }}
            {{- if $group.queues }}
            {{- $parts := list }}
            {{- range $queue := $group.queues }}
            {{- $parts = append $parts (printf "%s=%v" $queue (index $group.queueConcurrency $queue)) }}
            {{- end }}
            - {{ printf "--queues=%s" (join "," $group.queues) | quote }}
            - {{ printf "--queue-concurrency=%s" (join "," $parts) | quote }}
            - {{ printf "--worker-group=%s" $group.name | quote }}
            {{- end }}
            {{- with $group.runtimeProfile }}
            - {{ printf "--profile=%s" . | quote }}
            {{- end }}
            - {{ printf "--shutdown-timeout=%ds" (int $group.terminationGracePeriodSeconds) | quote }}
            - "--http-addr=:8080"
            {{- /*
            preclaim-readiness-timeout is a dev-health-worker-only flag
            (config.Options's Services restriction), so it is gated on
            $group.queues the same way --queues/--worker-group above are --
            never rendered for a reconciler/scheduler/stream-runner group,
            which would reject it as an unrecognized flag. It is appended
            here, after the fixed queue-topology/shutdown-timeout prefix
            test_helm_river_workers_select_manifest_queues_and_queue_metrics
            pins, as "the rest of the worker's configuration" that prefix
            check deliberately leaves unconstrained. $group.
            preclaimReadinessTimeout overrides goWorkers.
            defaultPreclaimReadinessTimeout per group, same fallback
            pattern as livenessProbe/readinessProbe below.
            */}}
            {{- if $group.queues }}
            - {{ printf "--preclaim-readiness-timeout=%s" ($group.preclaimReadinessTimeout | default $.Values.goWorkers.defaultPreclaimReadinessTimeout) | quote }}
            {{- end }}
            {{- /*
              CHAOS-6279: the --operational-bridge-url flag this block used
              to emit (CHAOS-4351/CHAOS-4984 history), and the
              $group.bridgeUrl override that fed it, are deleted --
              CHAOS-5320 already deleted the Python HTTP bridge it pointed
              at (the HTTPDispatcher/NewHTTPBridge call chains the
              CHAOS-4984 trace cited), and nothing constructs a bridge
              client from cfg.OperationalBridgeURL any more (confirmed by
              grep across internal/ and cmd/). With this block gone, no
              worker group's command line points at metricsApi any more
              either -- see metrics-api-deployment.yaml's own comment for
              the resulting open question (retire that Deployment or not).
            */}}
            {{- if $.Values.goWorkers.pgbouncer.enabled }}
            - "--domain-transaction-pooler=true"
            - "--queue-database-mode=session"
            {{- if $coordinator }}
            - "--coordinator-database-mode=session"
            {{- end }}
            {{- end }}
            {{- /*
              Per-group only, deliberately. A chart-wide extraArgs would append
              every flag to every group, and options are scoped per binary --
              --unreclaimable-sweep is reconciler-only, so a global entry would
              make the worker, scheduler, and stream-runner pods exit 2 on an
              unknown flag. Scope the flag to the group that accepts it.
            */}}
            {{- with $group.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # CHAOS-4587: every group here reads a canonical operational table
            # through the ordering-contract guard and refuses to start
            # against a contract-2 (post-067) table without this set. Kept
            # off the shared api/worker ConfigMap (envFrom below) on
            # purpose -- the Python api's own ordering-contract awareness is
            # a separate, out-of-scope concern. Omitted defaults to contract
            # 1 (rollout-safe); see deploy/go-workers/README.md.
            - name: OPERATIONAL_ORDERING_CONTRACT
              value: {{ $.Values.goWorkers.operationalOrderingContract | default "1" | quote }}
            {{- if (include "dev-health.goWorkerClickhouseURI" $) }}
            # Explicit env beats the shared Secret mounted via envFrom below,
            # so Go pods get the native port while Python keeps HTTP. The
            # source decides how the value travels: an operator-supplied
            # goWorkers.clickhouseURI is inline config the chart did not mint
            # (same posture as goWorkers.pgbouncer.postgres.host), while the
            # DERIVED bundled URI carries clickhouse.credentials.password and
            # therefore goes through the shared Secret -- an inline `value:`
            # here would put that password in the Pod spec, which every holder
            # of `get` on the workload can read.
            {{- if $.Values.goWorkers.clickhouseURI }}
            - {name: CLICKHOUSE_URI, value: {{ $.Values.goWorkers.clickhouseURI | quote }}}
            {{- else }}
            - name: CLICKHOUSE_URI
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.secretName" $ }}, key: CLICKHOUSE_NATIVE_URI}}
            {{- end }}
            {{- end }}
            {{- if $.Values.goWorkers.pgbouncer.enabled }}
            # Every Go worker group uses the bounded domain transaction pool plus
            # the River queue session pool. Only coordinator binaries receive
            # the separate coordinator lock session endpoint.
            - name: POSTGRES_URI
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.goPgbouncerSecretName" $ }}, key: POSTGRES_URI}}
            - name: WORKER_DATABASE_URI
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.goPgbouncerSecretName" $ }}, key: WORKER_DATABASE_URI}}
            {{- if $coordinator }}
            - name: COORDINATOR_DATABASE_URI
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.goPgbouncerSecretName" $ }}, key: COORDINATOR_DATABASE_URI}}
            {{- end }}
            {{- end }}
          {{- /*
          CHAOS-4984: same extraEnvFrom-first, chart-config/secret-last
          ordering as api-deployment.yaml, and for the same reason --
          Kubernetes resolves a duplicate envFrom key in favour of the LAST
          source, so an operator-supplied source (e.g. a local dotenv
          Secret) belongs before these two chart-owned sources, not after.
          Shared across every group in this range; there is no per-group
          extraEnvFrom.
          */}}
          {{- $groupEnvFrom := $.Values.goWorkers.extraEnvFrom | default (list) }}
          {{- $groupEnvFrom = append $groupEnvFrom (dict "configMapRef" (dict "name" (include "dev-health.configMapName" $))) }}
          {{- $groupEnvFrom = append $groupEnvFrom (dict "secretRef" (dict "name" (include "dev-health.secretName" $))) }}
          envFrom:
            {{- toYaml $groupEnvFrom | nindent 12 }}
          ports: [{name: metrics, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            {{- toYaml $group.resources | nindent 12 }}
          {{- /*
          A 1s timeoutSeconds (the prior hardcoded default,
          unset) combined with the reconciler's maxUnavailable: 0 on a
          singleton deadlocks a rolling update -- both old and new pods can
          fail a 1s /readyz under load while the process is healthy, so the
          new pod never becomes Ready and the old one can never terminate.
          goWorkers.defaultProbes carries the safe shape; a group may still
          set its own livenessProbe/readinessProbe to override it entirely.
          */}}
          {{- with ($group.livenessProbe | default $.Values.goWorkers.defaultProbes.livenessProbe) }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with ($group.readinessProbe | default $.Values.goWorkers.defaultProbes.readinessProbe) }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- /*
CHAOS-5594: autoscaling for this group (if enabled) renders as a KEDA
ScaledObject in go-worker-keda.yaml, not here -- the previous inline
autoscaling/v2 HorizontalPodAutoscaler on External `worker_jobs_available`
/ `worker_job_oldest_age_seconds` / `worker_execution_saturation_ratio`
metrics required a Prometheus Adapter that was never built (deploy/
go-workers/README.md said as much), so it never actually scaled anything.
KEDA's postgresql scaler reads river_job backlog directly and needs no
adapter. See go-worker-keda.yaml for the render guards (minReplicas >= 1,
reconciler/scheduler never autoscaled).
*/}}
{{- end }}
{{- end }}
