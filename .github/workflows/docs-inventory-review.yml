name: Documentation inventory archive review

on:
  push:
    branches:
      - main
    paths:
      - 'docs-data/inventory/**'
      - 'docs-data/ia/**'
      - 'scripts/validate_docs_inventory_review.py'
      - '.github/workflows/docs-inventory-review.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs-data/inventory/**'
      - 'docs-data/ia/**'
      - 'scripts/validate_docs_inventory_review.py'
      - '.github/workflows/docs-inventory-review.yml'
  workflow_dispatch:

concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed): this
  # workflow had no concurrency block at all, letting a re-push or
  # re-push-of-PR pile up queued/running duplicates for a superseded commit
  # indefinitely. Canonical fleet-wide shape -- group by PR number on
  # pull_request, by ref on a push to a non-main branch, by commit sha on a
  # push to main or on merge_group (never cancelled -- see go.yml/
  # typecheck.yml/docker-images.yml/arc-runner-image.yml for the specific
  # incidents this protects).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  inventory-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install inventory dependency
        # CHAOS-3948: pinned to the uv.lock version, same shape/fix as
        # lint.yml's ruff pin (CHAOS-3946) -- a bare floor specifier resolves
        # to whatever is newest on PyPI at CI run time, not the version
        # contributors actually run locally via `uv sync`.
        run: python -m pip install 'PyYAML==6.0.3'

      - name: Validate the frozen Phase 1 inventory and dispositions
        run: |
          mkdir -p .build
          cp docs-data/inventory/documentation-inventory.json \
            .build/documentation-inventory.json
          python scripts/validate_docs_inventory_review.py \
            --generated-json .build/documentation-inventory.json \
            --inventory-dir docs-data/inventory \
            --ia-dir docs-data/ia
