# Source: dev-health/charts/ops/templates/clickhouse.yaml
# CHAOS-6181: extra ClickHouse users.d files (e.g. a read-only user). Content
# is supplied by the operator; do not put plaintext passwords here -- use
# <password_sha256_hex>.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-health-ops-clickhouse-usersd
  namespace: dev-health
  labels:
    helm.sh/chart: ops-0.1.0
    app.kubernetes.io/name: ops
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: dev-health
    app.kubernetes.io/component: clickhouse
data:
  acr_ro.xml: |
    <clickhouse>
      <users>
        <acr_ro>
          <password_sha256_hex>fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffaaa</password_sha256_hex>
          <networks><ip>::/0</ip></networks>
          <profile>acr_ro_profile</profile>
          <quota>default</quota>
          <access_management>0</access_management>
          <grants>
            <query>GRANT SELECT ON default.*</query>
            <query>GRANT SELECT ON system.tables</query>
            <query>GRANT SELECT ON system.columns</query>
          </grants>
        </acr_ro>
        <!-- CHAOS-9024: the collector's query_log login (otelCollector.clickhouseQueryLog). It lives in THIS existing key
             on purpose: a NEW usersd key is a new users.d symlink, which only the initContainer makes, so it would restart
             the ClickHouse pod (the checksum covers the key set); a content change reloads live. readonly=1 (no SETTINGS);
             SELECT on the listed query_log columns only: never the query text, the exception text, the client-set query_id or any other table.
             Hash from scripts/create-otel-querylog-secret.sh (CHAOS-6310 recipe; plaintext only in the Secret otelCollector.clickhouseQueryLog.secretName names). -->
        <otel_querylog>
          <password_sha256_hex>fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffaab</password_sha256_hex>
          <networks><ip>::/0</ip></networks>
          <profile>otel_querylog_profile</profile>
          <quota>default</quota>
          <access_management>0</access_management>
          <grants>
            <query>GRANT SELECT(event_date, event_time, event_time_microseconds, type, user, query_kind, tables, read_rows, read_bytes, memory_usage, query_duration_ms, exception_code, normalized_query_hash, Settings) ON system.query_log</query>
            <!-- CHAOS-9362: server metrics (otelCollector.clickhouseServerMetrics). Name/value columns of the three counter tables and the
                 size columns of system.parts only: no query text, no table data. A content change of this key: live reload, no restart. -->
            <query>GRANT SELECT(metric, value) ON system.metrics</query>
            <query>GRANT SELECT(event, value) ON system.events</query>
            <query>GRANT SELECT(metric, value) ON system.asynchronous_metrics</query>
            <query>GRANT SELECT(database, table, active, rows, bytes_on_disk) ON system.parts</query>
            <!-- system.parts lists only tables this login may SEE: without SHOW TABLES the app tables are filtered out of it.
                 SHOW TABLES reveals table names only (rehearsed: SELECT data, SHOW CREATE and system.columns stay denied). -->
            <query>GRANT SHOW TABLES ON default.*</query>
          </grants>
        </otel_querylog>
        <!-- The operator readback login for statement peaks (memory_usage, read_bytes) in system.query_log. It is NOT acr_ro:
             acr_ro is the acr-api runtime login, and query_log holds the query text of every tenant. Same key as above, so no
             ClickHouse restart. Loopback only: the readback runs clickhouse-client inside the ClickHouse pod. readonly=1.
             Hash from CH_USER=ops_qlog_ro SECRET=ops-qlog-ro KEY=CLICKHOUSE_QLOG_DSN CH_SVC=127.0.0.1 scripts/create-otel-querylog-secret.sh. -->
        <ops_qlog_ro>
          <password_sha256_hex>fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffaac</password_sha256_hex>
          <networks><ip>::1</ip><ip>127.0.0.1</ip></networks>
          <profile>ops_qlog_ro_profile</profile>
          <quota>default</quota>
          <access_management>0</access_management>
          <grants>
            <query>GRANT SELECT ON system.query_log</query>
          </grants>
        </ops_qlog_ro>
      </users>
      <profiles>
        <acr_ro_profile>
          <readonly>2</readonly>
        </acr_ro_profile>
        <!-- CHAOS-9429: lives in this existing file so no new usersd key (a new key bumps the
             pod checksum and restarts ClickHouse). Nothing reads system.processors_profile_log
             (~4.5 GiB/day); 0 stops the writes for the default profile. -->
        <default>
          <log_processors_profiles>0</log_processors_profiles>
        </default>
        <otel_querylog_profile>
          <readonly>1</readonly>
          <max_execution_time>10</max_execution_time>
          <max_result_rows>5000</max_result_rows>
          <max_bytes_to_read>268435456</max_bytes_to_read>
          <!-- CHAOS-9362: zero-valued events are listed too, so a failure counter is a 0 series from the start (not absent until it fires). -->
          <system_events_show_zero_values>1</system_events_show_zero_values>
        </otel_querylog_profile>
        <ops_qlog_ro_profile>
          <readonly>1</readonly>
          <max_execution_time>30</max_execution_time>
          <max_result_rows>5000</max_result_rows>
        </ops_qlog_ro_profile>
      </profiles>
    </clickhouse>
  dho_api_ch.xml: |
    <clickhouse>
      <users>
        <dho_api_ch>
          <password_sha256_hex>fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffaad</password_sha256_hex>
          <networks><ip>::/0</ip></networks>
          <profile>dho_api_ch_profile</profile>
          <quota>default</quota>
          <access_management>0</access_management>
          <grants>
            <query>GRANT SELECT, INSERT, ALTER DELETE ON default.teams</query>
            <query>GRANT SELECT, INSERT, ALTER DELETE ON default.identities</query>
            <query>GRANT SELECT, INSERT ON default.team_sync_policies</query>
            <query>GRANT SELECT, INSERT ON default.team_provider_observations</query>
            <query>GRANT SELECT, INSERT ON default.team_drift_changes</query>
            <query>GRANT SELECT, INSERT ON default.team_memberships</query>
            <query>GRANT SELECT, INSERT ON default.team_project_ownership</query>
            <query>GRANT SELECT, INSERT ON default.team_repo_ownership</query>
            <query>GRANT SELECT, INSERT ON default.manual_attribution_fallbacks</query>
            <!-- CHAOS-6259 (session routes: the login route's active-org
                 choice, GET /api/v1/auth/me/organizations); read only. -->
            <query>GRANT SELECT ON default.repo_metrics_daily</query>
            <query>GRANT SELECT ON default.user_metrics_daily</query>
            <query>GRANT SELECT ON default.team_metrics_daily</query>
            <query>GRANT SELECT ON default.work_item_metrics_daily</query>
            <!-- CHAOS-6512/CHAOS-6439 (GET /backfill-jobs/{job_id} metrics
