# Executed Kubernetes proof for the dormant Auth Control Plane (CHAOS-10079): a real
# `helm upgrade --install` of the chart's authService section into a kind cluster, from
# images built from this tree, with the checks the render tests can only reason about (the
# pre-install and pre-upgrade hooks run, the Deployment is Ready, the Service routes, the
# staged signing key is 0400/65532, the directly mounted Secret cannot work, the
# NetworkPolicy bounds ingress and egress, `helm uninstall` is clean). The logic is
# ci/check_auth_k8s.sh.
#
# A PROOF, deliberately NOT a required check: it takes minutes and needs docker. It runs on
# every pull request and decides RELEVANCE INSIDE (like go-auth-service.yml): the auth
# packages' import closure (`check_go.sh auth relevant`), the chart, the Dockerfile, and
# this proof's own files. An irrelevant change reports a green job that says so. Its name is
# distinct from every required context.
name: Auth Kubernetes proof

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auth-k8s-proof:
    name: auth-k8s-proof
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
          # CHAOS-10486: no setup-go cache here. Its key is shared by every workflow, and a job that compiles little or
          # nothing saved it first and left the heavy jobs an empty entry.
          cache: false

      - name: Does the change touch what this proof proves?
        id: relevance
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" != "pull_request" ]; then
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
            echo "proof runs: ${EVENT} is not a pull request"
            exit 0
          fi
          mb="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          relevant=false
          if git diff --name-only --no-renames "${mb}" "${HEAD_SHA}" \
            | grep -E '^(deploy/helm/dev-health/|docker/go-worker\.Dockerfile$|ci/check_auth_k8s\.sh$|ci/auth_k8s/|\.github/workflows/auth-k8s-proof\.yml$)'; then
            relevant=true
          elif bash ci/check_go.sh auth relevant "${mb}" "${HEAD_SHA}" | tee relevance.txt | grep -qx 'relevant=true'; then
            relevant=true
          fi
          echo "relevant=${relevant}" >> "${GITHUB_OUTPUT}"
          echo "relevant=${relevant}"

      - name: Install the chart into a kind cluster and prove it
        if: steps.relevance.outputs.relevant == 'true'
        run: bash ci/check_auth_k8s.sh

      - name: Not relevant
        if: steps.relevance.outputs.relevant != 'true'
        run: echo "the change touches nothing this proof proves; it did not run"
