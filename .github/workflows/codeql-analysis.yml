name: "CodeQL"

on:
  push:
    branches: ["main", "!dependabot/**"]
  pull_request:
    branches: ["**"]
  merge_group:
  schedule:
    - cron: "30 1 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # CHAOS-4906 fleet audit (09-03): `cancel-in-progress: false` meant a PR
  # re-push never cancelled its own prior run -- the two share this same
  # PR-numbered group, so the OLD run just sat queued/running behind the
  # new one instead of being replaced, piling up stale CodeQL runs for
  # commits nobody cares about anymore and consuming hosted concurrency
  # for work whose result is already moot. Scoped to `pull_request` only
  # (never `push`/`merge_group`/`schedule`/`workflow_dispatch`), matching
  # the pattern already used by typecheck.yml/docker-images.yml/
  # arc-runner-image.yml -- a push to main must never cancel another.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # CodeQL needs SARIF upload and audit access for security results.
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{matrix.language}}"
