# Disaster-recovery pipeline. It mirrors the CI that .github/workflows/ runs
# (CHAOS-3426). Rule: call the SAME repo scripts as the workflows (ci/*.sh,
# ci/check_go.sh verbs, ci/run_*.sh); do not copy their logic here. The only
# logic kept inline is logic that the workflows themselves keep inline.
#
# GAPS (what this file does NOT mirror; named, not faked):
#   - Required-check rules, rulesets and merge queue: GitLab has no `test`,
#     `go-quality` or `metrics-executed-proof` required-check names. The
#     pipeline status of the jobs above is the verdict; they are not wired to
#     branch protection here.
#   - CodeQL (codeql-analysis.yml) and the SARIF upload to GitHub code scanning.
#   - Self-hosted runner labels, the ARC pool and its dind-smoke-test jobs, the
#     SELF_HOSTED_RUNNERS switch, arc-runner-image.yml, mirror-test-images.yml.
#   - OIDC, GitHub Releases and tagging: auto-release.yml, the PyPI upload of
#     publish-pypi.yml (only its build step is mirrored), cloud-deploy.yml and
#     the Cloudflare publish of docs-cloudflare.yml (docs:guards runs the same
#     strict build, link and accessibility checks).
#   - mutation-battery.yml (a manual, secret-backed matrix).
#   - Go storage integration is NOT sharded (a static file cannot take the
#     dynamic plan matrix); the whole suite runs in one job.
#   - Go images: no GHA layer cache, no push-by-digest, no `latest` or branch
#     tags (docker-images.yml's fan-in-latest); the registry is the GitLab one.
#   - Image archives for the scan stage are amd64 only (as go-container-security).
#   - go:arm64-numeric-parity needs an arm64 runner: set GITLAB_ARM64_RUNNER_TAG.
#   - Go-relevance skip (ci/go_relevance.sh) is not used: go:quality always runs.
#   - Python lint (ruff) and typecheck (mypy), the Python unit matrix, the
#     coverage gate and the Python integration tier are gone from GitHub
#     (#3748, #3761); they are gone here too.
#   - Needs a runner that allows privileged dind (docker:27-dind services).
#
# Job map (GitHub workflow : job -> GitLab job):
#   test.yml : docs-tests, tooling-tests      -> tests:docs, tests:tooling
#   go-quality.yml : go-quality-leg           -> go:quality (matrix)
#   go.yml : go-storage-integration           -> go:storage-integration (unsharded)
#   go.yml : go-container-smoke               -> go:container-smoke (matrix)
#   go.yml : go-container-reproducibility     -> go:container-reproducibility
#   go.yml : go-container-security            -> security:go-image-build, scan:trivy, scan:sbom
#   go.yml : go-arm64-numeric-parity          -> go:arm64-numeric-parity (opt-in runner tag)
#   go.yml : graphql-wire-parity              -> go:graphql-wire-parity
#   live-e2e.yml : live-e2e, metrics-executed-proof -> e2e:live, e2e:metrics-executed-proof
#   security-scan.yml / scheduled-scan.yml    -> security:pip-audit, security:semgrep, security:gitleaks
#   governance.yml : governance               -> governance
#   docs-guards.yml / docs-inventory-review.yml / docs-health-report.yml -> docs:*
#   docker-images.yml : go-build, go-api-tools-build + merge -> build:go-images, build:go-images-manifest
#   venue-oracles*.yml                        -> go:venue-oracles, go:venue-oracles-changed
#   publish-pypi.yml : build step             -> build:pypi-package

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_train"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - validate
  - test
  - go
  - e2e
  - security
  - scan
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: "ignore"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  GIT_DEPTH: "0"
  GO_IMAGE: "golang:1.27.0-bookworm"
  DOCKER_CLI_VERSION: "27.5.1"
  DOCKER_IMAGE: "docker:27"
  DIND_IMAGE: "docker:27-dind"
  # The test dependency images come from the ghcr mirror (same digests as the
  # Docker Hub originals), as in go-quality.yml, so no job hits the Hub rate limit.
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: "ghcr.io/full-chaos"

# Run when Go, container, CI or Python-test inputs change. A superset of
# go.yml's `paths` list (the workflow's list stays the source of truth; a
# superset only runs more).
.code_changes: &code_changes
  - "**/*.go"
  - go.mod
  - go.sum
  - go.work
  - go.work.sum
  - contracts/**/*
  - deploy/**/*
  - docker/**/*
  - cmd/**/*
  - internal/**/*
  - third_party/**/*
  - tools/**/*
  - src/**/*
  - tests/**/*
  - ci/**/*
  - scripts/**/*
  - migrations/**/*
  - alerts/**/*
  - requirements.txt
  - requirements-docs.txt
  - pyproject.toml
  - uv.lock
  - pytest.ini
  - alembic.ini
  - lefthook.yml
  - compose.yml
  - Makefile
  - .dockerignore
  - .gitlab-ci.yml

.code_rules: &code_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "merge_train"
    changes: *code_changes
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    changes: *code_changes
  - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_TAG

.mr_rules: &mr_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "merge_train"

.main_rules: &main_rules
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_PIPELINE_SOURCE == "web"

# ---------------------------------------------------------------------------
# Shared building blocks
# ---------------------------------------------------------------------------

.python_job:
  image: python:3.14
  cache:
    key: "pip-$CI_JOB_IMAGE"
    paths:
      - .cache/pip

# Docker CLI (static, sha256-pinned) so a golang image can drive the dind daemon.
.docker_cli:
  script:
    - |
      set -eu
      case "$(uname -m)" in
        x86_64) arch=x86_64; sha=4f798b3ee1e0140eab5bf30b0edc4e84f4cdb53255a429dc3bbae9524845d640 ;;
        aarch64|arm64) arch=aarch64; sha=e6b53725a73763ab3f988c73f8772eaed429754c1a579db5ff11f21990fd1817 ;;
        *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL -o /tmp/docker.tgz "https://download.docker.com/linux/static/stable/${arch}/docker-${DOCKER_CLI_VERSION}.tgz"
      echo "${sha}  /tmp/docker.tgz" | sha256sum -c -
      tar -xzf /tmp/docker.tgz -C /usr/local/bin --strip-components=1 docker/docker
      for _ in $(seq 1 60); do
        docker info >/dev/null 2>&1 && break
        sleep 1
      done
      docker info >/dev/null

# Go + Docker (dind) + Python (uv, locked env) toolbox, as the GitHub jobs
# get from setup-go + setup-uv on a runner that has Docker.
.go_job:
  image: $GO_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends jq postgresql-client python3 python3-pip
    - !reference [.docker_cli, script]
    - go version

# uv + the locked Python env (kept Python tests, live-e2e, metrics proof).
.uv_env:
  script:
    - pip install --break-system-packages uv
    - uv sync --frozen --all-extras --dev --python 3.14
    - export PATH="$PWD/.venv/bin:$PATH"
    - uv pip install --python .venv/bin/python -r requirements-docs.txt

# Service containers of live-e2e.yml / metrics-executed-proof (same images,
# anonymous pull from the ghcr mirror).
.live_services:
  services:
    - name: $DIND_IMAGE
      alias: docker
    - name: ghcr.io/full-chaos/postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
      alias: postgres
    - name: ghcr.io/full-chaos/clickhouse/clickhouse-server:26.7
      alias: clickhouse
    - name: ghcr.io/full-chaos/valkey/valkey:8-alpine
      alias: valkey
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: test_db
    CLICKHOUSE_DB: default
    CLICKHOUSE_USER: ch
    CLICKHOUSE_PASSWORD: ch
    # The scripts default to localhost; GitLab services answer on their alias.
    POSTGRES_HOST: postgres
    CLICKHOUSE_HOST: clickhouse
    VALKEY_HOST: valkey
    LIVE_E2E_VALKEY_HOST: valkey
    POSTGRES_URI: postgresql+asyncpg://postgres:postgres@postgres:5432/test_db
    DATABASE_URI: postgresql+asyncpg://postgres:postgres@postgres:5432/test_db
    CLICKHOUSE_URI: clickhouse://ch:ch@clickhouse:8123/default
    REDIS_URL: redis://valkey:6379/1

.wait_live_services:
  script:
    - |
      for target in postgres:5432 clickhouse:8123 clickhouse:9000 valkey:6379; do
        host="${target%%:*}"; port="${target##*:}"
        ok=0
        for _ in $(seq 1 60); do
          if (exec 3<>"/dev/tcp/${host}/${port}") 2>/dev/null; then ok=1; break; fi
          sleep 1
        done
        [ "${ok}" = 1 ] || { echo "service ${host}:${port} did not become reachable" >&2; exit 1; }
      done

# Docker-only jobs (image builds) run in the official docker image (it ships buildx).
.docker_job:
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash git coreutils gawk grep jq curl
    - |
      for _ in $(seq 1 60); do
        docker info >/dev/null 2>&1 && break
        sleep 1
      done
    - docker version
    - docker buildx version

# Build metadata, as the "Determine build metadata" step of docker-images.yml.
.build_metadata:
  script:
    - |
      SHA="$(git rev-parse HEAD)"
      VERSION="$(printf '%s' "${SHA}" | cut -c1-7)"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then VERSION="${CI_COMMIT_TAG}"; fi
      EPOCH="$(git log -1 --pretty=%ct)"
      export VERSION COMMIT="${SHA}" SOURCE_DATE_EPOCH="${EPOCH}"
      export BUILD_TIME="$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"

# ---------------------------------------------------------------------------
# validate
# ---------------------------------------------------------------------------

pipeline:validate:
  stage: validate
  image: python:3.14
  script:
    - pip install pyyaml
    - |
      python - <<'PY'
      import sys
      from pathlib import Path

      import yaml


      class Loader(yaml.SafeLoader):
          pass


      Loader.add_constructor("!reference", lambda loader, node: loader.construct_sequence(node))
      doc = yaml.load(Path(".gitlab-ci.yml").read_text(), Loader=Loader)
      required_jobs = {
          "governance",
          "tests:docs",
          "tests:tooling",
          "docs:guards",
          "docs:inventory-review",
          "go:quality",
          "go:storage-integration",
          "go:container-smoke",
          "go:container-reproducibility",
          "go:graphql-wire-parity",
          "e2e:live",
          "e2e:metrics-executed-proof",
          "security:pip-audit",
          "security:semgrep",
          "security:gitleaks",
          "security:go-image-build",
          "scan:trivy",
          "scan:sbom",
          "build:go-images",
          "build:go-images-manifest",
      }
      jobs = {k: v for k, v in doc.items() if isinstance(v, dict) and not k.startswith(".") and "stage" in v}
      stages = set(doc["stages"])
      errors = [f"missing job: {j}" for j in sorted(required_jobs - set(jobs))]
      errors += [f"{k}: unknown stage {v['stage']}" for k, v in jobs.items() if v["stage"] not in stages]
      for k, v in jobs.items():
          for need in v.get("needs", []):
              name = need["job"] if isinstance(need, dict) else need
              if name not in jobs:
                  errors.append(f"{k}: needs unknown job {name}")
      removed = {"lint", "typecheck:mypy", "test", "coverage", "integration", "live-e2e", "docker:build"}
      errors += [f"retired job is back: {j}" for j in sorted(removed & set(jobs))]
      if errors:
          raise SystemExit("\n".join(errors))
      print("GitLab pipeline parity jobs are present.")
      PY

# governance.yml: the TEST-EVIDENCE / RISK-NOTES gate, on merge requests.
governance:
  stage: validate
  image: python:3.14
  rules: *mr_rules
  variables:
    PR_BODY: $CI_MERGE_REQUEST_DESCRIPTION
  script:
    - python3 ci/check_governance_gate.py --base-sha "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head-sha "$CI_COMMIT_SHA"

# ---------------------------------------------------------------------------
# test (test.yml: docs-tests, tooling-tests incl. the kept Python tests)
# ---------------------------------------------------------------------------

tests:docs:
  extends: .python_job
  stage: test
  before_script:
    - pip install uv
    - uv sync --frozen --all-extras --dev --python 3.14
    - uv pip install --python .venv/bin/python -r requirements-docs.txt
    - export PATH="$PWD/.venv/bin:$PATH"
  script:
    - pytest tests/docs -q

tests:tooling:
  extends: .go_job
  stage: test
  timeout: 1h
  variables:
    OTEL_ENABLED: "false"
    HELM_VERSION: "v3.21.4"
  before_script:
    - !reference [.go_job, before_script]
    - !reference [.uv_env, script]
    - |
      case "$(uname -m)" in
        x86_64) helm_arch=amd64 ;;
        aarch64|arm64) helm_arch=arm64 ;;
        *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      curl -fsSL -o /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-${helm_arch}.tar.gz"
      expected="$(curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${helm_arch}.tar.gz.sha256sum" | awk '{print $1}')"
      echo "${expected}  /tmp/helm.tgz" | sha256sum -c -
      tar -xzf /tmp/helm.tgz -C /tmp
      install -m 0755 "/tmp/linux-${helm_arch}/helm" /usr/local/bin/helm
  script:
    - pytest tests/tooling -q -n 4
    # The Python tests that pin things which stay after the Python source is
    # deleted: an explicit list, not a negative filter (same as test.yml).
    - |
      set -euo pipefail
      mapfile -t kept < <(grep -v '^[[:space:]]*#' ci/kept_python_tests.txt | grep -v '^[[:space:]]*$')
      if [ "${#kept[@]}" -lt 40 ]; then
        echo "ci/kept_python_tests.txt lists only ${#kept[@]} files: a short or empty list would run nothing (or everything)" >&2
        exit 1
      fi
      printf 'kept files: %s\n' "${#kept[@]}"
      pytest "${kept[@]}" -q -rs -n 4

# ---------------------------------------------------------------------------
# docs (docs-guards.yml, docs-inventory-review.yml, docs-health-report.yml)
# ---------------------------------------------------------------------------

docs:guards:
  extends: .python_job
  stage: test
  before_script:
    - pip install -r requirements-docs.txt
    - mkdir -p .build
  script:
    - |
      set -o pipefail
      python scripts/validate_docs_v2_publication.py 2>&1 | tee .build/docs-publication-validation.log
      python -m mkdocs build --strict --config-file mkdocs.yml 2>&1 | tee .build/docs-build.log
      python scripts/check_built_site_links.py --site-dir .build/docs 2>&1 | tee .build/docs-links.log
      python scripts/check_docs_candidate_search.py --site-dir .build/docs --queries docs-data/search-acceptance.json 2>&1 | tee .build/docs-search.log
      python scripts/check_docs_candidate_accessibility.py --site-dir .build/docs --css docs/stylesheets/extra.css 2>&1 | tee .build/docs-accessibility.log
      python scripts/check_docs_candidate_facts.py 2>&1 | tee .build/docs-facts.log
      python scripts/check_code_prerequisites.py 2>&1 | tee .build/docs-code-prerequisites.log
      python scripts/check_freshness_inventory.py 2>&1 | tee .build/docs-freshness-inventory.log
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .build/docs-*.log

docs:inventory-review:
  extends: .python_job
  stage: test
  before_script:
    - python -m pip install 'PyYAML==6.0.3'
  script:
    - mkdir -p .build
    - cp docs-data/inventory/documentation-inventory.json .build/documentation-inventory.json
    - |
      python scripts/validate_docs_inventory_review.py \
        --generated-json .build/documentation-inventory.json \
        --inventory-dir docs-data/inventory \
        --ia-dir docs-data/ia

# Scheduled and diagnostic: never blocks a merge request.
docs:health-report:
  extends: .python_job
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
  before_script:
    - pip install -r requirements-docs.txt
    - mkdir -p .build
  script:
    - python -m mkdocs build --strict --config-file mkdocs.yml
    - |
      set -o pipefail
      python scripts/check_external_links.py \
        --built-site .build/docs \
        --allowlist docs-data/external-link-allowlist.yml \
        --site-url https://docs.fullchaos.dev \
        2>&1 | tee .build/docs-external-links.log
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .build/docs-external-links.log

# ---------------------------------------------------------------------------
# go (go-quality.yml, go.yml, venue-oracles*.yml)
# ---------------------------------------------------------------------------

# The required `go-quality` check of GitHub: the five legs of go-quality.yml.
# GitLab has no fan-in job: the pipeline status of these legs is the verdict.
# The legs always run (no Go-relevance skip), a superset of the workflow.
go:quality:
  extends: .go_job
  stage: go
  timeout: 45m
  parallel:
    matrix:
      - LEG: ["static", "test", "race 1 3", "race 2 3", "race 3 3"]
  before_script:
    - !reference [.go_job, before_script]
    - |
      if [ "${LEG}" = "static" ]; then
        # shellcheck is installed pinned (version and sha256), as in go-quality.yml.
        version=0.11.0
        case "$(uname -m)" in
          x86_64) arch=x86_64; sha=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 ;;
          aarch64|arm64) arch=aarch64; sha=68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc ;;
          *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        tarball="shellcheck-v${version}.linux.${arch}.tar.gz"
        curl -fsSL -o "/tmp/${tarball}" "https://github.com/koalaman/shellcheck/releases/download/v${version}/${tarball}"
        echo "${sha}  /tmp/${tarball}" | sha256sum -c -
        tar -xzf "/tmp/${tarball}" -C /tmp
        install -m 0755 "/tmp/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
      fi
  script:
    - |
      set -euo pipefail
      if [ "${LEG}" = "static" ]; then
        bash ci/check_migration_matrix.sh freshness
        bash ci/check_migration_matrix.sh contract
        bash ci/check_migration_matrix_test.sh
        bash ci/go_worker_fixture_test.sh
        go run ./cmd/gqlgen-guard check-drift
        # The closed lists are held to their size on the merge base (merge requests only).
        if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
          export RATCHET_BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
          if git cat-file -e "${RATCHET_BASE_SHA}:contracts/jobs/v1" 2>/dev/null; then
            base_dir="$(mktemp -d)"
            git archive "${RATCHET_BASE_SHA}" contracts/jobs/v1 | tar -x -C "${base_dir}"
            export DEV_HEALTH_CONTRACT_BASE="${base_dir}/contracts/jobs/v1"
          fi
        fi
      fi
      bash ci/check_go.sh integration-prepull
      read -r -a leg_args <<< "${LEG}"
      bash ci/check_go.sh ci-leg "${leg_args[@]}"
      if [ "${LEG}" = "static" ]; then
        bash ci/check_shellcheck_pin.sh
        bash ci/check_river_compat_static.sh
      fi

# go.yml: go-storage-integration-plan + -shard + the fan-in. The plan emits a
# dynamic matrix that a static GitLab file cannot take, so this job validates
# the plan, then runs the full suite unsharded (the `integration` verb).
go:storage-integration:
  extends: .go_job
  stage: go
  timeout: 2h
  rules: *code_rules
  script:
    - bash ci/check_go.sh integration-shard-plan
    - bash ci/check_go.sh integration-prepull
    - bash ci/check_go.sh integration

go:container-smoke:
  extends: .docker_job
  stage: go
  timeout: 45m
  rules: *code_rules
  parallel:
    matrix:
      - PLATFORM: ["linux/amd64", "linux/arm64"]
  variables:
    DOCKER_DEFAULT_PLATFORM: $PLATFORM
  before_script:
    - !reference [.docker_job, before_script]
    - env -u DOCKER_DEFAULT_PLATFORM docker run --privileged --rm tonistiigi/binfmt --install all
  script:
    - bash ci/check_go_containers.sh smoke

go:container-reproducibility:
  extends: .docker_job
  stage: go
  timeout: 1h
  rules: *code_rules
  script:
    - bash ci/check_go_containers.sh reproducible

# go-arm64-numeric-parity: runs only on an arm64 runner. Set the CI/CD variable
# GITLAB_ARM64_RUNNER_TAG to the tag of such a runner to enable it.
go:arm64-numeric-parity:
  stage: go
  image: $GO_IMAGE
  timeout: 15m
  tags:
    - $GITLAB_ARM64_RUNNER_TAG
  rules:
    - if: $GITLAB_ARM64_RUNNER_TAG && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
    - if: $GITLAB_ARM64_RUNNER_TAG && ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "merge_train")
      changes: *code_changes
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends jq
  script:
    - |
      set -euo pipefail
      arch="$(go env GOARCH)"
      if [ "${arch}" != "arm64" ]; then
        echo "expected GOARCH=arm64 on the arm64 runner, got '${arch}'" >&2
        exit 1
      fi
      go test -mod=readonly -count=1 -timeout 8m -json ./internal/jobs/... ./internal/queryapi/... \
        -run '(MatchesLivePythonBitExact|IntegerPercentilesMatchesLivePython)$' \
        | tee go-test-output.json
      ran=$(jq -s '[.[] | select(.Action=="run" and (.Test // "") != "")] | length' go-test-output.json)
      echo "tests actually run: ${ran}"
      if [ "${ran}" -eq 0 ]; then
        echo "0 tests matched the -run pattern: this job would prove nothing. Failing loud." >&2
        exit 1
      fi

# go.yml: graphql-wire-parity (this repo's HEAD against dev-health-web).
go:graphql-wire-parity:
  stage: go
  image: $GO_IMAGE
  timeout: 20m
  rules: *code_rules
  variables:
    WEB_REPO: https://github.com/full-chaos/dev-health-web.git
    NODE_VERSION: "22"
  script:
    - |
      set -euo pipefail
      apt-get update -y
      apt-get install -y --no-install-recommends jq xz-utils
      branch="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-${CI_COMMIT_REF_NAME}}"
      ref=main
      set +e
      git ls-remote --exit-code --heads "${WEB_REPO}" "refs/heads/${branch}" >/dev/null 2>ls-remote.err
      rc=$?
      set -e
      if [ "${rc}" -eq 0 ]; then
        ref="${branch}"
        echo "graphql-wire-parity: paired branch '${branch}' found on dev-health-web; using it instead of main"
      elif [ "${rc}" -eq 2 ]; then
        echo "graphql-wire-parity: no branch named '${branch}' on dev-health-web (unpaired change); using main"
      else
        echo "graphql-wire-parity: could not determine whether '${branch}' exists on dev-health-web (see below)" >&2
        cat ls-remote.err >&2
        exit 1
      fi
      git clone --depth 1 --branch "${ref}" "${WEB_REPO}" dev-health-web-main
      case "$(uname -m)" in
        x86_64) node_arch=x64 ;;
        aarch64|arm64) node_arch=arm64 ;;
        *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      base="https://nodejs.org/dist/latest-v${NODE_VERSION}.x"
      tarball="$(curl -fsSL "${base}/SHASUMS256.txt" | awk -v a="linux-${node_arch}.tar.xz" '$2 ~ a {print $2; exit}')"
      curl -fsSL -o "/tmp/${tarball}" "${base}/${tarball}"
      (cd /tmp && curl -fsSL "${base}/SHASUMS256.txt" | grep " ${tarball}\$" | sha256sum -c -)
      tar -xJf "/tmp/${tarball}" -C /usr/local --strip-components=1
      corepack enable
      cd dev-health-web-main
      pnpm install --frozen-lockfile
      pnpm graphql:wire-parity:check --ops-root "${CI_PROJECT_DIR}"

# venue-oracles.yml: on the default branch (and by hand), 8 shards.
go:venue-oracles:
  extends: .go_job
  stage: go
  timeout: 1h
  rules: *main_rules
  parallel:
    matrix:
      - SHARD: ["1", "2", "3", "4", "5", "6", "7", "8"]
  script:
    - bash ci/check_go.sh integration-prepull
    - bash ci/check_go.sh venue-oracles "${SHARD}" 8

# venue-oracles-changed.yml: the oracles of the packages a merge request changes.
go:venue-oracles-changed:
  extends: .go_job
  stage: go
  timeout: 1h
  rules: *mr_rules
  script:
    - |
      set -euo pipefail
      git diff --name-only -z "${CI_MERGE_REQUEST_DIFF_BASE_SHA}...${CI_COMMIT_SHA}" > changed.txt
      bash ci/check_go.sh venue-oracles --changed changed.txt --list | grep '^SELECT' > selected.txt || true
      count="$(wc -l < selected.txt | tr -d ' ')"
      echo "selected ${count} venue oracle test(s):"
      cat selected.txt
      if [ "${count}" -eq 0 ]; then
        echo "VENUE ORACLES NOT RUN: no changed path lies in a package with a registered venue oracle. This green is NOT oracle evidence."
        exit 0
      fi
      bash ci/check_go.sh integration-prepull
      bash ci/check_go.sh venue-oracles --changed changed.txt

# ---------------------------------------------------------------------------
