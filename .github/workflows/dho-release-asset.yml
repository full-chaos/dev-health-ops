name: dho release asset

# The proof leg of the dho release asset: builds dho-linux-arm64 exactly as the release does (auto-release.yml,
# jobs dho-build and dho-publish carry the same build step text, pinned equal by internal/cigates/workflows
# dho_release_asset_test.go) and proves the stamp. It publishes nothing.
# - pull_request: build and prove the stamp for the PR head.
# - workflow_dispatch: the same build for an existing release tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and prove
        type: string
        required: true
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/dho-release-asset.yml
      - .github/workflows/auto-release.yml
      - cmd/dho/**
      - internal/platform/version/**
      - go.mod
      - go.sum

concurrency:
  # The fleet-wide shape (go.yml, go-workers-compose-proof.yml): a pull request by number, a push to main by commit sha
  # (never cancelled), any other ref by name. A ready_for_review run gets its own group keyed by the head sha and is
  # never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}${{ github.event.action == 'ready_for_review' && '-ready-' || '' }}${{ github.event.action == 'ready_for_review' && github.event.pull_request.head.sha || '' }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.event.action != 'ready_for_review') || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check the tag shape
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+\.[0-9]+)?$ ]] || { echo "::error::the tag is not vMAJOR.MINOR.PATCH[-suffix.N]"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the tree can build dho
        run: |
          set -euo pipefail
          for f in go.mod cmd/dho/main.go internal/platform/version/version.go; do
            [ -f "${f}" ] || { echo "::error::${f} is missing at this commit: it cannot build dho"; exit 1; }
          done
          grep -Eq '^[[:space:]]+Commit[[:space:]]+= ' internal/platform/version/version.go || { echo "::error::version.Commit is missing"; exit 1; }

      - name: Build dho linux arm64 and prove the stamp
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VP=github.com/full-chaos/dev-health-ops/internal/platform/version
          COMMIT="$(git rev-parse HEAD)"
          [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the commit is not 40 hex"; exit 1; }
          if [ -n "${TAG}" ]; then VERSION="${TAG}"; else VERSION="pr-${COMMIT:0:12}"; fi
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          BUILD_TIME="$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          export CGO_ENABLED=0 GOFLAGS=-mod=readonly SOURCE_DATE_EPOCH
          build() {
            GOOS=linux GOARCH="$1" go build -buildvcs=false -trimpath \
              -ldflags="-s -w -buildid= -X ${VP}.Version=${VERSION} -X ${VP}.Commit=${COMMIT} -X ${VP}.BuildTime=${BUILD_TIME}" \
              -o "$2" ./cmd/dho
            touch -d "@${SOURCE_DATE_EPOCH}" "$2"
          }
          mkdir -p dist twin
          build arm64 dist/dho-linux-arm64
          build arm64 twin/dho-linux-arm64-again
          cmp dist/dho-linux-arm64 twin/dho-linux-arm64-again
          build amd64 twin/dho-linux-amd64
          (cd dist && sha256sum dho-linux-arm64 > dho-linux-arm64.sha256 && sha256sum -c dho-linux-arm64.sha256)
          # go version -m does not record -ldflags here, so the arm64 stamp is checked in the bytes
          [ "$(go version -m dist/dho-linux-arm64 | grep -c -F -e "-trimpath=true")" = 1 ]
          grep -a -q -F -e "${COMMIT}" dist/dho-linux-arm64
          twin/dho-linux-amd64 version | jq -e --arg c "${COMMIT}" '.commit == $c and .commit != "unknown"'
          echo "commit=${COMMIT}"
          cat dist/dho-linux-arm64.sha256
