        condition: service_completed_successfully
      go-worker-operator-credential:
        condition: service_completed_successfully
      go-river-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy

  go-worker-heavy: &go-worker
    # codex review (r3 -- team-lead): a bare `docker compose up` built
    # go-river-provision/migrate locally but PULLED this image, so migrate
    # and the worker fleet could come from different trees and
    # CHAOS-5437's posture-manifest digest lockstep refuses readiness by
    # design, deterministically, on every from-scratch bring-up -- proven
    # by the readyz proof in TEST-EVIDENCE. `build:` makes this file build
    # the same tree's image by default, same as every other Go service
    # here; `image:` stays so `DEV_HEALTH_GO_WORKER_IMAGE` can still pin an
    # already-published tag instead. codex review (JOB 6 re-render, P1):
    # `pull_policy` defaults to `missing` -- with NO override, a bare `up`
    # (no `--build`) prefers an already-present local image tagged
    # `ghcr.io/full-chaos/dev-health-go-worker:latest` over building this
    # tree, reintroducing the exact cross-tree lockstep refusal the
    # `build:` block above exists to prevent, on any host that ever pulled
    # that tag (e.g. an earlier proof run on this one). `pull_policy: build`
    # (the bigboy overlay's own convention) forces the tree's build every
    # time; `DEV_HEALTH_GO_WORKER_IMAGE` still names what gets tagged.
    # r5 P1 (executed repro): `pull_policy: build` unconditionally REJECTS
    # a digest-shaped `DEV_HEALTH_GO_WORKER_IMAGE` override -- Compose must
    # assign `image:` as the BUILD OUTPUT's tag under `build:`, and a
    # digest (content-addressed, computed FROM a build, never assignable
    # TO one) can never be a legal build tag ("build tag cannot contain a
    # digest", confirmed for all four `*_IMAGE` families). Pinning an
    # EXACT already-published image (by tag or digest) is a different
    # intent than "build this tree" and needs pull skipped, not forced --
    # `DEV_HEALTH_GO_WORKER_PULL_POLICY` (default unchanged, `build`) lets
    # an operator opt out per family: set it to `missing`/`always` alongside
    # a digest-pinned `DEV_HEALTH_GO_WORKER_IMAGE` to use that exact image
    # with no local build at all.
    image: ${DEV_HEALTH_GO_WORKER_IMAGE:-ghcr.io/full-chaos/dev-health-go-worker:latest}
    pull_policy: ${DEV_HEALTH_GO_WORKER_PULL_POLICY:-build}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: worker
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: heavy
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    command:
      - --queues=investment,metrics,reports,workgraph
      - --queue-concurrency=investment=1,metrics=2,reports=2,workgraph=1
      - --worker-group=heavy
      - --shutdown-timeout=7260s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url-heavy
      - *flag-bridge-insecure
      - *flag-log-level
    environment: &go-worker-env
      <<: *go-worker-env-base
    stop_grace_period: 7260s
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      # codex review (r2, P1): every go-* service reads POSTGRES_URI
      # (domain) and WORKER_DATABASE_URI (queue-control) from
      # go-worker-env-base -- gate on both poolers' healthchecks, not just
      # container-started, so a worker doesn't attempt its first connection
      # before the pooler it targets can actually serve one.
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
      # this group's --operational-bridge-url points at metrics-api, a
      # separate service with no other dependency edge into it -- gating on
      # its healthcheck (not just container-started) means this worker
      # doesn't start dispatching metrics/workgraph jobs before the bridge
      # target can actually answer them.
      metrics-api:
        condition: service_healthy
    deploy: &go-worker-resources
      replicas: 1
      resources:
        limits: {cpus: "1.0", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}

  go-worker-ops:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: ops
    command:
      - --queues=coverage,heartbeat,retention,webhooks
      - --queue-concurrency=coverage=1,heartbeat=1,retention=1,webhooks=4
      - --worker-group=ops
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
