# Executed Compose proof for the Go worker services of compose.yml: the four River workers and the three stream
# services are built from this tree, started in a private compose project in first-start order, and each is held to
# the Postgres DSN names of its own process class (container env NAMES, never values), RestartCount 0, /healthz and
# /readyz 200. The logic is ci/check_go_workers_compose.sh.
#
# A PROOF, deliberately NOT a required check: it takes minutes and needs docker. It runs on every push to main and
# on every pull request, and decides RELEVANCE INSIDE for a pull request (like auth-k8s-proof.yml): the compose
# files, the process manifest, the worker, stream, reconciler and scheduler services with the config and Postgres
# packages they load, the Dockerfile, and this proof's own files. An irrelevant pull request reports a green job
# that says so. Its name is distinct from every required context.
name: Go workers compose proof

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  # Pull the mirrored test-dependency images from ghcr.io.
  packages: read

concurrency:
  # The fleet-wide shape (go.yml, venue-oracles.yml): a pull request by number, a push to main by commit sha (never
  # cancelled), any other ref by name.
  # A ready_for_review run gets its own group keyed by the head sha and is never cancelled: a synchronize run of the
  # same sha (a push right before the flip) cannot cancel it, and its ready-reuse job waits for that run instead.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}${{ github.event.action == 'ready_for_review' && '-ready-' || '' }}${{ github.event.action == 'ready_for_review' && github.event.pull_request.head.sha || '' }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.event.action != 'ready_for_review') || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  go-workers-compose-proof:
    name: go-workers-compose-proof
    needs: ready-reuse
    if: (!(github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci:full'))) && !contains(fromJSON(needs.ready-reuse.outputs.passed), 'go-workers-compose-proof')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GO_WORKERS_COMPOSE_PROOF_PROJECT: gwproof${{ github.run_id }}x${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Does the change touch what this proof proves?
        id: relevance
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" != "pull_request" ]; then
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
            echo "proof runs: ${EVENT} is not a pull request"
            exit 0
          fi
          mb="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          relevant=false
          if git diff --name-only --no-renames "${mb}" "${HEAD_SHA}" \
            | grep -E '^(compose\.yml$|ci/bigboy/|deploy/go-workers/|docker/go-worker\.Dockerfile$|ci/check_go_workers_compose\.sh$|ci/go_workers_compose_proof\.override\.yml$|\.github/workflows/go-workers-compose-proof\.yml$|internal/(deploymentcontract|platform/config|platform/shell|storage/postgres|workerservice|streamrunnerservice|reconcilerservice|schedulerservice|workersctl)/|cmd/dho/)'; then
            relevant=true
          fi
          echo "relevant=${relevant}" >> "${GITHUB_OUTPUT}"
          echo "relevant=${relevant}"

      - name: Log in to GitHub Container Registry
        if: steps.relevance.outputs.relevant == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose up the Go workers, probe them, tear down
        if: steps.relevance.outputs.relevant == 'true'
        run: bash ci/check_go_workers_compose.sh

      - name: Remove anything of the proof project that is left
        if: always() && steps.relevance.outputs.relevant == 'true'
        run: |
          set -u
          for id in $(docker ps -aq --no-trunc --filter "label=com.docker.compose.project=${GO_WORKERS_COMPOSE_PROOF_PROJECT}"); do docker rm -f -v "${id}"; done
          for id in $(docker volume ls -q --filter "label=com.docker.compose.project=${GO_WORKERS_COMPOSE_PROOF_PROJECT}"); do docker volume rm -f "${id}"; done
          for id in $(docker network ls -q --filter "label=com.docker.compose.project=${GO_WORKERS_COMPOSE_PROOF_PROJECT}"); do docker network rm "${id}"; done

      - name: Not relevant
        if: steps.relevance.outputs.relevant != 'true'
        run: echo "the change touches nothing this proof proves; it did not run"

  # Ready flip: names the legs that already passed on this exact head sha (ci/ready_reuse.sh, read from the BASE commit
  # so a change cannot rewrite its own judge); each leg below skips when its unit is in `passed`, and its gate prints
  # REUSED for it. Every other event, and a base without the script, passes [] and every leg runs.
  ready-reuse:
    name: ready-reuse
    runs-on: ubuntu-latest
    # The judge waits up to 20 minutes for a run of the same sha still in flight.
    timeout-minutes: 24
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.reuse.outputs.passed || '[]' }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - name: Check out the reuse judge from the base commit
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: ci/ready_reuse.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Name the legs that already passed on this head sha
        id: reuse
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          READY_REUSE_UNITS: |
            go-workers-compose-proof exact 1 - go-workers-compose-proof
        run: |
          if [ ! -f ci/ready_reuse.sh ]; then
            echo "READY REUSE OFF: the base commit has no ci/ready_reuse.sh; every leg runs"
            echo 'passed=[]' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          bash ci/ready_reuse.sh
