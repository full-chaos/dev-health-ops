      - local_compose_start
      - --correlation-id
      - local-compose-post-sync
      - post_sync
    depends_on:
      go-sync-finalize-route-activate:
        condition: service_completed_successfully
      go-worker-operator-credential:
        condition: service_completed_successfully
      go-river-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
