name: Security Scan

on:
  push:
    branches: [main]
  # CHAOS-6973: a stacked PR's base is a sibling branch, never main -- with
  # `branches: [main]` here that meant Gitleaks/pip-audit/Semgrep silently
  # never ran on any stacked PR in this repo's history (confirmed on
  # #3330/#3331: zero Security Scan check-runs, not even a cancelled one,
  # while #3329, the bottom of that same stack with base=main, got a real
  # run). Same fix test.yml/typecheck.yml already carry for the identical
  # reason: match every base, not just main.
  pull_request:
    branches: ["**"]
  merge_group:

concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed):
  # canonical fleet-wide shape -- group by PR number on pull_request, by
  # ref on a push to a non-main branch, by commit sha on a push to main or
  # on merge_group (a commit sha never collides with another commit's, so
  # main pushes and merge_group entries are never cancelled -- see
  # go.yml/typecheck.yml/docker-images.yml/arc-runner-image.yml for the
  # specific incidents this protects). cancel-in-progress cancels a stale
  # PR re-push and a stale non-main branch push only.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install pip-audit
        # CHAOS-3948: pinned to the uv.lock version, same shape/fix as
        # lint.yml's ruff pin (CHAOS-3946) -- a bare floor specifier resolves
        # to whatever is newest on PyPI at CI run time, not the version
        # contributors actually run locally via `uv sync`.
        run: pip install "pip-audit==2.10.0"

      - name: Run pip-audit (fail on any vulnerability)
        run: |
          # Build ignore flags from repo-controlled allowlist (not user input)
          IGNORE_ARGS=""
          if [ -f .pip-audit-ignore ]; then
            while IFS= read -r line; do
              [[ "$line" =~ ^[[:space:]]*# ]] && continue
              [[ -z "${line// }" ]] && continue
              CVE=$(echo "$line" | awk '{print $1}')
              IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $CVE"
            done < .pip-audit-ignore
          fi
          # shellcheck disable=SC2086
          pip-audit \
            --requirement requirements.txt \
            --vulnerability-service pypi \
            --format markdown \
            --output pip-audit-report.md \
            $IGNORE_ARGS

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-report
          path: pip-audit-report.md
          if-no-files-found: ignore
          retention-days: 30

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Semgrep
        run: pip install "semgrep>=1.99.0"

      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Drop nosemgrep-suppressed findings from the SARIF
        # Semgrep honors `# nosemgrep: <rule-id>` in its own reporting but
        # still emits the finding into SARIF with suppressions[inSource];
        # GitHub code scanning keeps those as OPEN alerts (verified: the
        # long-suppressed bcrypt/jwt lines in api/auth were open on PR
        # #1145). Strip ONLY results whose every suppression is an accepted
        # in-source one (adversarial-review: an external or
        # rejected/under-review suppression must NOT hide a finding), and if
        # the filter itself fails, upload the RAW SARIF rather than losing
        # scanner output.
        run: |
          if jq '.runs[].results |= map(select(
                   ((.suppressions // []) | length == 0)
                   or ((.suppressions // []) | any(
                        .kind != "inSource"
                        or ((.status // "accepted") != "accepted")
                      ))
                 ))' semgrep.sarif > semgrep.filtered.sarif \
             && jq -e '.runs' semgrep.filtered.sarif > /dev/null; then
            mv semgrep.filtered.sarif semgrep.sarif
          else
            echo "::warning::SARIF suppression filter failed; uploading unfiltered results"
          fi

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semgrep-results
          path: semgrep.sarif
          if-no-files-found: warn

      - name: Upload Semgrep SARIF to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: semgrep.sarif

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    # CHAOS-8294: the pinned scanner binary runs directly (the release tarball, sha256-verified), not through gitleaks/gitleaks-action.
    # The action needs a license secret for an organization (a Dependabot run gets no secrets: "License key is required") and does not
    # support merge_group; the binary needs neither, so Dependabot PRs and merge_group runs are scanned too. A finding fails the job
    # (CHAOS-8291: no `continue-on-error`). The job is NOT a required check of the ruleset, so a red job blocks no merge; making it
    # required is a separate ruleset decision.
    permissions:
      contents: read
      security-events: write # upload the SARIF findings to code scanning
    env:
      # CHAOS-8181: the scanner version the golden scan in internal/testsupport/goldenscan follows; the sha256 is the release's own
      # checksums-file line for the linux x64 tarball (gitleaks_8.24.3_checksums.txt), verified before the binary runs.
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned Gitleaks binary
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          test "$("${RUNNER_TEMP}/gitleaks/gitleaks" version)" = "${GITLEAKS_VERSION}"

      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The commits this event adds, as the pull_request / push / merge_group scan forms: the new commits only (merges excluded, the
          # first-parent line only), never the history already on main. Any other event (schedule, workflow_dispatch) scans everything.
          case "${EVENT_NAME}" in
            pull_request)
              if [ -z "${PR_BASE_SHA}" ] || [ -z "${PR_HEAD_SHA}" ]; then echo "::error::the pull_request base or head sha is empty"; exit 1; fi
              range="${PR_BASE_SHA}..${PR_HEAD_SHA}" ;;
            merge_group)
              if [ -z "${MQ_BASE_SHA}" ] || [ -z "${MQ_HEAD_SHA}" ]; then echo "::error::the merge_group base or head sha is empty"; exit 1; fi
              range="${MQ_BASE_SHA}..${MQ_HEAD_SHA}" ;;
            push)
              if [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE//0/}" != "" ]; then range="${PUSH_BEFORE}..${PUSH_AFTER}"; else range="-1"; fi ;;
            *) range="" ;;
          esac
          args=(detect --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif --log-level=debug)
          if [ -n "${range}" ]; then
            if [ "${range}" = "-1" ]; then
              # the last commit alone: a merge commit adds nothing to scan, so that is a scan that reads no commit too
              if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]; then
                echo "::error::the last commit is a merge commit: nothing to scan"
                exit 1
              fi
              args+=("--log-opts=-1")
            else
              # A scan that reads no commit must not pass (an empty or unknown sha, or a range that holds only merge commits): fail
              # before the scan, like the action's unsupported-event failure did. A bad sha fails in rev-list itself.
              count="$(git rev-list --count --no-merges --first-parent "${range}")"
              if [ "${count}" -lt 1 ]; then
                echo "::error::the scan range ${range} holds no commit to scan"
                exit 1
              fi
              args+=("--log-opts=--no-merges --first-parent ${range}")
            fi
          fi
          echo "gitleaks ${args[*]}"
          "${RUNNER_TEMP}/gitleaks/gitleaks" "${args[@]}"

      # CHAOS-8291: a finding becomes a Code Scanning alert. `if: always()` so a failed scan step still uploads what it found.
      # CHAOS-8299: on a push to main the scan reads only that push's commits, and a Code Scanning upload with an empty result set
      # under the same category marks an earlier alert as fixed. A secret that stays in history is not fixed by a later clean push, so
      # a push uploads only when its own scan found something (the scan step failed); a pull_request run uploads every time (its
      # alerts belong to the PR's own ref, and a clean result there is true for that ref).
      - name: Upload Gitleaks SARIF to code scanning
        if: always() && hashFiles('results.sarif') != '' && (github.event_name != 'push' || failure())
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
          category: gitleaks
