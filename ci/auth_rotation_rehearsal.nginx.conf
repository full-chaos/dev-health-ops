# TLS front for the key-rotation rehearsal (ci/rehearse_auth_key_rotation.sh). go-api verifies EdDSA access tokens
# against an https issuer only, so the issuer origin is this server: it forwards the discovery and JWKS documents
# of auth-service and nothing else. The certificate is made by the script for this run and trusted by go-api
# through SSL_CERT_FILE.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/rehearsal/tls/issuer.pem;
    ssl_certificate_key /etc/rehearsal/tls/issuer.key;
    location = /.well-known/openid-configuration { proxy_pass http://auth-service:8095; proxy_http_version 1.1; }
    location = /.well-known/jwks.json { proxy_pass http://auth-service:8095; proxy_http_version 1.1; }
    location / { return 404; }
  }
}
