      - 'ci/go_providersync_test_shards.tsv'
      - 'ci/requirements-live-python-oracles.txt'
      - 'ci/requirements-clickhouse-migrations.txt'
      - 'ci/check_go_containers.sh'
      - 'docs/go-migration-matrix.md'
