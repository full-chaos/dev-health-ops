# The required `go-quality` check, in ONE always-run workflow.
#
# WHY (CHAOS-4834). `go-quality` used to be declared in two workflows: go.yml
# (path-filtered, does the real work) and go-quality-noop.yml (paths-ignore,
# reports a vacuous success so non-Go pull requests could satisfy the required
# check). A change set touching both a path-listed and an unlisted file triggers
# BOTH. Two runs then report the same required context, and which one branch
# protection honours is unspecified -- the no-op's green can land first and
# satisfy a required check that never ran the gate. That is not a theoretical
# ordering concern; it is a required check that can pass without running.
#
# Deciding relevance in the TRIGGER is what created the duplicate. This decides
# it INSIDE the job instead: one workflow declares `go-quality`, it always
# reports, and it reports honestly -- either the gate ran, or the job says in
# plain text that it skipped and why.
#
# PARALLEL LEGS (CHAOS-6690). The gate used to be ONE 34-minute step
# (`check_go.sh ci`: vet 2, test 5.6, race 17, live-Python oracles 8.4, the rest
# ~1.5) and was the whole critical path of a PR (median 28.6 min, p90 36.8, plus
# 3 min of queue). It now runs as parallel legs (`check_go.sh ci-leg`; the live-Python
# oracle leg was deleted with the oracles, CHAOS-7308, and no step of this
# workflow installs Python) and
# a fan-in job that KEEPS the required context name `go-quality`, so no
# branch-protection edit is needed. The fan-in is `unconditional`: a leg that is
# skipped, cancelled or missing from the result FAILS the gate (a measurement
# that did not happen must not read green). internal/cigates/workflows/workflows_quality_legs_test.go
# pins that the legs together run exactly the steps of `ci`.
#
# ONE PLAN VERDICT (go-quality-plan). `cmd/cigate plan-verdict --go-files-full`, the
# program go.yml's integration plan job runs, judges the change set once. With
# --go-files-full a .go file is FULL, so is any path in no declared class, any push to
# main, merge group, schedule or manual run, and any failure of the plan: every package
# runs. A non-Go path in a declared class plans the packages that read it (AFFECTED) or
# NONE when no package reads it; NONE skips the test and race legs, AFFECTED runs only its
# packages. The static leg and the fan-in always run and report.
name: Go quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['**']
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  # Pull the mirrored test-dependency images from ghcr.io (CHAOS-4778).
  packages: read

concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed):
  # standardized from a bare `github.ref` key (which did not distinguish a
  # pull_request from a same-branch push, and never protected main/
  # merge_group from cancellation) to the canonical fleet-wide shape --
  # group by PR number on pull_request, by ref on a push to a non-main
  # branch, by commit sha on a push to main or on merge_group (never
  # cancelled -- see go.yml/typecheck.yml/docker-images.yml/
  # arc-runner-image.yml for the specific incidents this protects).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  go-quality-plan:
    name: go-quality-plan
    # Same ARC routing as the fan-in below.
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.plan.outputs.verdict }}
      selection: ${{ steps.plan.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs the base commit; the default depth-1 checkout cannot see it.
          fetch-depth: 0

      - name: Configure self-hosted Go cache paths
        if: vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')
        run: |
          echo "GOMODCACHE=/mnt/go-cache/mod" >> "${GITHUB_ENV}"
          echo "GOCACHE=/mnt/go-cache/build" >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
          cache: ${{ !(vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) }}

      # Fails OPEN: an unresolvable range (ci/go_relevant_diff.sh refuses the all-zeros sentinel and a
      # non-ancestor BASE_SHA rather than guess), a failed go list or a failed plan program is FULL.
      # The cigate binary is built from the merge base, so a pull request cannot change that binary; this step's
      # text, ci/go_relevant_diff.sh and go list still run from the PR tree.
      - name: Plan the change set (NONE / AFFECTED / FULL)
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/go-quality-plan.txt"
          full() { printf 'FULL %s\n' "$1" > "${out}"; echo "::warning title=GO-QUALITY PLAN FELL BACK TO EVERY PACKAGE::$1"; }
          if ! bash ci/go_relevant_diff.sh > "${RUNNER_TEMP}/changed.txt"; then
            full "could not compute the changed-file list"
          elif ! modpath="$(go list -m)" || ! go list -mod=readonly ./... > "${RUNNER_TEMP}/packages.txt"; then
            full "go list failed"
          elif ! go list -mod=readonly -test -json ./... > "${RUNNER_TEMP}/golist.json"; then
            full "go list -test failed"
          else
            sed -e "s#^${modpath}/##" -e "s#^${modpath}\$#.#" "${RUNNER_TEMP}/packages.txt" > "${RUNNER_TEMP}/keys.txt"
            if ! mb="$(git merge-base "${BASE_SHA}" HEAD)" \
              || ! git worktree add --detach "${RUNNER_TEMP}/planbase" "${mb}" \
              || ! go -C "${RUNNER_TEMP}/planbase" build -trimpath -mod=readonly -o "${RUNNER_TEMP}/cigate-base" ./cmd/cigate; then
              full "could not build the planner at the merge base"
            elif ! "${RUNNER_TEMP}/cigate-base" plan-verdict --event "${EVENT_NAME}" --go-files-full \
              --changed "${RUNNER_TEMP}/changed.txt" --golist "${RUNNER_TEMP}/golist.json" --keys "${RUNNER_TEMP}/keys.txt" \
              --root "${GITHUB_WORKSPACE}" --base "${BASE_SHA}" > "${out}"; then
              full "plan program failed"
            fi
          fi
          cat "${out}"
          printf 'verdict=%s\n' "$(head -n 1 "${out}" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
          { echo 'selection<<GO_QUALITY_PLAN_EOF'; cat "${out}"; echo 'GO_QUALITY_PLAN_EOF'; } >> "${GITHUB_OUTPUT}"

  go-quality-leg:
    name: go-quality-leg (${{ matrix.name }})
    needs: [go-quality-plan]
    strategy:
      # One red leg must not cancel the others: every leg reports its own signal.
      fail-fast: false
      matrix:
        include:
          # static = format, vet, build, contract, integration-vet, shard plans
          # + the migration matrix contract, gqlgen drift, shellcheck pin and
          # River harness checks. race COUNT below MUST equal the number of race
          # entries (the tooling test pins it).
          - name: static
            args: static
          # CHAOS-10355: three weighted test shards (ci/go_test_weights.tsv). The single test leg took 19.6-28.5 min of the 30 min
          # cap. test COUNT below MUST equal the number of test entries (internal/cigates/testshard pins it). The legs are
          # not required status contexts (the ruleset requires the `go-quality` aggregate).
          - name: test-1-of-3
            args: test 1 3
          - name: test-2-of-3
            args: test 2 3
          - name: test-3-of-3
            args: test 3 3
          # CHAOS-8135: three race legs. Two legs held ~5k s of race CPU, two
          # 400-600 s packages per leg, and a leg's packages slow each other
          # (providersync 340-601 s, goapiproof 346-600 s): race-2 crossed the
          # 600 s go test default. The legs are not required status contexts
          # (the ruleset requires the `go-quality` aggregate), so the count can
          # change without a ruleset edit.
          - name: race-1-of-3
            args: race 1 3
            heavy: true
            pool: true
          - name: race-2-of-3
            args: race 2 3
            heavy: true
            pool: true
          - name: race-3-of-3
            args: race 3 3
            heavy: true
            pool: true
    # Routed to the self-hosted ARC pool while GitHub-hosted dispatch is
    # stalled (org plan change, 2026-09-04; chris ruling 16:54 PDT: route the
    # ruleset-required contexts to oci-arc-runners so merges can continue).
    # Flipping the repo variable SELF_HOSTED_RUNNERS back to 'disabled'
    # restores the hosted runner with no code change. Fork PRs always stay
    # hosted -- same safety condition as go.yml's dual-leg jobs (a public
    # repo must never hand a fork's untrusted PR code a self-hosted runner).
    # CHAOS-10294: the race legs flagged `pool` (race-1, race-2, race-3) run on the bigboy ARC pool
    # named by the repo variable CI_RACE_RUNNER, on push to main of THIS repo only
    # (ops is public: a fork or PR event never reaches the pool through this term).
    # The variable unset or empty = hosted. SELF_HOSTED_RUNNERS keeps routing
    # every leg as before.
    runs-on: ${{ (matrix.pool && vars.CI_RACE_RUNNER != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'full-chaos/dev-health-ops') && vars.CI_RACE_RUNNER || (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    # 20m -> 45m (chris/team-lead, first-live-run finding): this job's own
    # PR (#2242) timed out and was cancelled at the 20m cap on ARC -- load1
    # on bigboy was 160+ during that run (shared with codex rounds/
    # batteries), not a flake. 20m was sized for a dedicated GitHub-hosted
    # VM; it is the wrong budget for a shared self-hosted pool. 45m is a
    # deliberately generous multiple, not a tight refit -- retune down once
    # real completion times on ARC are known.
    timeout-minutes: ${{ (matrix.pool && vars.CI_RACE_RUNNER != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'full-chaos/dev-health-ops') && 45 || 30 }}
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository_owner }}
      TESTCONTAINERS_RYUK_DISABLED: ${{ (matrix.pool && vars.CI_RACE_RUNNER != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'full-chaos/dev-health-ops') && 'true' || 'false' }}
      # The default 600 s per-package go test timeout is too small for the pool.
      DEV_HEALTH_GO_RACE_TEST_TIMEOUT: ${{ (matrix.pool && vars.CI_RACE_RUNNER != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'full-chaos/dev-health-ops') && '25m' || '10m' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the base commit to diff against; the default depth-1 checkout
          # cannot see it. This is a git fetch, not a Docker Hub pull.
          fetch-depth: 0

      # Each ARC pool runner pod has its own dind daemon and runs one job (2026-10-20), so Ryuk off
      # needs no reap; a daemon that already holds testcontainers fails the job here.
      - name: Assert no testcontainers at job start
        if: matrix.pool && vars.CI_RACE_RUNNER != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'full-chaos/dev-health-ops'
        run: bash ci/assert_no_testcontainers.sh

      - name: Check the migration matrix stamps are real commits
        if: matrix.name == 'static'
        # Structural only (CHAOS-8620): the stamps must be 40-hex ancestors of
        # HEAD. No age budget: the matrix is a record of a finished migration.
        # bash + git only, so it runs on either leg before anything installs.
        run: bash ci/check_migration_matrix.sh stamp

      - name: Decide whether this leg runs, and on which packages
        id: relevance
        env:
          # CHAOS-9949: a heavy (race) leg of a draft PR without the ci:full label reports success without running, through the same
          # relevant=false path as a NONE plan. It runs once the PR is ready for review.
          DRAFT_SKIP: ${{ matrix.heavy && github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci:full') && 'true' || 'false' }}
          LEG: ${{ matrix.name }}
          PLAN_VERDICT: ${{ needs.go-quality-plan.outputs.verdict }}
          PLAN_SELECTION: ${{ needs.go-quality-plan.outputs.selection }}
        run: |
          set -euo pipefail
          if [ "${DRAFT_SKIP}" = "true" ]; then
            echo "draft PR without the ci:full label: heavy leg skipped until the PR is ready for review"
            printf 'relevant=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          printf 'plan verdict: %s\n' "${PLAN_SELECTION}"
          if [ "${LEG}" = "static" ]; then
            echo "the static leg runs on every change set"
            printf 'relevant=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          case "${PLAN_VERDICT}" in
            NONE)
              echo "plan verdict NONE: this leg is skipped"
              printf 'relevant=false\n' >> "${GITHUB_OUTPUT}"
              ;;
            AFFECTED)
              printf '%s\n' "${PLAN_SELECTION}" > "${RUNNER_TEMP}/go-quality-selection.txt"
              echo "GO_QUALITY_SELECTION_FILE=${RUNNER_TEMP}/go-quality-selection.txt" >> "${GITHUB_ENV}"
              printf 'relevant=true\n' >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "plan verdict ${PLAN_VERDICT:-missing}: every package runs"
              printf 'relevant=true\n' >> "${GITHUB_OUTPUT}"
              ;;
          esac

      - name: Report that the gate was skipped, and why
        if: steps.relevance.outputs.relevant != 'true'
        run: |
          echo "skipped: the go-quality-plan verdict is NONE (or this is a draft's heavy leg)."
          echo "The verdict comes from cmd/cigate plan-verdict. This job still REPORTS, so the"
          echo "required check is satisfied honestly rather than by a second workflow."

      - name: Configure self-hosted Go cache paths
        # CHAOS-4906: the oci-arc-runners pool exports GOMODCACHE/GOCACHE to a
        # SHARED hostPath (unlike a GitHub-hosted runner's ephemeral per-job
        # filesystem), same as go.yml's self-hosted legs. Only set on the
        # self-hosted leg; the hosted leg keeps setup-go's normal cache.
        if: steps.relevance.outputs.relevant == 'true' && ((vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) || (matrix.pool && vars.CI_RACE_RUNNER != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'full-chaos/dev-health-ops'))
        run: |
          echo "GOMODCACHE=/mnt/go-cache/mod" >> "${GITHUB_ENV}"
          echo "GOCACHE=/mnt/go-cache/build" >> "${GITHUB_ENV}"

      - name: Set up Go
        id: setup-go
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # CHAOS-10486: never setup-go's own cache. Its key (setup-go-<os>-<arch>-go-<version>-<go.sum hash>) is shared by
          # every workflow's setup-go, and the first job to finish on main saves it: a job that compiles nothing saved 7 KB,
          # and every hosted leg then "hit" that empty entry, compiled everything cold and never saved. The hosted legs
          # restore this workflow's own per-leg cache below; the self-hosted legs keep the pool's shared hostPath.
          cache: false

      - name: Restore this leg's Go build and module cache (GitHub-hosted legs)
        # CHAOS-10486: one cache per leg, keyed on the leg, the runner, the Go version and go.sum; a pull request restores
        # what main saved (the newest entry of the leg when go.sum moved). Saved only by a push to main, below.
        # The segment after go-quality- is the layout of the cached directory (v1 was built into /tmp, so it held little):
        # bump it whenever that layout changes, because a key is immutable and the save runs only on a key miss.
        id: go-cache
        if: steps.relevance.outputs.relevant == 'true' && runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-quality-v2-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-quality-v2-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      - name: Build into the restored Go cache (GitHub-hosted legs)
        # CHAOS-10486: check_go.sh builds into DEV_HEALTH_GO_CACHE, else an inherited or configured GOCACHE, else
        # /tmp/dev-health-go-build-cache. A hosted runner's GOCACHE is the unset default, so the cache restored above was
        # never read. An expanded absolute path (a literal ~ is not expanded by the shell). The pool legs keep their hostPath.
        if: steps.relevance.outputs.relevant == 'true' && runner.environment == 'github-hosted'
        run: echo "DEV_HEALTH_GO_CACHE=${HOME}/.cache/go-build" >> "${GITHUB_ENV}"

      - name: Set up Helm
        # internal/cigates/chartgates renders the chart with `helm template` in the test and race legs; the
        # oci-arc-runners image ships no helm. A missing helm fails
        # those guards, it never skips them.
        if: steps.relevance.outputs.relevant == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.21.4'

      - name: Prove the migration matrix contract, and prove its freshness gate
        if: steps.relevance.outputs.relevant == 'true' && matrix.name == 'static'
        # The contract half: re-renders the page from the COMMITTED sources
        # only -- no database, no docker, no network -- and fails when a row
        # claims a status its evidence column cannot support, or when a
        # generated cell was improved by hand.
        #
        # The test suite beside it is the executed proof for the freshness
        # half that ran unconditionally above: seven throwaway repositories,
        # each with one specific lie planted in the stamp, plus one with no
        # lie so a script that failed unconditionally could not pass either.
        run: |
          set -euo pipefail
          bash ci/check_migration_matrix.sh contract
          bash ci/check_migration_matrix_test.sh
          bash ci/go_worker_fixture_test.sh

      - name: Check the gqlgen output has not drifted from its hand-edits
        if: steps.relevance.outputs.relevant == 'true' && matrix.name == 'static'
        # cmd/query-api's generated GraphQL layer carries deliberate
        # hand-edits -- the nullability rulings recorded in the file comments --
        # and a bare `gqlgen generate` reverts every one of them.
        #
        # Until tools.go was added, the only thing preventing that revert
        # was that `gqlgen generate` COULD NOT RUN: the CLI's own dependencies
        # were absent from go.sum, so the command documented in
        # internal/queryapi/server/README.md failed before doing anything. An accident was
        # holding a contract. This step is what replaces the accident.
        #
        # The guard regenerates inside a PRIVATE COPY of the module -- the
        # generator never runs in the checkout, so no configuration can make it
        # write here -- and compares the result with the checked-in files. The
        # comparison is byte for byte against contracts/gqlgen/v1/expected-drift.record,
        # which makes it exact in BOTH directions: new drift means something was
        # regenerated over a hand-edit, and a MISSING entry means a hand-edit
        # vanished. The second is how a nullability ruling would quietly revert,
        # and a subset check would not see it.
        #
        # -update is deliberately absent: it REWRITES the record instead of
        # comparing against it, which would make this step incapable of failing.
        # A test asserts this command does not carry it.
        run: go run -trimpath ./cmd/gqlgen-guard check-drift

      - name: Prepare base job contracts
        if: steps.relevance.outputs.relevant == 'true' && matrix.name == 'static' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # Fetch only when the base commit is missing from this checkout,
          # and never with --depth=1: even a redundant shallow fetch of a
          # commit already present still writes a shallow boundary, and git
          # then treats that boundary as "no parents beyond here" for every
          # later merge-base/ancestor query against this checkout -- a
          # silently WRONG answer, not a stale one, however complete the
          # real history still is.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}"
          fi
          # The closed lists (ci/ratchets.tsv, `check_go.sh ratchets`) are held to their size on this base (CHAOS-7904).
          echo "RATCHET_BASE_SHA=${BASE_SHA}" >> "${GITHUB_ENV}"
          if ! git cat-file -e "${BASE_SHA}:contracts/jobs/v1" 2>/dev/null; then
            echo "No v1 job contracts exist on the merge base; validating the additive tree only."
            exit 0
          fi
          base_dir="${RUNNER_TEMP}/job-contract-base"
          mkdir -p "${base_dir}"
          git archive "${BASE_SHA}" contracts/jobs/v1 | tar -x -C "${base_dir}"
          echo "DEV_HEALTH_CONTRACT_BASE=${base_dir}/contracts/jobs/v1" >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        if: steps.relevance.outputs.relevant == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull pinned test dependency images with bounded retry
        if: steps.relevance.outputs.relevant == 'true'
        run: bash ci/check_go.sh integration-prepull

      - name: Run Go quality leg
        if: steps.relevance.outputs.relevant == 'true'
        # Each stage of the leg prints UTC start/done stamps (`==> stage ...`).
        run: bash ci/check_go.sh ci-leg ${{ matrix.args }}

      - name: Save this leg's Go build and module cache (main pushes, GitHub-hosted legs)
        # CHAOS-10486: only a push to main saves, and only on a key miss (a key is immutable); a failed leg still saves,
        # because its compiled packages are as valid as a passing leg's (the build cache is content-addressed) and a leg
        # that fails on a timeout is the one that most needs a warm start. A cancelled leg does not save.
        if: >-
          !cancelled() && steps.relevance.outputs.relevant == 'true' && runner.environment == 'github-hosted'
          && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Install pinned shellcheck
        if: steps.relevance.outputs.relevant == 'true' && matrix.name == 'static'
        # CHAOS-4915. Installed, not assumed: the runner image ships its own
        # shellcheck and can change it without a commit here, which is exactly
        # the nondeterminism this pins away. Checksum-verified, because an
        # unverified download is a pin on a name rather than on bytes.
        # Installed under RUNNER_TEMP and put on PATH via GITHUB_PATH so no
        # step needs sudo.
        run: |
          set -euo pipefail
          version=0.11.0
          # Arch-selected, not hardcoded: the oci-arc-runners pool is ARM64
          # (CHAOS-4906), and shellcheck's release does not publish a single
          # binary that runs on both -- an x86_64-only tarball fails "exec
          # format error" under aarch64. Both shas verified against the
          # upstream release asset bytes directly (sha256sum on a fresh
          # download of each), not copied from an unverified source.
          #
          # .tar.gz, not .tar.xz: PR #2242's own first live ARC run failed
          # here with `tar (child): xz: Cannot exec: No such file or
          # directory` -- the oci-arc-runners image (docker/arc-runner/
          # Dockerfile) has no xz-utils, only what that Dockerfile
          # explicitly adds (make/postgresql-client/gcc/libc6-dev) on top of
          # the upstream actions-runner base; GitHub-hosted ubuntu-latest
          # ships xz-utils by default, so this never surfaced there. gzip
          # needs no such assumption -- it's a dependency of apt itself, so
          # it is present on any Debian/Ubuntu-derived image without a
          # Dockerfile change. shellcheck publishes a .tar.gz for every
          # platform; both shas below verified the same way as the .tar.xz
          # ones above (sha256sum on a fresh download of each).
          case "$(uname -m)" in
            x86_64)
              arch=x86_64
              sha=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
              ;;
            aarch64|arm64)
              arch=aarch64
              sha=68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
              ;;
            *)
              echo "unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          tarball="shellcheck-v${version}.linux.${arch}.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" "https://github.com/koalaman/shellcheck/releases/download/v${version}/${tarball}"
          echo "${sha}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}"
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 "${RUNNER_TEMP}/shellcheck-v${version}/shellcheck" "${RUNNER_TEMP}/bin/shellcheck"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Check the shellcheck pin
        if: steps.relevance.outputs.relevant == 'true' && matrix.name == 'static'
        # Runs BEFORE the harness validation that depends on it. Asserts both
        # that the canonical set is clean and that the unclean fixture is still
        # rejected -- the second is what catches a linter that has silently
        # stopped linting, which otherwise reports exactly what a clean tree does.
        run: bash ci/check_shellcheck_pin.sh

      - name: Validate River compatibility harness
        if: steps.relevance.outputs.relevant == 'true' && matrix.name == 'static'
        run: bash ci/check_river_compat_static.sh

  go-quality:
    name: go-quality
    # Must remain `always()`: under any condition that lets this job itself
    # skip, a cancelled run leaves the REQUIRED check skipped, and branch
    # protection counts a skipped required check as satisfied.
    if: always()
    needs: [go-quality-plan, go-quality-leg]
    # Same ARC routing as the legs above.
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aggregate go-quality result
        env:
          GATE_NAME: go-quality
          EVENT_NAME: ${{ github.event_name }}
          # The legs always run and decide relevance inside themselves (no
          # `changes` job), so a skip is never legitimate here: the
          # `unconditional` policy, as typecheck's own fan-in. needs.<job>.result
          # of a matrix job is `success` only when EVERY leg succeeded.
          GATE_HAS_SELECTOR: "false"
          GATED_JOB_1: go-quality-leg|unconditional|${{ needs.go-quality-leg.result }}
          # The plan job must have run: a skipped or failed plan skips every leg.
          GATED_JOB_2: go-quality-plan|unconditional|${{ needs.go-quality-plan.result }}
        run: |
          chmod +x ci/aggregate_gate_results.sh
          ./ci/aggregate_gate_results.sh
