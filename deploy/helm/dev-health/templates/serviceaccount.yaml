{{- if hasKey .Values "serviceAccount" }}
{{- fail "serviceAccount is removed: every workload now has its own ServiceAccount (<workload>.serviceAccount.annotations and .automountToken); a shared ServiceAccount cannot tell one workload from another" }}
{{- end }}
{{- $components := list }}
{{- if .Values.web.enabled }}{{- $components = append $components (dict "name" "web" "cfg" .Values.web.serviceAccount) }}{{- end }}
{{- if .Values.queryApi.enabled }}{{- $components = append $components (dict "name" "query-api" "cfg" .Values.queryApi.serviceAccount) }}{{- end }}
{{- if .Values.goApi.enabled }}{{- $components = append $components (dict "name" "go-api" "cfg" .Values.goApi.serviceAccount) }}{{- end }}
{{- if eq (include "dev-health.authOn" (dict "flag" "service" "context" .)) "true" }}{{- $components = append $components (dict "name" "auth-service" "cfg" (dict "annotations" .Values.authService.serviceAccount.annotations "automountToken" (eq (include "dev-health.authServiceAutomount" .) "true"))) }}{{- end }}
{{- if .Values.goWorkers.enabled }}
{{- range $group := .Values.goWorkers.groups }}{{- $components = append $components (dict "name" (printf "go-%s" $group.name) "cfg" $.Values.goWorkers.serviceAccount) }}{{- end }}
{{- end }}
{{- range $c := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dev-health.workloadServiceAccountName" (dict "ctx" $ "component" $c.name) }}
  namespace: {{ include "dev-health.namespace" $ }}
  labels:
    {{- include "dev-health.labels" $ | nindent 4 }}
  {{- with $c.cfg.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $c.cfg.automountToken | default false }}
{{- end }}
