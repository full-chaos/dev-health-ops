{{- /*
The Go query plane. The Python edge's dispatcher forwards a GraphQL operation
here (GO_API_QUERY_API_URL, see dev-health.configData) when the routing
registry says the Go plane serves it; with queryApi disabled the edge never
learns an endpoint and every operation stays on the Python plane, which is why
this defaults off like metricsApi.
*/ -}}
{{- if .Values.queryApi.enabled }}
{{- /*
query-api is the `dho query-api` verb. The container passes the verb as its
only argument and the image entrypoint is dho, so the image must be a dho
image (dev-health-go-dho or dev-health-go-operator, matched on the last path
element, so a registry prefix, a tag and a digest are all allowed). The
retired dev-health-query-api image has no dho entrypoint: its own binary
exits 2 on the `query-api` argument, so the render refuses it by name.
*/}}
{{- if and .Values.queryApi.internal.enabled (eq (int .Values.queryApi.internal.port) (int .Values.queryApi.port)) }}
{{- fail "queryApi.internal.port must differ from queryApi.port (the public listener)" }}
{{- end }}
{{- /*
CHAOS-7085: the MCP caller-class listener (QUERY_API_MCP_ADDR). It trusts the
X-DH-Internal-* identity headers from whoever can connect, so the NetworkPolicy
below (queryApi.mcp.allowedFrom only) IS its authentication boundary. Every guard
here keeps that boundary from being bypassed by configuration.
*/}}
{{- if .Values.queryApi.mcp.enabled }}
{{- $mcpPort := int .Values.queryApi.mcp.port }}
{{- if eq $mcpPort (int .Values.queryApi.port) }}
{{- fail "queryApi.mcp.port must differ from queryApi.port (the public listener)" }}
{{- end }}
{{- if and .Values.queryApi.internal.enabled (eq $mcpPort (int .Values.queryApi.internal.port)) }}
{{- fail "queryApi.mcp.port must differ from queryApi.internal.port (the internal listener)" }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
{{- fail "queryApi.mcp.enabled with networkPolicy.enabled: the release-wide NetworkPolicy also selects the query-api pods and admits every pod in the namespace on every port; NetworkPolicies are additive, so it would open the MCP port to every pod. Disable one of them" }}
{{- end }}
{{- range .Values.queryApi.extraEnv }}
{{- if eq .name "QUERY_API_MCP_ADDR" }}
{{- fail "queryApi.extraEnv must not set QUERY_API_MCP_ADDR: the chart owns the MCP listener (queryApi.mcp.port); a second value moves it onto a port the MCP Service and NetworkPolicy do not gate" }}
{{- end }}
{{- end }}
{{- range .Values.queryApi.mcp.allowedFrom }}
{{- if not (or .matchLabels .matchExpressions) }}
{{- fail "queryApi.mcp.allowedFrom entries must select pods by non-empty matchLabels or matchExpressions: an empty selector admits every pod in the namespace to the MCP listener" }}
{{- end }}
{{- end }}
{{- end }}
{{- $queryApiImage := include "dev-health.queryApiImage" . }}
{{- if regexMatch "(^|/)dev-health-query-api([:@]|$)" $queryApiImage }}
{{- fail (printf "queryApi.image %q is the retired dev-health-query-api image, which has no dho entrypoint and exits 2 on `query-api`; use the dev-health-go-dho image." $queryApiImage) }}
{{- end }}
{{- if not (regexMatch "(^|/)dev-health-go-(dho|operator)([:@]|$)" $queryApiImage) }}
{{- fail (printf "queryApi.image %q is not a dho image (dev-health-go-dho or dev-health-go-operator); the container runs `dho query-api`." $queryApiImage) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-health.fullname" . }}-query-api
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "query-api" "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.queryApi.replicas }}
  {{- /*
  Same guarantee api-deployment.yaml states: never dip below current serving
  capacity during a rollout. Kubernetes' 25%/25% default only behaves at
  replicas: 1 by rounding.
  */}}
  {{- /* CHAOS-6647: values-driven; unset keeps the guarantee above (maxUnavailable 0, maxSurge 1). A node with no CPU headroom for a surge pod sets {maxUnavailable: 1, maxSurge: 0} (at replicas >= 2 one pod rolls at a time). */}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {{ .Values.queryApi.rollingUpdate | default (dict "maxUnavailable" 0 "maxSurge" 1) | toJson }}
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "query-api" "context" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.queryApi.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "query-api" "context" $) | nindent 8 }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "dev-health.serviceAccountName" . }}
      containers:
        - name: query-api
          image: {{ $queryApiImage }}
          imagePullPolicy: {{ .Values.queryApi.image.pullPolicy }}
          args: ["query-api"]
          ports:
            - name: http
              containerPort: {{ .Values.queryApi.port }}
              protocol: TCP
            {{- if .Values.queryApi.internal.enabled }}
            - name: internal
              containerPort: {{ .Values.queryApi.internal.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.queryApi.mcp.enabled }}
            - name: mcp
              containerPort: {{ .Values.queryApi.mcp.port }}
              protocol: TCP
            {{- end }}
            {{- /*
            /metrics is NOT served on the query listener (`http`): a scrape
            endpoint is operational detail, so it lives on the internal
            listener only (queryApi.internal.enabled), next to the
            X-DH-Internal-* identity routes and /query/proof-write. Scrape the
            `internal` port; nothing in this chart or the deploy chart scrapes
            query-api today. A second ports entry must use a distinct
            containerPort: container ports are a server-side-apply list keyed
            on containerPort+protocol, so a duplicate key rejects the whole
            Deployment.
            */}}
          {{- /*
          Declared-only by design: unlike api/metrics-api, this
          container gets NO envFrom unless the operator asks for one -- it
          must not silently inherit every key in the platform Secret/
          ConfigMap. Kubernetes gives explicit `env` entries precedence over
          `envFrom` on a name collision, so this can safely sit ahead of
          `env` below without risk of a platform key shadowing one of
          query-api's own.
          */}}
          {{- with .Values.queryApi.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: QUERY_API_ADDR
              value: {{ printf ":%v" .Values.queryApi.port | quote }}
            {{- if .Values.queryApi.internal.enabled }}
            {{- /*
            The internal listener: honours X-DH-Internal-* identity headers, serves
            /metrics and /query/proof-write, and is reachable only through the
            internal Service below (whose NetworkPolicy admits in-namespace pods
            only). No Ingress may route to it.
            */}}
            - name: QUERY_API_INTERNAL_ADDR
              value: {{ printf ":%v" .Values.queryApi.internal.port | quote }}
            {{- end }}
            {{- if .Values.queryApi.mcp.enabled }}
            {{- /*
            The MCP caller-class listener (CHAOS-7085): POST /query only, queries only,
            internal identity headers only, allowlisted root fields. Reachable only
            through the MCP Service below, whose NetworkPolicy admits
            queryApi.mcp.allowedFrom only (the acr-api pods). No Ingress may route to it.
            */}}
            - name: QUERY_API_MCP_ADDR
              value: {{ printf ":%v" .Values.queryApi.mcp.port | quote }}
            {{- end }}
            {{- /*
            Native ClickHouse wire protocol (9000), not the HTTP 8123 port the
            Python services use: the Go client Pings eagerly at construction and
            fails startup outright against 8123. By secretKeyRef, never inline:
            the URI embeds clickhouse.credentials.password and a Pod spec is
            readable by every holder of `get` on this Deployment.
            */}}
            - name: CLICKHOUSE_URI
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.secretName" . }}, key: CLICKHOUSE_NATIVE_URI}}
            {{- /*
            Registry tables (go_api_candidate_build / go_api_routing_state /
            go_api_proof_run). Its own Secret key rather than the migration
            credential a long-running service should not be borrowing; see
            secrets.data.GO_API_REGISTRY_POSTGRES_URI in values.yaml for what
            that key holds today and the pooler DSN it becomes once the
            transaction pooler carries the owning role.
            */}}
            - name: GO_API_REGISTRY_POSTGRES_URI
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.secretName" . }}, key: GO_API_REGISTRY_POSTGRES_URI}}
            - name: GO_API_ENVELOPE_JWKS_PATH
              value: {{ .Values.queryApi.envelope.jwksPath | quote }}
            - name: GO_API_ENVELOPE_ISSUER
              value: {{ .Values.queryApi.envelope.issuer | quote }}
            - name: GO_API_ENVELOPE_AUDIENCE
              value: {{ .Values.queryApi.envelope.audience | quote }}
            {{- /*
            GO_API_SCHEMA_DIGEST is deliberately absent and must stay absent.
            CHAOS-5013 removed it: query-api computes its schema digest from its
            own go:embed'ed SDL at runtime, and an operator-supplied value can
            only ever disagree with the binary. Do not add it back.
            */}}
            {{- with .Values.queryApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: envelope-jwks
              mountPath: {{ .Values.queryApi.envelope.jwksPath }}
              subPath: {{ base .Values.queryApi.envelope.jwksPath }}
              readOnly: true
          {{- with .Values.queryApi.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.queryApi.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.queryApi.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      volumes:
        {{- /*
        The envelope keypair is minted out of band (scripts/mint-envelope-keys.sh)
        and only its public half belongs in the cluster, so this chart references
        the Secret and never creates it. It must exist before this workload is
        enabled: a missing Secret leaves the Pod in ContainerCreating rather than
        failing the render, which is the one failure mode a template cannot
        catch for a resource it does not own.
        */}}
        - name: envelope-jwks
          secret:
            secretName: {{ include "dev-health.queryApiJwksSecretName" . }}
            items:
              - {key: {{ base .Values.queryApi.envelope.jwksPath }}, path: {{ base .Values.queryApi.envelope.jwksPath }}}
      {{- with .Values.queryApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.queryApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.queryApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-query-api
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "query-api" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "query-api" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.queryApi.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.queryApi.internal.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-query-api-internal
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "query-api-internal" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "query-api" "context" $) | nindent 4 }}
  ports:
    - name: internal
      port: {{ .Values.queryApi.internal.port }}
      targetPort: internal
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" . }}-query-api-internal
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "query-api-internal" "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "query-api" "context" $) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The public listener: open to every source, exactly as before this policy existed.
    - ports:
        - protocol: TCP
          port: {{ .Values.queryApi.port }}
    # The internal listener trusts X-DH-Internal-* identity headers from whoever can reach it, so
    # the network is the boundary: only this release's api pods (the edge dispatcher), plus any
    # pod selector the operator adds under queryApi.internal.allowedFrom (for example the tools
    # pod that runs `dho goapi prove-write`). Never every pod in the namespace.
    - from:
        - podSelector:
            matchLabels:
              {{- include "dev-health.componentSelectorLabels" (dict "component" "api" "context" $) | nindent 14 }}
        {{- range .Values.queryApi.internal.allowedFrom }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.queryApi.internal.port }}
{{- end }}
{{- if .Values.queryApi.mcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-query-api-mcp
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "query-api-mcp" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "query-api" "context" $) | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.queryApi.mcp.port }}
      targetPort: mcp
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" . }}-query-api-mcp
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "query-api-mcp" "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "query-api" "context" $) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The public listener: open to every source, exactly as before this policy existed
    # (a policy selecting these pods would otherwise deny it).
    - ports:
        - protocol: TCP
          port: {{ .Values.queryApi.port }}
    {{- /*
    The MCP listener trusts X-DH-Internal-* identity headers from whoever can reach it, so
    this list IS its authentication boundary: only queryApi.mcp.allowedFrom (the acr-api
    pods). NOT this release's api pods, NOT every pod. An empty list renders no rule, which
    denies the port: a rule with no `from` would admit every source.
    */}}
    {{- if .Values.queryApi.mcp.allowedFrom }}
    - from:
        {{- range .Values.queryApi.mcp.allowedFrom }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.queryApi.mcp.port }}
    {{- end }}
{{- end }}
{{- end }}
