# Source: dev-health/charts/ops/templates/auth-service.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dev-health-ops-auth-service
  namespace: dev-health
  labels:
    helm.sh/chart: ops-0.1.0
    app.kubernetes.io/name: ops
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: dev-health
    app.kubernetes.io/component: auth-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ops
      app.kubernetes.io/instance: dev-health
      app.kubernetes.io/component: auth-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: go-api
              app.kubernetes.io/instance: dev-health
              app.kubernetes.io/name: ops
      ports:
        - protocol: TCP
          port: 8095
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: collector
              app.kubernetes.io/instance: dev-health
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 8096
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The auth database, and nothing else
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
              app.kubernetes.io/instance: dev-health
              app.kubernetes.io/name: ops
      ports:
        - protocol: TCP
          port: 5432
    # The shared rate-limit store, and nothing else
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: valkey
              app.kubernetes.io/instance: dev-health
              app.kubernetes.io/name: ops
      ports:
        - protocol: TCP
          port: 6379
    # The OTLP/gRPC trace collector, and nothing else
    - to:
        - ipBlock:
            cidr: 10.0.0.151/32
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: collector
              app.kubernetes.io/instance: dev-health
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317

