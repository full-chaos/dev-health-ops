name: Docs Guards

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/validate_docs_v2_publication.py'
      - 'scripts/check_built_site_links.py'
      - 'scripts/check_docs_candidate_search.py'
      - 'scripts/check_docs_candidate_accessibility.py'
      - 'scripts/check_docs_candidate_facts.py'
      - 'docs-data/**'
      - '.github/workflows/docs-guards.yml'
      - 'internal/jobs/workgraph/units/taxonomy.go'
      - 'deploy/go-workers/deployment.json'
      - 'contracts/jobs/v1/registry.json'
      - 'contracts/jobs/v1/migration-state.json'
      - 'internal/cigates/docstools/**'
      - 'cmd/cigate/**'
  pull_request:
    branches: ['**']
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/validate_docs_v2_publication.py'
      - 'scripts/check_built_site_links.py'
      - 'scripts/check_docs_candidate_search.py'
      - 'scripts/check_docs_candidate_accessibility.py'
      - 'scripts/check_docs_candidate_facts.py'
      - 'docs-data/**'
      - '.github/workflows/docs-guards.yml'
      - 'internal/jobs/workgraph/units/taxonomy.go'
      - 'deploy/go-workers/deployment.json'
      - 'contracts/jobs/v1/registry.json'
      - 'contracts/jobs/v1/migration-state.json'
      - 'internal/cigates/docstools/**'
      - 'cmd/cigate/**'
  merge_group:
  workflow_dispatch:

concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed):
  # canonical fleet-wide shape -- group by PR number on pull_request, by
  # ref on a push to a non-main branch, by commit sha on a push to main or
  # on merge_group (a commit sha never collides with another commit's, so
  # main pushes and merge_group entries are never cancelled -- see
  # go.yml/typecheck.yml/docker-images.yml/arc-runner-image.yml for the
  # specific incidents this protects). cancel-in-progress cancels a stale
  # PR re-push and a stale non-main branch push only.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  docs-guards:
    name: docs-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate publication inventory and IA placement
        run: |
          mkdir -p .build
          set -o pipefail
          python scripts/validate_docs_v2_publication.py \
            2>&1 | tee .build/docs-publication-validation.log

      - name: Strict canonical build
        run: |
          set -o pipefail
          python -m mkdocs build --strict --config-file mkdocs.yml \
            2>&1 | tee .build/docs-build.log

      - name: Check rendered links, anchors, and assets
        run: |
          set -o pipefail
          python scripts/check_built_site_links.py \
            --site-dir .build/docs \
            2>&1 | tee .build/docs-links.log

      - name: Check task-based search acceptance
        run: |
          set -o pipefail
          python scripts/check_docs_candidate_search.py \
            --site-dir .build/docs \
            --queries docs-data/search-acceptance.json \
            2>&1 | tee .build/docs-search.log

      - name: Check structural accessibility invariants
        run: |
          set -o pipefail
          python scripts/check_docs_candidate_accessibility.py \
            --site-dir .build/docs \
            --css docs/stylesheets/extra.css \
            2>&1 | tee .build/docs-accessibility.log

      - name: Check objective documentation facts
        run: |
          set -o pipefail
          python scripts/check_docs_candidate_facts.py \
            2>&1 | tee .build/docs-facts.log

      # CHAOS-3514 (chris ruling: gate the scripts, keep the tests). These two
      # guards had unit tests in tests/docs but their SCRIPTS ran only from
      # Makefile targets -- never in CI -- so the property each enforces was
      # unguarded on every PR. Both take repo-relative defaults and need no
      # inputs CI lacks, which is why they can be wired honestly here; the
      # user-guide-evidence validator cannot and is reported separately
      # rather than invoked against a fabricated corpus.
      - name: Check code prerequisites
        run: |
          set -o pipefail
          python scripts/check_code_prerequisites.py \
            2>&1 | tee .build/docs-code-prerequisites.log

      - name: Check freshness inventory
        run: |
          set -o pipefail
          python scripts/check_freshness_inventory.py \
            2>&1 | tee .build/docs-freshness-inventory.log

      - name: Upload documentation quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-quality-evidence
          path: |
            .build/docs-*.log
            .build/docs-*.tsv
            .build/docs-*.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  docs-drift:
    # The generated docs blocks must match the Go taxonomy and the Go worker producers. A light job: Go only, no
    # Python, so a docs-only change runs these two checks without the Go workflow's full fan-out.
    name: docs-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Check the investment taxonomy docs against the Go taxonomy
        run: go run -trimpath -mod=readonly ./cmd/cigate docs check-investment-drift

      - name: Check the queue-mapping docs against the Go worker producers
        run: go run -trimpath -mod=readonly ./cmd/cigate docs check-queue-mapping-drift
