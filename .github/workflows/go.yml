name: Go

on:
  push:
    branches: ['**']
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'contracts/jobs/v1/**'
      - 'deploy/go-workers/**'
      - 'src/dev_health_ops/licensing/**'
      - 'src/dev_health_ops/metrics/testops*.py'
      - 'src/dev_health_ops/models/**'
      - 'src/dev_health_ops/parsers/**'
      - 'src/dev_health_ops/processors/**'
      - 'src/dev_health_ops/providers/**'
      - 'src/dev_health_ops/storage/repository_rows.py'
      - 'src/dev_health_ops/sync/**'
      - 'src/dev_health_ops/workers/job_contracts/**'
      - 'internal/providersync/testdata/**'
      - 'internal/scheduler/sync/testdata/**'
      - 'tests/workers/job_contracts/**'
      - 'docker/go-worker.Dockerfile'
      - 'tests/compatibility/river/**'
      - 'ci/check_go.sh'
      - 'ci/go_integration_shards.tsv'
      - 'ci/go_providersync_test_shards.tsv'
      - 'ci/requirements-live-python-oracles.txt'
      - 'ci/check_go_containers.sh'
      - 'ci/check_river_compat_static.sh'
      - 'ci/evidence/go-worker-migration/**'
      # - 'ci/local_validate.sh'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/go.yml'
  pull_request:
    branches: ['**']
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'contracts/jobs/v1/**'
      - 'deploy/go-workers/**'
      - 'src/dev_health_ops/licensing/**'
      - 'src/dev_health_ops/metrics/testops*.py'
      - 'src/dev_health_ops/models/**'
      - 'src/dev_health_ops/parsers/**'
      - 'src/dev_health_ops/processors/**'
      - 'src/dev_health_ops/providers/**'
      - 'src/dev_health_ops/storage/repository_rows.py'
      - 'src/dev_health_ops/sync/**'
      - 'src/dev_health_ops/workers/job_contracts/**'
      - 'internal/providersync/testdata/**'
      - 'internal/scheduler/sync/testdata/**'
      - 'tests/workers/job_contracts/**'
      - 'docker/go-worker.Dockerfile'
      - 'tests/compatibility/river/**'
      - 'ci/check_go.sh'
      - 'ci/go_integration_shards.tsv'
      - 'ci/go_providersync_test_shards.tsv'
      - 'ci/requirements-live-python-oracles.txt'
      - 'ci/check_go_containers.sh'
      - 'ci/check_river_compat_static.sh'
      - 'ci/evidence/go-worker-migration/**'
      # - 'ci/local_validate.sh'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/go.yml'
  merge_group:
  workflow_dispatch:
  # CHAOS-3948 turned `push` off (see the concurrency block below for why)
  # and added this scheduled run against main's HEAD (`schedule` always
  # targets the default branch) as a fixed-cost, one-fan-out-a-day backstop
  # so main still got some Go CI between merges. Push is enabled again above
  # (owner-ratified), scoped to all branches like `pull_request`, so a
  # branch with no open PR also gets gate coverage; this schedule stays as a
  # cheap safety net regardless. `workflow_dispatch` above also gives a
  # one-click way to run the full matrix against main on demand.
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PR runs cancel their predecessor so fast-follow pushes don't queue behind
  # a stale diff, which bounds this workflow to ONE live fan-out per PR --
  # ~13 jobs, several at a 25-minute cap.
  #
  # merge_group runs must not be cancelled: a burst of merges lands several
  # within the same `github.ref` group in quick succession, and with an
  # unconditional cancel-in-progress every one but the last gets cancelled
  # before go-storage-integration finishes — so most merges never get a real
  # pass/fail, only "cancelled". integration.yml (push-to-main integration
  # suite) already sets cancel-in-progress: false for the same reason;
  # docs-cloudflare.yml uses this same event-conditional pattern. The same
  # applies to `on.push`: it is the one trigger here that cannot be
  # cancelled AND fires per-commit -- CHAOS-3948 turned it off because that
  # combination exhausted the org's Actions concurrency. It is enabled again
  # (owner-ratified), scoped by the same path filter `pull_request` uses, so
  # this risk is worth watching rather than a solved problem.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # CHAOS-4676: `push` (scoped to all branches, for coverage when a branch
  # has no open PR — see the `schedule` comment above) and `pull_request`
  # both trigger on every push to a PR branch, same SHA, racing each other
  # for capacity and producing two same-name check runs a rollup reader
  # can't tell apart (one FAILURE while the other is still running or
  # already `success`; this made two same-commit contentions read as
  # ambiguous "is CI green" answers on 2026-08-31, and manufactured at least
  # one integration timing flake by doubling the suite's concurrent load).
  #
  # This job makes the choice explicit instead: a `push` run on a branch
  # that already has an open PR is redundant, because the `pull_request` run
  # on the identical commit is authoritative, so every substantive job below
  # is stopped for that case. Post-merge pushes to main (which never have an
  # open PR with that head) are unaffected and keep running for real.
  #
  # `go-quality` (the one required check in this family — confirmed against
  # the live `main` ruleset) is handled differently from every other job
  # here: it has NO `if:` skip. A job skipped via `if:` still records a
  # "skipped" check run under its own name, and GitHub treats "skipped" as
  # PASSING for a required status check (same mechanism `go-quality-noop.yml`
  # relies on deliberately for non-Go PRs) — for a REDUNDANT run that would
  # let the superseded push run's skip satisfy `go-quality` before the real
  # pull_request run's `go-quality` has finished. A codex review of this PR
  # observed exactly that window live: the push run's `go-quality` reported
  # `skipped` at 17:18:34 while the authoritative pull_request run's
  # `go-quality` did not complete until 17:24:54. So instead of `if:`,
  # `go-quality` is stopped by the run-level cancellation below, whose
  # conclusion is `cancelled` — a status required-check evaluation does
  # NOT treat as passing.
  #
  # Replacement for the flake-control this removes (ticket comment,
  # 2026-08-31): the duplicate run had started serving as an unintended
  # same-commit control — twice in one day, "the other run passed on
  # identical code" made an infra flake provable rather than merely
  # suspected. That diagnostic goes away with the duplicate. The deliberate
  # replacement: a suspected infra flake on a required check gets an
  # EXPLICIT rerun of just that job (`gh run rerun <run-id> --job <job-id>`,
  # runs enumerated by full 40-char SHA per the ticket's CI-verdict rules),
  # not a second full fan-out. Slower, and it costs the "simultaneous pass
  # on identical code" evidence, but it does not reintroduce the capacity
  # waste or the ambiguous rollup this ticket exists to remove.
  #
  # Proved live on PR #2050's own tip: a push while no PR was open ran for
  # real (33418461163); once the PR existed, this second push's `push` run
  # is superseded (guard skip=true) while its `pull_request` run is the sole
  # authoritative one — see the PR body / merge note for the cited run ids.
  #
  # TOCTOU (codex round 3, CHAOS-4676): the above only covers a push that
  # arrives AFTER a PR is already open. The reverse order is also live and
  # was proved on this PR's own FIRST commit: push commit C while the
  # branch has no open PR → guard correctly runs for real (skip=false, its
  # only coverage) → `gh pr create` opens the PR at that same C with NO new
  # push → the `pull_request` guard's non-push fast path unconditionally
  # returned skip=false, so a second real run started on the identical SHA
  # (push run 33418461163 + pull_request run 33418491525, both real, both
  # on 397cc5ab1325b323c9a0b44da5f47abf9defc955). The fix mirrors the
  # push-side cancellation from the other direction: a `pull_request` run
  # always proceeds (it is the authoritative event per this design), but
  # first cancels any still-active `push`-triggered run it finds at the
  # identical head SHA, closing the window instead of racing it.
  # `merge_group`/`workflow_dispatch`/`schedule` are unaffected — none of
  # them are reachable from the proved scenario (a same-SHA `push` racing a
  # same-SHA `pull_request` open/reopen).
  #
  # Confirm-or-fail-loudly (codex round 4, CHAOS-4676): the cross-run cancel
  # above was originally best-effort (`|| true`), with nothing checking
  # whether it actually landed — the same silent-failure shape as the
  # already-fixed finding on the push-side cancel, except round 2's fix for
  # THAT (go-quality's self-abort backstop) does not cover this path: it
  # only fires when a run's OWN guard.skip output is 'true', and the stale
  # push run's own skip output was legitimately 'false' when it started
  # (correct at push time, before the PR existed) — it can never self-abort
  # via that mechanism. Silently proceeding on an unconfirmed cancel would
  # reintroduce the exact double-real-run problem this ticket exists to
  # remove, just gated behind "cancel failed" instead of "always" — and
  # this ticket's own standing bar is no fail-open without telemetry. So
  # this path now polls the cancelled run to a terminal state (bounded
  # wait) and, if the lookup or cancel or that confirmation fails, sets
  # `stale_push_unconfirmed=true` naming the run id in the log. `go-quality`
  # (below) fails deliberately, not skips, when that output is true — same
  # pattern as the skip=true backstop, so this can never read as a pass.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
      actions: write # to cancel this run (or a stale peer) when superseded
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      stale_push_unconfirmed: ${{ steps.check.outputs.stale_push_unconfirmed }}
    steps:
      - name: Decide whether this push run is superseded by an open PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # TOCTOU close (codex round 3, CHAOS-4676 — see the job-family
            # comment above): this run is always authoritative and always
            # proceeds, but first cancels any still-active `push`-triggered
            # run at the IDENTICAL head SHA, so a push-then-PR-open/reopen
            # at one commit can never leave two real runs live on it.
            #
            # Confirm-or-fail-loudly (round 4 finding, see job-family
            # comment above): every failure branch below sets
            # stale_push_unconfirmed=true and names the run id, instead of
            # silently proceeding. go-quality turns that into a real
            # failure, never a skip.
            stale_unconfirmed=false
            if ids=$(gh api --method GET -f event=push -f "head_sha=${PR_HEAD_SHA}" "repos/${REPO}/actions/workflows/go.yml/runs" --jq '[.workflow_runs[] | select(.status != "completed") | .id] | .[]' 2>/tmp/guard-supersede.err); then
              for id in ${ids}; do
                echo "cancelling superseded same-SHA push run ${id} (this pull_request run is authoritative)" >&2
                if ! gh api --method POST "repos/${REPO}/actions/runs/${id}/cancel" >/tmp/guard-cancel-"${id}".err 2>&1; then
                  echo "cancel POST for stale push run ${id} FAILED: $(cat /tmp/guard-cancel-"${id}".err)" >&2
                  stale_unconfirmed=true
                  continue
                fi
                # Bounded poll (~30s) for the cancel to actually land —
                # "completed" is the only terminal `status` value; do not
                # trust the cancel POST's 202 Accepted on its own.
                confirmed=false
                for _ in 1 2 3 4 5 6; do
                  run_status=$(gh api "repos/${REPO}/actions/runs/${id}" --jq '.status' 2>/dev/null || echo "")
                  if [ "${run_status}" = "completed" ]; then
                    confirmed=true
                    break
                  fi
                  sleep 5
                done
                if [ "${confirmed}" != "true" ]; then
                  echo "stale push run ${id} did NOT reach a terminal state within the bounded wait after cancel; cannot confirm it stopped" >&2
                  stale_unconfirmed=true
                fi
              done
            else
              echo "same-SHA push-run lookup FAILED, cannot confirm no stale run is live: $(cat /tmp/guard-supersede.err)" >&2
              stale_unconfirmed=true
            fi
            echo "stale_push_unconfirmed=${stale_unconfirmed}" >> "${GITHUB_OUTPUT}"
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${EVENT_NAME}" != "push" ]; then
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          owner="${REPO%%/*}"
          # `-f` query params are URL-encoded by `gh api` itself. Hand-built
          # URL interpolation (an earlier form) silently mis-sends a branch
          # name containing `#`/`&`/space, which would miss a real open PR
          # and let the duplicate run through — found by codex review.
          # `--method GET` is NOT optional: `gh api` defaults to POST the
          # instant any `-f`/`-F` field is present, which 404/422s against
          # a list endpoint — codex EXECUTED this exact break in round 2,
          # and the resulting error silently fell through the fail-open
          # path below, defeating the guard on every push to an open PR.
          if ! count=$(gh api --method GET -f state=open -f "head=${owner}:${BRANCH}" "repos/${REPO}/pulls" --jq 'length' 2>/tmp/guard-gh-api.err); then
            # Fail OPEN, not closed (codex review, CHAOS-4676): an API
            # hiccup must never silently cost this branch its only real Go
            # coverage, and must never leave `go-quality` unrun on the one
            # push run that would have supplied it.
            echo "gh api lookup failed, defaulting to skip=false (run for real): $(cat /tmp/guard-gh-api.err)" >&2
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${count:-0}" -gt 0 ]; then
            echo "skipping: branch '${BRANCH}' has ${count} open PR(s); the pull_request run on this SHA is authoritative" >&2
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            # Cancel the run itself rather than leaving `go-quality` to an
            # `if:` skip (see the job-family comment above for why: a
            # skipped `go-quality` reports as a passing required check).
            # Best-effort: this step has already written its output, so a
            # failure here does not change the skip/run decision.
            gh api --method POST "repos/${REPO}/actions/runs/${RUN_ID}/cancel" >/dev/null 2>&1 || true
          else
            echo "running: branch '${BRANCH}' has no open PR; this push run provides its only gate coverage" >&2
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

  go-quality:
    # No `if:` skip here — see the job-family comment on `guard` above.
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Defense in depth (codex round 2, CHAOS-4676): guard's run-level
      # cancellation is best-effort (`|| true` — a failed cancel API call
      # must not fail guard itself, since guard has already written its
      # output). If that cancel is slow or fails, this job would otherwise
      # start for real on a superseded push run with nothing to stop it.
      # This step is a second, non-race-dependent backstop: it runs FIRST,
      # before any expensive setup, and deliberately FAILS (not skips) when
      # guard already decided this run is redundant — a failure conclusion
      # does not satisfy a required check, so it can never be mistaken for
      # a pass, unlike a skip.
      - name: Abort if this run was superseded by an open PR
        if: needs.guard.outputs.skip == 'true'
        run: |
          echo "guard determined this push run is superseded by an open PR;" >&2
          echo "the pull_request run on this SHA is authoritative. Failing" >&2
          echo "deliberately (not skipping) so this can never read as a pass." >&2
          exit 1

      # Same pattern, other direction (codex round 4, CHAOS-4676): this is
      # the `pull_request` run itself. guard could not CONFIRM that a stale
      # same-SHA `push` run it found was actually cancelled (lookup failed,
      # cancel POST failed, or the run never reached a terminal state within
      # the bounded wait — see guard's job-family comment). Proceeding
      # silently risks two authoritative go-quality reports on one SHA —
      # exactly this ticket's defect. Failing loudly here, rather than the
      # stale run's own (already-known-uncertain) fate, is the one outcome
      # this run can actually guarantee: a visible, correctly-attributed red
      # that names the cause, instead of a quiet ambiguous rollup.
      - name: Abort if a superseded push run could not be confirmed cancelled
        if: needs.guard.outputs.stale_push_unconfirmed == 'true'
        run: |
          echo "guard could not confirm that a stale same-SHA push run was" >&2
          echo "actually cancelled (CHAOS-4676 finding #7). Failing" >&2
          echo "deliberately rather than risk two authoritative go-quality" >&2
          echo "runs on one SHA; see this run's guard job log for the run id." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Set up Python 3.13.14 for live provider oracles
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Install locked live provider oracle dependencies
        run: python -m pip install --no-deps -r ci/requirements-live-python-oracles.txt

      - name: Prepare base job contracts
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          if ! git cat-file -e "${BASE_SHA}:contracts/jobs/v1" 2>/dev/null; then
            echo "No v1 job contracts exist on the merge base; validating the additive tree only."
            exit 0
          fi
          base_dir="${RUNNER_TEMP}/job-contract-base"
          mkdir -p "${base_dir}"
          git archive "${BASE_SHA}" contracts/jobs/v1 | tar -x -C "${base_dir}"
          echo "DEV_HEALTH_CONTRACT_BASE=${base_dir}/contracts/jobs/v1" >> "${GITHUB_ENV}"

      - name: Run Go quality gate
        # `ci`, not `all`: CHAOS-3948 made `all` genuinely execute the full
        # unsharded integration suite (~24m measured) instead of only
        # planning it, which this job's 20m timeout cannot absorb and would
        # duplicate the coverage the separate go-storage-integration-plan/
        # -shard jobs below already provide, sharded and parallel. `ci` is
        # byte-for-byte what this step ran before CHAOS-3948.
        run: bash ci/check_go.sh ci

      - name: Validate River compatibility harness
        run: bash ci/check_river_compat_static.sh

  go-storage-integration-plan:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Validate and emit deterministic integration shards
        id: plan
        run: bash ci/check_go.sh integration-shard-plan

  go-storage-integration-shard:
    name: go-storage-integration-shard-${{ matrix.target }}-${{ matrix.shard }}
    needs: [guard, go-storage-integration-plan]
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.go-storage-integration-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      # The derived work-item integration tests migrate their throwaway
      # ClickHouse container with the project's REAL migration chain
      # (internal/testsupport/chschema), which shells out to Python. This job
      # previously installed no Python dependencies at all, so that helper died
      # with ModuleNotFoundError. The closure is pinned and installed with
      # --no-deps for the same reason go-quality's is: an undeclared dependency
      # must fail loudly rather than drift to latest.
      - name: Set up Python 3.13.14 for the ClickHouse migration chain
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Install locked ClickHouse migration dependencies
        run: python -m pip install --no-deps -r ci/requirements-clickhouse-migrations.txt

      - name: Pre-pull pinned ClickHouse image with bounded retry
        run: bash ci/check_go.sh integration-prepull

      - name: Run isolated storage integration shard ${{ matrix.target }} ${{ matrix.shard }}
        run: bash ci/check_go.sh integration-shard "${{ matrix.target }}" "${{ matrix.shard }}"

  # Preserve the existing required-check contract while the implementation
  # fans out behind it. fail-fast is disabled above, so this job observes the
  # aggregate result only after every shard has reached a terminal state.
  go-storage-integration:
    name: go-storage-integration
    if: ${{ needs.guard.outputs.skip != 'true' && always() }}
    needs:
      - guard
      - go-storage-integration-plan
      - go-storage-integration-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLAN_RESULT: ${{ needs.go-storage-integration-plan.result }}
      SHARD_RESULT: ${{ needs.go-storage-integration-shard.result }}
    steps:
      - name: Require the plan and every integration shard to pass
        run: |
          set -euo pipefail
          if [ "${PLAN_RESULT}" != "success" ] || [ "${SHARD_RESULT}" != "success" ]; then
            echo "integration plan result: ${PLAN_RESULT}" >&2
            echo "integration shard aggregate result: ${SHARD_RESULT}" >&2
            exit 1
          fi
          echo "all deterministic Go integration shards passed"

  go-container-smoke:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and smoke Go images
        run: bash ci/check_go_containers.sh smoke

  go-container-security:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [worker, scheduler, reconciler, stream-runner, operator, contractcheck, migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.target }} security image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker build \
            --file docker/go-worker.Dockerfile \
            --target "${TARGET}" \
            --build-arg VERSION=phase1-ci \
            --build-arg COMMIT=0000000000000000000000000000000000000000 \
            --build-arg BUILD_TIME=1970-01-01T00:00:00Z \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --tag "dev-health-go-${TARGET}:security" \
            .

      - name: Generate ${{ matrix.target }} SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: dev-health-go-${{ matrix.target }}:security
          format: spdx-json
          artifact-name: go-${{ matrix.target }}-sbom.spdx.json
          syft-version: v1.42.3
          dependency-snapshot: false
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Scan ${{ matrix.target }} for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dev-health-go-${{ matrix.target }}:security
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          version: v0.70.0

  go-container-reproducibility:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify reproducible Go images
        run: bash ci/check_go_containers.sh reproducible

  river-compatibility:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Set up Python 3.13.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Install pinned Python compatibility dependencies
        run: >-
          python -m pip install
          asyncpg==0.31.0
          greenlet==3.5.0
          riverqueue==0.7.0
          SQLAlchemy==2.0.49

      - name: Run live River compatibility matrix
        env:
          RIVER_COMPAT_PYTHON: python
        run: |
          tests/compatibility/river/run.sh > "${RUNNER_TEMP}/river-compatibility.json"
          jq -e '
            .status == "complete_with_architecture_blocker"
            and .nested_n_minus_1.status == "pass"
            and [.profiles[].mode] == ["direct", "poll-only", "session"]
            and (.gate_truth_table | keys) == ["direct", "poll_only", "session"]
          ' "${RUNNER_TEMP}/river-compatibility.json" >/dev/null

      - name: Upload sanitized compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: river-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/river-compatibility.json
          if-no-files-found: ignore
          retention-days: 14
