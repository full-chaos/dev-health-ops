name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

concurrency:
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed):
  # canonical fleet-wide shape -- group by PR number on pull_request, by
  # ref on a push to a non-main branch, by commit sha on a push to main or
  # on merge_group (a commit sha never collides with another commit's, so
  # main pushes and merge_group entries are never cancelled -- see
  # go.yml/typecheck.yml/docker-images.yml/arc-runner-image.yml for the
  # specific incidents this protects). cancel-in-progress cancels a stale
  # PR re-push and a stale non-main branch push only.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  changes:
    # Routed to the self-hosted ARC pool while GitHub-hosted dispatch is
    # stalled (org plan change, 2026-09-04; chris ruling 16:54 PDT). Flip the
    # repo variable SELF_HOSTED_RUNNERS back to 'disabled' to restore the
    # hosted runner with no code change. Fork PRs always stay hosted -- same
    # safety condition as go.yml's dual-leg jobs.
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # Always run on workflow_dispatch
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              # CHAOS-3513: omitting this put an unlinted, untypechecked
              # change into main. In merge_group runs 30597898813 and
              # 30597912205 the only file in the queue's diff was
              # .github/workflows/governance.yml, so the filter reported
              # code=false, the gated job skipped, and the required check
              # reported SUCCESS. The gates could be edited -- weakened --
              # by a PR they then declined to run on.
              - '.github/workflows/**'
              - 'src/**'
              # Inputs that decide what these tools LOOK AT, not just how
              # they behave. ruff honours .gitignore/.ignore for file
              # discovery: appending `src/` to .gitignore drops its file set
              # from 1045 source files to 0, and `ruff check` still exits 0 --
              # a green required check that inspected nothing. ruff.toml /
              # .ruff.toml and mypy.ini / .mypy.ini / setup.cfg are config
              # files these tools discover by default; none exists today, and
              # a PR ADDING one would not have matched this filter, so the
              # gate would have skipped on the very change that redefined it
              # (CHAOS-3513 Codex round 1, same shape as the workflow-file
              # omission above).
              - '.gitignore'
              - '.ignore'
              - 'ruff.toml'
              - '.ruff.toml'
              - 'mypy.ini'
              - '.mypy.ini'
              - 'setup.cfg'
              - 'tests/**'
              - 'ci/**'
              - 'migrations/**'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/**'

  lint-job:
    needs: [changes]
    # dorny/paths-filter has no PR base/head diff to compute in the merge
    # queue and can report code=false there, which would skip this job and
    # let the aggregator see a skip it cannot attribute. Always run in the
    # queue, as test.yml's test-matrix already does.
    if: >-
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.code == 'true'
    # Same ARC routing as `changes` above.
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    # Lint job needs package read access for dependency installs.
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CHAOS-6646: install EXACTLY uv.lock's resolution (same class as
      # CHAOS-6588/6589): `pip install -r requirements.txt` (`-e .[dev]`)
      # re-resolves pyproject.toml against PyPI on every run and never reads
      # uv.lock, so an upstream release can change the tested set with no
      # diff. `uv sync --frozen` also FAILS if the lock is stale relative to
      # pyproject.toml.
      # ruff comes from the lock too (uv.lock pins 0.16.5, the version this
      # step used to install by hand).
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras --dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Before the two steps whose exit status IS the `lint` gate: prove ruff
      # still has something to check. Over an empty file set `ruff check .`
      # exits 0, so a swallowed tree reads as a clean gate (CHAOS-3513).
      - name: Check lint scope
        run: |
          chmod +x ci/check_lint_scope.sh
          ./ci/check_lint_scope.sh

      - name: Run ruff (format check)
        run: |
          ruff format --check .

      - name: Run ruff (linting)
        run: |
          ruff check .

  # Required-status-check gate. Branch protection requires a check named
  # exactly "lint"; the job above is named "lint-job", which does not
  # match. Do not remove.
  #
  # The verdict lives in ci/aggregate_gate_results.sh, shared with test.yml
  # and typecheck.yml, so one table-driven test covers all three gates. It
  # reads `needs.changes.result` because a skip caused by a dead upstream and
  # a skip caused by the path filter are the same literal string
  # (CHAOS-3482, CHAOS-3513).
  lint:
    name: lint
    # Must remain `always()`. Under `!cancelled()` (or any condition that lets
    # this job itself skip) a cancelled run leaves the REQUIRED check *skipped*,
    # and branch protection counts a skipped required check as satisfied --
    # which moves the silent pass one level up instead of closing it.
    if: always()
    needs: [changes, lint-job]
    # Same ARC routing as `changes` above.
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '') || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aggregate lint result
        env:
          GATE_NAME: lint
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          GATED_JOB_1: lint-job|path-filtered|${{ needs.lint-job.result }}
        run: |
          chmod +x ci/aggregate_gate_results.sh
          ./ci/aggregate_gate_results.sh
