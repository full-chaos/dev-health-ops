query ImproveOpportunities($scope: AIScopeInput, $limit: Int! = 10, $windowDays: Int! = 30) {
  improveOpportunities(scope: $scope, limit: $limit, windowDays: $windowDays) {
    orgId
    detectorReady
    totalCount
    opportunities {
      opportunityId
      kind
      entityType
      entityId
      title
      rationale
      score
      severity
      evidenceRefs
      recommendedAction
      __typename
    }
    __typename
  }
}