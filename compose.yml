      COORDINATOR_DATABASE_URI: ""
    stop_grace_period: 60s

  # PagerDuty webhook delivery is independently routable from dataset sync,
  # so it runs as its own stream family rather than sharing the external
  # runner.
  go-stream-pagerduty:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_STREAM_RUNNER_IMAGE:-ghcr.io/full-chaos/dev-health-go-stream-runner:latest}
    pull_policy: ${DEV_HEALTH_GO_STREAM_RUNNER_PULL_POLICY:-build}
