    command:
      - stream-runner
      - --profile=pagerduty
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
    environment:
      <<: [*go-worker-no-coordinator, *go-worker-env-base]
      # Not a River-queue consumer, no coordinator-claim path: the stream
      # runner opens the domain pool only. All four coordinator values are
      # blank (see x-go-worker-no-coordinator), never HOST alone.
    stop_grace_period: 60s

  # ---------------------------------------------------------------------------
  # Observability — SigNoz (distributed tracing + metrics)
  # ---------------------------------------------------------------------------
  # Run SigNoz separately from its own compose file:
  #   git clone https://github.com/SigNoz/signoz.git && cd signoz/deploy
  #   docker compose -f docker/clickhouse-setup/docker-compose.yaml up -d
  #
  # Then connect each plane of this stack to SigNoz's network (the names
  # `docker compose ps` shows for go-api and query-api):
  #   docker network connect clickhouse-setup_default dev-health-ops-go-api-1
  #   docker network connect clickhouse-setup_default dev-health-ops-query-api-1
  #
  # UI:         http://localhost:8080  (from SigNoz stack)
  # OTLP gRPC:  signoz-otel-collector:4317
  # OTLP HTTP:  signoz-otel-collector:4318
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Observability — BugSink (error tracking / Sentry-compatible)
  # ---------------------------------------------------------------------------
  # Web UI: http://localhost:8800
  # Single container, uses the existing postgres (database: bugsink).
  # Set SENTRY_DSN to a project DSN from the BugSink UI to enable error
  # reporting — the Sentry SDK sends events to BugSink transparently.
  # ---------------------------------------------------------------------------
  bugsink:
    image: bugsink/bugsink:latest
    container_name: bugsink
    restart: unless-stopped
    environment:
      # Class sweep over the whole file, not only the knob found: connects as the postgres superuser, whose
      # credentials are now overridable at the server (above) -- the
      # `bugsink` DATABASE NAME stays a literal on purpose (its own fixed
      # sibling database, unrelated to POSTGRES_DB).
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/bugsink"
      SECRET_KEY: ${BUGSINK_SECRET_KEY:?BUGSINK_SECRET_KEY must be set}
      BASE_URL: ${BUGSINK_BASE_URL:-http://localhost:8800}
      PORT: "8000"
      CREATE_SUPERUSER: ${BUGSINK_CREATE_SUPERUSER:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8800:8000"
