        fi;
        dev-health-worker-migrate
        && dev-health-worker-migrate --check
    environment:
      MIGRATION_DATABASE_URI: ${GO_WORKER_MIGRATION_DATABASE_URI:-}
      # codex review (r1, P1): same fix as go-river-provision above -- the
      # root `postgres` service's superuser identity is postgres/postgres,
      # not `devhealth`.
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      # codex review (r4, P1): this service never forwarded the coordinator
      # role/password, unlike go-river-provision just above it -- overriding
      # RIVER_COORDINATOR_DATABASE_ROLE away from its default then failed
      # migration ("River schema or privilege policy was not applied") since
      # dev-health-worker-migrate applied the privilege policy against the
      # unexported default name instead. The deleted
      # deploy/go-workers/compose-go-workers.yml overlay forwarded this.
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
    depends_on:
      go-river-provision:
        condition: service_completed_successfully

  # Validate the exact checked-in job registry and worker manifest before
  # Compose is allowed to start any long-running Go process.
  go-contractcheck:
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: contractcheck
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    command: [validate]
    depends_on:
      go-river-migrate:
        condition: service_completed_successfully

  # R98 (chris, 2026-09-10): on a fresh Go-default bring-up, the four
  # sync-dispatch "frozen kinds" alembic migration 0049 seeds are assigned
  # transport `celery` -- the reconciler's `sync_dispatch_route_fence`
  # readiness check (internal/syncroute.Fence.Check) correctly refuses
  # readiness on that drift, since nothing actually consumes Celery
  # anymore. Folded in from the proven design already running the shared
  # bigboy stack (compose/compose.go.workers.yml, untracked, outside this
  # repository): `dev-health-workerctl` mints and uses an audited operator
  # credential to flip each kind to `river`, the exact reference
  # implementation option (a) names. This is the default for THIS file;
  # `sync.provider_unit`'s own canary-route activation (the fifth
  # `job-routes apply` the bigboy overlay also runs) is NOT folded in --
  # that promotion is chris's separate, already-tracked decision, not a
  # compose default.
  #
  # dev-health-workerctl authenticates its very first database action (the
  # operator token) against `internal_service_credentials` -- there is no
  # Go-native way to mint that row, so this one-shot reuses the existing
  # Python CLI command the bigboy overlay also uses
  # (`service-credentials create`), same local build as `migrate`/`worker`
  # above. Idempotent by construction: it only mints a token when the
  # shared volume file is empty.
  go-worker-operator-credential:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: runner
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: "no"
    read_only: true
    # codex proof (executed): Docker creates a named volume's mount point
    # root:root, so the usual 65532:65532 non-root user this file's other
    # one-shot steps run as cannot write the token file into it at all
    # ("Permission denied" -- reproduced, then fixed). Matches the bigboy
    # overlay's own `user: "0:0"` for this exact service; the minted file
    # is chown'd to 65532:65532 and chmod 0400 below, so the route-activate
    # chain (which mounts this volume read-only as that same non-root user)
    # can read it, but nothing else can. codex proof (executed, three
    # rounds): dropping every capability (this file's usual one-shot
    # convention) made even uid 0 fail "Operation not permitted" on, in
    # order, the initial file create (needs DAC_OVERRIDE -- a dropped-
    # capability root does not bypass permission bits the way an
    # unconstrained root does), `chown` (needs CHOWN), and `chmod` of the
    # now-non-root-owned file (needs FOWNER) -- reproduced and fixed each
    # time. Add back only those three rather than keep every root
    # capability, which is what the bigboy overlay's own version of this
    # service does instead.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      <<: *env
    entrypoint:
      - /bin/sh
      - -ec
      - |
        token=/run/go-worker-operator/token
        if [ ! -s "$$token" ]; then
          umask 077
          dev-hops service-credentials create \
            --service worker-operator \
            --scope workers:read \
            --scope workers:operate > "$$token.tmp"
          chown 65532:65532 "$$token.tmp"
          chmod 0400 "$$token.tmp"
          mv "$$token.tmp" "$$token"
        fi
    volumes:
      - go_worker_operator_token:/run/go-worker-operator
    depends_on:
      migrate:
        condition: service_completed_successfully

  go-sync-dispatch-route-activate:
    <<: *go-worker-route-activate
    command:
      - routes
      - apply
      - --reason
      - local_compose_start
      - --correlation-id
      - local-compose-dispatch-sync-run
      - dispatch_sync_run

  go-sync-finalize-route-activate:
    <<: *go-worker-route-activate
    command:
      - routes
      - apply
      - --reason
      - local_compose_start
      - --correlation-id
      - local-compose-finalize-sync-run
      - finalize_sync_run
    depends_on:
      # The operator intentionally permits one audited mutation at a time --
      # serialize the four route changes rather than race its advisory lock
      # with four parallel one-shot containers.
      go-sync-dispatch-route-activate:
        condition: service_completed_successfully
      go-worker-operator-credential:
        condition: service_completed_successfully
      go-river-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy

  go-sync-post-route-activate:
    <<: *go-worker-route-activate
    command:
