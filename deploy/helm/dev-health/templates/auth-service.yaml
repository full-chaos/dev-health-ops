{{- /*
The Auth Control Plane service (CHAOS-4886, Wave 1 of CHAOS-3274): `auth-service`
from the auth-service image (docker/go-worker.Dockerfile target `auth-service`).
DORMANT: the API listener mounts no route, no production token is issued, and
nothing routes to it. Defaults off; removing it (authService.enabled=false) has
no effect on the current auth authority.

Two listeners, never one: the API listener (authService.port) carries requests,
the operator listener (authService.operatorPort) carries /healthz, /readyz and
/metrics. Probes target the operator port. /readyz fails CLOSED on the
`postgres` and `signing_key` checks, re-run on every request.

Secrets are referenced, never created here (see values.yaml). The runtime DSN
reaches the container by secretKeyRef; the signing key reaches it only as a
file (a direct-value AUTH_SIGNING_KEY is rejected by the service,
ACP-ADR-02 §4). The key's custody contract (O_NOFOLLOW, regular file, no
group/world mode bit) cannot be met by mounting the Secret straight into the
container -- see authService.signingKey.stagingImage in values.yaml for why the
stage-signing-key init container exists.
*/ -}}
{{- if .Values.authService.enabled }}
{{- $a := .Values.authService }}
{{- if not $a.database.secretName }}{{- fail "authService.database.secretName is required: the Secret holding the runtime login's DSN (key authService.database.secretKey)" }}{{- end }}
{{- $ks := $a.keySet }}
{{- $ksOn := and $ks $ks.enabled }}
{{- $manifest := "" }}
{{- if $ksOn }}
{{- /* Mirrors internal/auth/keystore (KeyIDPattern, State.Valid, bareFileName, MaxManifestBytes); auth_keyset_test.go ties the limits to that source. */}}
{{- if or $a.signingKey.secretName $a.signingKey.keyId }}{{- fail "authService.keySet replaces authService.signingKey: unset authService.signingKey.secretName and authService.signingKey.keyId while authService.keySet.enabled" }}{{- end }}
{{- if not $ks.keys }}{{- fail "authService.keySet.keys must list at least one key" }}{{- end }}
{{- $kids := dict }}
{{- $files := dict }}
{{- $entries := list }}
{{- $activeCount := 0 }}
{{- range $ks.keys }}
{{- if not (regexMatch "^[A-Za-z0-9._-]{1,64}$" (toString .kid)) }}{{- fail "authService.keySet.keys[].kid must match ^[A-Za-z0-9._-]{1,64}$" }}{{- end }}
{{- if not (has .state (list "pending" "active" "retiring" "retired" "compromised")) }}{{- fail "authService.keySet.keys[].state must be one of pending, active, retiring, retired, compromised" }}{{- end }}
{{- if or (not .file) (has (toString .file) (list "." "..")) (not (regexMatch "^[A-Za-z0-9._-]{1,255}$" (toString .file))) }}{{- fail "authService.keySet.keys[].file must be a bare name in the manifest directory, letters, digits, '.', '_' and '-' only" }}{{- end }}
{{- if eq .file "keyset.json" }}{{- fail "authService.keySet.keys[].file must not be keyset.json: that name is the manifest" }}{{- end }}
{{- if or (not .secretName) (not .secretKey) }}{{- fail (printf "authService.keySet.keys[] %s needs secretName and secretKey: a kid with no key file cannot be staged" .kid) }}{{- end }}
{{- if hasKey $kids .kid }}{{- fail "authService.keySet.keys[].kid must be unique" }}{{- end }}
{{- if hasKey $files .file }}{{- fail "authService.keySet.keys[].file must be unique" }}{{- end }}
{{- $_ := set $kids .kid true }}
{{- $_ := set $files .file true }}
{{- if eq .state "active" }}{{- $activeCount = add1 $activeCount }}{{- end }}
{{- $entries = append $entries (dict "kid" .kid "state" .state "file" .file) }}
{{- end }}
{{- if ne (int $activeCount) 1 }}{{- fail "authService.keySet.keys: exactly one key must be active" }}{{- end }}
{{- $manifest = dict "keys" $entries | toJson }}
{{- if gt (len $manifest) 16384 }}{{- fail "authService.keySet manifest is larger than 16 KiB, the service limit" }}{{- end }}
{{- else }}
{{- if not $a.signingKey.secretName }}{{- fail "authService.signingKey.secretName is required: the Secret holding the Ed25519 PKCS#8 PEM signing key (key authService.signingKey.secretKey)" }}{{- end }}
{{- if not $a.signingKey.keyId }}{{- fail "authService.signingKey.keyId is required: every signing key carries a kid and a JWKS entry from day one (ACP-ADR-02 §5)" }}{{- end }}
{{- end }}
{{- if eq (int $a.port) (int $a.operatorPort) }}{{- fail "authService.port and authService.operatorPort must differ: the operator surface is never exposed on the API port" }}{{- end }}
{{- if not (regexMatch "^[0-9]+s$" (toString $a.shutdownTimeout)) }}{{- fail "authService.shutdownTimeout must be whole seconds such as 20s" }}{{- end }}
{{- if ge (int (trimSuffix "s" (toString $a.shutdownTimeout))) (int $a.terminationGracePeriodSeconds) }}{{- fail "authService.shutdownTimeout must be below authService.terminationGracePeriodSeconds: the kubelet kills the pod at the grace period, so a longer shutdown bound is never reached" }}{{- end }}
{{- range $a.extraArgs }}
{{- if has (trimAll "-" (lower (trim (toString .))) | splitList "=" | first) (list "signing-key-file" "signing-key-id" "signing-keyset-file") }}{{- fail (printf "authService.extraArgs must not set %s: the chart renders the signing key flags (authService.signingKey or authService.keySet)" .) }}{{- end }}
{{- end }}
{{- if and $ksOn $a.podAnnotations (hasKey $a.podAnnotations "checksum/keyset") }}{{- fail "authService.podAnnotations must not set checksum/keyset: the chart sets it from the key-set manifest" }}{{- end }}
{{- range $a.extraEnv }}
{{- if has .name (list "AUTH_JWT_SECRET_KEY" "AUTH_SESSION_SUCCESSOR_KEY") }}{{- fail (printf "authService.extraEnv must not set %s: use authService.sessionKeys, which reaches the container by secretKeyRef" .name) }}{{- end }}
{{- if eq .name "AUTH_SIGNING_KEY" }}{{- fail "authService.extraEnv must not set AUTH_SIGNING_KEY: direct-value signing material is rejected by the service (ACP-ADR-02 §4); use authService.signingKey" }}{{- end }}
{{- if eq (lower (trim .name)) "auth_signing_keyset_file" }}{{- fail "authService.extraEnv must not set AUTH_SIGNING_KEYSET_FILE: the chart renders it (authService.keySet) or stages one signing key (authService.signingKey); the service refuses a key-set manifest beside a single key" }}{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-health.fullname" . }}-auth-service
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "auth-service" "context" $) | nindent 4 }}
spec:
  replicas: {{ $a.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "auth-service" "context" $) | nindent 6 }}
  template:
    metadata:
      {{- if or $a.podAnnotations $ksOn }}
      annotations:
        {{- with $a.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $ksOn }}
        checksum/keyset: {{ $manifest | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "auth-service" "context" $) | nindent 8 }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "dev-health.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $a.terminationGracePeriodSeconds }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: stage-signing-key
          image: {{ $a.signingKey.stagingImage.repository }}:{{ $a.signingKey.stagingImage.tag }}
          imagePullPolicy: {{ $a.signingKey.stagingImage.pullPolicy }}
          {{- if $ksOn }}
          command:
            - sh
            - -ec
            - |
              {{- range $ks.keys }}
              install -m 0400 {{ printf "/in/%s" .file | quote }} {{ printf "/out/%s" .file | quote }}
              {{- end }}
              install -m 0400 /in/keyset.json /out/keyset.json
          {{- else }}
          command: ["install", "-m", "0400", "/in/signing-key.pem", "/out/signing-key.pem"]
          {{- end }}
          volumeMounts:
            - {name: signing-key-source, mountPath: /in, readOnly: true}
            - {name: signing-key, mountPath: /out}
          resources:
            requests: {memory: "8Mi", cpu: "10m"}
            limits: {memory: "32Mi", cpu: "100m"}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: auth-service
          image: {{ include "dev-health.authServiceImage" . }}
          imagePullPolicy: {{ $a.image.pullPolicy }}
          args:
            - {{ printf "--http-addr=:%v" $a.port | quote }}
            - {{ printf "--operator-http-addr=:%v" $a.operatorPort | quote }}
            - {{ printf "--shutdown-timeout=%s" $a.shutdownTimeout | quote }}
            - {{ printf "--database-schema=%s" (include "dev-health.authDatabaseSchema" .) | quote }}
            {{- if $ksOn }}
            - "--signing-keyset-file=/run/auth/signing/keyset.json"
            {{- else }}
            - "--signing-key-file=/run/auth/signing/signing-key.pem"
            - {{ printf "--signing-key-id=%s" $a.signingKey.keyId | quote }}
            {{- end }}
            {{- range $a.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $a.port }}
              protocol: TCP
            - name: operator
              containerPort: {{ $a.operatorPort }}
              protocol: TCP
          env:
            - name: AUTH_DATABASE_URI
              valueFrom: {secretKeyRef: {name: {{ $a.database.secretName | quote }}, key: {{ $a.database.secretKey | quote }}}}
          {{- if $a.sessionKeys.successor.secretName }}
            - name: AUTH_JWT_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.hs256SecretName" . | quote }}, key: "JWT_SECRET_KEY"}}
            - name: AUTH_SESSION_SUCCESSOR_KEY
              valueFrom: {secretKeyRef: {name: {{ $a.sessionKeys.successor.secretName | quote }}, key: {{ $a.sessionKeys.successor.secretKey | quote }}}}
          {{- end }}
          {{- with $a.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - {name: signing-key, mountPath: /run/auth/signing, readOnly: true}
          livenessProbe:
            httpGet: {path: /healthz, port: operator}
            {{- toYaml $a.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: operator}
            {{- toYaml $a.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $a.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      volumes:
        - name: signing-key-source
        {{- if $ksOn }}
          projected:
            defaultMode: 0440
            sources:
              {{- range $ks.keys }}
              - secret:
                  name: {{ .secretName | quote }}
                  items:
                    - {key: {{ .secretKey | quote }}, path: {{ .file | quote }}}
              {{- end }}
              - configMap:
                  name: {{ include "dev-health.fullname" . }}-auth-service-keyset
                  items:
                    - {key: keyset.json, path: keyset.json}
        {{- else }}
          secret:
            secretName: {{ $a.signingKey.secretName | quote }}
            defaultMode: 0440
            items:
              - {key: {{ $a.signingKey.secretKey | quote }}, path: signing-key.pem}
        {{- end }}
        - name: signing-key
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
      {{- with $a.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-auth-service
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "auth-service" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "auth-service" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ $a.port }}
      targetPort: http
      protocol: TCP
    {{- if $a.networkPolicy.metricsFrom }}
    # Published only when scrapers are listed: the NetworkPolicy admits exactly those
    # pod selectors to this port and nobody else.
    - name: operator
      port: {{ $a.operatorPort }}
      targetPort: operator
      protocol: TCP
    {{- end }}
{{- if $ksOn }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dev-health.fullname" . }}-auth-service-keyset
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "auth-service" "context" $) | nindent 4 }}
data:
  keyset.json: {{ $manifest | quote }}
{{- end }}
{{- if $a.networkPolicy.enabled }}
{{- if not $a.networkPolicy.egress.database.to }}{{- fail "authService.networkPolicy.egress.database.to is required while authService.networkPolicy.enabled (the default; set it false only when another layer enforces the boundary): the auth pods are excluded from the release-wide policy, so an empty list would cut the service off from its database" }}{{- end }}
{{- range (concat $a.networkPolicy.allowedFrom $a.networkPolicy.metricsFrom) }}
{{- if not (or (and .matchLabels (gt (len .matchLabels) 0)) (and .matchExpressions (gt (len .matchExpressions) 0))) }}
{{- fail "authService.networkPolicy.allowedFrom and metricsFrom entries need a non-empty matchLabels or matchExpressions: an empty podSelector admits every pod in the namespace" }}
{{- end }}
{{- end }}
---
{{- /*
The auth pods' WHOLE network boundary, rendered whenever the service is enabled.
When the release-wide policy is on they are excluded from it (networkpolicy.yaml), which admits every pod of the namespace on every
port and all HTTPS egress. Ingress: only the listed consumers on the API port
and only the listed scrapers on the operator port; an empty list renders no rule
for that port (a `from` that is empty or absent would admit every source).
Egress: DNS, the database, and -- only when listed -- the key custody service.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" . }}-auth-service
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "auth-service" "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "auth-service" "context" $) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- /* CHAOS-10231: go-api's pods reach the API port only while a goApi.authProxy flag is on. */}}
  {{- $apiFrom := $a.networkPolicy.allowedFrom }}
  {{- if eq (include "dev-health.authProxyOn" $) "true" }}
  {{- $apiFrom = append $apiFrom (dict "matchLabels" (include "dev-health.componentSelectorLabels" (dict "component" "go-api" "context" $) | fromYaml)) }}
  {{- end }}
  {{- if or $apiFrom $a.networkPolicy.metricsFrom }}
  ingress:
    {{- with $apiFrom }}
    - from:
        {{- range . }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $a.port }}
    {{- end }}
    {{- with $a.networkPolicy.metricsFrom }}
    - from:
        {{- range . }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $a.operatorPort }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The auth database, and nothing else
    - to:
        {{- toYaml $a.networkPolicy.egress.database.to | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $a.networkPolicy.egress.database.port }}
    {{- with $a.networkPolicy.egress.keyCustody.to }}
    # Key custody service (KMS)
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $a.networkPolicy.egress.keyCustody.port }}
    {{- end }}
{{- end }}
{{- end }}
