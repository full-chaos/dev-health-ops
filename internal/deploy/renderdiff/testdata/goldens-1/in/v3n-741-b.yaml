apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-health-ops-go-pgbouncer-transaction
  namespace: dev-health
  labels:
    helm.sh/chart: ops-0.1.0
    app.kubernetes.io/name: ops
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: dev-health
    app.kubernetes.io/component: go-pgbouncer-transaction
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {"maxSurge":0,"maxUnavailable":1}
  selector:
    matchLabels:
      app.kubernetes.io/name: ops
      app.kubernetes.io/instance: dev-health
      app.kubernetes.io/component: go-pgbouncer-transaction
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops
        app.kubernetes.io/instance: dev-health
        app.kubernetes.io/component: go-pgbouncer-transaction
      annotations:
        checksum/users-ini: 7663624f9ba59edf49bd108a83949ebbbfd4bc160b721cc69132ee83cd67b606
    spec:
      
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      # edoburu/pgbouncer runs as postgres (UID/GID 70) and writes its generated
      # pgbouncer.ini and userlist.txt below /etc/pgbouncer at startup. Keep the
      # root filesystem read-only, but give that exact path an fsGroup-owned
      # ephemeral volume. The isolated compatibility harness starts this shape.
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: pgbouncer
          image: "edoburu/pgbouncer:1.25.2@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd"
          imagePullPolicy: IfNotPresent
          args: ["/usr/bin/pgbouncer", "/etc/pgbouncer-users/pgbouncer.ini"]
          ports: [{name: pgbouncer, containerPort: 6432}]
          env:
            - {name: DB_HOST, value: "dev-health-ops-postgresql"}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: "placeholder"}
            - {name: DB_USER, value: "devhealth_domain"}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: dev-health-ops-go-pgbouncer, key: RIVER_DOMAIN_DATABASE_PASSWORD}}
            - {name: LISTEN_PORT, value: "6432"}
            - {name: POOL_MODE, value: "transaction"}
            - {name: AUTH_TYPE, value: scram-sha-256}
            - {name: DEFAULT_POOL_SIZE, value: "16"}
            - {name: MAX_CLIENT_CONN, value: "1000"}
            # CHAOS-3944: log_connections/log_disconnections default on and
            # turn steady Go worker replica churn into a continuous,
            # diagnostically worthless log firehose, identically to the
            # compose poolers (see deploy/docker-compose/compose.production.yml (deleted, CHAOS-6950)).
            # log_pooler_errors and the default log_stats stay on: the
            # once-a-minute stats line is the only real pooler telemetry.
            - {name: LOG_CONNECTIONS, value: "0"}
            - {name: LOG_DISCONNECTIONS, value: "0"}
            - {name: LOG_POOLER_ERRORS, value: "1"}
            # CHAOS-5616: AUTH_FILE moves auth_file off the generated-config
            # emptyDir onto the chart-rendered, read-only userlist below, which
            # the entrypoint honours verbatim -- it writes the auth file only
            # when the file is missing (touch) or when its own DB_USER line is
            # absent, and never rewrites pgbouncer.ini's auth_file once set.
            - {name: AUTH_FILE, value: /etc/pgbouncer-userlist/userlist.txt}
          # CHAOS-3944: tcpSocket only proves the port accepts a TCP connection,
          # not that PgBouncer can actually authenticate and serve a query —
          # the compose poolers now run an authenticated `psql -c "SELECT 1"`
          # exec probe for the same reason (a pg_isready probe, even pinned to
          # the real user/db, still reports healthy on an auth rejection).
          # Left as tcpSocket here deliberately: an exec probe change for a
          # k8s liveness/readiness gate has a different blast radius (pod
          # restarts, rollout gating) than a compose healthcheck, so it is
          # out of scope for this PR.
          readinessProbe: {tcpSocket: {port: pgbouncer}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: pgbouncer}, initialDelaySeconds: 10, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: generated-config, mountPath: /etc/pgbouncer}
            - {name: userlist, mountPath: /etc/pgbouncer-userlist, readOnly: true}
            - {name: users, mountPath: /etc/pgbouncer-users, readOnly: true}
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: generated-config
          emptyDir: {}
        # Only the userlist key is projected: the rest of this Secret is role
        # passwords and DSNs the pooler already reads as env. 0440 with the
        # pod's fsGroup 70 leaves it root-owned and group-readable, never
        # writable -- which the entrypoint never needs it to be.
        - name: userlist
          secret: {secretName: dev-health-ops-go-pgbouncer, defaultMode: 0440, items: [{key: userlist.txt, path: userlist.txt}]}
        - name: users
          configMap: {name: dev-health-ops-go-pgbouncer-transaction-users}

