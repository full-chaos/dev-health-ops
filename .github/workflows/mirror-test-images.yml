# Mirror the Go test-dependency images to ghcr.io.
#
# WHY (CHAOS-4778): every Testcontainers-backed job pulls these four images from
# Docker Hub. Even authenticated, that quota is shared across the whole fleet,
# and on 2026-09-02 it ran out mid-day: `Login Succeeded!` followed 0.6 s later
# by `toomanyrequests: You have reached your unauthenticated pull rate limit`,
# taking go-quality, all six storage shards and river-compatibility down at once
# on every branch. Mirroring removes Docker Hub from the CI pull path entirely.
#
# DIGESTS ARE PRESERVED, and that is the whole point: `docker buildx imagetools
# create` copies the manifest verbatim, so the mirrored ref carries the SAME
# sha256 as the upstream one and every pin in the repository stays a literal.
# A naive `docker pull && docker tag && docker push` would NOT do this -- for a
# multi-arch image it extracts one platform and republishes a different
# manifest, silently changing the digest. The verify step below fails the run if
# the digests ever diverge, so this cannot rot quietly.
# ORDERING, AND ITS LIMIT. This workflow triggers on changes to test.yml and
# live-e2e.yml, but Actions gives no cross-workflow dependency: `Tests` starts
# on the same PR update this mirror does. That only bites when a change
# introduces a service ref the mirror has NEVER published -- an existing ref is
# already there and pulls immediately. So:
#
#   Introducing a NEW service image? Dispatch this workflow on the branch and
#   let it finish BEFORE the PR's Tests run, or expect one failed pull.
#
# Fork PRs cannot publish at all: GITHUB_TOKEN is read-only on a fork, so the
# mirror job is skipped. They CAN pull every image already mirrored, because
# these packages are public -- verified: an anonymous ghcr token returns 200 for
# `full-chaos/valkey/valkey:8-alpine`. A fork PR that introduces a brand-new
# service image therefore needs a maintainer to mirror it first, which is the
# correct outcome rather than a gap: a fork must not be able to publish into
# this registry.
name: Mirror test images

on:
  workflow_dispatch:
  schedule:
    # Weekly. Upstream tags are pinned by digest, so this only refreshes the
    # mirror's own retention; it is not chasing upstream changes.
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - internal/testsupport/containers/harness.go
      - ci/check_go.sh
      # The river compose is an INPUT to this workflow (its images are mirrored
      # too), so a pin bump there must re-run the mirror. Without this, bumping
      # only the pgbouncer digest runs river CI against a ghcr ref that was
      # never copied.
      - tests/compatibility/river/compose.compatibility.yml
      # A service-image change must re-run the mirror, or the new ref is
      # declared before it exists and the required check fails at pull time.
      - .github/workflows/test.yml
      - .github/workflows/live-e2e.yml
      - .github/workflows/mirror-test-images.yml
  pull_request:
    paths:
      - internal/testsupport/containers/harness.go
      - ci/check_go.sh
      # The river compose is an INPUT to this workflow (its images are mirrored
      # too), so a pin bump there must re-run the mirror. Without this, bumping
      # only the pgbouncer digest runs river CI against a ghcr ref that was
      # never copied.
      - tests/compatibility/river/compose.compatibility.yml
      # A service-image change must re-run the mirror, or the new ref is
      # declared before it exists and the required check fails at pull time.
      - .github/workflows/test.yml
      - .github/workflows/live-e2e.yml
      - .github/workflows/mirror-test-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  # CHAOS-4928: the bare literal below used to be the WHOLE group -- every
  # push, schedule, pull_request and workflow_dispatch run on this file
  # shared one slot, repo-wide. Measured live: a dispatch on a feature
  # branch (introducing CHAOS-4922's Python mirror image, meant to finish
  # BEFORE that branch's own Tests run pulls it -- see the header above) sat
  # pending for 2m23s and was evicted by an unrelated pull_request run one
  # second after a third event landed. `cancel-in-progress: false` only
  # protects a RUNNING job; GitHub still allows only one PENDING run per
  # group, so a third event bumps a second, still-pending one -- the same
  # mechanism CHAOS-4921 round 1 hit on docker-images.yml.
  #
  # push (to main) and schedule keep sharing ONE group deliberately: this
  # job is idempotent and cumulative (it re-derives and mirrors everything
  # CI currently needs from the tree at run time), so losing an UNRELATED
  # pending run there is cheap -- the next one re-covers it. pull_request
  # and workflow_dispatch are the opposite: each carries branch-specific
  # intent that a later, unrelated event must not evict, so each gets its
  # own group, isolated from the shared slot and from every other PR/dispatch.
  #
  # Two different refs CAN now publish `imagetools create` to the same
  # destination tag concurrently. That is benign, not reintroduced risk:
  # every copy is digest-preserving (see "DIGESTS ARE PRESERVED" above) and
  # every consumer in this repo pins by `tag@digest`, never by tag alone --
  # both manifests exist by digest regardless of which write wins the
  # mutable tag pointer. A consumer that ever resolved a mirrored image by
  # tag alone would be the defect, not this concurrency change.
  group: mirror-test-images-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.sha) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Forks get neither the Docker Hub secrets nor packages:write, so the job
    # would fail at login rather than do anything useful.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NO `setup-buildx-action`, and NO Docker Hub login -- both deliberate.
      #
      # That action defaults to the `docker-container` driver, which bootstraps by
      # pulling `moby/buildkit:buildx-stable-1` FROM DOCKER HUB, unconditionally,
      # before anything here has logged in anywhere. On a rate-limited runner the
      # mirror would fail to start for want of the very registry it exists to stop
      # depending on -- and that image is not in the mirror set either.
      #
      # `docker buildx imagetools` needs no builder: it is a registry-to-registry
      # manifest operation on the CLI's built-in `docker` driver. Verified by
      # populating all eight images this way, with no buildx action and no Docker
      # Hub credentials.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read the set from ci/check_go.sh rather than restating it here: one
      # parser, so the mirror and the pre-pull cannot drift apart.
      - name: Resolve every image CI pulls from Docker Hub
        id: images
        run: |
          set -euo pipefail
          # Two sources, both DERIVED so neither can drift from what CI runs:
          #   1. the Go test harness, via check_go.sh's own parser
          #   2. compose files used by CI jobs -- river-compatibility pulls
          #      edoburu/pgbouncer, which lives in no Go file and was missed on
          #      the first pass precisely because it was restated nowhere.
          bash ci/check_go.sh integration-images | awk -F'\t' 'NF == 2' | cut -f2 > images.raw
          #   3. GitHub Actions `services:` containers in test.yml / live-e2e.yml
          # Source 3 replaces a hardcoded `clickhouse/clickhouse-server:26.7`
          # line. A hand-maintained entry is exactly the shape that rots: the
          # workflow declaring the service and the workflow mirroring it drift,
          # and the failure appears at pull time on a required check. Deriving it
          # means the declaration IS the source of truth.
          #
          # Those files name the MIRRORED ref, so the prefix is stripped to
          # recover the upstream ref to mirror FROM -- the inverse of what the
          # river compose needs, and for the same reason.
          # Parsed as YAML, NOT matched as lines. A line-based scan recognised
          # only `image:` at the start of a line, so these all bypassed it while
          # remaining valid Actions syntax:
          #   redis: { image: ghcr.io/... }     flow mapping, one line
          #   <<: *service_anchor                YAML alias
          #   any non-standard indentation
          # A guard that cannot see a declaration cannot refuse it, and this
          # file's whole job is to see every image CI pulls.
          #
          # These files name the MIRRORED ref, so the owner-qualified prefix is
          # stripped to recover the upstream ref to mirror FROM -- the inverse of
          # what the river compose needs, and for the same reason.
          OWNER="${{ github.repository_owner }}" python3 - \
              .github/workflows/test.yml .github/workflows/live-e2e.yml >> images.raw <<'PY'
          import os, sys, yaml

          prefix = f"ghcr.io/{os.environ['OWNER']}/"
          bad, out = [], []
          for path in sys.argv[1:]:
              document = yaml.safe_load(open(path, encoding="utf-8")) or {}
              for job_name, job in (document.get("jobs") or {}).items():
                  if not isinstance(job, dict):
                      continue
                  declarations = []
                  container = job.get("container")
                  if container is not None:
                      declarations.append(("container", container))
                  for service_name, service in (job.get("services") or {}).items():
                      declarations.append((f"services.{service_name}", service))
                  for where, declaration in declarations:
                      # A bare string IS valid: `redis: redis:7-alpine`.
                      image = declaration if isinstance(declaration, str) else (
                          declaration.get("image") if isinstance(declaration, dict) else None)
                      if not image:
                          bad.append(f"{path}: {job_name}.{where} has no resolvable image")
                          continue
                      # Owner-qualified, not merely `ghcr.io/`. Another owner's
                      # namespace is somebody else's registry: the runner would
                      # pull THEIRS while this workflow publishes OURS.
                      # Registry HOSTS are case-insensitive DNS names, so
                      # `GHCR.IO/...` is the same registry and must not be
                      # refused; the repository PATH after it is case-sensitive
                      # and is sliced out unchanged.
                      if not str(image).casefold().startswith(prefix.casefold()):
                          bad.append(f"{path}: {job_name}.{where} pulls {image!r}, not under {prefix}")
                          continue
                      out.append(str(image)[len(prefix):])
          if bad:
              for line in bad:
                  print(f"::error::{line}", file=sys.stderr)
              sys.exit(1)
          print("\n".join(out))
          PY
          for compose in tests/compatibility/river/compose.compatibility.yml; do
            test -f "${compose}" || { echo "::error::compose file missing: ${compose}"; exit 1; }
            # The compose file parameterises its refs as ${TEST_IMAGE_PREFIX:-}<ref>
            # so CI can redirect them at this mirror. Strip that expansion to get
            # back to the UPSTREAM ref, which is what must be mirrored FROM.
            sed -nE 's/^[[:space:]]*image:[[:space:]]*(\$\{[^}]*\})?([^[:space:]#]+).*$/\2/p' \
              "${compose}" >> images.raw
          done
          sort -u images.raw > images.txt
          test -s images.txt || { echo "::error::no images resolved"; exit 1; }
          # Refuse to mirror anything still carrying an unexpanded shell variable
          # rather than pushing a garbage ref. This fired for real: parameterising
          # the compose file broke this parser, and without the guard the failure
          # surfaced as an opaque "invalid reference format" from buildx.
          if grep -q '[$]' images.txt; then
            echo "::error::unresolved variable in an image ref:"
            grep '[$]' images.txt
            exit 1
          fi
          echo "--- images to mirror ---"
          cat images.txt

      # Destinations PRESERVE the upstream path under the mirror:
      #   postgres:18-alpine@sha256:X      -> ghcr.io/<owner>/postgres:18-alpine
      #   clickhouse/clickhouse-server@X   -> ghcr.io/<owner>/clickhouse/clickhouse-server:mirrored
      #   testcontainers/ryuk:0.14.0       -> ghcr.io/<owner>/testcontainers/ryuk:0.14.0
      # That is not cosmetic. TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX works by
      # PREPENDING itself to the image name, so a path-preserving mirror lets one
      # env var redirect every Docker Hub pull -- including the reaper, whose name
      # testcontainers-go hardcodes and offers no other way to override. A flat
      # rename would be unreachable by that mechanism.
      - name: Mirror each image to ghcr.io, preserving its digest
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          while read -r image; do
            [ -n "${image}" ] || continue
            ref="${image}"
            case "${ref}" in *@sha256:*) ref="${ref%@*}" ;; esac
            case "${ref}" in
              *:*) repo="${ref%:*}"; tag="${ref##*:}" ;;
              *)   repo="${ref}";    tag="mirrored"   ;;
            esac
            dest="ghcr.io/${OWNER}/${repo}:${tag}"
            printf '\n=== from %s\n    to   %s\n' "${image}" "${dest}"
            docker buildx imagetools create --tag "${dest}" "${image}"
          done < images.txt

      - name: Verify every mirrored digest matches upstream
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          failed=0
          while read -r image; do
            [ -n "${image}" ] || continue
            ref="${image}"
            case "${ref}" in *@sha256:*) ref="${ref%@*}" ;; esac
            case "${ref}" in
              *:*) repo="${ref%:*}"; tag="${ref##*:}" ;;
              *)   repo="${ref}";    tag="mirrored"   ;;
            esac
            dest="ghcr.io/${OWNER}/${repo}:${tag}"
            mirrored=$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "${dest}")
            case "${image}" in
              # Digest-pinned upstream: the mirrored manifest MUST carry the same
              # sha256. That equality is what lets every pin in the repository
              # stay a literal while the pull is redirected to the mirror.
              *@sha256:*)
                want="${image##*@}"
                if [ "${mirrored}" = "${want}" ]; then
                  printf 'OK   %-34s %s\n' "${repo}" "${mirrored}"
                else
                  printf 'FAIL %-34s mirrored=%s want=%s\n' "${repo}" "${mirrored}" "${want}" >&2
                  failed=1
                fi
                ;;
              # Tag-pinned upstream (the reaper: testcontainers-go hardcodes the
              # tag and offers no override). Nothing to assert against, so record
              # what the mirror now serves.
              *)
                printf 'NOTE %-34s tag-pinned upstream, mirrored digest %s\n' "${repo}" "${mirrored}"
                ;;
            esac

            # EVERY mirrored image must be a multi-arch INDEX carrying both
            # linux/amd64 and linux/arm64.
            #
            # Not because the copy step drops platforms -- `imagetools create`
            # copies the index verbatim, which is why the mirrored digest above
            # equals upstream's byte for byte. This asserts the property a reader
            # actually needs, so that "is the mirror arm64-capable?" is answered
            # by a CI run instead of by a lane inspecting digests by hand.
            #
            # A digest-pinned image has TWO digests a person will meet, and they
            # inspect very differently:
            #
            #   the INDEX             MediaType application/vnd.oci.image.index.v1+json
            #                         -> lists every platform
            #   a PLATFORM MANIFEST   MediaType application/vnd.oci.image.manifest.v1+json
            #                         -> ONE architecture, no platform list, and it
            #                            inspects cleanly, so it reads as
            #                            "this image is amd64-only"
            #
            # That misreading has now happened twice on this repo -- once on
            # valkey (the amd64 manifest sha256:95726b32 quoted as the image's
            # identity when the index was b21fd94099dc) and once on postgres,
            # reported as amd64-only when its mirror carries eight platforms.
            # The tell is MediaType, so this checks MediaType explicitly rather
            # than only counting platforms.
            media=$(docker buildx imagetools inspect --format '{{ .Manifest.MediaType }}' "${dest}")
            # ONE LINE, no `\` continuation. The registry-allowlist guard added
            # in #2120 parses every `run:` step to find image references and
            # REFUSES a command it cannot parse rather than assuming it is safe.
            # A continuation split this substitution across lines, the parse
            # failed, and the guard failed closed -- correctly. Keeping it on one
            # line keeps the command parseable instead of weakening the guard.
            raw=$(docker buildx imagetools inspect --raw "${dest}" 2>/dev/null || echo '{}')
            platforms=$(printf '%s' "${raw}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(" ".join(sorted({(m.get("platform") or {}).get("os","?")+"/"+((m.get("platform") or {}).get("architecture","?")) for m in d.get("manifests",[])})))' 2>/dev/null || echo "")
            case "${media}" in
              *index*|*manifest.list*) ;;
              *)
                printf 'FAIL %-34s MediaType=%s is a PLATFORM MANIFEST, not an index.\n' \
                  "${repo}" "${media}" >&2
                printf '     A platform manifest describes ONE architecture. If you pinned\n' >&2
                printf '     this by digest, you almost certainly took the linux/amd64\n' >&2
                printf '     digest instead of the index digest -- inspect the TAG to get\n' >&2
                printf '     the index, and pin that.\n' >&2
                failed=1
                continue
                ;;
            esac
            missing=""
            case "${platforms}" in *linux/amd64*) ;; *) missing="linux/amd64" ;; esac
            case "${platforms}" in *linux/arm64*) ;; *) missing="${missing} linux/arm64" ;; esac
            if [ -n "${missing}" ]; then
              printf 'FAIL %-34s index is missing:%s (has: %s)\n' \
                "${repo}" "${missing}" "${platforms}" >&2
              printf '     The harness runs on both architectures; an image missing one\n' >&2
              printf '     cannot be scheduled there. Mirror the full upstream index.\n' >&2
              failed=1
            else
              printf 'ARCH %-34s %s\n' "${repo}" "${platforms}"
            fi
          done < images.txt
          exit "${failed}"

  # Reports the ANONYMOUS per-runner-IP Docker Hub allowance -- the only one this
  # workflow now depends on, since it holds no Docker Hub account.
  #
  # History, because the numbers explain the design: while CI authenticated as a
  # personal account, this probe measured `200;w=3600` with 65 remaining -- 200
  # pulls per HOUR shared fleet-wide, against ~8 container jobs x 4 images per Go
  # run. It hit zero the same afternoon and took every Testcontainers job down on
  # every branch. That is why CI no longer uses that account at all.
  #
  # Kept as a permanent diagnostic: the next `toomanyrequests` is one dispatch
  # rather than an investigation.
  ratelimit-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the Docker Hub rate limit for this account
        run: |
          set -euo pipefail
          # NO `-f` on either call, deliberately. `curl -f` turns a 429 into exit
          # 22 with no body and no headers -- so the diagnostic died exactly in
          # the situation it exists to diagnose (observed 2026-09-02 14:17: the
          # probe failed with `curl: (22) ... error: 429` and reported nothing).
          # A probe that only works when nothing is wrong is not a probe.
          token_body=$(curl -sSL -w '\n%{http_code}' \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:ratelimitpreview/test:pull")
          token_status="${token_body##*$'\n'}"
          token=$(printf '%s' "${token_body}" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ "${token_status}" = "429" ]; then
            echo "--- Docker Hub rate limit ---"
            echo "429 from the TOKEN endpoint: the account is fully rate limited."
            echo "=> quota exhausted. Wait for the window to roll over, or raise the plan."
            echo "   Do not retry in a loop; each attempt extends the exhaustion."
            exit 0
          fi
          if [ -z "${token}" ]; then
            echo "::error::no token returned (HTTP ${token_status}) for the configured credentials"
            exit 1
          fi
          headers=$(curl -sSI -H "Authorization: Bearer ${token}" \
            https://registry-1.docker.io/v2/ratelimitpreview/test/manifests/latest)
          limit=$(printf '%s\n' "${headers}" | grep -i '^ratelimit-limit:' || true)
          remaining=$(printf '%s\n' "${headers}" | grep -i '^ratelimit-remaining:' || true)
          echo "--- Docker Hub rate limit, authenticated as the configured account ---"
          if [ -z "${limit}${remaining}" ]; then
            echo "no ratelimit headers returned"
            echo "=> unmetered plan (Pro/Team/Business): pull limits are not the cause"
          else
            printf '%s\n%s\n' "${limit}" "${remaining}"
            echo "=> metered plan. The 'w=' value is the window IN SECONDS"
            echo "   (w=3600 is hourly, w=21600 six-hourly); remaining=0 means exhausted."
          fi
