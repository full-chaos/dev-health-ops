    # every deployment, which is exactly the assertion SweepModeActive
    # encodes -- so the sweep ships ACTIVE rather than as an operator
    # opt-in. A FLAG, not an environment entry: only credentials render
    # through `environment:`, every other setting is visible in `command:`.
    command:
      - --shutdown-timeout=60s
      - --unreclaimable-sweep=${SYNC_UNRECLAIMABLE_SWEEP:-active}
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-bridge-url
      - *flag-bridge-insecure
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s
    # Ported from the now-deleted deploy/go-workers/compose-go-workers.yml
    # (CHAOS-3142) rather than dropped: per-stage budgets and the
    # step-overrun watchdog (internal/syncreconciler) make the process stay
    # up and mark /readyz unhealthy when a stage is stuck; this healthcheck
    # is what turns that into a container status Docker can actually see
    # (`docker ps`, `depends_on: condition: service_healthy` elsewhere in
    # this file). r5 P3 (executed repro): it does NOT itself trigger a
    # restart -- `restart: unless-stopped` (inherited from &go-worker)
    # restarts on container EXIT only; a process that stays running but
    # reports unhealthy (proven by freezing it with SIGSTOP: RestartCount
    # stayed 0, State.Health.Status went healthy->unhealthy->healthy again
    # on SIGCONT, container never restarted) is exactly the case this
    # healthcheck exists to make OBSERVABLE, not to remediate -- recovery
    # from a stuck stage is the step-overrun watchdog's own job inside the
    # process. The runtime image has no shell/curl/wget, so this
    # invokes the reconciler binary's own `healthcheck` subcommand
    # (cmd/dev-health-reconciler/main.go), which queries this same
    # container's own /readyz over loopback and mirrors that status as its
    # exit code. No other service in this fleet declares one to copy
    # interval/timeout/retries from -- these are this service's own.
    healthcheck:
      test: ["CMD", "/usr/local/bin/dev-health-reconciler", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  go-scheduler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_SCHEDULER_IMAGE:-ghcr.io/full-chaos/dev-health-go-scheduler:latest}
    # r5 P1: own pull-policy override, see go-worker-heavy's comment.
    pull_policy: ${DEV_HEALTH_GO_SCHEDULER_PULL_POLICY:-build}
    build:
