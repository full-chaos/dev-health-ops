name: THROWAWAY publisher count50

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  publisher-count50:
    name: publisher-count50
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash ci/check_go.sh integration-prepull
      - run: go test -tags=integration -race -count=50 -timeout=55m -v -run '^(TestPublisherRedeliversWhenTheMarkNeverCommits|TestAbandonedDeliveryBlocksARedeliveryUntilItReturns)$' ./internal/audit/
