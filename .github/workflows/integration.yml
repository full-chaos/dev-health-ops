name: Integration Tests
env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  GITLAB_TOKEN: ${{ secrets.GL_TOKEN }}
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  # CHAOS-4906 fleet audit (09-03): this workflow's own triggers today are
  # `push` (main only) and `workflow_dispatch` -- no `pull_request` at all
  # -- so `github.event.pull_request.number` in the group key above is
  # currently always empty. Originally scoped `cancel-in-progress` to
  # `pull_request` only ("a push to main must never cancel another"), which
  # given the triggers above meant cancellation was ALWAYS off here. Now
  # the canonical fleet-wide shape per chris's 09-03 15:20 ruling
  # (incident-informed): a push to a non-main branch would cancel a stale
  # run (no-op today -- push is main-only -- kept for consistency and so
  # this doesn't silently become a gap if that trigger widens later), but a
  # push to main is still sha-keyed and never cancelled, same protection as
  # before.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests (conditional)
    # ubuntu-26.04-arm is not a real enterprise hosted label (chris
    # 2026-09-04 16:59) -- routed to the ARC pool instead, same
    # variable-gated shape as the required-context jobs elsewhere in this
    # PR. This workflow only triggers on push-to-main/workflow_dispatch
    # (never pull_request), so the fork-PR clause is inert here but kept for
    # the same textual shape as every other routed job. Falls back to
    # ubuntu-latest (x64) when disabled -- there is no valid hosted ARM
    # label, and this suite has no arm64-specific assertions.
    runs-on: ${{ (vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.ref == '' || github.event.inputs.ref == null)) || github.event_name == 'release' || github.event_name == 'schedule')) && fromJSON('["self-hosted","oci-arc-runners"]') || 'ubuntu-latest' }}
    # Integration tests need package read access for dependency installs.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GL_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          SKIP_INTEGRATION_TESTS: ${{ secrets.SKIP_INTEGRATION_TESTS }}
          # No OTLP collector in CI; OTEL on floods logs with localhost:4317
          # export retries. We don't assert OTEL stats in CI.
          OTEL_ENABLED: "false"
        run: |
          chmod +x ci/run_tests.sh
          mkdir -p test-results/logs
          set -o pipefail
          ./ci/run_tests.sh integration 2>&1 | tee test-results/logs/integration.log

      - name: Upload integration junit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-junit
          path: test-results/junit/integration.xml
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-logs
          path: |
            test-results/logs/*.log
            **/pytest.log
          if-no-files-found: ignore
          retention-days: 14
