# Freeze the provider worlds of `fixtures generate` with their real producers.
#
# A provider world is not a dump of a generator: the Go producers write it into a ClickHouse
# (TestProviderWorldsAreWhatTheProducersWrite). The freeze needs a container runtime, so it runs
# here and not on a laptop. The run writes the worlds, then uploads the changed world files, the
# manifest rows to pin and the log. It commits nothing: a person copies the artifact into a branch
# and pins the digests (internal/fixturescli/generate.go, testdata.manifest.tsv).
#
# Run it with `gh workflow run freeze-provider-worlds.yml --ref <branch>`. A change to this file also
# starts it on the pull request, which is how it is tested before it exists on main. The demo world is
# frozen at its committed as-of day unless demo_as_of names another one (YYYY-MM-DD).
name: Freeze provider worlds

on:
  workflow_dispatch:
    inputs:
      demo_as_of:
        description: 'The day the demo world ends (YYYY-MM-DD); empty keeps the committed one'
        required: false
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/freeze-provider-worlds.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: freeze-provider-worlds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    if: (!(vars.CI_SKIP_DRAFT_PRS == 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci:full')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository_owner }}
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The freeze stamps each world with the merge base of HEAD and origin/main.
      - name: Fetch main for the producer stamp
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      # A fork pull request runs its own code in the test step: it gets no registry credential and
      # pulls the public mirrored images anonymously.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull pinned test dependency images with bounded retry
        run: bash ci/check_go.sh integration-prepull

      - name: Freeze the provider worlds
        env:
          DEMO_AS_OF: ${{ inputs.demo_as_of }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${DEMO_AS_OF:-}" ]; then extra+=("-demo-as-of=${DEMO_AS_OF}"); fi
          go test -mod=readonly -trimpath -tags=integration -count=1 -timeout=25m -v \
            -run '^TestProviderWorldsAreWhatTheProducersWrite$' ./internal/fixturescli/ \
            -freeze-provider-worlds "${extra[@]}" 2>&1 | tee freeze.log

      - name: Collect what changed
        run: |
          set -euo pipefail
          mkdir -p frozen/files
          git status --porcelain -- internal/fixturescli/testdata > frozen/changed.txt
          # A world with new parameters is a new, untracked file: it is collected too.
          { git diff --name-only -- internal/fixturescli/testdata; git ls-files --others --exclude-standard -- internal/fixturescli/testdata; } | while read -r file; do
            mkdir -p "frozen/files/$(dirname "${file}")"
            cp "${file}" "frozen/files/${file}"
          done
          grep -E 'froze |unchanged' freeze.log > frozen/digests.txt || true
          cp freeze.log frozen/freeze.log
          echo "changed files:"; cat frozen/changed.txt
          echo "digests:"; cat frozen/digests.txt

      - name: Upload the frozen worlds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frozen-provider-worlds
          path: frozen
          if-no-files-found: error
