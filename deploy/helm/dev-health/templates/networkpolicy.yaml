{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" . }}
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.selectorLabels" . | nindent 6 }}
    {{- if and .Values.goApi.enabled .Values.goApi.internal.enabled }}
    {{- /*
    CHAOS-7181: NetworkPolicies are additive, and this policy's "pod-to-pod within namespace" rule
    admits every pod on every port. The go-api pods are gated by their own policy (go-api-internal)
    so the internal port is reachable only from goApi.internal.allowedFrom; they keep this
    policy's egress through the go-api-egress policy below.
    */}}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: NotIn, values: [go-api]}
    {{- end }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- /*
    CHAOS-8552: no ingress-controller rule here. This policy selects (almost) every pod of the release, so a controller rule
    on it admitted the controller on the same ports at the datastores and workers too (a goApi.port of 9000 or 6432 opened the
    ClickHouse native or PgBouncer port to it). The controller reaches only the pods the Ingress routes to, through the
    per-component policies below.
    */}}
    # Allow pod-to-pod within namespace
    - from:
        - podSelector: {}
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Internal communication
    - to:
        - podSelector: {}
    # External HTTPS (GitHub, GitLab, Jira, Stripe APIs)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- range $component := list "go-api" "web" }}
{{- $enabled := ternary $.Values.goApi.enabled $.Values.web.enabled (eq $component "go-api") }}
{{- $port := ternary $.Values.goApi.port $.Values.web.port (eq $component "go-api") }}
{{- if $enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" $ }}-ingress-{{ $component }}
  namespace: {{ include "dev-health.namespace" $ }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" (printf "%s-ingress" $component) "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" $component "context" $) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # CHAOS-8552: the ingress controller reaches this component's Service port and nothing else.
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ $port }}
{{- end }}
{{- end }}
{{- if and .Values.goApi.enabled .Values.goApi.internal.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" . }}-go-api-egress
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "go-api" "context" $) | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Internal communication
    - to:
        - podSelector: {}
    # External HTTPS (GitHub, GitLab, Jira, Stripe APIs)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
