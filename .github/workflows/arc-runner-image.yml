# Build and publish the ARC (actions-runner-controller) runner image used by
# the oci-arc-runners scale set. See docker/arc-runner/Dockerfile for why
# this exists (CHAOS-4906): upstream ghcr.io/actions/actions-runner lacks
# make and postgresql-client, and CF's first job dispatched to that scale
# set failed on the missing `make`.
#
# DESTINATION is ghcr.io/full-chaos/arc-runner -- flat, ops-scoped, matching
# every other image this repo already publishes to ghcr.io/full-chaos
# (postgres, clickhouse/clickhouse-server, etc. via mirror-test-images.yml),
# not acr's nested ghcr.io/full-chaos/dev-health-acr/... convention -- GHCR
# package write access is repo-scoped, and this package is owned by ops.
#
# CONCURRENCY is keyed per-SHA (not per-ref), matching the fix landed in
# #2149 (docker-images.yml) for the identical failure mode: grouping by
# github.ref alone means every push to main shares ONE group, so a
# fast-follow commit can cancel an in-flight or pending build for an
# earlier one. Per-SHA groups make that structurally impossible -- no two
# distinct commits' builds can ever collide.
#
# The LATEST tag is gated the same way #2149 gates it: not by build order
# (concurrent per-SHA builds can finish out of order), but by checking,
# immediately before tagging, whether the commit just built is STILL main's
# current head. An older build finishing late then publishes only its
# immutable sha tag and can never clobber `latest` with older content.
name: Build arc-runner image

on:
  push:
    branches: [main]
    paths:
      - docker/arc-runner/Dockerfile
      - .github/workflows/arc-runner-image.yml
      - go.mod
  pull_request:
    paths:
      - docker/arc-runner/Dockerfile
      - .github/workflows/arc-runner-image.yml
      - go.mod
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the image to ghcr.io (default: false)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-26.04-arm
    outputs:
      sha: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Single boolean, computed once, referenced everywhere below instead of
      # repeating this event-type expression on every step. team-lead +
      # ci-flakes (round 3): the prior two-build shape meant the checked
      # image (loaded locally) and the published image (a later, separate
      # build) were not provably the same bytes -- apt layers are not
      # reproducible across two builds on a cache miss. Fix is one build for
      # the whole run, not two conditionally-skipped ones.
      - name: Determine whether to publish
        id: publish
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ] \
             && { [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.push_image }}" = "true" ]; }; then
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.publish.outputs.should_publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI labels (org.opencontainers.image.revision/source/created/...) are
      # derived from the git context, not from the tag/latest decision, so
      # they can be computed now -- before the mainhead check -- and applied
      # to the one build below. Only human-readable TAGS need to wait for
      # that check; see the later "Docker meta" step for those.
      - name: Docker labels
        if: steps.publish.outputs.should_publish == 'true'
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/full-chaos/arc-runner

      # THE build -- exactly one, every event type. On a push (or a
      # push_image=true dispatch) it goes straight to ghcr.io BY DIGEST
      # ONLY: no tags decided yet, so nothing downstream depends on the
      # main-head check to have already run, and there is no second build
      # later to diverge from this one. The CGO check below and the eventual
      # published image are therefore the exact same bytes, not
      # same-Dockerfile-different-build stand-ins. On a PR (or a dry-run
      # dispatch) there's no registry login, so it stays local: loaded, not
      # pushed.
      - name: Build
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/arc-runner/Dockerfile
          platforms: linux/arm64
          tags: ${{ steps.publish.outputs.should_publish == 'true' && 'ghcr.io/full-chaos/arc-runner' || 'arc-runner:check' }}
          labels: ${{ steps.labels.outputs.labels }}
          outputs: ${{ steps.publish.outputs.should_publish == 'true' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=docker' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # In-image CGO check (team-lead, after CF's second pickup failed with
      # `-race requires cgo; CGO_ENABLED=1`). Go itself is not part of this
      # image -- a real job gets it from actions/setup-go, same as here --
      # so this step borrows THIS job's own setup-go binary and runs it
      # inside the image just built above, over its GOROOT mounted
      # read-only. That isolates what's actually being checked to what the
      # image itself provides (gcc, libc6-dev, i.e. CGO_ENABLED/CC
      # detection), not anything about the Go toolchain. When publishing,
      # this pulls the just-pushed digest from ghcr rather than a local
      # tag -- the same bytes that will end up tagged `latest`/`sha-...`.
      - name: Set up Go (for the in-image CGO check only)
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod

      - name: Check CGO toolchain inside the built image
        run: |
          set -euo pipefail
          image="arc-runner:check"
          if [ "${{ steps.publish.outputs.should_publish }}" = "true" ]; then
            image="ghcr.io/full-chaos/arc-runner@${{ steps.build.outputs.digest }}"
          fi
          docker run --rm --platform linux/arm64 \
            -v "$(go env GOROOT)":/usr/local/go:ro \
            -e PATH=/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            "$image" \
            sh -c 'echo "gcc: $(command -v gcc)"; go env CGO_ENABLED CC'

      - name: Determine whether this build is main's current head
        if: steps.publish.outputs.should_publish == 'true'
        id: mainhead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)"
          echo "built_sha=${{ github.sha }} current_main_sha=${current_main_sha}"
          if [ "${{ github.sha }}" = "${current_main_sha}" ]; then
            echo "is_main_head=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_main_head=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Docker meta
        if: steps.publish.outputs.should_publish == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/full-chaos/arc-runner
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && steps.mainhead.outputs.is_main_head == 'true' }}

      # Tags the ALREADY-PUSHED digest -- a manifest-copy, not a build, so
      # this is the actual fast, bounded action the main-head check gates.
      # Bash array, not jq + word-splitting: same reasoning docker-images.yml
      # (#2149) accepts as an intentional exception, sidestepped here rather
      # than repeated.
      - name: Tag and push
        if: steps.publish.outputs.should_publish == 'true'
        id: tag
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(-t "$t")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create "${args[@]}" \
            "ghcr.io/full-chaos/arc-runner@${{ steps.build.outputs.digest }}"

      # Job-level summary line. Note: I found no existing "ensure"-named job
      # or script anywhere in this repo's .github/ or ci/ to match a
      # specific established convention by that name -- this follows the
      # one $GITHUB_STEP_SUMMARY precedent that does exist here
      # (docs-cloudflare.yml). Flag if a different pattern was intended.
      # Codex round 2 (024f0e15, P3): a plain `if: <expr>` on mainhead/meta/
      # tag carries an IMPLICIT `&& success()` -- so if "Check CGO toolchain"
      # fails on a push after the digest was already pushed, tag/meta are
      # skipped and this fell through to the "not published, PR/dry-run"
      # branch, which is false on a push (the digest genuinely landed in the
      # registry, just never got human tags). Distinguish that case
      # explicitly rather than inferring it from steps.tag alone.
      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.tag.outcome }}" = "success" ]; then
              echo "✅ arc-runner image published: \`${{ steps.build.outputs.digest }}\`, tags: \`${{ steps.meta.outputs.tags }}\`"
            elif [ "${{ steps.build.outcome }}" = "success" ] && [ "${{ steps.publish.outputs.should_publish }}" != "true" ]; then
              echo "✅ arc-runner image build (not published, PR/dry-run): \`${{ steps.build.outputs.digest }}\`"
            elif [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "⚠️ arc-runner image pushed by digest but NOT tagged -- a later step (CGO check, main-head check, or tag) failed or was skipped: \`${{ steps.build.outputs.digest }}\`"
            else
              echo "❌ arc-runner image build failed (outcome: ${{ steps.build.outcome }})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
