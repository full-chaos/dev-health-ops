query AIAttributedPrs($orgId: String!, $dateRange: AIDateRangeInput!, $scope: AIScopeInput, $limit: Int! = 50, $offset: Int! = 0) {
  aiAttributedPrs(
    orgId: $orgId
    dateRange: $dateRange
    scope: $scope
    limit: $limit
    offset: $offset
  ) {
    orgId
    startDate
    endDate
    total
    hasMore
    dataAvailable
    rows {
      repoId
      number
      title
      kind
      workType
      teamId
      mergedAt
      __typename
    }
    __typename
  }
}