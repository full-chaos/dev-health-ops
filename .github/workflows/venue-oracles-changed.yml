# The `venue-oracles-changed` job (CHAOS-7653): the venue oracles of the packages
# a pull request changes, and only those. It is INFORMATIONAL (R430), not a
# required check: the full suite stays on main and by hand in venue-oracles.yml,
# which is deliberately not a pull_request workflow.
#
# WHAT IT RUNS. `ci/check_go.sh venue-oracles --changed FILE` selects the rows of
# ci/venue_oracle_registry.d/ whose package directory holds a path the PR changes
# (whole path segments: internal/apiservice/admin does not select
# internal/apiservice/adminllmvenue). A frozen venue test (golden replay) is the
# main target: a PR that touches a frozen venue sees its replay before merge.
# A path that ci/venue_oracle_triggers.d/ declares for a test also selects it: code
# outside the package of the test whose behaviour the test compares (a change of a
# `teams` write selects the protected-routes test of internal/apiservice).
# Nothing selected is a plain notice and the heavy steps do not run.
#
# COST PER PR (D6039a). The measured seconds of the selected rows (ci/venue_oracle_weights.d/):
# most venue packages are 1-10 minutes; internal/apiservice/admin alone is about 36. A change to a
# widely linked package selects most of the registry (~9,000 s of tests in all), more than one job
# may run in 60 minutes, so the job is a matrix of VENUE_LEGS legs: leg K runs the K-th of
# VENUE_LEGS cost-balanced slices of the SELECTED rows (`check_go.sh venue-oracles --changed FILE
# K VENUE_LEGS`), with no cap on what a change may select. Every leg reads the same change set
# and computes the same partition; a leg whose slice is empty is a green no-op and starts none of
# the heavy steps. Each leg's timeout is 60 minutes. A PR that changes no package with a registered venue
# test costs the checkout and the selection (seconds): the path filter below starts it
# only for changes under internal/, the GraphQL contract, the registry, or the gate itself.
#
# NOT COVERED, on purpose: a change to the harness (internal/testsupport/venueoracle),
# a shared helper outside a venue package that no trigger row declares, or the registry
# itself selects no package here; they are what the full main run is for. This is a bounded-cost early signal,
# never a substitute for it.
name: Venue oracles (changed packages)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'internal/**'
      - 'contracts/graphql/**'
      - 'ci/venue_oracle_registry.d/**'
      - 'ci/venue_oracle_triggers.d/**'
      - 'ci/venue_oracle_closure.d/**'
      - 'ci/check_go.sh'
      - '.github/workflows/venue-oracles-changed.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  venue-oracles-changed:
    if: (!(github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'ci:full')))
    name: venue-oracles (changed packages, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository_owner }}
      VENUE_LEGS: 4
      VENUE_LEG: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select the venue oracles of the changed packages
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only -z "${BASE_SHA}...${HEAD_SHA}" > changed.txt
          # The listing fails the step when the registry or a trigger file cannot be
          # read: a broken file must not read as "nothing selected".
          bash ci/check_go.sh venue-oracles --changed changed.txt --list "${VENUE_LEG}" "${VENUE_LEGS}" > listing.txt
          grep '^SELECT' listing.txt > selected.txt || true
          count="$(wc -l < selected.txt | tr -d ' ')"
          echo "leg ${VENUE_LEG}/${VENUE_LEGS} selected ${count} venue oracle test(s):"
          cat selected.txt
          if [ "${count}" -eq 0 ]; then
            echo "::notice title=VENUE ORACLES NOT RUN::no row of this leg's slice is selected (a change set that selects no registered venue oracle leaves every leg empty). This green is NOT oracle evidence."
            printf 'run=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'run=true\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Go
        if: steps.select.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Log in to GitHub Container Registry
        if: steps.select.outputs.run == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull pinned test dependency images with bounded retry
        if: steps.select.outputs.run == 'true'
        run: bash ci/check_go.sh integration-prepull

      - name: Run the venue oracles of the changed packages
        if: steps.select.outputs.run == 'true'
        env:
          DHO_CHAOS8509_CAPTURE_DIR: ${{ runner.temp }}/venue-oracle-receipt/chaos-8509
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/venue-oracle-receipt"
          mkdir -p "${DHO_CHAOS8509_CAPTURE_DIR}"
          bash ci/check_go.sh venue-oracles --changed changed.txt "${VENUE_LEG}" "${VENUE_LEGS}" 2>&1 | tee "${RUNNER_TEMP}/venue-oracle-receipt/receipt.log"

      - name: Upload the venue oracle receipt
        if: steps.select.outputs.run == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: venue-oracle-receipt-changed-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/venue-oracle-receipt/receipt.log
            ${{ runner.temp }}/venue-oracle-receipt/chaos-8509/*.json
          if-no-files-found: ignore
