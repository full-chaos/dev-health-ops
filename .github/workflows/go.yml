name: Go

on:
  push:
    # `main` only. On a feature branch this workflow's push and pull_request
    # runs shared one concurrency group (CHAOS-4676's design, deliberate) and
    # raced to cancel each other; the loser left a cancelled check-run carrying
    # a required context name, blocking the merge with nothing failing
    # (CHAOS-4814). Not firing on branches removes the twin rather than the
    # arbitration, so 4676's "one authoritative run per branch tip" now holds
    # because there is only one run.
    branches: [main]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'contracts/jobs/v1/**'
      - 'deploy/go-workers/**'
      - 'scripts/**'
      - 'src/dev_health_ops/api/**'
      - 'src/dev_health_ops/config/**'
      - 'src/dev_health_ops/connectors/**'
      - 'src/dev_health_ops/licensing/**'
      - 'src/dev_health_ops/llm/**'
      - 'src/dev_health_ops/metrics/**'
      - 'src/dev_health_ops/metrics/testops*.py'
      - 'src/dev_health_ops/migrations/clickhouse/**'
      # The auth lineage's SQL is //go:embed-ed into
      # internal/storage/postgres/authschema, so a change to it changes the
      # compiled binary and is covered by that package's tests -- but it is
      # a .sql file, which no other pattern here matches (CHAOS-4882).
      - 'internal/storage/postgres/authschema/migrations/**'
      - 'src/dev_health_ops/models/**'
      - 'src/dev_health_ops/parsers/**'
      - 'src/dev_health_ops/processors/**'
      - 'src/dev_health_ops/providers/**'
      - 'src/dev_health_ops/storage/repository_rows.py'
      - 'src/dev_health_ops/sync/**'
      - 'src/dev_health_ops/workers/**'
      - 'src/dev_health_ops/workers/job_contracts/**'
      - 'src/dev_health_ops/work_graph/**'
      - 'tests/fixtures/**'
      - '**/testdata/**'
      # Go tests read these directly (contracts/*.json via os.ReadFile,
      # internal/**/families.json via filepath.Join). Not under testdata/
      # or fixtures/, so the shared glob above does not reach them.
      - 'contracts/**'
      - 'internal/**/*.json'
      - 'tests/workers/job_contracts/**'
      # CHAOS-4977: investmentexplain's LLM prompt template is
      # //go:embed-ed and read directly by prompt_golden_test.go -- not
      # under testdata/ or fixtures/, so the shared glob above does not
      # reach it.
      - 'cmd/query-api/internal/investmentexplain/prompts/**'
      - 'docker/go-worker.Dockerfile'
      - 'docker/query-api.Dockerfile'
      - 'tests/compatibility/river/**'
      - 'ci/check_go.sh'
      - 'ci/go_integration_shards.tsv'
      - 'ci/go_providersync_test_shards.tsv'
      - 'ci/requirements-live-python-oracles.txt'
      - 'ci/check_go_containers.sh'
      - 'ci/check_river_compat_static.sh'
      # CHAOS-4915: the pinned linter, its self-test and its negative-control
      # fixture must trigger the job that validates them. A file that cannot
      # trigger its own check can be broken by a commit that never runs it.
      - 'ci/shellcheck_pinned.sh'
      - 'ci/check_shellcheck_pin.sh'
      - 'ci/fixtures/shellcheck_unclean_fixture.sh'
      # go-quality.yml HOSTS those steps, and codex round 1 found it was not
      # itself Go-relevant: `ci/go_relevance.py` returned relevant=false for it,
      # so a commit editing ONLY that workflow -- including one that removes the
      # pin's install or check step -- would green-skip the very enforcement it
      # was editing. Verified before and after this line was added.
      - '.github/workflows/go-quality.yml'
      # lefthook.yml holds the LOCAL half of the same pin. codex round 2 (P2):
      # a lefthook-only change is relevant=false, so removing the pre-push hook
      # would land with the pin's own CI job never running. The hook's presence
      # is additionally asserted by ci/check_shellcheck_pin.sh, so deleting it
      # now fails a check rather than silently un-wiring local enforcement.
      - 'lefthook.yml'
      - 'ci/evidence/go-worker-migration/**'
      # - 'ci/local_validate.sh'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/go.yml'
  pull_request:
    branches: ['**']
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'contracts/jobs/v1/**'
      - 'deploy/go-workers/**'
      - 'scripts/**'
      - 'src/dev_health_ops/api/**'
      - 'src/dev_health_ops/config/**'
      - 'src/dev_health_ops/connectors/**'
      - 'src/dev_health_ops/licensing/**'
      - 'src/dev_health_ops/llm/**'
      - 'src/dev_health_ops/metrics/**'
      - 'src/dev_health_ops/metrics/testops*.py'
      - 'src/dev_health_ops/migrations/clickhouse/**'
      # The auth lineage's SQL is //go:embed-ed into
      # internal/storage/postgres/authschema, so a change to it changes the
      # compiled binary and is covered by that package's tests -- but it is
      # a .sql file, which no other pattern here matches (CHAOS-4882).
      - 'internal/storage/postgres/authschema/migrations/**'
      - 'src/dev_health_ops/models/**'
      - 'src/dev_health_ops/parsers/**'
      - 'src/dev_health_ops/processors/**'
      - 'src/dev_health_ops/providers/**'
      - 'src/dev_health_ops/storage/repository_rows.py'
      - 'src/dev_health_ops/sync/**'
      - 'src/dev_health_ops/workers/**'
      - 'src/dev_health_ops/workers/job_contracts/**'
      - 'src/dev_health_ops/work_graph/**'
      - 'tests/fixtures/**'
      - '**/testdata/**'
      # Go tests read these directly (contracts/*.json via os.ReadFile,
      # internal/**/families.json via filepath.Join). Not under testdata/
      # or fixtures/, so the shared glob above does not reach them.
      - 'contracts/**'
      - 'internal/**/*.json'
      - 'tests/workers/job_contracts/**'
      # CHAOS-4977: investmentexplain's LLM prompt template is
      # //go:embed-ed and read directly by prompt_golden_test.go -- not
      # under testdata/ or fixtures/, so the shared glob above does not
      # reach it.
      - 'cmd/query-api/internal/investmentexplain/prompts/**'
      - 'docker/go-worker.Dockerfile'
      - 'docker/query-api.Dockerfile'
      - 'tests/compatibility/river/**'
      - 'ci/check_go.sh'
      - 'ci/go_integration_shards.tsv'
      - 'ci/go_providersync_test_shards.tsv'
      - 'ci/requirements-live-python-oracles.txt'
      - 'ci/check_go_containers.sh'
      - 'ci/check_river_compat_static.sh'
      # CHAOS-4915: the pinned linter, its self-test and its negative-control
      # fixture must trigger the job that validates them. A file that cannot
      # trigger its own check can be broken by a commit that never runs it.
      - 'ci/shellcheck_pinned.sh'
      - 'ci/check_shellcheck_pin.sh'
      - 'ci/fixtures/shellcheck_unclean_fixture.sh'
      # go-quality.yml HOSTS those steps, and codex round 1 found it was not
      # itself Go-relevant: `ci/go_relevance.py` returned relevant=false for it,
      # so a commit editing ONLY that workflow -- including one that removes the
      # pin's install or check step -- would green-skip the very enforcement it
      # was editing. Verified before and after this line was added.
      - '.github/workflows/go-quality.yml'
      # lefthook.yml holds the LOCAL half of the same pin. codex round 2 (P2):
      # a lefthook-only change is relevant=false, so removing the pre-push hook
      # would land with the pin's own CI job never running. The hook's presence
      # is additionally asserted by ci/check_shellcheck_pin.sh, so deleting it
      # now fails a check rather than silently un-wiring local enforcement.
      - 'lefthook.yml'
      - 'ci/evidence/go-worker-migration/**'
      # - 'ci/local_validate.sh'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/go.yml'
  merge_group:
  workflow_dispatch:
  # CHAOS-3948 turned `push` off (see the concurrency block below for why)
  # and added this scheduled run against main's HEAD (`schedule` always
  # targets the default branch) as a fixed-cost, one-fan-out-a-day backstop
  # so main still got some Go CI between merges.
  #
  # Push was later re-enabled across all branches, which is what produced the
  # cancelled-twin race CHAOS-4814 traced; it is now scoped to `main` only.
  # So a branch with no open PR gets NO Go run -- branch protection gates on
  # the PR, so nothing merges unproven, but there is no pre-PR coverage and
  # this schedule is not a substitute for it: `schedule` targets main's HEAD,
  # never a feature branch. It backstops MAIN between merges, which is what
  # CHAOS-3948 built it for. `workflow_dispatch` above gives a one-click way
  # to run the full matrix against main on demand.
  schedule:
    - cron: '17 8 * * *'

concurrency:
  # CHAOS-4676 (redesigned round 6, replacing the imperative `guard` job
  # after 5 rounds of a lookup/cancel/poll approach that each surfaced a
  # new race or silent-pass mode — a distributed-consistency problem does
  # not belong solved with best-effort REST calls inside a CI job). `push`
  # and `pull_request` runs for the SAME branch now share ONE concurrency
  # group, so GitHub itself is the single source of truth for "only one
  # authoritative run per branch tip" — no lookups, no polls, no
  # eventual-consistency windows. See the design note in
  # .codex-review-context.md for the full ordering analysis (push-then-PR-
  # open, PR-open-then-push, ordinary re-push) and how each of the prior
  # 10 findings is now structurally impossible or obsolete.
  #
  # `github.head_ref` is the PR's source branch name (set only for
  # pull_request/pull_request_target) and empty for push, so it falls
  # through to `github.ref_name` (the pushed branch name) there — the same
  # branch produces the same group key from either trigger.
  #
  # CHAOS-4814 amended HOW that single group is reached, not the group. The
  # shared key was doing two jobs: bounding a branch to one live fan-out, and
  # arbitrating between a push run and a pull_request run for the SAME commit.
  # The second job cost more than it saved. Both events fired on every feature
  # branch, they were created in the same second, and the loser left a CANCELLED
  # check-run carrying a REQUIRED context name on the head commit -- branch
  # protection then refused the merge while every workflow run reported success
  # and `gh pr checks` showed green. Measured on #2110: 15 cancelled check-runs,
  # BLOCKED, nothing failing. Racy rather than certain (#2115's twins both
  # survived), which is why it read as flake for weeks.
  #
  # `push` is now restricted to `main`, so on a feature branch only
  # `pull_request` fires and there is no twin to arbitrate. The invariant is
  # unchanged and now holds trivially: ONE authoritative run per branch tip,
  # because there is only one run. The group still bounds re-pushes and it still
  # protects `main` and the merge queue below.
  #
  # Cost, stated plainly: a branch pushed with no PR open gets no Go run until
  # the PR is opened. Branch protection gates on the PR, so nothing merges
  # unproven -- what is lost is early feedback before a PR exists.
  #
  # CHAOS-4906 fleet audit (09-03, chris binding, incident-informed)
  # replaced the shared head_ref/ref_name key above with the canonical
  # fleet-wide shape: PR number for pull_request, ref for a push to a
  # non-main branch (none exist today -- push is main-only), commit sha for
  # a push to main or a merge_group entry. Practical effect on the ordinary
  # case is NONE -- push only ever fires on main, so a feature-branch PR's
  # group was already the only run on that branch either way. The one edge
  # case that changes is a main-headed PR (real precedent: #1274) racing an
  # actual main push: previously they deliberately SHARED the `head_ref ||
  # ref_name` group (CHAOS-4676) so GitHub's own queue would arbitrate a
  # single winner -- which is exactly what caused CHAOS-4676's incident
  # (the loser left a CANCELLED required check-run, branch protection
  # BLOCKED with everything green). Under the canonical key the PR gets its
  # own PR-number group and the push gets its own sha group -- they can no
  # longer collide or cancel each other at all, at the cost of occasionally
  # running both instead of arbitrating to one. A stronger guarantee for a
  # rarer, cheaper cost.
  #
  # merge_group runs must still not be cancelled: a burst of merges lands
  # several within the same group in quick succession, and cancelling all
  # but the last before go-storage-integration finishes means most merges
  # never get a real pass/fail, only "cancelled". The canonical key achieves
  # this the same way it protects main: merge_group entries are sha-keyed,
  # never colliding with each other, and the cancel expression below only
  # ever fires for `pull_request` or a non-main `push` -- `merge_group` is
  # neither, so it is structurally never cancelled, same as before.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read
  # Pull the mirrored test-dependency images from ghcr.io. Works whether the
  # packages are private or public, so CI does not depend on their visibility.
  packages: read

jobs:
  # Runner contract v1.6 (signed 2026-09-03, chris via CF team-lead,
  # /Users/chris/projects/full-chaos/dev-health/.remember/lanes/
  # lane-4904-acr-runners/contract-v1.6-signed.md -- supersedes v1.5.1's
  # fallback-poller pattern for routed jobs) originally gave this job TWO
  # legs sharing one `name:` (a hosted `ubuntu-26.04-arm` leg plus this
  # self-hosted one), same shape as go-container-reproducibility below.
  #
  # HOSTED LEG DROPPED (chris 2026-09-04 16:59): the enterprise's
  # GitHub-hosted runner label list is exactly ubuntu-latest/ubuntu-22.04/
  # ubuntu-24.04 (+ windows/macos) -- ubuntu-26.04-arm was never a real
  # hosted label there. There is no non-arm64 substitute either: this job's
  # entire purpose is proving CHAOS-4818's FMA bit-pattern behavior on REAL
  # arm64 hardware (see "Confirm this runner is actually arm64" below,
  # which fails loud rather than silently validate the wrong
  # architecture), so an x64 fallback would prove nothing and is worse than
  # not running. This job (id kept as `go-arm64-numeric-parity`, dropping
  # the old `-self-hosted` suffix so it is the sole, direct producer of the
  # `go-arm64-numeric-parity` check) now runs ONLY when the ARC pool is
  # routable: `vars.SELF_HOSTED_RUNNERS == 'enabled'` and not a fork PR
  # (fork PRs never get a self-hosted runner in a public repo). When
  # SELF_HOSTED_RUNNERS is 'disabled', or on a fork PR, this check simply
  # does not run -- it is not one of the five ruleset-required contexts, so
  # that is a coverage gap, not a merge blocker.
  #
  # Sizing kept at this job's pre-poller baseline (timeout-minutes: 10,
  # unchanged since 97792e2b2/CHAOS-4818's original single-job version).
  # The `-timeout 8m` inner bound (328f91ca0) already leaves >2m of headroom
  # under that outer cap and fires with an actionable goroutine dump before
  # an ambiguous job-level cancellation could.
  go-arm64-numeric-parity:
    name: go-arm64-numeric-parity
    if: >-
      vars.SELF_HOSTED_RUNNERS == 'enabled' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.ref == '' || github.event.inputs.ref == null)) ||
      github.event_name == 'release' ||
      github.event_name == 'schedule')
    runs-on: [self-hosted, oci-arc-runners]
    timeout-minutes: 10
    env:
      # CHAOS-4906 pool module cache (09-03): same warm, persistent
      # GOMODCACHE/GOCACHE this pool's other setup-go-using self-hosted
      # jobs restate explicitly (see go-storage-integration-shard-
      # self-hosted's identical comment) -- helm rev 6, hostPath at
      # /var/lib/oci-arc-runners/go-cache on bigboy. NEVER run `go clean
      # -cache`/`go clean -modcache` against this path -- shared,
      # cross-job, cross-repo; cleanup ownership is the pool's.
      GOMODCACHE: /mnt/go-cache/mod
      GOCACHE: /mnt/go-cache/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
          # `false`: actions/setup-go's own cache defaults to `true`,
          # which would restore/save a GitHub Actions cache TARBALL into
          # the pool's persistent, concurrently-shared hostPath above --
          # a real corruption risk against other jobs/legs reading and
          # writing it simultaneously on this single-node pool. Same
          # reasoning as go-storage-integration-shard-self-hosted's
          # identical setting.
          cache: false

      - name: Confirm this runner is actually arm64
        run: |
          set -euo pipefail
          arch="$(go env GOARCH)"
          if [ "${arch}" != "arm64" ]; then
            echo "expected GOARCH=arm64 on oci-arc-runners, got '${arch}'" >&2
            exit 1
          fi

      - name: Run FMA bit-pattern goldens on real arm64
        run: |
          set -euo pipefail
          # -timeout 8m: double-bound lesson from acr's own self-hosted
          # sibling (CF, 09-03) -- a job relying solely on its outer
          # `timeout-minutes` risks ordinary wall-time variance turning an
          # actually-passing run into an ambiguous job CANCELLED, instead of
          # a real test failure with an actionable goroutine dump. this
          # job's own one real measurement (1m12s total, run
          # 33728426935, job 100573965740) shows 8m is generous, but that
          # measurement is n=1, which is exactly why the inner bound
          # matters: it fails loud on its own terms rather than depending
          # on that single data point staying representative.
          go test -mod=readonly -count=1 -timeout 8m -json ./internal/jobs/... \
            -run '(MatchesLivePythonBitExact|IntegerPercentilesMatchesLivePython)$' \
            | tee go-test-output.json
          ran=$(jq -s '[.[] | select(.Action=="run" and (.Test // "") != "")] | length' go-test-output.json)
          echo "tests actually run: ${ran}"
          if [ "${ran}" -eq 0 ]; then
            echo "0 tests matched the -run pattern -- this job would prove NOTHING and stay green even if every named test were renamed or deleted. Failing loud rather than reporting a silent pass." >&2
            exit 1
          fi

  go-storage-integration-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Validate and emit deterministic integration shards
        id: plan
        run: bash ci/check_go.sh integration-shard-plan

  # Runner contract v1.6 (signed 2026-09-03, chris via CF team-lead,
  # /Users/chris/projects/full-chaos/dev-health/.remember/lanes/
  # lane-4904-acr-runners/contract-v1.6-signed.md -- supersedes v1.5.1's
  # fallback-poller pattern for routed jobs). go-container-reproducibility
  # further down needs a working Docker daemon for its real container
  # builds. Byte-identical precondition job to docker-images.yml's own
  # dind-smoke-test (#2180), which has not proven this pool's dind
  # capability in production either (that PR is still open) -- this
  # proves it independently for go.yml's own use, per the contract's
  # "docker-socket/testcontainers jobs only after the pool's dind is
  # proven for that job" clause.
  #
  # go-storage-integration-shard was ALSO routed through this pool in an
  # earlier version of this PR; reverted (chris ruling 09-03, via CF): 5
  # of its 6 shard legs timed out at the pool's 25m inner cap under real
  # co-tenancy (5-8 concurrent pods across ops+acr, plus two bigboy-native
  # suites and a codex round sharing the same 16-core box), measured
  # against the SAME shards' consistent ~12min wall on hosted runners
  # (6 green runs, 11m27s-12m44s, never close to 20min) -- a genuine 2x+
  # contention penalty, not a cache-cold or timeout-sizing problem
  # (GOMODCACHE/GOCACHE were confirmed warm throughout, zero `go:
  # downloading` lines in any failed shard's log). The pool has no
  # additional cores to give this suite (chris: maxRunners stays 8,
  # hosted-60 is the intended overflow for contention-sensitive suites).
  # go-container-reproducibility and this dind-smoke-test precondition
  # stay on the pool -- both passed clean on the same warm-cache run
  # (16m44s, well under its own 25m cap) and are not matrix/concurrency-
  # sensitive the way six simultaneous shard legs are.
  dind-smoke-test:
    if: vars.SELF_HOSTED_RUNNERS == 'enabled' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.ref == '' || github.event.inputs.ref == null)) || github.event_name == 'release' || github.event_name == 'schedule')
    runs-on: [self-hosted, oci-arc-runners]
    # CHAOS-4906 (09-04): job-level `concurrency:` serialization was tried
    # here and on go-container-reproducibility-self-hosted, then REVERTED
    # the same day -- GitHub's concurrency semantics allow at most ONE
    # running AND ONE pending job per group; a THIRD event's job then
    # cancels the still-pending second one, `cancel-in-progress: false`
    # notwithstanding (that setting only protects a job already RUNNING).
    # Measured: with #2197/#2199/#2192 pushing minutes apart, #2197's
    # go-container-reproducibility was cancelled at 2m40s -- a required
    # check turned red by a job-level group meant to help it. No
    # replacement serialization mechanism here; see the 57m/51m sizing
    # below (CHAOS-5067) for how contention is handled instead (accept
    # variance, size the cap to survive it, not queue jobs against each
    # other).
    timeout-minutes: 5
    steps:
      - name: Confirm a Docker daemon is reachable
        run: |
          set -euo pipefail
          if ! docker info > docker-info.txt 2>&1; then
            echo "FATAL: docker info failed on this oci-arc-runners pod, no reachable Docker daemon -- see docker-info.txt in the job log for the actual error." >&2
            cat docker-info.txt >&2
            exit 1
          fi
          echo "docker info succeeded:"
          cat docker-info.txt

      - name: Confirm the daemon can actually build and run a container
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf -- "${workdir}"' EXIT
          printf 'FROM busybox\nCMD ["echo", "dind-smoke-test-ok"]\n' > "${workdir}/Dockerfile"
          if ! docker build -t dind-smoke-test:local "${workdir}"; then
            echo "FATAL: docker build failed on this oci-arc-runners pod, the daemon answers docker info but cannot build an image." >&2
            exit 1
          fi
          output="$(docker run --rm dind-smoke-test:local)"
          docker rmi dind-smoke-test:local > /dev/null 2>&1 || true
          if [ "${output}" != "dind-smoke-test-ok" ]; then
            echo "FATAL: built the smoke-test image but docker run produced ${output@Q}, expected dind-smoke-test-ok." >&2
            exit 1
          fi
          echo "docker build + run succeeded: ${output}"

  # Hosted-only (chris ruling 09-03, via CF, after a measured pool
  # contention penalty -- see the comment above dind-smoke-test above):
  # this job briefly had a self-hosted twin gated on SELF_HOSTED_RUNNERS,
  # same shape as go-container-reproducibility below. Reverted; the pool
  # stays for go-container-reproducibility only.
  go-storage-integration-shard:
    name: go-storage-integration-shard-${{ matrix.target }}-${{ matrix.shard }}
    needs: go-storage-integration-plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.go-storage-integration-plan.outputs.matrix) }}
    env:
      # Redirect every registry-less Docker Hub pull -- the harness images AND
      # testcontainers-go's own hardcoded reaper -- at the ghcr mirror. Job-level
      # on purpose: the pre-pull warms the ref, and testcontainers resolves it
      # again when a test starts a container, so both need the same value.
      # The pins stay literal; the mirrored digests are identical to upstream.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      # The derived work-item integration tests migrate their throwaway
      # ClickHouse container with the project's REAL migration chain
      # (internal/testsupport/chschema), which shells out to Python. This job
      # previously installed no Python dependencies at all, so that helper died
      # with ModuleNotFoundError. The closure is pinned and installed with
      # --no-deps for the same reason go-quality's is: an undeclared dependency
      # must fail loudly rather than drift to latest.
      - name: Set up Python 3.14 for the ClickHouse migration chain
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install locked ClickHouse migration dependencies
        run: python -m pip install --no-deps -r ci/requirements-clickhouse-migrations.txt

      # Authenticated Docker Hub pulls. Anonymous pulls are rate limited per IP,
      # and a hosted runner shares that IP with everyone else on it -- which is
      # how run 33572737859 got `unauthorized: authentication required` while
      # creating a container (CHAOS-4778). The pre-pull step below turns a
      # transient rejection into three visible attempts; this step is what stops
      # the rejection happening in the first place.
      #
      # Skipped on fork pull requests, where `secrets.*` are empty by design:
      # those runs fall back to anonymous pulls plus the bounded retry rather
      # than failing at login.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull pinned test dependency images with bounded retry
        run: bash ci/check_go.sh integration-prepull

      - name: Run isolated storage integration shard ${{ matrix.target }} ${{ matrix.shard }}
        run: bash ci/check_go.sh integration-shard "${{ matrix.target }}" "${{ matrix.shard }}"

  # Preserve the existing required-check contract while the implementation
  # fans out behind it. fail-fast is disabled above, so this job observes the
  # aggregate result only after every shard has reached a terminal state.
  go-storage-integration:
    name: go-storage-integration
    needs:
      - go-storage-integration-plan
      - go-storage-integration-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLAN_RESULT: ${{ needs.go-storage-integration-plan.result }}
      SHARD_RESULT: ${{ needs.go-storage-integration-shard.result }}
    steps:
      - name: Require the plan and every shard to have passed
        run: |
          set -euo pipefail
          if [ "${PLAN_RESULT}" != "success" ]; then
            echo "integration plan result: ${PLAN_RESULT}" >&2
            exit 1
          fi
          if [ "${SHARD_RESULT}" != "success" ]; then
            echo "shard result: ${SHARD_RESULT}" >&2
            exit 1
          fi
          echo "all deterministic Go integration shards passed"

  go-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and smoke Go images
        run: bash ci/check_go_containers.sh smoke

  go-container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [worker, scheduler, reconciler, stream-runner, operator, contractcheck, migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.target }} security image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker build \
            --file docker/go-worker.Dockerfile \
            --target "${TARGET}" \
            --build-arg VERSION=phase1-ci \
            --build-arg COMMIT=0000000000000000000000000000000000000000 \
            --build-arg BUILD_TIME=1970-01-01T00:00:00Z \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --tag "dev-health-go-${TARGET}:security" \
            .

      # CHAOS-5012: the syft installer that anchore/sbom-action runs
      # internally (curl + checksum verify against a GitHub release) flakes
      # intermittently -- HTTP 302 redirect followed by a checksum mismatch
      # on the downloaded binary. The main action checks the runner's Action
      # tool cache first (getSyftCommand -> cache.find) and only falls back
      # to its own installer on a cache miss, so warming the cache here with
      # up to 3 attempts of the same sub-action lets a transient redirect/
      # checksum flake retry away before the real SBOM step ever needs to
      # download anything itself.
      - name: Warm the syft tool cache (attempt 1)
        id: syft-download-1
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.42.3

      - name: Warm the syft tool cache (attempt 2)
        id: syft-download-2
        if: steps.syft-download-1.outcome == 'failure'
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.42.3

      - name: Warm the syft tool cache (attempt 3)
        id: syft-download-3
        if: steps.syft-download-2.outcome == 'failure'
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.42.3

      - name: Generate ${{ matrix.target }} SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: dev-health-go-${{ matrix.target }}:security
          format: spdx-json
          artifact-name: go-${{ matrix.target }}-sbom.spdx.json
          syft-version: v1.42.3
          dependency-snapshot: false
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Scan ${{ matrix.target }} for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dev-health-go-${{ matrix.target }}:security
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          version: v0.70.0

  # CHAOS-5014: docker/query-api.Dockerfile had no CI coverage at all --
  # unlike docker/go-worker.Dockerfile above, nothing built it, so #2197
  # landed importing cmd/query-api/internal/investmentexplain (which
  # reaches internal/pythonparity, internal/jobs/investment/categorize,
  # internal/jobs/workgraph/units) plus investment_explain_route.go's own
  # internal/storage/clickhouse import, none of which this Dockerfile's
  # build context carried, and nothing failed. Build-only, no publish (no
  # tag anyone deploys from, no push, no families/fan-in change) --
  # ruled: a build-verification check, not a new published image. Native
  # arch only (this catches a broken import graph regardless of target
  # platform; a real publish job, if one is ever wanted, is a separate
  # decision). Same plain `docker build`/no-buildx-setup shape as
  # go-container-security above -- NOT `docker/setup-buildx-action`: that
  # action pulls moby/buildkit straight from Docker Hub before any login
  # step runs (tests/tooling/test_go_integration_sharding.py's image-pull
  # allowlist guard caught this immediately), and the runner's own default
  # builder already builds this Dockerfile fine without it, same as its
  # sibling job.
  query-api-container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build query-api image
        run: |
          docker build \
            --file docker/query-api.Dockerfile \
            --target runtime \
            --build-arg VERSION=phase1-ci \
            --build-arg COMMIT=0000000000000000000000000000000000000000 \
            --build-arg BUILD_TIME=1970-01-01T00:00:00Z \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --tag query-api:build-check \
            .

  # Runner contract v1.6: exactly one of this job and its self-hosted twin
  # below runs per workflow run -- no aggregator wrapper needed here (a
  # single job, unlike the shard matrix above), since both share the same
  # `name:` directly and branch protection resolves the required check on
  # that name regardless of which leg actually ran.
  go-container-reproducibility:
    name: go-container-reproducibility
    if: >-
      !(vars.SELF_HOSTED_RUNNERS == 'enabled' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.ref == '' || github.event.inputs.ref == null)) ||
      github.event_name == 'release' ||
      github.event_name == 'schedule'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify reproducible Go images
        run: bash ci/check_go_containers.sh reproducible

  go-container-reproducibility-self-hosted:
    name: go-container-reproducibility
    needs: dind-smoke-test
    if: >-
      vars.SELF_HOSTED_RUNNERS == 'enabled' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.ref == '' || github.event.inputs.ref == null)) ||
      github.event_name == 'release' ||
      github.event_name == 'schedule')
    runs-on: [self-hosted, oci-arc-runners]
    # CHAOS-4906 (09-04): a job-level `concurrency:` group was added here
    # the same day to serialize pool access (two concurrent
    # reproducibility runs turned an 18m03s isolated run into two runs
    # both timing out at the then 20m inner cap: run 33822145677 succeeded
    # alone at 18m03s, run 33822592791 failed at 20m16s while it overlapped
    # that same run) -- then REVERTED a few hours later, same day: GitHub's
    # concurrency semantics allow at most ONE running AND ONE pending job
    # per group; a THIRD event's job then cancels the still-pending SECOND
    # one, `cancel-in-progress: false` notwithstanding (that setting only
    # protects a job already RUNNING, not one waiting behind it). Measured:
    # with #2197/#2199/#2192 pushing minutes apart, #2197's
    # go-container-reproducibility -- a REQUIRED check -- was cancelled at
    # 2m40s by this exact mechanism, turning it red. No replacement
    # serialization here; the 36m/30m sizing below is the actual answer to
    # contention -- accept the variance, size the cap to survive it.
    # 36m (measured 18m03s wall under load, run 33822145677, isolated from
    # any overlapping pool consumer -- contract v1.6's own sizing clause:
    # timeout-minutes = max measured wall under load x2). Serialization
    # above means the NEXT run in the queue no longer has to survive
    # contention from a concurrent sibling, but the cap still has to
    # survive ordinary variance in a single, uncontended run.
    #
    # CHAOS-5067 (09-04): the 36m/30m pair above proved too tight under
    # REAL host contention (load1 100-124 on the oci-arc-runners pool,
    # concurrent codex rounds + other jobs) -- four runs died at ~30m2xs
    # with exit 124 / "Canceled: context canceled" against the 30m inner
    # cap, and a successful rerun still took 28m44s, both past the
    # 18m03s isolated baseline the 36m/30m pair was sized from. New max
    # measured wall under load = 28m44s (supersedes 18m03s). Same
    # contract formula, same rounding (double the exact wall, floor to
    # whole minutes -- 18m03s x2 = 36m06s -> 36m; 28m44s x2 = 57m28s ->
    # 57m): outer becomes 57m. Inner keeps the same 6m buffer the
    # original pair used (36m - 30m = 6m), fixed headroom for
    # checkout/binary-startup variance rather than a percentage of the
    # run: 57m - 6m = 51m.
    timeout-minutes: 57
    env:
      # CHAOS-4906 pool module cache (09-03): this job has no `setup-go`
      # step of its own (ci/check_go_containers.sh shells out to `go`
      # directly), so it already inherits GOMODCACHE/GOCACHE from the pod
      # env (helm rev 6, oci-arc-runners `runner` container -- hostPath at
      # /var/lib/oci-arc-runners/go-cache on bigboy). Restated here for a
      # reader of this file, not because it changes behaviour. NEVER run
      # `go clean -cache`/`go clean -modcache` against this path -- shared,
      # cross-job, cross-repo; cleanup ownership is the pool's.
      GOMODCACHE: /mnt/go-cache/mod
      GOCACHE: /mnt/go-cache/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify reproducible Go images
        # timeout 51m: inner test timeout strictly shorter than the 57m
        # outer cap (CHAOS-5067, 09-04 -- resized from a 28m44s measured
        # wall under real contention, see the job-level comment above),
        # per the contract -- fails loud on a genuine hang instead of an
        # ambiguous job-level cancellation.
        run: timeout 51m bash ci/check_go_containers.sh reproducible

  river-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Compose cannot read TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX, so the
      # compose file takes its own variable with the same meaning. The trailing
      # slash is part of the VALUE, and the file defaults it to empty, so a local
      # `docker compose up` is unchanged and still pulls upstream.
      TEST_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      # DELIBERATELY 3.13.14, NOT the project's shipped 3.14. river-compatibility
      # is a Phase 0 probe for a REJECTED production option, pinned to the last
      # interpreter it was proven against; tests/compatibility/river/run.sh sets
      # PYTHON_VERSION="3.13.14" and fails closed on any other patch, and its
      # README states the probe "is not expected to track the project's floor".
      # Do not align this one with the other two.
      - name: Set up Python 3.13.14 for the rejected-option River probe
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'

      - name: Install pinned Python compatibility dependencies
        run: >-
          python -m pip install
          asyncpg==0.31.0
          greenlet==3.5.0
          riverqueue==0.7.0
          SQLAlchemy==2.0.49

      - name: Run live River compatibility matrix
        env:
          RIVER_COMPAT_PYTHON: python
        run: |
          tests/compatibility/river/run.sh > "${RUNNER_TEMP}/river-compatibility.json"
          jq -e '
            .status == "complete_with_architecture_blocker"
            and .nested_n_minus_1.status == "pass"
            and [.profiles[].mode] == ["direct", "poll-only", "session"]
            and (.gate_truth_table | keys) == ["direct", "poll_only", "session"]
          ' "${RUNNER_TEMP}/river-compatibility.json" >/dev/null

      - name: Upload sanitized compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: river-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/river-compatibility.json
          if-no-files-found: ignore
          retention-days: 14

  graphql-wire-parity:
    # CHAOS-4696: query-api's registered-document consts must digest-match
    # what a real client actually sends. The wire form can ONLY be
    # computed correctly by the web repo's own pinned @urql/core/graphql
    # (see cmd/query-api/query_route.go's registeredFeatureFlagsDocument
    # doc comment for why a Go-side reimplementation of urql's printer is
    # the exact class of bug this ticket is about) -- so this job checks
    # out dev-health-web's LIVE main (not a pin: a version bump to
    # @urql/core/graphql that changes wire output must go red here
    # immediately, not go stale behind a re-pin) and runs its
    # graphql-wire-parity check against THIS repo's own HEAD.
    #
    # This is the mirror image of dev-health-web's `quality` job, which
    # checks out ops main and runs the SAME script against web's own HEAD
    # (scripts/graphql-wire-parity.ts, web repo). Together the two jobs
    # guarantee neither repo can independently drift out of parity without
    # its OWN CI catching it -- an ops-only PR that breaks parity fails
    # here without needing a web PR to exist, and vice versa.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout dev-health-web main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: full-chaos/dev-health-web
          ref: main
          path: dev-health-web-main
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: dev-health-web-main/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dev-health-web-main/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: dev-health-web-main
        run: pnpm install --frozen-lockfile

      - name: Run graphql-wire-parity check against this repo's HEAD
        working-directory: dev-health-web-main
        run: pnpm graphql:wire-parity:check --ops-root "${{ github.workspace }}"
