  # ---- the auth venue (CHAOS-12976): auth-service and the workload token of acr-api, the prod target shape ----
  # The services of ops compose.yml's `auth` profile (auth-keys-init, auth-provision, auth-owner-grants, auth-migrate, auth-grants,
  # auth-fence-init, auth-workload-seed, auth-service), the acr-api bootstrap pair of acr deploy/compose/acr-auth-workload.compose.yml
  # (acr-workload-volume, acr-workload-bootstrap), and auth-issuer, the https origin of the token issuer. All are in profile `auth`;
  # every command names its services, as everywhere in this file:
  #   docker compose -p dev-health ... -f ops/ci/bigboy/compose.bigboy.yml --profile auth up -d --no-deps --no-build <service>
  # Order: auth-keys-init, auth-provision, auth-owner-grants (after the ops `migrate`), auth-migrate, auth-grants, auth-fence-init,
  # auth-workload-seed, auth-service, auth-issuer; then once `run --rm acr-workload-bootstrap` (never a depends_on: a later `up`
  # would run bootstrap-create again, and it refuses a workload with a live credential); go-api reads the principal of the workload
  # acr-api from the registry, so nothing else is recreated. README "auth venue" has the commands.
  # Isolation (CHAOS-4886): auth-service and the auth one-shots are on auth_plane, where only postgres joins them. acr-api reaches
  # auth-service on acr_auth_workload (only the two of them; acr-api never joins auth_plane). go-api reaches the issuer origin
  # (auth-issuer, alias auth.bigboy.internal on dev-health), which forwards only the discovery and JWKS documents.
  # Values: the issuer https://auth.bigboy.internal:8443 is a signed claim; auth-service, go-api and acr-api carry the same literal.
  # The signing key is made in the venue (auth-keys-init, volume auth_signing_keys); the TLS pair of auth-issuer is a host test pair
  # (README); the database logins have the local test passwords of compose.yml. No prod secret is in the venue.
  auth-keys-init:
    cap_drop: [ALL]
    command:
    - mint
    - envelope-keys
    - --dir=/var/lib/dev-health/envelope-keys
    - --key-id=auth-signing-bigboy
    - --skip-existing
    image: '${BIGBOY_DHO_IMAGE:?BIGBOY_DHO_IMAGE is the image pin: pass --env-file _records/images.env}'
    network_mode: none
    profiles: [auth]
    read_only: true
    restart: 'no'
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    user: 65532:65532
    volumes:
    - type: volume
      source: auth_signing_keys
      target: /var/lib/dev-health/envelope-keys
  # The session successor key of auth-service (AUTH_SESSION_SUCCESSOR_KEY_FILE): 32 random bytes, base64url without padding, made once in
  # the venue into a 0600 file of uid 65532 in the volume auth_session_keys (--skip-existing form: an existing file is kept). Never in
  # compose text, env or logs. CHAOS-12978.
  auth-session-keys-init:
    cap_add: [CHOWN]
    cap_drop: [ALL]
    command: ['chown 0:0 /run/auth/session; for f in /run/auth/session/successor-key /run/auth/session/login-lockout-key; do [ -s "$$f" ] || { umask 077; head -c 32 /dev/urandom | base64 | tr "+/" "-_" | tr -d "=\n" > "$$f"; }; chown 0:0 "$$f"; chmod 0600 "$$f"; chown 65532:65532 "$$f"; done; chmod 0700 /run/auth/session; chown 65532:65532 /run/auth/session']
    entrypoint: [/bin/sh, -eu, -c]
    image: ${BIGBOY_ACR_POSTGRES_IMAGE:?BIGBOY_ACR_POSTGRES_IMAGE is required (the acr image pin of ci/bigboy/images.env, kept in _records/images.env)}
    network_mode: none
    profiles: [auth]
    read_only: true
    restart: 'no'
    security_opt: [no-new-privileges:true]
    user: '0:0'
    volumes:
    - type: volume
      source: auth_session_keys
      target: /run/auth/session
  auth-provision:
    cap_drop: [ALL]
    command:
    - |
      psql -v ON_ERROR_STOP=1 <<'SQL'
      \getenv role AUTH_RUNTIME_DATABASE_ROLE
      \getenv pw AUTH_RUNTIME_DATABASE_PASSWORD
      SELECT format('CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS', :'role', :'pw')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
      SELECT format('ALTER ROLE %I NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'role', :'pw') \gexec
      \getenv mrole AUTH_MIGRATION_DATABASE_ROLE
      \getenv mpw AUTH_MIGRATION_DATABASE_PASSWORD
      \getenv schema AUTH_DATABASE_SCHEMA
      SELECT format('CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS', :'mrole', :'mpw')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'mrole') \gexec
      SELECT format('ALTER ROLE %I NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'mrole', :'mpw') \gexec
      SELECT format('CREATE SCHEMA %I AUTHORIZATION %I', :'schema', :'mrole')
