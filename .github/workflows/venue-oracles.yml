# The `venue-oracles` job: every venue differential oracle, on main and on
# demand. It is NOT a pull request check.
#
# WHEN IT RUNS. On every push to main, and by hand (workflow_dispatch, on
# any ref). It has no pull_request or merge_group trigger: a PR runs the
# venue oracle of the package it changes locally, before review, and the
# merge waits only on the normal CI. The result on main is informational
# for merges; a red run on main is fixed forward or reverted, and no group
# roll starts until it is green again.
#
# ONE PRODUCER. The job lives only in this workflow (go.yml must not declare
# it again). It is a 4-leg matrix (CHAOS-6574: one sequential job outgrew its
# timeout), so a commit carries four `venue-oracles (shard K/4)` contexts, all
# informational (R430), none required.
#
# RELEVANCE. A push to main decides relevance INSIDE the job, not with a
# trigger path filter: `ci/go_relevance.py` (the decider go-quality.yml
# uses) against go.yml's own `on.pull_request.paths`, over the push range
# from `github.event.before`. The job then either runs the real oracle
# suite or says in plain text that it skipped and why. A path filter on the
# trigger would skip the run with no record at all. A workflow_dispatch run
# has no push range and always runs the full suite.
name: Venue oracles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Pull the mirrored test-dependency images from ghcr.io (CHAOS-4778).
  packages: read

concurrency:
  # Same fleet-wide shape as go-quality.yml/go.yml (CHAOS-4906 fleet audit):
  # group by PR number on pull_request, by ref on a push to a non-main
  # branch, by commit sha on a push to main or on merge_group (never
  # cancelled).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  venue-oracles:
    # venue-oracles: every venue differential oracle
    # test (internal/testsupport/venueoracle) against the REAL Python api and
    # the REAL Go api on two copies of one Alembic-migrated Postgres. Distinct
    # from `ci/check_go.sh live-python-oracles` (go-quality's own step): that
    # verb's blocks are narrow pure-function comparisons installed via
    # `pip install --no-deps -r ci/requirements-live-python-oracles.txt`; a
    # venue oracle imports the WHOLE real FastAPI app plus alembic, so it
    # needs the full project Python environment (`uv sync`), not that narrow
    # closure -- discovered the hard way when this job's own PR first failed
    # go-quality with `ModuleNotFoundError: alembic`.
    runs-on: ubuntu-latest
    # SHARDED (CHAOS-6574). One sequential job took 67 min at 87 tests and was
    # CANCELLED at its 75-minute timeout on two consecutive main pushes (a
    # cancel reads as no signal). The matrix runs 4 legs; leg K runs every
    # 4th row of the registry's sorted `run` sequence (`check_go.sh
    # venue-oracles K 4`), so one package's tests spread over all legs
    # (apiservice/admin alone was 23 min). Keep the matrix list and the count
    # passed to the verb in step: tests/tooling/test_venue_oracle_shards.py
    # pins both. Each package's own go test is bounded at 40 minutes inside
    # the verb; a leg is bounded at 40 minutes here (~16 min of tests plus
    # setup expected).
    name: venue-oracles (shard ${{ matrix.shard }}/4)
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the base commit to diff against for the relevance decision
          # below; the default depth-1 checkout cannot see it.
          fetch-depth: 0

      - name: Set up Python 3.14 for the relevance decision
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install the relevance decider's only dependency
        run: python -m pip install --no-deps 'PyYAML==6.0.2'

      - name: Decide whether this change set is Go-relevant
        id: relevance
        env:
          # `github.event.before` is the push event's own pre-push sha --
          # without it, a multi-commit push to main left BASE_SHA empty and
          # fell back to `HEAD^...HEAD`, which only ever sees the LAST
          # commit of the push, silently dropping every earlier one from the
          # range (ci/go_relevant_diff.sh refuses rather than guess when this
          # value is the all-zeros sentinel or no longer an ancestor of HEAD,
          # which routes into the fail-open branch below).
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            # A run by hand has no push range: it always runs the full suite.
            echo "workflow_dispatch: running the full oracle suite"
            printf 'relevant=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          bash ci/go_relevant_diff.sh > changed.txt || {
            # Fails OPEN, not closed: relevant=true runs the real gate rather
            # than silently skipping it. An unresolvable range (or the
            # all-zeros sentinel / non-ancestor BASE_SHA the script now
            # refuses) is exactly the case where guessing would be wrong.
            echo "could not resolve the diff range; failing open to relevant=true"
            printf 'relevant=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          }
          # The gate itself: go.yml's pattern list names none of this
          # workflow, the oracle discovery or the diff-range script, and a
          # change to any of them must still run the suite that proves it.
          if tr '\0' '\n' < changed.txt | grep -qxE '\.github/workflows/venue-oracles\.yml|ci/venue_oracle_discovery\.awk|ci/go_relevant_diff\.sh'; then
            echo "the venue-oracles gate itself changed: running the full oracle suite"
            printf 'relevant=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python ci/go_relevance.py < changed.txt | tee relevance.out
          grep -E '^relevant=(true|false)$' relevance.out >> "${GITHUB_OUTPUT}"

      - name: Report that the gate was skipped, and why
        if: steps.relevance.outputs.relevant != 'true'
        run: |
          echo "skipped: no Go-relevant paths in this change set."
          echo "Relevance is decided by ci/go_relevance.py against go.yml's own"
          echo "on.pull_request.paths list. The job still reports, so the skip is"
          echo "on record for this commit rather than a run that never happened."

      - name: Set up Go
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'

      - name: Install uv
        if: steps.relevance.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'

      # The FULL project environment -- see the job comment above for why
      # ci/requirements-live-python-oracles.txt is not enough here. Once
      # .venv exists, pyoracle.Resolve (internal/testsupport/pyoracle)
      # already prefers it over a bare `python3` on PATH; no extra PATH
      # wiring needed in this job.
      - name: Install the full Python project
        if: steps.relevance.outputs.relevant == 'true'
        run: uv sync --frozen --all-extras --dev

      - name: Log in to GitHub Container Registry
        if: steps.relevance.outputs.relevant == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull pinned test dependency images with bounded retry
        if: steps.relevance.outputs.relevant == 'true'
        run: bash ci/check_go.sh integration-prepull

      # `set -o pipefail` (via -euo pipefail) is load-bearing: without it, a
      # failing check_go.sh in this pipe would be masked by `tee`'s own zero
      # exit, and the step would report success on a red run.
      - name: Run this shard's venue differential oracles against the live Python api
        if: steps.relevance.outputs.relevant == 'true'
        env:
          DEV_HEALTH_LIVE_PYTHON_ORACLES: '1'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/venue-oracle-receipt"
          bash ci/check_go.sh venue-oracles "${{ matrix.shard }}" 4 2>&1 | tee "${RUNNER_TEMP}/venue-oracle-receipt/receipt.log"

      - name: Upload the venue oracle receipt
        if: steps.relevance.outputs.relevant == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: venue-oracle-receipt-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/venue-oracle-receipt/receipt.log
          if-no-files-found: ignore
