apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-postgres}}
  template:
    metadata: {labels: {app: auth-postgres}}
    spec:
      containers:
        - name: postgres
          image: ${LOCAL_PG}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile: {type: RuntimeDefault}
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
          env:
            - {name: POSTGRES_PASSWORD, value: "${PG_PASSWORD}"}
            - {name: PGDATA, value: /var/lib/postgresql/pgdata}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: auth-postgres}
spec:
  selector: {app: auth-postgres}
  ports: [{port: 5432, targetPort: 5432}]
