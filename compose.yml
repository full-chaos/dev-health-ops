# CHAOS-3142 incident, 2026-07-25: this file previously shared the compose
# project name `dev-health` with the repo-root `compose.yml` (a separate,
# divergent file with an incompatible postgres definition -- different
# image, role/database names, PGDATA path, and port). Because Docker Compose
# tracks service ownership by (project name, service name), an `up` from
# EITHER file could recreate the OTHER file's already-running containers in
# place, discarding whatever they had (see the postgres image/PGDATA history
# below). Naming this project `dev-health-ops` makes that collision
# structurally impossible: this file now owns its own containers, network,
# and volumes, entirely separate from whatever the repo-root compose.yml
# manages. That also means this file's postgres always starts from its own
# empty volume -- it is no longer a way to attach to another project's data.
name: dev-health-ops

# CHAOS-6279: WORKER_OPERATIONAL_BRIDGE_TOKEN (and its x-worker-operational-
# bridge-token anchor, formerly here) is deleted from this file entirely.
# CHAOS-6240 already established it had zero Python-side readers
# (worker_auth.py/worker_metrics.py and worker_sync.py were its only two,
# both gone). This PR confirms the Go-worker side never read it either --
# repo-wide grep found no `cfg.OperationalBridgeToken` consumer beyond
# config.go's own parsing (itself deleted in this PR) and test literals; the
# `internal/syncdispatchruntime.NewHTTPBridge` construction this file used
# to cite as requiring a non-empty token no longer exists in the codebase at
# all. The env var itself (a real credential an operator might still have
# set, e.g. in the deploy chart's Secret) is untouched by this PR outside
# this file -- see this PR's RISK-NOTES.
#
# An empty SETTINGS_ENCRYPTION_KEY default crash-loops
# every Go worker family that constructs a provider-credential decryptor
# (sync/ops/heavy) on a bare bring-up -- reproduced: "worker family builder
# failed", three stream runners 503. Single-anchor convention (formerly
# shared with the bridge token above) so go-api, query-api and the Go worker
# fleet stay byte-identical on the same local-only placeholder rather than
# independent empty defaults that happen to agree only when an operator
# sets the real value.
x-settings-encryption-key:
  token: &settings-encryption-key
    SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-local-dev-settings-encryption-key}

# The access-token key. go-api signs and verifies the user's access token
# with it (JWT_SECRET_KEY), and query-api verifies the same token with the
# same value (GO_API_EDGE_JWT_SECRET, set from this variable on that
# service). One local-only placeholder default, same convention as above.
x-jwt-secret-key:
  token: &jwt-secret-key
    # At least 32 characters: the Go api refuses a shorter access-token key at
    # startup (edgetoken), and both planes read this one value.
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-jwt-secret-key-0123456789abcdef}

# The one address of the router on the `planes` network (see `networks:`
# below). The router has this address, and go-api names this address, and
# only this address, in TRUSTED_PROXIES: go-api then reads X-Forwarded-For and
# X-Real-IP from the router and from no other peer. To move the stack to
# another subnet, change the subnet and the ip_range of `planes` and this
# address together (the address must be inside the subnet and outside the
# ip_range).
x-router-address: &router-address "10.199.81.2"

# Go/River worker topology (CHAOS-3142, folded in at CHAOS-3088 from
# deploy/docker-compose/compose.go-workers.yml (deleted, CHAOS-6950) -- that file keeps its own
# copy for compose.production.yml (deleted, CHAOS-6950)'s separate `--profile go-workers` overlay
# path; this is a second, independently maintained copy for local-dev
# parity against THIS file's own postgres/clickhouse/valkey. Credentials
# only in `environment:` --
# everything else is a flag, so `docker compose config` shows the deployed
# configuration of every service below in one place.
x-go-worker-flag:
  http-addr: &flag-http-addr "--http-addr=:8080"
  river-schema: &flag-river-schema "--river-schema=${RIVER_DATABASE_SCHEMA:-river}"
  domain-role: &flag-domain-role "--domain-database-role=${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}"
  queue-role: &flag-queue-role "--queue-database-role=${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}"
  queue-mode: &flag-queue-mode "--queue-database-mode=${WORKER_DATABASE_MODE:-session}"
  coordinator-mode: &flag-coordinator-mode "--coordinator-database-mode=${COORDINATOR_DATABASE_MODE:-session}"
  domain-pooler: &flag-domain-pooler "--domain-transaction-pooler=${PGBOUNCER_TRANSACTION_MODE:-true}"
  # CHAOS-6279: bridge-url/bridge-url-heavy/bridge-insecure (formerly here,
  # CHAOS-4351) are deleted -- the --operational-bridge-url/--operational-
  # bridge-allow-insecure flags they rendered no longer exist on any Go
  # binary (CHAOS-5320 deleted the Python HTTP bridge they pointed at;
  # nothing constructs a bridge client from cfg.OperationalBridgeURL any
  # more, confirmed by grep across internal/ and cmd/). The PagerDuty
  # stream runner's own readiness does not depend on this flag -- it never
  # took it as an argument (confirmed: zero OperationalBridge references
  # anywhere under the stream runner's code, now internal/streamrunnerservice).
  log-level: &flag-log-level "--log-level=${LOG_LEVEL:-info}"

# The coordinator group is all-or-none: a service that does not claim
# coordinator work blanks all four values, merged ahead of the base.
x-go-worker-no-coordinator: &go-worker-no-coordinator
  DEV_HEALTH_PG_COORDINATOR_HOST: ""
  DEV_HEALTH_PG_COORDINATOR_PORT: ""
  DEV_HEALTH_PG_COORDINATOR_USER: ""
  DEV_HEALTH_PG_COORDINATOR_PASSWORD: ""

x-go-worker-env-base: &go-worker-env-base
  # CHAOS-5568: component form, not a pre-built URI. `POSTGRES_URI`/
  # `WORKER_DATABASE_URI`/`CLICKHOUSE_URI` used hand-assembled
  # `${VAR}` interpolation, which required every credential component to
  # be pre-encoded for its position in the string -- a raw `#`, `@`, `/`
  # or `:` in a password (or, for CLICKHOUSE_DB, a raw `/`) silently
  # corrupted the DSN before the process even started, confirmed
  # reproducible on main with each of the domain/queue/coordinator/
  # ClickHouse passwords. `internal/platform/config` now
  # accepts these as discrete `DEV_HEALTH_PG_*`/`DEV_HEALTH_CH_*` fields
  # and assembles the DSN itself with stdlib `net/url`, which percent-
  # encodes correctly by construction -- so no component here needs
  # encoding, ever. URI and component forms are mutually exclusive per
  # connection (refused if both are set); this base sets component vars
  # only, so `POSTGRES_URI`/`WORKER_DATABASE_URI`/`CLICKHOUSE_URI` and
  # their `GO_WORKER_*_URI` overrides are gone, not just unset -- an
  # operator who needs a differently-shaped connection sets the matching
  # `DEV_HEALTH_PG_*`/`DEV_HEALTH_CH_*` variable instead, never a raw URI.
  DEV_HEALTH_PG_DOMAIN_HOST: pgbouncer
  DEV_HEALTH_PG_DOMAIN_PORT: "6432"
  DEV_HEALTH_PG_DOMAIN_USER: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
  DEV_HEALTH_PG_DOMAIN_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}
  DEV_HEALTH_PG_QUEUE_HOST: pgbouncer-river-queue
  DEV_HEALTH_PG_QUEUE_PORT: "6433"
  DEV_HEALTH_PG_QUEUE_USER: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
  DEV_HEALTH_PG_QUEUE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
  # Shared across domain/queue/coordinator, same as the URI form's shared
  # `${POSTGRES_DB:-postgres}` default -- this file's superuser identity
  # is postgres/postgres/postgres (container_name: postgres), not a
  # `devhealth` role or database (see `migrate`'s own comment above).
  DEV_HEALTH_PG_DB: ${POSTGRES_DB:-postgres}
  # Trusted self-managed SCM hosts for Jira dev-status / Linear attachment PR links; an entry is `host` or
  # `host/root` (relative URL root). Same keys as the chart config map; empty means public SaaS hosts only.
  JIRA_TRUSTED_SCM_HOSTS: ${JIRA_TRUSTED_SCM_HOSTS:-}
  LINEAR_TRUSTED_SCM_HOSTS: ${LINEAR_TRUSTED_SCM_HOSTS:-}
  # Port 9000 is the NATIVE protocol, not 8123 -- the Go worker speaks the
  # native wire protocol through clickhouse-go and eagerly Ping()s at
  # construction (CHAOS-3872, deploy/go-workers/README.md).
  DEV_HEALTH_CH_HOST: clickhouse
  DEV_HEALTH_CH_PORT: "9000"
  DEV_HEALTH_CH_USER: ${CLICKHOUSE_USER:-ch}
  DEV_HEALTH_CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-ch}
  DEV_HEALTH_CH_DB: ${CLICKHOUSE_DB:-default}
  VALKEY_URI: redis://valkey:6379/1
  # deploy/go-workers/deployment.json requires this for the sync group, and
  # provider-sync handler construction fails closed without it. Shared with
  # go-api and query-api via the `x-settings-encryption-key` anchor above, so
  # the value stays byte-identical between the workers and the two planes.
  # Found by executing the required readyz proof rather than
  # by inspection): go-worker/go-worker-heavy/go-worker-ops claim
  # work_graph_execution_requests rows via a coordinator-role connection
  # (matches the bigboy overlay's own CHAOS-5133 comment) -- without this
  # in the shared base, sync crash-looped with "worker family builder
  # failed... syncCoordinator... worker readiness dependency is
  # unavailable" instead of the expected live-but-unready shape. Default
  # here, not just on go-reconciler/go-scheduler. The three stream services
  # take the four values back to empty through `x-go-worker-no-coordinator`
  # (merged BEFORE this base, so it wins). All four, never HOST alone: the
  # config loader refuses a part-set group (PORT, USER or PASSWORD set while
  # HOST is empty is a configuration_error), CHAOS-8599.
  DEV_HEALTH_PG_COORDINATOR_HOST: pgbouncer-river-coordinator
  DEV_HEALTH_PG_COORDINATOR_PORT: "6434"
  DEV_HEALTH_PG_COORDINATOR_USER: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
  DEV_HEALTH_PG_COORDINATOR_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
  <<: *settings-encryption-key
  AUTO_RUN_MIGRATIONS: "false"
  # CHAOS-4587: see `migrate`'s own comment on this variable below -- must
  # move with the migrate export in the same deploy pass; see
  # deploy/go-workers/README.md's rollout note before changing this value.
  OPERATIONAL_ORDERING_CONTRACT: ${OPERATIONAL_ORDERING_CONTRACT:-2}

# This template was a real entry under `services:`
# with no `command:` of its own -- a bare `up` (no explicit service list)
# instantiated it directly and it crashed ({"error":{"code":"invalid_request"}},
# exited 1) instead of never running at all. A shared template that every
# consumer overrides via `<<:` belongs at the top level next to every other
# `x-` anchor in this file, not inside `services:`, exactly like
# `x-go-worker-env-base` above. `routes apply` itself is idempotent
# (confirmed by reading internal/syncroute -- the mutation path compares
# current to declared and returns cleanly when they already match), so a
# second `up` after the first activation run is safe and exits 0 without
# changing anything.
x-go-worker-route-activate:
  template: &go-worker-route-activate
    # Declared alongside `build:` so an operator pin is honoured: this is a
    # staging file, `pull_policy` is left at Compose's own default, and a
    # one-shot job that keeps building locally while the long-running
    # services honour a release pin is how a setup step ends up running a
    # different build of the same binary. The default is the `:local` tag
    # of the same family, which no registry publishes: unpinned, Compose
    # builds it from THIS tree, so a start is one coherent revision. A
    # published moving tag as the default was worse than no pin at all --
    # present on the host from any earlier pull, Compose ran THAT image
    # instead of building, putting a months-old migration beside a fleet
    # built today. Two consequences, both deliberate: with no pin and no
    # prior build there is nothing for `--no-build` to run, and `:local`
    # is shared across compose projects on one host.
    image: ${DEV_HEALTH_GO_OPERATOR_IMAGE:-ghcr.io/full-chaos/dev-health-go-operator:local}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: operator
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      <<: *go-worker-env-base
    depends_on:
      # The route tables are alembic's (0049); River's schema is
      # go-river-migrate's.
      migrate:
        condition: service_completed_successfully
      go-river-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  # Envelope signing key set, written once by envelope-keys-init. The private
  # key lives under private/ and is mounted read-only into go-api only; the
  # JWKS lives under public/ and is the only part query-api mounts. `down`
  # keeps it; `down -v` deletes it and the next `up` generates a new pair.
  envelope_keys:
    driver: local

networks:
  # The hop from the router to the two planes. Its members are the router,
  # go-api and query-api, and no other service. The router is on this network
  # only; the planes are on it and on the default network (the stores). The
  # subnet is fixed so that the router has a known address
  # (`x-router-address` above). The ip_range keeps the addresses Docker gives
  # to the planes away from that address: without it the first plane that
  # starts takes the first free address of the subnet, which is the router's.
  planes:
    driver: bridge
    ipam:
      config:
        - subnet: 10.199.81.0/28
          ip_range: 10.199.81.8/29

services:
  postgres:
    # CHAOS-3142 incident, 2026-07-25: the immediate trigger was this file
    # sharing its compose project name with the repo-root compose.yml (see
    # the `name:` comment above) -- an `up` from either file could recreate
    # the other's already-running postgres container in place. But this
    # image was also unpinned (`latest`) and PGDATA was misspelled
    # (`PG_DATA`, which the postgres image never reads), so the container
    # that got recreated started an entirely new, empty cluster in whatever
    # subdirectory that image version's own default PGDATA happened to be,
    # rather than failing loudly or reusing the real one. Both defects are
    # fixed independently of the project-name fix, so this file's own
    # isolated volume can't suffer the same silent-relocation failure mode
    # on some future `up`. Pinned to the same Postgres 18 Alpine digest
    # already pinned in internal/testsupport/containers/harness.go, so the
    # dev stack and the Go integration-test harness agree on one Postgres
    # build. The repo-root compose.yml already got PGDATA right under
    # CHAOS-1771 (`PGDATA: /var/lib/postgresql/data/pgdata`, with its own
    # comment on the same anonymous-volume trap) -- this file adopts the
    # identical reasoning so the two agree rather than looking like
    # independent guesses.
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: postgres
    restart: always
    environment:
      # Class sweep over the whole file, not only the knob found: go-river-provision/
      # migrate's own entrypoint already reads POSTGRES_USER/_PASSWORD
      # overrides (they authenticate against THIS server with them) --
      # only the server itself, the actual authority for these
      # credentials, hardcoded past them. `postgres`'s official image
      # takes both as plain env vars, same mechanism as POSTGRES_DB below.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Reproduced: every OTHER consumer of this database name
      # (poolers' DB_NAME/healthchecks, migrate's POSTGRES_URI, the Go
      # worker DSNs, go-river-provision's --dbname) already reads
      # ${POSTGRES_DB:-postgres} -- only the server that actually CREATES
      # the database at first init was hardcoded to the literal string
      # "postgres", so overriding POSTGRES_DB anywhere else pointed every
      # downstream consumer at a database that was never created
      # ("database ... does not exist"). One source of truth now.
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Must be a subdirectory of the volume mount (postgres_data is mounted
      # at the parent /var/lib/postgresql/), never the mount root itself --
      # otherwise the image's lost+found and other reserved entries live
      # alongside PGDATA and a future image-default change silently
      # relocates the cluster again. Previously misspelled `PG_DATA`, which
      # the postgres image never reads, so this had no effect for seven
      # months (commit 581ae01e6) while every cluster was created at the
      # image's own shifting default path.
      PGDATA: /var/lib/postgresql/pgdata
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      # CHAOS-3142: the coordinator role of the CHAOS-3033 Option B split.
      # docker/init-extra-dbs.sh already reads these two (defaulting to
      # devhealth_coordinator) to create the login and grant CONNECT; without
      # them here an operator override never reaches the script that
      # provisions it.
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      # Local development credentials only. Production roles are provisioned
      # through the database provider/secret manager before migration.
      RIVER_DOMAIN_DATABASE_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}
      RIVER_QUEUE_DATABASE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/
      - ./docker/init-extra-dbs.sh:/docker-entrypoint-initdb.d/init-extra-dbs.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  pgbouncer:
    # CHAOS-2065: transaction-mode connection pooler in front of postgres.
    # Multiplexes many client connections onto a small server-connection set so
    # the worker fleet cannot exhaust postgres max_connections. The app runs with
    # PGBOUNCER_TRANSACTION_MODE=true (disables asyncpg prepared statements).
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      # Class sweep over this whole file -- every knob it exposes is part
      # of the same promise, not only the one that was found:
      # DB_USER/DB_PASSWORD/DB_NAME
      # were hardcoded literals while the postgres server (below),
      # go-river-provision/migrate and query-api already read
      # POSTGRES_USER/_PASSWORD/_DB overrides -- an override honoured by
      # some consumers and hardcoded past by the pooler in front of the
      # server itself. Same anchors, everywhere.
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-postgres}
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      ADMIN_USERS: ${POSTGRES_USER:-postgres}
      # CHAOS-3944: log_connections/log_disconnections default on and turn a
      # Go worker fleet's steady attach/detach churn into a continuous,
      # diagnostically worthless firehose (measured ~36 lines/min across the
      # three production poolers). Keep log_pooler_errors and the default
      # log_stats ON: the once-a-minute stats line is the only real pooler
      # telemetry and it proved its worth in a live incident (wait
      # 5683209 us during trouble, wait 16136 us after recovery). Do not
      # "tidy away" that stats line.
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      LOG_POOLER_ERRORS: "1"
      # Healthcheck-only credential: PGPASSWORD is a libpq env var psql reads
      # automatically, so it never appears in argv. Dev-only default,
      # matching DB_PASSWORD above -- same override, not a second literal.
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # CHAOS-3944: pg_isready cannot prove the pooler can authenticate and
      # serve a query — it reports healthy even on an auth rejection
      # regardless of username, so pinning -U/-d alone doesn't fix that (see
      # deploy/docker-compose/compose.production.yml (deleted, CHAOS-6950)). Run a real query
      # through the pooler instead.
      test: ["CMD", "psql", "-w", "-h", "localhost", "-p", "6432", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-postgres}", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # The Go worker fleet below needs two more
  # dedicated poolers -- queue-control and coordinator -- that this file
  # never defined; folded in from the proven design already running the
  # shared bigboy stack (/home/ubuntu/devhealth/compose/compose.go.workers.yml),
  # adapted to this file's own postgres identity (superuser `postgres`,
  # database `postgres` -- not that stack's `devhealth`/`devhealth`).
  # `pgbouncer` above already lets devhealth_domain/devhealth_queue/
  # devhealth_coordinator authenticate through it with no changes: edoburu/
  # pgbouncer's AUTH_TYPE != trust wires an implicit auth_query against
  # pg_shadow using DB_USER (a real superuser here, same as the bigboy
  # stack's), so any role docker/init-extra-dbs.sh created passes through
  # -- confirmed by inspecting a live, multi-day-running go-worker container
  # on that stack, whose resolved POSTGRES_URI uses devhealth_domain through
  # that exact single-role-configured pgbouncer. ADMIN_USERS is deliberately
  # NOT widened; that setting is unrelated to this mechanism.
  #
  # Session mode pins one server connection per client session for the life
  # of that session, so DEFAULT_POOL_SIZE is a hard ceiling on how many
  # worker replicas can start, not a throughput knob -- this default (40)
  # is the bigboy file's own general-purpose value ("covers 3 replicas of
  # every worker group plus headroom" per its comment), NOT bigboy's own
  # further-tuned override (100, applied there only because that stack runs
  # at a measured 4 replicas per group -- see
  # .remember/lanes/lane-stack-owner/river-queue-pool-override.yml). This
  # file defaults every Go process to 1 replica, comfortably inside 40.
  pgbouncer-river-queue:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer-river-queue
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      DB_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      DB_NAME: ${POSTGRES_DB:-postgres}
      LISTEN_PORT: "6433"
      POOL_MODE: session
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: ${PGBOUNCER_RIVER_QUEUE_MAX_CLIENT_CONN:-128}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_RIVER_QUEUE_POOL_SIZE:-40}
      PGPASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "psql", "-w", "-h", "localhost", "-p", "6433", "-U", "${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}", "-d", "${POSTGRES_DB:-postgres}", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Coordinators hold locks across statements, so they receive their own
  # bounded session pool rather than the transaction-mode domain endpoint
  # above (same rationale as the bigboy file this was folded from).
  pgbouncer-river-coordinator:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer-river-coordinator
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      DB_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
      DB_NAME: ${POSTGRES_DB:-postgres}
      LISTEN_PORT: "6434"
      POOL_MODE: session
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "32"
      DEFAULT_POOL_SIZE: "10"
      PGPASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "psql", "-w", "-h", "localhost", "-p", "6434", "-U", "${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}", "-d", "${POSTGRES_DB:-postgres}", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:latest@sha256:d7556a3841027651307b5aa08d72b5c467d0241d3db5b67d9e158ef3975626f5
    container_name: clickhouse
    restart: on-failure
    environment:
      CLICKHOUSE_LISTEN_HOST: 0.0.0.0
      # Class sweep over the whole file, not only the knob found: query-api's
      # CLICKHOUSE_URI and the go-worker fleet's DEV_HEALTH_CH_USER/
      # _PASSWORD/_DB already read CLICKHOUSE_USER/_PASSWORD/_DB as their
      # own defaults -- only the server that actually authenticates them
      # (the official image takes all three as plain env vars, same
      # mechanism as POSTGRES_USER/_DB above) hardcoded past them.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ch}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ch}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      # The password of the Go api's own login `dho_api_ch` (the users.d file
      # mounted below). ClickHouse reads it from THIS variable (`from_env` in
      # the file) and go-api logs in with the same value
      # (DEV_HEALTH_CH_API_PASSWORD there): one operator variable,
      # API_CLICKHOUSE_PASSWORD, with the local-only default this file uses for
      # every store login (the name of the login).
      DHO_API_CH_PASSWORD: ${API_CLICKHOUSE_PASSWORD:-dho_api_ch}
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # The Go api's own login (CHAOS-8361), declared the way prod and bigboy
      # declare it: a users.d file with exactly the grants of the api's
      # privilege manifest and no other. go-api's /readyz refuses a login
      # whose grants are not exactly that manifest, so the general user above
      # cannot serve it. The file is GENERATED from the manifest and a Go test
      # holds it equal (internal/storage/clickhouse); it holds no password and
      # no hash. Its grants name the database `default`: a stack that sets
      # CLICKHOUSE_DB to another name must mount its own file, or go-api is
      # never ready.
      - ./docker/clickhouse-users.d/dho_api_ch.xml:/etc/clickhouse-server/users.d/dho_api_ch.xml:ro
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8123/ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  valkey:
    image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    container_name: valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  migrate:
    # Declared alongside `build:` so an operator pin is honoured: this is a
    # staging file, `pull_policy` is left at Compose's own default, and a
    # one-shot job that keeps building locally while the long-running
    # services honour a release pin is how a setup step ends up running a
    # different build of the same binary. The default is the `:local` tag
    # of the same family, which no registry publishes: unpinned, Compose
    # builds it from THIS tree, so a start is one coherent revision. A
    # published moving tag as the default was worse than no pin at all --
    # present on the host from any earlier pull, Compose ran THAT image
    # instead of building, putting a months-old migration beside a fleet
    # built today. Two consequences, both deliberate: with no pin and no
    # prior build there is nothing for `--no-build` to run, and `:local`
    # is shared across compose projects on one host.
    image: ${DEV_HEALTH_GO_DHO_IMAGE:-ghcr.io/full-chaos/dev-health-go-dho:local}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: dho
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    container_name: dev-health-migrate
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    # `dho migrate upgrade`: the PostgreSQL head, the standard feature flags,
    # then the ClickHouse head, each exactly as its own dho verb. --river also
    # applies the River schema right after the PostgreSQL step when
    # MIGRATION_DATABASE_URI is set -- what `dev-hops migrate postgres` did;
    # empty, it is unset for dho, and go-river-migrate owns River.
    command: ["migrate", "upgrade", "--river"]
    environment:
      # Class sweep over the whole file, not only the knob found: user/password here were hardcoded past the
      # server's own POSTGRES_USER/_PASSWORD overrides (fixed above); DB
      # was already templated.
      POSTGRES_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      MIGRATION_DATABASE_URI: ${MIGRATION_DATABASE_URI:-}
      # The PostgreSQL head dho applies has the Celery->River cutover
      # (revision 0066) applied, as production runs; dho refuses any other
      # value, naming it.
      DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER: ${DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER:-1}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      # CHAOS-4587: migration 067 checks this same
      # variable to decide whether to apply the ordering-contract cutover
      # (src/dev_health_ops/migrations/clickhouse/067_operational_ordering_contract.py) --
      # without a reference here, an operator's shell export never reaches
      # this container, 067 silently defers ("successfully"), and workers
      # wired to the same export (the go-worker-* services below) start
      # against a still-contract-1 table. Must move with the worker export
      # in the same deploy pass; see deploy/go-workers/README.md.
      OPERATIONAL_ORDERING_CONTRACT: ${OPERATIONAL_ORDERING_CONTRACT:-2}
      # CHAOS-8744: the chart's migrations.hook.classDecisionLiveSchemaDigest, passed through from
      # the invoking environment; empty by default.
      DHO_CLASS_DECISION_LIVE_SCHEMA_DIGEST: ${DHO_CLASS_DECISION_LIVE_SCHEMA_DIGEST:-}
      # Class sweep over the whole file, not only the knob found: user/password were hardcoded past the
      # clickhouse server's own CLICKHOUSE_USER/_PASSWORD overrides (fixed
      # below); DB was already templated. dho speaks ClickHouse's native
      # protocol (9000), not HTTP (8123).
      CLICKHOUSE_URI: clickhouse://${CLICKHOUSE_USER:-ch}:${CLICKHOUSE_PASSWORD:-ch}@clickhouse:9000/${CLICKHOUSE_DB:-default}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Go/River workers (CHAOS-3142) -- the unconditional default as of
  # CHAOS-3088. The Celery/Beat fleet this replaced (CHAOS-4164) is deleted
  # outright as of CHAOS-5589 -- R146: Celery transport is not a rollback
  # target, and no consumer has run since 2026-08-19 (CHAOS-4026). This is
  # the fleet a bare `docker compose up -d` now actually runs,
  # folded in from deploy/docker-compose/compose.go-workers.yml (deleted, CHAOS-6950) (kept there
  # too, for compose.production.yml (deleted, CHAOS-6950)'s separate overlay path, still at its
  # own `replicas: 0` -- unaffected by this PR). The nine long-running
  # worker/reconciler/scheduler/stream processes below run at
  # `deploy.replicas: 1` each -- one each is the intended shape, while
  # CHAOS-3087's deployment.json still declares every process
  # `enabled_by_default: false` / `desired_replicas: 0` (a deliberate,
  # out-of-scope-for-this-PR gap: see this PR's RISK-NOTES and the tracked
  # follow-up ticket). The one-shot setup chain (go-river-provision/
  # go-river-migrate/go-contractcheck) is unaffected: `restart: "no"`, no
  # `deploy:` block, runs to completion once per `up` regardless.
  # ---------------------------------------------------------------------------

  # The migrate service (above, `dho migrate upgrade`) owns the PostgreSQL and
  # ClickHouse schema. Re-run role provisioning only after it completes so guarded
  # grants see every current semantic table, including an already
  # initialized local volume.
  go-river-provision:
    # CHAOS-6904: the Go operator image (entrypoint dho, distroless): `dho migrate
    # roles` replaces the psql script this service used to run (executed parity,
    # CHAOS-6901). It creates and bootstraps the same unprivileged logins in one
    # transaction and NEVER prints a role name or password (the script echoed a
    # failing CREATE ROLE statement, and these defaults set each password equal to
    # its role name). Same image, build and component-form DSN as go-river-migrate
    # below; the default is the `:local` tag of that family, which no registry
    # publishes: unpinned, Compose builds it from THIS tree, so a start is one
    # coherent revision.
    image: ${DEV_HEALTH_GO_OPERATOR_IMAGE:-ghcr.io/full-chaos/dev-health-go-operator:local}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: operator
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    command: [migrate, roles]
    environment:
      # The root `postgres` service creates the superuser identity
      # postgres/postgres/postgres -- NOT a `devhealth` role or database; match
      # `migrate`'s own POSTGRES_URI default rather than inventing a second
      # convention (same as go-river-migrate below).
      DEV_HEALTH_MIGRATION_PG_HOST: ${POSTGRES_HOST:-postgres}
      DEV_HEALTH_MIGRATION_PG_USER: ${POSTGRES_USER:-postgres}
      DEV_HEALTH_MIGRATION_PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEV_HEALTH_MIGRATION_PG_DB: ${POSTGRES_DB:-postgres}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_DOMAIN_DATABASE_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}
      RIVER_QUEUE_DATABASE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
      # The dho api Service's own login (the optional API_DATABASE_ROLE block of
      # `dho migrate roles`), which the go-api service below connects as.
      API_DATABASE_ROLE: ${API_DATABASE_ROLE:-devhealth_api}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:-devhealth_api}
      # The dho query-api Service's own registry login (the optional
      # QUERY_API_DATABASE_ROLE block of `dho migrate roles`), which the
      # query-api service below connects as. Same local-only convention as
      # the api role: the default password equals the role name.
      QUERY_API_DATABASE_ROLE: ${QUERY_API_DATABASE_ROLE:-devhealth_query_api}
      QUERY_API_DATABASE_PASSWORD: ${QUERY_API_DATABASE_PASSWORD:-devhealth_query_api}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Apply the pinned River bundle with the elevated local/admin DSN, then
  # independently check that the resulting schema is current. Neither DSN
  # nor this binary is exposed to a long-running Go service.
  go-river-migrate:
    # Same as go-river-provision above -- default `pull_policy` (reuse a
    # cached local build if one exists); lockstep is closed by the
    # single-sha pin the prebuild produces, not by forcing a rebuild here.
    # Declared alongside `build:` so an operator pin is honoured: this is a
    # staging file, `pull_policy` is left at Compose's own default, and a
    # one-shot job that keeps building locally while the long-running
    # services honour a release pin is how a setup step ends up running a
    # different build of the same binary. The default is the `:local` tag
    # of the same family, which no registry publishes: unpinned, Compose
    # builds it from THIS tree, so a start is one coherent revision. A
    # published moving tag as the default was worse than no pin at all --
    # present on the host from any earlier pull, Compose ran THAT image
    # instead of building, putting a months-old migration beside a fleet
    # built today. Two consequences, both deliberate: with no pin and no
    # prior build there is nothing for `--no-build` to run, and `:local`
    # is shared across compose projects on one host.
    # The Go operator image (entrypoint dho, distroless): `dho migrate river
    # --apply-and-check` applies the pinned River schema and grant posture,
    # then checks the schema on a fresh connection, in one process -- the
    # pair this service used to run through /bin/sh.
    image: ${DEV_HEALTH_GO_OPERATOR_IMAGE:-ghcr.io/full-chaos/dev-health-go-operator:local}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: operator
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    command: [migrate, river, --apply-and-check]
    environment:
      # CHAOS-5568: component form. The shell fallback this replaced
      # (`postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@$$POSTGRES_HOST:5432/$$POSTGRES_DB`)
      # was exactly the unescaped-password class the config package's
      # component form fixes, one shell layer further out than the Go
      # binaries themselves -- `internal/rivermigrate`'s
      # `resolveMigrationDatabaseURI` now assembles this DSN internally
      # from these fields via stdlib `net/url`, so no component needs
      # encoding and no shell fallback is needed. Same
      # fix as go-river-provision above for the identity -- the root
      # `postgres` service's superuser identity is postgres/postgres, not
      # `devhealth`. `DEV_HEALTH_MIGRATION_PG_*` deliberately, not
      # `POSTGRES_HOST/PORT/USER/PASSWORD/DB`: see
      # `resolveMigrationDatabaseURI`'s own comment for why reusing those
      # names would collide with a pre-existing unconditional shell
      # fallback elsewhere.
      DEV_HEALTH_MIGRATION_PG_HOST: ${POSTGRES_HOST:-postgres}
      DEV_HEALTH_MIGRATION_PG_USER: ${POSTGRES_USER:-postgres}
      DEV_HEALTH_MIGRATION_PG_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEV_HEALTH_MIGRATION_PG_DB: ${POSTGRES_DB:-postgres}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      # This service never forwarded the coordinator
      # role/password, unlike go-river-provision just above it -- overriding
      # RIVER_COORDINATOR_DATABASE_ROLE away from its default then failed
      # migration ("River schema or privilege policy was not applied") since
      # the River migrator applied the privilege policy against the
      # unexported default name instead. The deleted
      # deploy/go-workers/compose-go-workers.yml overlay forwarded this.
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
      # The two plane logins that go-river-provision creates get their table
      # privileges HERE: `dho migrate river` applies the api manifest to
      # API_DATABASE_ROLE (unset: devhealth_api) and applies the query-api
      # manifest ONLY when QUERY_API_DATABASE_ROLE names a role (unset:
      # nothing is granted). Each plane's /readyz refuses a login that does
      # not hold exactly its manifest, and the router waits for both planes
      # to be healthy, so the two names here must be the names the planes
      # log in as (go-api's API_DATABASE_ROLE, query-api's
      # QUERY_API_DATABASE_ROLE).
      API_DATABASE_ROLE: ${API_DATABASE_ROLE:-devhealth_api}
      QUERY_API_DATABASE_ROLE: ${QUERY_API_DATABASE_ROLE:-devhealth_query_api}
    depends_on:
      go-river-provision:
        condition: service_completed_successfully

  # Validate the exact checked-in job registry and worker manifest before
  # Compose is allowed to start any long-running Go process.
  go-contractcheck:
    # Declared alongside `build:` so an operator pin is honoured: this is a
    # staging file, `pull_policy` is left at Compose's own default, and a
    # one-shot job that keeps building locally while the long-running
    # services honour a release pin is how a setup step ends up running a
    # different build of the same binary. The default is the `:local` tag
    # of the same family, which no registry publishes: unpinned, Compose
    # builds it from THIS tree, so a start is one coherent revision. A
    # published moving tag as the default was worse than no pin at all --
    # present on the host from any earlier pull, Compose ran THAT image
    # instead of building, putting a months-old migration beside a fleet
    # built today. Two consequences, both deliberate: with no pin and no
    # prior build there is nothing for `--no-build` to run, and `:local`
    # is shared across compose projects on one host.
    image: ${DEV_HEALTH_GO_CONTRACTCHECK_IMAGE:-ghcr.io/full-chaos/dev-health-go-contractcheck:local}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: contractcheck
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    command: [contracts, validate]
    depends_on:
      go-river-migrate:
        condition: service_completed_successfully

  # On a fresh Go-default bring-up, the four
  # sync-dispatch "frozen kinds" alembic migration 0049 seeds are assigned
  # transport `celery` -- the reconciler's `sync_dispatch_route_fence`
  # readiness check (internal/syncroute.Fence.Check) correctly refuses
  # readiness on that drift, since nothing actually consumes Celery
  # anymore. Folded in from the proven design already running the shared
  # bigboy stack (compose/compose.go.workers.yml, untracked, outside this
  # repository): `dho workers routes apply` flips each kind to `river`,
  # audited, the exact reference
  # implementation option (a) names. This is the default for THIS file;
  # `sync.provider_unit`'s own canary-route activation (the fifth
  # `job-routes apply` the bigboy overlay also runs) is NOT folded in --
  # that promotion is a separate, already-tracked decision, not a
  # compose default.

  go-sync-dispatch-route-activate:
    <<: *go-worker-route-activate
    command:
      - workers
      - routes
      - apply
      - --reason
      - local_compose_start
      - --correlation-id
      - local-compose-dispatch-sync-run
      - dispatch_sync_run

  go-sync-finalize-route-activate:
    <<: *go-worker-route-activate
    command:
      - workers
      - routes
      - apply
      - --reason
      - local_compose_start
      - --correlation-id
      - local-compose-finalize-sync-run
      - finalize_sync_run
    depends_on:
      # The operator intentionally permits one audited mutation at a time --
      # serialize the four route changes rather than race its advisory lock
      # with four parallel one-shot containers.
      go-sync-dispatch-route-activate:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      go-river-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy

  go-sync-post-route-activate:
    <<: *go-worker-route-activate
    command:
      - workers
      - routes
      - apply
      - --reason
      - local_compose_start
      - --correlation-id
      - local-compose-post-sync
      - post_sync
    depends_on:
      go-sync-finalize-route-activate:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      go-river-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy

  go-sync-reference-route-activate:
    <<: *go-worker-route-activate
    command:
      - workers
      - routes
      - apply
      - --reason
      - local_compose_start
      - --correlation-id
      - local-compose-reference-discovery
      - reference_discovery
    depends_on:
      go-sync-post-route-activate:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      go-river-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy

  go-worker-heavy: &go-worker
    # `build:` lets this file build the
    # same tree's image locally when asked (`docker compose build`/
    # `up --build`); `image:` stays so `DEV_HEALTH_GO_DHO_IMAGE` can
    # pin an already-published tag OR DIGEST instead.
    # This anchor briefly carried a `pull_policy: build` hardening; it is
    # gone, because pinning every image to one sha is the call that was
    # already made and it is what closes the lockstep. This root file is a
    # STAGING file that honours an `*_IMAGE` pin BY DEFAULT.
    # `pull_policy` is left at compose's own default (`missing`): a
    # digest or tag named here is pulled/reused as-is, never rejected for
    # "cannot contain a digest" (that rejection, r5's P1, was `pull_policy:
    # build` unconditionally forcing this image's OWN name to double as a
    # build output tag -- gone now that nothing forces a build). The
    # CHAOS-5437 cross-tree posture-manifest lockstep this used to guard
    # against is now closed by pinning EVERY image to the ONE sha JOB 6's
    # prebuild produces (`job6-prebuild/*:<sha>`), never by forcing a
    # build on every bring-up. `docker compose build`/`up --build` still
    # builds this tree on request via the `build:` block below.
    image: ${DEV_HEALTH_GO_DHO_IMAGE:-ghcr.io/full-chaos/dev-health-go-dho:local}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: dho
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: heavy
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    command:
      - worker
      - --queues=investment,metrics,reports,workgraph
      - --queue-concurrency=investment=1,metrics=2,reports=2,workgraph=1
      - --worker-group=heavy
      - --shutdown-timeout=7260s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-log-level
    environment: &go-worker-env
      <<: *go-worker-env-base
      # Investment shadow categorization (default off; empty = unset). Only this
      # group runs investment.materialize, so the switch and the TypeSafe key
      # are set here and on no other worker: the other groups declare their own
      # `environment:` and do not inherit it.
      INVESTMENT_SHADOW_PROVIDER: ${INVESTMENT_SHADOW_PROVIDER:-}
      INVESTMENT_SHADOW_ORG_IDS: ${INVESTMENT_SHADOW_ORG_IDS:-}
      INVESTMENT_SHADOW_SAMPLE_PERCENT: ${INVESTMENT_SHADOW_SAMPLE_PERCENT:-}
      INVESTMENT_SHADOW_CONCURRENCY: ${INVESTMENT_SHADOW_CONCURRENCY:-}
      INVESTMENT_SHADOW_MAX_SECONDS: ${INVESTMENT_SHADOW_MAX_SECONDS:-}
      INVESTMENT_SHADOW_MAX_USD_PER_RUN: ${INVESTMENT_SHADOW_MAX_USD_PER_RUN:-}
      INVESTMENT_SERVED_DECISION_ORG_IDS: ${INVESTMENT_SERVED_DECISION_ORG_IDS:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-}
    stop_grace_period: 7260s
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      # Every go-* service reads DEV_HEALTH_PG_DOMAIN_*
      # (domain) and DEV_HEALTH_PG_QUEUE_* (queue-control) from
      # go-worker-env-base -- gate on both poolers' healthchecks, not just
      # container-started, so a worker doesn't attempt its first connection
      # before the pooler it targets can actually serve one.
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
      # CHAOS-6279: the metrics-api dependency edge that used to live here
      # is deleted along with the flag that justified it
      # (--operational-bridge-url). The metrics-api service itself is
      # deleted too (CHAOS-8361): nothing called it.
    deploy: &go-worker-resources
      replicas: 1
      resources:
        limits: {cpus: "1.0", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}

  go-worker-ops:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: ops
    command:
      - worker
      - --queues=coverage,heartbeat,retention,webhooks
      - --queue-concurrency=coverage=1,heartbeat=1,retention=1,webhooks=4
      - --worker-group=ops
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  # This worker group selects both registered sync queues. Its queue set is
  # a group choice, not a runtime profile.
  go-worker-sync:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: sync
    command:
      - worker
      - --queues=sync
      - --queue-concurrency=sync=4
      - --worker-group=sync
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  # sync_provider is its own process, exactly as the Celery fleet splits
  # worker-ingest and worker-heavy out by queue. It is NOT fused into the
  # sync worker above: startup validation requires selected queues to equal
  # CONSTRUCTED queues, and buildProviderSyncWorker constructs nothing while
  # every provider route is default-off (CHAOS-3926).
  go-worker-sync-provider:
    <<: *go-worker
    labels:
      dev-health.io/worker-group: sync-provider
    command:
      - worker
      - --queues=sync_provider
      - --queue-concurrency=sync_provider=2
      - --worker-group=sync-provider
      - --shutdown-timeout=960s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 960s

  # The Go api (`dho api`, the operator image: no new build, no new image) with
  # the billing-edge listener on :8010 (CHAOS-6942): the Stripe webhook, GET|HEAD
  # /health in the Python billing edge's shape, and a JSON 404 for everything
  # else. It replaces the Python `billing-edge` service for local Stripe
  # forwarding (`stripe listen --forward-to
  # http://localhost:8010/api/v1/billing/webhooks/stripe`). The three secrets
  # are the operator's own (`ops/.env`), unset by default: /health then answers
  # 503 and names which one is missing, the same designed behaviour the Python
  # edge had.
  #
  # The api listener (:8000 inside the container) is the REST plane of the
  # stack (CHAOS-8361): it is not published; the `router` service owns host
  # port 8000 and sends every path that is not a query-api path here. The
  # internal listener (:8091, /api/v1/internal/*) has no route in the router
  # and no host port: the compose network is its boundary.
  go-api:
    <<: *go-worker-route-activate
    restart: unless-stopped
    command:
      - api
      - --api-addr=:8000
      - --api-billing-edge-addr=:8010
      - --api-internal-addr=:8091
      - *flag-http-addr
      - *flag-river-schema
      - *flag-log-level
    environment:
      # The api's own least-privilege login (provisioned by go-river-provision,
      # granted by go-river-migrate), on the direct postgres service: the api
      # pool is not a transaction-pooler client.
      DEV_HEALTH_PG_API_HOST: postgres
      DEV_HEALTH_PG_API_PORT: "5432"
      DEV_HEALTH_PG_API_USER: ${API_DATABASE_ROLE:-devhealth_api}
      DEV_HEALTH_PG_API_PASSWORD: ${API_DATABASE_PASSWORD:-devhealth_api}
      DEV_HEALTH_PG_DB: ${POSTGRES_DB:-postgres}
      API_DATABASE_ROLE: ${API_DATABASE_ROLE:-devhealth_api}
      # The api's own ClickHouse login (the users.d file of the `clickhouse`
      # service), component form, native port. With it the team and identity
      # admin routes are mounted and /health reads ClickHouse; /readyz then
      # also requires that the login holds exactly the api's manifest.
      DEV_HEALTH_CH_API_HOST: clickhouse
      DEV_HEALTH_CH_API_PORT: "9000"
      DEV_HEALTH_CH_API_USER: dho_api_ch
      DEV_HEALTH_CH_API_PASSWORD: ${API_CLICKHOUSE_PASSWORD:-dho_api_ch}
      DEV_HEALTH_CH_API_DB: ${CLICKHOUSE_DB:-default}
      VALKEY_URI: redis://valkey:6379/1
      # The access-token key, and the key that decrypts the stored provider
      # credentials (the same value the workers read: without it the
      # credential, SSO and PagerDuty routes cannot read a stored secret).
      <<:
        - *jwt-secret-key
        - *settings-encryption-key
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_TEAM: ${STRIPE_PRICE_ID_TEAM:-}
      STRIPE_PRICE_ID_ENTERPRISE: ${STRIPE_PRICE_ID_ENTERPRISE:-}
      LICENSE_PRIVATE_KEY: ${LICENSE_PRIVATE_KEY:-}
      # Email (Resend). The default provider writes the mail to the log.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@example.com}
      # The same allow-list query-api reads for /graphql.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # /health/workers checks worker_instances presence of these groups: the
      # Go fleet below. reconciler/scheduler/stream-* are not in the list:
      # they never register worker_instances presence.
      EXPECTED_WORKER_GROUPS: ${EXPECTED_WORKER_GROUPS:-heavy,ops,sync,sync-provider}
      # The router is the ONE peer whose X-Forwarded-For and X-Real-IP go-api
      # reads (rate-limit keys, audit rows): its fixed address on the planes
      # network, never a subnet. Every other peer is its own client.
      TRUSTED_PROXIES: *router-address
      # Observability: OpenTelemetry (traces and metrics to SigNoz). Off by
      # default.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-otel-collector:4317}
      # The envelope signing key, as a read-only file from the envelope_keys
      # volume (written by envelope-keys-init). A path, never the key value: it
      # stays off `docker compose config` and `inspect`. The key id, issuer and
      # audience must equal what query-api verifies against (same defaults).
      GO_API_ENVELOPE_PRIVATE_KEY_FILE: /run/envelope/private/envelope-private-key.pem
      GO_API_ENVELOPE_KEY_ID: ${GO_API_ENVELOPE_KEY_ID:-go-api-envelope-2026-08}
      GO_API_ENVELOPE_ISSUER: ${GO_API_ENVELOPE_ISSUER:-dev-health-ops-edge}
      GO_API_ENVELOPE_AUDIENCE: ${GO_API_ENVELOPE_AUDIENCE:-query-api}
    volumes:
      # Only the private/ subpath: go-api never sees anything else, and
      # nothing but go-api mounts this one.
      - type: volume
        source: envelope_keys
        target: /run/envelope/private
        read_only: true
        volume:
          subpath: private
    networks:
      - default
      - planes
    # The same exec-form probe as go-reconciler and query-api: /readyz on
    # --http-addr=:8080 (the listeners, the Postgres login's privilege
    # manifest, the ClickHouse login's privilege manifest and Valkey). The
    # router starts only when this probe passes. The image has no shell and no
    # curl.
    healthcheck:
      test: ["CMD", "/usr/local/bin/dho", "reconciler", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      # No direct dependency on the `migrate` service (a long-running Go
      # service must not gate on it); go-river-provision waits for it, so the
      # api login's grants see every semantic table.
      envelope-keys-init:
        condition: service_completed_successfully
      go-river-provision:
        condition: service_completed_successfully
      go-river-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_started
    ports:
      - "8010:8010"

  # One-shot: writes the envelope signing key (0400) and its JWKS (0444) into
  # the envelope_keys volume on the first `up`, as go-api's uid. `dho mint
  # envelope-keys` refuses to replace an existing key; with --skip-existing a
  # later `up` finds the complete set, changes nothing and exits 0 (a partial
  # or mismatching set exits non-zero and is left as it is). It prints no key
  # material. A refusal (exit 3: partial-by-hand, mismatching, symlinked or
  # too-open files) or failure (exit 1) is not retried (`restart: "no"`): the
  # container stays exited, dependents do not start, `up` reports "service
  # envelope-keys-init didn't complete successfully", and `docker compose logs
  # envelope-keys-init` shows the one-line reason naming the file. A crash
  # during the first write is repaired by the next `up`. Rotation is not automatic. The volume's mount point exists in the
  # operator image owned by 65532 (docker/go-worker.Dockerfile), which is what
  # makes a fresh named volume writable by that uid; an older pinned image
  # without the directory leaves the volume root-owned and this service fails
  # loudly with a permission error.
  envelope-keys-init:
    image: ${DEV_HEALTH_GO_DHO_IMAGE:-ghcr.io/full-chaos/dev-health-go-dho:local}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: dho
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    command:
      - mint
      - envelope-keys
      - --dir=/var/lib/dev-health/envelope-keys
      - --key-id=${GO_API_ENVELOPE_KEY_ID:-go-api-envelope-2026-08}
      - --skip-existing
    volumes:
      - envelope_keys:/var/lib/dev-health/envelope-keys

  # The Go query plane (`dho query-api`): /graphql and the /api/v1 read
  # routes the router sends to it (contracts/ingress/v1/planes.json). A client
  # reaches it with its own access token (GO_API_EDGE_JWT_SECRET); the signed
  # envelope (verified against the JWKS only, the private key is never mounted
  # here) is the credential of the operator verbs (`dho mint envelope`), not
  # of a client. No host port is published: reaching it from outside the
  # compose network is the router's job.
  query-api:
    image: ${DEV_HEALTH_GO_DHO_IMAGE:-ghcr.io/full-chaos/dev-health-go-dho:local}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: dho
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    command:
      - query-api
      - --query-addr=:8090
      - *flag-http-addr
      - *flag-log-level
    environment:
      # ClickHouse on the NATIVE port (9000), the DSN form the query routes read.
      CLICKHOUSE_URI: clickhouse://${CLICKHOUSE_USER:-ch}:${CLICKHOUSE_PASSWORD:-ch}@clickhouse:9000/${CLICKHOUSE_DB:-default}
      # The registry pool's own login (provisioned by go-river-provision from
      # QUERY_API_DATABASE_ROLE / _PASSWORD), on the direct postgres service.
      # A URI, so a role or password with a reserved URL character must be
      # percent-encoded by whoever sets it; the local defaults need nothing.
      GO_API_REGISTRY_POSTGRES_URI: postgresql://${QUERY_API_DATABASE_ROLE:-devhealth_query_api}:${QUERY_API_DATABASE_PASSWORD:-devhealth_query_api}@postgres:5432/${POSTGRES_DB:-postgres}
      QUERY_API_DATABASE_ROLE: ${QUERY_API_DATABASE_ROLE:-devhealth_query_api}
      GO_API_ENVELOPE_JWKS_PATH: /run/envelope/public/envelope-jwks.json
      GO_API_ENVELOPE_ISSUER: ${GO_API_ENVELOPE_ISSUER:-dev-health-ops-edge}
      GO_API_ENVELOPE_AUDIENCE: ${GO_API_ENVELOPE_AUDIENCE:-query-api}
      # /query (the end-user edge path) is not mounted without this key; the
      # same placeholder and variable the api and go-api services read.
      GO_API_EDGE_JWT_SECRET: ${JWT_SECRET_KEY:-local-dev-jwt-secret-key-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # One switch per REST route (an in-memory flag read once at start; unset,
      # the route is not mounted and its path answers 404). The router sends
      # each of these paths here and nothing else serves them, so every route
      # the router names is on, as in production. A Go test
      # (internal/ingressplanes) fails when a route switch of query-api is not
      # in this list.
      GO_API_DRILLDOWN_ISSUES_ENABLED: "true"
      GO_API_DRILLDOWN_PRS_ENABLED: "true"
      GO_API_EXPLAIN_ENABLED: "true"
      GO_API_FILTER_OPTIONS_ENABLED: "true"
      GO_API_FLAME_AGGREGATED_ENABLED: "true"
      GO_API_FLAME_ENABLED: "true"
      GO_API_HEATMAP_ENABLED: "true"
      GO_API_HOME_ENABLED: "true"
      GO_API_INVESTMENT_ENABLED: "true"
      GO_API_INVESTMENT_EXPLAIN_ENABLED: "true"
      GO_API_INVESTMENT_FLOW_ENABLED: "true"
      GO_API_INVESTMENT_SUNBURST_ENABLED: "true"
      GO_API_META_ENABLED: "true"
      GO_API_OPPORTUNITIES_ENABLED: "true"
      GO_API_PEOPLE_DRILLDOWN_ISSUES_ENABLED: "true"
      GO_API_PEOPLE_DRILLDOWN_PRS_ENABLED: "true"
      GO_API_PEOPLE_METRIC_ENABLED: "true"
      GO_API_PEOPLE_SEARCH_ENABLED: "true"
      GO_API_PEOPLE_SUMMARY_ENABLED: "true"
      GO_API_QUADRANT_ENABLED: "true"
      GO_API_SANKEY_ENABLED: "true"
      GO_API_WORK_UNITS_ENABLED: "true"
      GO_API_WORK_UNIT_EXPLAIN_ENABLED: "true"
      # The two explain routes read an organization's stored LLM settings with
      # the stack's settings key, and the platform LLM provider from these
      # three (the operator's own; unset, the route has no platform provider).
      <<: *settings-encryption-key
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Observability: OpenTelemetry, as on go-api. Off by default.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-otel-collector:4317}
    networks:
      - default
      - planes
    volumes:
      # Only the public/ subpath: the JWKS and nothing else.
      - type: volume
        source: envelope_keys
        target: /run/envelope/public
        read_only: true
        volume:
          subpath: public
    # Same exec-form probe as go-api (see there): /readyz on --http-addr=:8080.
    # query-api's /readyz checks ClickHouse, the registry Postgres pool, that
    # the JWKS file is readable and valid, and that the registry login holds
    # exactly the query-api privilege manifest (granted by go-river-migrate).
    healthcheck:
      test: ["CMD", "/usr/local/bin/dho", "reconciler", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      envelope-keys-init:
        condition: service_completed_successfully
      go-river-provision:
        condition: service_completed_successfully
      go-river-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # The router of the stack (CHAOS-8361): nginx on host port 8000, the one port
  # a client or the web app calls. It sends each request to the plane that
  # answers that path in production: /graphql and the query REST paths to
  # query-api, every other path to go-api. The table is
  # contracts/ingress/v1/planes.json; the mounted file is GENERATED from it
  # (`go run ./internal/ingressplanes/cmd/routerconf`) and is the checked-in
  # file itself, read-only, never a copy. The router adds no credential: it
  # sets no Authorization and reads no cookie (contracts/ingress/v1/README.md).
  #
  # The image is the one the real-nginx routing test runs the same file in
  # (ingressplanes.RouterImage, NGINX's unprivileged image, user 101): a
  # routing result is proven only for that nginx build. It is not built here
  # and has no pin variable. The file writes its pid and temporary files below
  # /tmp only, so the root file system is read-only.
  #
  # It starts only when both planes are healthy, so host port 8000 answers
  # only when a request can be served. The healthcheck is a GET of go-api's
  # /ready THROUGH the router (the path the Python api's probe had on this
  # port): it passes when nginx took the file, found go-api by name and go-api
  # answered 200. The address is 127.0.0.1, not localhost: nginx listens on
  # IPv4 only.
  router:
    image: ghcr.io/nginx/nginx-unprivileged:1.30-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ./contracts/ingress/v1/compose-router.nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      planes:
        ipv4_address: *router-address
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      go-api:
        condition: service_healthy
      query-api:
        condition: service_healthy

  go-reconciler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_DHO_IMAGE:-ghcr.io/full-chaos/dev-health-go-dho:local}
    # Default pull_policy, see go-worker-heavy's comment above.
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: dho
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: reconciler
    # CHAOS-3092 made "no Celery consumer serves provider units" true of
    # every deployment, which is exactly the assertion SweepModeActive
    # encodes -- so the sweep ships ACTIVE rather than as an operator
    # opt-in. A FLAG, not an environment entry: only credentials render
    # through `environment:`, every other setting is visible in `command:`.
    command:
      - reconciler
      - --shutdown-timeout=60s
      - --unreclaimable-sweep=${SYNC_UNRECLAIMABLE_SWEEP:-active}
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s
    # Ported from the now-deleted deploy/go-workers/compose-go-workers.yml
    # (CHAOS-3142) rather than dropped: per-stage budgets and the
    # step-overrun watchdog (internal/syncreconciler) make the process stay
    # up and mark /readyz unhealthy when a stage is stuck; this healthcheck
    # is what turns that into a container status Docker can actually see
    # (`docker ps`, `depends_on: condition: service_healthy` elsewhere in
    # this file). Reproduced: it does NOT itself trigger a
    # restart -- `restart: unless-stopped` (inherited from &go-worker)
    # restarts on container EXIT only; a process that stays running but
    # reports unhealthy (proven by freezing it with SIGSTOP: RestartCount
    # stayed 0, State.Health.Status went healthy->unhealthy->healthy again
    # on SIGCONT, container never restarted) is exactly the case this
    # healthcheck exists to make OBSERVABLE, not to remediate -- recovery
    # from a stuck stage is the step-overrun watchdog's own job inside the
    # process. The runtime image has no shell/curl/wget, so this
    # invokes `dho reconciler healthcheck`
    # (internal/reconcilerservice/service.go), which queries this same
    # container's own /readyz over loopback and mirrors that status as its
    # exit code. No other service in this fleet declares one to copy
    # interval/timeout/retries from -- these are this service's own.
    healthcheck:
      test: ["CMD", "/usr/local/bin/dho", "reconciler", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  go-scheduler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_DHO_IMAGE:-ghcr.io/full-chaos/dev-health-go-dho:local}
    # Default pull_policy, see go-worker-heavy's comment above.
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: dho
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: scheduler
    command:
      - scheduler
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
      pgbouncer-river-coordinator:
        condition: service_healthy
    environment:
      <<: *go-worker-env-base
    stop_grace_period: 60s

  go-stream-external:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_DHO_IMAGE:-ghcr.io/full-chaos/dev-health-go-dho:local}
    # Default pull_policy, see go-worker-heavy's comment above.
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
      target: dho
      args:
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    labels:
      dev-health.io/worker-group: stream-external
    command:
      - stream-runner
      - --profile=external
      - --shutdown-timeout=60s
      - *flag-http-addr
      - *flag-river-schema
      - *flag-domain-role
      - *flag-queue-role
      - *flag-queue-mode
      - *flag-coordinator-mode
      - *flag-domain-pooler
      - *flag-log-level
    depends_on:
      go-contractcheck:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      pgbouncer-river-queue:
        condition: service_healthy
    environment:
      <<: [*go-worker-no-coordinator, *go-worker-env-base]
      # Not a River-queue consumer, no coordinator-claim path: the stream
      # runner opens the domain pool only. All four coordinator values are
      # blank (see x-go-worker-no-coordinator), never HOST alone.
    stop_grace_period: 60s

  go-stream-ingest:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_DHO_IMAGE:-ghcr.io/full-chaos/dev-health-go-dho:local}
    build:
      context: .
      dockerfile: docker/go-worker.Dockerfile
