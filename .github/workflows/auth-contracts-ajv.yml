name: Auth Contracts ajv

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  auth-contracts-ajv:
    name: auth-contracts-ajv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No `paths:` trigger: a path-filtered workflow reports nothing on a PR
      # that touches no matching file, and a check that is absent is not a
      # check that passed. The job always runs and always concludes; only the
      # work below is conditional.
      - name: Decide whether the contracts changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash ci/auth-contracts-ajv/scope.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22.12.0

      # The lockfile pins ajv: strictRequired is an ajv lint rather than a spec
      # rule, so an unpinned upgrade could change what the contract enforces.
      - name: Install pinned ajv
        if: steps.scope.outputs.run == 'true'
        working-directory: ci/auth-contracts-ajv
        run: npm ci --ignore-scripts

      - name: Runner tests (each guard fails closed)
        if: steps.scope.outputs.run == 'true'
        working-directory: ci/auth-contracts-ajv
        run: node --test run.test.mjs

      - name: Prove strict mode is on
        if: steps.scope.outputs.run == 'true'
        working-directory: ci/auth-contracts-ajv
        run: node run.mjs --self-test

      - name: Validate every contracts/auth/v1 manifest corpus with ajv 2020-12 strict
        if: steps.scope.outputs.run == 'true'
        working-directory: ci/auth-contracts-ajv
        run: node run.mjs
