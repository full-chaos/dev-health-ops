  go-reconciler:
    <<: *go-worker
    image: ${DEV_HEALTH_GO_RECONCILER_IMAGE:-ghcr.io/full-chaos/dev-health-go-reconciler:latest}
    # r5 P1: own pull-policy override, same reasoning as go-worker-heavy's
    # DEV_HEALTH_GO_WORKER_PULL_POLICY -- this service names a different
    # `*_IMAGE` family and needs its own opt-out for a digest pin.
    pull_policy: ${DEV_HEALTH_GO_RECONCILER_PULL_POLICY:-build}
