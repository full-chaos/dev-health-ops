      migrate:
        condition: service_completed_successfully

  # Apply the pinned River bundle with the elevated local/admin DSN, then
  # independently check that the resulting schema is current. Neither DSN
  # nor this binary is exposed to a long-running Go service.
  go-river-migrate:
    # codex review (JOB 6 re-render, P1): same `pull_policy: build` hardening
    # as go-river-provision above -- force a fresh build of this tree
    # rather than reusing a previously built local image tag.
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-1970-01-01T00:00:00Z}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        if [ -z "$$MIGRATION_DATABASE_URI" ];
