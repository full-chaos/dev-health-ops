{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" . }}
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.selectorLabels" . | nindent 6 }}
    {{- if and .Values.goApi.enabled .Values.goApi.internal.enabled }}
    {{- /*
    CHAOS-7181: NetworkPolicies are additive, and this policy's "pod-to-pod within namespace" rule
    admits every pod on every port. The go-api pods are gated by their own policy (go-api-internal)
    so the internal port is reachable only from goApi.internal.allowedFrom; they keep this
    policy's egress through the go-api-egress policy below.
    */}}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: NotIn, values: [go-api]}
    {{- end }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- /*
    CHAOS-8552: no ingress-controller rule on this policy. It selects (almost) every pod of the release, so a controller rule
    here would admit the controller at the datastores and workers too (a goApi.port of 9000 or 6432 opened the ClickHouse native
    or PgBouncer port to it). The controller is admitted by the per-component policies below, to the components the Ingress
    routes to (go-api, web, query-api) on their Service port. The go-api pods also keep whatever the go-api-internal policy
    opens (every port but the internal one); this policy's in-namespace rule below still admits every release pod on every port.
    */}}
    # Allow pod-to-pod within namespace
    - from:
        - podSelector: {}
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Internal communication
    - to:
        - podSelector: {}
    # External HTTPS (GitHub, GitLab, Jira, Stripe APIs)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- range $target := list (dict "component" "go-api" "enabled" .Values.goApi.enabled "port" .Values.goApi.port) (dict "component" "web" "enabled" .Values.web.enabled "port" .Values.web.port) (dict "component" "query-api" "enabled" .Values.queryApi.enabled "port" .Values.queryApi.port) }}
{{- if $target.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" $ }}-ingress-{{ $target.component }}
  namespace: {{ include "dev-health.namespace" $ }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" (printf "%s-ingress" $target.component) "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" $target.component "context" $) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # CHAOS-8552: the ingress controller reaches this component's Service port and nothing else. The controller namespace is
    # matched by the label Kubernetes sets on every namespace (kubernetes.io/metadata.name).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.ingressControllerNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ $target.port }}
{{- end }}
{{- end }}
{{- if and .Values.goApi.enabled .Values.goApi.internal.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" . }}-go-api-egress
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "go-api" "context" $) | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Internal communication
    - to:
        - podSelector: {}
    # External HTTPS (GitHub, GitLab, Jira, Stripe APIs)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
