# gwc-venue-bigboy (2026-09-20, chris: "just go ahead and deploy bigboy images"); re-pinned 2026-09-24 by prod-ops
# (R427 pre-prod venue, D2288) to ops main a97b97ed (CHAOS-6512+6259 group; previous overlay kept as .bak-1152962c): bigboy runs PROD's build
# (was rev 156, ops 3689edec) so a venue receipt admits at the same build production runs.
# Self-contained: also carries compose.bigboy.overrides.yml content (query-api x2 + ports) so the
# recreate does not drop the running project's overrides.
# CHAOS-8361: the stack is Go-only. No service here runs the Python api image: the `api` service of the base
# compose.yml is in a profile nothing enables, `migrate` runs the dho image, the smoke runner
# (compose.bigboy.smoke.yml) runs a plain Python base image, and venue-prove is on the stack's networks itself.
services:
  # CHAOS-8361: the Python api is retired on bigboy, as in prod. The base compose.yml (a host file) still
  # declares the service, so it moves to a profile nothing enables: `up` never starts it and `ps` never lists
  # it. The running container is removed BEFORE the cut's `up` (`docker compose ... rm -sf api`, one approved
  # line on the lead's GO, the order the billing-edge retirement used). Nothing else in this file names it:
  # web no longer waits for it and venue-prove no longer shares its network namespace.
  api:
    profiles:
      - retired-python-api
  # CHAOS-7019 (2026-09-28, gwc-bigboy-ops-2): bigboy-cut.sh never rebuilds `web`, so it silently ran
  # a stale local build across cuts (found live during the CHAOS-6262 proof: /dev still served a
  # pre-#955 page). Pin `web` to its own CI-built image (Build Docker images workflow, ghcr.io/full-chaos/
  # dev-health-web:sha-<S7>), same pattern as the other 4 images below, instead of building on the host.
  web:
    image: ghcr.io/full-chaos/dev-health-web@sha256:a087d8e24c15d0ac942f034b4c61efacc11db90239e6c479489804365dfddc38
    build: !reset null
    # CHAOS-8361: the base file makes web wait for a healthy `api`. That service is retired above, and compose
    # refuses a dependency on a service of a disabled profile, so the list is stated again without it. web
    # reaches the planes through the router (BACKEND_URL, compose.bigboy.router.yml).
    depends_on: !override
      valkey:
        condition: service_healthy
      bugsink:
        condition: service_started
  # CHAOS-6434 (ops main a97b97ed and after): dev-health-query-api is RETIRED. query-api is now the
  # `dho query-api` verb of the dho image; the root compose.yml's own query-api service (docker/query-api.Dockerfile)
  # can no longer build against this ops sha, so this overlay replaces its image/command/entrypoint entirely
  # rather than layering a digest onto it.
  query-api:
    image: ghcr.io/full-chaos/dev-health-go-dho@sha256:970d2b765aac5da23e1ec58482663e51ac1ab5a78fc024d3d81feabfb0e14d44
    build: !reset null
    entrypoint: !override ["/usr/local/bin/dho"]
    command: !override ["query-api"]
    # CHAOS-7079 (D2930/D2939/D2943): the port range published to the host is the PUBLIC
    # listener only (container 8090, via check-route-coverage.py:85 from the host itself,
    # bigboy-cut.sh:123) -- rebind to loopback so it is never reachable off-host. This was
    # publishing on 0.0.0.0 before.
    ports: !override
      - "127.0.0.1:8091-8092:8090"
    deploy:
      replicas: 2
    # CHAOS-7079: the INTERNAL listener (CHAOS-6780/6783, same mechanism prod's chart
    # enables via deploy/chart/templates/query-api-internal.yaml). Container-only port,
    # never in `ports:` above, never published to the host.
    #
    # D2947/D2953 (2026-09-28): network membership ALONE does not admit anything here --
    # `query-api` stays a member of BOTH `dev-health` and `dho-query-internal`, and
    # `QUERY_API_INTERNAL_ADDR` binds ":8095" (every interface, both replicas), so a
    # container on `dev-health` alone could reach `:8095` too, proven live in a throwaway
    # compose project (`/var/lib/oci-cache/lane-scratch/gwc-bigboy-ops-3/bindtest/`,
    # TEST-EVIDENCE). Ruling D2953 (option c): stay on ONE scaled service (no split into
    # named replicas -- that needs a duplicated ~40-line env block plus a bigboy-cut.sh
    # edit, too much drift for a hand-synced venue file); the real admission control moves
    # INTO the Go listener: it must accept a connection only when the peer address is
    # inside `QUERY_API_INTERNAL_ALLOWED_CIDRS` (new variable, gwc-cut-hardening's Go work,
    # tracked against CHAOS-7097 which is Rev 198 and has no PR yet as of this comment --
    # confirm the ticket's scope covers peer-CIDR filtering, not only route-set separation,
    # before trusting this line is current).
    #
    # THIS FILE ALONE DOES NOT CLOSE THE GAP. The fixed subnet named in the environment
    # block below only makes the allowlist value KNOWN in advance; nothing enforces it
    # until the Go change ships. Do not apply this compose change in a cut before that Go
    # PR is in the running image.
    networks:
      - dho-query-internal
    # CHAOS-6967(b)/6971/D2709 (2026-09-27): these ~23 REST routes' Go-plane switch is a
    # plain in-memory flag flipped ONCE at container boot from its own bare env var --
    # never Postgres, never the routeswitch ledger `dho goapi routing enable` writes (that
    # ledger is wired only into /query, GraphQL). bigboy-cut.sh recreates this service fresh
    # every cut (Trap #420) with none of these set, so every REST proof leg 404s on a
    # correctly-pathed, correctly-bearer'd request until they're set here to match prod.
    # Values copied verbatim from deploy/values.prod.yaml:495-537 (the query-api Deployment's
    # own env block) plus :486 (GO_API_INVESTMENT_EXPLAIN_ENABLED, a separate block a prior
    # PR #121 once edited by mistake -- confirmed against the top-level queryApi:/api: keys
    # and the rendered manifest, not just proximity). Re-derive from that same file at every
    # cut; never hand-edit this list without citing the source lines again.
    environment:
      # CHAOS-7079: the internal listener's OWN address (CHAOS-6780/6783). Container-only;
      # never added to `ports:` above. Matches prod's mechanism (deploy/values.prod.yaml
      # QUERY_API_INTERNAL_ADDR), a different literal port (8095) so it is never confused
      # with the host-published 8091-8092 range, which is the PUBLIC listener only.
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      QUERY_API_INTERNAL_ADDR: ":8095"
      # CHAOS-7214 (lead-authorized): the MCP caller-class listener (container-only, never in `ports:`),
      # its allowed-cidrs boundary (the same subnet as the internal listener), and the proof routes'
      # gate (/query/proof-mcp, /query/proof-write; internal listener only, proof-org gated).
      QUERY_API_MCP_ADDR: ":8096"
      QUERY_API_MCP_BOUNDARY: allowed-cidrs
      QUERY_API_MCP_ALLOWED_CIDRS: 10.199.79.0/28
      GO_API_PROOF_WRITE_ROUTE_ENABLED: "true"
      # D2953: the real admission control (not yet built, gwc-cut-hardening/CHAOS-7097 or
      # its successor ticket -- confirm scope before trusting this is wired). Must equal
      # the `dho-query-internal` network's `ipam.config` subnet below, byte for byte.
      QUERY_API_INTERNAL_ALLOWED_CIDRS: 10.199.79.0/28
      GO_API_QUADRANT_ENABLED: "true"
      GO_API_FILTER_OPTIONS_ENABLED: "true"
      GO_API_DRILLDOWN_PRS_ENABLED: "true"
      GO_API_DRILLDOWN_ISSUES_ENABLED: "true"
      GO_API_META_ENABLED: "true"
      GO_API_EXPLAIN_ENABLED: "true"
      GO_API_PEOPLE_SEARCH_ENABLED: "true"
      GO_API_PEOPLE_SUMMARY_ENABLED: "true"
      GO_API_PEOPLE_METRIC_ENABLED: "true"
      GO_API_FLAME_ENABLED: "true"
      GO_API_PEOPLE_DRILLDOWN_PRS_ENABLED: "true"
      GO_API_PEOPLE_DRILLDOWN_ISSUES_ENABLED: "true"
      GO_API_FLAME_AGGREGATED_ENABLED: "true"
      GO_API_HEATMAP_ENABLED: "true"
      GO_API_SANKEY_ENABLED: "true"
      GO_API_INVESTMENT_ENABLED: "true"
      GO_API_INVESTMENT_FLOW_ENABLED: "true"
      GO_API_INVESTMENT_SUNBURST_ENABLED: "true"
      GO_API_HOME_ENABLED: "true"
      GO_API_OPPORTUNITIES_ENABLED: "true"
      GO_API_WORK_UNITS_ENABLED: "true"
      GO_API_WORK_UNIT_EXPLAIN_ENABLED: "true"
      GO_API_INVESTMENT_EXPLAIN_ENABLED: "true"
      # D2728 (2026-09-27, CHAOS-6987): prod's own chart sets query-api's end-user edge-JWT
      # verification key from the SAME Secret's JWT_SECRET_KEY (deploy/values.prod.yaml:552-556,
      # queryApi.extraEnv -- GO_API_EDGE_JWT_SECRET, a secretKeyRef, separate from the
      # GO_API_ENVELOPE_* internal service-to-service scheme above). This overlay never set it,
      # so a real, valid, api-issued end-user JWT was rejected by query-api as "Invalid or
      # expired token" -- query-api had no key to verify it against at all. ${JWT_SECRET_KEY}
      # is the same compose-substitution variable api/go-worker already use; the value is never
      # written here, only referenced.
      GO_API_EDGE_JWT_SECRET: ${JWT_SECRET_KEY}
      # CHAOS-6987 (D2728 follow-up, generator-caught drift): query-api's chart definition
      # (deploy/values.prod.yaml ops.queryApi.extraEnv) also carries these four secretKeyRefs;
      # this overlay had never set them either (same class as GO_API_EDGE_JWT_SECRET -- caught
      # by ci/bigboy/generate-query-api-enabled-flags.py's own drift check, not by hand-audit).
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      # TEMPORARY (gap-4 investigation, 2026-09-27): debug logging to trace the
      # "Username/Password Authentication Failed" 401. Revert after.
      DEV_HEALTH_LOG_LEVEL: debug
  # CHAOS-7054: migrate runs `dho migrate upgrade --river` (the base file's command) from the dho image, the same
  # digest as query-api above: the one-shot the cut runs before it recreates the planes.
  migrate:
    image: ghcr.io/full-chaos/dev-health-go-dho@sha256:970d2b765aac5da23e1ec58482663e51ac1ab5a78fc024d3d81feabfb0e14d44
    build: !reset null
    # CHAOS-8744: Postgres migration 0146 copies each MCP class row at the RUNNING query-api's schema digest. The roll reads it
    # from that query-api's GET /registry BEFORE the cut and exports it; empty by default (with MCP class rows present, 0146
    # then refuses and rolls back). The chart's form is migrations.hook.classDecisionLiveSchemaDigest.
    environment:
      DHO_CLASS_DECISION_LIVE_SCHEMA_DIGEST: ${DHO_CLASS_DECISION_LIVE_SCHEMA_DIGEST:-}
  # CHAOS-8647: the web-path smoke runs `dho smoke web-path` from the dho image, the same digest as query-api and
  # migrate. compose.bigboy.smoke.yml (the smoke's own chain) holds the rest of the service.
  web-smoke:
    image: ghcr.io/full-chaos/dev-health-go-dho@sha256:970d2b765aac5da23e1ec58482663e51ac1ab5a78fc024d3d81feabfb0e14d44
    build: !reset null
    profiles: ["smoke"]
  # one-off prover shell, never started by 'up' (profile venue). POSTGRES_URI is interpolated by compose from
  # the same defaults the stack uses, so no credential passes through a file or argv of this lane.
  venue-tools:
    image: ghcr.io/full-chaos/dev-health-go-api-tools@sha256:7c767865398aa0a9053dcad5cd93001b1f4771fbb4690570210c25d8369ae48f
    profiles: ["venue"]
    user: "1001:1001"
    entrypoint: ["sh", "-c"]
    working_dir: /work
    networks: [dev-health]
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-devhealth}:${POSTGRES_PASSWORD:-devhealth}@postgres:5432/${POSTGRES_DB:-devhealth}
      GO_API_QUERY_API_URL: http://query-api:8090
      GO_API_PROVE_VENUE_ACK: bigboy-compose
      GO_API_ENVELOPE_KEY_ID: local-dev-20260906
      GO_API_ENVELOPE_ISSUER: dev-health-ops-edge
      GO_API_ENVELOPE_AUDIENCE: query-api
      # value comes from the invoking environment (never written here)
      GO_API_ENVELOPE_PRIVATE_KEY: ${GO_API_ENVELOPE_PRIVATE_KEY:-}
    volumes:
      - ./.go-api-dev/envelope-private-key.pem:/keys/envelope.pem:ro
      - /var/lib/oci-cache/lane-scratch/gwc-venue-bigboy:/work
  # venue prover. CHAOS-8361: it no longer shares the Python api's network namespace (`network_mode:
  # "service:api"`, for an edge on localhost). It proves through the routed /graphql in Go-edge mode
  # (bigboy-graphql-prove.sh) and is on the two networks the api container was on: `dev-health` (the router,
  # query-api, postgres) and `dho-query-internal` (CHAOS-7214: the class proof reaches query-api's internal
  # listener :8095 and MCP listener :8096 from an allowed peer, 10.199.79.0/28).
  venue-prove:
    image: ghcr.io/full-chaos/dev-health-go-api-tools@sha256:7c767865398aa0a9053dcad5cd93001b1f4771fbb4690570210c25d8369ae48f
    profiles: ["venue"]
    user: "1001:1001"
    entrypoint: ["sh", "-c"]
    working_dir: /work
    networks:
      - dev-health
      - dho-query-internal
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-devhealth}:${POSTGRES_PASSWORD:-devhealth}@postgres:5432/${POSTGRES_DB:-devhealth}
      GO_API_QUERY_API_URL: http://query-api:8090
      GO_API_PROVE_VENUE_ACK: bigboy-compose
      GO_API_ENVELOPE_KEY_ID: local-dev-20260906
      GO_API_ENVELOPE_ISSUER: dev-health-ops-edge
      GO_API_ENVELOPE_AUDIENCE: query-api
    volumes:
      - ./.go-api-dev/envelope-private-key.pem:/keys/envelope.pem:ro
      - /var/lib/oci-cache/lane-scratch/gwc-venue-bigboy:/work
  # R427 pre-prod venue (prod-ops, 2026-09-24): the dho api (Go plane) at prod's build. Its Postgres and ClickHouse
  # logins and this env file are provisioned by _records/bigboy-1152962/setup-goapi-logins.sh (0600, never printed).
  go-api:
    image: ghcr.io/full-chaos/dev-health-go-dho@sha256:970d2b765aac5da23e1ec58482663e51ac1ab5a78fc024d3d81feabfb0e14d44
    entrypoint: ["/usr/local/bin/dho"]
    command: ["api"]
    env_file:
      - path: ./.go-api-dev/go-api.env
        required: true
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    networks: [dev-health]
    ports:
      - "127.0.0.1:8093:8000"
    restart: unless-stopped
  # CHAOS-7079: base compose.yml's own `clickhouse` service keeps its `dev-health`
  # membership unchanged; this only ADDS the dedicated read-only-callers network so a
  # future read-only ClickHouse user (ci/bigboy/prepare-clickhouse-readonly-user.sql,
  # prepared, not applied) is reachable from it without opening `dev-health` itself to
  # any new caller.
  clickhouse:
    networks:
      - dho-clickhouse-readers
    # CHAOS-7079: the image entrypoint writes access_management=0 for the default user, so no
    # CREATE USER/PROFILE/GRANT can run (Code 497). 1 lets the readers-user SQL apply.
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

# CHAOS-7079 (D2930/D2938/D2939/D2943): two dedicated networks, fixed `name:` so another
# compose project (a separate `docker compose -p ...`) can reference them `external: true`
# by that exact name -- MCP's own venue plan does this (`dho-query-internal`,
# `dho-clickhouse-readers`; names agreed with them, not invented here).
#
# `internal: true` on BOTH: this only removes the network's own route to the outside
# world -- it does NOT block another compose project from joining `external: true` (that
# is ordinary Docker network membership, unaffected by the `internal` flag), and it does
# NOT restrict which of a MULTI-HOMED member's own listeners answer which network: a
# process bound to ":PORT" (every interface) is reachable from EVERY network that
# container is a member of, `internal: true` or not. Proven live (D2947, throwaway compose
# project, TEST-EVIDENCE): `query-api` keeps its unchanged `dev-health` membership
# alongside `dho-query-internal`, and its internal listener bound ":8095" -- a container on
# `dev-health` alone could still reach it. Network MEMBERSHIP on `dho-query-internal` is
# therefore NOT the admission control by itself; the fixed subnet below exists so
# `QUERY_API_INTERNAL_ALLOWED_CIDRS` (query-api's own environment block above) names a
# known value for the Go-side peer-CIDR check that IS the real control (D2953, pending,
# gwc-cut-hardening -- see that env var's own comment for the ticket caveat).
#
# `dho-clickhouse-readers` carries the SAME multi-homed-bind class of exposure
# (`clickhouse` also keeps its `dev-health` membership, and the stock ClickHouse image
# listens on every interface by default) -- D2953 did not rule on this network, only on
# query-api's. Not fixed in this PR's network config; ClickHouse's OWN per-user `HOST IP`
# restriction (a config field on `CREATE USER`, no code change, no network dependency) is
# used instead for the one user this PR prepares
# (`ci/bigboy/prepare-clickhouse-readonly-user.sql`) -- flagged to team-lead as a related,
# separately-closed finding, not silently assumed safe from network isolation alone.
networks:
  dho-query-internal:
    name: dho-query-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.199.79.0/28
  dho-clickhouse-readers:
    name: dho-clickhouse-readers
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.199.80.0/28
