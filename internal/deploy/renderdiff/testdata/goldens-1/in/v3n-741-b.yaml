apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dev-health-ops-postgresql
  namespace: dev-health
  labels:
    helm.sh/chart: ops-0.1.0
    app.kubernetes.io/name: ops
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: dev-health
    app.kubernetes.io/component: postgresql
spec:
  serviceName: dev-health-ops-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops
      app.kubernetes.io/instance: dev-health
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops
        app.kubernetes.io/instance: dev-health
        app.kubernetes.io/component: postgresql
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: pg-hba
          configMap:
            name: dev-health-ops-postgresql-hba
      containers:
        - name: postgresql
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          args:
            - -c
            - hba_file=/etc/postgresql/hba/pg_hba.conf
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "placeholder"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "dev-health-ops-postgresql-password"
                  key: "POSTGRES_PASSWORD"
            - name: POSTGRES_DB
              value: "placeholder"
            # Must match the compose stack exactly: the volume is mounted at the
            # parent /var/lib/postgresql and PGDATA is a subdirectory of it,
            # never the mount root (which holds lost+found and other reserved
            # entries) and never the image's own default (which moves between
            # majors). Leaving PGDATA unset only ever worked by coincidence:
            # through 17 the image default was /var/lib/postgresql/data, which
            # happened to equal the old mount path, and 18 relocated it to
            # /var/lib/postgresql/<major>/docker, at which point the entrypoint
            # refuses to start against an "unused" mount. See
            # https://github.com/docker-library/postgres/pull/1259.
            - name: PGDATA
              value: /var/lib/postgresql/pgdata
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 400m
              memory: 256Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: pg-hba
              mountPath: /etc/postgresql/hba
              readOnly: true
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - "placeholder"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - "placeholder"
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

