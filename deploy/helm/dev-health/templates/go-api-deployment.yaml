{{- /*
The Go HTTP api: `dho api` from the dho operator-binary image. It takes over
the Python api's REST routes one area at a time; until an area is ported it
mounts no business route and answers every api path with the Python api's own
404 body. Nothing routes to it yet: the ingress path table that sends a
ported path here is a deploy-repo change made per ported area, so enabling
this Deployment changes no request's destination. Defaults off.

Two listeners, never one: the api listener (goApi.port) carries requests, the
operator listener (goApi.operatorPort) carries /healthz, /readyz and /metrics,
so probes never pass through request middleware.

Configuration is flags (CHAOS-4020), rendered below so `helm template` shows
it, plus two Secret keys by reference (API_DATABASE_URI, JWT_SECRET_KEY); no
other platform Secret or ConfigMap is inherited unless goApi.envFrom lists
one. The platform ConfigMap in particular is NOT inherited by default: it pins
OTEL_SERVICE_NAME=dev-health-ops, and this service names itself
dev-health-api.
*/ -}}
{{- if .Values.goApi.enabled }}
{{- if and .Values.goApi.internal.enabled (or (eq (int .Values.goApi.internal.port) (int .Values.goApi.port)) (eq (int .Values.goApi.internal.port) (int .Values.goApi.operatorPort))) }}
{{- fail "goApi.internal.port must differ from goApi.port and goApi.operatorPort: each listener has its own port" }}
{{- end }}
{{- if .Values.goApi.internal.enabled }}
{{- range .Values.goApi.extraArgs }}
{{- if regexMatch "^--?api-internal-addr" . }}{{- fail "goApi.extraArgs must not set --api-internal-addr: the chart owns the internal listener (goApi.internal.port); a second flag moves it onto a port the internal Service and NetworkPolicy do not gate" }}{{- end }}
{{- end }}
{{- range .Values.goApi.extraEnv }}
{{- if eq .name "DEV_HEALTH_API_INTERNAL_ADDR" }}{{- fail "goApi.extraEnv must not set DEV_HEALTH_API_INTERNAL_ADDR: the chart owns the internal listener (goApi.internal.port)" }}{{- end }}
{{- end }}
{{- range .Values.goApi.internal.allowedFrom }}
{{- if not (or (and .matchLabels (gt (len .matchLabels) 0)) (and .matchExpressions (gt (len .matchExpressions) 0))) }}
{{- fail "goApi.internal.allowedFrom entries need a non-empty matchLabels or matchExpressions: an empty podSelector admits every pod in the namespace" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-health.fullname" . }}-go-api
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "go-api" "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.goApi.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "go-api" "context" $) | nindent 6 }}
  template:
    metadata:
      {{- with .Values.goApi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "go-api" "context" $) | nindent 8 }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "dev-health.serviceAccountName" . }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: go-api
          image: {{ include "dev-health.goApiImage" . }}
          imagePullPolicy: {{ .Values.goApi.image.pullPolicy }}
          args:
            - api
            - {{ printf "--api-addr=:%v" .Values.goApi.port | quote }}
            - {{ printf "--http-addr=:%v" .Values.goApi.operatorPort | quote }}
            {{- if .Values.goApi.internal.enabled }}
            - {{ printf "--api-internal-addr=:%v" .Values.goApi.internal.port | quote }}
            {{- end }}
            {{- with .Values.goApi.corsAllowedOrigins }}
            - {{ printf "--cors-allowed-origins=%s" . | quote }}
            {{- end }}
            {{- range .Values.goApi.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.goApi.port }}
              protocol: TCP
            - name: operator
              containerPort: {{ .Values.goApi.operatorPort }}
              protocol: TCP
            {{- if .Values.goApi.internal.enabled }}
            - name: internal
              containerPort: {{ .Values.goApi.internal.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.goApi.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- /*
            Both by secretKeyRef, never inline, and not optional: without
            them `dho api` refuses to start, and a missing Secret key shows
            as CreateContainerConfigError on the Pod instead of a crash loop.
            API_DATABASE_URI is the api role's own DSN (API_DATABASE_ROLE,
            default devhealth_api); JWT_SECRET_KEY is the access-token key the
            Python api and web already read.
            */}}
            - name: API_DATABASE_URI
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.secretName" . }}, key: API_DATABASE_URI}}
            - name: JWT_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ include "dev-health.secretName" . }}, key: JWT_SECRET_KEY}}
            {{- /*
            A route-behaviour setting the Python api reads from the platform
            ConfigMap it envFroms: dho api reads the SAME key of the SAME
            ConfigMap, so the two planes can never disagree on it. Optional:
            an absent key leaves the variable unset on both planes.
            HIDE_MIGRATED_CHILD_CONFIGS filters GET /api/v1/admin/sync-configs.
            SYNC_WATERMARK_OVERLAP and SYNC_INCREMENTAL_HEAVY_MAX_WINDOW_DAYS
            set the HEAVY window cap GET /api/v1/admin/sync-runs/{run_id}/units
            judges watermark lag against.
            */}}
            - name: HIDE_MIGRATED_CHILD_CONFIGS
              valueFrom: {configMapKeyRef: {name: {{ include "dev-health.configMapName" . }}, key: HIDE_MIGRATED_CHILD_CONFIGS, optional: true}}
            - name: SYNC_WATERMARK_OVERLAP
              valueFrom: {configMapKeyRef: {name: {{ include "dev-health.configMapName" . }}, key: SYNC_WATERMARK_OVERLAP, optional: true}}
            - name: SYNC_INCREMENTAL_HEAVY_MAX_WINDOW_DAYS
              valueFrom: {configMapKeyRef: {name: {{ include "dev-health.configMapName" . }}, key: SYNC_INCREMENTAL_HEAVY_MAX_WINDOW_DAYS, optional: true}}
          {{- with .Values.goApi.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: operator}
            {{- toYaml .Values.goApi.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: operator}
            {{- toYaml .Values.goApi.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.goApi.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.goApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.goApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.goApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-go-api
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "go-api" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "go-api" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.goApi.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.goApi.internal.enabled }}
---
{{- /*
CHAOS-7181: the unauthenticated /api/v1/internal/* routes (acr's entitlement
client) live ONLY on this listener. It has no Ingress and no path in the public
Service; the NetworkPolicy below is the auth boundary (no intranet bearer).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-go-api-internal
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "go-api-internal" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "go-api" "context" $) | nindent 4 }}
  ports:
    - name: internal
      port: {{ .Values.goApi.internal.port }}
      targetPort: internal
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dev-health.fullname" . }}-go-api-internal
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "go-api-internal" "context" $) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "go-api" "context" $) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Every TCP port EXCEPT the internal one is open to every source, exactly as before this
    # policy existed (Ingress, probes, scrapes, and any other listener the process is started
    # with, e.g. the billing edge). It is written as the two ranges around the internal port
    # (endPort), not derived from the args/env the process gets: a derived list can miss a
    # listener configured a way the template does not parse and silently deny it.
    - ports:
        {{- $ip := int .Values.goApi.internal.port }}
        {{- if gt $ip 1 }}
        - protocol: TCP
          port: 1
          endPort: {{ sub $ip 1 }}
        {{- end }}
        {{- if lt $ip 65535 }}
        - protocol: TCP
          port: {{ add $ip 1 }}
          endPort: 65535
        {{- end }}
    {{- /*
    The internal listener trusts every peer that can connect, so the network is the boundary:
    only the pod selectors listed in goApi.internal.allowedFrom (acr's api pods, set by the
    umbrella chart). An empty list renders NO rule for the internal port -- a `from` list that
    is empty or absent would admit every source, so the rule is omitted, denying the port.
    Never every pod in the namespace.
    */}}
    {{- with .Values.goApi.internal.allowedFrom }}
    - from:
        {{- range . }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.goApi.internal.port }}
    {{- end }}
{{- end }}
{{- end }}
