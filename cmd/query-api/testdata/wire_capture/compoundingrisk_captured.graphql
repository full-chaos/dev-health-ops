query CompoundingRisk($orgId: String!, $filter: CompoundingRiskFilterInput = null) {
  compoundingRisk(orgId: $orgId, filter: $filter) {
    orgId
    breakout
    generatedAt
    rows {
      day
      scope
      scopeId
      scopeLabel
      score
      severity
      computedAt
      components {
        churnNorm
        complexityNorm
        ownershipNorm
        reviewNorm
        reworkChurn
        complexityDelta
        ownershipGini
        singleOwnerRatio
        reviewLatencyP90h
        __typename
      }
      weights {
        churn
        complexity
        ownership
        review
        __typename
      }
      thresholds {
        elevated
        high
        __typename
      }
      __typename
    }
    trend {
      day
      score
      severity
      __typename
    }
    __typename
  }
}