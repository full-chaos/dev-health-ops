{{- /*
CHAOS-4351 (historical): a second copy of the api Deployment/Service -- same
image, same args, same configMap/secret envFrom -- created to serve ONLY as
the Go daily-runtime's metrics compatibility bridge target.
CHAOS-6240/CHAOS-6279: the routes it existed to isolate
(worker_metrics.py's bridge handlers) and the --operational-bridge-url flag
that pointed the heavy worker group at this Service instead of api's are
both deleted (zero remaining callers/readers, confirmed by grep). This
Deployment now serves nothing this PR can see either group actually
reaching -- whether to retire it is a separate, not-yet-decided follow-up
(named, not executed, in CHAOS-6279's RISK-NOTES). Deliberately has no
ingress.yaml route (unlike api/billing-edge) -- a ClusterIP Service
reachable only by in-cluster DNS is the "no public route".
*/}}
{{- if .Values.metricsApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-health.fullname" . }}-metrics-api
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "metrics-api" "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.metricsApi.replicas }}
  {{- /*
  CHAOS-4428: never dip below the current serving capacity during a rollout.
  Kubernetes' default is 25%/25%, which at replicas: 1 rounds maxUnavailable
  DOWN to 0 and happens to behave -- but only by rounding. State it, so the
  guarantee survives someone setting replicas: 4, where the default would take
  one serving pod out before its replacement is ready.
  */}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "dev-health.componentSelectorLabels" (dict "component" "metrics-api" "context" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "dev-health.componentSelectorLabels" (dict "component" "metrics-api" "context" $) | nindent 8 }}
    spec:
      {{- include "dev-health.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "dev-health.serviceAccountName" . }}
      containers:
        # CHAOS-4317/CHAOS-4351: same gap as api-deployment.yaml -- Kubernetes
        # has no per-container pids cgroup limit expressible in a Pod spec,
        # so there is no pids field to mirror ops/compose.yml's pids_limit
        # here either.
        - name: metrics-api
          image: {{ include "dev-health.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- toYaml .Values.metricsApi.args | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.metricsApi.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "dev-health.configMapName" . }}
            - secretRef:
                name: {{ include "dev-health.secretName" . }}
          {{- with .Values.metricsApi.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.metricsApi.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.metricsApi.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.metricsApi.resources | nindent 12 }}
      {{- with .Values.metricsApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metricsApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metricsApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-health.fullname" . }}-metrics-api
  namespace: {{ include "dev-health.namespace" . }}
  labels:
    {{- include "dev-health.componentLabels" (dict "component" "metrics-api" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dev-health.componentSelectorLabels" (dict "component" "metrics-api" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.metricsApi.port }}
      targetPort: http
      protocol: TCP
{{- end }}
