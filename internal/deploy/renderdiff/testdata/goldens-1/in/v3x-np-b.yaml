apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: dev-health
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ops
    app.kubernetes.io/part-of: dev-health
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: ops-0.1.0
  name: dev-health-ops
  namespace: dev-health
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector: {}
  - to:
    - podSelector: {}
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
  - ports:
    - port: 4317
      protocol: TCP
    to:
    - ipBlock:
        cidr: 10.0.0.151/32
  - ports:
    - port: 9440
      protocol: TCP
  - ports:
    - port: 80
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/component: controller
          app.kubernetes.io/name: ingress-nginx
  ingress:
  - from:
    - podSelector: {}
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: NotIn
      values:
      - go-api
      - query-api
      - auth-service
      - auth-migrate
    matchLabels:
      app.kubernetes.io/instance: dev-health
      app.kubernetes.io/name: ops
  policyTypes:
  - Ingress
  - Egress
---
