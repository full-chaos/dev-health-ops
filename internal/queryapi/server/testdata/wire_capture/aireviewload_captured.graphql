query AIReviewLoad($orgId: String!, $dateRange: AIDateRangeInput!, $scope: AIScopeInput) {
  aiReviewLoad(orgId: $orgId, dateRange: $dateRange, scope: $scope) {
    orgId
    startDate
    endDate
    dataAvailable
    byBucket {
      bucket
      prsTotal
      reviewsTotal
      reviewsPerPr
      changesRequestedPerPr
      reviewAmplification
      postFirstReviewPushesCount
      postFirstReviewPushesPerPr
      pickupLatencyHours
      reviewCommentsPerLoc
      __typename
    }
    daily {
      bucket
      prsTotal
      reviewsTotal
      reviewsPerPr
      changesRequestedPerPr
      reviewAmplification
      postFirstReviewPushesCount
      postFirstReviewPushesPerPr
      pickupLatencyHours
      reviewCommentsPerLoc
      __typename
    }
    reviewerConcentration {
      dataAvailable
      reviewerCount
      reviewerGini
      __typename
    }
    missingStates {
      key
      title
      guidance
      __typename
    }
    __typename
  }
  aiComparison(orgId: $orgId, dateRange: $dateRange, scope: $scope) {
    orgId
    startDate
    endDate
    dataAvailable
    aiSide {
      bucket
      prsTotal
      prsMerged
      cycleTimeAvgHours
      reviewsPerPr
      reworkRate
      revertRate
      testGapRate
      incidentRate
      __typename
    }
    baselineSide {
      bucket
      prsTotal
      prsMerged
      cycleTimeAvgHours
      reviewsPerPr
      reworkRate
      revertRate
      testGapRate
      incidentRate
      __typename
    }
    delta {
      cycleTimeDeltaHours
      reviewsPerPrDelta
      reworkRateDelta
      revertRateDelta
      testGapRateDelta
      incidentRateDelta
      __typename
    }
    __typename
  }
}