# CHAOS-6987 (D2724): bigboy plane-split router. Adds traefik's file provider (the routes it
# loads are GENERATED by ci/bigboy/generate-plane-split-router.py from deploy/values.prod.yaml's
# ingress.goApiPaths/queryApiPaths -- never hand-maintained) and points web's server-side
# BACKEND_URL at the router instead of straight at the Python api, so both browser-origin
# (commanderkeen.dev) and server-side traffic get the same plane split prod's own Ingress gives.
# Touches ONLY traefik and web -- go-api/query-api/api are referenced by address in the dynamic
# file (.traefik-dynamic/planes.yml) and are never recreated.
services:
  traefik:
    command: !override
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=dev-health_dev-health"
      - "--providers.docker.constraints=Label(`traefik.scope`,`dev-health`)"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:3000"
      - "--log.level=INFO"
    volumes:
      - ./.traefik-dynamic:/etc/traefik/dynamic:ro
  web:
    environment:
      BACKEND_URL: http://traefik:3000
      # D2734 (2026-09-27, CHAOS-6987): parity gap, same class as D2728 -- prod's own web block
      # sets AUTH_URL explicitly (deploy/values.prod.yaml:1015-1016, "without it web derives its
      # origin from the request URL"); this overlay never carried it. Auth.js fell back to
      # deriving the app's own origin from Node's listen bind (`http://[::]:3000`) rather than
      # the real public host -- confirmed live via the authjs.callback-url cookie Auth.js sets on
      # every session response -- so a real user's logout redirected to that literal bind address
      # instead of signing them out anywhere useful.
      AUTH_URL: https://www.commanderkeen.dev
